    <div class="side-client">

      <select id="brandPick"><option value="lucky">Lucky Golf</option></select>
    </div>
    <div class="side-scroll">
      <nav class="tabs" id="tabs">
        <div class="grp"><span class="band">Daily</span>
          <div class="grp-btns">
            <button data-t="today"><svg class="ic"><use href="#i-today"/></svg><span>Today</span></button>
            <button data-t="reorder"><svg class="ic"><use href="#i-reorder"/></svg><span>Reorder</span><b class="ct" id="ctReorder" hidden></b></button>
            <button data-t="orders"><svg class="ic"><use href="#i-orders"/></svg><span>Orders</span><b class="ct warn" id="ctOrders" hidden></b></button>
          </div>
        </div>
        <div class="grp"><span class="band">Understand</span>
          <div class="grp-btns">
            <button data-t="forecast"><svg class="ic"><use href="#i-forecast"/></svg><span>Forecast</span></button>
            <button data-t="performance"><svg class="ic"><use href="#i-performance"/></svg><span>Performance</span></button>
          </div>
        </div>
        <div class="grp"><span class="band">Next season</span>

            <button data-t="timeline"><svg class="ic"><use href="#i-timeline"/></svg><span>Timeline</span></button>
          </div>
        </div>
        <div class="grp"><span class="band">Setup</span>
          <div class="grp-btns">
            <button data-t="settings"><svg class="ic"><use href="#i-settings"/></svg><span>Settings</span></button>
          </div>
        </div>
      </nav>
    </div>
    <div class="side-foot">
      <span class="hd-chip" id="connChip" data-s="off">Connecting</span>
      <button class="hd-btn" id="btnOut" hidden>Sign out</button>
    </div>
  </aside>

  <div class="content">
    <div class="topbar">
      <button class="nav-toggle" id="navToggle" aria-label="Open navigation" aria-controls="side" aria-expanded="false">☰</button>
      <div class="hd-title" id="hdTitle"></div>
      <div class="hd-right" id="hdRight"></div>
    </div>
    <main id="main"></main>
    <footer id="foot"><b>Supply</b> by Mobius Digital · Shopify is the source of truth for stock and sales; Supply decides what to make, how much, and by when. Asana holds the work, Lineup holds the launch.</footer>
  </div>
</div>
