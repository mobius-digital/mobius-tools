# The engine: one new worker that answers the new screens. It reads and writes the SAME database the
# two old workers use and reaches them through service bindings. It holds no secrets and runs no timed
# jobs. The old workers stay deployed and untouched. Deploying this is the owner's step.
name = "locus-engine"
main = "src/app.js"
compatibility_date = "2026-07-01"

# The shared database. Same name and id as in account-health/worker/wrangler.toml.
[[d1_databases]]
binding = "DB"
database_name = "mobius-account-health"
database_id = "93e7cdeb-19a9-4950-8146-e24b189f410f"

# The calendar database, same file. Only production/ uses it.
[[d1_databases]]
binding = "CAL"
database_name = "marketing-hub"
database_id = "e8bd83a8-100e-44ed-a639-2c3415f90e41"

# The two old workers. platform/legacy.js is the only file that uses these.
[[services]]
binding = "OLD_AH"
service = "mobius-account-health"

[[services]]
binding = "OLD_PW"
service = "mobius-profit"

[vars]
# The old workers' public addresses, used to build the forwarded URL (the old side makes links from it).
OLD_AH_ORIGIN = "https://mobius-account-health.mobius-digital.workers.dev"
OLD_PW_ORIGIN = "https://mobius-profit.mobius-digital.workers.dev"

[observability]
enabled = true
