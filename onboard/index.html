<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Onboarding · Mobius Digital</title>
<link rel="icon" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* The client's onboarding form. One link per brand (?t=<token>), no login.
   Questions come from questions.js, shared with Locus's Brand tab. */
:root{
  --bg:#F3F1FA; --surface:#FFFFFF; --ink:#16131F; --ink-2:#433C55; --muted:#6D6680;
  --line:#E3DEEF; --line-strong:#CBC3DE; --acc:#5B3FB0; --acc-ink:#FFFFFF; --acc-soft:#EDE8FA;
  --good:#1C7A46; --good-bg:#E4F2E9; --warn:#8F6412; --warn-bg:#F8EED6; --bad:#9C3A2E;
  --sans:'Instrument Sans',system-ui,-apple-system,Segoe UI,sans-serif; --serif:'Instrument Serif',Georgia,serif;
}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#14111C;--surface:#1D1928;--ink:#EDEAF5;--ink-2:#C4BDD6;--muted:#9890AD;--line:#2E2940;--line-strong:#40395A;--acc:#9C84EC;--acc-ink:#14111C;--acc-soft:#2A2340;--good:#5FD292;--good-bg:#15301F;--warn:#EBBF63;--warn-bg:#33280F;--bad:#F09182}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header{padding:28px 0 10px}
.brand{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,6vw,42px);line-height:1.08;margin:6px 0 6px;text-wrap:balance}
.lede{color:var(--ink-2);margin:0;max-width:60ch}
.prog{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.prog .bars{display:flex;gap:4px}
.prog .bars button{flex:1;height:6px;border-radius:3px;border:0;background:var(--line);padding:0}
.prog .bars button.done{background:var(--acc)}
.prog .bars button.on{background:var(--acc);opacity:.55}
.prog .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12.5px;color:var(--muted);gap:10px}
.saved{font-weight:600}
.saved.ok{color:var(--good)}.saved.bad{color:var(--bad)}
.step h2{font-family:var(--serif);font-weight:400;font-size:30px;margin:22px 0 4px}
.step .intro{color:var(--ink-2);margin:0 0 18px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.q label.l{display:block;font-weight:600;font-size:14.5px}
.q .why{font-size:12.5px;color:var(--muted);margin-top:3px}
.q .help{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.in{display:block;width:100%;margin-top:10px;border:1px solid var(--line-strong);border-radius:9px;padding:10px 12px;font-size:15px;background:var(--surface)}
.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.in{min-height:90px;resize:vertical}
.money{display:flex;align-items:center;gap:0;margin-top:10px;max-width:260px}
.money span{border:1px solid var(--line-strong);border-right:0;border-radius:9px 0 0 9px;padding:10px 12px;background:var(--acc-soft);color:var(--ink-2)}
.money .in{margin:0;border-radius:0 9px 9px 0}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.unsure{font-size:12.5px;color:var(--muted);background:none;border:0;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
.unsure.on{color:var(--warn);font-weight:600}
.sug{margin-top:10px;background:var(--acc-soft);border-radius:9px;padding:10px 12px;font-size:13.5px}
.sug b{color:var(--acc)}
.sug button{margin-top:6px}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:9px 16px;font-weight:600;font-size:14px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn:focus-visible,.unsure:focus-visible,.prog button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.list{margin-top:10px;display:flex;flex-direction:column;gap:10px}
.lrow{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;position:relative}
.lrow .in{margin-top:3px;font-size:14px;padding:8px 10px}
.lrow small{font-size:11.5px;color:var(--muted);font-weight:600}
.lrow .x{position:absolute;top:6px;right:8px;border:0;background:none;color:var(--muted);font-size:18px;line-height:1}
.yn{display:flex;gap:6px;margin-top:10px}
.yn button{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:6px 16px;font-weight:600}
.yn button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:4px}
.check input{width:20px;height:20px;accent-color:var(--acc);margin-top:2px;flex:none}
.calc{margin-top:10px;background:var(--acc-soft);border-radius:9px;padding:10px 12px;font-size:14px}
.calc b{font-size:20px;color:var(--acc)}
.files{margin-top:8px;font-size:13.5px}
.nav{display:flex;justify-content:space-between;gap:10px;margin:22px 0 10px}
.helpbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin:22px 0}
.helpbox h3{margin:0 0 4px;font-size:15px}
.helpbox .ans{margin-top:10px;font-size:14px;white-space:pre-wrap;background:var(--acc-soft);border-radius:9px;padding:10px 12px}
.helpbox .row{display:flex;gap:8px;margin-top:10px}
.helpbox .row .in{margin:0}
.center{text-align:center;padding:60px 0}
.center h1{margin-bottom:10px}
.note{font-size:12.5px;color:var(--muted)}
@media (max-width:520px){.lrow{grid-template-columns:1fr}.nav .btn{flex:1}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center"><p class="note">Loading your form…</p></div></div>
<script src="questions.js?v=1"></script>
<script>
'use strict';
(function () {
const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const API = (LOCAL && new URLSearchParams(location.search).get('api')) || 'https://mobius-profit.mobius-digital.workers.dev';
const AH = 'https://mobius-account-health.mobius-digital.workers.dev';
const TOKEN = (new URLSearchParams(location.search).get('t') || '').replace(/[^a-f0-9]/g, '');
const { STEPS, calc } = window.MOBIUS_ONBOARD;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 2 }).format(n);

const St = { brand: '', answers: {}, prefill: {}, step: 0, status: '', dirty: {}, saving: false, done: false };

async function boot() {
  if (!TOKEN) return fatal('This link is missing its code. Ask your Mobius contact for your onboarding link.');
  try {
    const r = await fetch(`${API}/api/onboard/${TOKEN}`);
    const j = await r.json();
    if (!r.ok) return fatal(j.error || 'This link is not valid.');
    Object.assign(St, { brand: j.brand, answers: j.answers || {}, prefill: j.prefill || {}, step: Math.min(j.step || 0, STEPS.length), status: j.status });
    document.title = `${j.brand} onboarding · Mobius Digital`;
    if (St.status === 'submitted' && St.step >= STEPS.length) St.done = true;
    paint();
  } catch { fatal('Could not reach the form. Check your connection and refresh.'); }
}
function fatal(msg) { $('#app').innerHTML = `<div class="center"><h1>Hmm.</h1><p class="lede" style="margin:0 auto">${esc(msg)}</p></div>`; }

/* ---------- saving: debounced, per field ---------- */
let saveT = null;
function setAnswer(id, v) {
  if (v === '' || v == null || (Array.isArray(v) && !v.length)) { delete St.answers[id]; St.dirty[id] = null; }
  else { St.answers[id] = v; St.dirty[id] = v; }
  status('Saving…');
  clearTimeout(saveT); saveT = setTimeout(flush, 700);
  if (id === 'aov' || id === 'cogs' || id === 'ship_cost') paintCalc();
}
async function flush(extra = {}) {
  clearTimeout(saveT);
  const patch = St.dirty; St.dirty = {};
  try {
    const r = await fetch(`${API}/api/onboard/${TOKEN}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ answers: patch, step: St.step, ...extra }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Could not save');
    status('Saved', 'ok');
    return true;
  } catch (e) { St.dirty = { ...patch, ...St.dirty }; status(e.message + '. Retrying…', 'bad'); saveT = setTimeout(flush, 4000); return false; }
}
function status(t, cls = '') { const el = $('#saved'); if (el) { el.textContent = t; el.className = 'saved ' + cls; } }

/* ---------- fields ---------- */
function fieldHtml(f) {
  const v = St.answers[f.id];
  const unsure = v === '__unsure';
  const sug = (v == null || v === '') && St.prefill[f.id] != null ? St.prefill[f.id] : null;
  let body = '';
  const val = unsure ? '' : v;
  if (f.calc) body = `<div class="calc" id="calc_${f.id}"></div>`;
  else if (f.type === 'long') body = `<textarea class="in" id="f_${f.id}" rows="4">${esc(val ?? '')}</textarea>`;
  else if (f.type === 'money') body = `<div class="money"><span>$</span><input class="in" id="f_${f.id}" inputmode="decimal" value="${esc(val ?? '')}"></div>`;
  else if (f.type === 'yesno') body = `<div class="yn" id="f_${f.id}"><button type="button" data-yn="yes" class="${val === 'yes' ? 'on' : ''}">Yes</button><button type="button" data-yn="no" class="${val === 'no' ? 'on' : ''}">No</button></div>`;
  else if (f.type === 'check') body = `<div class="check"><input type="checkbox" id="f_${f.id}" ${val === true ? 'checked' : ''}><span class="help">${esc(f.help || '')}</span></div>`;
  else if (f.type === 'list') body = `<div class="list" id="f_${f.id}"></div><button type="button" class="btn sm" data-add="${f.id}" style="margin-top:8px">+ Add a row</button>`;
  else if (f.type === 'file') body = `<div class="files" id="files_${f.id}"></div><input type="file" id="f_${f.id}" class="in" style="padding:8px">`;
  else body = `<input class="in" id="f_${f.id}" type="${f.type === 'email' ? 'email' : f.type === 'url' ? 'url' : 'text'}" value="${esc(val ?? '')}" ${f.type === 'number' ? 'inputmode="numeric"' : ''}>`;
  const sugText = sug == null ? '' : Array.isArray(sug) ? sug.map(r => Object.values(r).filter(Boolean).join(' · ')).join('\n') : String(sug);
  return `<div class="q" data-q="${f.id}">
    <label class="l" for="f_${f.id}">${esc(f.label)}</label>
    ${f.why ? `<div class="why">Why we ask: ${esc(f.why)}</div>` : ''}${f.help && f.type !== 'check' ? `<div class="help">${esc(f.help)}</div>` : ''}
    ${body}
    ${sug != null ? `<div class="sug"><b>From your website:</b> <span style="white-space:pre-wrap">${esc(sugText)}</span><br><button type="button" class="btn sm" data-use="${f.id}">Use this</button></div>` : ''}
    ${f.calc || f.type === 'check' ? '' : `<div class="foot"><span></span><button type="button" class="unsure ${unsure ? 'on' : ''}" data-unsure="${f.id}">${unsure ? 'Marked "not sure". Tap to undo.' : "I'm not sure"}</button></div>`}
  </div>`;
}
function listRows(f) {
  const el = document.getElementById('f_' + f.id); if (!el) return;
  let rows = Array.isArray(St.answers[f.id]) ? St.answers[f.id] : null;
  if (!rows) rows = f.seed ? f.seed.map(r => ({ ...r })) : [{}];
  el.innerHTML = rows.map((r, i) => `<div class="lrow">${f.cols.map(([k, l, t]) => `<label><small>${esc(l)}</small>${t === 'yesno'
    ? `<select class="in" data-r="${i}" data-k="${k}"><option value=""></option><option value="yes" ${r[k] === 'yes' ? 'selected' : ''}>Yes</option><option value="no" ${r[k] === 'no' ? 'selected' : ''}>No</option></select>`
    : `<input class="in" data-r="${i}" data-k="${k}" value="${esc(r[k] ?? '')}" ${t === 'money' || t === 'number' ? 'inputmode="decimal"' : ''}>`}</label>`).join('')}
    ${rows.length > 1 ? `<button type="button" class="x" data-del="${i}" aria-label="Remove row">×</button>` : ''}</div>`).join('');
  const commit = () => {
    const out = rows.map(r => ({ ...r }));
    el.querySelectorAll('[data-r]').forEach(inp => { out[+inp.dataset.r][inp.dataset.k] = inp.value.trim(); });
    rows = out;
    /* Seeded labels ("Instagram") are not an answer until something is typed beside them. */
    const typed = out.some((r, i) => f.cols.some(([k]) => r[k] && r[k] !== (f.seed?.[i]?.[k] ?? '')));
    setAnswer(f.id, typed ? out : '');
  };
  el.querySelectorAll('[data-r]').forEach(inp => { inp.oninput = commit; inp.onchange = commit; });
  el.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { rows.splice(+b.dataset.del, 1); St.answers[f.id] = rows; setAnswer(f.id, rows); listRows(f); });
  el._add = () => { commit(); rows.push({}); St.answers[f.id] = rows; listRows(f); };
}
function paintFiles(f) {
  const el = document.getElementById('files_' + f.id); if (!el) return;
  const list = Array.isArray(St.answers[f.id]) ? St.answers[f.id] : [];
  el.innerHTML = list.map((x, i) => `<div>📎 ${esc(x.name)} <button type="button" class="unsure" data-rmf="${i}">remove</button></div>`).join('');
  el.querySelectorAll('[data-rmf]').forEach(b => b.onclick = () => { list.splice(+b.dataset.rmf, 1); setAnswer(f.id, list.slice()); paintFiles(f); });
}
function paintCalc() {
  const el = document.getElementById('calc_breakeven'); if (!el) return;
  const v = calc('breakeven', St.answers);
  el.innerHTML = v == null ? 'Fill in the average order and its cost above and we work this out.' : `<b>${money(v)}</b><br><span class="note">The most we can pay to win a sale and still break even on the first order. Nothing to fill in.</span>`;
}

/* ---------- screens ---------- */
function paint() {
  if (St.done) return paintDone();
  if (St.step >= STEPS.length) return paintReview();
  const s = STEPS[St.step];
  $('#app').innerHTML = `
    <header><div class="brand">Mobius Digital · ${esc(St.brand)}</div>
      ${St.step === 0 ? `<h1>Welcome aboard.</h1><p class="lede">This is everything we need to start. ${STEPS.length} short steps, and it saves as you go, so you can stop and come back to this same link any time. Rough answers are fine, and "I'm not sure" is always an option: we do the deeper research on our side.</p>` : ''}</header>
    ${progress()}
    <section class="step"><h2>${esc(s.title)}</h2><p class="intro">${esc(s.intro)}</p>
      ${s.fields.map(fieldHtml).join('')}</section>
    <div class="helpbox"><h3>Stuck on a question?</h3><p class="note" style="margin:0">Ask anything about this step and get an answer right away.</p>
      <div class="row"><input class="in" id="hq" placeholder="What do you mean by landed cost?"><button class="btn" id="hgo">Ask</button></div><div id="hans"></div></div>
    <div class="nav"><button class="btn" id="back" ${St.step === 0 ? 'style="visibility:hidden"' : ''}>Back</button><button class="btn pri" id="next">${St.step === STEPS.length - 1 ? 'Review and send' : 'Next'}</button></div>
    <p class="note" style="margin-bottom:40px">Never type a password here. For access, the last step shows you how to invite us from inside each platform.</p>`;
  wire(s);
  window.scrollTo(0, 0);
}
function progress() {
  const answered = sid => STEPS[sid].fields.some(f => St.answers[f.id] != null && St.answers[f.id] !== '');
  return `<div class="prog"><div class="bars">${STEPS.map((s, i) => `<button title="${esc(s.title)}" aria-label="Go to ${esc(s.title)}" data-go="${i}" class="${i === St.step ? 'on' : answered(i) ? 'done' : ''}"></button>`).join('')}</div>
    <div class="row"><span>Step ${Math.min(St.step + 1, STEPS.length)} of ${STEPS.length}${St.step < STEPS.length ? ' · ' + esc(STEPS[St.step].title) : ''}</span><span class="saved" id="saved"></span></div></div>`;
}
function wire(s) {
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(+b.dataset.go));
  for (const f of s.fields) {
    const el = document.getElementById('f_' + f.id);
    if (f.calc) { paintCalc(); continue; }
    if (f.type === 'list') { listRows(f); continue; }
    if (f.type === 'yesno') { el.querySelectorAll('[data-yn]').forEach(b => b.onclick = () => { el.querySelectorAll('[data-yn]').forEach(x => x.classList.toggle('on', x === b)); setAnswer(f.id, b.dataset.yn); }); continue; }
    if (f.type === 'check') { el.onchange = () => setAnswer(f.id, el.checked ? true : ''); continue; }
    if (f.type === 'file') { paintFiles(f); el.onchange = () => upload(f, el); continue; }
    el.oninput = () => setAnswer(f.id, f.type === 'money' ? el.value.replace(/[^0-9.]/g, '') : el.value.trim());
  }
  document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => document.getElementById('f_' + b.dataset.add)._add());
  document.querySelectorAll('[data-unsure]').forEach(b => b.onclick = () => {
    const id = b.dataset.unsure;
    setAnswer(id, St.answers[id] === '__unsure' ? '' : '__unsure');
    const f = s.fields.find(x => x.id === id); const q = b.closest('.q'); q.outerHTML = fieldHtml(f); wire({ fields: [f] }); rewireCommon(s);
  });
  document.querySelectorAll('[data-use]').forEach(b => b.onclick = () => {
    const id = b.dataset.use; const f = s.fields.find(x => x.id === id);
    let v = St.prefill[id];
    if (f.type === 'money') v = String(v).replace(/[^0-9.]/g, '');
    setAnswer(id, v);
    const q = b.closest('.q'); q.outerHTML = fieldHtml(f); wire({ fields: [f] }); rewireCommon(s);
  });
  rewireCommon(s);
}
function rewireCommon(s) {
  const back = $('#back'), next = $('#next'), hgo = $('#hgo');
  if (back) back.onclick = () => go(St.step - 1);
  if (next) next.onclick = () => go(St.step + 1);
  if (hgo) hgo.onclick = () => ask(s);
  const hq = $('#hq'); if (hq) hq.onkeydown = e => { if (e.key === 'Enter') ask(s); };
}
async function go(n) {
  St.step = Math.max(0, Math.min(STEPS.length, n));
  await flush();
  paint();
}
async function ask(s) {
  const q = $('#hq').value.trim(); if (!q) return;
  const out = $('#hans'); out.innerHTML = '<div class="ans">Thinking…</div>';
  try {
    const r = await fetch(`${AH}/api/onboard-help`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: TOKEN, question: q, step: s.title, fields: s.fields.map(f => `- ${f.label}${f.help ? ' (' + f.help + ')' : ''}`).join('\n') }) });
    const j = await r.json();
    out.innerHTML = `<div class="ans">${esc(j.answer || j.error || 'No answer came back. Ask your Mobius contact.')}</div>`;
  } catch { out.innerHTML = '<div class="ans">The helper is not reachable right now. Your Mobius contact can answer this.</div>'; }
}
async function upload(f, el) {
  const file = el.files[0]; if (!file) return;
  if (file.size > 95 * 1024 * 1024) { status('That file is over 95MB. Send a link in the notes instead.', 'bad'); return; }
  status(`Uploading ${file.name}…`);
  try {
    const r = await fetch(`${API}/api/onboard/${TOKEN}/file?field=${f.id}&name=${encodeURIComponent(file.name)}`, { method: 'POST', headers: { 'Content-Type': file.type || 'application/octet-stream' }, body: file });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Upload failed');
    const list = Array.isArray(St.answers[f.id]) ? St.answers[f.id].slice() : [];
    list.push(j.file); setAnswer(f.id, list); paintFiles(f); el.value = '';
  } catch (e) { status(e.message, 'bad'); }
}
function paintReview() {
  const missing = STEPS.map((s, i) => ({ s, i, n: s.fields.filter(f => !f.calc && f.type !== 'check' && (St.answers[f.id] == null || St.answers[f.id] === '')).length }));
  $('#app').innerHTML = `<header><div class="brand">Mobius Digital · ${esc(St.brand)}</div><h1>Nearly there.</h1><p class="lede">Anything left blank is fine: we will research it or ask on our kickoff call. You can come back to this link and change answers after sending, too.</p></header>
    ${progress()}
    <section class="step">${missing.map(m => `<div class="q" style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><b>${esc(m.s.title)}</b><div class="why">${m.n ? `${m.n} left blank` : 'All answered'}</div></div><button class="btn sm" data-go="${m.i}">${m.n ? 'Fill in' : 'Review'}</button></div>`).join('')}</section>
    <div class="nav"><button class="btn" id="back">Back</button><button class="btn pri" id="send">Send to Mobius</button></div>`;
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(+b.dataset.go));
  $('#back').onclick = () => go(STEPS.length - 1);
  $('#send').onclick = async () => { $('#send').disabled = true; if (await flush({ submit: true })) { St.done = true; paint(); } else $('#send').disabled = false; };
}
function paintDone() {
  $('#app').innerHTML = `<div class="center"><div class="brand">Mobius Digital · ${esc(St.brand)}</div><h1>Thank you. We have it.</h1><p class="lede" style="margin:0 auto">Your answers are with the team. We start the research now and will be in touch about the kickoff. You can reopen this link any time to add or change something.</p>
    <p style="margin-top:22px"><button class="btn" id="again">Edit my answers</button></p></div>`;
  $('#again').onclick = () => { St.done = false; St.step = 0; paint(); };
}
window.addEventListener('beforeunload', e => { if (Object.keys(St.dirty).length) { flush(); e.preventDefault(); e.returnValue = ''; } });
boot();
})();
</script>
