<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Find your voice · Mobius Digital</title>
<link rel="icon" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* The brand voice interview. Same link code as the onboarding form (?t=<token>),
   no login. The AI lives on the account-health worker (voice.js). The client
   talks, the AI asks follow-ups, then writes sample lines they rate. */
:root{
  --bg:#F3F1FA; --surface:#FFFFFF; --ink:#16131F; --ink-2:#433C55; --muted:#6D6680;
  --line:#E3DEEF; --line-strong:#CBC3DE; --acc:#5B3FB0; --acc-ink:#FFFFFF; --acc-soft:#EDE8FA;
  --good:#1C7A46; --good-bg:#E4F2E9; --warn:#8F6412; --warn-bg:#F8EED6; --bad:#9C3A2E; --bad-bg:#F7E4E1;
  --sans:'Instrument Sans',system-ui,-apple-system,Segoe UI,sans-serif; --serif:'Instrument Serif',Georgia,serif;
}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#14111C;--surface:#1D1928;--ink:#EDEAF5;--ink-2:#C4BDD6;--muted:#9890AD;--line:#2E2940;--line-strong:#40395A;--acc:#9C84EC;--acc-ink:#14111C;--acc-soft:#2A2340;--good:#5FD292;--good-bg:#15301F;--warn:#EBBF63;--warn-bg:#33280F;--bad:#F09182;--bad-bg:#3A1C18}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:default}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 60px}
header{padding:28px 0 8px}
.brand{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,6vw,42px);line-height:1.08;margin:6px 0 6px;text-wrap:balance}
.lede{color:var(--ink-2);margin:0;max-width:60ch}
.note{font-size:12.5px;color:var(--muted)}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:9px 16px;font-weight:600;font-size:14px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.sm{padding:5px 11px;font-size:12.5px}
.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.prog{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line);margin-bottom:18px}
.topics{display:flex;flex-wrap:wrap;gap:5px}
.topics span{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.topics span.on{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.topics span.now{border-color:var(--ink-2);color:var(--ink)}
.past{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.past details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.past summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.past p{margin:8px 0 0;white-space:pre-wrap;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.ack{color:var(--ink-2);font-size:14px;margin:0 0 6px}
.q{font-family:var(--serif);font-size:clamp(24px,4.6vw,30px);line-height:1.2;margin:0 0 14px;text-wrap:pretty}
textarea.in{display:block;width:100%;min-height:150px;border:1px solid var(--line-strong);border-radius:10px;padding:12px;font-size:15.5px;background:var(--surface);resize:vertical;line-height:1.5}
textarea.in:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.bar .sp{flex:1}
.mic{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--acc);background:var(--acc-soft);color:var(--acc);border-radius:99px;padding:9px 16px;font-weight:700}
.mic .dot{width:10px;height:10px;border-radius:50%;background:var(--acc)}
.mic.on{background:var(--acc);color:var(--acc-ink)}
.mic.on .dot{background:var(--acc-ink);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.mic.on .dot{animation:none}}
.busy{margin-top:12px;font-size:13.5px;color:var(--muted)}
.err{margin-top:10px;font-size:13.5px;color:var(--bad)}
.samples{display:flex;flex-direction:column;gap:12px}
.s .fmt{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.s .txt{font-size:16px;margin:6px 0 12px;white-space:pre-wrap}
.rate{display:flex;gap:6px;flex-wrap:wrap}
.rate button{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:600;font-size:13.5px}
.rate button.on[data-r=yes]{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.rate button.on[data-r=close]{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.rate button.on[data-r=no]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.why{margin-top:10px}
.why textarea.in{min-height:70px;font-size:14.5px}
.center{text-align:center;padding:60px 0}
@media (max-width:520px){.bar .btn,.bar .mic{flex:1;justify-content:center}.bar .sp{display:none}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center"><p class="note">Loading…</p></div></div>
<script>
'use strict';
(function () {
const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const AH = (LOCAL && new URLSearchParams(location.search).get('ah')) || 'https://mobius-account-health.mobius-digital.workers.dev';
const TOKEN = (new URLSearchParams(location.search).get('t') || '').replace(/[^a-f0-9]/g, '');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DRAFT = 'mv_draft_' + TOKEN;
const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;

let St = null, busy = '', err = '', rec = null, listening = false;

/* ---------- api ---------- */
async function call(path, body) {
  const r = await fetch(AH + path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: TOKEN, ...body }) } : undefined);
  if ((r.headers.get('Content-Type') || '').includes('ndjson')) return readStream(r);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Something went wrong. Try again.');
  return j;
}
/* Slow writes stream a ping every 10s; the last line is the result. */
async function readStream(r) {
  const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '', last = null;
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n')) >= 0) {
      const ln = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (!ln) continue;
      try { const o = JSON.parse(ln); if (o.type !== 'ping') last = o; } catch {}
    }
  }
  if (!last) throw new Error('The connection dropped. Try again.');
  if (last.type === 'error') throw new Error(last.text);
  return last;
}
async function act(label, fn) {
  busy = label; err = ''; paint();
  try { const s = await fn(); if (s && s.stage) St = s; }
  catch (e) { err = e.message; }
  busy = ''; paint();
}

async function boot() {
  if (!TOKEN) return fatal('This link is missing its code. Ask your Mobius contact for your link.');
  try { St = await call(`/api/voice/state?t=${TOKEN}`); document.title = `${St.brand}: find your voice · Mobius Digital`; paint(); }
  catch (e) { fatal(e.message); }
}
function fatal(m) { $('#app').innerHTML = `<div class="center"><h1>Hmm.</h1><p class="lede" style="margin:0 auto">${esc(m)}</p></div>`; }

/* ---------- talking: the browser's speech to text ---------- */
function startMic() {
  if (!Rec) return;
  const ta = $('#ans');
  rec = new Rec(); rec.continuous = true; rec.interimResults = true; rec.lang = navigator.language || 'en-US';
  const base = ta.value ? ta.value.replace(/\s*$/, ' ') : '';
  let finalText = '';
  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalText += t.trim() + ' '; else interim += t;
    }
    ta.value = base + finalText + interim;
    saveDraft();
  };
  rec.onend = () => { if (listening) { try { rec.start(); } catch { stopMic(); } } };
  rec.onerror = e => { if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { err = 'The browser blocked the microphone. Allow it in the address bar, or use the mic on your keyboard.'; stopMic(); paint(); } };
  listening = true;
  try { rec.start(); } catch {}
  micBtn();
}
function stopMic() { listening = false; try { rec?.stop(); } catch {} rec = null; micBtn(); }
function micBtn() {
  const b = $('#mic'); if (!b) return;
  b.classList.toggle('on', listening);
  b.innerHTML = `<span class="dot"></span>${listening ? 'Listening. Tap to stop' : 'Tap and talk'}`;
}
function saveDraft() { try { const t = $('#ans'); if (t) localStorage.setItem(DRAFT, t.value); } catch {} }
function loadDraft() { try { return localStorage.getItem(DRAFT) || ''; } catch { return ''; } }
function clearDraft() { try { localStorage.removeItem(DRAFT); } catch {} }

/* ---------- screens ---------- */
function paint() {
  if (!St) return;
  if (St.stage === 'done') return paintDone();
  if (St.stage === 'samples') return paintSamples();
  paintInterview();
}
function head(first) {
  return `<header><div class="brand">Mobius Digital · ${esc(St.brand)}</div>
    ${first ? `<h1>Help us find your voice.</h1><p class="lede">We ask one question at a time. Just talk: tap the button and say it the way you would say it to a friend. Rambling is good, polished is not. About 20 minutes, it saves as you go, and you can stop and come back to this link any time.</p>` : ''}</header>`;
}
function topicsBar() {
  const cur = St.next?.topic;
  return `<div class="prog"><div class="topics">${St.topics.map(t => `<span class="${St.covered.includes(t.id) ? 'on' : ''} ${t.id === cur ? 'now' : ''}">${esc(t.label)}</span>`).join('')}</div>
    <div class="note" style="margin-top:6px">${St.covered.length} of ${St.topics.length} covered</div></div>`;
}
function paintInterview() {
  if (listening) stopMic();
  const first = !St.turns.length;
  const done = St.next?.topic === 'done';
  $('#app').innerHTML = `${head(first)}${topicsBar()}
    ${St.turns.length ? `<div class="past"><details><summary>Your answers so far (${St.turns.length})</summary>${St.turns.map(t => `<p><b>${esc(t.q)}</b>\n${esc(t.a || 'Skipped')}</p>`).join('')}</details></div>` : ''}
    <div class="card">
      ${St.next?.ack ? `<p class="ack">${esc(St.next.ack)}</p>` : ''}
      <p class="q">${esc(St.next?.q || '')}</p>
      ${done ? '' : `<textarea class="in" id="ans" placeholder="${Rec ? 'Tap and talk, or type here.' : 'Type here, or tap the microphone on your keyboard to talk.'}"></textarea>
      <div class="bar">
        ${Rec ? `<button class="mic" id="mic" type="button"></button>` : ''}
        <span class="sp"></span>
        <button class="btn" id="skip" type="button" ${busy ? 'disabled' : ''}>Skip this one</button>
        <button class="btn pri" id="send" type="button" ${busy ? 'disabled' : ''}>Next question</button>
      </div>`}
      ${busy ? `<div class="busy">${esc(busy)}</div>` : ''}${err ? `<div class="err">${esc(err)}</div>` : ''}
    </div>
    ${St.can_sample || done ? `<div class="card" style="margin-top:14px"><b>${done ? 'That covers it.' : 'Seen enough of you to try?'}</b><p class="note" style="margin:4px 0 10px">We write a handful of sample lines (an ad, an email subject, a caption and so on) and you tell us which ones sound like you.</p><button class="btn ${done ? 'pri' : ''}" id="toSamples" ${busy ? 'disabled' : ''}>Show me sample lines</button></div>` : ''}`;
  const ta = $('#ans');
  if (ta) { ta.value = loadDraft(); ta.oninput = saveDraft; }
  if ($('#mic')) { micBtn(); $('#mic').onclick = () => listening ? stopMic() : startMic(); }
  if ($('#send')) $('#send').onclick = () => {
    const a = ($('#ans').value || '').trim();
    if (!a) { err = 'Say or type something first, or skip this one.'; return paint(); }
    stopMic();
    act('Thinking about that…', async () => { const s = await call('/api/voice/answer', { answer: a }); clearDraft(); return s; });
  };
  if ($('#skip')) $('#skip').onclick = () => { stopMic(); act('Finding a better question…', async () => { const s = await call('/api/voice/answer', { skip: true }); clearDraft(); return s; }); };
  if ($('#toSamples')) $('#toSamples').onclick = () => { stopMic(); act('Writing your sample lines. This takes about a minute…', () => call('/api/voice/samples', {})); };
}
function paintSamples() {
  const rated = St.samples.filter(s => s.rating).length;
  $('#app').innerHTML = `${head(false)}
    <h1 style="font-size:32px">Does this sound like you?</h1>
    <p class="lede">Round ${St.round}. Rate each line. When it is close or wrong, tap the mic and say it the way YOU would say it. That is the most useful thing you can give us.</p>
    <div class="samples" style="margin-top:18px">${St.samples.map(s => `<div class="card s" data-id="${esc(s.id)}">
      <div class="fmt">${esc(s.format)}</div><div class="txt">${esc(s.text)}</div>
      <div class="rate">${[['yes', 'Sounds like us'], ['close', 'Close'], ['no', 'Not us']].map(([r, l]) => `<button type="button" data-r="${r}" class="${s.rating === r ? 'on' : ''}">${l}</button>`).join('')}</div>
      ${s.rating && s.rating !== 'yes' ? `<div class="why"><textarea class="in" data-why placeholder="How would you say it? Just say it, the way it comes out. (Or what is off.)">${esc(s.why || '')}</textarea>
        <div class="bar">${Rec ? `<button class="mic" type="button" data-mic><span class="dot"></span>Tap and talk</button>` : ''}<span class="sp"></span><button class="btn sm" type="button" data-savewhy>Save note</button></div></div>` : ''}
    </div>`).join('')}</div>
    <div class="card" style="margin-top:14px">
      <b>${rated} of ${St.samples.length} rated</b>
      <p class="note" style="margin:4px 0 12px">Another round learns from your ratings. When most lines sound like you, press Finish and we write your brand's writing guide.</p>
      <div class="bar"><button class="btn" id="back" ${busy ? 'disabled' : ''}>Keep talking</button><span class="sp"></span>
        <button class="btn" id="again" ${busy || St.round >= 6 ? 'disabled' : ''}>Write another round</button>
        <button class="btn pri" id="finish" ${busy ? 'disabled' : ''}>Finish</button></div>
      ${busy ? `<div class="busy">${esc(busy)}</div>` : ''}${err ? `<div class="err">${esc(err)}</div>` : ''}
    </div>`;
  document.querySelectorAll('.s').forEach(card => {
    const id = card.dataset.id;
    card.querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
      const s = St.samples.find(x => x.id === id);
      const r = s.rating === b.dataset.r ? null : b.dataset.r;
      s.rating = r; paint();
      call('/api/voice/rate', { id, rating: r, why: s.why || '' }).catch(e => { err = e.message; paint(); });
    });
    const why = card.querySelector('[data-why]');
    if (why) {
      const save = () => { const s = St.samples.find(x => x.id === id); s.why = why.value.trim(); call('/api/voice/rate', { id, rating: s.rating, why: s.why }).catch(() => {}); };
      card.querySelector('[data-savewhy]').onclick = e => { save(); e.target.textContent = 'Saved'; };
      why.onblur = save;
      const m = card.querySelector('[data-mic]');
      if (m) m.onclick = () => {
        if (m._rec) { m._rec.stop(); m._rec = null; m.classList.remove('on'); m.innerHTML = '<span class="dot"></span>Tap and talk'; save(); return; }
        const r = new Rec(); r.continuous = true; r.interimResults = true; r.lang = navigator.language || 'en-US';
        const base = why.value ? why.value.replace(/\s*$/, ' ') : ''; let fin = '';
        r.onresult = e => { let int = ''; for (let i = e.resultIndex; i < e.results.length; i++) { const t = e.results[i][0].transcript; if (e.results[i].isFinal) fin += t.trim() + ' '; else int += t; } why.value = base + fin + int; };
        r.start(); m._rec = r; m.classList.add('on'); m.innerHTML = '<span class="dot"></span>Listening. Tap to stop';
      };
    }
  });
  $('#back').onclick = () => act('One moment…', () => call('/api/voice/back', {}));
  $('#again').onclick = () => act('Writing a new round from your ratings. About a minute…', () => call('/api/voice/samples', {}));
  $('#finish').onclick = () => act('Writing your brand guide. This can take two minutes, keep this page open…', () => call('/api/voice/finish', {}));
}
function paintDone() {
  $('#app').innerHTML = `<div class="center"><div class="brand">Mobius Digital · ${esc(St.brand)}</div><h1>That is your voice. Thank you.</h1>
    <p class="lede" style="margin:0 auto">We turn this into your writing guide, and every line we write from here on is checked against it. When you approve or reject a line later, that teaches it too.</p></div>`;
}
window.addEventListener('beforeunload', saveDraft);
boot();
})();
</script>
</body>
</html>
