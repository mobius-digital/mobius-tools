<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobius Restock — Inventory Forecast</title>
<meta name="description" content="Mobius Restock — inventory forecasting and reorder alerts for Shopify. Weighted sell-through velocity, lead-time aware, by Mobius Digital.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F8FA; --surface:#FFFFFF;
    --ink:#13202B; --ink-2:#3A4B58; --muted:#647684;
    --line:#DFE7EC; --line-strong:#C4D2DB;
    --brand:#62BDEA; --brand-ink:#14608C; --brand-soft:#E7F3FA;
    --hd:#0C161D; --hd-line:#1D2C38;
    --good:#1C7A46; --good-bg:#E4F2E9;
    --warn:#8F6412; --warn-bg:#F8EED6;
    --bad:#9C3A2E;  --bad-bg:#F7E7E4;
    --unk:#647684;  --unk-bg:#EDF1F4;
    --radius:12px;
    --sans:'Instrument Sans',system-ui,sans-serif;
    --serif:'Instrument Serif',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;font-feature-settings:"tnum" 1}
  button{font:inherit;cursor:pointer;color:inherit;background:none;border:none}
  input,select{font:inherit;color:var(--ink)}
  ::placeholder{color:#8195A2}
  a{color:var(--brand-ink)}

  /* ---------- Header ---------- */
  header{position:sticky;top:0;z-index:20;background:var(--hd);color:#DFEAF2}
  .hd{display:flex;align-items:center;gap:16px;padding:12px 26px;flex-wrap:wrap;max-width:1200px;margin:0 auto}
  .mark{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
  .mark img{height:32px;width:32px;border-radius:8px;display:block}
  .mark b{font-weight:700;letter-spacing:.06em;font-size:13px}
  .mark b span{color:var(--brand)}
  .hd-sep{width:1px;height:28px;background:var(--hd-line)}
  .hd-title{font-family:var(--serif);font-size:21px;color:#fff;white-space:nowrap}
  .hd-title em{font-style:italic;color:var(--brand)}
  .hd-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
  .hd-chip{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--hd-line);border-radius:99px;padding:6px 12px;color:#9FB4C2;white-space:nowrap}
  .hd-chip[data-s="live"]{color:#7BE0A3;border-color:rgba(123,224,163,.35)}
  .hd-chip[data-s="down"]{color:#F2938A;border-color:rgba(242,147,138,.4)}
  .hd-btn{border:1px solid var(--hd-line);border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;color:#BFD3E0;white-space:nowrap}
  .hd-btn:hover{border-color:var(--brand);color:#fff}

  main{max-width:1200px;margin:0 auto;padding:26px 26px 90px}
  h2{font-family:var(--serif);font-weight:400;font-size:24px;margin-bottom:4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:16px}

  /* ---------- Connect gate ---------- */
  .gate{max-width:460px;margin:60px auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:34px}
  .gate h1{font-family:var(--serif);font-weight:400;font-size:28px;margin-bottom:6px}
  .gate p{color:var(--muted);font-size:13.5px;margin-bottom:18px}
  .gate label{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:14px 0 5px}
  .gate input{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px}
  .gate .cta{width:100%;margin-top:20px;background:var(--brand);color:var(--hd);border-radius:9px;padding:12px;font-weight:700;font-size:14.5px}
  .gate .err{color:var(--bad);font-size:13px;margin-top:12px}

  /* ---------- Banners ---------- */
  .banner{display:flex;align-items:center;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 24px;margin-bottom:16px;flex-wrap:wrap}
  .banner h1{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.2}
  .banner .meta{color:var(--muted);font-size:13px;margin-top:2px}
  .banner .again{margin-left:auto;text-align:right;color:var(--muted);font-size:12px;white-space:nowrap}
  .counts{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
  .count{border-radius:10px;padding:10px 16px;text-align:center;min-width:86px;cursor:pointer;border:1px solid transparent}
  .count b{display:block;font-size:22px;line-height:1.1}
  .count span{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
  .count[data-k="red"]{background:var(--bad-bg);color:var(--bad)}
  .count[data-k="yellow"]{background:var(--warn-bg);color:var(--warn)}
  .count[data-k="green"]{background:var(--good-bg);color:var(--good)}
  .count[data-k="gray"]{background:var(--unk-bg);color:var(--unk)}
  .count[data-k="onorder"]{background:var(--brand-soft);color:var(--brand-ink)}
  .count.on{border-color:currentColor}
  .notice{display:flex;gap:12px;align-items:center;border-radius:var(--radius);padding:13px 18px;font-size:13.5px;margin-bottom:12px}
  .notice.warn{background:var(--warn-bg);color:var(--warn)}
  .notice.info{background:var(--brand-soft);color:var(--brand-ink)}
  .notice button{margin-left:auto;font-weight:700;text-decoration:underline;white-space:nowrap}

  /* ---------- Toolbar ---------- */
  .toolbar{display:flex;gap:10px;align-items:center;margin:22px 0 12px;flex-wrap:wrap}
  .searchwrap{position:relative;flex:1;min-width:200px}
  .search{width:100%;border:1px solid var(--line-strong);border-radius:9px;padding:9px 34px 9px 13px;background:var(--surface)}
  .sclear{position:absolute;right:6px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;padding:5px 8px;border-radius:6px}
  .sclear:hover{color:var(--ink);background:var(--unk-bg)}
  .fchip{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
  .fchip.on{background:var(--hd);border-color:var(--hd);color:#fff}

  /* ---------- Product rows ---------- */
  .rows{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .rowh,.prow{display:grid;grid-template-columns:52px 1fr 90px 110px 110px 150px 34px;gap:14px;align-items:center;padding:12px 20px}
  .rowh{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-top:14px;padding-bottom:10px}
  .rowh span[data-key]{cursor:pointer;user-select:none}
  .rowh span[data-key]:hover{color:var(--ink)}
  .rowh span[data-key].on{color:var(--brand-ink)}
  .prow{border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
  .prow:last-child{border-bottom:none}
  .prow:hover{background:#F8FBFD}
  .chev{width:28px;height:28px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);color:var(--muted);font-size:11px;display:flex;align-items:center;justify-content:center;transition:transform .15s}
  .chev:hover{border-color:var(--brand-ink);color:var(--brand-ink)}
  .chev.open{transform:rotate(90deg)}
  .sdig{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
  .pill{font-size:10.5px;font-weight:700;border-radius:99px;padding:3px 9px;white-space:nowrap}
  .pill[data-k="red"]{color:var(--bad);background:var(--bad-bg)}
  .pill[data-k="yellow"]{color:var(--warn);background:var(--warn-bg)}
  .pill[data-k="green"]{color:var(--good);background:var(--good-bg)}
  .pill[data-k="gray"]{color:var(--unk);background:var(--unk-bg)}
  .pill[data-k="onorder"]{color:var(--brand-ink);background:var(--brand-soft)}
  .vsub{display:grid;grid-template-columns:52px 1fr 90px 110px 110px 150px 34px;gap:14px;align-items:center;padding:8px 20px;border-bottom:1px solid var(--line);background:#F8FBFD;cursor:pointer}
  .vsub:hover{background:var(--brand-soft)}
  .vsub .vname{font-size:13px;color:var(--ink-2);padding-left:26px;position:relative}
  .vsub .vname::before{content:'└';position:absolute;left:8px;color:var(--line-strong)}
  .vsub .vname b{font-weight:600;color:var(--ink)}
  .vsub .num{font-size:13px;font-weight:500}
  .vsub .dleft{font-size:13.5px}
  .vsub .chip{font-size:10px;padding:3.5px 10px}
  .pimg{width:44px;height:44px;border-radius:9px;object-fit:cover;background:var(--unk-bg);border:1px solid var(--line)}
  .pname b{font-weight:600;font-size:14.5px;display:block}
  .pname .tags{display:flex;gap:6px;margin-top:3px;flex-wrap:wrap;align-items:center}
  .tag{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--unk-bg);color:var(--muted);border-radius:99px;padding:2px 9px}
  .tag.lead{background:var(--brand-soft);color:var(--brand-ink);text-transform:none;letter-spacing:0}
  .num{text-align:right;font-weight:600}
  .num small{display:block;font-weight:400;color:var(--muted);font-size:11px}
  .dleft{text-align:right;font-weight:700;font-size:16px}
  .dleft small{display:block;font-weight:400;color:var(--muted);font-size:11px}
  .chip{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:99px;padding:5px 12px;white-space:nowrap;justify-self:end}
  .chip[data-s="stockout"],.chip[data-s="reorder"]{color:var(--bad);background:var(--bad-bg)}
  .chip[data-s="watch"]{color:var(--warn);background:var(--warn-bg)}
  .chip[data-s="healthy"],.chip[data-s="slow"]{color:var(--good);background:var(--good-bg)}
  .chip[data-s="onorder"]{color:var(--brand-ink);background:var(--brand-soft)}
  .chip[data-s="unmapped"],.chip[data-s="dormant"],.chip[data-s="muted"]{color:var(--unk);background:var(--unk-bg)}
  .empty{color:var(--muted);padding:26px;text-align:center;font-style:italic}
  @media (max-width:760px){
    .rowh{display:none}
    .prow,.vsub{grid-template-columns:44px 1fr 80px 34px;gap:10px}
    .prow .num,.vsub .num{display:none}
    .prow .dleft,.vsub .dleft{grid-column:3}
    .prow .sdig,.prow>.chip,.vsub .chip{display:none}
  }
  .backbtn{border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
  .backbtn:hover{border-color:var(--brand-ink);color:var(--brand-ink)}

  /* ---------- Bottom sheet ---------- */
  .scrim{position:fixed;inset:0;background:rgba(12,22,29,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(102%);transition:transform .28s cubic-bezier(.3,.9,.3,1);box-shadow:0 -12px 40px rgba(12,22,29,.25)}
  .sheet.open{transform:translateY(0)}
  .sh-in{max-width:1040px;margin:0 auto;padding:20px 26px 60px}
  .sh-top{display:flex;align-items:center;gap:14px;position:sticky;top:0;background:var(--bg);padding:6px 0 14px;z-index:5}
  .sh-top img{width:52px;height:52px;border-radius:11px;object-fit:cover;border:1px solid var(--line);background:var(--surface)}
  .sh-top h3{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.15}
  .sh-top .sm{color:var(--muted);font-size:12.5px}
  .sh-nav{margin-left:auto;display:flex;gap:8px}
  .sh-nav button{width:38px;height:38px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);font-size:16px;display:flex;align-items:center;justify-content:center}
  .sh-nav button:hover{border-color:var(--brand-ink)}
  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
  .stat .lb{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .stat .vl{font-size:22px;font-weight:700;margin-top:2px}
  .stat .sm{font-size:11.5px;color:var(--muted);margin-top:1px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px}
  .panel h4{font-family:var(--serif);font-weight:400;font-size:18px;margin-bottom:2px}
  .panel .sub{margin-bottom:12px}
  .chart{width:100%;height:150px;display:block}
  /* interactive daily-sales chart */
  .chartwrap{position:relative;margin-top:8px}
  .cbars{display:flex;align-items:flex-end;gap:1px;height:150px;border-bottom:1px solid var(--line)}
  .cday{flex:1;height:100%;display:flex;align-items:flex-end;border-radius:2px}
  .cday i{width:100%;background:var(--brand);opacity:.78;border-radius:2px 2px 0 0;pointer-events:none}
  .cday:hover{background:var(--brand-soft)}
  .cday:hover i{opacity:1;background:var(--brand-ink)}
  .cday.nodata{background:repeating-linear-gradient(-45deg,#F0F4F7 0 4px,transparent 4px 8px)}
  .cday.tick{border-left:1px dashed var(--line)}
  .lineov{position:absolute;left:0;top:0;width:100%;height:150px;pointer-events:none}
  .cticks{position:relative;height:24px;font-size:10.5px;color:var(--muted)}
  .cticks span{position:absolute;top:5px;transform:translateX(-50%);white-space:nowrap}
  .ctip{position:absolute;background:var(--hd);color:#DFEAF2;font-size:11.5px;line-height:1.45;border-radius:7px;padding:6px 10px;pointer-events:none;display:none;z-index:6;white-space:nowrap;transform:translate(-50%,-100%);box-shadow:0 4px 14px rgba(12,22,29,.3)}
  .ctip b{color:#fff}
  .cdot{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--brand-ink);border:2px solid #fff;box-shadow:0 1px 4px rgba(12,22,29,.35);transform:translate(-50%,-50%);pointer-events:none;display:none;z-index:5}
  .nodata-note{position:absolute;top:8px;font-size:10.5px;color:var(--muted);transform:translateX(-50%);font-style:italic}
  /* variant mix bars */
  .mixrow{display:grid;grid-template-columns:190px 1fr 130px;gap:12px;align-items:center;padding:5px 0;font-size:12.5px}
  .mixrow .mname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;color:var(--ink-2)}
  .mixrow .mname:hover{color:var(--brand-ink)}
  .mixbar{height:20px;background:var(--brand-soft);border-radius:5px;position:relative;overflow:hidden}
  .mixbar i{position:absolute;inset:0;width:0;background:var(--brand);border-radius:5px;opacity:.85}
  .mixrow.top .mixbar i{background:var(--brand-ink)}
  .mixrow .mval{color:var(--muted);text-align:right;white-space:nowrap}
  /* info modal */
  .info h5{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--brand-ink);margin:18px 0 6px}
  .info p{font-size:13.5px;color:var(--ink-2);margin-bottom:8px}
  .info table{margin:8px 0}
  .info code{background:var(--unk-bg);border-radius:5px;padding:1px 6px;font-size:12px}
  .info .ex{background:var(--brand-soft);border-radius:9px;padding:11px 14px;font-size:13px;color:var(--brand-ink);margin:8px 0}
  /* combo (styled type picker — native datalist mispositions inside the modal) */
  .combo{position:relative;flex:1;min-width:150px}
  .combo input{width:100%}
  .combo-list{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--line-strong);border-radius:9px;box-shadow:0 8px 24px rgba(12,22,29,.15);max-height:210px;overflow-y:auto;z-index:20;display:none}
  .combo-list div{padding:8px 13px;cursor:pointer;font-size:13px}
  .combo-list div:hover{background:var(--brand-soft);color:var(--brand-ink)}
  .combo-list .newt{color:var(--muted);font-style:italic;cursor:default}
  .combo-list .newt:hover{background:none;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  td.r,th.r{text-align:right}
  .mini{font-size:11px;color:var(--muted)}
  .mutebtn{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--line-strong);border-radius:99px;padding:3px 10px}
  .mutebtn:hover{color:var(--bad);border-color:var(--bad)}
  .mutebtn.muted{background:var(--bad);border-color:var(--bad);color:#fff}
  .mutebtn.muted:hover{background:var(--surface);color:var(--bad)}
  tr.mutedrow td{opacity:.55}
  tr.mutedrow td:last-child{opacity:1}
  .trendnote{font-size:12.5px;border-radius:9px;padding:9px 13px;margin-bottom:12px;display:inline-block}
  .trendnote.spike{background:var(--warn-bg);color:var(--warn)}
  .trendnote.rise{background:var(--brand-soft);color:var(--brand-ink)}
  .trendnote.fall{background:var(--unk-bg);color:var(--unk)}

  /* planner */
  .plan-in{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .plan-in input{width:120px;border:1px solid var(--line-strong);border-radius:9px;padding:9px 12px;font-weight:700;font-size:16px}
  .plan-out{font-size:14px}
  .plan-out b{color:var(--brand-ink)}
  .scen{display:grid;gap:8px;margin-top:12px}
  .scen .srow{display:grid;grid-template-columns:150px 1fr 190px;gap:12px;align-items:center;font-size:12.5px}
  .sbar{height:22px;border-radius:6px;background:var(--brand-soft);position:relative;overflow:hidden}
  .sbar i{position:absolute;inset:0;width:0;background:var(--brand);border-radius:6px;opacity:.85}
  .sbar.acc i{background:var(--good)}
  .srow .sm{color:var(--muted);text-align:right}

  /* ---------- Modal (settings) ---------- */
  .modal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;background:rgba(12,22,29,.5);overflow-y:auto;padding:40px 16px}
  .modal.open{display:flex}
  .mbox{background:var(--bg);border-radius:16px;max-width:720px;width:100%;padding:26px 28px;position:relative}
  .mbox h3{font-family:var(--serif);font-weight:400;font-size:24px;margin-bottom:14px}
  .mbox .x{position:absolute;top:18px;right:20px;font-size:20px;color:var(--muted)}
  .set{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px}
  .set h5{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .frow{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .frow label{font-size:13px;color:var(--ink-2);min-width:170px}
  .frow input,.frow select{border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;background:#fff}
  .frow input[type=number]{width:90px}
  .frow input[type=text]{flex:1;min-width:160px}
  .btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:9px 15px;font-weight:600;font-size:13px}
  .btn:hover{border-color:var(--brand-ink)}
  .btn.pri{background:var(--brand);border-color:var(--brand);color:var(--hd);font-weight:700}
  .btn.danger{color:var(--bad)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .msg{font-size:12.5px;margin-top:10px;color:var(--muted)}
  .msg.ok{color:var(--good)} .msg.bad{color:var(--bad)}
  .ptable td input{width:70px;border:1px solid var(--line-strong);border-radius:7px;padding:5px 8px}
  .ptable td input.nm{width:130px}
  #typeTable select{width:100%;max-width:260px;border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px;background:#fff}
  #typeTable td{padding:6px 8px}
  #typeTable tr.unm td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
  #typeTable tr.unm select{border-color:var(--warn);background:var(--warn-bg)}
  #typeTable .tcount{font-size:11px;color:var(--muted);display:block}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line-strong);border-top-color:var(--brand-ink);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
  @keyframes spin{to{transform:rotate(360deg)}}
  footer{max-width:1200px;margin:0 auto;padding:0 26px 40px;color:var(--muted);font-size:12px}

  /* ---------- Order report ---------- */
  .rep-top{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:6px}
  .rep-top h1{font-family:var(--serif);font-weight:400;font-size:30px}
  .rep-top .meta{color:var(--muted);font-size:13px}
  .rep-top .acts{margin-left:auto;display:flex;gap:8px}
  .rep-group{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 24px;margin-bottom:20px;break-inside:avoid}
  .rep-ghead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:2px solid var(--hd);padding-bottom:10px;margin-bottom:6px}
  .rep-ghead h2{font-family:var(--serif);font-weight:400;font-size:22px;margin:0}
  .rep-ghead .gtotal{color:var(--muted);font-size:13px}
  .rep-ghead .acts{margin-left:auto;display:flex;gap:8px;align-items:center}
  .rep-sec{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:16px 0 6px;padding:5px 12px;border-radius:99px;display:inline-block}
  .rep-sec.red{background:var(--bad-bg);color:var(--bad)}
  .rep-sec.yellow{background:var(--warn-bg);color:var(--warn)}
  .rep-card{border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:8px 0;break-inside:avoid}
  .rep-phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .rep-phead img{width:34px;height:34px;border-radius:7px;object-fit:cover;border:1px solid var(--line)}
  .rep-phead b{font-size:14.5px}
  .rep-moq{font-size:11px;font-weight:700;border-radius:99px;padding:3px 10px}
  .rep-moq.met{background:var(--good-bg);color:var(--good)}
  .rep-moq.under{background:var(--warn-bg);color:var(--warn)}
  .rep-moq.none{background:var(--unk-bg);color:var(--unk)}
  .rep-card table{font-size:12.5px}
  .rep-card td,.rep-card th{padding:6px 8px}
  .rep-card .qty{width:76px;border:1px solid var(--line-strong);border-radius:7px;padding:5px 8px;font-weight:700;text-align:right}
  .rep-card tr.unchecked td{opacity:.45}
  .rep-card tr.unchecked td:first-child{opacity:1}
  .rep-empty{color:var(--muted);font-style:italic;padding:30px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
  .rep-cardacts{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .rep-cardacts .btn{padding:5px 10px;font-size:11.5px}
  .rep-cardacts .mult{width:58px;border:1px solid var(--line-strong);border-radius:7px;padding:5px 7px;font-size:12px;text-align:right}
  .rowdays{font-size:10.5px;color:var(--muted);white-space:nowrap;text-align:right}
  @page{margin:12mm}
  @media print{
    header,.rep-top .acts,.rep-ghead .acts,.rep-cardacts,footer,.notice,.scrim,.sheet,.modal{display:none!important}
    body{background:#fff}
    main{padding:0;max-width:none}
    .rep-group{border:none;padding:0 0 6px;margin-bottom:6px;break-inside:auto}
    .rep-ghead{break-after:avoid}
    .rep-card{break-inside:avoid;margin:6px 0}
    .rep-card input[type=checkbox]{display:none}
    .rep-card tr.unchecked{display:none}
    .rep-card .qty{border:none}
  }
</style>
</head>
<body>
<header>
  <div class="hd">
    <a class="mark" href="https://go-mobius-digital.com"><img src="../favicon.png" alt=""><b>MOBIUS<span> DIGITAL</span></b></a>
    <div class="hd-sep"></div>
    <div class="hd-title">Mobius <em>Restock</em></div>
    <div class="hd-right">
      <span class="hd-chip" id="connChip" data-s="off">Not connected</span>
      <button class="hd-btn" id="btnRefresh" style="display:none">↻ Refresh</button>
      <button class="hd-btn" id="btnReport" style="display:none">📋 Order report</button>
      <button class="hd-btn" id="btnInfo">ℹ How it works</button>
      <button class="hd-btn" id="btnSettings">⚙ Settings</button>
    </div>
  </div>
</header>

<main id="main"></main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="sh-in" id="sheetIn"></div></div>

<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>

<footer>Mobius Restock · forecasts use a 14/30/90-day weighted sell-through blend with promo damping · not gospel, just math.</footer>

<script>
'use strict';
/* ================= config / state ================= */
const DEFAULT_WORKER_URL = 'https://mobius-restock.mobius-digital.workers.dev';
const LS = { url:'restock_worker', tok:'restock_token', store:'restock_store' };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let S = {
  url: localStorage.getItem(LS.url) || DEFAULT_WORKER_URL,
  tok: localStorage.getItem(LS.tok) || '',
  store: localStorage.getItem(LS.store) || 'lucky',
  report: null, settings: null, stores: null,
  filter: 'all', q: '', open: -1, openVar: -1, visible: [], expand: new Set(), sort: null,
  view: 'list',
};

async function api(path, opts = {}) {
  const res = await fetch(S.url.replace(/\/+$/,'') + path, {
    ...opts,
    headers: { 'Authorization': 'Bearer ' + S.tok,
      ...(opts.body ? { 'Content-Type': 'application/json' } : {}), ...(opts.headers||{}) },
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || ('HTTP ' + res.status));
  return j;
}

/* ================= boot ================= */
async function boot() {
  if (!S.tok) return renderGate();
  setChip('…', 'off');
  try {
    const [report, settings, stores] = await Promise.all([
      api('/api/report?store=' + S.store).catch(e => ({ __err: e.message })),
      api('/api/settings'),
      api('/api/stores'),
    ]);
    S.settings = settings; S.stores = stores;
    S.report = report.__err ? null : report;
    S.lastFetch = Date.now();
    setChip('Live', 'live');
    $('#btnRefresh').style.display = '';
    $('#btnReport').style.display = S.report ? '' : 'none';
    render(report.__err || null);
  } catch (e) {
    if (/unauthorized/i.test(e.message)) { S.tok=''; localStorage.removeItem(LS.tok); return renderGate('Wrong password — try again.'); }
    setChip('Worker down', 'down');
    $('#main').innerHTML = `<div class="gate"><h1>Can't reach the worker</h1><p>${esc(e.message)}</p>
      <button class="cta" onclick="boot()">Retry</button></div>`;
  }
}
function setChip(t, s){ const c=$('#connChip'); c.textContent=t; c.dataset.s=s; }

function renderGate(err) {
  setChip('Signed out','off');
  $('#main').innerHTML = `
  <div class="gate">
    <h1>Sign in</h1>
    <p>Lucky Golf inventory forecast. You'll stay signed in on this device.</p>
    <label>Password</label><input id="gTok" type="password" placeholder="password" autofocus>
    ${err ? `<div class="err">${esc(err)}</div>` : ''}
    <button class="cta" id="gGo">Sign in</button>
    <details style="margin-top:16px"><summary style="font-size:12px;color:var(--muted);cursor:pointer">Advanced</summary>
      <label>Worker URL</label><input id="gUrl" value="${esc(S.url)}">
    </details>
  </div>`;
  const go = () => {
    S.url = ($('#gUrl').value || '').trim() || DEFAULT_WORKER_URL;
    S.tok = $('#gTok').value.trim();
    localStorage.setItem(LS.url, S.url); localStorage.setItem(LS.tok, S.tok);
    boot();
  };
  $('#gGo').onclick = go;
  $('#gTok').addEventListener('keydown', e => { if (e.key==='Enter') go(); });
  $('#gTok').focus();
}

/* ================= main render ================= */
const RED = ['stockout','reorder'], YEL = ['watch'], ONO = ['onorder'], GRN = ['healthy','slow'], GRY = ['unmapped','dormant','muted'];
const STATUS_LABEL = { stockout:'Out of stock', reorder:'Reorder now', watch:'Watch', onorder:'✈ On order', healthy:'Healthy', slow:'Slow mover', unmapped:'Unmapped', dormant:'Dormant', muted:'Muted' };
const STATUS_RANK = { stockout:5, reorder:4, watch:3, onorder:2.5, unmapped:2, healthy:1, slow:1, dormant:0, muted:0 };

function fmtD(d){ return d==null ? '—' : d>=9000 ? '∞' : d+'d'; }
function fmtV(v){ return v>=10 ? v.toFixed(1) : v>=0.1 ? v.toFixed(2) : v>0 ? v.toFixed(3) : '0'; }
function fmtWhen(iso){ return iso ? new Date(iso).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : '—'; }
function fmtYmd(ymd){ return ymd ? new Date(ymd+'T12:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',
  ...(ymd.slice(0,4)!==String(new Date().getFullYear())?{year:'2-digit'}:{}), timeZone:'UTC'}) : '—'; }

function render(reportErr) {
  if (S.view === 'report' && S.report) return renderReport();
  const m = $('#main');
  if (reportErr || !S.report) {
    m.innerHTML = `
      ${bannersHTML(true)}
      <div class="gate"><h1>No snapshot yet</h1>
      <p>${esc(reportErr || 'Run the first snapshot to pull your catalog and start the forecast.')}</p>
      <button class="cta" onclick="doSnapshot(this)">Run first snapshot</button>
      <div class="msg" id="gateMsg"></div></div>`;
    return;
  }
  const r = S.report, c = r.counts;
  const red = c.stockout + c.reorder, yel = c.watch, ono = c.onorder||0, grn = c.healthy + c.slow, gry = c.unmapped + c.dormant + c.muted;
  const worstTitle = red ? `${red} variant${red>1?'s':''} need${red>1?'':'s'} reordering` :
    yel ? `${yel} variant${yel>1?'s':''} to watch` : 'All stock levels healthy';

  m.innerHTML = `
    ${bannersHTML(false)}
    <div class="banner">
      <div><h1>${esc(r.storeName)} — ${worstTitle}</h1>
        <div class="meta">Snapshot ${fmtWhen(r.generatedAt)} · ${r.historyDays} days of sales history${r.historyDays<90?' (young — forecasts sharpen as history builds)':''}</div></div>
      <div class="counts">
        <div class="count ${S.filter==='red'?'on':''}" data-k="red" onclick="setFilter('red')"><b>${red}</b><span>Reorder</span></div>
        <div class="count ${S.filter==='yellow'?'on':''}" data-k="yellow" onclick="setFilter('yellow')"><b>${yel}</b><span>Watch</span></div>
        ${ono?`<div class="count ${S.filter==='onorder'?'on':''}" data-k="onorder" onclick="setFilter('onorder')" title="Variants with an open PO — click to see just what's ordered"><b>${ono}</b><span>✈ On order</span></div>`:''}
        <div class="count ${S.filter==='green'?'on':''}" data-k="green" onclick="setFilter('green')"><b>${grn}</b><span>Healthy</span></div>
        <div class="count ${S.filter==='gray'?'on':''}" data-k="gray" onclick="setFilter('gray')"><b>${gry}</b><span>Other</span></div>
      </div>
    </div>
    <div class="toolbar">
      <div class="searchwrap">
        <input class="search" id="searchBox" placeholder="Search products, SKUs, types…" value="${esc(S.q)}"
          oninput="S.q=this.value;$('#sclear').style.display=this.value?'':'none';renderRows()">
        <button class="sclear" id="sclear" style="display:${S.q?'':'none'}" title="Clear search"
          onclick="S.q='';$('#searchBox').value='';this.style.display='none';renderRows();$('#searchBox').focus()">✕</button>
      </div>
      <button class="fchip ${S.filter==='all'?'on':''}" onclick="setFilter('all')">All products</button>
    </div>
    <div id="rows"></div>`;
  renderRows();
}

function bannersHTML(gateMode) {
  let h = '';
  if (S.settings && !S.settings.reviewedDefaults) {
    h += `<div class="notice info">🛠️ Lead-time profiles are seeded with <b>&nbsp;example numbers&nbsp;</b> (Clubs 60+30, Soft Goods 45+30, Accessories 30+30). Set your real production &amp; shipping days.
      <button onclick="openSettings()">Review now →</button></div>`;
  }
  if (!gateMode && S.report?.unmappedTypes?.length) {
    h += `<div class="notice warn">⚠️ ${S.report.unmappedTypes.length} product type${S.report.unmappedTypes.length>1?'s have':' has'} no lead-time profile: ${S.report.unmappedTypes.map(esc).join(', ')} — these can't be forecast against a reorder point.
      <button onclick="openSettings()">Map them →</button></div>`;
  }
  const st = S.stores?.stores?.find(s => s.id === S.store);
  if (st && !st.hasToken) {
    h += `<div class="notice warn">🔑 The worker has no Shopify credentials for ${esc(st.name)} yet — snapshots will fail until <code>SHOPIFY_CLIENT_ID_${st.id.toUpperCase()}</code> + <code>SHOPIFY_CLIENT_SECRET_${st.id.toUpperCase()}</code> are set (see restock/worker/README.md).</div>`;
  }
  if (st && st.hasToken && S.stores && !S.stores.slackConfigured) {
    h += `<div class="notice warn">💬 No Slack token set — the dashboard works, but digests and alerts won't send until <code>SLACK_BOT_TOKEN</code> is set.</div>`;
  }
  return h;
}

function setFilter(f){ S.filter = S.filter===f ? 'all' : f; S.expand = new Set(); render(); }

function matchFilter(p) {
  if (S.filter==='all') return true;
  const set = { red:RED, yellow:YEL, onorder:ONO, green:GRN, gray:GRY }[S.filter];
  return p.variants.some(v => set.includes(v.status));
}
function bucketOf(v){ return RED.includes(v.status)?'red':YEL.includes(v.status)?'yellow':ONO.includes(v.status)?'onorder':GRN.includes(v.status)?'green':'gray'; }
function statusCellHTML(p) {
  const g = { red:0, yellow:0, onorder:0, green:0, gray:0 };
  for (const v of p.variants) g[bucketOf(v)]++;
  const buckets = Object.entries(g).filter(([,n]) => n>0);
  if (p.variants.length === 1 || buckets.length === 1) {
    return `<span class="chip" data-s="${p.status}" style="justify-self:end">${STATUS_LABEL[p.status]}</span>`;
  }
  const lbl = { red: g.red===1 && p.variants.find(v=>v.status==='stockout') ? 'out' : 'reorder',
                yellow:'watch', onorder:'✈ ordered', green:'ok', gray:'other' };
  return `<div class="sdig">${buckets.map(([k,n]) =>
    `<span class="pill" data-k="${k}">${n} ${k==='red'?(p.statusCounts?.stockout&&!p.statusCounts?.reorder?'out':'reorder'):lbl[k]}</span>`).join('')}</div>`;
}
function isExpanded(p) {
  const auto = S.filter!=='all' && p.variants.length>1;
  return S.expand.has(p.id) ? !auto : auto;
}
function toggleExpand(ev, id) {
  ev.stopPropagation();
  S.expand.has(id) ? S.expand.delete(id) : S.expand.add(id);
  renderRows();
}
function variantFlags(v) {
  return (v.isNew?' 🆕':'') + (v.trend==='spiking'?' ⚡':'');
}
/** Aggregate a product's open POs: total qty, earliest landing, overdue flag. */
function ooInfo(p) {
  const vs = p.variants.filter(v => v.onOrder);
  if (!vs.length) return null;
  const etas = vs.map(v => v.onOrder.eta).sort();
  return { n: vs.length, qty: vs.reduce((s,v) => s + v.onOrder.qty, 0),
    eta: etas[0], multi: new Set(etas).size > 1,
    overdue: vs.some(v => v.onOrder.overdue), ids: vs.map(v => v.id) };
}
/** Product-level on-order tag for list rows: qty, landing date, ✕ to clear all. */
function ooTagHTML(p) {
  const oo = ooInfo(p);
  if (!oo) return '';
  return `<span class="tag" style="background:var(--brand-soft);color:var(--brand-ink);text-transform:none;letter-spacing:0">✈ ${oo.qty} on order · ${oo.multi?'first ':''}lands ~${fmtYmd(oo.eta)}${oo.overdue?' · <b style="color:var(--warn)">overdue</b>':''}&nbsp;<b style="cursor:pointer" title="Clear the on-order flag on all ${oo.n} variant${oo.n>1?'s':''} of this product" onclick="clearProductPO(event,'${p.id}')">✕</b></span>`;
}
/** Clear every open PO on a product — from the dashboard row's ✕ or the panel button. */
async function clearProductPO(ev, pid) {
  ev.stopPropagation();
  const p = S.report?.products.find(x => x.id === pid);
  const oo = p && ooInfo(p);
  if (!oo) return;
  if (!confirm(`Clear the on-order flag on ${oo.n} variant${oo.n>1?'s':''} of "${p.title}" (${oo.qty} units)?\n\nThey go back to their normal forecast status immediately.`)) return;
  try {
    await api('/api/on-order?store=' + S.store, { method: 'POST', body: JSON.stringify({ clear: oo.ids }) });
  } catch(e) { alert('Clear failed: ' + e.message); return; }
  await refreshReport(true);
  if (S.open >= 0) {   // panel open — re-find the product after the list resorts
    const ni = S.visible.findIndex(x => x.id === pid);
    if (ni >= 0) { S.open = ni; renderSheet(); } else closeSheet();
  }
}
/* Column sorting — first click uses each column's natural direction,
 * second click flips it. Default order (no sort) is urgency. */
const SORTS = {
  title:  { dir: 1,  cmp: (a,b) => a.title.localeCompare(b.title) },
  inv:    { dir: -1, cmp: (a,b) => a.totalInv - b.totalInv },
  vel:    { dir: -1, cmp: (a,b) => a.velocity - b.velocity },
  days:   { dir: 1,  cmp: (a,b) => (a.daysLeft ?? 1e9) - (b.daysLeft ?? 1e9) },
  status: { dir: -1, cmp: (a,b) => (STATUS_RANK[a.status] - STATUS_RANK[b.status]) || ((a.daysLeft ?? 1e9) - (b.daysLeft ?? 1e9)) },
};
function sortBy(key) {
  S.sort = (S.sort?.key === key)
    ? { key, dir: -S.sort.dir }
    : { key, dir: SORTS[key].dir };
  renderRows();
}
function sortHead(key, label, right) {
  const on = S.sort?.key === key;
  const arr = on ? (S.sort.dir === 1 ? ' ▲' : ' ▼') : '';
  return `<span data-key="${key}" class="${on?'on':''}" onclick="sortBy('${key}')" ${right?'style="text-align:right"':''} title="Sort by ${label.toLowerCase()}">${label}${arr}</span>`;
}
function renderRows() {
  const q = S.q.trim().toLowerCase();
  S.visible = S.report.products.filter(p => matchFilter(p) &&
    (!q || (p.title+' '+p.type+' '+p.vendor+' '+p.variants.map(v=>v.sku).join(' ')).toLowerCase().includes(q)));
  if (S.sort) S.visible = [...S.visible].sort((a,b) => SORTS[S.sort.key].cmp(a,b) * S.sort.dir);
  const rows = S.visible.map((p, i) => {
    const lead = p.leadDays!=null ? `<span class="tag lead">lead ${p.leadDays}d${p.leadSource==='metafield'?' · metafield':''}</span>` : `<span class="tag">no lead time</span>`;
    const alert = p.alertCount ? `<small>${p.alertCount} variant${p.alertCount>1?'s':''} 🔴</small>` : `<small>&nbsp;</small>`;
    const multi = p.variants.length > 1;
    const open = multi && isExpanded(p);
    let html = `
    <div class="prow" onclick="openSheet(${i})">
      <img class="pimg" src="${esc(p.image||'')}" onerror="this.style.visibility='hidden'" alt="">
      <div class="pname"><b>${esc(p.title)}</b>
        <div class="tags">${p.type?`<span class="tag">${esc(p.type)}</span>`:''}${lead}${ooTagHTML(p)}${p.variants.some(v=>v.trend==='spiking')?'<span class="tag" style="background:var(--warn-bg);color:var(--warn)">⚡ spiking</span>':''}${p.variants.some(v=>v.isNew)?'<span class="tag" style="background:var(--brand-soft);color:var(--brand-ink)">🆕 new</span>':''}${multi?`<span class="tag">${p.variants.length} variants</span>`:''}</div></div>
      <div class="num">${p.totalInv}<small>on hand</small></div>
      <div class="num">${fmtV(p.velocity)}/day<small>sell-through</small></div>
      <div class="dleft">${fmtD(p.daysLeft)}${alert}</div>
      ${statusCellHTML(p)}
      ${multi?`<button class="chev ${open?'open':''}" onclick="toggleExpand(event,'${p.id}')" title="Show variants">▶</button>`:'<span></span>'}
    </div>`;
    if (open) html += p.variants.map((v, vi) => `
      <div class="vsub" onclick="openVar(${i},${vi})">
        <span></span>
        <div class="vname"><b>${esc(v.sku||v.title||'variant')}</b>${v.sku&&v.title?` · ${esc(v.title)}`:''}${variantFlags(v)}${v.onOrder?`<span class="mini" style="color:var(--brand-ink)"> · ✈ ${v.onOrder.qty} lands ~${fmtYmd(v.onOrder.eta)}${v.onOrder.overdue?' <b style="color:var(--warn)">overdue</b>':''}</span>`:''}</div>
        <div class="num" style="text-align:right">${v.inv}</div>
        <div class="num" style="text-align:right">${fmtV(v.velocity)}/day</div>
        <div class="dleft">${fmtD(v.daysLeft)}<small>&nbsp;</small></div>
        <span class="chip" data-s="${v.status}" style="justify-self:end">${STATUS_LABEL[v.status]}</span>
        <span></span>
      </div>`).join('');
    return html;
  }).join('');
  $('#rows').innerHTML = `<div class="rows">
    <div class="rowh"><span></span>${sortHead('title','Product')}${sortHead('inv','Stock',1)}${sortHead('vel','Velocity',1)}${sortHead('days','Days left',1)}${sortHead('status','Status',1)}<span></span></div>
    ${rows || '<div class="empty">Nothing matches this filter.</div>'}</div>`;
}

/* ================= order report ================= */
function repCardHTML(p, vars) {
  const rows = vars.map(v => {
    const red = v.status === 'stockout' || v.status === 'reorder';
    return `
    <tr class="${red ? '' : 'unchecked'}" data-vid="${v.id}" data-vel="${v.velocity}" data-inv="${v.inv}" data-need="${v.suggestedQty ?? 0}">
      <td><input type="checkbox" ${red ? 'checked' : ''} onchange="this.closest('tr').classList.toggle('unchecked',!this.checked);repTotals()"></td>
      <td data-sku="${esc(v.sku || v.title || 'variant')}"><b>${esc(v.sku || v.title || '—')}</b>${v.sku && v.title ? `<span class="mini"> · ${esc(v.title)}</span>` : ''}${v.onOrder ? `<div class="mini" style="color:var(--brand-ink)">✈ ${v.onOrder.qty} already on order (placed ${fmtYmd(v.onOrder.placedAt)}) · lands ~${fmtYmd(v.onOrder.eta)}</div>` : ''}</td>
      <td><span class="chip" data-s="${v.status}">${STATUS_LABEL[v.status]}</span></td>
      <td class="r">${v.inv}</td>
      <td class="r">${fmtV(v.velocity)}/d</td>
      <td class="r">${fmtD(v.daysLeft)}</td>
      <td class="r"><input class="qty" type="number" min="0" value="${v.suggestedQty ?? 0}" oninput="repTotals()"><div class="rowdays"></div></td>
    </tr>`;
  }).join('');
  return `
  <div class="rep-card" data-title="${esc(p.title)}" data-lead="${p.leadDays ?? ''}" data-moq="${p.moq ?? ''}">
    <div class="rep-phead">
      <img src="${esc(p.image || '')}" onerror="this.style.display='none'" alt="">
      <b>${esc(p.title)}</b>
      ${p.leadDays != null ? `<span class="tag lead">lead ${p.leadDays}d</span>` : ''}
      <span class="rep-moq none"></span>
      <span class="rep-cardacts">
        <button class="btn" onclick="markOrdered(this)" title="Record the checked quantities as an order placed with the manufacturer — they stop showing red, the digest goes quiet on them, and the flag clears itself when the stock lands in Shopify">✈ Mark as ordered</button>
        ${p.moq ? `<button class="btn" onclick="autoMoq(this)" title="Check every variant and split the MOQ across them proportional to how fast each sells (never below its own need)">⚡ Fill to MOQ</button>
        <input class="mult" type="number" value="1" step="0.25" min="0.1" title="Multiplier applied to the MOQ — press Enter to apply" oninput="scaleHint(this)" onkeydown="if(event.key==='Enter')scaleCard(this)">
        <button class="btn scalebtn" onclick="scaleCard(this)" title="Order multiplier × MOQ total units, split across variants by how fast each sells — never below a variant's own need">× MOQ = ${p.moq} units</button>` : ''}
      </span>
    </div>
    <div style="overflow-x:auto"><table>
      <tr><th></th><th>SKU / variant</th><th>Status</th><th class="r">On hand</th><th class="r">Vel</th><th class="r">Days left</th><th class="r">Order qty</th></tr>
      ${rows}</table></div>
  </div>`;
}
/** Check all variants and split `target` units across them proportional to velocity —
 *  each variant keeps at least its own need; the shortfall pads the fast movers. */
function fillToTarget(card, target) {
  const trs = [...card.querySelectorAll('tr')].filter(tr => tr.querySelector('.qty'));
  trs.forEach(tr => { tr.querySelector('input[type=checkbox]').checked = true; tr.classList.remove('unchecked'); });
  const needs = trs.map(tr => Number(tr.dataset.need) || 0);
  const vels = trs.map(tr => Number(tr.dataset.vel) || 0);
  const needSum = needs.reduce((a, b) => a + b, 0);
  const velSum = vels.reduce((a, b) => a + b, 0);
  let qtys;
  if (needSum >= target) qtys = needs;
  else {
    const deficit = target - needSum;
    qtys = needs.map((n, i) => n + (velSum > 0 ? deficit * vels[i] / velSum : deficit / trs.length));
    qtys = qtys.map(Math.round);
    let diff = target - qtys.reduce((a, b) => a + b, 0); // rounding drift → settle on the fastest seller
    if (diff !== 0) qtys[vels.indexOf(Math.max(...vels))] += diff;
  }
  trs.forEach((tr, i) => tr.querySelector('.qty').value = Math.max(0, qtys[i]));
  repTotals();
}
function autoMoq(btn) {
  const card = btn.closest('.rep-card');
  fillToTarget(card, Number(card.dataset.moq) || 0);
}
/** Order multiplier × MOQ total units, velocity-split (Fill to MOQ at 1×). */
function scaleCard(btn) {
  const card = btn.closest('.rep-card');
  const m = Math.max(0.1, parseFloat(card.querySelector('.mult').value) || 1);
  const moq = Number(card.dataset.moq) || 0;
  if (moq) fillToTarget(card, Math.round(moq * m));
}
/** Record the checked quantities as a placed PO — the worker treats them as
 *  incoming stock (status ✈ on order) until the restock lands in Shopify. */
async function markOrdered(btn) {
  const card = btn.closest('.rep-card');
  const lead = Number(card.dataset.lead) || 0;
  const items = [...card.querySelectorAll('tr:not(.unchecked)')].map(tr => {
    const qty = Number(tr.querySelector('.qty')?.value) || 0;
    return qty > 0 && tr.dataset.vid ? { variantId: tr.dataset.vid, qty, leadDays: lead } : null;
  }).filter(Boolean);
  if (!items.length) {
    btn.textContent = 'Nothing selected';
    setTimeout(() => btn.textContent = '✈ Mark as ordered', 1600);
    return;
  }
  const placedAt = $('#poDate')?.value || todayYMD();
  btn.disabled = true; btn.textContent = '⏳ marking…';
  try {
    await api('/api/on-order?store=' + S.store, { method: 'POST', body: JSON.stringify({ set: items, placedAt }) });
    await refreshReport();   // report view re-renders — these variants flip to ✈ on order
  } catch(e) {
    btn.disabled = false; btn.textContent = '✈ Mark as ordered';
    alert('Mark as ordered failed: ' + e.message);
  }
}
/** Clear a variant's open-PO flag (order cancelled, or arrival wasn't auto-detected). */
async function clearOrdered(vid) {
  const prodId = S.visible[S.open]?.id;
  try {
    await api('/api/on-order?store=' + S.store, { method: 'POST', body: JSON.stringify({ clear: [vid] }) });
  } catch(e) { alert('Clear failed: ' + e.message); return; }
  await refreshReport(true);
  if (S.open >= 0 && prodId != null) {   // clearing resorts the list — re-find the product
    const ni = S.visible.findIndex(p => p.id === prodId);
    if (ni >= 0) { S.open = ni; renderSheet(); } else closeSheet();
  }
}
/** Keep the scale button's label showing the live target: multiplier × MOQ. */
function scaleHint(inp) {
  const card = inp.closest('.rep-card');
  const moq = Number(card.dataset.moq) || 0;
  if (!moq) return;
  const m = Math.max(0.1, parseFloat(inp.value) || 1);
  card.querySelector('.scalebtn').textContent = `× MOQ = ${Math.round(moq * m)} units`;
}
function renderReport() {
  const r = S.report;
  const date = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  const groups = new Map(); // manufacturer group (lead-time profile) → {red:[], yellow:[]}
  for (const p of r.products) {
    const reds = p.variants.filter(v => v.status === 'stockout' || v.status === 'reorder');
    const watch = p.variants.filter(v => v.status === 'watch');
    if (!reds.length && !watch.length) continue;
    // with an MOQ, also list healthy selling variants (unchecked) so
    // "Fill to MOQ" can pad the order across the product's full mix
    const extras = p.moq
      ? p.variants.filter(v => !reds.includes(v) && !watch.includes(v)
          && v.velocity > 0.001 && !['muted', 'dormant'].includes(v.status))
      : [];
    const key = p.profileName || 'No profile assigned';
    if (!groups.has(key)) groups.set(key, { red: [], yellow: [] });
    if (reds.length) groups.get(key).red.push({ p, vars: [...reds, ...watch, ...extras] });
    else groups.get(key).yellow.push({ p, vars: [...watch, ...extras] });
  }
  const gHtml = [...groups.entries()].map(([g, { red, yellow }]) => `
    <div class="rep-group" data-group="${esc(g)}">
      <div class="rep-ghead">
        <h2>${esc(g)}</h2><span class="gtotal"></span>
        <div class="acts">
          <button class="btn" onclick="copyGroup(this,'${esc(g)}')">📋 Copy order for ${esc(g)}</button>
        </div>
      </div>
      ${red.length ? `<div class="rep-sec red">🔴 Order now — past the reorder point</div>` + red.map(x => repCardHTML(x.p, x.vars)).join('') : ''}
      ${yellow.length ? `<div class="rep-sec yellow">🟡 Watch — approaching the order window, consider adding to this order</div>` + yellow.map(x => repCardHTML(x.p, x.vars)).join('') : ''}
    </div>`).join('');
  $('#main').innerHTML = `
    <div class="rep-top">
      <div><h1>Reorder report</h1>
        <div class="meta">${esc(r.storeName)} · ${date} · quantities target ${S.settings?.targetCoverDays || 180}d coverage after lead time — edit before copying</div></div>
      <div class="acts">
        <label style="display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)" title="The date the PO was (or will be) placed — ✈ Mark as ordered uses it, and the landing ETA = this date + the product's lead time. Backdate it if you placed the order earlier.">PO date
          <input type="date" id="poDate" value="${todayYMD()}" max="${todayYMD()}"
            style="border:1px solid var(--line-strong);border-radius:8px;padding:6px 9px;font:inherit;color:var(--ink);background:var(--surface)"></label>
        <button class="btn" onclick="window.print()">🖨 Print / PDF</button>
        <button class="btn pri" onclick="S.view='list';render()">← Back to dashboard</button>
      </div>
    </div>
    ${gHtml || '<div class="rep-empty">Nothing needs reordering — every variant is healthy. 🎉</div>'}`;
  repTotals();
  window.scrollTo(0, 0);
}
function repTotals() {
  document.querySelectorAll('.rep-card').forEach(card => {
    const lead = Number(card.dataset.lead) || 0;
    const moq = Number(card.dataset.moq) || 0;
    let sel = 0;
    card.querySelectorAll('tr').forEach(tr => {
      const q = tr.querySelector('.qty'); if (!q) return;
      const qty = Number(q.value) || 0;
      const days = tr.querySelector('.rowdays');
      const vel = Number(tr.dataset.vel) || 0;
      const checked = !tr.classList.contains('unchecked');
      if (checked) sel += qty;
      // live per-row coverage: how long you'd be stocked after this order lands
      if (checked && qty > 0 && vel > 0.001) {
        const after = ((Number(tr.dataset.inv) || 0) + qty) / vel - lead;
        days.textContent = after <= 0 ? 'sells out before it lands'
          : `≈ ${Math.round(after)}d after landing`;
      } else days.textContent = '';
    });
    const badge = card.querySelector('.rep-moq');
    if (moq) {
      const met = sel >= moq;
      badge.className = `rep-moq ${met ? 'met' : 'under'}`;
      badge.textContent = met
        ? `selected ${sel} / MOQ ${moq} ✓ met`
        : `selected ${sel} / MOQ ${moq} — ${moq - sel} short`;
    } else {
      badge.className = 'rep-moq none';
      badge.textContent = `selected ${sel} · no MOQ`;
    }
  });
  document.querySelectorAll('.rep-group').forEach(gr => {
    let units = 0, count = 0;
    gr.querySelectorAll('tr:not(.unchecked) .qty').forEach(q => {
      const n = Number(q.value) || 0;
      if (n > 0) { units += n; count++; }
    });
    gr.querySelector('.gtotal').textContent = `${units} units · ${count} variant${count === 1 ? '' : 's'} selected`;
  });
}
function copyGroup(btn, g) {
  const gr = document.querySelector(`.rep-group[data-group="${CSS.escape(g)}"]`);
  const date = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  const lines = [`${S.report.storeName} — Purchase order draft · ${date}`, `Manufacturer group: ${g}`, ''];
  let grand = 0;
  gr.querySelectorAll('.rep-card').forEach(card => {
    const rows = [...card.querySelectorAll('tr:not(.unchecked)')].map(tr => {
      const qty = Number(tr.querySelector('.qty')?.value) || 0;
      const sku = tr.querySelector('[data-sku]')?.dataset.sku;
      return qty > 0 && sku ? { sku, qty } : null;
    }).filter(Boolean);
    if (!rows.length) return;
    lines.push(card.dataset.title + (card.dataset.lead ? `  (lead ~${card.dataset.lead}d)` : ''));
    for (const { sku, qty } of rows) { lines.push(`  • ${sku} — ${qty} units`); grand += qty; }
    lines.push('');
  });
  if (!grand) { btn.textContent = 'Nothing selected'; setTimeout(() => btn.textContent = `📋 Copy order for ${g}`, 1600); return; }
  lines.push(`TOTAL: ${grand} units`);
  const text = lines.join('\n');
  const done = () => { btn.textContent = '✓ Copied — paste anywhere'; setTimeout(() => btn.textContent = `📋 Copy order for ${g}`, 2200); };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } finally { ta.remove(); }
}

function nav(d){

/** Variant view = a synthetic single-variant "product" so the sheet and
 *  planner logic apply unchanged, scoped to that variant's own numbers. */
function variantView(prod, vi) {
  const v = prod.variants[vi];
  return { ...prod,
    title: prod.title, subTitle: (v.sku && v.title) ? `${v.sku} · ${v.title}` : (v.sku || v.title || 'variant'),
    totalInv: v.inv, velocity: v.velocity, daysLeft: v.daysLeft, status: v.status,

}

function trendNote(p) {
  const isNew = p.variants.filter(v=>v.isNew);
  const spike = p.variants.filter(v=>v.trend==='spiking').length;
  const rise = p.variants.filter(v=>v.trend==='rising').length;
  const fall = p.variants.filter(v=>v.trend==='falling').length;
  if (isNew.length) {
    const age = Math.min(...isNew.map(v=>v.ageDays??99));
    return `<div class="trendnote rise">🆕 New product — forecasting from just ${age} day${age===1?'':'s'} of sales since launch (windows start at launch, so early numbers aren't diluted). Confidence improves daily.</div>`;
  }
  if (spike) return `<div class="trendnote spike">⚡ Sales are spiking well above the 90-day norm (promo?). The projection caps the spike at 2× baseline so one hot week doesn't trigger panic orders.</div>`;
  if (rise) return `<div class="trendnote rise">↗ Selling faster than the 90-day baseline — days-left leans on the recent rate.</div>`;
  if (fall && !rise) return `<div class="trendnote fall">↘ Cooling off vs the 90-day baseline.</div>`;
  return '';
}

function addD(ymd,n){ const d=new Date(ymd+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(5,10); }
function ymdAdd(ymd,n){ const d=new Date(ymd+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function mdLabel(ymd){ return `${MONTHS[+ymd.slice(5,7)-1]} ${+ymd.slice(8,10)}`; }

/** Interactive daily-sales chart: date ticks + hover tooltip (units + 7d avg). */
function salesChartHTML(p) {
  const n = p.series.length, H = 150;
  const hs = S.report?.historyStart || null;
  const dayOf = i => ymdAdd(p.seriesEnd, -(n-1-i));
  let startIdx = 0;
  if (hs) while (startIdx < n && dayOf(startIdx) < hs) startIdx++;
  const data = [];
  for (let i=0;i<n;i++){
    const nodata = i < startIdx;
    const from = Math.max(startIdx, i-6);
    const win = p.series.slice(from, i+1);
    data.push({ day: dayOf(i), qty: p.series[i], nodata,
      avg: nodata ? 0 : win.reduce((a,b)=>a+b,0)/win.length });
  }
  S.chart = data;
  const max = Math.max(1, ...data.filter(d=>!d.nodata).map(d=>d.qty));
  S.chartMax = max;
  // week ticks anchored to the most recent day, every 7 columns
  const ticks = [];
  for (let i=n-1; i>=startIdx; i-=7) ticks.push(i);
  const bars = data.map((d,i)=>{
    const h = d.nodata ? 0 : Math.max(d.qty/max*100, d.qty>0?2:0);
    return `<div class="cday ${d.nodata?'nodata':''} ${ticks.includes(i)&&i!==n-1?'tick':''}" data-i="${i}"><i style="height:${h.toFixed(1)}%"></i></div>`;
  }).join('');
  const line = data.map((d,i)=> d.nodata ? '' :
    `${i===startIdx?'M':'L'}${i+0.5},${(H-(d.avg/max)*H*0.94).toFixed(1)}`).join('');
  const tickHtml = ticks.map(i =>
    `<span style="left:${((i+0.5)/n*100).toFixed(2)}%">${mdLabel(data[i].day)}</span>`).join('');
  const noNote = startIdx>0 && startIdx<n
    ? `<div class="nodata-note" style="left:${(startIdx/2/n*100).toFixed(1)}%">tracking starts ${mdLabel(data[startIdx].day)}</div>` : '';
  return `<div class="chartwrap" onmousemove="chartHover(event)" onmouseleave="chartHover(null)">
    ${noNote}
    <svg class="lineov" viewBox="0 0 ${n} ${H}" preserveAspectRatio="none"><path d="${line}" fill="none" stroke="var(--brand-ink)" stroke-width="1.6" opacity=".85" vector-effect="non-scaling-stroke"/></svg>
    <div class="cbars">${bars}</div>
    <div class="cticks">${tickHtml}</div>
    <div class="ctip" id="ctip"></div>
    <div class="cdot" id="cdot"></div>
  </div>`;
}
function chartHover(e) {
  const tip = $('#ctip'), dot = $('#cdot'); if (!tip) return;
  const d = e && e.target.closest('.cday');
  const info = d && S.chart[+d.dataset.i];
  if (!info || info.nodata) { tip.style.display='none'; if (dot) dot.style.display='none'; return; }
  tip.innerHTML = `<b>${mdLabel(info.day)}</b> — ${info.qty} unit${info.qty===1?'':'s'}<br>7-day avg: ${info.avg.toFixed(1)}/day`;
  const r = d.getBoundingClientRect(), w = d.closest('.chartwrap').getBoundingClientRect();
  const x = r.left - w.left + r.width/2;
  // tooltip lives in the gutter above the chart so it never covers bars or the line
  tip.style.left = Math.min(Math.max(x, 85), w.width - 85) + 'px';
  tip.style.top = '-6px';
  tip.style.display = 'block';
  // marker dot pinned to the 7-day-average line at the hovered day
  if (dot) {
    dot.style.left = x + 'px';
    dot.style.top = (150 - (info.avg / S.chartMax) * 150 * 0.94) + 'px';
    dot.style.display = 'block';
  }
}

        <div class="sm">${isVar?`variant ${S.openVar+1} of ${prod.variants.length} · `:''}${esc(p.type||'no type')} · ${esc(p.vendor)} · ${p.profileName?`profile: ${esc(p.profileName)}`:'no profile'}</div></div>
      <div class="sh-nav">

        <button onclick="closeSheet()">✕</button>

    </div>

           return agg.map((w,i)=>`<tr><td>${w.days}-day</td><td class="r">${w.sold} sold</td><td class="r">${fmtV(w.rate)}/day</td><td class="r">${[45,35,20][i]}%</td><td></td></tr>`).join('');})()}

/** MOQ status line + inline editor (product-level; saved to Shopify metafield custom.moq). */
function moqHTML(prod) {
  const need = prod.combinedNeed || 0;
  const status = prod.moq
    ? (need >= prod.moq
        ? `<span style="color:var(--good);font-weight:600">combined need ${need} meets MOQ ✓</span>`
        : `<span style="color:var(--warn);font-weight:600">combined need ${need} is under MOQ — consider waiting until more variants need reordering</span>`)
    : '<span class="mini">no MOQ set — demand numbers shown without an order threshold</span>';
  return `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px">
    <b>Product MOQ</b><span class="mini">(applies to all variants combined)</span>
    <input type="number" id="moqInput" value="${prod.moq??''}" placeholder="—" min="0"
      style="width:90px;border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px">
    <button class="btn" onclick="saveMoq(this,'${prod.id}')">Save</button>
    <span id="moqMsg">${status}</span>
  </div>`;
}
/** Bulk-fill the MOQ table by product type (or all) — nothing saves until "Save changed MOQs". */
function moqFill() {
  const type = $('#moqFillType').value;
  const val = $('#moqFillVal').value.trim();
  let hit = 0;
  document.querySelectorAll('#moqTable input').forEach(inp => {
    if (type === '__all' || inp.dataset.type === type) { inp.value = val; hit++; }
  });
  const msg = $('#moqBulkMsg');
  msg.textContent = `Filled ${hit} row${hit === 1 ? '' : 's'} with ${val === '' ? 'blank (no MOQ)' : val} — review, then Save changed MOQs.`;
  msg.className = 'msg';
}
async function saveMoqBulk(btn) {
  const msg = $('#moqBulkMsg');
  const changed = [...document.querySelectorAll('#moqTable input')].filter(inp =>
    String(inp.value.trim()) !== String(inp.dataset.orig));
  if (!changed.length) { msg.textContent = 'Nothing changed.'; msg.className = 'msg'; return; }
  btn.disabled = true;
  let done = 0;
  try {
    for (const inp of changed) {
      msg.innerHTML = `<span class="spin"></span> Saving ${++done}/${changed.length}…`;
      await api('/api/set-moq?store=' + S.store, { method: 'POST',
        body: JSON.stringify({ productId: inp.dataset.pid, moq: Math.max(0, Number(inp.value) || 0) }) });
      inp.dataset.orig = inp.value.trim();
    }
    await refreshReport(true);
    msg.textContent = `Saved ${changed.length} MOQ${changed.length > 1 ? 's' : ''} to Shopify ✓`;
    msg.className = 'msg ok';
  } catch(e) {
    msg.textContent = `Saved ${done - 1} of ${changed.length} — ${e.message}`;
    msg.className = 'msg bad';
  }
  btn.disabled = false;
}
async function saveMoq(btn, pid) {
  const moq = Math.max(0, Number($('#moqInput').value) || 0);
  const msg = $('#moqMsg');
  btn.disabled = true; msg.innerHTML = '<span class="spin"></span> saving to Shopify…';
  try {
    await api('/api/set-moq?store=' + S.store, { method: 'POST',
      body: JSON.stringify({ productId: pid, moq }) });
    await refreshReport(true);
    const ni = S.visible.findIndex(p => p.id === pid);
    if (ni >= 0) { S.open = ni; renderSheet(); }
  } catch(e) { msg.innerHTML = `<span style="color:var(--bad)">${esc(e.message)}</span>`; btn.disabled = false; }
}
/** Horizontal bars: which variants drive the sell-through. */
function variantMixHTML(p) {
  const active = p.variants.filter(v => v.velocity > 0.001)
    .sort((a,b) => b.velocity - a.velocity);
  if (!active.length) return '';
  const total = active.reduce((s,v) => s + v.velocity, 0);
  const max = active[0].velocity;
  const quiet = p.variants.length - active.length;
  const rows = active.map((v,i) => {
    const vi = p.variants.indexOf(v);
    return `
    <div class="mixrow ${i===0?'top':''}">
      <div class="mname" onclick="openVar(${S.open},${vi})" title="Open variant">${esc(v.sku||v.title||'variant')}${v.title&&v.sku?` <span style="color:var(--muted)">· ${esc(v.title)}</span>`:''}</div>
      <div class="mixbar"><i style="width:${(v.velocity/max*100).toFixed(1)}%"></i></div>
      <div class="mval">${fmtV(v.velocity)}/day · ${(v.velocity/total*100).toFixed(0)}%</div>
    </div>`;
  }).join('');
  return `<div class="panel"><h4>Variant mix — who's selling</h4>
    <div class="sub">Share of this product's blended sell-through. Click a name to open that variant.</div>
    ${rows}${quiet?`<div class="mini" style="margin-top:8px">${quiet} variant${quiet>1?'s':''} with no meaningful recent sales not shown.</div>`:''}
  </div>`;
}
function statusDigestText(p) {
  const names = { stockout:'out', reorder:'reorder', watch:'watch', healthy:'ok', slow:'slow', unmapped:'unmapped', dormant:'dormant', muted:'muted' };
  return Object.entries(p.statusCounts||{}).filter(([,n])=>n>0)
    .map(([s,n])=>`${n} ${names[s]||s}`).join(' · ');
}
function todayYMD(){ return new Date().toLocaleDateString('en-CA'); } // local YYYY-MM-DD
function futureDate(days){ const d=new Date(); d.setDate(d.getDate()+days);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',
    ...(d.getFullYear()!==new Date().getFullYear()?{year:'2-digit'}:{})}); }

function planCalc() {
  const prod = S.visible[S.open]; if (!prod) return;
  const p = S.openVar>=0 && prod.variants[S.openVar] ? variantView(prod, S.openVar) : prod;
  const qty = Math.max(0, Number($('#planQty')?.value) || 0);
  const v = p.velocity, L = p.leadDays ?? 0, tgt = S.settings?.targetCoverDays || 180;
  const out = $('#planOut'), scen = $('#scen');
  if (v <= 0.001) { out.innerHTML = 'No meaningful sales — coverage is effectively unlimited.'; scen.innerHTML=''; return; }
  const total = (Math.max(p.totalInv,0) + qty) / v;           // days from today
  const after = total - L;                                     // days of cover once it lands
  const until = new Date(); until.setDate(until.getDate() + Math.round(total));
  out.innerHTML = after <= 0
    ? `<b>not enough</b> — you'd sell out ~${Math.abs(Math.round(after))}d before it even arrives`
    : `covered until <b>${until.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</b> — ~<b>${Math.round(after)}d</b> of stock after it lands (~${(after/30).toFixed(1)} months)`;

  const scenarios = [
    { lbl: `${Math.round(tgt*0.67)}d cover`, q: Math.max(0, Math.ceil(v*(tgt*0.67+L)-Math.max(p.totalInv,0))) },
    { lbl: `${tgt}d cover (target)`, q: Math.max(0, Math.ceil(v*(tgt+L)-Math.max(p.totalInv,0))), acc: true },
    { lbl: `${Math.round(tgt*1.5)}d cover`, q: Math.max(0, Math.ceil(v*(tgt*1.5+L)-Math.max(p.totalInv,0))) },
  ];
  const maxQ = Math.max(...scenarios.map(s=>s.q), qty, 1);
  scen.innerHTML = scenarios.map(s => `
    <div class="srow"><span>${s.lbl}</span>
      <div class="sbar ${s.acc?'acc':''}"><i style="width:${(s.q/maxQ*100).toFixed(1)}%"></i></div>
      <span class="sm">order ~${s.q} units</span></div>`).join('');
}

async function toggleMute(key) {
  const prodId = S.visible[S.open]?.id;
  const muted = new Set(S.settings.muted);
  muted.has(key) ? muted.delete(key) : muted.add(key);
  S.settings.muted = [...muted];
  await api('/api/settings', { method:'PUT', body: JSON.stringify({ muted: S.settings.muted }) });
  await refreshReport(true);
  // muting resorts the list — re-find the product so the sheet doesn't jump
  if (S.open >= 0 && prodId != null) {
    const ni = S.visible.findIndex(p => p.id === prodId);
    if (ni >= 0) { S.open = ni; renderSheet(); } else closeSheet();
  }
}

/* ================= actions ================= */
async function refreshReport(silent) {
  try {
    S.report = await api('/api/report?store=' + S.store);
    S.lastFetch = Date.now();
    // always a full render — count tiles, banners, and rows stay in sync with
    // every change (the bottom sheet lives outside #main, so it stays open;
    // callers re-find their product afterwards)
    render();
  } catch(e) { if (!silent) render(e.message); }
}
/* Keep the dashboard live without manual refreshes: silently re-pull every
 * 5 minutes, and immediately when the tab regains focus after being away.
 * Skipped while a panel/modal is open, in the report view (editable qtys),
 * or while typing in search — a refresh must never eat in-progress edits. */
function autoRefreshOK() {
  return S.tok && S.report && S.view === 'list' && S.open < 0
    && document.visibilityState === 'visible'
    && !document.querySelector('.modal.open')
    && document.activeElement?.id !== 'searchBox';
}
setInterval(() => { if (autoRefreshOK()) refreshReport(true); }, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => {
  if (autoRefreshOK() && Date.now() - (S.lastFetch || 0) > 5 * 60 * 1000) refreshReport(true);
});
$('#btnRefresh').onclick = () => doSnapshot($('#btnRefresh'));
$('#btnReport').onclick = () => { S.view = S.view === 'report' ? 'list' : 'report'; render(); };
async function doSnapshot(btn) {
  const old = btn.textContent; btn.textContent = '⏳ snapshotting…'; btn.disabled = true;
  try {
    await api('/api/snapshot?store=' + S.store, { method:'POST' });
    await refreshReport();
  } catch(e) {
    const gm = $('#gateMsg'); if (gm) { gm.textContent = e.message; gm.className='msg bad'; }
    else alert('Snapshot failed: ' + e.message);
  }
  btn.textContent = old; btn.disabled = false;
}

/* ================= info modal ================= */
$('#btnInfo').onclick = openInfo;
function openInfo() {
  S.modalKind = 'info';
  $('#mbox').innerHTML = `
    <button class="x" onclick="closeModal()">✕</button>
    <h3>How Restock works</h3>
    <div class="info">
    <p>Restock answers one question for every product: <b>"if I keep selling at my real pace, will I run out before a reorder could arrive?"</b> It checks Shopify every hour, forecasts per <b>variant</b> (each loft, size, and color is its own forecast), and alerts Slack when action is needed.</p>

    <h5>1 · Sell-through velocity</h5>
    <p>One window is never trusted on its own — yesterday can be a fluke, a single week can be a promo, a quarter can hide a trend. Velocity is a recency-weighted blend of three windows (all ending yesterday, so today's partial day never skews it):</p>
    <table><tr><th>Window</th><th>Weight</th><th>Why</th></tr>
      <tr><td>14 days</td><td class="r"><b>45%</b></td><td>reacts to real trend changes, smooths single-day flukes</td></tr>
      <tr><td>30 days</td><td class="r"><b>35%</b></td><td>the stabilizer</td></tr>
      <tr><td>90 days</td><td class="r"><b>20%</b></td><td>long-run baseline</td></tr></table>
    <p>Days where a variant sat at <b>zero stock</b> with zero sales don't count against it — being sold out isn't the same as selling slowly.</p>

    <h5>2 · Promo damper ⚡</h5>
    <p>If the 14-day rate runs hotter than <b>2× the 90-day baseline</b>, the item is flagged ⚡ <i>spiking</i> and the 14-day input is capped at 2× baseline in the blend. Forecasts still tighten (they should), but one viral week can't extrapolate into a panic order.</p>
    <div class="ex">Baseline 1/day, promo week hits 5/day → uncapped blend would claim ~2.8/day; the damped blend says ~1.6/day.</div>

    <h5>3 · New products 🆕</h5>
    <p>Windows start at the variant's <b>launch date</b>, so a product that's 10 days old is judged on its 10 real days — not diluted across 90 days of pre-launch zeros. New launches skip the promo damper (a strong launch <i>is</i> the baseline) and carry a 🆕 flag until they have 14 days of history.</p>

    <h5>4 · Status thresholds</h5>
    <p><code>days left = on-hand ÷ velocity</code> compared to <code>lead time = production + shipping + buffer</code>:</p>
    <table><tr><th>Status</th><th>Meaning</th></tr>
      <tr><td><span class="chip" data-s="reorder">Reorder now</span></td><td>days left ≤ lead time — order today or you'll stock out</td></tr>
      <tr><td><span class="chip" data-s="stockout">Out of stock</span></td><td>inventory ≤ 0 with recent sales</td></tr>
      <tr><td><span class="chip" data-s="watch">Watch</span></td><td>days left ≤ lead time + watch window (default 30d)</td></tr>
      <tr><td><span class="chip" data-s="healthy">Healthy</span></td><td>comfortable runway</td></tr>
      <tr><td><span class="chip" data-s="unmapped">Unmapped</span></td><td>no lead-time profile for its product type — fix in Settings</td></tr>
      <tr><td><span class="chip" data-s="dormant">Dormant</span></td><td>no stock and no sales in 90d — probably discontinued</td></tr></table>
    <div class="ex">100 units · selling 1/day → 100 days left. Lead time 60d production + 30d shipping + 10d buffer = 100d → <b>reorder now</b>: by the time a new batch lands you'd be at zero.</div>

    <h5>5 · Lead times</h5>
    <p>Resolved per product, most specific wins: ① Shopify metafield <code>custom.lead_time_days</code> on the product → ② the profile mapped to its <b>product type</b> in Settings → ③ neither = flagged unmapped. New products inherit automatically from their type — nothing to configure per SKU.</p>

    <h5>6 · Reorder quantities & MOQ</h5>
    <p><code>need = velocity × (target coverage + lead time) − on-hand</code> — enough to survive the lead-time burn <i>and</i> still land with your target coverage. The target is the <b>"Target coverage (days)"</b> number in Settings → Thresholds (default 180) — change it and every need quantity, MOQ comparison, and planner scenario recalculates immediately. Multi-variant products compute this per variant, since each size/loft sells at its own pace. It's a <b>demand signal, not an order instruction</b>.</p>
    <p>Set a product's <b>MOQ</b> in its reorder planner (saved to Shopify as metafield <code>custom.moq</code>). Restock then compares the <i>combined</i> need across all variants against it — Slack and the dashboard say "MOQ met ✓" or "under MOQ — consider waiting" so you know whether to order now or wait until more variants need restocking.</p>

    <h5>7 · Snapshots & Slack cadence</h5>
    <p>A <b>snapshot</b> is one full refresh cycle: pull the current catalog + inventory from Shopify, update the last few days of sales, recompute every forecast, and fire alerts if anything newly crossed red. Snapshots run <b>every hour</b> automatically; "Run snapshot now" in Settings does one on demand.</p>
    <p>The daily <b>digest</b> (🔴 + 🟡 lists with order suggestions) sends once a day at the time you pick in Settings. Instant 🔴 alerts can fire on <i>any</i> hourly check — transitions only, no repeat nagging.</p>

    <h5>8 · Marking orders as placed ✈</h5>
    <p>When you actually place a PO, hit <b>✈ Mark as ordered</b> on that product's card in the Order report — if you placed the order on an earlier day, set the <b>PO date</b> field (top of the report) first; the landing ETA is always PO date + lead time. The checked quantities are recorded as <b>incoming stock</b>: those variants flip from red to <span class="chip" data-s="onorder">✈ On order</span>, stop appearing in Slack digests and new order suggestions, and their "need" is computed net of what's already coming.</p>
    <p>To see just what's ordered, click the <b>✈ On order</b> tile on the dashboard (it appears whenever POs are open) — it filters the list to open POs, each showing quantity, order date, and expected landing date.</p>
    <p>The flag <b>clears itself</b> when the restock lands — any hourly check that sees inventory jump by at least half the ordered quantity counts as arrival. If the ETA passes with no arrival, the variant shows <b>overdue — confirm arrival</b>. You can also clear flags manually whenever an order is cancelled, arrived unnoticed, or was marked by mistake: <b>✈ clear PO</b> next to a single variant, <b>✈ clear all POs</b> in the product panel, or the <b>✕</b> on the blue on-order tag right in the dashboard list — all take effect immediately. If the ordered quantity is too small to outlast even the <i>next</i> lead-time cycle, the variant stays red — ordered, but still short.</p>

    <h5>9 · Muting</h5>
    <p>The <b>mute</b> button (in any product panel's variant table) silences an item everywhere — no alerts, no digest lines, and it moves to the gray "Other" bucket instead of showing red. Use it for discontinued products or dead size-runs you never plan to restock. Muting is reversible (unmute the same way) and takes effect immediately.</p>

    <h5>Data notes</h5>
    <p>Sales come from Shopify orders (cancellations excluded); inventory is the live total across locations. History deepens daily — young history (&lt;90d) means the 90-day window leans on what exists. Forecasts are math, not prophecy: they assume tomorrow sells like the recent past.</p>
    </div>`;
  $('#modal').classList.add('open');
}
