    <div class="set"><h5>Slack</h5>
      <div class="frow"><label>Alert channel</label>
        <select id="setChannel" style="min-width:220px"><option value="">loading channels…</option></select></div>
      <div class="frow"><label>Daily digest</label>
        <select id="setDigestMode">
          <option value="always" ${st.digestMode==='always'?'selected':''}>Every day, even all-clear</option>
          <option value="issues" ${st.digestMode==='issues'?'selected':''}>Only when something needs attention</option>
        </select></div>
      <div class="frow"><label>Digest send time (Central)</label>
        <select id="setDigestHour">${hourOpts}</select></div>
      <div class="msg">Inventory is re-checked every hour — instant 🔴 alerts can fire at any hour the moment something crosses its reorder point.</div>
    </div>

    <div class="set"><h5>Thresholds</h5>
      <div class="frow"><label>Buffer days (customs etc.)</label><input type="number" id="setBuffer" value="${st.bufferDays}" min="0"></div>
      <div class="frow"><label>Watch window (days early)</label><input type="number" id="setWatch" value="${st.watchWindow}" min="0"></div>
      <div class="frow"><label>Target coverage (days)</label><input type="number" id="setCover" value="${st.targetCoverDays}" min="30"></div>
    </div>

    <div class="set"><h5>Lead-time profiles</h5>
      <table class="ptable" id="profTable"><tr><th>Name</th><th class="r">Production d</th><th class="r">Shipping d</th><th></th></tr>${profRows}</table>
      <div class="actions"><button class="btn" onclick="addProfile()">+ Add profile</button></div>
    </div>

    <div class="set"><h5>Product type → profile</h5>
      <div class="msg" style="margin:0 0 8px">New products inherit automatically from their Shopify product type. Per-product override: metafield <code>custom.lead_time_days</code>.</div>
      <table id="typeTable"><tr><th>Product type</th><th>Profile</th></tr>${typeRows}</table>
    </div>

    ${noTypeFixHTML()}

    <div class="set" data-selfsave><h5>MOQs — bulk edit</h5>
      <details>
        <summary style="font-size:13px;color:var(--brand-ink);cursor:pointer">Edit MOQs for all products at once</summary>
        <div class="msg" style="margin:10px 0 8px">Blank = no MOQ. Each save writes to the product's <code>custom.moq</code> metafield in Shopify. Only changed rows are saved.</div>
        <div class="frow" style="margin-bottom:6px">
          <select id="moqFillType" style="min-width:150px">
            <option value="__all">All products</option>
            ${[...new Set((S.report?.products||[]).map(p=>p.type).filter(Boolean))].sort()
              .map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('')}
          </select>
          <input type="number" id="moqFillVal" min="0" placeholder="MOQ" style="width:90px">
          <button class="btn" onclick="moqFill()">Fill rows ↓</button>
          <span class="mini">fills the table — review, then Save (blank MOQ clears)</span>
        </div>
        <div style="max-height:320px;overflow-y:auto"><table id="moqTable">
          <tr><th>Product</th><th>Type</th><th class="r">MOQ</th></tr>
          ${(S.report?.products || []).slice().sort((a,b)=>a.title.localeCompare(b.title)).map(p => `
            <tr><td>${esc(p.title)}</td>
            <td><span class="tag">${esc(p.type||'—')}</span></td>
            <td class="r"><input type="number" min="0" placeholder="—" value="${p.moq??''}"
              data-pid="${p.id}" data-type="${esc(p.type||'')}" data-orig="${p.moq??''}"
              style="width:90px;border:1px solid var(--line-strong);border-radius:7px;padding:5px 8px"></td></tr>`).join('')}
        </table></div>
        <div class="actions">
          <button class="btn" onclick="saveMoqBulk(this)">Save changed MOQs</button>
          <span class="msg" id="moqBulkMsg"></span>
        </div>
      </details>
    </div>

    <div class="set"><h5>Data</h5>
      <div class="actions">
        <button class="btn" onclick="doSnapshot(this)">Run snapshot now</button>
        <button class="btn" onclick="doBackfill(this)">Backfill 90 days of sales</button>
        <button class="btn" onclick="doDigest(this)">Send digest to Slack now</button>
      </div>
      <div class="msg" id="dataMsg"></div>
    </div>

    <div class="set"><h5>Change password</h5>
      <div class="frow"><label>New password</label><input type="text" id="newPass" placeholder="at least 8 characters" autocomplete="off"></div>
      <div class="actions"><button class="btn" onclick="changePassword(this)">Update password</button><span class="msg" id="passMsg"></span></div>
      <div class="msg">Takes effect immediately for everyone; this device stays signed in with the new one.</div>
    </div>

    <div class="set"><h5>Connection</h5>
      <div class="frow"><label>Worker URL</label><input type="text" id="setUrl" value="${esc(S.url)}"></div>
    </div>

    <div class="actions">
      <button class="btn pri" onclick="saveSettings(this)">Save settings</button>
      <span class="msg" id="saveMsg"></span>
    </div>`;
  $('#modal').classList.add('open');
  $('#profTable').addEventListener('input', syncTypeOptions);
  loadChannels(st);
}
/** Products with a blank Shopify product type + inline fix that writes back to Shopify. */
function noTypeFixHTML() {
  const noType = (S.report?.products || []).filter(p => !p.type);
  if (!noType.length) return '';
  const existing = [...new Set([
    ...(S.report?.products || []).map(p => p.type).filter(Boolean),
    ...Object.keys(S.settings?.typeMap || {}).filter(Boolean),
  ])].sort();
  S.allTypes = existing;
  return `<div class="set"><h5>⚠️ Products missing a type</h5>
    <div class="msg" style="margin:0 0 10px">These have a blank Product Type in Shopify, so they can't inherit a lead-time profile. Assign one here — it's <b>written straight back to Shopify</b>. Pick an existing type or type a brand-new one.</div>
    ${noType.map(p => `<div class="frow" data-fixrow="${p.id}">
      <label style="min-width:200px" title="${esc(p.title)}">${esc(p.title)}</label>
      <div class="combo">
        <input type="text" placeholder="e.g. Head Cover" autocomplete="off"
          onfocus="showCombo(this)" oninput="showCombo(this)" onblur="hideCombo(this)"
          onkeydown="if(event.key==='Escape')hideCombo(this,0)">
        <div class="combo-list"></div>
      </div>
      <button class="btn" onclick="applyType(this,'${p.id}')">Apply</button>
    </div>`).join('')}
    <div class="msg" id="typeFixMsg"></div>
  </div>`;
}
function showCombo(inp) {
  const list = inp.parentElement.querySelector('.combo-list');
  const q = inp.value.trim().toLowerCase();
  const hits = (S.allTypes || []).filter(t => !q || t.toLowerCase().includes(q));
  list.innerHTML = hits.map(t => `<div onmousedown="pickCombo(event,this)">${esc(t)}</div>`).join('')
    + (q && !hits.some(t => t.toLowerCase() === q)
        ? `<div class="newt">↳ new type "${esc(inp.value.trim())}" — hit Apply to create it</div>` : '');
  list.style.display = list.innerHTML ? 'block' : 'none';
}
function pickCombo(ev, el) {
  ev.preventDefault(); // fires before blur so the click always lands
  const combo = el.closest('.combo');
  combo.querySelector('input').value = el.textContent;
  combo.querySelector('.combo-list').style.display = 'none';
}
function hideCombo(inp, delay = 150) {
  setTimeout(() => {
    const l = inp.parentElement.querySelector('.combo-list');
    if (l) l.style.display = 'none';
  }, delay);
}
async function applyType(btn, pid) {
  const row = btn.closest('[data-fixrow]');
  const type = row.querySelector('input').value.trim();
  const msg = $('#typeFixMsg');
  if (!type) { msg.textContent = 'Pick or type a product type first.'; msg.className = 'msg bad'; return; }
  btn.disabled = true; msg.innerHTML = '<span class="spin"></span> Writing to Shopify…'; msg.className = 'msg';
  try {
    await api('/api/set-type?store=' + S.store, { method: 'POST',
      body: JSON.stringify({ productId: pid, type }) });
    await refreshReport(true);
    const wasDirty = S.dirty;
    openSettings(); S.dirty = wasDirty;   // keep any other unsaved edits flagged
    const isNewType = !(S.settings.typeMap || {})[type];
    $('#saveMsg').textContent = `Type "${type}" saved to Shopify ✓${isNewType ? ' — now map it to a profile above' : ''}`;
    $('#saveMsg').className = 'msg ok';
  } catch(e) { msg.textContent = e.message; msg.className = 'msg bad'; btn.disabled = false; }
}
/** Read profile rows as they currently stand (stable ids; temp ids for new rows). */
function readProfileRows() {
  return [...$('#profTable').querySelectorAll('tr')].slice(1).map(tr => {
    const [nm, pd, sd] = tr.querySelectorAll('input');
    const name = nm.value.trim();
    return name ? { id: tr.dataset.pid, name,
      productionDays: +pd.value||0, shippingDays: +sd.value||0 } : null;
  }).filter(Boolean);
}
/** Keep the type-map dropdowns in sync while profiles are edited — no save/reopen needed. */
function syncTypeOptions() {
  const profs = readProfileRows();
  document.querySelectorAll('#typeTable select').forEach(sel => {
    const cur = sel.value;
    sel.innerHTML = '<option value="">— unmapped —</option>' + profs.map(p =>
      `<option value="${esc(p.id)}" ${p.id===cur?'selected':''}>${esc(p.name)} (${p.productionDays}+${p.shippingDays}d)</option>`).join('');
    sel.closest('tr').classList.toggle('unm', !sel.value);
  });
}
function closeModal(){
  if (S.modalKind === 'settings' && S.dirty &&
      !confirm('You have unsaved changes.\n\nOK = discard them · Cancel = stay (use "Save settings" to keep them)')) return;
  S.dirty = false;
  $('#modal').classList.remove('open');
}
$('#modal').addEventListener('click', e => { if (e.target.id==='modal') closeModal(); });
// any edit inside the settings modal marks it dirty (password applies instantly, so it's exempt)
$('#mbox').addEventListener('input', e => {
  if (S.modalKind === 'settings' && e.target.id !== 'newPass'
      && !e.target.closest('[data-fixrow],[data-selfsave]')) S.dirty = true;
});

async function loadChannels(st) {
  try {
    const { channels } = await api('/api/channels');
    const cur = st.stores?.[S.store]?.channel || '';
    $('#setChannel').innerHTML = '<option value="">— none —</option>' + channels
      .map(c => `<option value="${esc(c.id)}" ${c.id===cur?'selected':''}>#${esc(c.name)}${c.is_member?'':' (invite bot first)'}</option>`).join('');
  } catch(e) {
    $('#setChannel').innerHTML = `<option value="">Slack not configured (${esc(e.message)})</option>`;
  }
}
function addProfile() {
  const tr = document.createElement('tr');
  tr.dataset.pid = 'new-' + Math.random().toString(36).slice(2, 8);
  tr.innerHTML = `<td><input class="nm" value="New profile"></td>
    <td class="r"><input type="number" value="60" min="0"></td>
    <td class="r"><input type="number" value="30" min="0"></td>
    <td class="r"><button class="btn danger" onclick="this.closest('tr').remove();syncTypeOptions()">✕</button></td>`;
  $('#profTable').appendChild(tr);
  syncTypeOptions();
}
async function saveSettings(btn) {
  btn.disabled = true;
  // Existing rows keep their stable id (renames don't orphan the type map);
  // new rows get a slug id, and temp ids in the dropdowns are remapped.
  const idMap = {};
  const taken = new Set();
  const profiles = readProfileRows().map(p => {
    let id = p.id;
    if (!id || id.startsWith('new-')) {
      const slug = p.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40) || 'profile';
      let final = slug, k = 2;
      while (taken.has(final)) final = `${slug}-${k++}`;
      idMap[id] = final; id = final;
    }
    taken.add(id);
    return { ...p, id };
  });
  const typeMap = {};
  [...$('#typeTable').querySelectorAll('select')].forEach(sel => {
    const v = idMap[sel.value] || sel.value;
    if (v && profiles.some(p => p.id === v)) typeMap[sel.dataset.type] = v;
  });
  const body = {
    bufferDays: +$('#setBuffer').value, watchWindow: +$('#setWatch').value,
    targetCoverDays: +$('#setCover').value,
    digestMode: $('#setDigestMode').value,
    digestHourLocal: +$('#setDigestHour').value,
    profiles, typeMap, reviewedDefaults: true,
    stores: { [S.store]: { channel: $('#setChannel').value } },
  };
  try {
    S.url = $('#setUrl').value.trim() || DEFAULT_WORKER_URL;
    localStorage.setItem(LS.url, S.url);
    S.settings = await api('/api/settings', { method:'PUT', body: JSON.stringify(body) });
    S.dirty = false;
    await refreshReport(true);          // report is computed live — applies instantly
    openSettings();                     // re-render the modal with saved state
    $('#saveMsg').textContent = 'Saved ✓ — applied'; $('#saveMsg').className = 'msg ok';
  } catch(e) { $('#saveMsg').textContent = e.message; $('#saveMsg').className='msg bad'; }
  btn.disabled = false;
}
async function changePassword(btn) {
  const msg = $('#passMsg'), pw = $('#newPass').value.trim();
  if (pw.length < 8) { msg.textContent = 'At least 8 characters.'; msg.className = 'msg bad'; return; }
  btn.disabled = true;
  try {
    await api('/api/password', { method: 'POST', body: JSON.stringify({ password: pw }) });
    S.tok = pw; localStorage.setItem(LS.tok, pw);
    $('#newPass').value = '';
    msg.textContent = 'Password updated ✓ — this device is signed in with it.'; msg.className = 'msg ok';
  } catch(e) { msg.textContent = e.message; msg.className = 'msg bad'; }
  btn.disabled = false;
}
async function doBackfill(btn) {
  const msg = $('#dataMsg'); btn.disabled = true;
  msg.innerHTML = '<span class="spin"></span> Backfilling… this pulls every order from the last 90 days in chunks.';
  try {
    let done = false, total = 0, guard = 0;
    while (!done && guard++ < 40) {
      const r = await api('/api/backfill?store='+S.store, { method:'POST', body: JSON.stringify({ days: 90 }) });
      done = r.done; total = r.ordersProcessed;
      msg.innerHTML = `<span class="spin"></span> ${total} orders processed…`;
    }
    msg.innerHTML = `Backfill complete — ${total} orders. Running snapshot…`;
    await api('/api/snapshot?store='+S.store, { method:'POST' });
    await refreshReport(true);
    msg.textContent = `Backfill complete — ${total} orders → forecast updated.`; msg.className='msg ok';
  } catch(e) { msg.textContent = 'Backfill: ' + e.message; msg.className='msg bad'; }
  btn.disabled = false;
}
async function doDigest(btn) {
  const msg = $('#dataMsg'); btn.disabled = true;
  try { await api('/api/digest?store='+S.store, { method:'POST' });
    msg.textContent = 'Digest sent ✓ — check Slack.'; msg.className='msg ok';
  } catch(e) { msg.textContent = e.message; msg.className='msg bad'; }
  btn.disabled = false;
}

boot();
</script>
</body>
</html>
