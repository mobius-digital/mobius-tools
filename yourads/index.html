<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Your ads · Mobius Digital</title>
<link rel="icon" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* Your ads (2026-10-03): every ad Mobius ran for a client, newest first. One link per brand
   (?t=<their report token>), no login, no numbers. Data: account-health /api/your-ads/<token>. */
:root{
  --bg:#F4F7F9; --surface:#FFFFFF; --ink:#13202B; --ink-2:#3B4A57; --muted:#6B7A88;
  --line:#E1E8ED; --line-strong:#C9D4DC; --acc:#2F9AD6; --acc-ink:#FFFFFF; --acc-soft:#E6F3FB;
  --live:#1C7A46; --live-bg:#E4F2E9;
  --sans:'Instrument Sans',system-ui,-apple-system,Segoe UI,sans-serif; --serif:'Instrument Serif',Georgia,serif;
}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0E161C;--surface:#16212A;--ink:#EAF1F5;--ink-2:#C2CED7;--muted:#8FA0AD;--line:#243139;--line-strong:#33434E;--acc:#6CC3F0;--acc-ink:#0E161C;--acc-soft:#1B2E3B;--live:#5FD292;--live-bg:#15301F}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px 60px}
header{padding:28px 0 8px;display:flex;flex-direction:column;gap:10px}
.logo{height:28px;width:auto;align-self:flex-start}
.logo.d{display:none}
@media (prefers-color-scheme:dark){.logo.l{display:none}.logo.d{display:block}}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,6vw,42px);line-height:1.08;margin:6px 0 0;text-wrap:balance}
.lede{color:var(--ink-2);margin:0;max-width:62ch}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0 16px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{margin-left:auto;font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.media{position:relative;aspect-ratio:4/5;background:var(--acc-soft);border:0;padding:0;width:100%;display:block}
.media img{width:100%;height:100%;object-fit:cover;display:block;position:relative;z-index:1}
.media .none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
.play{z-index:2;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:rgba(19,32,43,.72);display:flex;align-items:center;justify-content:center}
.play::after{content:"";border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
.tag{z-index:2;position:absolute;left:10px;top:10px;font-size:11.5px;font-weight:700;letter-spacing:.02em;padding:3px 9px;border-radius:999px;background:var(--live-bg);color:var(--live)}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.name{font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
.when{font-size:12.5px;color:var(--muted)}
.empty,.center{text-align:center;padding:60px 0;color:var(--muted)}
.more{display:block;margin:22px auto 0;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:10px 20px;font-weight:600}
.view{position:fixed;inset:0;background:rgba(10,16,22,.82);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.view[hidden]{display:none}
.panel{background:var(--surface);border-radius:14px;max-width:min(560px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column}
.panel video,.panel img{display:block;width:100%;max-height:72vh;object-fit:contain;background:#000}
.panel iframe{width:min(500px,90vw);height:72vh;border:0;background:#fff}
.panel .row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px 14px;flex-wrap:wrap}
.panel .row .name{flex:1;min-width:0}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:600;font-size:13.5px;text-decoration:none;color:inherit}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.msg{padding:14px;font-size:13.5px;color:var(--muted)}
.btn:focus-visible,.chip:focus-visible,.media:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center">Loading your ads…</div></div>
<div class="view" id="view" hidden><div class="panel" id="panel"></div></div>
<script>
'use strict';
(function () {
const AH = 'https://mobius-account-health.mobius-digital.workers.dev';
const T = (new URLSearchParams(location.search).get('t') || '').replace(/[^a-f0-9]/g, '');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const day = s => { const d = new Date(String(s).slice(0, 10) + 'T12:00:00Z'); return isNaN(d) ? s : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' }); };
const img = id => `${AH}/api/your-ads/${T}/thumb?ad=${encodeURIComponent(id)}`;
const PAGE = 24;
let D = null, show = 'all', limit = PAGE;

async function boot() {
  if (!T) return fatal('This link is missing its code. Ask your Mobius contact for your ads link.');
  try {
    const r = await fetch(`${AH}/api/your-ads/${T}`);
    const j = await r.json();
    if (!r.ok) return fatal(j.error || 'This link is not valid.');
    D = j; document.title = `${j.brand} ads · Mobius Digital`; paint();
  } catch { fatal('Could not load your ads. Check your connection and try again.'); }
}
function fatal(m) { $('#app').innerHTML = `<div class="center">${esc(m)}</div>`; }

const isVideo = a => a.type === 'video';
const title = a => a.name || (isVideo(a) ? 'Video ad' : a.type === 'carousel' ? 'Carousel ad' : 'Image ad');
function list() {
  return D.ads.filter(a => show === 'all' || (show === 'live' && a.live) || (show === 'video' && isVideo(a)) || (show === 'image' && a.type && !isVideo(a)));
}
function paint() {
  const all = list();
  const shown = all.slice(0, limit);
  const live = D.ads.filter(a => a.live).length;
  const chip = (k, l) => `<button class="chip" data-f="${k}" aria-pressed="${show === k}">${l}</button>`;
  $('#app').innerHTML = `<header>
      <img class="logo l" src="../brand/mobius-logo.webp" alt="Mobius Digital"><img class="logo d" src="../brand/mobius-logo-white.webp" alt="Mobius Digital">
      <h1>${esc(D.brand)}: your ads</h1>
      <p class="lede">Every ad we have run for you, newest first. Tap one to watch it or see it full size, and download any you want to use elsewhere.</p>
    </header>
    <div class="bar">${chip('all', 'All')}${live ? chip('live', `Running now (${live})`) : ''}${D.ads.some(isVideo) ? chip('video', 'Videos') : ''}${D.ads.some(a => a.type && !isVideo(a)) ? chip('image', 'Images') : ''}
      <span class="count">${all.length} ad${all.length === 1 ? '' : 's'}</span></div>
    ${shown.length ? `<div class="grid">${shown.map(card).join('')}</div>` : `<div class="empty">${D.ads.length ? 'No ads match this filter.' : 'Your first ads show up here as soon as they go live.'}</div>`}
    ${all.length > shown.length ? `<button class="more" id="more">Show more (${all.length - shown.length} left)</button>` : ''}`;
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { show = b.dataset.f; limit = PAGE; paint(); });
  document.querySelectorAll('[data-ad]').forEach(b => b.onclick = () => open(D.ads.find(a => a.id === b.dataset.ad)));
  document.querySelectorAll('.media img').forEach(i => i.onerror = () => { i.remove(); });
  const m = $('#more'); if (m) m.onclick = () => { limit += PAGE; paint(); };
}
function card(a) {
  const when = a.live ? `Running since ${day(a.from)}` : (a.from === a.to ? `Ran ${day(a.from)}` : `Ran ${day(a.from)} to ${day(a.to)}`);
  return `<div class="card"><button class="media" data-ad="${esc(a.id)}" aria-label="Open ${esc(title(a))}">
      <span class="none">Preview loading</span><img loading="lazy" src="${img(a.id)}" alt="">
      ${isVideo(a) ? '<span class="play" aria-hidden="true"></span>' : ''}${a.live ? '<span class="tag">Running now</span>' : ''}</button>
    <div class="body"><div class="name">${esc(title(a))}</div><div class="when">${esc(when)}</div></div></div>`;
}

/* The full view: a video plays (or Meta's own preview when the file is not ours to hand out),
   an image shows full size. Download sits under it. */
async function open(a) {
  if (!a) return;
  const v = $('#view'), p = $('#panel');
  const row = extra => `<div class="row"><div class="name">${esc(title(a))}</div>${extra}<button class="btn" id="vClose">Close</button></div>`;
  p.innerHTML = `<div class="msg">Loading…</div>${row('')}`;
  v.hidden = false;
  const close = () => { v.hidden = true; p.innerHTML = ''; };
  v.onclick = e => { if (e.target === v) close(); };
  document.onkeydown = e => { if (e.key === 'Escape') close(); };
  $('#vClose').onclick = close;
  if (!isVideo(a)) {
    p.innerHTML = `<img src="${img(a.id)}" alt="">${row(`<a class="btn pri" href="${img(a.id)}&dl=1">Download</a>`)}`;
    $('#vClose').onclick = close; return;
  }
  try {
    const r = await fetch(`${AH}/api/ad-video?ad=${encodeURIComponent(a.id)}&yours=${T}`);
    const j = await r.json();
    if (j.src) p.innerHTML = `<video src="${esc(j.src)}" controls autoplay playsinline></video>${row(`<a class="btn pri" href="${esc(j.src)}" target="_blank" rel="noopener" download>Download</a>`)}`;
    else if (j.preview) p.innerHTML = `<iframe src="${esc(j.preview)}" title="Ad preview"></iframe>${row('<span class="note" style="font-size:12.5px;color:var(--muted)">This one plays in Meta\'s preview, so it cannot be downloaded here. Ask us for the file.</span>')}`;
    else p.innerHTML = `<img src="${img(a.id)}" alt=""><div class="msg">${esc(j.reason || j.error || 'This video cannot be played here. Ask us for the file.')}</div>${row('')}`;
  } catch { p.innerHTML = `<div class="msg">Could not load this video. Try again in a moment.</div>${row('')}`; }
  $('#vClose').onclick = close;
}
boot();
})();
</script>
</body>
</html>
