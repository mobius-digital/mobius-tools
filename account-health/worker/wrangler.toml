# Mobius Account Health — Cloudflare Worker config
# Deploy:  npx wrangler deploy   (from this folder)
name = "mobius-account-health"
main = "src/worker.js"
compatibility_date = "2026-07-01"

# 03:30 UTC nightly: re-pull the last 3 days of daily insights for every active
# account (Meta conversions settle late) + activity-log events + TW daily metrics.
# Hourly: the Daily Brief trigger fires every hour and the worker sends only when
# the CENTRAL hour matches the `briefHour` setting (default 9 = 9am Central, editable
# in Profit -> Settings). Cron expressions are fixed at deploy time and always UTC, so
# an hourly gate is the only way to make the time editable and keep it at the same
# wall-clock hour across daylight saving. Still two triggers, not three.
[triggers]
crons = ["30 3 * * *", "0 * * * *"]

# D1 database. Create once with:
#   npx wrangler d1 create mobius-account-health
# then paste the returned database_id below and apply the schema:
#   npx wrangler d1 execute mobius-account-health --remote --file=schema.sql
[[d1_databases]]
binding = "DB"
database_name = "mobius-account-health"
database_id = "93e7cdeb-19a9-4950-8146-e24b189f410f"

# Public config (Google OAuth client id is public by design; used to verify sign-ins).
[vars]
GOOGLE_CLIENT_ID = "1095210859237-eqn8nsr9p3mcui7cuq17l3jas4dgpl8a.apps.googleusercontent.com"
# SUBREQUEST BUDGET. Cloudflare counts every fetch AND every D1 query against a
# single invocation: 50 on the free plan, 10,000 on Workers Paid. The scheduled
# jobs measure what they spend and stop while they can still record what they
# did, so nothing is ever killed mid-brand — they just do fewer brands per tick
# and pick the rest up on the next one.
#
# Workers Paid since 2026-09-01, so the real ceiling is 10,000. Every job now
# finishes in one tick instead of spreading over several.
#
# THIS IS A CEILING, NOT PERMISSION TO STOP COUNTING. The jobs still measure
# what they spend and still stop before the wall — that is what keeps a brand
# from being killed mid-brief, and it is what will make the next problem show up
# as "deferred" in Settings instead of as silence. Measured cost of one brief on
# 2026-09-01: 51 subrequests. Six brands plus reports plus syncs is comfortably
# inside 10,000, but "comfortably inside" is a thing you know by counting.
SUBREQUEST_LIMIT = "10000"

# Secrets (set once, never committed):
#   npx wrangler secret put META_TOKEN        system-user token, ads_read on every client ad account
#   npx wrangler secret put ADMIN_TOKEN       long random string; master key for the dashboard
#   npx wrangler secret put SESSION_SECRET    long random string; signs Google sessions (share the SAME
#                                             value across all tool workers so one sign-in works everywhere)
#   npx wrangler secret put SLACK_BOT_TOKEN   (Chat 2) same Slack app as Pulse / Restock
