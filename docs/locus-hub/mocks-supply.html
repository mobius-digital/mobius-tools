<meta charset="utf-8">
<title>Locus Stock Mock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Locus v3 shell, graphite, dark first. Same tokens as profit/v2.css.
   Layout: rail + top bar + page tabs; one plain sentence, tiles, then a picture of the problem; tables only inside panels. */
:root{
  --g1:#131316; --g2:#1A1A1E; --g3:#212126; --g4:#28282E; --g5:#303038; --g6:#3A3A43; --g7:#4A4A55; --g8:#5E5E6A; --g10:#8E8E9A; --g11:#B4B4BE; --g12:#F2F2F4;
  --bg:var(--g1); --rail:#0F0F12; --card:var(--g2); --card-hi:var(--g3); --line:var(--g5); --line-strong:var(--g6);
  --ink:var(--g12); --ink-2:var(--g11); --muted:var(--g10); --faint:var(--g8);
  --accent:#8FB3FF; --accent-ink:#0E1420; --accent-soft:rgba(143,179,255,.14);
  --good:#5FD292; --warn:#EBBF63; --bad:#F09182;
  --good-bg:rgba(95,210,146,.14); --warn-bg:rgba(235,191,99,.14); --bad-bg:rgba(240,145,130,.14);
  --good-bar:#3F9D69; --warn-bar:#C29440; --bad-bar:#C9665A; --track:#222228;
  --bar:#4A4A55; --bar-hi:#8FB3FF; --scrim:rgba(0,0,0,.5); --tipbg:#F2F2F4; --tipink:#131316; --bf:#C9A2FF;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; --r:10px; color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --g1:#F6F6F7; --g2:#FFFFFF; --g3:#F3F3F5; --g4:#ECECEF; --g5:#E2E2E7; --g6:#D5D5DC; --g7:#C2C2CB; --g8:#9A9AA6; --g10:#6B6B78; --g11:#45454F; --g12:#151518;
  --rail:#EDEDF0; --accent:#2F62D9; --accent-ink:#FFFFFF; --accent-soft:rgba(47,98,217,.12);
  --good:#1C7A46; --warn:#8F6412; --bad:#9C3A2E; --good-bg:#E4F2E9; --warn-bg:#F8EED6; --bad-bg:#F7E7E4;
  --good-bar:#4FAE78; --warn-bar:#D9A84C; --bad-bar:#D9786B; --track:#EFEFF2;
  --bar:#C2C2CB; --bar-hi:#2F62D9; --scrim:rgba(20,20,24,.35); --tipbg:#151518; --tipink:#FFFFFF; --bf:#7B4FD1; color-scheme:light } }
:root[data-theme="light"]{
  --g1:#F6F6F7; --g2:#FFFFFF; --g3:#F3F3F5; --g4:#ECECEF; --g5:#E2E2E7; --g6:#D5D5DC; --g7:#C2C2CB; --g8:#9A9AA6; --g10:#6B6B78; --g11:#45454F; --g12:#151518;
  --rail:#EDEDF0; --accent:#2F62D9; --accent-ink:#FFFFFF; --accent-soft:rgba(47,98,217,.12);
  --good:#1C7A46; --warn:#8F6412; --bad:#9C3A2E; --good-bg:#E4F2E9; --warn-bg:#F8EED6; --bad-bg:#F7E7E4;
  --good-bar:#4FAE78; --warn-bar:#D9A84C; --bad-bar:#D9786B; --track:#EFEFF2;
  --bar:#C2C2CB; --bar-hi:#2F62D9; --scrim:rgba(20,20,24,.35); --tipbg:#151518; --tipink:#FFFFFF; --bf:#7B4FD1; color-scheme:light }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.4;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:18px 48px}
button{font:inherit;color:inherit}
.note{max-width:1440px;margin:0 auto 12px;color:var(--muted);font-size:12.5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.note b{color:var(--ink);margin-right:6px}
.note .grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding:3px;border:1px solid var(--line);border-radius:10px}
.note .grp em{font-style:normal;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:0 6px}
.note button{font-weight:600;font-size:12px;border:1px solid transparent;background:transparent;padding:4px 9px;border-radius:7px;cursor:pointer;color:var(--ink-2)}
.note button.on{background:var(--ink);color:var(--bg)}
.note .sp{flex:1}
.frame{max-width:1440px;margin:0 auto;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg);display:grid;grid-template-columns:196px minmax(0,1fr);position:relative;min-height:780px}
@media (max-width:900px){.frame{grid-template-columns:1fr}.rail{display:none}}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:4px}
.rail .brand{display:flex;align-items:center;gap:9px;padding:2px 8px 12px;border-bottom:1px solid var(--line);margin-bottom:8px}
.rail .brand i{width:22px;height:22px;border-radius:6px;background:var(--accent)}
.rail .brand b{font-size:15px;font-weight:600}
.rail .pick{padding:7px 9px;border:1px solid var(--line-strong);border-radius:8px;background:var(--card);display:flex;justify-content:space-between;font-weight:600;margin-bottom:8px}
.rail .pick span{color:var(--muted);font-weight:400}
.rail a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;color:var(--ink-2);font-weight:500}
.rail a i{width:7px;height:7px;border-radius:2px;background:var(--faint)}
.rail a.on{background:var(--accent-soft);color:var(--ink)} .rail a.on i{background:var(--accent)}
.rail .foot{margin-top:auto;display:grid;gap:2px;border-top:1px solid var(--line);padding-top:8px}
.content{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 22px;border-bottom:1px solid var(--line)}
.ask{flex:1;min-width:200px;max-width:520px;padding:7px 11px;border:1px solid var(--line-strong);border-radius:8px;background:var(--card);color:var(--faint)}
.ctl{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--card);font-size:12.5px;color:var(--ink-2)}
.ctl b{color:var(--ink);font-weight:600}
.tabs{display:flex;gap:2px;padding:10px 22px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs span{padding:8px 12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs span.on{color:var(--ink);border-color:var(--accent)}
.tabs span.new::after{content:"new";font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-left:6px;vertical-align:1px}
.tabs span.off{opacity:.45}
.main{padding:20px 22px 60px;display:grid;gap:16px;min-width:0}
.head{display:grid;gap:6px}
.head .eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.head h1{font-size:21px;font-weight:650;margin:0;letter-spacing:-.015em;text-wrap:balance;max-width:58ch}
.head p{margin:0;color:var(--muted);font-size:13px;max-width:90ch}
.head p b{color:var(--ink-2);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--line-strong);background:var(--card);font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--g7)} .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .btn.sm{padding:4px 9px;font-size:12px} .btn.q{background:transparent}
.btn:focus-visible,.note button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.tiles{grid-template-columns:1fr}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;display:grid;gap:4px;min-width:0;align-content:start}
.tile .l{font-size:12px;color:var(--muted)}
.tile .v{font-size:26px;font-weight:650;letter-spacing:-.02em;line-height:1.1;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.tile .v small{font-size:12.5px;font-weight:500;color:var(--muted);letter-spacing:0}
.tile .sub{font-size:12px;color:var(--muted)} .tile .sub b{color:var(--ink-2);font-weight:600}
.tile.bad .v{color:var(--bad)} .tile.warn .v{color:var(--warn)} .tile.good .v{color:var(--good)}
.meter{height:6px;border-radius:3px;background:var(--track);overflow:hidden;display:flex;margin-top:6px}
.meter i{display:block;height:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;min-width:0}
.card h2{font-size:13.5px;font-weight:650;margin:0}
.ch{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ch .cap{font-size:12px;color:var(--muted)} .ch .r{margin-left:auto}
.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.lanes{grid-template-columns:1fr}}
.lane{border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.lane .lh{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:2px}
.lane .lh b{font-size:13.5px;display:flex;align-items:center;gap:8px}
.lane .lh b i{width:9px;height:9px;border-radius:50%}
.lane .lh span{font-size:12px;color:var(--muted)}
.lane.bad .lh{background:linear-gradient(var(--bad-bg),var(--bad-bg))} .lane.bad .lh b i{background:var(--bad)}
.lane.good .lh{background:linear-gradient(var(--good-bg),var(--good-bg))} .lane.good .lh b i{background:var(--good)}
.lane.warn .lh{background:linear-gradient(var(--warn-bg),var(--warn-bg))} .lane.warn .lh b i{background:var(--warn)}
.li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0} .li:hover{background:var(--card-hi)}
.av{width:30px;height:30px;border-radius:7px;background:var(--g4);display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--ink-2)}
.li .t{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .n{text-align:right;font-size:12.5px;font-weight:600;white-space:nowrap} .li .n span{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.lane .more{padding:9px 14px;font-size:12px;color:var(--muted)}
/* runway */
.rw{display:grid;gap:0}
.rwh,.rwr{display:grid;grid-template-columns:minmax(150px,230px) 74px minmax(0,1fr) 108px;gap:12px;align-items:center}
.rwh{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-bottom:8px;border-bottom:1px solid var(--line)}
.rwr{padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
.rwr:hover{background:var(--card-hi)} .rwr:last-child{border-bottom:0}
.rwr .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .rwr .nm span{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.rwr .adv{text-align:right;font-size:12px;color:var(--ink-2)} .rwr .adv.none{color:var(--faint)}
.rwr .end{font-size:12px;font-weight:600;text-align:right;white-space:nowrap}
.trk{position:relative;height:14px;border-radius:4px;background:var(--track)}
.trk .seg{position:absolute;top:0;bottom:0;border-radius:4px}
.trk .seg.good{background:var(--good-bar)} .trk .seg.warn{background:var(--warn-bar)} .trk .seg.bad{background:var(--bad-bar)} .trk .seg.after{background:var(--good-bar);opacity:.55}
.trk .gap{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--bad-bar) 0 2px,transparent 2px 6px);opacity:.75}
.trk .land{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;transform:rotate(45deg);background:var(--good);border:2px solid var(--card)}
.trk .arrow{position:absolute;right:-1px;top:2px;bottom:2px;width:0;border-left:6px solid var(--good-bar);border-top:5px solid transparent;border-bottom:5px solid transparent;transform:translateX(100%)}
.axis{position:relative;height:16px}
.axis span{position:absolute;transform:translateX(-50%);font-size:10.5px;color:var(--faint);white-space:nowrap;text-transform:none;letter-spacing:0;font-weight:500}
.axis span.bf{color:var(--bf);font-weight:700}
.rwbody{position:relative}
.trk .bfl{position:absolute;top:-8px;bottom:-8px;width:0;border-left:1.5px dashed var(--bf);pointer-events:none;opacity:.85}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center;margin-top:10px}
.lg i{width:14px;height:8px;border-radius:2px;display:inline-block;vertical-align:middle;margin-right:5px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid var(--line-strong);color:var(--ink-2);background:var(--card);cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;vertical-align:1px}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.good{background:var(--good-bg);color:var(--good)} .pill.n{background:var(--g4);color:var(--ink-2)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:middle}
th.l,td.l{text-align:left} th:first-child,td:first-child{padding-left:0} tr:last-child td{border-bottom:0}
tr.link{cursor:pointer} tr.link:hover td{background:var(--card-hi)}
td .sub{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:2px;white-space:normal}
td .nm{font-weight:600}
.late{color:var(--bad);font-weight:600} .muted{color:var(--muted)} .good-t{color:var(--good);font-weight:600} .warn-t{color:var(--warn);font-weight:600}
/* buying */
.fo{border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.fo .foh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.fo .foh h3{margin:0;font-size:15px;font-weight:650;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fo .facts{display:flex;gap:22px;flex-wrap:wrap;margin-top:8px}
.fo .facts div{display:grid;gap:1px} .fo .facts span{font-size:11.5px;color:var(--muted)} .fo .facts b{font-size:15px;font-weight:650}
.fo .rows{padding:0 16px}
.ord{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 90px 150px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ord:last-child{border-bottom:0} .ord:hover{background:var(--card-hi)}
.ord .t{font-weight:600} .ord .s{font-size:12px;color:var(--muted)}
.ord .q{text-align:right;font-weight:650;font-size:14px} .ord .q span{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.ord .why{font-size:12px;color:var(--ink-2)}
@media (max-width:760px){.ord{grid-template-columns:1fr 1fr}}
.tl{position:relative;height:46px;margin:6px 0 2px}
.tl .base{position:absolute;left:0;right:0;top:20px;height:6px;border-radius:3px;background:var(--track)}
.tl .done{position:absolute;left:0;top:20px;height:6px;border-radius:3px;background:var(--accent)}
.tl .dot{position:absolute;top:16px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--card);border:2px solid var(--line-strong)}
.tl .dot.d{background:var(--accent);border-color:var(--accent)}
.tl .lab{position:absolute;top:34px;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
.tl .lab b{color:var(--ink);font-weight:600}
.tl .now{position:absolute;top:2px;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--accent);letter-spacing:.06em}
.tl2{height:84px;margin:4px 6px}.tl2 .base{top:36px}.tl2 .dot{top:32px}.tl2 .band{top:30px}.tl2 .lab.up{top:6px}.tl2 .lab.dn{top:54px}
.tl .band{position:absolute;top:14px;height:18px;background:repeating-linear-gradient(135deg,var(--g6) 0 2px,transparent 2px 6px);border-radius:3px}
/* drops */
.duegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.duegrid div{padding:10px 12px;border:1px solid var(--line);border-radius:8px;display:grid;gap:2px}
.duegrid em{font-style:normal;font-size:12px;font-weight:650} .duegrid b{font-size:13px} .duegrid span{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:1150px){.two{grid-template-columns:1fr}}
.kc .rank{display:grid;grid-template-columns:16px minmax(0,1fr) 90px 26px 92px;gap:8px;align-items:center;padding:6px 0;font-size:12.5px;border-bottom:1px solid var(--line)}
.kc .rank:last-child{border-bottom:0}
.kc .rank .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kc .rank .b{height:7px;border-radius:2px;background:var(--bar)}
.kc .rank.cut .b{background:var(--warn-bar)} .kc .rank.cut .n{color:var(--muted)}
.mini-seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;justify-self:end}
.mini-seg span{font-size:11px;font-weight:600;padding:2px 8px;color:var(--muted);cursor:pointer}
.mini-seg span.on{background:var(--ink);color:var(--bg)}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 12px}
.nums div b{display:block;font-size:22px;font-weight:650} .nums div span{font-size:11.5px;color:var(--muted)}
.curve{display:flex;gap:6px;align-items:flex-end;height:84px;margin-top:10px}
.curve div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.curve i{width:100%;border-radius:3px 3px 0 0;background:var(--bar)} .curve i.hi{background:var(--bar-hi)}
.curve span{font-size:10.5px;color:var(--muted)} .curve em{font-style:normal;font-size:11px;font-weight:600}
.warnbox{padding:10px 12px;border-radius:8px;background:var(--warn-bg);font-size:12.5px;margin-bottom:10px}
.warnbox b{color:var(--warn)}
.infobox{padding:10px 12px;border-radius:8px;background:var(--accent-soft);font-size:12.5px}
.infobox b{color:var(--accent)}
/* setup */
.layers{display:grid;gap:12px}
.layer{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:16px;align-items:start;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.layer .num{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:18px;background:var(--g4);color:var(--ink-2)}
.layer.on .num{background:var(--accent);color:var(--accent-ink)}
.layer h3{margin:0 0 4px;font-size:15px;font-weight:650}
.layer p{margin:0 0 8px;color:var(--muted);max-width:80ch}
.layer ul{margin:0;padding-left:18px;display:grid;gap:4px;color:var(--ink-2)}
.layer .who{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:4px}
.sw{position:relative;width:36px;height:20px;border-radius:99px;background:var(--accent);display:inline-block;flex:none}
.sw::after{content:"";position:absolute;right:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff}
.sw.off{background:var(--g6)} .sw.off::after{left:3px;right:auto}
.brandgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:10px}
.brandgrid div{padding:9px 11px;border:1px solid var(--line);border-radius:8px;display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:600}
/* panel */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20}
.panel{position:absolute;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--bg);border-left:1px solid var(--line-strong);z-index:21;overflow-y:auto;padding:18px 20px 30px;display:grid;gap:14px;align-content:start}
.panel .ph{display:flex;gap:12px;align-items:flex-start}
.panel .ph h3{margin:0;font-size:17px;font-weight:650}
.panel .ph .x{margin-left:auto;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
.panel .meta{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.verdict{padding:12px 14px;border-radius:10px;display:grid;gap:3px}
.verdict.bad{background:var(--bad-bg)} .verdict.good{background:var(--good-bg)} .verdict.warn{background:var(--warn-bg)}
.verdict b{font-size:14px} .verdict.bad b{color:var(--bad)} .verdict.good b{color:var(--good)} .verdict.warn b{color:var(--warn)}
.verdict span{font-size:12.5px;color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}}
.stats div{padding:10px 12px;border-right:1px solid var(--line)} .stats div:last-child{border-right:0}
.stats .l{font-size:11.5px;color:var(--muted)} .stats .v{font-size:18px;font-weight:650;margin:2px 0} .stats .s{font-size:11.5px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;font-weight:500}
.field input,.field select{width:100%;padding:7px 9px;border-radius:8px;border:1px solid var(--line-strong);background:var(--card);color:var(--ink);font:inherit}
.what{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;font-size:12.5px;margin-top:8px}
.what span{display:block;font-size:11.5px;color:var(--muted)}
/* ads mock */
.chipst{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap}
.chipst.bad{background:var(--bad-bg);color:var(--bad)} .chipst.warn{background:var(--warn-bg);color:var(--warn)} .chipst.good{background:var(--good-bg);color:var(--good)}
.tip{position:fixed;pointer-events:none;background:var(--tipbg);color:var(--tipink);font-size:12px;padding:6px 9px;border-radius:7px;z-index:50;max-width:300px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-weight:600;z-index:60}
@media (prefers-reduced-motion: no-preference){.panel{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}

function chartSVG(p, what) {
  const W = 680, Hh = 220, padT = 14, padB = 24, x0 = 8, xT = x0 + 200, x1 = W - 8, vel = p.vel;
  const adds = p.incs.map(([d, q]) => [between(T, d), q]);
  const run = extra => { const out = []; let s = Math.max(0, p.oh); for (let d = 0; d <= H; d++) { for (const [ad, q] of extra) if (ad === d) s += q; out.push(s); s = Math.max(0, s - vel); } return out; };

  const scen = ld != null && what.qty > 0 ? run([...adds, [ld, what.qty]]) : null;

  p.ser.forEach((v, i) => { const y = yS(v); g += `<rect x="${xs(i).toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1, (xT - x0) / 90 - .6).toFixed(1)}" height="${(Hh - padB - y).toFixed(1)}" style="fill:var(--bar)" data-tip="${day(add(T, i - 90))}: ${v} sold"/>`; });
  const ref = scen || base; let a = null;
  for (let d = 0; d <= H + 1; d++) { const z = d <= H && ref[d] <= 0; if (z && a == null) a = d; if (!z && a != null) { g += `<rect x="${xu(a)}" y="${padT}" width="${Math.max(2, xu(d) - xu(a))}" height="${Hh - padT - padB}" style="fill:var(--bad-bg)"/>`; a = null; } }
  const path = arr => arr.map((u, d) => (d ? 'L' : 'M') + xu(d).toFixed(1) + ',' + yU(u).toFixed(1)).join('');
  g += `<path d="${path(base)}" fill="none" style="stroke:var(--muted)" stroke-width="1.8"/>`;
  if (scen) g += `<path d="${path(scen)}" fill="none" style="stroke:var(--accent)" stroke-width="2.2" stroke-dasharray="5 3"/>`;
  g += `<line x1="${xu(BFd)}" x2="${xu(BFd)}" y1="${padT}" y2="${Hh - padB}" style="stroke:var(--bf)" stroke-dasharray="3 3"/><text x="${xu(BFd) + 4}" y="${padT + 10}" font-size="10.5" font-weight="700" style="fill:var(--bf)">Black Friday</text>`;

  for (const [d, q] of p.incs) { const dd = between(T, d); if (dd >= 0 && dd <= H) g += `<circle cx="${xu(dd)}" cy="${yU(base[dd])}" r="4" style="fill:var(--good)"/><text x="${Math.min(xu(dd) + 6, x1 - 110)}" y="${yU(base[dd]) - 7}" font-size="10.5" font-weight="600" style="fill:var(--good)">+${int(q)} land ${day(d)}</text>`; }

  return `<div class="tbl"><svg viewBox="0 0 ${W} ${Hh}" style="width:100%;min-width:520px;display:block" role="img" aria-label="Daily sales, then stock on the shelf">${g}</svg></div>`;
}

          ${Object.entries(groups).sort((a, b) => a[0] < b[0] ? -1 : 1).slice(0, 4).map(([k, ss]) => { const [on, what, c] = k.split('|'); return `<div><em>${day(on)} · in ${between(T, on)} days</em><b>${ss.length} ${esc(what.toLowerCase())}${ss.length > 1 ? 's' : ''} due</b><span>${esc(c)} · ${esc(ss[0].line)}</span></div>`; }).join('')}
          ${D.O.filter(o => o.st !== 'landed').map(o => `<div><em>${day(o.exp)} · in ${o.dtl} days</em><b>${esc(o.id)} lands</b><span>${int(o.units)} units from ${esc(o.fac)}</span></div>`).join('')}</div></div>
        <div class="card"><div class="ch"><h2>Designs in ${esc(col.name)}</h2><span class="cap">stage comes from Asana</span></div><div class="tbl"><table>
          <tr><th class="l">Design</th><th class="l">Where it is</th><th class="l">Next</th><th class="l">Asana</th></tr>
          ${mine.map(s => `<tr class="link"><td class="l"><span class="nm">${esc(s.n.replace(col.name + ' · ', ''))}</span><span class="sub">${esc(s.line)}</span></td><td class="l">${`<span class="pill ${SLOT[s.st][0]}"><i></i>${SLOT[s.st][1]}</span>`}</td><td class="l">${s.nx ? `${esc(s.nx.what)} by <b>${day(s.nx.on)}</b>` : '–'}</td><td class="l"><span class="btn sm q">Open</span></td></tr>`).join('')}</table></div>
          <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"><span class="btn sm">+ Polo</span><span class="btn sm">+ Hat</span><span class="btn sm q">+ Other</span></div></div>
      </div>
      <div style="display:grid;gap:12px">${plan.map(keepCut).join('')}</div>
    </div>`;
  document.querySelectorAll('[data-kc]').forEach(b => b.onclick = () => { const [pid, v] = b.dataset.kc.split('|'); S.keep[pid] = v; render(); });
}
function keepCut(l) {
  const rows = l.plan.map(x => ({ ...x, p: prod(x.productId), state: S.keep[x.productId] || x.state })).filter(x => x.p);
  const keep = rows.filter(x => x.state === 'keep').length, decide = rows.filter(x => x.state === 'decide').length, cut = rows.filter(x => x.state === 'cut').length;
  const heavyLine = l.woc != null && l.woc > 52;
  const open = heavyLine ? 0 : (l.target ? Math.max(0, l.target - keep - decide) : 0);
  const max = Math.max(1, ...rows.map(x => x.p.s90));
  const curve = Object.entries(l.curve).filter(([k]) => k);
  const shown = rows.slice(0, 8);
  return `<div class="card kc"><div class="ch"><h2>${esc(l.n)}: keep or cut</h2><span class="cap">target ${l.target} · bottom ${l.cutPct}% by 90-day sales is the cut zone</span></div>
    ${heavyLine ? `<div class="warnbox"><b>Hold new ${esc(l.n.toLowerCase())}.</b> The line has ${l.woc} weeks of stock at today's pace. New designs wait until it clears; push the slow ones instead.</div>` : ''}
    <div class="nums"><div><b style="color:var(--good)">${keep}</b><span>keep</span></div><div><b>${decide}</b><span>your call</span></div><div><b style="color:var(--warn)">${cut}</b><span>cut</span></div><div><b>${open}</b><span>new to make</span></div></div>
    ${shown.map(x => `<div class="rank ${x.state === 'cut' ? 'cut' : ''}" data-p="${x.p.id}"><span class="muted">${x.rank}</span><span class="n" title="${esc(x.p.t)}">${esc(x.p.t)}</span><span><span class="b" style="display:block;width:${Math.max(3, Math.round(x.p.s90 / max * 90))}px"></span></span><span>${x.p.s90}</span><span class="mini-seg"><span class="${x.state !== 'cut' ? 'on' : ''}" data-kc="${x.productId}|keep">Keep</span><span class="${x.state === 'cut' ? 'on' : ''}" data-kc="${x.productId}|cut">Cut</span></span></div>`).join('')}
    ${rows.length > 8 ? `<div class="muted" style="font-size:12px;padding-top:6px">and ${rows.length - 8} more, the cut zone is at the bottom</div>` : ''}
    ${curve.length > 1 && !heavyLine ? `<div class="curve">${curve.map(([k, v]) => `<div data-tip="${esc(k)}: ${Math.round(v * 100)}% of units"><em>${Math.round(v * 100)}%</em><i class="${v >= .2 ? 'hi' : ''}" style="height:${Math.max(2, Math.round(v * 110))}px"></i><span>${esc(k)}</span></div>`).join('')}</div><div class="muted" style="font-size:11.5px;margin-top:4px">Size mix a new design's order gets.</div>` : ''}
  </div>`;
}
