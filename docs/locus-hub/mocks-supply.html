<title>Locus Stock Mock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Locus v3 shell, graphite, dark first (the live look). Same tokens as profit/v2.css.
   Layout: rail + top bar + page tabs; summary tiles, then the decision tables; side panels for detail. */
:root{
  --g1:#131316; --g2:#1A1A1E; --g3:#212126; --g4:#28282E; --g5:#303038; --g6:#3A3A43; --g7:#4A4A55; --g8:#5E5E6A; --g10:#8E8E9A; --g11:#B4B4BE; --g12:#F2F2F4;
  --bg:var(--g1); --rail:#0F0F12; --card:var(--g2); --card-hi:var(--g3); --line:var(--g5); --line-strong:var(--g6);
  --ink:var(--g12); --ink-2:var(--g11); --muted:var(--g10); --faint:var(--g8);
  --accent:#8FB3FF; --accent-ink:#0E1420; --accent-soft:rgba(143,179,255,.14);
  --good:#5FD292; --warn:#EBBF63; --bad:#F09182;
  --good-bg:rgba(95,210,146,.14); --warn-bg:rgba(235,191,99,.14); --bad-bg:rgba(240,145,130,.14);
  --bar:#4A4A55; --bar-hi:#8FB3FF; --scrim:rgba(0,0,0,.5); --tipbg:#F2F2F4; --tipink:#131316;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:10px; color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --g1:#F6F6F7; --g2:#FFFFFF; --g3:#F3F3F5; --g4:#ECECEF; --g5:#E2E2E7; --g6:#D5D5DC; --g7:#C2C2CB; --g8:#9A9AA6; --g10:#6B6B78; --g11:#45454F; --g12:#151518;
  --rail:#EDEDF0; --accent:#2F62D9; --accent-ink:#FFFFFF; --accent-soft:rgba(47,98,217,.12);
  --good:#1C7A46; --warn:#8F6412; --bad:#9C3A2E; --good-bg:#E4F2E9; --warn-bg:#F8EED6; --bad-bg:#F7E7E4;
  --bar:#C2C2CB; --bar-hi:#2F62D9; --scrim:rgba(20,20,24,.35); --tipbg:#151518; --tipink:#FFFFFF; color-scheme:light } }
:root[data-theme="light"]{
  --g1:#F6F6F7; --g2:#FFFFFF; --g3:#F3F3F5; --g4:#ECECEF; --g5:#E2E2E7; --g6:#D5D5DC; --g7:#C2C2CB; --g8:#9A9AA6; --g10:#6B6B78; --g11:#45454F; --g12:#151518;
  --rail:#EDEDF0; --accent:#2F62D9; --accent-ink:#FFFFFF; --accent-soft:rgba(47,98,217,.12);
  --good:#1C7A46; --warn:#8F6412; --bad:#9C3A2E; --good-bg:#E4F2E9; --warn-bg:#F8EED6; --bad-bg:#F7E7E4;
  --bar:#C2C2CB; --bar-hi:#2F62D9; --scrim:rgba(20,20,24,.35); --tipbg:#151518; --tipink:#FFFFFF; color-scheme:light }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.4;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:18px 48px}
button{font:inherit;color:inherit}
.note{max-width:1440px;margin:0 auto 12px;color:var(--muted);font-size:12.5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note b{color:var(--ink)}
.note button{font-weight:600;font-size:12px;border:1px solid var(--line-strong);background:var(--card);padding:5px 10px;border-radius:8px;cursor:pointer}
.note button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note .sp{flex:1}
.frame{max-width:1440px;margin:0 auto;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg);display:grid;grid-template-columns:200px minmax(0,1fr);position:relative;min-height:760px}
@media (max-width:900px){.frame{grid-template-columns:1fr}.rail{display:none}}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:6px}
.rail .brand{display:flex;align-items:center;gap:9px;padding:2px 8px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.rail .brand i{width:22px;height:22px;border-radius:6px;background:var(--accent)}
.rail .brand b{font-size:15px;font-weight:600}
.rail .pick{padding:7px 9px;border:1px solid var(--line-strong);border-radius:8px;background:var(--card);display:flex;justify-content:space-between;font-weight:600;margin-bottom:8px}
.rail .pick span{color:var(--muted);font-weight:400}
.rail a{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;color:var(--ink-2);font-weight:500;cursor:default}
.rail a i{width:7px;height:7px;border-radius:2px;background:var(--faint)}
.rail a.on{background:var(--accent-soft);color:var(--ink)} .rail a.on i{background:var(--accent)}
.rail .foot{margin-top:auto;display:grid;gap:4px;border-top:1px solid var(--line);padding-top:8px}
.content{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 22px;border-bottom:1px solid var(--line)}
.ask{flex:1;min-width:200px;max-width:520px;padding:7px 11px;border:1px solid var(--line-strong);border-radius:8px;background:var(--card);color:var(--faint)}
.ctl{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--card);font-size:12.5px;color:var(--ink-2)}
.ctl b{color:var(--ink);font-weight:600}
.tabs{display:flex;gap:2px;padding:10px 22px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs span{padding:8px 12px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.tabs span.on{color:var(--ink);border-color:var(--accent)}
.tabs span.new::after{content:"new";font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-left:6px;vertical-align:1px}
.main{padding:18px 22px 90px;display:grid;gap:16px;min-width:0}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head h1{font-size:20px;font-weight:650;margin:0;letter-spacing:-.01em}
.head .read{flex:1 1 420px;color:var(--ink-2);font-size:13.5px;max-width:80ch}
.head .read b{color:var(--ink);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--line-strong);background:var(--card);font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--g7)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.q{background:transparent}
.btn:focus-visible,.tabs span:focus-visible,.seg span:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.tiles{grid-template-columns:1fr}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;display:grid;gap:5px;cursor:pointer;min-width:0}
.tile:hover{border-color:var(--g7)}
.tile .l{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.tile .l em{font-style:normal;color:var(--faint);font-size:11px}
.tile .v{font-size:24px;font-weight:650;letter-spacing:-.02em;line-height:1.1;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.tile .v small{font-size:12.5px;font-weight:500;color:var(--muted);letter-spacing:0}
.tile .sub{font-size:12px;color:var(--muted)} .tile .sub b{color:var(--ink-2);font-weight:600}
.tile.bad .v{color:var(--bad)} .tile.warn .v{color:var(--warn)}
.seg{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.seg span{font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:8px;color:var(--ink-2);background:var(--card);border:1px solid var(--line);cursor:pointer}
.seg span.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg small{font-weight:500;opacity:.7;margin-left:5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{padding:6px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;min-width:200px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.card h2{font-size:13px;font-weight:650;margin:0}
.ch{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.ch .cap{font-size:12px;color:var(--muted)}
.ch .r{margin-left:auto}
.gh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:12px 0 6px;border-bottom:1px solid var(--line)}
.gh b{font-size:12.5px} .gh span{font-size:12px;color:var(--muted)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:middle}
th.l,td.l{text-align:left}
th:first-child,td:first-child{padding-left:0}
tr:last-child td{border-bottom:0}
tr.link{cursor:pointer} tr.link:hover td{background:var(--card-hi)}
td .sub{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:2px;white-space:normal;max-width:380px}
td .nm{font-weight:600}
th.sort{cursor:pointer} th.sort.on{color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap;vertical-align:1px}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.good{background:var(--good-bg);color:var(--good)} .pill.n{background:var(--g4);color:var(--ink-2)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.ck{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line-strong);display:inline-block;vertical-align:-3px;cursor:pointer}
.ck.on{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--card)}
.late{color:var(--bad);font-weight:600}
.muted{color:var(--muted)}
.prog{display:block;width:120px;height:5px;border-radius:3px;background:var(--g4);overflow:hidden;margin-top:5px}
.prog i{display:block;height:100%;background:var(--accent)}
.fold{display:flex;align-items:center;gap:8px;color:var(--muted);cursor:pointer;padding:4px 0}
.three{display:grid;grid-template-columns:240px minmax(0,1fr) 360px;gap:12px;align-items:start}
@media (max-width:1250px){.three{grid-template-columns:220px minmax(0,1fr)}.three>.side{grid-column:1/-1}}
@media (max-width:760px){.three{grid-template-columns:1fr}}
.stack{display:grid;gap:12px;min-width:0}
.drop{padding:11px 13px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);cursor:pointer;display:grid;gap:3px}
.drop.on{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-size:13px} .drop span{font-size:12px;color:var(--muted)}
.due{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.due div{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);display:grid;gap:2px;cursor:pointer}
.due b{font-size:12.5px} .due span{font-size:11.5px;color:var(--muted)} .due em{font-style:normal;font-size:12px;font-weight:650}
.rank{display:grid;grid-template-columns:18px minmax(0,1fr) 70px 34px auto;gap:8px;align-items:center;padding:5px 0;font-size:12.5px;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .b{height:6px;border-radius:2px;background:var(--bar)}
.rank.cut .b{background:var(--warn)} .rank.cut .n{color:var(--muted)}
.mini-seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.mini-seg span{font-size:11px;font-weight:600;padding:2px 7px;color:var(--muted);cursor:pointer}
.mini-seg span.on{background:var(--ink);color:var(--bg)}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 10px}
.nums div b{display:block;font-size:20px;font-weight:650}
.nums div span{font-size:11.5px;color:var(--muted)}
.curve{display:flex;gap:6px;align-items:flex-end;height:90px;margin-top:8px}
.curve div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.curve i{width:100%;border-radius:3px 3px 0 0;background:var(--bar)}
.curve i.hi{background:var(--bar-hi)}
.curve span{font-size:10.5px;color:var(--muted)}
.curve em{font-style:normal;font-size:11px;font-weight:600}
.actionbar{position:sticky;bottom:12px;margin:0 auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.35);width:fit-content;max-width:100%}
.actionbar .btn{border-color:transparent}
.actionbar .btn.q{color:var(--bg)}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:20}
.panel{position:absolute;top:0;right:0;bottom:0;width:min(720px,100%);background:var(--bg);border-left:1px solid var(--line-strong);z-index:21;overflow-y:auto;padding:18px 20px 30px;display:grid;gap:14px;align-content:start}
.panel .ph{display:flex;gap:12px;align-items:flex-start}
.panel .ph .img{width:46px;height:46px;border-radius:8px;background:var(--g4);display:grid;place-items:center;font-weight:700;color:var(--muted);flex:none}
.panel .ph h3{margin:0;font-size:17px;font-weight:650}
.panel .ph .x{margin-left:auto;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:4px 8px;border-radius:6px;border:1px solid var(--line)}
.panel .meta{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}}
.stats div{padding:10px 12px;border-right:1px solid var(--line)} .stats div:last-child{border-right:0}
.stats .l{font-size:11.5px;color:var(--muted)} .stats .v{font-size:18px;font-weight:650;margin:2px 0} .stats .s{font-size:11.5px;color:var(--muted)}
.stats .bad .v{color:var(--bad)}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center;margin-top:6px}
.lg i{width:12px;height:3px;border-radius:2px;display:inline-block;vertical-align:middle;margin-right:5px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:7px 9px;border-radius:8px;border:1px solid var(--line-strong);background:var(--card);color:var(--ink);font:inherit}
.field .help{font-size:11.5px;color:var(--faint);margin-top:4px}
.qty{width:72px;padding:4px 6px;border-radius:6px;border:1px solid var(--line-strong);background:var(--card);color:var(--ink);font:inherit;text-align:right}
.what{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;font-size:12.5px;margin-top:8px}
.what span{display:block;font-size:11.5px;color:var(--muted)}
.callout{padding:10px 12px;border-radius:8px;font-size:12.5px;background:var(--warn-bg);color:var(--ink)}
.callout b{color:var(--warn)}
.step{display:flex;align-items:center;gap:0;flex-wrap:wrap;font-size:12px}
.step span{padding:4px 10px;border-radius:99px;background:var(--g4);color:var(--muted);font-weight:600}
.step span.done{background:var(--good-bg);color:var(--good)} .step span.now{background:var(--accent);color:var(--accent-ink)}
.step em{width:18px;height:2px;background:var(--line-strong)} .step em.done{background:var(--good)}
.sw{position:relative;width:34px;height:20px;border-radius:99px;background:var(--accent);display:inline-block;flex:none}
.sw::after{content:"";position:absolute;right:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff}
.sw.off{background:var(--g6)} .sw.off::after{left:3px;right:auto}
.set{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:760px){.set{grid-template-columns:1fr}}
.setnav{display:grid;gap:2px}
.setnav span{padding:7px 10px;border-radius:7px;color:var(--ink-2);font-weight:500}
.setnav span.on{background:var(--accent-soft);color:var(--ink)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow b{font-weight:600;font-size:13px} .srow span{display:block;font-size:12px;color:var(--muted)}
.srow input{width:100%;padding:6px 8px;border-radius:7px;border:1px solid var(--line-strong);background:var(--card);color:var(--ink);font:inherit;text-align:right}
.srow.three-in{grid-template-columns:minmax(0,1fr) repeat(3,80px)}
.tip{position:fixed;pointer-events:none;background:var(--tipbg);color:var(--tipink);font-size:12px;padding:6px 9px;border-radius:7px;z-index:50;max-width:300px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-weight:600;z-index:60}
.why{font-size:12.5px;color:var(--ink-2)}
svg text{font-family:var(--sans)}
@media (prefers-reduced-motion: no-preference){.panel{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<div class="note">
  <b>Supply in Locus · mock on Lucky's real data, Oct 8</b>
  <span>Screens:</span>
  <button data-s="stock" class="on">Stock</button><button data-s="forders">Factory orders</button><button data-s="drops">Drops</button><button data-s="settings">Brand settings › Stock and factories</button>
  <span class="sp"></span><span>Theme</span><button data-t="dark">Dark</button><button data-t="light">Light</button>
</div>

<div class="frame" id="frame">
  <aside class="rail">
    <div class="brand"><i></i><b>Locus</b></div>
    <div class="pick">Lucky Golf <span>▾</span></div>
    <a><i></i>Home</a><a><i></i>Ads</a><a><i></i>Email and SMS</a><a class="on"><i></i>Store</a><a><i></i>Creative</a><a><i></i>Reports</a>
    <div class="foot"><a><i></i>Brand settings</a><a><i></i>Cole</a></div>
  </aside>
  <div class="content">
    <div class="top"><span class="ask">Ask or jump · Ctrl K</span><span class="ctl" id="asof"></span></div>

    <div class="main" id="main"></div>
  </div>

</div>
<div class="tip" id="tip" hidden></div>

function keepCut(l) {

        <div class="srow three-in"><div><b>Design timing</b><span>Brief to tech pack (yours) · tech pack to sample in hand (the factory's) · spare days before the order.</span></div><input type="number" value="${D.set.design_days}" aria-label="Design days"><input type="number" value="${D.set.sample_make_days}" aria-label="Sample days"><input type="number" value="${D.set.slack_days}" aria-label="Spare days"></div></div>
      <div class="card"><div class="ch"><h2>Stock in Slack</h2><span class="cap">posts to #lucky-ops</span></div>
        <div class="srow"><div><b>Monday summary</b><span>6am Central: what to order, what is on the way, sales at risk, dead stock.</span></div><span class="sw" role="switch" aria-checked="true"></span></div>
        <div class="srow"><div><b>Same-day alerts</b><span>Other mornings, only when something new happens: a product runs out, an order date passes, an order looks landed, a design goes late. Nothing new, no post.</span></div><span class="sw" role="switch" aria-checked="true"></span></div></div>
    </div></div>`;
}
render();
</script>
