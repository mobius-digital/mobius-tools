<title>Locus Restructure Mocks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: the Locus shell itself (graphite rail + content), so Cole judges the real thing; a note column says what changed. Tokens copied from profit/v2.css. */
:root{
  --bg:#131316; --surface:#1A1A1E; --surface-2:#212126; --ink:#F2F2F4; --ink-2:#B4B4BE; --muted:#8E8E9A; --faint:#5E5E6A;
  --line:#2A2A31; --line-strong:#3A3A43; --brand:#8FB3FF; --brand-soft:rgba(143,179,255,.14); --on-brand:#0E1420;
  --good:#5FD292; --good-bg:rgba(95,210,146,.14); --warn:#EBBF63; --warn-bg:rgba(235,191,99,.14); --bad:#F09182; --bad-bg:rgba(240,145,130,.14);
  --c-meta:#5B8DEF; --c-google:#B5761A; --c-tiktok:#27A392; --c-email:#8F72E8;
  --rail-bg:#0F0F12; --rail-ink:#C9C9D2; --rail-muted:#6E6E7A; --rail-hover:#1C1C21; --rail-on:rgba(143,179,255,.14);
  --note-bg:#1F1D16; --note-line:#4A4228; --note-ink:#E9DDB5;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#F6F6F7; --surface:#FFFFFF; --surface-2:#F3F3F5; --ink:#151518; --ink-2:#45454F; --muted:#6B6B78; --faint:#9A9AA6;
  --line:#E6E6EB; --line-strong:#D5D5DC; --brand:#2F62D9; --brand-soft:#EAF0FD; --on-brand:#FFFFFF;
  --good:#1C7A46; --good-bg:#E4F2E9; --warn:#8F6412; --warn-bg:#F8EED6; --bad:#9C3A2E; --bad-bg:#F7E7E4;
  --c-meta:#3B6FD9; --c-google:#B87A14; --c-tiktok:#1E9C8C; --c-email:#7C5CE6;
  --rail-bg:#EDEDF0; --rail-ink:#2C2C33; --rail-muted:#8A8A96; --rail-hover:#E2E2E7; --rail-on:#DCE6FB;
  --note-bg:#FBF6E6; --note-line:#E8D9A8; --note-ink:#5C4A12; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F6F6F7; --surface:#FFFFFF; --surface-2:#F3F3F5; --ink:#151518; --ink-2:#45454F; --muted:#6B6B78; --faint:#9A9AA6;
  --line:#E6E6EB; --line-strong:#D5D5DC; --brand:#2F62D9; --brand-soft:#EAF0FD; --on-brand:#FFFFFF;
  --good:#1C7A46; --good-bg:#E4F2E9; --warn:#8F6412; --warn-bg:#F8EED6; --bad:#9C3A2E; --bad-bg:#F7E7E4;
  --c-meta:#3B6FD9; --c-google:#B87A14; --c-tiktok:#1E9C8C; --c-email:#7C5CE6;
  --rail-bg:#EDEDF0; --rail-ink:#2C2C33; --rail-muted:#8A8A96; --rail-hover:#E2E2E7; --rail-on:#DCE6FB;
  --note-bg:#FBF6E6; --note-line:#E8D9A8; --note-ink:#5C4A12; color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:13.5px/1.5 var(--sans);font-feature-settings:"tnum" 1;margin:0;padding-inline:0}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
@media (max-width:860px){.app{grid-template-columns:1fr}.side{position:static!important;height:auto!important}}
/* rail */
.side{background:var(--rail-bg);color:var(--rail-ink);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font-weight:700;font-size:17px;padding:2px 8px 8px;display:flex;justify-content:space-between;align-items:baseline}
.logo small{font-weight:500;font-size:11px;color:var(--rail-muted)}
.pick{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px;background:var(--surface);color:var(--ink);cursor:pointer;width:100%;text-align:left}
.pick select{all:unset;flex:1;cursor:pointer}
.nav{display:flex;flex-direction:column;gap:1px;margin-top:6px}
.nav button{display:flex;align-items:center;gap:10px;padding:7px 9px;border-radius:7px;border:0;background:none;cursor:pointer;text-align:left;color:var(--rail-ink)}
.nav button:hover{background:var(--rail-hover)}
.nav button.on{background:var(--rail-on);color:var(--ink);font-weight:600}
.nav button.off{opacity:.55}
.nav svg,.ico{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav .tag{margin-left:auto;font-size:10px;padding:1px 6px;border-radius:5px;background:var(--brand-soft);color:var(--brand)}
.nav .sep{height:1px;background:var(--line);margin:8px 4px}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.me{display:flex;gap:9px;align-items:center;padding:8px;border-radius:8px;border:1px solid var(--line);font-size:12px}
.me b{display:block;font-size:12.5px}.me span{color:var(--rail-muted)}
.av{width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-weight:700;font-size:12px}
/* content */
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;gap:10px;align-items:center;padding:12px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.crumb{font-size:12px;color:var(--muted)}.crumb b{color:var(--ink)}
.ask{flex:1;min-width:180px;max-width:420px;margin-left:auto;border:1px solid var(--line-strong);border-radius:8px;padding:7px 11px;color:var(--faint);background:var(--surface)}
.chipbtn{border:1px solid var(--line-strong);border-radius:8px;padding:6px 10px;background:var(--surface);font-size:12.5px}
.tabs{display:flex;gap:2px;padding:10px 22px 0;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;font-weight:500}
.tabs button.on{color:var(--ink);border-bottom-color:var(--brand)}
.tabs button.newt::after{content:"new";font-size:9.5px;margin-left:6px;padding:1px 5px;border-radius:4px;background:var(--warn-bg);color:var(--warn);vertical-align:2px}
.body{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:20px;padding:20px 22px 48px}
@media (max-width:1180px){.body{grid-template-columns:1fr}}
.page{display:flex;flex-direction:column;gap:16px;min-width:0}
h1{font-size:22px;font-weight:650;letter-spacing:-.01em;margin:0}
h2{font-size:14px;font-weight:600;margin:0}
.sub{color:var(--muted);font-size:12.5px;margin:2px 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
/* note column */
.note{background:var(--note-bg);border:1px solid var(--note-line);color:var(--note-ink);border-radius:10px;padding:14px;font-size:12.5px;display:flex;flex-direction:column;gap:8px;align-self:start;position:sticky;top:12px}
.note b{font-weight:600}.note ul{margin:0;padding-left:16px;display:flex;flex-direction:column;gap:5px}
.note .h{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;opacity:.8}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.tile .l{font-size:11.5px;color:var(--muted)}.tile .v{font-size:22px;font-weight:650;letter-spacing:-.01em}
.d{font-size:11.5px;font-weight:600}.d.up{color:var(--good)}.d.dn{color:var(--bad)}.d.n{color:var(--muted)}
.src{font-size:9.5px;letter-spacing:.06em;color:var(--faint);font-weight:600}
/* strip */
.strip{display:flex;gap:12px;align-items:center;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);flex-wrap:wrap}
.strip .dots{display:flex;gap:4px}
.dot{width:12px;height:12px;border-radius:3px;display:inline-block;background:var(--surface-2);border:1px solid var(--line)}
.dot.good{background:var(--good-bg);border-color:var(--good)} .dot.bad{background:var(--bad-bg);border-color:var(--bad)} .dot.vbad{background:var(--bad);border-color:var(--bad)} .dot.normal{background:var(--surface-2)} .dot.none{background:transparent;border-style:dashed}
.link{color:var(--brand);cursor:pointer;border:0;background:none;padding:0;font-weight:500}
/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:11.5px;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.n{background:var(--surface-2);color:var(--ink-2)}.pill.brand{background:var(--brand-soft);color:var(--brand)}
/* grid (Yesterday) */
.bdg{display:grid;grid-template-columns:120px repeat(14,minmax(22px,1fr)) 150px;gap:5px;align-items:center;min-width:640px}
.bdg .h{font-size:10.5px;color:var(--muted);text-align:center}
.bdg .nm{font-weight:500}
.cell{height:26px;border-radius:5px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;padding:0}
.cell.good{background:var(--good-bg);border-color:var(--good)} .cell.bad{background:var(--bad-bg);border-color:var(--bad)} .cell.vbad{background:var(--bad);border-color:var(--bad)} .cell.none{background:transparent;border-style:dashed;cursor:default}
.cell.sel{outline:2px solid var(--brand);outline-offset:1px}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.lk{border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:2px}
.lk .l{font-size:11.5px;color:var(--muted)}.lk .v{font-weight:600}
.lk.worse{border-color:var(--bad)}.lk.better{border-color:var(--good)}
/* Today rows */
.counts{display:flex;gap:8px;flex-wrap:wrap}
.cnt{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface);display:flex;gap:8px;align-items:baseline;cursor:pointer}
.cnt b{font-size:18px}.cnt.on{border-color:var(--brand)}
.grp{display:flex;flex-direction:column;gap:0}
.grp .gh{display:flex;justify-content:space-between;align-items:center;padding:4px 0 10px;gap:10px;flex-wrap:wrap}
.row{display:grid;grid-template-columns:70px minmax(0,1.3fr) minmax(0,1.6fr) auto;gap:12px;align-items:start;padding:11px 0;border-top:1px solid var(--line)}
@media (max-width:760px){.row{grid-template-columns:1fr}}
.k{font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:3px 7px;border-radius:5px;text-align:center}
.k.scale{background:var(--good-bg);color:var(--good)}.k.cut{background:var(--bad-bg);color:var(--bad)}.k.trim{background:var(--warn-bg);color:var(--warn)}.k.fix{background:var(--surface-2);color:var(--ink)}.k.refresh{background:var(--brand-soft);color:var(--brand)}.k.call{background:var(--brand-soft);color:var(--brand)}
.row .nm{font-weight:600;word-break:break-word}.row .meta{font-size:12px;color:var(--muted)}
.row .why{font-size:12.5px;color:var(--ink-2)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;padding:5px 10px;font-size:12px;cursor:pointer}
.btn.p{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:600}
.row.done{opacity:.4}
/* integrations */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ic{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.ic:hover{border-color:var(--line-strong)}.ic.sel{border-color:var(--brand)}
.lg{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;color:#fff}
.ic .t{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}.ic .t b{font-weight:600}.ic .t span{font-size:12px;color:var(--muted)}
.kind{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:4px}
.drawer{border:1px solid var(--brand);border-radius:10px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:12px}
.lv{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:8px}
.lv .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--good-bg);color:var(--good)}
.steps{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.opt{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:7px;padding:8px 10px;gap:8px;flex-wrap:wrap}
.opt.cur{border-color:var(--good)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.mx{display:grid;gap:4px;align-items:center;font-size:12px;min-width:720px}
.mx .c{height:24px;border-radius:5px;display:grid;place-items:center;font-size:10.5px;font-weight:600}
.mx .c.ok{background:var(--good-bg);color:var(--good)}.mx .c.off{background:var(--surface-2);color:var(--faint)}.mx .c.bad{background:var(--bad-bg);color:var(--bad)}.mx .c.tw{background:var(--warn-bg);color:var(--warn)}
/* settings */
.set{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px}
@media (max-width:760px){.set{grid-template-columns:1fr}}
.snav{display:flex;flex-direction:column;gap:2px}
.snav .g{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 9px 4px}
.snav button{display:flex;gap:9px;align-items:center;border:0;background:none;padding:8px 9px;border-radius:7px;cursor:pointer;text-align:left}
.snav button:hover{background:var(--surface-2)}.snav button.on{background:var(--brand-soft);color:var(--ink);font-weight:600}
.snav .ico{stroke:var(--brand)}
.f{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;padding:11px 0;border-top:1px solid var(--line);align-items:center}
.f:first-of-type{border-top:0}
.f .l b{display:block;font-weight:600}.f .l span{font-size:12px;color:var(--muted)}
.f .c{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inp{border:1px solid var(--line-strong);border-radius:7px;padding:6px 9px;background:var(--surface-2);min-width:0}
.tg{width:34px;height:19px;border-radius:999px;background:var(--line-strong);position:relative;flex:none}.tg::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff}
.tg.on{background:var(--brand)}.tg.on::after{left:17px}
.danger{border:1px solid var(--bad);border-radius:10px;padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
svg.chart{width:100%;height:220px;display:block}
.chart text{fill:var(--muted);font-size:10px}
.mutedtxt{color:var(--muted)}
</style>

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const k$ = v => v == null ? '–' : '$' + (Math.abs(v) >= 1000 ? (v / 1000).toFixed(1) + 'K' : Math.round(v).toLocaleString());
const $2 = v => v == null ? '–' : '$' + v.toFixed(2);
const x2 = v => v == null ? '–' : v.toFixed(2) + 'x';
const pc = (a, b) => (a == null || !b) ? null : a / b - 1;
const dl = (a, b, lower, neutral) => { const c = pc(a, b); if (c == null) return ''; const good = lower ? c < 0 : c > 0; return `<span class="d ${neutral ? 'n' : good ? 'up' : 'dn'}">${c >= 0 ? '▲' : '▼'} ${Math.abs(Math.round(c * 100))}%</span>`; };
const wd = d => new Date(d + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'short' });
const md = d => new Date(d + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
const icon = id => `<svg class="ico"><use href="#${id}"/></svg>`;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1800); }

const FOOT = [['tools', 'Tools', 'wrench', [['scenarios', 'Scenarios'], ['pulse', 'Platform status']]], ['settings', 'Brand settings', 'gear', [['bset', 'Brand settings']]], ['agency', 'Agency settings', 'building', [['aset', 'Agency settings']]]];
const MOCKED = { overview: 1, yesterday: 1, today: 1, integrations: 1, bset: 1, aset: 1 };
const S = { scope: 'all', dest: 'home', tab: 'overview', bsec: 'about', asec: 'integrations', conn: 'gads', yb: null, kind: 'all', done: {} };
try { const h = (location.hash || '').slice(1); if (h && MOCKED[h]) S.tab = h; } catch (e) {}
const destOf = t => [...NAV, ...FOOT].find(n => n[3].some(x => x[0] === t))?.[0];
S.dest = destOf(S.tab) || 'home';
function drawNav() {
  const btn = n => { const [id, label, ic, tabs, cond] = n; const off = cond === 'lucky' && S.scope === 'all' ? false : false;
    const tag = cond === 'season' ? '<span class="tag">in season</span>' : cond === 'lineup' ? '<span class="tag">Lineup</span>' : cond === 'lucky' ? '<span class="tag">stock feed</span>' : '';
    return `<button data-d="${id}" class="${S.dest === id ? 'on' : ''}${cond === 'lineup' ? ' off' : ''}">${icon(ic)}<span>${label}</span>${tag}</button>`; };
  $('#nav').innerHTML = NAV.map(btn).join('');
  $('#navfoot').innerHTML = FOOT.map(btn).join('');
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { const n = [...NAV, ...FOOT].find(x => x[0] === b.dataset.d); const first = n[3].find(t => MOCKED[t[0]]) || n[3][0]; go(first[0]); });
}
function go(tab) {
  if (tab === 'integrations') { S.dest = S.scope === 'all' ? 'agency' : 'settings'; }
  else S.dest = destOf(tab) || S.dest;
  if (!MOCKED[tab]) { toast('Not in this mock: this page moves as it is.'); const n = [...NAV, ...FOOT].find(x => x[0] === S.dest); }
  S.tab = MOCKED[tab] ? tab : S.tab;
  if (MOCKED[tab]) { S.dest = tab === 'integrations' ? (S.scope === 'all' ? 'agency' : 'settings') : destOf(tab); try { history.replaceState(null, '', '#' + tab); } catch (e) {} }
  render();
}
$('#scope').onchange = e => { S.scope = e.target.value; render(); };

const NOTES = {};
function shell(destId) {
  const n = [...NAV, ...FOOT].find(x => x[0] === destId);
  const tabs = destId === 'settings' ? [] : destId === 'agency' ? [] : n[3];
  $('#tabs').innerHTML = tabs.map(([id, l, isNew]) => `<button data-t="${id}" class="${S.tab === id ? 'on' : ''}${isNew ? ' newt' : ''}">${esc(l)}</button>`).join('');
  $('#tabs').hidden = !tabs.length;
  document.querySelectorAll('#tabs [data-t]').forEach(b => b.onclick = () => go(b.dataset.t));
  $('#crumb').innerHTML = `<b>${esc(n[1])}</b>${S.scope === 'all' ? ' · All clients' : ' · Lucky Golf'}`;
}
function render() {
  drawNav();
  const T = S.tab;
  const screen = { overview: home, yesterday, today, integrations, bset, aset }[T] || home;
  screen();
  $('#note').innerHTML = `<span class="h">What changed here</span>${NOTES[T] || ''}`;
  document.querySelectorAll('#page [data-go]').forEach(el => el.onclick = () => go(el.dataset.go));
}

function home() {
  shell('home');
  const w = M.tiles.w, p = M.tiles.p, y = M.grid, bad = y.filter(g => g.y && (g.y.verdict === 'bad' || g.y.verdict === 'vbad'));

  const tile = (l, src, v, d, sub) => `<div class="tile"><span class="l">${l} <span class="src">${src}</span></span><span class="v">${v}</span><span>${d} <span class="mutedtxt" style="font-size:11.5px">${sub || ''}</span></span></div>`;
  const tiles = `<div class="tiles">${tile('Revenue', 'SHOPIFY', k$(w.rev), dl(w.rev, p.rev), 'vs the 7 days before')}${tile('MER', 'BLENDED', x2(w.mer), dl(w.mer, p.mer), `${k$(w.sp)} ad spend`)}${tile('Cost per new customer', 'TW', $2(w.cac), dl(w.cac, p.cac, true), `${w.n} first orders`)}${tile('Orders', 'TW', w.o.toLocaleString(), dl(w.o, p.o), `AOV ${$2(w.aov)}`)}</div>`;
  // chart
  const s = M.series, W = 760, H = 220, pad = 34, max = Math.max(...s.map(r => r.rev)) * 1.08;
  const X = i => pad + i * (W - pad - 8) / (s.length - 1), Yp = v => H - 22 - v / max * (H - 36);
  const line = k => s.map((r, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Yp(r[k]).toFixed(1)}`).join('');
  const ticks = [0, max / 2, max].map(v => `<text x="2" y="${Yp(v) + 3}">${k$(v)}</text><line x1="${pad}" x2="${W - 8}" y1="${Yp(v)}" y2="${Yp(v)}" stroke="var(--line)"/>`).join('');
  const xl = s.map((r, i) => i % 7 === 6 ? `<text x="${X(i)}" y="${H - 6}" text-anchor="middle">${md(r.d)}</text>` : '').join('');

  const cell = (b, k) => { const c = M.conns.find(x => x.b === b.id && x.k === k); if (k === 'klaviyo' && b.id === 'brand_ice_and_gold') return '<span class="c tw">Attentive</span>'; if (k === 'google_ads' && !c && M.conns.some(x => x.b === b.id && x.k === 'triple_whale')) return '<span class="c tw">via TW</span>'; return c ? (c.e ? '<span class="c bad">failing</span>' : '<span class="c ok">✓</span>') : '<span class="c off">–</span>'; };
  const grid = `<div class="tw"><div class="mx" style="grid-template-columns:130px repeat(${KS.length},minmax(64px,1fr))"><span></span>${KS.map(k => `<span class="mutedtxt" style="text-align:center">${k[1]}</span>`).join('')}${bs.map(b => `<b>${esc(b.name)}</b>${KS.map(k => cell(b, k[0])).join('')}`).join('')}</div></div>`;
  const agency = [['Meta', 'System user token: every ad account', 'ok'], ['Triple Whale', 'One key for every store', 'ok'], ['Google', '5 checks: sign-in, Drive and Gmail, Analytics, Search Console, Ads API', 'ok'], ['TikTok app', 'Developer app made; not signed in yet', 'part'], ['Asana', 'Locus fields on the workspace', 'ok'], ['Slack', 'The Mobius Digital app', 'ok'], ['Claude', 'Strategist, briefs, reports', 'ok'], ['OpenAI', 'Studio images', 'ok'], ['Atria', 'Ad library (out of credits Oct 8)', 'part'], ['Frame', 'Review projects', 'ok'], ['Stripe', 'New client invoices', 'ok'], ['Gemini', 'Watches reference videos', 'ok']];
  bsetFrameAgency('integrations', `<div class="card"><div class="hd"><h2>Every brand</h2><span class="sub">one row per brand; a gap across the agency shows in one look.</span></div>${grid}</div>
    <div class="card"><div class="hd"><h2>Mobius's own</h2><span class="sub">made once, shared by every brand</span></div><div class="cards">${agency.map(([n, s, st]) => `<div class="ic" style="cursor:default"><span class="lg" style="background:var(--surface-2);color:var(--ink)">${n.slice(0, 2)}</span><span class="t"><b>${n}</b><span>${s}</span></span><span class="pill ${st === 'ok' ? 'good' : 'warn'}">${st === 'ok' ? 'Connected' : 'Check'}</span></div>`).join('')}</div></div>
    <div class="card"><div class="hd"><h2>Ice &amp; Gold, Email and SMS</h2><span class="sub">what the Attentive card says</span></div>${(() => { const keep = S.conn; S.conn = 'attentive'; const h = brandIntegrations('brand_ice_and_gold').split('<div class="drawer">')[1].replace(/<\/div>$/, ''); S.conn = keep; return h; })()}</div>`);
}

/* SETTINGS */
const BSECS = [['about', 'About the brand', 'idcard'], ['conn', 'Integrations', 'plug'], ['rules', 'Ads rules', 'sliders'], ['slack', 'Slack and sending', 'plane'], ['stock', 'Stock and factories', 'factory'], ['data', 'Data and costs', 'steth']];
const ASECS = [['clients', 'Clients', 'building'], ['integrations', 'Integrations', 'plug'], ['team', 'Team and access', 'key'], ['sending', 'Slack and sending', 'plane'], ['strategist', 'The Strategist', 'spark'], ['jobs', 'Data and jobs', 'refresh']];
NOTES.bset = `<ul><li><b>6 sections</b> (was 8 + 2 pages), one icon each, none repeated.</li><li>About keeps only the brand itself; <b>Archive this brand</b> sits at its bottom (was the "Remove from Locus" section).</li><li>Goal CPA and ROAS moved to <b>Brand &gt; Goals</b> with the month plan; the Meta rules stay here as <b>Ads rules</b>.</li><li><b>Slack and sending</b> lists every automatic post of the brand in one place.</li><li><b>Data and costs</b> = Data check + Cost check + margin override + the two re-pull buttons.</li></ul>`;
NOTES.aset = `<ul><li><b>6 sections</b>: Clients, Integrations, Team and access, Slack and sending, The Strategist, Data and jobs.</li><li>Jobs and data + the Data health page = <b>Data and jobs</b>.</li><li>Guided tours moved into How to use Locus; scheduled questions moved to Reports.</li><li>Opened from the profile menu, or Settings with All clients picked.</li></ul>`;
function bsetFrame(sec, inner) {
  S.bsec = sec;
  $('#page').innerHTML = `<div><h1>Brand settings: Lucky Golf</h1><p class="sub">How Locus behaves for this one brand. What we know about the brand lives in Brand.</p></div>
    <div class="set"><nav class="snav"><span class="g">Lucky Golf</span>${BSECS.map(([k, l, ic]) => `<button data-bs="${k}" class="${k === sec ? 'on' : ''}">${icon(ic)}${l}</button>`).join('')}</nav><div class="card">${inner}</div></div>`;
  document.querySelectorAll('[data-bs]').forEach(b => b.onclick = () => { S.bsec = b.dataset.bs; if (b.dataset.bs === 'conn') { S.tab = 'integrations'; } else S.tab = 'bset'; render(); });
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { S.conn = b.dataset.c; render(); });
}
function bsetFrameAgency(sec, inner) {
  $('#page').innerHTML = `<div><h1>Agency settings</h1><p class="sub">What applies to Mobius as a whole.</p></div>
    <div class="set"><nav class="snav"><span class="g">Mobius Digital</span>${ASECS.map(([k, l, ic]) => `<button data-as="${k}" class="${k === sec ? 'on' : ''}">${icon(ic)}${l}</button>`).join('')}</nav><div style="display:flex;flex-direction:column;gap:14px;min-width:0">${inner}</div></div>`;
  document.querySelectorAll('[data-as]').forEach(b => b.onclick = () => { S.asec = b.dataset.as; S.tab = b.dataset.as === 'integrations' ? 'integrations' : 'aset'; render(); });
}
const fld = (l, h, c) => `<div class="f"><div class="l"><b>${l}</b><span>${h}</span></div><div class="c">${c}</div></div>`;
function bset() {
  if (S.scope === 'all') { S.scope = 'lucky'; $('#scope').value = 'lucky'; }
  shell('settings');
  if (S.bsec === 'conn') S.bsec = 'about';
  const L = M.brands.find(b => b.id === 'brand_lucky_golf');
  const body = {
    about: `<h2>About the brand</h2>${fld('Brand name', 'What clients and reports see.', '<input class="inp" value="Lucky Golf">')}${fld('Time zone', 'Every "yesterday" and every hourly chart uses it.', '<span>Central (America/Chicago)</span>')}${fld('Currency', 'From the store.', '<span>USD</span>')}
      <div class="danger"><span><b>Archive this brand</b><br><span class="mutedtxt" style="font-size:12px">For a client who has left. Locus stops syncing it and hides it everywhere. Nothing is deleted; bring it back from Agency settings &gt; Clients.</span></span><button class="btn">${icon('archive')} Archive Lucky Golf</button></div>`,
    rules: `<h2>Ads rules</h2><p class="mutedtxt" style="margin:0">How Ads &gt; Today and Meta &gt; Creative call each ad set and ad. The goal cost per sale they use is set in <button class="link">Brand &gt; Goals</button> ($${L.target_cpa}).</p>${fld('Judge an ad after spending', 'Times the goal cost per sale.', '<input class="inp" value="1" style="width:60px"> x goal')}${fld('Scale needs at least', 'Sales at or under the goal.', '<input class="inp" value="2" style="width:60px"> sales')}${fld('Cut with no sale after', '', '<input class="inp" value="3" style="width:60px"> x goal')}${fld('Cut when cost per sale is over', 'Once it has spent 2x the goal.', '<input class="inp" value="1.5" style="width:60px"> x goal')}${fld('The anchor ad carries at least', 'Of its set\'s spend. Replaced, never just switched off.', '<input class="inp" value="50" style="width:60px"> %')}${fld('Judging tests, test minimums', 'Unchanged from today.', '<button class="link">Show</button>')}`,
    slack: `<h2>Slack and sending</h2>${fld('Internal channel', 'Your team\'s. Drafts, alerts, the Strategist.', `<span class="mono">${esc(L.internal_channel || 'not set')}</span>`)}${fld('Client channel', 'Theirs. Only approved briefs and reports go here.', `<span class="mono">${esc(L.client_channel || 'none: handled automatically')}</span>`)}${fld('Review before sending', 'Drafts wait for you in the internal channel.', '<span class="tg on"></span>')}
      <div class="tw"><table><thead><tr><th>Every automatic post for Lucky Golf</th><th>Where</th><th>When</th><th>On</th></tr></thead><tbody>
      <tr><td>Daily Brief</td><td>client, reviewed first</td><td>9am</td><td><span class="tg${L.brief_enabled ? ' on' : ''}"></span></td></tr><tr><td>Weekly and monthly reports</td><td>client, reviewed first</td><td>Mon, 1st</td><td><span class="tg on"></span></td></tr><tr><td>Yesterday (bad days)</td><td>internal</td><td>8am, only on a bad day</td><td><span class="tg on"></span></td></tr><tr><td>Monday test calls <span class="pill n">moved here</span></td><td>internal</td><td>Mon 8am</td><td><span class="tg on"></span></td></tr><tr><td>Stock <span class="pill n">moved here</span></td><td>internal</td><td>Mon + when something new runs out</td><td><span class="tg on"></span></td></tr></tbody></table></div>`,
    stock: `<h2>Stock and factories</h2><p class="mutedtxt" style="margin:0">Unchanged: factories, product groups, 4 rules, design timing. Only its Slack switch moved to Slack and sending.</p>`,
    data: `<h2>Data and costs</h2><p class="mutedtxt" style="margin:0">Are this brand's numbers right, and how to fix them. One page instead of four.</p>
      <div class="lv"><span class="n">✓</span><div><b>Is the data complete and fresh?</b><div class="mutedtxt">Meta, Triple Whale and attribution all landed through yesterday. (Was the Data check page.)</div></div><span class="pill good">Good</span></div>
      <div class="lv"><span class="n">✓</span><div><b>Are the costs right?</b><div class="mutedtxt">Product, shipping and fees from Triple Whale; contribution margin trusted. (Was the Cost check page.)</div>${fld('Margin override', 'One flat margin instead of real costs. Blank = use the real costs.', '<input class="inp" placeholder="auto" style="width:70px"> %')}</div><span class="pill good">Good</span></div>
      <div class="lv"><span class="n" style="background:var(--surface-2);color:var(--muted)">↻</span><div><b>Fix it</b><div class="mutedtxt">Only when a check above says so. (Was Data repairs.)</div><div class="c" style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn">Re-pull 430 days of Triple Whale</button><button class="btn">Re-pull 120 days of ad attribution</button></div></div><span></span></div>`,
  }[S.bsec] || '';
  bsetFrame(S.bsec, body);
}
function aset() {
  if (S.scope !== 'all') { S.scope = 'all'; $('#scope').value = 'all'; }
  shell('agency');
  if (S.asec === 'integrations') { S.tab = 'integrations'; return agencyIntegrations(); }
  const body = {
    clients: `<div class="card"><h2>Clients</h2><div class="tw"><table><thead><tr><th>Brand</th><th>Status</th><th>Integrations</th></tr></thead><tbody>${M.brands.map(b => `<tr><td><b>${esc(b.name)}</b></td><td><span class="pill ${b.id === 'brand_the_golf_sock' ? 'n' : 'good'}">${b.id === 'brand_the_golf_sock' ? 'Paused (test)' : 'Active'}</span></td><td class="mutedtxt">${M.conns.filter(c => c.b === b.id).length} connected</td></tr>`).join('')}</tbody></table></div><div><button class="btn p">+ New client</button> <button class="btn">+ Add a brand</button></div></div>`,
    team: `<div class="card"><h2>Team and access</h2><p class="mutedtxt" style="margin:0">Unchanged: who signs in, change or only look, which brands each person sees. Also sets where each person lands (Ahsan and Noma: Ads &gt; Today).</p></div>`,
    sending: `<div class="card"><h2>Slack and sending</h2><p class="mutedtxt" style="margin:0">Brief send time for every brand, who client messages come from, who can send from Slack, the Yesterday post switch. Each brand's own posts are in its brand settings.</p></div>`,
    strategist: `<div class="card"><h2>The Strategist</h2><p class="mutedtxt" style="margin:0">What it knows, how it thinks, its Monday briefing. Scheduled questions moved to Reports, next to Dashboards.</p></div>`,
    jobs: `<div class="card"><h2>Data and jobs</h2><p class="mutedtxt" style="margin:0">Are the syncs and sends running, which brand's data is stale, what errored. The all-brands version of each brand's Data and costs. (Was Jobs and data + the Data health page.)</p></div>`,
  }[S.asec] || '';
  bsetFrameAgency(S.asec, body);
}
render();
</script>
