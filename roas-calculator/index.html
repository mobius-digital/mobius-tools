      if (isNaN(n) || !isFinite(n)) return '—';
      return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(n);
    };

    };

    const fmtRoas = (n) => {
      if (isNaN(n) || !isFinite(n)) return '—';
      return `${n.toFixed(2)}x`;
    };

    function SliderInput({ label, value, onChange, min, max, step, prefix, suffix, help }) {
      return (
        <div className="space-y-2.5">
          <div className="flex items-baseline justify-between gap-3">
            <label className="text-[13px] font-medium text-neutral-700 tracking-tight">{label}</label>
            <div className="flex items-baseline gap-0.5">
              {prefix && <span className="text-neutral-400 text-sm">{prefix}</span>}
              <input
                type="number"
                value={value}
                onChange={(e) => { const v = parseFloat(e.target.value); onChange(isNaN(v) ? 0 : v); }}
                min={min} max={max} step={step}
                className="w-24 text-right text-base font-semibold text-neutral-900 bg-transparent border-b border-neutral-300 focus:outline-none tabular-nums pb-0.5 transition-colors"
                style={{ fontFamily: '"Fira Code", ui-monospace, Menlo, monospace' }}
                onFocus={(e) => e.target.style.borderBottomColor = '#3D9DCA'}
                onBlur={(e) => e.target.style.borderBottomColor = ''}
              />
              {suffix && <span className="text-neutral-400 text-sm">{suffix}</span>}
            </div>
          </div>
          <input type="range" value={value} onChange={(e) => onChange(parseFloat(e.target.value))} min={min} max={max} step={step} className="w-full h-1 bg-neutral-200 rounded-full appearance-none cursor-pointer roas-slider" />
          {help && <p className="text-[11px] text-neutral-400 leading-relaxed">{help}</p>}
        </div>
      );
    }

    function Toggle({ checked, onChange }) {
      return (
        <button
          onClick={onChange}
          className="relative w-11 h-6 rounded-full flex-shrink-0"
          style={{
            backgroundColor: checked ? '#62BDEA' : '#d4d4d4',
            transition: 'background-color 200ms ease',
          }}
          aria-pressed={checked}
        >
          <div
            className="absolute top-0.5 left-0 w-5 h-5 bg-white rounded-full shadow-sm"
            style={{
              transform: checked ? 'translateX(22px)' : 'translateX(2px)',
              transition: 'transform 200ms cubic-bezier(0.4, 0, 0.2, 1)',
            }}
          />
        </button>
      );
    }

    function OptionalCostBlock({ title, subtitle, checked, onToggle, children }) {
      return (
        <div className="pt-4 border-t border-neutral-100">
          <div className="flex items-start justify-between mb-3 gap-4">
            <div className="min-w-0">
              <div className="text-[13px] font-medium text-neutral-800">{title}</div>
              <div className="text-[11px] text-neutral-500 mt-0.5">{subtitle}</div>
            </div>
            <Toggle checked={checked} onChange={onToggle} />
          </div>
          {checked && <div className="mt-4">{children}</div>}
        </div>
      );
    }

    function KPICell({ label, value, sublabel, tone = 'neutral', warning = false }) {
      const toneClass = { neutral: 'text-neutral-900', positive: 'text-emerald-700', negative: 'text-rose-700' }[tone] || 'text-neutral-900';
      return (
        <div className="py-4 px-5 border-r border-b border-neutral-200/70 last:border-r-0 md:border-b-0">
          <div className="text-[10px] font-medium text-neutral-500 uppercase tracking-[0.16em]">{label}</div>
          <div className={`mt-1.5 text-[22px] font-semibold tabular-nums tracking-tight ${toneClass}`} style={{ fontFamily: '"Fira Code", ui-monospace, monospace' }}>{value}</div>
          {sublabel && <div className={`text-[11px] mt-1 ${warning ? 'text-amber-700 font-medium' : 'text-neutral-500'}`}>{sublabel}</div>}
        </div>
      );
    }

    function SectionHeader({ children }) {
      return (
        <div className="flex items-center gap-2">
          <div className="w-1 h-4 rounded-full" style={{ backgroundColor: '#62BDEA' }} />
          <h3 className="text-[10px] font-semibold text-neutral-800 uppercase tracking-[0.2em]">{children}</h3>
        </div>
      );
    }

    function ModeToggle({ mode, onChange }) {
      const tabs = [{ id: 'roas', label: 'ROAS' }, { id: 'orders', label: 'Orders' }, { id: 'revenue', label: 'Revenue' }];
      return (
        <div className="grid grid-cols-3 gap-1 p-1 bg-neutral-100 rounded-lg">
          {tabs.map((t) => (
            <button key={t.id} onClick={() => onChange(t.id)} className={`text-[11px] font-semibold uppercase tracking-wider py-2 rounded-md transition-colors ${mode === t.id ? 'bg-white text-neutral-900 shadow-sm' : 'text-neutral-500 hover:text-neutral-700'}`}>{t.label}</button>
          ))}
        </div>
      );
    }

    function DerivedReadout({ items }) {
      return (
        <div className="text-[11px] text-neutral-400 leading-relaxed pt-1">
          <span className="text-neutral-500">Derived: </span>
          {items.map((item, i) => (
            <span key={i}>
              {i > 0 && <span className="text-neutral-300"> · </span>}
              <span className="text-neutral-600 font-medium tabular-nums" style={{ fontFamily: '"Fira Code", monospace' }}>{item.value}</span>
              <span className="text-neutral-400"> {item.label}</span>
            </span>
          ))}
        </div>
      );
    }

    function ROASCalculator() {
      const [aov, setAov] = useState(85);
      const [grossMargin, setGrossMargin] = useState(65);
      const [mode, setMode] = useState('roas');
      const [adSpend, setAdSpend] = useState(20000);
      const [revenueGoal, setRevenueGoal] = useState(50000);
      const [roas, setRoas] = useState(2.5);
      const [orders, setOrders] = useState(588);
      const [includeProcessing, setIncludeProcessing] = useState(false);
      const [processingPct, setProcessingPct] = useState(2.9);
      const [processingFixed, setProcessingFixed] = useState(0.30);
      const [includeFulfillment, setIncludeFulfillment] = useState(false);
      const [fulfillmentPerOrder, setFulfillmentPerOrder] = useState(3);
      const [includeFixed, setIncludeFixed] = useState(false);
      const [fixedCosts, setFixedCosts] = useState(5000);
      const [includeRevShare, setIncludeRevShare] = useState(false);
      const [revSharePct, setRevSharePct] = useState(15);
      const [includeAdFee, setIncludeAdFee] = useState(false);
      const [adFeePct, setAdFeePct] = useState(12);
      const [adFeeAppliesPct, setAdFeeAppliesPct] = useState(100);

      const c = useMemo(() => {
        const marginFraction = grossMargin / 100;
        const processingPctFraction = includeProcessing ? processingPct / 100 : 0;
        const processingFixedPerOrder = includeProcessing ? processingFixed : 0;
        const fulfillmentPerOrderCost = includeFulfillment ? fulfillmentPerOrder : 0;
        const revShareFraction = includeRevShare ? revSharePct / 100 : 0;
        const adFeeFraction = includeAdFee ? (adFeePct / 100) * (adFeeAppliesPct / 100) : 0;

        let revenue, ordersCount, effectiveAdSpend;
        if (mode === 'roas') { effectiveAdSpend = adSpend; revenue = adSpend * roas; ordersCount = aov > 0 ? revenue / aov : 0; }
        else if (mode === 'orders') { effectiveAdSpend = adSpend; ordersCount = orders; revenue = ordersCount * aov; }
        else { revenue = revenueGoal; effectiveAdSpend = roas > 0 ? revenue / roas : 0; ordersCount = aov > 0 ? revenue / aov : 0; }

        const derivedRoas = effectiveAdSpend > 0 ? revenue / effectiveAdSpend : 0;
        const cpaRaw = ordersCount > 0 ? effectiveAdSpend / ordersCount : 0;
        const cpa = Math.round(cpaRaw * 100) / 100;
        const cogsPerOrder = aov * (1 - marginFraction);
        const marginPerOrder = aov * marginFraction;
        const processingPerOrder = aov * processingPctFraction + processingFixedPerOrder;
        const totalCogs = ordersCount * cogsPerOrder;
        const totalProcessing = ordersCount * processingPerOrder;
        const totalFulfillment = ordersCount * fulfillmentPerOrderCost;
        const revShareCost = revenue * revShareFraction;
        const adFeeCost = effectiveAdSpend * adFeeFraction;
        const fixed = includeFixed ? fixedCosts : 0;
        const grossProfit = revenue - totalCogs;
        const contribProfit = grossProfit - totalProcessing - totalFulfillment - effectiveAdSpend - revShareCost - adFeeCost;
        const netProfit = contribProfit - fixed;
        const revSharePerOrder = ordersCount > 0 ? revShareCost / ordersCount : 0;
        const adFeePerOrder = ordersCount > 0 ? adFeeCost / ordersCount : 0;
        const fixedPerOrder = ordersCount > 0 ? fixed / ordersCount : 0;
        const effectiveMarginFraction = aov > 0 ? marginFraction - processingPctFraction - ((processingFixedPerOrder + fulfillmentPerOrderCost) / aov) - revShareFraction : 0;
        const impossible = effectiveMarginFraction <= 0;
        const contribBreakEvenRoas = impossible ? Infinity : (1 + adFeeFraction) / effectiveMarginFraction;
        const fullBreakEvenRoas = impossible || effectiveAdSpend <= 0 ? Infinity : ((1 + adFeeFraction) + fixed / effectiveAdSpend) / effectiveMarginFraction;
        const revShareBaseline = aov * revShareFraction;
        const availPerOrder = marginPerOrder - processingPerOrder - fulfillmentPerOrderCost - revShareBaseline;
        const breakEvenCpa = availPerOrder > 0 ? availPerOrder / (1 + adFeeFraction) : 0;
        const netProfitPerOrder = marginPerOrder - processingPerOrder - fulfillmentPerOrderCost - cpa - revSharePerOrder - adFeePerOrder - fixedPerOrder;
        const netMarginPct = revenue > 0 ? (netProfit / revenue) * 100 : 0;

        return {
          revenue, orders: ordersCount, roas: derivedRoas, cpa, adSpend: effectiveAdSpend,
          cogsPerOrder, marginPerOrder, processingPerOrder, fulfillmentPerOrderCost,
          totalCogs, totalProcessing, totalFulfillment, revShareCost, adFeeCost, fixed,
          grossProfit, contribProfit, netProfit, revSharePerOrder, adFeePerOrder, fixedPerOrder,
          breakEvenCpa, netProfitPerOrder, netMarginPct, contribBreakEvenRoas, fullBreakEvenRoas, impossible,
        };
      }, [aov, grossMargin, mode, adSpend, revenueGoal, roas, orders, includeProcessing, processingPct, processingFixed, includeFulfillment, fulfillmentPerOrder, includeFixed, fixedCosts, includeRevShare, revSharePct, includeAdFee, adFeePct, adFeeAppliesPct]);

      const switchMode = (newMode) => {
        if (newMode === mode) return;
        const currentRevenue = c.revenue, currentAdSpend = c.adSpend, currentOrders = c.orders, currentRoas = c.roas;
        if (newMode === 'roas') {
          if (mode === 'orders') setRoas(Math.max(0.05, Math.round(currentRoas * 100) / 100));
          else if (mode === 'revenue') setAdSpend(Math.max(1, Math.round(currentAdSpend)));
        } else if (newMode === 'orders') {
          if (mode === 'roas') setOrders(Math.max(1, Math.round(currentOrders)));
          else if (mode === 'revenue') { setAdSpend(Math.max(1, Math.round(currentAdSpend))); setOrders(Math.max(1, Math.round(currentOrders))); }
        } else if (newMode === 'revenue') {
          setRevenueGoal(Math.max(1, Math.round(currentRevenue)));
          if (mode === 'orders') setRoas(Math.max(0.05, Math.round(currentRoas * 100) / 100));
        }
        setMode(newMode);
      };

      const setCpa = (newCpa) => {
        if (newCpa > 0) {
          if (mode === 'roas' || mode === 'revenue') { if (aov > 0) setRoas(Math.round((aov / newCpa) * 100) / 100); }
          else if (mode === 'orders') { if (adSpend > 0) setOrders(Math.max(1, Math.round(adSpend / newCpa))); }
        }
      };

      const reset = () => {
        setAov(85); setGrossMargin(65); setMode('roas'); setAdSpend(20000); setRevenueGoal(50000);
        setRoas(2.5); setOrders(588); setIncludeProcessing(false); setProcessingPct(2.9); setProcessingFixed(0.30);
        setIncludeFulfillment(false); setFulfillmentPerOrder(3); setIncludeFixed(false); setFixedCosts(5000);
        setIncludeRevShare(false); setRevSharePct(15); setIncludeAdFee(false); setAdFeePct(12); setAdFeeAppliesPct(100);
      };

      const relevantBreakEven = includeFixed ? c.fullBreakEvenRoas : c.contribBreakEvenRoas;
      let statusLabel = 'Profitable', statusTone = 'emerald';
      if (c.impossible) { statusLabel = 'Impossible'; statusTone = 'rose'; }
      else if (c.netProfit < 0) { statusLabel = 'Losing Money'; statusTone = 'rose'; }
      else if (c.roas < relevantBreakEven * 1.15) { statusLabel = 'Near Break-Even'; statusTone = 'amber'; }
      const statusClasses = {
        emerald: 'bg-emerald-50 text-emerald-800 border-emerald-200',
        amber: 'bg-amber-50 text-amber-800 border-amber-200',
        rose: 'bg-rose-50 text-rose-800 border-rose-200',
      }[statusTone];

      const sensitivityData = useMemo(() => {
        const data = [];
        const revShareFraction = includeRevShare ? revSharePct / 100 : 0;
        const adFeeFraction = includeAdFee ? (adFeePct / 100) * (adFeeAppliesPct / 100) : 0;
        const processingPctF = includeProcessing ? processingPct / 100 : 0;
        const processingFixedF = includeProcessing ? processingFixed : 0;
        const fulfillmentF = includeFulfillment ? fulfillmentPerOrder : 0;
        const fixedR = includeFixed ? fixedCosts : 0;
        const marginFraction = grossMargin / 100;
        const currentRoas = c.roas;
        const lower = Math.max(0.5, Math.min(1, Math.floor((currentRoas - 1.5) * 2) / 2));
        const upper = Math.max(5, Math.ceil((currentRoas + 1.5) * 2) / 2);
        for (let r = lower; r <= upper + 0.001; r += 0.5) {
          let revenueR, adSpendR, ordersR;
          if (mode === 'revenue') { revenueR = revenueGoal; adSpendR = r > 0 ? revenueR / r : 0; }
          else { adSpendR = adSpend; revenueR = adSpendR * r; }
          ordersR = aov > 0 ? revenueR / aov : 0;
          const cogsR = ordersR * aov * (1 - marginFraction);
          const processingR = revenueR * processingPctF + ordersR * processingFixedF;
          const fulfillmentR = ordersR * fulfillmentF;
          const revShareR = revenueR * revShareFraction;
          const adFeeR = adSpendR * adFeeFraction;
          const netR = revenueR - cogsR - processingR - fulfillmentR - adSpendR - revShareR - adFeeR - fixedR;
          data.push({ roas: `${r.toFixed(1)}x`, profit: Math.round(netR), isCurrent: Math.abs(r - currentRoas) < 0.26 });
        }
        return data;
      }, [mode, aov, grossMargin, adSpend, revenueGoal, c.roas, includeProcessing, processingPct, processingFixed, includeFulfillment, fulfillmentPerOrder, includeFixed, fixedCosts, includeRevShare, revSharePct, includeAdFee, adFeePct, adFeeAppliesPct]);

      const segments = [
        { label: 'COGS', value: c.totalCogs, color: '#78716c' },
        ...(includeProcessing ? [{ label: 'Processing', value: c.totalProcessing, color: '#ec4899' }] : []),
        ...(includeFulfillment ? [{ label: 'Fulfillment', value: c.totalFulfillment, color: '#f97316' }] : []),
        { label: 'Ad Spend', value: c.adSpend, color: '#2563eb' },
        ...(includeAdFee ? [{ label: 'Ad Fee', value: c.adFeeCost, color: '#0891b2' }] : []),
        ...(includeRevShare ? [{ label: 'Rev Share', value: c.revShareCost, color: '#d97706' }] : []),
        ...(includeFixed ? [{ label: 'Fixed', value: c.fixed, color: '#7c3aed' }] : []),
        { label: c.netProfit >= 0 ? 'Profit' : 'Loss', value: Math.abs(c.netProfit), color: c.netProfit >= 0 ? '#059669' : '#e11d48' },
      ].filter((s) => s.value > 0.01);
      const totalSegments = segments.reduce((a, s) => a + s.value, 0);

      return (
        <div className="min-h-screen bg-neutral-50 text-neutral-900 p-5 md:p-10" style={{ fontFamily: '"Fira Sans", ui-sans-serif, system-ui, sans-serif' }}>
          <div className="max-w-6xl mx-auto">

            <div className="flex items-start justify-between mb-10 md:mb-14">
              <div>
                <img src={LOGO_URL} alt="Mobius Digital" style={{ height: '44px', width: 'auto', display: 'block' }} className="mb-6 md:mb-8" />
                <div className="flex items-center gap-2 mb-3">
                  <div className="w-1.5 h-1.5 rounded-full" style={{ backgroundColor: '#62BDEA' }} />
                  <div className="text-[10px] font-semibold uppercase tracking-[0.24em]" style={{ color: '#3D9DCA' }}>
                    Profitability Model
                  </div>
                </div>
                <h1 className="text-3xl md:text-4xl font-semibold tracking-tight text-neutral-900">ROAS Calculator</h1>
                <p className="text-sm text-neutral-500 mt-2 max-w-md">Drag the numbers. See where the money actually goes.</p>
              </div>
              <button onClick={reset} className="text-[11px] font-medium text-neutral-600 hover:text-neutral-900 uppercase tracking-[0.14em] px-3 py-2 rounded-md border border-neutral-200 hover:border-neutral-300 transition-colors bg-white">Reset</button>
            </div>

            <div className="mb-12 md:mb-16">
              <div className="flex items-center gap-3 mb-4 flex-wrap">
                <div className="text-[10px] font-semibold text-neutral-500 uppercase tracking-[0.2em]">Projected monthly net profit</div>
                <span className={`text-[10px] font-semibold uppercase tracking-[0.14em] px-2.5 py-1 rounded-full border ${statusClasses}`}>{statusLabel}</span>
              </div>
              <div className={`hero-num tabular-nums ${c.impossible ? 'text-neutral-300' : c.netProfit >= 0 ? 'text-neutral-900' : 'text-rose-600'}`} style={{ fontFamily: '"Fira Code", ui-monospace, monospace' }}>
                {c.impossible ? '—' : fmtCurrency(c.netProfit)}
              </div>
              {c.impossible && <div className="text-xs text-rose-700 mt-3 max-w-md">Variable costs exceed gross margin. You can't break even at any ROAS.</div>}
              {!c.impossible && (
                <div className="flex flex-wrap gap-x-8 gap-y-2 mt-6 text-sm text-neutral-600">
                  <div><span className="text-neutral-400">Net margin</span> <span className="font-medium text-neutral-900 tabular-nums" style={{ fontFamily: '"Fira Code", monospace' }}>{fmtPct(c.netMarginPct)}</span></div>
                  <div><span className="text-neutral-400">Revenue</span> <span className="font-medium text-neutral-900 tabular-nums" style={{ fontFamily: '"Fira Code", monospace' }}>{fmtCurrency(c.revenue)}</span></div>
                  <div><span className="text-neutral-400">Ad Spend</span> <span className="font-medium text-neutral-900 tabular-nums" style={{ fontFamily: '"Fira Code", monospace' }}>{fmtCurrency(c.adSpend)}</span></div>
                  <div><span className="text-neutral-400">Orders</span> <span className="font-medium text-neutral-900 tabular-nums" style={{ fontFamily: '"Fira Code", monospace' }}>{fmtNumber(c.orders)}</span></div>
                  <div><span className="text-neutral-400">ROAS</span> <span className="font-medium text-neutral-900 tabular-nums" style={{ fontFamily: '"Fira Code", monospace' }}>{fmtRoas(c.roas)}</span></div>
                  <div><span className="text-neutral-400">CPA</span> <span className="font-medium text-neutral-900 tabular-nums" style={{ fontFamily: '"Fira Code", monospace' }}>{fmtCurrencyPrecise(c.cpa)}</span></div>
                  <div><span className="text-neutral-400">Break-even</span> <span className="font-medium text-neutral-900 tabular-nums" style={{ fontFamily: '"Fira Code", monospace' }}>{fmtRoas(relevantBreakEven)}</span></div>
                </div>
              )}
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-5 gap-8 lg:gap-10">
              <div className="lg:col-span-2">
                <div className="border border-neutral-200 rounded-2xl p-6 md:p-7 space-y-6 lg:sticky lg:top-6 bg-white">
                  <SectionHeader>Business</SectionHeader>
                  <SliderInput label="AOV" value={aov} onChange={setAov} min={10} max={500} step={1} prefix="$" help="Average revenue per order, before discounts and refunds" />

                  <div className="space-y-4">
                    <SliderInput label="Gross Margin" value={grossMargin} onChange={setGrossMargin} min={5} max={95} step={1} suffix="%" help="% of AOV left after product cost, shipping, and fulfillment" />

                    <div className="pl-4 border-l-2 border-neutral-100 py-1">
                      <div className="flex items-center justify-between gap-3">
                        <div className="min-w-0">
                          <div className="text-[12px] font-medium text-neutral-700">Payment processing</div>
                          <div className="text-[10px] text-neutral-400 mt-0.5">Shopify default: 2.9% + $0.30</div>
                        </div>
                        <Toggle checked={includeProcessing} onChange={() => setIncludeProcessing(!includeProcessing)} />
                      </div>
                      {includeProcessing && (
                        <div className="mt-4 space-y-4">
                          <SliderInput label="Rate" value={processingPct} onChange={setProcessingPct} min={0} max={5} step={0.1} suffix="%" />
                          <SliderInput label="Per transaction" value={processingFixed} onChange={setProcessingFixed} min={0} max={2} step={0.05} prefix="$" />
                        </div>
                      )}
                    </div>

                    <div className="pl-4 border-l-2 border-neutral-100 py-1">
                      <div className="flex items-center justify-between gap-3">
                        <div className="min-w-0">
                          <div className="text-[12px] font-medium text-neutral-700">Fulfillment</div>
                          <div className="text-[10px] text-neutral-400 mt-0.5">3PL pick & pack, absorbed shipping</div>
                        </div>
                        <Toggle checked={includeFulfillment} onChange={() => setIncludeFulfillment(!includeFulfillment)} />
                      </div>
                      {includeFulfillment && (
                        <div className="mt-4">
                          <SliderInput label="Per order" value={fulfillmentPerOrder} onChange={setFulfillmentPerOrder} min={0} max={30} step={0.25} prefix="$" />
                        </div>
                      )}
                    </div>
                  </div>

                  <div className="pt-5 border-t border-neutral-100 space-y-5">
                    <SectionHeader>Target</SectionHeader>
                    <ModeToggle mode={mode} onChange={switchMode} />

                    {mode === 'roas' && (
                      <React.Fragment>
                        <SliderInput label="Monthly Ad Spend" value={adSpend} onChange={setAdSpend} min={500} max={100000} step={500} prefix="$" />
                        <SliderInput label="Target ROAS" value={roas} onChange={setRoas} min={0.5} max={6} step={0.05} suffix="x" help="Change ROAS or CPA — they move together" />
                        <SliderInput label="Target CPA" value={c.cpa} onChange={setCpa} min={1} max={Math.max(50, aov * 1.5)} step={0.5} prefix="$" />
                        <DerivedReadout items={[{ value: fmtNumber(c.orders), label: 'orders' }, { value: fmtCurrency(c.revenue), label: 'revenue' }]} />
                      </React.Fragment>
                    )}

                    {mode === 'orders' && (
                      <React.Fragment>
                        <SliderInput label="Monthly Ad Spend" value={adSpend} onChange={setAdSpend} min={500} max={100000} step={500} prefix="$" />
                        <SliderInput label="Monthly Orders" value={orders} onChange={(v) => setOrders(Math.max(1, Math.round(v)))} min={10} max={5000} step={10} help="Slide AOV now and revenue moves directly with it" />
                        <DerivedReadout items={[{ value: fmtRoas(c.roas), label: 'ROAS' }, { value: fmtCurrencyPrecise(c.cpa), label: 'CPA' }, { value: fmtCurrency(c.revenue), label: 'revenue' }]} />
                      </React.Fragment>
                    )}

                    {mode === 'revenue' && (
                      <React.Fragment>
                        <SliderInput label="Revenue Goal" value={revenueGoal} onChange={(v) => setRevenueGoal(Math.max(1, Math.round(v)))} min={1000} max={500000} step={500} prefix="$" help="Monthly revenue you're targeting" />
                        <SliderInput label="Target ROAS" value={roas} onChange={setRoas} min={0.5} max={6} step={0.05} suffix="x" />
                        <SliderInput label="Target CPA" value={c.cpa} onChange={setCpa} min={1} max={Math.max(50, aov * 1.5)} step={0.5} prefix="$" />
                        <DerivedReadout items={[{ value: fmtCurrency(c.adSpend), label: 'ad spend' }, { value: fmtNumber(c.orders), label: 'orders' }]} />
                      </React.Fragment>
                    )}
                  </div>

                  <OptionalCostBlock title="Fixed monthly costs" subtitle="Rent, salaries, SaaS, standard loan payments" checked={includeFixed} onToggle={() => setIncludeFixed(!includeFixed)}>
                    <SliderInput label="Amount / month" value={fixedCosts} onChange={setFixedCosts} min={0} max={50000} step={100} prefix="$" />
                  </OptionalCostBlock>

                  <OptionalCostBlock title="Revenue share" subtitle="Shopify Capital, Wayflyer, MCAs, affiliates" checked={includeRevShare} onToggle={() => setIncludeRevShare(!includeRevShare)}>
                    <SliderInput label="% of revenue" value={revSharePct} onChange={setRevSharePct} min={0} max={50} step={0.5} suffix="%" />
                  </OptionalCostBlock>

                  <OptionalCostBlock title="Ad spend fee" subtitle="Agency % of spend, ad-tied tool fees" checked={includeAdFee} onToggle={() => setIncludeAdFee(!includeAdFee)}>
                    <div className="space-y-4">
                      <SliderInput label="% of ad spend" value={adFeePct} onChange={setAdFeePct} min={0} max={30} step={0.5} suffix="%" />
                      <SliderInput label="Applies to" value={adFeeAppliesPct} onChange={setAdFeeAppliesPct} min={0} max={100} step={5} suffix="% of spend" help="For platform-specific deals — e.g., 60 if the fee only covers Meta and Meta is 60% of your spend" />
                    </div>
                  </OptionalCostBlock>
                </div>
              </div>

              <div className="lg:col-span-3 space-y-8">
                <div className="border border-neutral-200 rounded-2xl bg-white grid grid-cols-2 md:grid-cols-4 overflow-hidden">
                  <KPICell label="Revenue" value={fmtCurrency(c.revenue)} sublabel={`${fmtNumber(c.orders)} orders`} />
                  <KPICell label="Contrib. Profit" value={fmtCurrency(c.contribProfit)} sublabel="After all variable costs" tone={c.contribProfit >= 0 ? 'positive' : 'negative'} />
                  <KPICell label="Margin / Order" value={fmtCurrencyPrecise(c.marginPerOrder)} sublabel={`AOV × ${fmtPct(grossMargin, 0)}`} />
                  <KPICell label="Max CPA" value={c.impossible ? '—' : fmtCurrencyPrecise(c.breakEvenCpa)} sublabel="Break-even ceiling" warning={c.impossible} />
                </div>

                <div className="border border-neutral-200 rounded-2xl bg-white p-6 md:p-7">
                  <div className="flex items-baseline justify-between mb-2 gap-3 flex-wrap">
                    <SectionHeader>Where every dollar goes</SectionHeader>
                    <span className="text-[11px] text-neutral-500 tabular-nums" style={{ fontFamily: '"Fira Code", monospace' }}>{fmtCurrency(c.revenue)} total</span>
                  </div>
                  <p className="text-[11px] text-neutral-500 mb-5 pl-3">Each segment = share of monthly revenue</p>
                  <div className="flex h-14 rounded-lg overflow-hidden bg-neutral-100">
                    {segments.map((s) => (
                      <div key={s.label} className="flex items-center justify-center text-white text-xs font-semibold overflow-hidden transition-all" style={{ width: `${(s.value / totalSegments) * 100}%`, backgroundColor: s.color, minWidth: s.value > 0 ? '2px' : 0 }} title={`${s.label}: ${fmtCurrency(s.value)}`}>
                        {s.value / totalSegments > 0.045 ? fmtPct((s.value / totalSegments) * 100, 0) : ''}
                      </div>
                    ))}
                  </div>
                  <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mt-5">
                    {segments.map((s) => (
                      <div key={s.label} className="flex items-center gap-2.5 min-w-0">
                        <div className="w-2 h-2 rounded-sm flex-shrink-0" style={{ backgroundColor: s.color }} />
                        <div className="min-w-0">
                          <div className="text-[10px] text-neutral-500 uppercase tracking-wider">{s.label}</div>
                          <div className="flex items-baseline gap-1.5 mt-0.5">
                            <div className="text-sm font-semibold tabular-nums text-neutral-900" style={{ fontFamily: '"Fira Code", monospace' }}>{fmtCurrency(s.value)}</div>
                            <div className="text-[11px] tabular-nums text-neutral-500" style={{ fontFamily: '"Fira Code", monospace' }}>{fmtPct((s.value / c.revenue) * 100, 1)}</div>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="border border-neutral-200 rounded-2xl bg-white p-6 md:p-7">
                    <div className="mb-5"><SectionHeader>Per-order receipt</SectionHeader></div>
                    <div className="text-[13px] space-y-2.5 text-neutral-800" style={{ fontFamily: '"Fira Code", ui-monospace, monospace' }}>
                      <div className="flex justify-between"><span>Order revenue (AOV)</span><span className="tabular-nums text-neutral-900">+{fmtCurrencyPrecise(aov)}</span></div>
                      <div className="flex justify-between text-neutral-500"><span>COGS ({fmtPct(100 - grossMargin, 0)})</span><span className="tabular-nums">−{fmtCurrencyPrecise(c.cogsPerOrder)}</span></div>
                      {includeProcessing && <div className="flex justify-between text-neutral-500"><span>Processing</span><span className="tabular-nums">−{fmtCurrencyPrecise(c.processingPerOrder)}</span></div>}
                      {includeFulfillment && <div className="flex justify-between text-neutral-500"><span>Fulfillment</span><span className="tabular-nums">−{fmtCurrencyPrecise(c.fulfillmentPerOrderCost)}</span></div>}
                      <div className="flex justify-between text-neutral-500"><span>Ad cost (CPA)</span><span className="tabular-nums">−{fmtCurrencyPrecise(c.cpa)}</span></div>
                      {includeAdFee && <div className="flex justify-between text-neutral-500"><span>Ad fee ({fmtPct(adFeePct * adFeeAppliesPct / 100, 1)})</span><span className="tabular-nums">−{fmtCurrencyPrecise(c.adFeePerOrder)}</span></div>}
                      {includeRevShare && <div className="flex justify-between text-neutral-500"><span>Rev share ({fmtPct(revSharePct, 1)})</span><span className="tabular-nums">−{fmtCurrencyPrecise(c.revSharePerOrder)}</span></div>}
                      {includeFixed && <div className="flex justify-between text-neutral-500"><span>Fixed / order</span><span className="tabular-nums">−{fmtCurrencyPrecise(c.fixedPerOrder)}</span></div>}
                      <div className="border-t border-dashed border-neutral-300 my-3" />
                      <div className="flex justify-between font-bold text-[15px]">
                        <span className="text-neutral-900">Net profit / order</span>
                        <span className={`tabular-nums ${c.netProfitPerOrder >= 0 ? 'text-emerald-700' : 'text-rose-700'}`}>{c.netProfitPerOrder >= 0 ? '+' : ''}{fmtCurrencyPrecise(c.netProfitPerOrder)}</span>
                      </div>
                    </div>
                  </div>

                  <div className="border border-neutral-200 rounded-2xl bg-white p-6 md:p-7">
                    <div className="mb-1"><SectionHeader>Profit by ROAS</SectionHeader></div>
                    <p className="text-[11px] text-neutral-500 mb-4 pl-3">Blue bar = your current {fmtRoas(c.roas)}</p>
                    <ResponsiveContainer width="100%" height={190}>
                      <BarChart data={sensitivityData} margin={{ top: 5, right: 5, left: 0, bottom: 0 }}>
                        <XAxis dataKey="roas" tick={{ fontSize: 10, fill: '#737373', fontFamily: '"Fira Code", monospace' }} axisLine={false} tickLine={false} />
                        <YAxis tick={{ fontSize: 10, fill: '#737373', fontFamily: '"Fira Code", monospace' }} tickFormatter={(v) => v === 0 ? '$0' : `${v < 0 ? '-' : ''}$${(Math.abs(v) / 1000).toFixed(0)}k`} axisLine={false} tickLine={false} width={44} />
                        <Tooltip formatter={(v) => [fmtCurrency(v), 'Net profit']} labelStyle={{ color: '#404040', fontSize: 11, fontFamily: '"Fira Sans", sans-serif' }} contentStyle={{ borderRadius: 6, border: '1px solid #e5e5e5', fontSize: 12, padding: '6px 10px', backgroundColor: '#ffffff', color: '#171717', fontFamily: '"Fira Code", monospace' }} cursor={{ fill: 'rgba(0,0,0,0.03)' }} />
                        <Bar dataKey="profit" radius={[3, 3, 0, 0]}>
                          {sensitivityData.map((d, i) => (
                            <Cell key={i} fill={d.profit < 0 ? '#fda4af' : d.isCurrent ? '#62BDEA' : '#a7f3d0'} />
                          ))}
                        </Bar>
                      </BarChart>
                    </ResponsiveContainer>
                  </div>
                </div>

                <div className="text-[11px] text-neutral-500 leading-relaxed">
                  <span className="font-semibold text-neutral-700 uppercase tracking-wider">Definitions.</span>{' '}
                  <span className="text-neutral-700">ROAS</span> = Revenue ÷ Ad Spend.{' '}
                  <span className="text-neutral-700">CPA</span> = Cost per acquisition.{' '}
                  <span className="text-neutral-700">Break-even ROAS</span> = (1 + effective ad fee%) ÷ (margin% − processing% − rev share% − per-order fixed costs/AOV).{' '}
                  <span className="text-neutral-700">Contribution profit</span> = revenue after COGS, processing, fulfillment, ad spend, and other variable costs.{' '}
                  <span className="text-neutral-700">Net profit</span> = contribution minus fixed monthly costs.
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ROASCalculator />);
  </script>
</body>
</html>
