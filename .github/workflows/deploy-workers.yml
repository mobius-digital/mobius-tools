# Deploy the workers from GitHub, not from a laptop.
#
# Every worker in this repo used to ship by running wrangler on Cole's machine,
# which made that machine a single point of failure for the whole fleet. On a
# push to main this deploys only the workers whose folder actually changed, so
# any computer — or any agent — that can push can also ship.
#
# One repository secret is required: CLOUDFLARE_API_TOKEN, created at
# dash.cloudflare.com/profile/api-tokens with the "Edit Cloudflare Workers"
# template. Without it the job is skipped rather than failed, so a fork or a
# fresh clone does not show a red X for a credential it was never given.
name: Deploy workers

on:
  push:
    branches: [main]
    paths:
      - '*/worker/**'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch:
    inputs:
      only:
        description: 'Deploy just this worker folder (e.g. ledger). Blank = all changed.'
        required: false
        default: ''

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2          # enough to diff against the previous commit

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Work out which workers changed
        id: changed
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then
            echo "dirs=${{ github.event.inputs.only }}/worker" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          dirs=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null \
            | grep -oE '^[^/]+/worker' | sort -u | tr '\n' ' ')
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "Changed worker folders: ${dirs:-none}"

      - name: Deploy
        if: steps.changed.outputs.dirs != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set — skipping deploy."
            exit 0
          fi
          for d in ${{ steps.changed.outputs.dirs }}; do
            [ -f "$d/wrangler.toml" ] || { echo "skip $d (no wrangler.toml)"; continue; }
            echo "::group::deploying $d"
            (cd "$d" && npx --yes wrangler@4 deploy)
            echo "::endgroup::"
          done
