<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Locus</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" sizes="32x32" href="../logo/locus/icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Client report pages (2026-11-19). A hand-built page for one client (profit/client-reports/), opened without a
     login at profit/r.html?t=<token>. This shell draws only the slim Locus bar; the page itself comes from
     GET /api/client-page/:token on the profit worker and runs, unchanged, in an iframe sandboxed WITHOUT
     allow-same-origin: its scripts (charts, hover, calculators) work, but it cannot reach this origin, the Locus
     session or storage. The iframe inherits prefers-color-scheme, so the page's own dark/light theme follows the
     viewer. This shell takes the safe areas; inside the iframe they read 0. */
  :root{--bg:#F4F5F7;--bar:#FFFFFF;--ink:#16181D;--muted:#646B76;--line:#E3E6EB}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1215;--bar:#15191D;--ink:#E8ECEF;--muted:#9AA3AC;--line:#262C32;color-scheme:dark}}
  :root[data-theme="dark"]{--bg:#0F1215;--bar:#15191D;--ink:#E8ECEF;--muted:#9AA3AC;--line:#262C32;color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
  body{font:14px/1.4 "Inter",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
  .top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bar);border-bottom:1px solid var(--line);
    padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));min-height:48px}
  .top .who{display:flex;align-items:center;gap:9px;min-width:0;text-decoration:none;color:inherit}
  .top .who img{width:26px;height:26px;border-radius:7px;flex:none}
  .top .who b{font-weight:700;font-size:15px;letter-spacing:-.01em}
  .top .who span{color:var(--muted);font-size:12.5px;font-weight:500;white-space:nowrap}
  .top .for{color:var(--muted);font-size:12.5px;font-weight:600;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .frame{flex:1;min-height:0;padding:0 env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
  iframe{display:block;width:100%;height:100%;border:0;background:var(--bg)}
  .msg{max-width:480px;margin:12vh auto 0;padding:0 16px;text-align:center}
  .msg h1{font-size:20px;margin:0 0 8px}
  .msg p{margin:0;color:var(--muted)}
  @media (max-width:520px){.top .who span{display:none}}
</style>
</head>
<body>
<div class="top">
  <span class="who"><img src="../logo/locus/icons/icon-192.png" alt=""><b>Locus</b><span>by Mobius Digital</span></span>
  <span class="for" id="for"></span>
</div>
<div class="frame" id="frame"><div class="msg"><p>Loading…</p></div></div>
<script>
(() => {
  const frame = document.getElementById('frame');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const worker = (() => { try { return (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && localStorage.getItem('pf_worker')) || null; } catch { return null; } })()
    || 'https://mobius-profit.mobius-digital.workers.dev';
  const fail = (h, p) => { frame.innerHTML = `<div class="msg"><h1>${esc(h)}</h1><p>${esc(p)}</p></div>`; };
  const t = new URLSearchParams(location.search).get('t') || '';
  if (!/^[a-f0-9]{32}$/.test(t)) return fail('This link is not complete', 'Check that the whole link was copied, or ask whoever sent it for a new one.');

  /* A page written for the artifact frame is a fragment (no doctype, html or body). Give it a standards-mode
     document so it lays out exactly as it did there. Links that leave the page open in a new tab (the sandbox would
     block them in place). In-page jump links (#today) are scrolled by hand: a srcdoc document resolves "#x" against
     THIS page's URL, so left alone the click navigates the frame away and it goes blank. */
  const LINKS = '<script>document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("a[href]");if(!a)return;const h=a.getAttribute("href");if(h.startsWith("#")){e.preventDefault();const t=h.length>1&&document.getElementById(decodeURIComponent(h.slice(1)));if(t)t.scrollIntoView();}else a.target="_blank"},true)<\/script>';
  const docOf = html => /^\s*<!doctype/i.test(html) ? html.replace(/<head[^>]*>/i, m => m + LINKS)
    : '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">' + LINKS + html;

  fetch(`${worker}/api/client-page/${t}`, { credentials: 'omit', referrerPolicy: 'no-referrer' }).then(async r => {
    const j = await r.json().catch(() => ({}));
    if (r.status === 429) return fail('Too many opens at once', 'Wait a minute and refresh.');
    if (!r.ok || !j.html) return fail('This page is not available', j.error || 'Ask whoever sent it for a new link.');
    document.title = `${j.title} · Locus`;
    document.getElementById('for').textContent = (j.brands || []).join(' + ');
    const f = document.createElement('iframe');
    f.setAttribute('sandbox', 'allow-scripts allow-popups allow-popups-to-escape-sandbox allow-downloads');
    f.setAttribute('title', j.title || 'Report');
    f.srcdoc = docOf(j.html);
    frame.replaceChildren(f);
  }).catch(() => fail('This page could not load', 'Check the connection and refresh.'));
})();
</script>
</body>
</html>
