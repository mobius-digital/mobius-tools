        pos[o] = c.x + a.x * ax + n.x * nz; pos[o + 1] = c.y + a.y * ax + n.y * nz; pos[o + 2] = c.z + a.z * ax + n.z * nz;

  let k;

  else {
    k = smt(0, 2.3, t);

  const swp = emo != null ? -1 : (t - 2.08) / 0.62;

  const sd = -1.9 + 3.8 * smt(0, 1, cl(swp));
  sweep.position.copy(sdir.clone().multiplyScalar(2 * sd)).add(v3(0, 0, cam.position.z * 0.93));
  sweep.lookAt(sdir.clone().multiplyScalar(sd));
  sweep.rotateZ(Math.atan2(sdir.y, sdir.x) + Math.PI / 2);
  sweep.intensity = (swp > 0 && swp < 1) ? +(Q.get('swi') || 26) * Math.sin(Math.PI * swp) : 0;

  look.flat = emo != null ? 0 : sst(2.58, 2.95, t);
  look.shadow = emo != null ? 0 : +(Q.get('shad') || 0.24) * (1 - sst(2.2, 2.75, t));
  look.fade = emo != null ? 1 : sst(0, 0.22, t);
  look.wallZ = -1.15 + 0.8 * sst(1.3, 2.3, t);
  for (const w of [wallM, wallS, wallB]) { w.position.set(0, 0, look.wallZ); w.updateMatrixWorld(); }
}

/* ---------------- path tracers ---------------- */
function mkPT() {
  const pt = new WebGLPathTracer(gl);
  pt.renderToCanvas = false; pt.rasterizeScene = false; pt.synchronizeRenderSize = false;
  pt.bounces = +(Q.get('bounces') || 6); pt.filterGlossyFactor = +(Q.get('fgf') || 0.35);
  pt.multipleImportanceSampling = true;

  /* the ribbon changes shape completely over the film: rebuild the BVH every time, never refit */
  const gen = pt._generator, orig = gen.generate.bind(gen);
  gen.generate = (...a) => {
    const r = orig(...a);
    if (r.bvhChanged && r.bvh && !r.bvh._fresh) { r.bvh = gen.bvh = new MeshBVH(r.geometry, { strategy: SAH, maxLeafTris: 1, indirect: true }); }

}
const ptM = mkPT(), ptS = mkPT(), ptB = mkPT();
const SH = +(Q.get('shs') || 0.25);
ptM._pathTracer.setSize(W, H);
ptS._pathTracer.setSize(Math.round(W * SH), Math.round(H * SH));
ptB._pathTracer.setSize(Math.round(W * SH), Math.round(H * SH));
const sleep = ms => new Promise(r => setTimeout(r, ms));
window.TT = {}; const tick = (k, t0) => { window.TT[k] = (window.TT[k] || 0) + performance.now() - t0; };
async function trace(pt, scene, n) {
  let q0 = performance.now(); pt.setScene(scene, cam); tick('setScene', q0); q0 = performance.now();
  const r = pt._pathTracer; r.reset();
  let guard = 0;
  const px = new Float32Array(4); let nc = 0; while (r.samples < n) { r.update(); if (++nc % (+(Q.get('syncn') || 1)) === 0) gl.readRenderTargetPixels(r.target, 0, 0, 1, 1, px); if (r.isCompiling) { await r._compilePromise; await sleep(5); if (++guard > 2000) throw new Error('compile stuck'); } }

/* ---------------- accumulation and compositing ---------------- */
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), qGeo = new THREE.PlaneGeometry(2, 2);
const VS = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy,0.,1.); }';
const rtAcc = new THREE.WebGLRenderTarget(W, H, { type: THREE.FloatType, depthBuffer: false, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
const rtShadow = new THREE.WebGLRenderTarget(Math.round(W * SH), Math.round(H * SH), { type: THREE.FloatType, depthBuffer: false });
const rtFlat = new THREE.WebGLRenderTarget(W * 2, H * 2, { type: THREE.HalfFloatType, samples: 4 });
const addMat = new THREE.ShaderMaterial({
  uniforms: { tex: { value: null }, k: { value: 1 } }, vertexShader: VS,
  fragmentShader: 'uniform sampler2D tex; uniform float k; varying vec2 vUv; void main(){ vec4 c = texture2D(tex, vUv); gl_FragColor = vec4(c.rgb*c.a, c.a)*k; }',
  blending: THREE.CustomBlending, blendEquation: THREE.AddEquation, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor,
  blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneFactor, depthTest: false, depthWrite: false, transparent: true,
});
/* shadow = 1 - (card with ribbon) / (card alone), only where the card is seen, softened */
const shMat = new THREE.ShaderMaterial({
  uniforms: { S: { value: null }, B: { value: null }, px: { value: new THREE.Vector2() } }, vertexShader: VS,
  fragmentShader: `uniform sampler2D S, B; uniform vec2 px; varying vec2 vUv;
    float lum(vec3 c){ return dot(c, vec3(.2126,.7152,.0722)); }
    void main(){
      float acc = 0., wsum = 0.;
      for (int i=-3;i<=3;i++) for (int j=-3;j<=3;j++){
        vec2 o = vec2(float(i),float(j))*px*1.7; float g = exp(-float(i*i+j*j)/6.0);
        vec4 s = texture2D(S, vUv+o), b = texture2D(B, vUv+o);

  depthTest: false, depthWrite: false, blending: THREE.NoBlending,

  uniforms: {
    acc: { value: rtAcc.texture }, sh: { value: rtShadow.texture }, flatT: { value: rtFlat.texture },
    uFlat: { value: 0 }, uShadow: { value: 0 }, uFade: { value: 1 }, uExpo: { value: +(Q.get('expo') || 0.75) },
    res: { value: new THREE.Vector2(W, H) }, seed: { value: 0 }, uSquare: { value: 1 },
  }, vertexShader: VS,
  fragmentShader: `uniform sampler2D acc, sh, flatT; uniform float uFlat, uShadow, uFade, uExpo, seed, uSquare; uniform vec2 res; varying vec2 vUv;
    vec3 acesF(vec3 color){

      const mat3 o = mat3(1.60475,-0.10208,-0.00327, -0.53108,1.10813,-0.07276, -0.07367,-0.00605,1.07602);

const addScene = new THREE.Scene(); const addQuad = new THREE.Mesh(qGeo, addMat); addScene.add(addQuad);
const shScene = new THREE.Scene(); shScene.add(new THREE.Mesh(qGeo, shMat));
const outScene = new THREE.Scene(); outScene.add(new THREE.Mesh(qGeo, outMat));

let frameNo = 0;
window.renderAt = async (t, sub = 8, spp = 24, shutter = 0.5, fps = 60, emo = null, sspp = 16) => {
  const t0 = performance.now();
  gl.setRenderTarget(rtAcc); gl.setClearColor(0, 0); gl.clear();
  for (let i = 0; i < sub; i++) {
    const dt = sub > 1 ? ((i + 0.5) / sub - 0.5) * shutter / fps : 0;
    if (emo != null) build(0, emo + (sub > 1 ? ((i + 0.5) / sub - 0.5) * shutter / fps / 2.0 : 0));
    else build(Math.min(T_END, Math.max(0, t + dt)), null);

  else { gl.setRenderTarget(rtFlat); gl.setClearColor(0, 0); gl.clear(); }

window.READY = true;
