    const bv = cmTrusted(b.cost_health) ? (b.window.cm ?? -Infinity) : -Infinity;
    return bv - av;
  });
  const totalTrusted = ranked.filter(a => cmTrusted(a.cost_health) && a.window.cm != null);
  $('#main').innerHTML = `${pageHead('profit', 'Profit', `What each brand kept over the last ${S.days} days, best first. Click a card for its full waterfall.`)}
    <div class="row" style="margin-bottom:12px"><span style="flex:1"></span><button class="help-btn" data-help="profit">? How to use</button></div>
    ${totalTrusted.length < S.accounts.length ? `<div class="notice warn">ℹ️ <div><b>${S.accounts.length - totalTrusted.length} client${S.accounts.length - totalTrusted.length > 1 ? 's are' : ' is'} missing from the profit ranking</b> because their cost data can't be trusted. Revenue and efficiency still work for them — see the <b>Costs</b> tab.</div></div>` : ''}
    <div id="pfAllGrid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px">
      ${ranked.map(a => {
        const w = a.window, trusted = cmTrusted(a.cost_health);
        const bar = trusted && w.sales ? Math.max(0, Math.min(100, (w.cm / w.sales) * 100)) : 0;
        return `<div class="card" data-id="${a.act_id}" style="margin:0;cursor:pointer">
          <div class="row" style="margin-bottom:6px"><b style="font-size:15px">${esc(a.name)}</b><span style="flex:1"></span>${healthPill(a.cost_health)}</div>
          <div style="font-size:24px;font-weight:700;color:${!trusted ? 'var(--muted)' : w.cm >= 0 ? 'var(--good)' : 'var(--bad)'}">${trusted ? fmtMoney(w.cm, a.currency) : 'not reported'}</div>
          <div class="tiny" style="margin-bottom:8px">${trusted ? `kept ${fmtPct(w.sales ? w.cm / w.sales : null)} of ${fmtK(w.sales, a.currency)} net sales` : `cost data unreliable — ${fmtK(w.sales, a.currency)} net sales`}</div>
          ${trusted ? `<div style="height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:8px"><div style="height:100%;width:${bar.toFixed(1)}%;background:${w.cm>=0?'var(--good)':'var(--bad)'}"></div></div>` : ''}
          <div class="tiny">MER <b>${fmtX(w.mer)}</b> · aMER <b>${fmtX(w.amer)}</b> · ${fmtPct(w.new_share)} new · spend ${fmtK(w.spend, a.currency)}</div>
        </div>`;
      }).join('')}
    </div>
    <p class="tiny" style="margin-top:12px">Contribution margin = net sales − product costs − payment fees − all ad spend. It excludes fixed costs, so it is the profitability of the marketing, not of the business. Money is each client's own currency and is never summed across them.</p>`;
  // On the grid, not #main - #main survives re-renders, so a listener there
  // stacked up one copy per visit.
  $('#pfAllGrid').addEventListener('click', e => {
    const c = e.target.closest('.card[data-id]'); if (!c) return;
    S.act = c.dataset.id; localStorage.setItem(LS.act, S.act);
    $('#clientPick').value = S.act; show('profit');
  });
}

/** Weeks, not days. A bad Tuesday is noise; a bad week is a signal. */
function weeksTable(fc, cur) {
  const w = (fc.weeks || []).filter(x => x.days_done > 0);
  if (!w.length || w[0].target == null) return '';
  return `<div class="tbl-wrap" style="margin-top:14px"><table>
    <thead><tr><th>Week</th><th class="num">Target</th><th class="num">Actual</th><th class="num">vs target</th><th class="num">Spend</th></tr></thead>
    <tbody>${w.map(x => {
      const t = x.complete ? x.target : x.target_to_date;
      const off = t ? x.sales / t - 1 : null;
      const cls = off == null ? 'unk' : off >= 0 ? 'good' : off >= -0.1 ? 'warn' : 'bad';
      return `<tr><td>${x.from.slice(5)} – ${x.to.slice(5)}${x.complete ? '' : ` <span class="tiny">(${x.days_done} of ${x.days} days)</span>`}</td>
        <td class="num">${fmtK(t, cur)}</td><td class="num"><b>${fmtK(x.sales, cur)}</b></td>
        <td class="num">${off != null ? `<span class="pill ${cls}">${fmtSigned(off)}</span>` : '—'}</td>
        <td class="num tiny">${fmtK(x.spend, cur)}</td></tr>`;
    }).join('')}</tbody></table></div>
    <p class="tiny" style="margin-top:6px">A week still running is compared only against the days that have actually elapsed, so it never looks like a miss just for being unfinished.</p>`;
}

/** Where the month lands, built bottom-up: returning customers are the predictable
 *  base, paid acquisition is the volatile top. Two scenarios, because "spend the
 *  budget" and "carry on as you are" often disagree, and that gap is the decision. */
function forecastCard(fc, cur) {
  const g = fc.goal, p = fc.projected, pace = fc.at_current_pace?.sales;
  const pill = v => v == null ? '' : `<span class="pill ${v >= 0 ? 'good' : Math.abs(v) / (g || 1) < 0.1 ? 'warn' : 'bad'}">${v >= 0 ? '+' : ''}${fmtK(v, cur)}</span>`;
  const ramp = fc.spend_ramp;
  return `<div class="card"><h3 style="margin-bottom:2px">Where the month lands</h3>
    <p class="hint" style="margin-bottom:10px">Built bottom-up from this client's own trailing 28 days, the way CTC forecast: <b>returning customers</b> are the predictable base, <b>new customers</b> follow whatever you spend. ${fc.days_elapsed} days actual, ${fc.days_remaining} to go.</p>
    <div class="tbl-wrap"><table><tbody>
      <tr><td>Banked so far</td><td class="num"><b>${fmtMoney(fc.mtd.sales, cur)}</b></td><td class="tiny">${fmtMoney(fc.mtd.returning, cur)} returning · ${fmtMoney(fc.mtd.new_rev, cur)} new · spent ${fmtK(fc.mtd.spend, cur)}</td></tr>
      <tr><td>Still to come — returning</td><td class="num">${fmtMoney(fc.expected.returning, cur)}</td><td class="tiny">${fmtMoney(fc.basis.returning_per_day, cur)}/day, shaped by weekday</td></tr>
      <tr><td>Still to come — new</td><td class="num">${fmtMoney(fc.expected.new_rev, cur)}</td><td class="tiny">${fmtK(fc.planned_spend_per_day, cur)}/day of spend at ${fmtX(fc.basis.amer)} aMER</td></tr>
      <tr style="border-top:2px solid var(--line-strong)"><td><b>Projected month</b> <span class="tiny">(spending the budget)</span></td><td class="num"><b>${fmtMoney(p, cur)}</b></td><td class="tiny">${g != null ? `vs ${fmtMoney(g, cur)} goal ${pill(fc.gap)}` : 'no goal set'}</td></tr>
      ${pace != null && Math.abs(pace - p) > (g || 1) * 0.01 ? `<tr><td>If spend stays at today's pace</td><td class="num">${fmtMoney(pace, cur)}</td><td class="tiny">${g != null ? `vs goal ${pill(fc.at_current_pace.gap)} · ` : ''}${fmtK(fc.basis.spend_per_day, cur)}/day${ramp && ramp > 1.15 ? ` — hitting the plan needs <b>${ramp.toFixed(1)}×</b> that` : ''}</td></tr>` : ''}
    </tbody></table></div>
    ${fc.to_hit && !fc.to_hit.already_there ? `<div class="notice ${fc.to_hit.covered_by_returning ? '' : fc.to_hit.spend_ramp > 1.5 ? 'warn' : ''}" style="margin:12px 0 0">${fc.to_hit.covered_by_returning ? '✓' : '→'} <div><b>To hit the goal from here:</b> ${fmtMoney(fc.to_hit.revenue_per_day, cur)}/day for the remaining ${fc.days_remaining} days. ${fc.to_hit.covered_by_returning
      ? `Returning customers alone are expected to cover that — no extra spend required.`
      : `Returning covers ${fmtMoney(fc.basis.returning_per_day, cur)} of it, so ${fmtMoney(fc.to_hit.new_per_day, cur)}/day has to come from new customers — <b>${fmtMoney(fc.to_hit.spend_per_day, cur)}/day of spend</b> at ${fmtX(fc.basis.amer)} aMER${fc.to_hit.spend_ramp ? `, which is <b>${fc.to_hit.spend_ramp.toFixed(1)}×</b> the ${fmtK(fc.basis.spend_per_day, cur)}/day running now` : ''}.`}</div></div>` : fc.to_hit?.already_there ? `<div class="notice" style="margin:12px 0 0">✓ <div><b>The goal is already banked</b> with ${fc.days_remaining} days still to run.</div></div>` : ''}
    ${weeksTable(fc, cur)}
    <p class="tiny" style="margin-top:8px">${fc.basis.email_connected
      ? `Email is <b>${fmtPct(fc.basis.email_share)}</b> of revenue for this client. It cuts across new and returning rather than being separate, so it is context here, not a third line to add up.`
      : `Klaviyo is not reporting into Triple Whale for this client, so email's contribution can't be separated out. It is still inside these numbers — just not visible on its own.`}
      CTC are explicit that paid acquisition can't be forecast precisely; the returning base is the part you can lean on.</p></div>`;
}

/** How a week actually runs for this client.
 *  DESCRIPTIVE ONLY. The plan is deliberately split evenly across the month - a
 *  day-of-week curve backtested WORSE than an even split - so this card must never
 *  read as a target. Its job is to stop a soft Monday reading as a problem, and to
 *  say plainly when a brand has no rhythm at all rather than inventing one from
 *  four Mondays of data. */
function rhythmCard(rh, cur, showCm) {
  if (!rh || !rh.enough) return '';
  const cmOk = showCm && rh.has_cm;
  // Rounding a hair under parity produced "-0%", which reads as a typo.
  const pctOff = idx => { const v = Math.round((idx - 1) * 100); return (v > 0 ? '+' : '') + v + '%'; };
  const monthsLbl = rh.months.map(m => monthLabel(m)).join(', ');
  const pill = v => v === 'strong' ? '<span class="pill good">consistently strong</span>'
    : v === 'soft' ? '<span class="pill warn">consistently soft</span>'
    : '<span class="pill unk">varies</span>';
  // Only project dollars by weekday when the rhythm is real. Splitting a plan by a
  // pattern that is chance is the exact thing this card exists to avoid.
  const wk = rh.reliable && rh.plan && rh.plan.sales != null && rh.plan.days_in_month
    ? rh.plan.sales / rh.plan.days_in_month * 7 : null;

  const rows = rh.days.map(x => `<tr${x.verdict === 'mixed' ? ' style="opacity:.62"' : ''}>
    <td><b>${esc(x.name)}</b></td>
    <td class="num"><b>${fmtPct(x.share, 1)}</b></td>
    <td class="num tiny">${x.index_lo != null ? `${pctOff(x.index_lo)} to ${pctOff(x.index_hi)}` : '—'}</td>
    <td>${pill(x.verdict)}</td>
    <td class="num">${fmtX(x.mer)}${x.mer_verdict === 'strong' ? ' <span class="pill good" style="padding:1px 5px;font-size:10px">consistently above</span>' : x.mer_verdict === 'soft' ? ' <span class="pill unk" style="padding:1px 5px;font-size:10px">consistently below</span>' : ''}</td>
    ${cmOk ? `<td class="num"><b>${x.cm_per_day != null ? fmtMoney(x.cm_per_day, cur) : '—'}</b></td>` : ''}
    ${wk != null ? `<td class="num tiny">${fmtMoney(wk * x.share, cur)}</td>` : ''}
  </tr>`).join('');

  const strong = rh.days.filter(x => x.verdict === 'strong').map(x => x.name);
  const soft = rh.days.filter(x => x.verdict === 'soft').map(x => x.name);
  const list = a => a.length === 1 ? a[0] : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];

  const verdict = rh.reliable
    ? `<div class="notice">✓ <div><b>This client has a real weekly rhythm.</b>
        ${strong.length ? `<b>${esc(list(strong))}</b> came in above an average day in <i>every</i> month looked at${soft.length ? ', while ' : '.'}` : ''}
        ${soft.length ? `<b>${esc(list(soft))}</b> came in below an average day every month.` : ''}
        The other days moved around too much to call.${rh.mer_best || rh.mer_worst ? `<br><b>On efficiency:</b> ${rh.mer_best ? `<b>${esc(rh.mer_best.name)}</b> returned the most per ad dollar (${fmtX(rh.mer_best.mer)})` : ''}${rh.mer_best && rh.mer_worst ? ', while ' : ''}${rh.mer_worst ? `<b>${esc(rh.mer_worst.name)}</b> returned the least (${fmtX(rh.mer_worst.mer)})` : ''} in every month. ${rh.cm_best && rh.mer_best && rh.cm_best.dow !== rh.mer_best.dow
        ? ` <b>But efficiency is not the same as value:</b> <b>${esc(rh.cm_best.name)}</b> actually contributes the most money (${fmtMoney(rh.cm_best.cm_per_day, cur)} a day against ${esc(rh.mer_best.name)}'s ${fmtMoney(rh.mer_best.cm_per_day, cur)}), even though its ratio is lower. A cheaper ratio on a bigger day is usually still the better day — follow the contribution margin, not the MER.`
        : ` A lower ratio does not make a day bad: a bigger day can contribute more money at a weaker MER, so read the CM column before cutting anything.`}` : ''}</div></div>`
    : `<div class="notice warn">ℹ️ <div><b>No reliable weekly rhythm.</b> This client's weekdays swing about as much from month to month as they do from each other, so the shares below are close to chance — a month only contains four of each weekday. Read this as "every day is much the same", and do not build a story around it for the client.</div></div>`;

  return `<div class="card"><h3 style="margin-bottom:2px">How a week actually runs <span class="info-i" title="Share of revenue by weekday across the last complete months. The index range is that weekday compared with an average day, one figure per month — a day is only called consistent when every month agreed. This is history for context, NOT the plan: the monthly plan is split evenly across the days on purpose, because a day-of-week curve was measured to predict worse than an even split.">i</span></h3>
    <p class="hint" style="margin-bottom:10px">Based on ${esc(monthsLbl)} — the last ${rh.months.length} <b>complete</b> months, which roll forward on their own (in September this reads June–August). Three months rather than one because a single month holds only four of each weekday, which is far too few to tell a real pattern from chance — and with one month there is nothing to check it against. <b>This is what happened, not a target.</b> Your plan is still measured evenly across the month.</p>
    ${verdict}
    <div class="tbl-wrap" style="margin-top:12px"><table>
      <thead><tr><th>Day</th>
        <th class="num">Share of week <span class="info-i" title="This weekday's revenue as a share of the whole week. Seven equal days would be 14.3% each.">i</span></th>
        <th class="num">Compared with a normal day <span class="info-i" title="How far above or below a normal day this weekday landed - shown as its WORST month and its BEST month, so you can see the spread rather than one flattering average. Monday reading -28% to -15% means that in the weakest month Mondays came in 28% under a normal day and in the strongest month still 15% under: always below, never above. A range that crosses zero (say -10% to +12%) means the day landed above average in one month and below in another, which is noise, not a pattern.">i</span></th>
        <th></th>
        <th class="num">MER <span class="info-i" title="How hard each ad dollar worked on that weekday - revenue divided by ad spend, pooled across the window. This is a RATIO, not a verdict on the day: a less efficient day that does more volume can still contribute more money, which is why the contribution margin column sits next to it. A day is tagged consistently above or below only when it beat, or trailed, this client's own average in every month looked at - more than one day can qualify, so these are not superlatives.">i</span></th>
        ${cmOk ? `<th class="num">CM per day <span class="info-i" title="Contribution margin the average day of this weekday actually produced - revenue minus product costs, fulfilment, fees and ad spend. THIS is what the day is worth. A day can be less efficient than another and still make more money, because it does more volume; when the two disagree, follow the money.">i</span></th>` : ''}
        ${wk != null ? `<th class="num">Your plan, split this way <span class="info-i" title="NOT a historical average. This takes THIS MONTH'S plan, divides it to a week, then splits that week across the days using the shares on the left. It answers: if the month goes to plan and the week keeps its usual shape, what would each day look like? Illustrative only - the Daily Brief still measures every day against an even split.">i</span></th>` : ''}
      </tr></thead>
      <tbody>${rows}</tbody></table></div>
    ${wk != null && rh.reliable ? `<p class="tiny" style="margin-top:8px">The last column spreads a <b>${fmtMoney(wk, cur)}</b> week (your ${esc(monthLabel(rh.plan.month))} plan ÷ ${rh.plan.days_in_month} × 7) across the days by their measured share. Useful for setting expectations on a call — <b>not</b> what the Daily Brief compares against.</p>` : ''}
  </div>`;
}

async function renderProfit(first) {
  if (S.act === 'all') return renderProfitAll();
  const run = ++RUN;
  if (first) $('#main').innerHTML = `<h2>Profit</h2><div class="card"><span class="hint">Loading…</span></div>`;
  let d, fc = null;
  try { d = await api(`/api/client?act=${S.act}&days=${S.days}`); }
  catch (e) { if (run === RUN) $('#main').innerHTML = `<div class="card"><span style="color:var(--bad)">${esc(e.message)}</span></div>`; return; }
  try { fc = await api(`/api/forecast?act=${S.act}`); } catch { /* forecast is a bonus, never a blocker */ }
  let rh = null;
  try { rh = await api(`/api/rhythm?act=${S.act}`); } catch { /* rhythm is context, never a blocker */ }
  if (run !== RUN) return;
  const cur = d.account.currency, t = d.totals;
  const acct = S.accounts.find(a => a.act_id === S.act);
  const h = acct?.cost_health;
  const trusted = cmTrusted(h) || d.margin_pct != null;
  const chart = salesSpendSVG(d.rows, cur);
  const step = (label, val, note, neg) => `<tr><td>${label}</td><td class="num" style="color:${neg?'var(--bad)':'inherit'}"><b>${neg?'−':''}${fmtMoney(Math.abs(val ?? 0), cur)}</b></td><td class="tiny">${note}</td></tr>`;

  $('#main').innerHTML = `${pageHead('profit', `Profit &mdash; ${esc(d.account.name)}`, `Last ${S.days} days. <b>Revenue</b> is Shopify Total Sales minus sales tax &mdash; the same line on every tab.`)}
    <div class="row" style="margin-bottom:12px">${healthPill(h)}<span style="flex:1"></span><button class="btn" id="pfShare">↗ Client link</button><button class="help-btn" data-help="profit">? How to use</button></div>
    ${d.shipping?.mode === 'uncosted' ? `<div class="notice warn">⚠️ <div><b>Shipping income has no cost behind it.</b> ${esc(d.shipping.note)}. See the <b>Costs</b> tab for what that is worth.</div></div>`
      : ''}
    ${!trusted ? `<div class="notice bad">⚠️ <div><b>Profit figures are suppressed for this client.</b> ${esc(h?.reason || 'cost data is unreliable')}. Revenue and efficiency below are still accurate — only the cost-based rows are hidden. Open the <b>Costs</b> tab to fix it.</div></div>` : ''}
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:14px">
      ${statCard('Net Sales + Shipping', fmtMoney(t.sales, cur), `${t.days} days · MTD ${fmtK(d.mtd.sales, cur)}`, 'Shopify Total Sales minus sales tax. Start from gross sales, take off discounts and returns, add what customers paid for shipping, then take off sales tax. That is the line CTC report as "Net Sales + Shipping". It is every channel - paid, organic, email, direct - and it is real Shopify money, never a platform’s attributed revenue. Triple Whale calls this figure "Total Sales" and stores it as netSales; shipping is already inside it, so it is never added twice.')}
      ${statCard('Ad Spend', fmtMoney(t.spend, cur), `${t.meta_spend!=null?`Meta ${fmtK(t.meta_spend,cur)}`:''}${t.google_spend!=null?` · Google ${fmtK(t.google_spend,cur)}`:''}`, 'Every ad platform combined, from Triple Whale. Falls back to Meta + Google spend if the blended figure is unavailable.')}
      ${statCard('MER', fmtX(t.mer), `${fmtMoney(t.sales, cur)} ÷ ${fmtMoney(t.spend, cur)}`, 'Marketing Efficiency Ratio = all store revenue ÷ all ad spend. Blended on both sides, so no platform can double-count. The single "are the ads paying for themselves" number.')}
      ${statCard('aMER', fmtX(t.amer), `${fmtPct(t.new_share)} of revenue was new customers`, 'Acquisition MER = new-customer revenue ÷ that same total ad spend. Repeat buyers and email can’t flatter it, so it isolates whether the ads are actually buying customers.')}
      ${trusted ? statCard('Contribution Margin', fmtMoney(t.cm, cur), `margin ${fmtPct(t.margin)} before ad spend`, 'What’s left after product costs, payment fees and all ad spend. NOT net profit — it ignores fixed costs like rent, salaries and software. It answers: did the marketing make money on the margin?') : ''}
    </div>
    ${trusted ? `<div class="card"><h3 style="margin-bottom:8px">Where the money went</h3>
      <div class="tbl-wrap"><table><tbody>
        ${step('Net Sales', t.net_sales, 'products only, after discounts and returns — matches Shopify’s Net Sales')}
        ${t.ship_rev ? step('Shipping charged to customers', t.ship_rev, 'what customers paid for delivery') : ''}
        <tr style="border-top:1px solid var(--line)"><td><b>Net Sales + Shipping</b></td><td class="num"><b>${fmtMoney(t.sales, cur)}</b></td><td class="tiny">total money in — the revenue line every other number here uses</td></tr>
        ${t.tax ? `<tr><td class="tiny" style="padding-left:12px;color:var(--muted)">Sales tax collected, excluded above</td><td class="num tiny" style="color:var(--muted)">${fmtMoney(t.tax, cur)}</td><td class="tiny">held for the state, never revenue${t.total_sales ? ` · Shopify Total Sales ${fmtMoney(t.total_sales, cur)}` : ''}</td></tr>` : ''}
        ${step('Product costs (COGS)', t.cogs, d.margin_pct != null ? `implied by your ${Math.round(d.margin_pct*100)}% flat margin` : 'from Triple Whale', true)}
        ${t.ship_cost ? step('Fulfilment / shipping cost', t.ship_cost, 'what delivery actually cost', true) : ''}
        ${t.handling ? step('Handling fees', t.handling, 'pick, pack and handling', true) : ''}
        ${step('Payment fees', t.fees, 'gateway and processing', true)}
        <tr style="border-top:2px solid var(--line-strong)"><td><b>Gross profit</b></td><td class="num"><b>${fmtMoney(t.gross_profit, cur)}</b></td><td class="tiny">${fmtPct(t.margin)} of revenue — before any marketing</td></tr>
        ${step('Ad spend', t.spend, 'every platform', true)}
        <tr style="border-top:2px solid var(--line-strong)"><td><b>Contribution margin</b></td><td class="num"><b style="color:${t.cm>=0?'var(--good)':'var(--bad)'}">${fmtMoney(t.cm, cur)}</b></td><td class="tiny">${t.sales?fmtPct(t.cm/t.sales):'—'} of revenue</td></tr>
      </tbody></table></div>
      <p class="tiny" style="margin-top:8px">This is CTC's definition: revenue minus <b>every variable cost</b> — product, fulfilment, handling, payment fees and ad spend. Fixed costs are deliberately excluded: rent, salaries, software and <b>our own retainer</b>. So it answers "did the marketing make money on the margin?", not "is the business profitable?"${d.shipping && d.shipping.note ? ` <br><b>Shipping:</b> ${esc(d.shipping.note)}.` : ''}</p></div>` : ''}
    ${fc && fc.mtd ? forecastCard(fc, cur) : ''}
    <div class="card"><h3 style="margin-bottom:2px">Revenue vs ad spend, day by day</h3>
      <p class="hint" style="margin-bottom:6px"><span style="color:#14608C;font-weight:700">Blue</span> is revenue — everything the store sold that day, from every channel. <span style="color:#C08A2E;font-weight:700">Amber</span> is ad spend across every platform. The gap between the lines is what was left after advertising, before product costs, fulfilment and payment fees come out of it — so it is <b>not</b> gross profit, which subtracts those but not the ads. Hover or tap for exact values.</p>
      <div id="pfReadout" class="tiny" style="min-height:18px;margin-bottom:4px">Hover or tap the chart…</div>
      ${chart.svg}</div>
    ${rhythmCard(rh, cur, trusted)}
    <div class="card"><h3 style="margin-bottom:6px">New vs returning</h3>
      <p class="hint" style="margin-bottom:0">${fmtMoney(t.new_rev, cur)} from new customers (<b>${fmtPct(t.new_share)}</b>) · ${fmtMoney(t.ret_rev, cur)} returning. What that customer <i>cost</i>, what their first order is worth and whether it pays back live on <b>Customers</b> — this page is about where the money went, that one is about who it came from.</p></div>`;

  const shareBtn = $('#pfShare');
  if (shareBtn) shareBtn.onclick = async () => {
    try {
      const r = await api('/api/profit-share', { method: 'POST', body: JSON.stringify({ act: S.act }) });
      // A blocked clipboard must not surface as an unhandled rejection - the URL is on screen regardless.
      if (navigator.clipboard) navigator.clipboard.writeText(r.url).catch(() => {});
      noteModal('Client link ready', `<p>A read-only page with <b>${esc(d.account.name)}</b>'s month so far: revenue, ad spend, MER and contribution margin against the plan.</p>
        <p class="tiny">It shows this client only — no other account, and none of the cost diagnostics from the Costs tab. Contribution margin is left out automatically if the cost data would not pass our own trust check.</p>
        <p><code style="word-break:break-all">${esc(r.url)}</code></p><p class="tiny">Copied to your clipboard.</p>`);
    } catch (e) { noteModal('Could not create the link', `<p>${esc(e.message)}</p>`); }
  };

  const svg = $('#pfSvg');
  if (svg) {
    const guide = svg.querySelector('.fx-guide'), ro = $('#pfReadout');
    const rows = d.rows, n = rows.length, W = 940, pl = 58, pr = 14;
    const inspect = clientX => {
      const rect = svg.getBoundingClientRect();
      const vx = (clientX - rect.left) / rect.width * W;
      const i = Math.max(0, Math.min(n-1, Math.round((vx - pl) / (W - pl - pr) * (n-1))));
      const gx = pl + i / Math.max(1, n-1) * (W - pl - pr);
      guide.setAttribute('x1', gx); guide.setAttribute('x2', gx); guide.setAttribute('opacity', '.55');
      const r = rows[i];
      ro.innerHTML = `<b>${r.date}</b> &nbsp; <span style="color:#14608C;font-weight:700">net sales:</span> <b>${fmtMoney(r.sales, cur)}</b>
        &nbsp; <span style="color:#C08A2E;font-weight:700">ad spend:</span> <b>${fmtMoney(r.spend, cur)}</b>
        &nbsp; MER <b>${fmtX(r.mer)}</b> &nbsp; aMER <b>${fmtX(r.amer)}</b>${r.cm!=null&&trusted?` &nbsp; CM <b>${fmtMoney(r.cm, cur)}</b>`:''}`;
    };
    svg.addEventListener('pointermove', e => inspect(e.clientX));
    svg.addEventListener('pointerdown', e => inspect(e.clientX));
  }
}

/* ---------- Costs ---------- */
function marginSVG(rows) {
  const w = 940, h = 200, pl = 46, pr = 14, pt = 12, pb = 26;
  const pts = rows.filter(r => r.margin != null);
  const n = pts.length;
  if (!n) return '<p class="hint">No cost data to chart.</p>';
  const vals = pts.map(r => r.margin);
  const lo = Math.min(0, Math.min(...vals)), hi = Math.max(1, Math.max(...vals));
  const x = i => pl + i / Math.max(1, n-1) * (w - pl - pr);
  const y = v => pt + (1 - (v - lo) / (hi - lo)) * (h - pt - pb);
  const line = pts.map((r,i) => `${x(i).toFixed(1)},${y(r.margin).toFixed(1)}`).join(' ');
  const zero = y(0);
  const ticks = Array.from({length:6},(_,k)=>Math.round(k*(n-1)/5)).map(i =>
    `<text x="${x(i).toFixed(1)}" y="${h-8}" font-size="10" text-anchor="middle" fill="#647684">${pts[i].date.slice(5)}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto">
    ${ticks}
    <line x1="${pl}" y1="${zero}" x2="${w-pr}" y2="${zero}" stroke="#9C3A2E" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="2" y="${zero+3}" font-size="9" fill="#9C3A2E">0%</text>
    <polyline points="${line}" fill="none" stroke="#14608C" stroke-width="2"/>
    <text x="2" y="${pt+9}" font-size="10" fill="#647684">${Math.round(hi*100)}%</text>
    ${lo < -0.005 ? `<text x="2" y="${h-pb}" font-size="10" fill="#647684">${Math.round(lo*100)}%</text>` : ''}
  </svg>`;
}

async function renderBriefAll(first) {
  // The shell is re-emitted in FULL on every paint, placeholder and result alike.

  // `#main .card` would inject this table into the previous page — or throw, when

  const shell = body => `${pageHead('brief', 'Daily Brief', 'Every client&rsquo;s yesterday against its plan. Pick a client top-right to read and send its brief.')}

  const cell = (a2, f2, cur, fx2) => {
    const fmt = fx2 ? (n => n == null ? '—' : n.toFixed(2) + 'x') : (n => fmtK(n, cur));
    if (a2 == null) return `<td class="num"><span class="tiny">no data</span></td>`;
    const off = f2 ? a2 / f2 - 1 : null;
    const cls = off == null ? 'unk' : (fx2 ? a2 >= f2 : off >= 0) ? 'good' : Math.abs(off) <= 0.15 ? 'warn' : 'bad';
    return `<td class="num"><b>${fmt(a2)}</b> <span class="tiny">plan ${fmt(f2)}</span>${off != null ? `<span class="pill ${cls}" style="margin-left:6px">${fmtPct(off, 0)}</span>` : ''}</td>`;

  const rows = active.map((a, i) => {

        : `<td colspan="4"><span class="tiny">${d ? 'no Triple Whale data for yesterday — open the client and hit “Refresh Triple Whale data”' : 'couldn’t load'}</span></td>`}

function briefChartSVG(d) {
  const w = 940, h = 230, pl = 56, pr = 14, pt = 12, pb = 26;
  const days = d.days, n = days.length;
  let cf = 0, ca = 0;
  const plan = [], act = [];
  for (const x of days) {
    cf += x.f.sales ?? 0; plan.push(x.f.sales != null ? cf : null);
    if (x.date <= d.up_to && x.a?.sales != null) { ca += x.a.sales; act.push(ca); } else act.push(null);
  }
  const vals = [...plan, ...act].filter(v => v != null);
  if (!vals.length) return { svg: '<p class="hint">No data to chart yet.</p>', plan, act };
  let min = 0, max = Math.max(...vals) * 1.06 || 1;
  const x = i => pl + i / Math.max(1, n - 1) * (w - pl - pr);
  const y = v => pt + (1 - (v - min) / (max - min)) * (h - pt - pb);
  const line = arr => arr.map((v, i) => v == null ? null : `${x(i).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean).join(' ');
  const ticks = Array.from({ length: 6 }, (_, k) => Math.round(k * (n - 1) / 5)).map(i =>
    `<text x="${x(i).toFixed(1)}" y="${h - 8}" font-size="10" text-anchor="middle" fill="#647684">${days[i].date.slice(5)}</text>`).join('');
  const cur = d.account.currency;
  const svg = `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;touch-action:none" id="bfSvg">
    ${ticks}
    <line class="fx-guide" x1="0" x2="0" y1="${pt}" y2="${h - pb + 4}" stroke="#14608C" stroke-width="1" opacity="0" pointer-events="none"/>
    <polyline points="${line(plan)}" fill="none" stroke="#9FB0BC" stroke-width="1.8" stroke-dasharray="5 4"/>
    <polyline points="${line(act)}" fill="none" stroke="#14608C" stroke-width="2.4"/>
    <text x="2" y="${pt + 9}" font-size="10" fill="#647684">${fmtK(max, cur)}</text>
    <text x="2" y="${h - pb}" font-size="10" fill="#647684">${fmtK(0, cur)}</text>
  </svg>`;
  return { svg, plan, act };
}

async function renderBrief(first) {
  if (S.act === 'all') return renderBriefAll(first);
  const acct = S.accounts.find(a => a.act_id === S.act);
  // Same rule as renderBriefAll: every paint re-emits the whole page. Appending to
  // whatever `#main` happens to hold would graft this brief onto the outgoing tab.
  const shell = body => `${pageHead('brief', 'Daily Brief', `Did ${esc(acct?.name || 'this client')} beat the plan yesterday? Forecast vs actual, and the story behind it.`)}
    ${body}`;
  const run = ++RUN;
  if (first) $('#main').innerHTML = shell('<div class="card"><span class="hint">Loading…</span></div>');
  let d;
  try { d = await api('/api/brief?act=' + S.act + (BF.date ? '&date=' + BF.date : '')); }
  catch (e) { if (run === RUN) $('#main').innerHTML = `<div class="card"><span style="color:var(--bad)">${esc(e.message)}</span></div>`; return; }
  if (run !== RUN) return;
  BF.cur = d;
  const cur = d.account.currency;
  const day = d.days.find(x => x.date === d.date);
  const f = day?.f || {}, a = day?.a || {};
  const g = d.goals || {};
  const fx = n => n == null ? '—' : n.toFixed(2) + 'x';
  const offPill = (aV, fV, lowerIsBetter = false) => {
    if (aV == null || !fV) return '';
    const off = aV / fV - 1;
    const good = lowerIsBetter ? off <= 0.05 : off >= 0;
    const cls = good ? 'good' : Math.abs(off) <= 0.15 ? 'warn' : 'bad';
    return `<span class="pill ${cls}">${fmtPct(off, 0)} vs plan</span>`;
  };
  const statCard = (label, aV, fV, fmt, info, lower = false) => `
    <div class="card" style="margin:0">

/* Slack mrkdwn -> HTML. Slack's own flavour, NOT markdown: bold is *one
   asterisk*, italic _underscores_, links <url|label>. Escaped first, so
   everything below operates on already-safe text. */
const SLACK_EMOJI = {
  wave:'\u{1F44B}', memo:'\u{1F4DD}', bar_chart:'\u{1F4CA}', clipboard:'\u{1F4CB}',
  warning:'\u26A0\uFE0F', rotating_light:'\u{1F6A8}', white_check_mark:'\u2705', x:'\u274C',
  chart_with_upwards_trend:'\u{1F4C8}', chart_with_downwards_trend:'\u{1F4C9}',
  rocket:'\u{1F680}', tada:'\u{1F389}', fire:'\u{1F525}', eyes:'\u{1F440}',
  moneybag:'\u{1F4B0}', money_with_wings:'\u{1F4B8}', dart:'\u{1F3AF}', trophy:'\u{1F3C6}',
  green_circle:'\u{1F7E2}', red_circle:'\u{1F534}', large_yellow_circle:'\u{1F7E1}',
  arrow_up:'\u2B06\uFE0F', arrow_down:'\u2B07\uFE0F', point_right:'\u{1F449}',
  bulb:'\u{1F4A1}', pushpin:'\u{1F4CC}', calendar:'\u{1F4C5}', hourglass:'\u23F3',
  raised_hands:'\u{1F64C}', muscle:'\u{1F4AA}', thinking_face:'\u{1F914}', pray:'\u{1F64F}',
  star:'\u2B50', sparkles:'\u2728', zap:'\u26A1', stopwatch:'\u23F1\uFE0F',
};
function slackToHtml(src) {
  let t = esc(String(src || ''));
  t = t.replace(/&lt;(https?:\/\/[^|&\s]+)\|([^&]*?)&gt;/g,
    (m, u, l) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${l}</a>`);
  t = t.replace(/&lt;(https?:\/\/[^|&\s]+)&gt;/g,
    (m, u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
  t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s.,:;!?)]|$)/gm, '$1<b>$2</b>');
  t = t.replace(/(^|[\s(])_([^_\n]+)_(?=[\s.,:;!?)]|$)/gm, '$1<i>$2</i>');
  t = t.replace(/(^|[\s(])~([^~\n]+)~(?=[\s.,:;!?)]|$)/gm, '$1<s>$2</s>');
  t = t.replace(/:([a-z0-9_+-]+):/gi, (m, n) => SLACK_EMOJI[n.toLowerCase()] || m);
  return t;
}
/** The message in its Slack clothes, so what you approve is what they receive. */
function slackPreview(text, opts = {}) {
  return `<div class="slackmsg"><div class="sm-hdr">
      <span class="sm-av">${esc(opts.icon || '\u{1F44B}')}</span>
      <span class="sm-who">${esc(opts.who || 'Daily Update')}</span>
      <span class="sm-tag">app</span>
      <span class="sm-when">${esc(opts.when || 'this is how it will look in Slack')}</span>
    </div>${slackToHtml(text)}</div>`;
}

const addDaysStr = (ymd, n) => { const dt = new Date(ymd + 'T12:00:00Z'); dt.setUTCDate(dt.getUTCDate() + n); return dt.toISOString().slice(0, 10); };

/* ---------- Weekly / Monthly Reports ----------
   Frozen snapshots, drafted by the cron (Monday = last Mon–Sun, the 1st = last
   month), reviewed here, sent to the client's Slack with a button. The client
   reads the same page through ?reports=<token> — sent reports only. The engine
   lives on the account-health worker; these endpoints are proxied. */
// `act` records which client the selection belongs to (same trap as PL).
const RP = { act: null, period: null, start: null };
// The client archive link has no session, so its token IS the credential for
// playback. Null on every internal view, which is what selects session auth.
const RS = { token: null };
const shortD = ymd => `${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+ymd.slice(5, 7) - 1]} ${+ymd.slice(8, 10)}`;
/** Change-log categories are stored as snake_case ids; a raw CAMPAIGN_RELAUNCHED
 *  both reads like a database dump and overflows its column. `n` pluralises the
 *  rollup counts ("14 new ads"). */
const CAT_LABELS = {
  budget: ['budget change', 'budget changes'], bid_strategy: ['bid change', 'bid changes'],
  new_campaign: ['new campaign', 'new campaigns'], new_adset: ['new ad set', 'new ad sets'],
  campaign_paused: ['campaign paused', 'campaigns paused'],
  campaign_relaunched: ['campaign relaunched', 'campaigns relaunched'],
  new_creative: ['new ad', 'new ads'], ad_paused: ['ad paused', 'ads paused'],
  ad_relaunched: ['ad relaunched', 'ads relaunched'],
  targeting: ['targeting change', 'targeting changes'],
  optimisation: ['optimisation change', 'optimisation changes'],
  schedule: ['schedule change', 'schedule changes'],
  billing: ['billing event', 'billing events'], review: ['policy review', 'policy reviews'],
};
const catLabel = (c, n) => {
  const e = CAT_LABELS[c];
  if (!e) return String(c).replace(/_/g, ' ');
  return n == null ? e[0] : (n === 1 ? e[0] : e[1]);
};
const repRangeLabel = r => r.period === 'monthly' ? monthLabel(r.start.slice(0, 7)) : `${shortD(r.start)} – ${shortD(r.end)}, ${r.end.slice(0, 4)}`;

/** The report page itself. Shared verbatim between the internal tab and the
 *  client link, so what you review is exactly what they open — the only
 *  differences are the edit button and the internal-only change log. */
function reportBodyHTML(d, summary, opts = {}) {
  const cur = d.account?.currency || opts.currency || 'USD';
  const t = d.totals || {}, p = d.previous || {}, f = d.forecast || {};
  const prevTag = d.period === 'weekly' ? 'week' : 'month';

  const vsPill = (a, b, lower) => {
    if (a == null || b == null || !b) return '';
    const off = a / b - 1;
    if (!isFinite(off)) return '';
    const good = lower ? off <= 0.05 : off >= -0.02;
    const cls = good ? 'good' : Math.abs(off) <= 0.12 ? 'warn' : 'bad';
    // Round FIRST, then sign — fmtSigned on a hair-under-parity value renders "-0%".
    const r = Math.round(off * 100);
    return `<span class="pill ${cls}">${r > 0 ? '+' : ''}${r}%</span>`;
  };
  const kpi = (label, aV, fmt, fV, pV, lower, info) => `<div class="card" style="margin:0">
    <div class="av-label" style="font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px">${label}${info ? ` <span class="info-i" title="${esc(info)}">i</span>` : ''}</div>
    <div style="font-size:clamp(19px,2.1vw,26px);font-weight:700;margin:4px 0 5px">${fmt(aV)}</div>
    <div class="tiny" style="display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center">${fV != null ? `forecast ${fmt(fV)} ${vsPill(aV, fV, lower)}` : '<span>no forecast</span>'}</div>
    <div class="tiny" style="display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin-top:2px">${pV != null ? `prior ${prevTag} ${fmt(pV)} ${vsPill(aV, pV, lower)}` : ''}</div>
  </div>`;
  const money = n => fmtMoney(n, cur);

  const sumFmt = s => esc(s).split('\n').map(l =>
    ['The period in brief', 'What mattered', "What's next"].includes(l.trim()) ? `<b>${l}</b>` : l).join('\n');
  const sumHtml = summary ? `<div class="card" style="border-left:3px solid var(--brand)">
      <div class="row" style="margin-bottom:6px"><h3 style="margin:0">Summary</h3><span style="flex:1"></span>${opts.editable ? '<button class="btn" id="rpEditSum" style="font-size:12px;padding:5px 9px">✎ Edit</button>' : ''}</div>
      <div id="rpSumBox" style="white-space:pre-wrap;font-size:14px;line-height:1.65">${sumFmt(summary)}</div></div>`
    : opts.editable ? `<div class="card" style="border-left:3px solid var(--warn)"><h3 style="margin-bottom:4px">Summary</h3>
      <p class="hint">No narrative was written (the Claude call failed at generation time). Hit ↻ Regenerate to retry.</p></div>` : '';

  const kpis = [
    kpi('Revenue', t.sales, money, f.sales, p.sales, false, 'Shopify Total Sales minus sales tax — every channel (paid, organic, email, direct), after discounts and returns, including shipping charged to customers. Not any ad platform’s attributed number.'),
    kpi('Ad spend', t.spend, money, f.spend, p.spend, true, 'Every platform combined — Meta, Google and anything else Triple Whale tracks.'),
    kpi('MER', t.mer, fmtX, f.mer, p.mer, false, 'All store revenue ÷ all ad spend, blended on both sides. The honest “are the ads paying for themselves” number — the same thing as blended ROAS.'),
    kpi('aMER', t.amer, fmtX, f.amer, p.amer, false, 'New-customer revenue ÷ that same total ad spend. Repeat buyers and email can’t flatter it — this is what the ads actually bought.'),
    t.cm != null ? kpi('Contribution margin', t.cm, money, f.cm, p.cm, false, 'Revenue minus every variable cost — product, fulfilment, handling, payment fees and ad spend. Excludes fixed costs like rent, salaries and software.') : '',
    kpi('New-customer CPA', t.ncpa, money, null, p.ncpa, true, 'Total ad spend ÷ new customers acquired. Blended — not any platform’s self-reported CPA.'),
    kpi('Orders', t.orders, fmtInt, null, p.orders, false, 'Total store orders in the period.'),
    kpi('Average order value', t.aov, money, null, p.aov, false, 'Revenue ÷ orders.'),
  ].join('');

  const pc = d.pacing;
  const pacingHtml = pc && pc.goal_sales ? (() => {
    const done = Math.min(1.2, (pc.mtd_sales ?? 0) / pc.goal_sales);
    const expected = Math.min(1, (pc.plan_to_date ?? 0) / pc.goal_sales);
    const off = pc.plan_to_date ? (pc.mtd_sales / pc.plan_to_date - 1) : null;
    // Round before signing, and state the gap in MONEY as well as a percentage —
    // "behind by 11%" is an abstraction; "$9,346 short" is the conversation.
    const offPct = off == null ? null : Math.round(Math.abs(off) * 100);
    const endGap = pc.projected != null ? pc.projected - pc.goal_sales : null;
    const behindNow = pc.plan_to_date != null ? pc.mtd_sales - pc.plan_to_date : null;
    return `<div class="card"><h3 style="margin-bottom:2px">Where ${esc(monthLabel(pc.month))} stands</h3>
      <p class="hint" style="margin-bottom:6px">${pc.days_elapsed} of ${pc.days_in_month} days in. The bar is revenue booked so far; the marker on it is where the month was forecast to be by today.</p>
      <div class="pace-bar"><div class="fill" style="width:${(Math.min(1, done) * 100).toFixed(1)}%"></div><div class="mark" style="left:${(expected * 100).toFixed(1)}%"></div></div>
      <div class="pc-stats">
        <div class="st"><b>${money(pc.mtd_sales)}</b><span>Revenue so far</span></div>
        <div class="st"><b>${money(pc.plan_to_date)}</b><span>Forecast by today</span></div>
        <div class="st"><b>${money(pc.projected)}</b><span>On pace to finish</span></div>
        <div class="st"><b>${money(pc.goal_sales)}</b><span>Month target</span></div>
      </div>
      ${offPct != null ? `<p style="font-size:13.5px;margin-top:10px">${off >= -0.02
        ? `<b>Ahead of forecast</b> — ${money(pc.mtd_sales)} booked against ${money(pc.plan_to_date)} forecast by today${behindNow > 0 ? `, ${money(behindNow)} to the good` : ''}.`
        : `<b>Behind forecast by ${offPct}%</b> — ${money(pc.mtd_sales)} booked against ${money(pc.plan_to_date)} forecast by today, a shortfall of ${money(Math.abs(behindNow))}.`}${
        endGap != null ? ` At this pace ${esc(monthLabel(pc.month))} finishes around <b>${money(pc.projected)}</b>, ${endGap >= 0 ? `${money(endGap)} above` : `${money(Math.abs(endGap))} short of`} the ${money(pc.goal_sales)} target.` : ''}</p>` : ''}
    </div>`;
  })() : '';

  const chartId = opts.internal ? 'rpSvg' : 'rsSvg';
  const chartHtml = (d.chart || []).length > 1 ? `<div class="card"><h3 style="margin-bottom:2px">Day by day</h3>
    <p class="hint" style="margin-bottom:6px"><span style="color:#14608C;font-weight:700">Blue</span> is revenue — everything the store sold that day, from every channel. <span style="color:#C08A2E;font-weight:700">Amber</span> is ad spend across every platform. The gap between the lines is what was left after advertising, before product costs, fulfilment and payment fees come out of it.</p>
    <div id="${chartId}Readout" class="tiny" style="min-height:18px;margin-bottom:4px">Hover or tap any day for its exact figures…</div>
    ${salesSpendSVG(d.chart, cur, chartId).svg}</div>` : '';

  const splitHtml = t.new_rev != null ? `<div class="card"><h3 style="margin-bottom:6px">New customers vs returning</h3>
    <p style="font-size:14px;margin:4px 0"><b>${money(t.new_rev)}</b> came from first-time buyers (<b>${fmtPct(t.new_share)}</b> of revenue) and <b>${money(t.ret_rev)}</b> from customers coming back${p.new_share != null ? ` — the ${prevTag} before, new customers were ${fmtPct(p.new_share)}` : ''}.</p>
    <div style="height:10px;border-radius:99px;overflow:hidden;display:flex;margin-top:8px">
      <div style="width:${((t.new_share || 0) * 100).toFixed(1)}%;background:var(--brand-ink)"></div>
      <div style="flex:1;background:var(--line-strong)"></div></div></div>` : '';

  // Creative sits INSIDE its platform's section, so everything about one channel
  // reads as one story. Meta is the only channel with ad-level data today; the
  // block is written to drop under any channel that gains it.
  const adsBlock = () => {
    const A = d.ads;
    if (!A?.top?.length) return '';
    const o = A.others;
    // Judge against THIS account's own median where there is enough data to
    // compute one, because "better than our normal" is the decision a buyer
    // actually makes; fall back to Motion's published benchmark otherwise, and
    // say which bar is being used either way.
    const BM = A.benchmarks;
    const rate = (v, ok, strong, own) => {
      if (v == null) return null;
      if (own != null) {
        const r = v / own;
        return { pct: fmtPct(v), bar: fmtPct(own), own: true,
          tag: r >= 1.15 ? 'above' : r <= 0.85 ? 'below' : 'typical' };
      }
      return { pct: fmtPct(v), bar: fmtPct(strong), own: false,
        tag: v >= strong ? 'strong' : v >= ok ? 'average' : 'low' };
    };
    // A delta only earns its place when there is a real prior figure to compare
    // with; a brand-new ad gets nothing rather than a misleading +100%.
    const dlt = (now, then, lower) => {
      if (now == null || then == null || !then) return '';
      const off = Math.round((now / then - 1) * 100);
      if (off === 0) return '';
      const good = lower ? off < 0 : off > 0;
      return ` <span class="dlt ${good ? 'up' : 'dn'}">${off > 0 ? '+' : ''}${off}%</span>`;
    };
    // label … value delta — the value is what you scan down the column, the
    // change qualifies it, so the change reads after it.
    const row = (label, val, extra, before) => `<div class="ad-row"><span>${label}</span>${before || ''}<b>${val}</b>${extra || ''}</div>`;
    // A verdict WORD, not a bar. The bar was scaled against the benchmark, which
    // meant nothing without knowing the benchmark — Cole read it as "out of 100"
    // and could not tell good from bad. The word says which it is; the colour
    // only reinforces it.
    const GOOD = new Set(['strong', 'above']), OK = new Set(['average', 'typical']);
    const verdict = r => !r ? '' : `<span class="vtag ${GOOD.has(r.tag) ? 'good' : OK.has(r.tag) ? 'ok' : 'bad'}">${r.tag}</span>`;
    const card = (a, i) => {
      const hook = rate(a.hook, 0.20, 0.30, BM?.hook), hold = rate(a.hold, 0.40, 0.60, BM?.hold);
      const media = a.thumb
        ? `<img src="${a.thumb}" alt="Creative for ${esc(a.name)}">`
        : `<span aria-hidden="true">${a.video ? '&#9654;' : '&#9633;'}</span>`;
      // Play ONLY on a real video, and only when we have the ad id needed to
      // resolve its mp4. Reports frozen before that field existed keep the
      // cover image and the link out, which is the honest degradation.
      const canPlay = a.video && a.ad_id;
      return `<article class="ad-card" data-ad="${i}">
        <div class="ad-media${a.thumb ? '' : ' none'}"${canPlay ? ` data-ad="${esc(a.ad_id)}"` : ''}${canPlay && a.preview ? ` data-preview="${esc(a.preview)}"` : ''}>
          ${media}<span class="ad-rank">${i + 1}</span>
          <span class="ad-type">${a.video ? 'Video' : 'Image'}</span>
          ${a.duration ? `<span class="ad-dur">${Math.round(a.duration)}s</span>` : ''}
          ${canPlay ? `<button class="ad-play" type="button" title="Play this video ad"><i>&#9654;</i></button>` : ''}
        </div>
        <div class="ad-body">
          ${a.preview
            ? `<a class="ad-name ad-link" href="${esc(a.preview)}" target="_blank" rel="noopener noreferrer" title="${esc(a.name)}">${esc(a.name)}<span class="ext">↗</span></a>`
            : `<span class="ad-name" title="${esc(a.name)}">${esc(a.name)}</span>`}
          <div class="ad-stats">
            ${row('Spend', money(a.spend), dlt(a.spend, a.prev_spend))}
            ${row('ROAS', a.roas != null ? fmtX(a.roas) : '—', dlt(a.roas, a.prev_roas))}
            ${row('CPA', a.cpa != null ? money(a.cpa) : '—', dlt(a.cpa, a.prev_cpa, true))}
            ${row('Purchases', fmtInt(a.purchases))}
            ${a.hook != null ? row(`Hook rate <em class="bm">vs ${hook.bar}${hook.own ? ' here' : ''}</em>`, hook.pct, verdict(hook)) : ''}
            ${a.hold != null ? row(`Hold rate <em class="bm">vs ${hold.bar}${hold.own ? ' here' : ''}</em>`, hold.pct, verdict(hold)) : ''}
          </div>
          ${(() => {
            // The ad's own format tag plus its state — the two things you would
            // otherwise have to open the card to learn.
            const m = /\|([^|]+)$/.exec(a.name || '');
            const tag = m && /[a-z]/i.test(m[1]) ? m[1].trim() : null;
            const chips = [tag ? `<span>${esc(tag)}</span>` : '',
              a.status && a.status !== 'ACTIVE' ? `<span class="grey">${esc(a.status.toLowerCase().replace(/_/g, ' '))}</span>` : ''].filter(Boolean).join('');
            return chips ? `<div class="ad-chips">${chips}</div>` : '';
          })()}
          <div class="ad-open"><span>Details</span><span aria-hidden="true">→</span></div>
        </div></article>`;
    };
    const metricInfo = 'Spend, purchases, CPA and ROAS are Meta-reported for this ad. '
      + 'Hook rate is 3-second video views divided by impressions — did the ad stop the scroll. '
      + 'Hold rate is ThruPlay views divided by 3-second views — of the people it stopped, how many stayed. '
      + 'CTR is link clicks divided by impressions. The words strong, average and low come from Motion’s published benchmarks across many accounts '
      + '(hook 30% and up is strong, under 20% is low; hold 60% and up is strong, under 40% is low), not from this account’s own history. '
      + 'Image ads have no hook or hold rate because there is nothing to watch.';
    // The grid shows the biggest ads; this reconciles them back to every ad that
    // spent, so the section can never read as if it were the whole account.
    const recRow = (label, x, bold) => `<tr${bold ? ' style="border-top:2px solid var(--line-strong)"' : ''}><td>${bold ? `<b>${label}</b>` : label}</td>
      <td class="num"><b>${money(x.spend)}</b></td><td class="num">${fmtPct(x.share)}</td>
      <td class="num">${fmtInt(x.purchases)}</td><td class="num">${x.cpa != null ? money(x.cpa) : '—'}</td>
      <td class="num">${x.roas != null ? fmtX(x.roas) : '—'}</td></tr>`;
    const shownTot = A.top.reduce((s, a) => ({
      spend: s.spend + (a.spend || 0), purchases: s.purchases + (a.purchases || 0), revenue: s.revenue + (a.revenue || 0),
    }), { spend: 0, purchases: 0, revenue: 0 });
    const tot = {
      spend: shownTot.spend + (o?.spend || 0), purchases: shownTot.purchases + (o?.purchases || 0),
      revenue: shownTot.revenue + (o?.revenue || 0),
    };
    const fin = x => ({ ...x, share: A.total_spend ? x.spend / A.total_spend : null,
      cpa: x.purchases ? x.spend / x.purchases : null, roas: x.spend && x.revenue ? x.revenue / x.spend : null });

    const formats = A.formats?.length ? (() => {
      const real = A.formats.filter(f => f.label !== 'Untagged' && f.purchases > 0);
      const best = real.slice().sort((a, b) => (b.roas || 0) - (a.roas || 0));
      const verdict = best.length >= 2 && best[0].roas && best[best.length - 1].roas
        ? `<p style="font-size:13.5px;margin-top:10px"><b>${esc(best[0].label)}</b> returned ${fmtX(best[0].roas)} on ${money(best[0].spend)}, against <b>${fmtX(best[best.length - 1].roas)}</b> from ${esc(best[best.length - 1].label)} on ${money(best[best.length - 1].spend)}.</p>` : '';
      return `<h4 style="font-size:13.5px;font-weight:700;margin:20px 0 2px">Which kinds of creative the money went to</h4>
        <p class="hint" style="margin-bottom:8px">Split by the format tag in each ad's own name — the part after the last <code>|</code>. Every ad that spent this ${prevTag} is counted, not just the ones shown above.${A.formats_tagged_share != null ? ` <b>${fmtPct(A.formats_tagged_share)}</b> of ad spend carries a tag; the rest is grouped as Untagged, so the rows still add up to every ad that spent.` : ''}</p>
        <div class="tbl-wrap"><table><thead><tr><th>Format</th><th class="num">Ads</th><th class="num">Spend</th><th class="num">Share</th><th class="num">Purchases</th><th class="num">CPA</th><th class="num">ROAS</th></tr></thead>
        <tbody>${A.formats.map(f => `<tr><td><b>${esc(f.label)}</b></td><td class="num">${fmtInt(f.count)}</td>
          <td class="num"><b>${money(f.spend)}</b></td><td class="num">${fmtPct(f.share)}</td>
          <td class="num">${fmtInt(f.purchases)}</td><td class="num">${f.cpa != null ? money(f.cpa) : '—'}</td>
          <td class="num">${f.roas != null ? fmtX(f.roas) : '—'}</td></tr>`).join('')}</tbody></table></div>${verdict}`;
    })() : '';

    // A report frozen before the creative fields existed has no ad ids, so no
    // playback and no ad copy. That reads as a broken feature rather than an old
    // snapshot, so it says which it is. Internal only — a client has no
    // Regenerate button and the report they were sent is the one they get.
    const stale = opts.internal && !A.top.some(a => a.ad_id)
      ? `<div class="notice warn" style="margin:12px 0">⚠️ <div><b>This report predates the creative upgrade.</b> It was generated before cover art, inline playback and ad copy existed, so the cards below show numbers only. Hit <b>↻ Regenerate</b> above to rebuild it — the ads, the money and the summary all refresh together.</div></div>`
      : '';
    return `<h4 style="font-size:13.5px;font-weight:700;margin:18px 0 2px">Where the budget went <span class="info-i" title="${esc(metricInfo)}">i</span></h4>
      ${stale}
      <p class="hint" style="margin-bottom:10px">The ads that carried real spend this ${prevTag}, biggest first.${A.qualified_total > A.top.length ? ` Showing the ${A.top.length} biggest of ${A.qualified_total} that cleared ${money(A.floor)}.` : ''} ${A.top.some(a => a.preview) ? 'Press ▶ to play the ad right here — no Facebook login needed. Meta’s preview links expire after a few months, so on an older report the image always stays but play may not.' : ''}</p>
      <div class="ad-grid">${A.top.map(card).join('')}</div>
      <div class="tbl-wrap"><table><thead><tr><th>Adding up to every ad that spent</th><th class="num">Spend</th><th class="num">Share</th><th class="num">Purchases</th><th class="num">CPA</th><th class="num">ROAS</th></tr></thead>
        <tbody>${recRow(`The ${A.top.length} ad${A.top.length === 1 ? '' : 's'} above`, fin(shownTot))}
        ${o ? recRow(`${fmtInt(o.count)} smaller ads combined${o.biggest != null ? ` · biggest ${money(o.biggest)}` : ''}`, fin({ spend: o.spend, purchases: o.purchases || 0, revenue: o.revenue || 0 })) : ''}
        ${o ? recRow(`All ${fmtInt(A.total_ads)} ads that spent`, fin(tot), true) : ''}</tbody></table></div>
      ${A.standout ? `<p style="font-size:13.5px;margin-top:10px">Most efficient of the ads with real spend: <b>${esc(A.standout.name)}</b> at a <b>${money(A.standout.cpa)}</b> CPA.</p>` : ''}
      <p class="tiny" style="margin-top:6px">Every ad that spent is accounted for above. There is deliberately no single "best ad": the biggest spender, the best CPA and the best ROAS are usually three different ads, so this shows where the money actually went and what each part of it returned.</p>
      ${formats}`;
  };

  // `peer` is Triple Whale's benchmark against comparable stores. It only
  // appears on the metrics TW actually benchmarks, and is deliberately a plain
  // number rather than a verdict - it is context, not a target.
  const chRow = (label, a, pv, fmt, lower, peer) => (a == null && pv == null) ? '' :
    `<tr><td>${label}</td><td class="num"><b>${fmt(a)}</b></td><td class="num">${fmt(pv)}</td><td class="num">${a != null && pv ? vsPill(a, pv, lower) : '<span class="tiny">—</span>'}</td><td class="num">${peer != null ? `<span class="tiny">${fmt(peer)}</span>` : ''}</td></tr>`;
  const chCard = c => {
    const A = c.cur || {}, P = c.prev || {};
    let rows = '', note = '';
    if (['meta', 'google', 'tiktok', 'pinterest'].includes(c.id)) {
      rows = chRow('Spend', A.spend, P.spend, money, true)
        + chRow('Attributed revenue', A.revenue, P.revenue, money)
        // A ROAS built on fewer than two conversions is one order's value over the
        // whole window's spend, so it is withheld rather than printed as a result.
        // Grunk 2026-08-29 read 0.16x off exactly one $19.95 Google conversion, and
        // that number reached a client brief as though it described the day.
        + (A.low_signal
            ? `<tr><td>ROAS</td><td class="num" colspan="4"><span class="tiny">Not enough conversions to report</span></td></tr>`
            : chRow('ROAS', A.roas, P.roas, fmtX, false, A.peer_roas))
        + chRow('Purchases', A.purchases, P.purchases, fmtInt)
        + chRow('CPA', A.cpa, P.cpa, money, true)
        + chRow('CPM', A.cpm, P.cpm, money, true, A.peer_cpm)
        + chRow('CTR', A.ctr, P.ctr, n => fmtPct(n, 2), false, A.peer_ctr);
      note = `Revenue, ROAS and CPA here are <b>${esc(A.source || c.label + "-reported")}</b> — ${esc(c.label)}'s own attributed figures, passed through by Triple Whale rather than measured by it. They are directional, and deliberately not comparable to the blended scorecard above, which counts every sale once. Expect them to sit BELOW Triple Whale's own Blended ROAS headline, which divides the whole store's order revenue by every platform's spend at once.`
        + (A.low_signal ? ` <b>ROAS withheld:</b> ${esc(c.label)} recorded ${A.purchases === 0 ? 'no' : 'one'} conversion in this period. A ratio off that is one order, not a rate, so the spend is shown and the ratio is not.` : '')
        + (A.peer_cpm != null || A.peer_ctr != null ? ` <b>Peers</b> is Triple Whale's benchmark across comparable stores.` : '')
        + (A.awaiting_tw ? ` <b>Spend only:</b> Triple Whale has not synced this period yet, so this is Meta-reported spend with no attribution behind it.` : '');
    } else if (c.id === 'amazon') {
      rows = chRow('Sales', A.sales, P.sales, money)
        + chRow('Orders', A.orders, P.orders, fmtInt)
        + chRow('Refunds', A.refunds, P.refunds, money, true);
      note = 'Amazon storefront sales — a separate channel, not included in the store revenue above.'
        + (A.data_through && A.data_through < d.end ? ` Amazon reports with a delay: data runs through ${shortD(A.data_through)}.` : '');
    } else if (c.id === 'email') {
      rows = chRow('Email-attributed revenue', A.revenue, P.revenue, money)
        + chRow('From campaigns', A.campaigns, P.campaigns, money)
        + chRow('From flows', A.flows, P.flows, money);
      note = (t.sales && A.revenue != null ? `Klaviyo-attributed — ${fmtPct(A.revenue / t.sales)} of the period's revenue. ` : 'Klaviyo-attributed. ')
        + 'Email revenue overlaps both new and returning customers, so it is shown for context and never added to anything.';
    }
    if (!rows) return '';
    return `<div class="card"><h3 style="margin-bottom:8px">${esc(c.label)}</h3>
      <div class="tbl-wrap"><table><thead><tr><th></th><th class="num">This ${prevTag}</th><th class="num">Prior ${prevTag}</th><th class="num">Change</th><th class="num" title="Triple Whale's benchmark across comparable stores. Context, not a target.">Peers</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
      <p class="tiny" style="margin-top:8px">${note}</p>
      ${c.id === 'meta' ? adsBlock() : ''}</div>`;
  };

  const weeksHtml = d.weeks?.length ? `<div class="card"><h3 style="margin-bottom:8px">How the month ran, week by week</h3>
    <div class="tbl-wrap"><table><thead><tr><th>Week</th><th class="num">Revenue</th><th class="num">Ad spend</th><th class="num">MER</th></tr></thead>
    <tbody>${d.weeks.map(w => `<tr><td>${shortD(w.from)} – ${shortD(w.to)}</td><td class="num"><b>${money(w.sales)}</b></td><td class="num">${money(w.spend)}</td><td class="num">${fmtX(w.mer)}</td></tr>`).join('')}</tbody></table></div></div>` : '';

  // Change log. `changes` is {notable, rollup, total}; older stored reports hold a
  // plain array, so both shapes render.
  const ch = d.changes;
  const chList = Array.isArray(ch) ? ch : (ch?.notable || []);
  const chRoll = Array.isArray(ch) ? null : (ch?.rollup || null);
  const rollLine = chRoll && Object.keys(chRoll).length
    ? Object.entries(chRoll).sort((a, b) => b[1] - a[1])
        .map(([k, v]) => `<b>${v}</b> ${esc(catLabel(k, v))}`).join(' · ')
    : '';
  const changesHtml = opts.internal && (chList.length || rollLine) ? `<div class="card"><h3 style="margin-bottom:2px">What we changed during the period</h3>
    <p class="hint" style="margin-bottom:10px">From the Change Log, ranked by what actually moves money — budget, bidding and structural changes are listed individually, along with any ad switched on or off that was spending${!Array.isArray(ch) && ch?.ad_floor ? ` more than ${money(ch.ad_floor)}` : ' real money'} this ${prevTag}. Routine creative and tuning work is counted below. Meta's own review-state churn and image-library edits are excluded. <b>Internal only</b> — the client's page never shows this list, though the summary above may reference the moves.${!Array.isArray(ch) && ch?.notable_total > chList.length ? ` Showing the first ${chList.length} of ${ch.notable_total} notable changes.` : ''}</p>
    ${chList.length ? `<div>${chList.map(e => `<div class="rp-change"><span class="d tiny">${esc(e.t)}</span><span class="cat">${esc(catLabel(e.category))}</span><span class="s">${esc(e.summary || '')}${e.spend != null ? ` <span class="tiny">· ${money(e.spend)} spent this ${prevTag}</span>` : ''}${e.reason ? ` <span class="tiny">· ${esc(e.reason)}</span>` : ''}</span></div>`).join('')}</div>`
      : '<p style="font-size:13.5px">No budget, bidding or structural changes this ' + prevTag + '.</p>'}
    ${rollLine ? `<p class="tiny" style="margin-top:10px">Routine activity in the same period: ${rollLine}.</p>` : ''}</div>` : '';

  return `${sumHtml}
    <div class="rp-kpis">${kpis}</div>
    ${pacingHtml}${chartHtml}${splitHtml}
    ${(d.channels || []).map(chCard).join('')}
    ${weeksHtml}${changesHtml}
    <p class="tiny"><b>Revenue, MER, aMER${t.cm != null ? ', Contribution Margin' : ''} and New-customer CPA are blended</b> — real store revenue and real total ad spend, with no platform's attribution involved — which is why they will not match what Meta or Google report on their own dashboards. The platform sections show each platform's own attributed numbers, and those are directional.</p>`;
}

/** Resolve a Slack channel id to "#name", cached for the session. Used by the
 *  send dialog: a confirmation that names the real channel is the last chance to
 *  catch a report pointed at the wrong audience. Degrades to the raw id. */
let CHAN_CACHE = null;
async function channelName(id) {
  if (!id) return 'the configured channel';
  if (!CHAN_CACHE) {
    try { CHAN_CACHE = Object.fromEntries((await api('/api/slack-channels')).channels.map(c => [c.id, c.name])); }
    catch { CHAN_CACHE = {}; }
  }
  return CHAN_CACHE[id] ? `#${CHAN_CACHE[id]}` : id;
}

/** Attach the day-by-day crosshair. Called by BOTH report renderers after paint,
 *  so the client's page is as inspectable as ours. Shows the two lines and the
 *  gap between them, which is the thing the chart is actually about. */
function wireReportChart(d, cur, internal) {
  const id = internal ? 'rpSvg' : 'rsSvg';
  wireSalesSpend(id, id + 'Readout', d.chart || [], r => {
    const gap = r.sales != null && r.spend != null ? r.sales - r.spend : null;
    const mer = r.spend ? r.sales / r.spend : null;
    return `<b>${r.date}</b> &nbsp; <span style="color:#14608C;font-weight:700">revenue</span> <b>${fmtMoney(r.sales, cur)}</b>`
      + ` &nbsp; <span style="color:#C08A2E;font-weight:700">ad spend</span> <b>${fmtMoney(r.spend, cur)}</b>`
      + (gap != null ? ` &nbsp; left after ads <b>${fmtMoney(gap, cur)}</b>` : '')
      + (mer != null ? ` &nbsp; MER <b>${fmtX(mer)}</b>` : '');
  });
}

/** Ask the engine for a fresh, playable mp4 for one ad.
 *  On the client's archive link there is no session, so the report token is the
 *  credential — the engine only resolves ads that are in that client's own sent
 *  reports. RS.token is set by the share renderer; internal callers have a
 *  session and send nothing. */
// Resolved mp4 URLs, keyed by ad id. Populated as soon as a report paints, so
// pressing play is instant instead of waiting on a round trip to Meta. The
// value is the PROMISE, not the URL, so a click that lands mid-flight joins the
// request already running rather than starting a second one.
const VID_CACHE = new Map();

function adVideoUrl(adId) {
  if (VID_CACHE.has(adId)) return VID_CACHE.get(adId);
  const q = `ad=${encodeURIComponent(adId)}` + (RS.token ? `&report=${encodeURIComponent(RS.token)}` : '');
  const p = (async () => {
    if (RS.token) {
      const res = await fetch(`${S.url.replace(/\/+$/, '')}/api/ad-video?${q}`);
      const b = await res.json();
      if (!res.ok) throw new Error(b.error || 'could not load this video');
      return b.src;
    }
    return (await api(`/api/ad-video?${q}`)).src;
  })();
  // A failure must not be cached — the next click should retry rather than
  // replay the error for as long as the page is open.
  p.catch(() => VID_CACHE.delete(adId));
  VID_CACHE.set(adId, p);
  return p;
}

/** Warm the cache for every playable ad on the page. Fired after paint; the
 *  requests are cheap (one Meta lookup each) and there are rarely more than a
 *  handful of videos in a report. Failures stay silent — the click path
 *  reports them properly. */
function prefetchAdVideos() {
  document.querySelectorAll('#main .ad-media[data-ad]').forEach(m => {
    adVideoUrl(m.dataset.ad).catch(() => {});
  });
}

/** Play the REAL creative inside its card — the actual mp4 in a native video
 *  element, not Meta's preview iframe. The iframe loaded 750KB of Facebook
 *  chrome to show a video we can now address directly, which is why this is
 *  instant and seekable instead of a page load.
 *
 *  The mp4 URL is signed and short-lived, so it is fetched at play time and
 *  never frozen into the report; the cover frame IS baked in, so an old report
 *  always shows the creative even when playback has expired.
 *
 *  Called by BOTH report renderers after paint. Listeners go on the media nodes
 *  the render replaces, never on #main, which survives every render. */
const CTA_LABEL = {
  SHOP_NOW: 'Shop Now', LEARN_MORE: 'Learn More', SIGN_UP: 'Sign Up', BUY_NOW: 'Buy Now',
  GET_OFFER: 'Get Offer', ORDER_NOW: 'Order Now', SUBSCRIBE: 'Subscribe', CONTACT_US: 'Contact Us',
  DOWNLOAD: 'Download', BOOK_TRAVEL: 'Book Now', GET_QUOTE: 'Get Quote', APPLY_NOW: 'Apply Now',
};

/** The detail view behind "Copy & full stats". Everything the card had no room
 *  for: the words the ad actually ran, where it lives, and the metrics that
 *  matter once you have already decided to look closely. All of it is frozen
 *  into the report, so an archived one opens exactly the same way. */
function adDetailModal(a, cur, prevTag) {
  const money = n => fmtMoney(n, cur);
  const fact = (label, val) => val ? `<span>${label} <b>${esc(String(val))}</b></span>` : '';
  const line = (label, val, note) => val == null ? '' :
    `<tr><td>${label}</td><td class="num"><b>${val}</b></td><td class="tiny">${note || ''}</td></tr>`;
  const pctOr = (v, d = 0) => v == null ? null : fmtPct(v, d);
  const days = a.created ? Math.round((Date.now() - new Date(a.created + 'T12:00:00Z')) / 86400e3) : null;
  const canPlay = a.video && a.ad_id;
  const body = `<div class="adm">
    <div>
      <div class="adm-media"${canPlay ? ` data-ad="${esc(a.ad_id)}"` : ''}${canPlay && a.preview ? ` data-preview="${esc(a.preview)}"` : ''}>
        ${a.thumb ? `<img src="${a.thumb}" alt="Creative for ${esc(a.name)}">`
        : '<div style="padding:40px;text-align:center;color:var(--muted);font-size:13px">No image available</div>'}
        ${canPlay ? '<button class="ad-play" type="button" title="Play this video ad"><i>&#9654;</i></button>' : ''}</div>
      ${a.preview ? `<p style="margin-top:10px"><a href="${esc(a.preview)}" target="_blank" rel="noopener noreferrer" style="font-size:12.5px">Open the full ad preview ↗</a></p>` : ''}
    </div>
    <div>
      <div class="adm-facts">
        ${fact('', a.video ? 'Video' : 'Image')}
        ${fact('Status', a.status ? a.status.toLowerCase().replace(/_/g, ' ') : null)}
        ${fact('Live since', a.created)}
        ${days != null ? `<span>Running <b>${days} days</b></span>` : ''}
        ${fact('CTA', a.cta ? (CTA_LABEL[a.cta] || a.cta.toLowerCase().replace(/_/g, ' ')) : null)}
      </div>
      ${a.headline ? `<div class="adm-copy"><div class="hd">Headline</div><div class="bd">${esc(a.headline)}</div></div>` : ''}
      ${a.body ? `<div class="adm-copy"><div class="hd">Primary text</div><div class="bd">${esc(a.body)}</div></div>` : ''}
      ${a.description ? `<div class="adm-copy"><div class="hd">Description</div><div class="bd">${esc(a.description)}</div></div>` : ''}
      ${!a.headline && !a.body ? '<p class="hint" style="margin-bottom:14px">The ad\'s text was not available from Meta for this creative.</p>' : ''}
      <div class="tbl-wrap"><table><thead><tr><th>This ${prevTag}</th><th class="num"></th><th></th></tr></thead><tbody>
        ${line('Spend', money(a.spend), a.prev_spend != null ? `prior ${prevTag} ${money(a.prev_spend)}` : '')}
        ${line('Share of Meta spend', pctOr(a.share))}
        ${line('Purchases', fmtInt(a.purchases))}
        ${line('Revenue', a.revenue != null ? money(a.revenue) : null)}
        ${line('CPA', a.cpa != null ? money(a.cpa) : null, a.prev_cpa != null ? `prior ${prevTag} ${money(a.prev_cpa)}` : '')}
        ${line('ROAS', a.roas != null ? fmtX(a.roas) : null, a.prev_roas != null ? `prior ${prevTag} ${fmtX(a.prev_roas)}` : '')}
        ${line('AOV', a.aov != null ? money(a.aov) : null, 'revenue per purchase')}
        ${line('Impressions', a.impressions != null ? fmtInt(a.impressions) : null)}
        ${line('Reach', a.reach != null ? fmtInt(a.reach) : null, a.frequency != null ? `seen ${a.frequency.toFixed(1)}x each on average` : '')}
        ${line('CPM', a.cpm != null ? money(a.cpm) : null, 'cost per thousand impressions')}
        ${line('Link clicks', a.clicks != null ? fmtInt(a.clicks) : null)}
        ${line('CTR', pctOr(a.ctr, 2), 'link clicks divided by impressions')}
        ${line('CPC', a.cpc != null ? money(a.cpc) : null, 'cost per link click')}
        ${line('Click to purchase', pctOr(a.cvr, 1), 'of the people it sent to the site, how many bought')}
      </tbody></table></div>
      ${a.hook != null ? `<h4 style="font-size:12.5px;font-weight:700;margin:16px 0 6px">How the video held attention</h4>
      <div class="tbl-wrap"><table><tbody>
        ${line('Hook rate', pctOr(a.hook), '3-second views over impressions — 30%+ is strong')}
        ${line('Hold rate', pctOr(a.hold), 'ThruPlay over 3-second views — 60%+ is strong')}
        ${line('Average watch time', a.avg_watch != null ? `${a.avg_watch.toFixed(1)}s` : null, a.duration ? `of ${Math.round(a.duration)}s` : '')}
        ${line('Cost per thumbstop', a.cost_per_thumbstop != null ? money(a.cost_per_thumbstop) : null, 'spend per 3-second view')}
      </tbody></table></div>
      ${a.retention ? `<div style="margin-top:10px">
        <div class="tiny" style="margin-bottom:5px">Of everyone who started the video, how far they got:</div>
        ${[['25%', a.retention.p25], ['50%', a.retention.p50], ['75%', a.retention.p75], ['Finished', a.retention.p100]]
          .map(([lb, v]) => `<div class="retn-row"><span class="lb">${lb}</span>
            <span class="track"><i style="width:${Math.max(0, Math.min(100, (v || 0) * 100)).toFixed(1)}%"></i></span>
            <span class="pc">${fmtPct(v)}</span></div>`).join('')}
        ${a.retention.basis === 'three_second_views' ? '<div class="tiny" style="margin-top:6px">Measured against 3-second views on this older report, so the early figures read high.</div>' : ''}
      </div>` : ''}` : ''}
      ${a.campaign || a.adset ? `<p class="tiny" style="margin-top:10px">${a.campaign ? `Campaign <b>${esc(a.campaign)}</b>` : ''}${a.adset ? ` · Ad set <b>${esc(a.adset)}</b>` : ''}</p>` : ''}
    </div></div>`;
  // Its own shell rather than helpModal: that one is 460px wide with a 60vh
  // body, which cut the stat values off mid-number and hid half the table.
  const w = document.createElement('div');
  w.className = 'modal-wrap ad-modal-wrap';
  w.innerHTML = `<div class="modal wide"><h3>${esc(a.name)}</h3>
    <div class="ad-modal-body">${body}</div>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn primary" data-m="ok">Close</button></div></div>`;
  document.body.appendChild(w);
  const done = () => {
    const v = w.querySelector('video');
    if (v) { v.pause(); v.removeAttribute('src'); v.load(); }   // never leave a video downloading
    w.remove();
    document.removeEventListener('keydown', k);
  };
  const k = ev => { if (ev.key === 'Escape') done(); };
  document.addEventListener('keydown', k);
  w.addEventListener('mousedown', ev => { if (ev.target === w) done(); });
  w.querySelector('[data-m="ok"]').onclick = done;
  const media = w.querySelector('.adm-media[data-ad]');
  if (media) attachPlay(media);
}

/** Make one `.ad-media[data-ad]` block playable. Shared by the card grid and
 *  the detail view, so a video behaves the same in both. */
function attachPlay(m) {
  const btn = m.querySelector('.ad-play');
  if (!btn) return;
  m.onclick = e => { if (!e.target.closest('.ad-frame') && !m.querySelector('.ad-frame')) btn.click(); };
  btn.onclick = async e => {
    e.stopPropagation();
    if (m.querySelector('.ad-frame')) return;
    const adId = m.dataset.ad;
    // The URL is usually already prefetched, so only show a spinner if it is
    // genuinely not ready — a flash of "Loading" on an instant play is worse
    // than no feedback at all.
    let settled = false, src = null, err = null;
    const pending = adVideoUrl(adId).then(u => { src = u; settled = true; },
                                          ex => { err = ex.message; settled = true; });
    await Promise.race([pending, new Promise(r => setTimeout(r, 120))]);
    if (!settled) m.insertAdjacentHTML('beforeend', '<div class="ad-spin">Loading…</div>');
    await pending;
    const spin = m.querySelector('.ad-spin');
    if (spin) spin.remove();
    if (m.querySelector('.ad-frame')) return;                 // double click while loading
    const fallback = m.dataset.preview
      ? `<a href="${esc(m.dataset.preview)}" target="_blank" rel="noopener noreferrer">Open it on Facebook ↗</a>`
      : '';
    m.insertAdjacentHTML('beforeend', `<div class="ad-frame">
      ${src ? `<video src="${esc(src)}" controls autoplay playsinline preload="metadata"></video>`
            : `<div class="msg"><div>${esc(err || 'This video can’t be played here.')}<br>${fallback}</div></div>`}
      <button class="ad-close" type="button" title="Back to the image">✕</button></div>`);
    // The click IS the user gesture, but the await for the URL breaks the
    // chain, so `autoplay` alone can be refused and leave a paused frame
    // under a play button that looks broken. Ask explicitly and let the
    // controls take over if the browser still says no.
    const vid = m.querySelector('.ad-frame video');
    if (vid) vid.play().catch(() => {});
    m.querySelector('.ad-close').onclick = ev => {
      ev.stopPropagation();                      // closing must not open the detail view
      const f = m.querySelector('.ad-frame');
      const v = f.querySelector('video');
      if (v) { v.pause(); v.removeAttribute('src'); v.load(); }   // stop the download too
      f.remove();
    };
  };
}

function wireAdCards(ads, cur, prevTag) {
  const rows = ads?.top || [];
  // ONE rule: the whole card opens the detail view. The single exception is the
  // media on a video, which plays it in place — clicking a video should play the
  // video. A static's media opens the detail view like the rest of the card,
  // where the creative is shown large anyway, so there is no dead zone and no
  // area where an identical-looking click does two different things.
  document.querySelectorAll('#main .ad-card').forEach(card => {
    const a = rows[+card.dataset.ad];
    if (!a) return;
    card.onclick = e => {
      if (e.target.closest('a')) return;                       // the name links out
      if (e.target.closest('.ad-media[data-ad]')) return;      // video media plays instead
      if (e.target.closest('.ad-frame')) return;               // clicks inside a playing ad
      adDetailModal(a, cur, prevTag);
    };
  });
  document.querySelectorAll('#main .ad-media[data-ad]').forEach(attachPlay);
  prefetchAdVideos();
}

/** All-clients view: the latest weekly and monthly report per brand at a glance. */
async function renderReportsAll(first) {
  const shell = body => `${pageHead('reports', 'Reports', 'Drafted automatically &mdash; Monday covers last Mon&ndash;Sun, the 1st covers last month. <b>Nothing reaches a client on its own.</b>')}
    <div class="row" style="margin-bottom:12px"><span style="flex:1"></span><button class="help-btn" data-help="reports">? How to use</button></div>
    ${body}`;
  const run = ++RUN;
  if (first) $('#main').innerHTML = shell('<div class="card"><span class="hint">Loading…</span></div>');
  let r;
  try { r = await api('/api/reports?act=all'); }
  catch (e) { if (run === RUN) $('#main').innerHTML = shell(`<div class="card"><span style="color:var(--bad)">${esc(e.message)}</span></div>`); return; }
  if (run !== RUN) return;
  const by = {};
  for (const row of r.rows) { by[row.act_id] ??= {}; by[row.act_id][row.period] ??= row; }   // rows arrive newest-first
  const cell = row => row
    ? `${repRangeLabel({ period: row.period, start: row.period_start, end: row.period_end })} <span class="pill ${row.status === 'sent' ? 'good' : 'warn'}">${row.status}</span>`
    : '<span class="tiny">none yet</span>';
  $('#main').innerHTML = shell(`<div class="card"><div class="tbl-wrap"><table>
    <thead><tr><th>Client</th><th>Latest weekly</th><th>Latest monthly</th></tr></thead>
    <tbody>${S.accounts.map(a => `<tr data-id="${a.act_id}" style="cursor:pointer">
      <td><b>${esc(a.name)}</b>${a.slack_channel ? '' : '<br><span class="tiny" style="color:var(--warn)">⚠ no internal channel — set one in Settings</span>'}</td>
      <td>${cell(by[a.act_id]?.weekly)}</td><td>${cell(by[a.act_id]?.monthly)}</td></tr>`).join('')}</tbody></table></div>
    <p class="tiny" style="margin-top:10px">A <b>draft</b> is internal — the client has not seen it. <b>Sent</b> reports are frozen and live on the client's archive link. Click a client to open their reports.</p></div>`);
  $('#main tbody').addEventListener('click', e => {
    const tr = e.target.closest('tr[data-id]'); if (!tr) return;
    S.act = tr.dataset.id; localStorage.setItem(LS.act, S.act);
    $('#clientPick').value = S.act;
    RP.act = null; RP.period = null; RP.start = null;
    show('reports');
  });
}

async function renderReports(first) {
  if (S.act === 'all') return renderReportsAll(first);
  const acct = S.accounts.find(a => a.act_id === S.act);
  if (RP.act !== S.act) { RP.act = S.act; RP.period = null; RP.start = null; }
  const shell = body => `${pageHead('reports', `Reports &mdash; ${esc(acct?.name || '')}`, 'Each report is frozen when generated, so what you review here is exactly what the client opens.')}
    ${body}`;
  const run = ++RUN;
  if (first) $('#main').innerHTML = shell('<div class="card"><span class="hint">Loading…</span></div>');
  let list;
  try { list = await api('/api/reports?act=' + S.act); }
