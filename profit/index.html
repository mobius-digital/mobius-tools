  if (!g || g.sales == null || g.spend == null) {
    return `<div class="card">${head}
      <p class="hint" style="margin-bottom:10px">No plan was set for this month, so there is nothing to measure against — this is just what happened.</p>
      <div class="row" style="gap:22px;flex-wrap:wrap">
        <div><div class="tiny">Revenue</div><div style="font-size:19px;font-weight:700">${fmtMoney(a.sales, cur)}</div></div>
        <div><div class="tiny">Ad spend</div><div style="font-size:19px;font-weight:700">${fmtMoney(a.spend, cur)}</div></div>
        <div><div class="tiny">MER</div><div style="font-size:19px;font-weight:700">${fmtX(a.mer)}</div></div>
        <div><div class="tiny">Contribution margin</div><div style="font-size:19px;font-weight:700">${fmtMoney(a.cm, cur)}</div></div>
      </div></div>`;
  }
  const plannedMer = g.spend ? g.sales / g.spend : null;
  const gap = a.sales - g.sales;
  const spendEffect = plannedMer != null ? (a.spend - g.spend) * plannedMer : null;
  const merEffect = plannedMer != null && a.mer != null ? a.spend * (a.mer - plannedMer) : null;
  const row = (label, planned, actual, fmt, lowerIsBetter) => {
    const off = planned ? actual / planned - 1 : null;
    const good = off == null ? null : lowerIsBetter ? off <= 0.02 : off >= 0;
    return `<tr><td>${label}</td>
      <td class="num">${planned != null ? fmt(planned) : '<span class="tiny">—</span>'}</td>
      <td class="num"><b>${fmt(actual)}</b></td>
      <td class="num">${off != null ? `<span class="pill ${good ? 'good' : Math.abs(off) <= 0.1 ? 'warn' : 'bad'}">${fmtSigned(off)}</span>` : '—'}</td></tr>`;
  };
  const money = v => fmtMoney(v, cur);
  const bigger = spendEffect != null && merEffect != null
    ? (Math.abs(spendEffect) >= Math.abs(merEffect) ? 'spend' : 'efficiency') : null;

  return `<div class="card">${head}
    <p class="hint" style="margin-bottom:10px">${saved && saved.agreed_at
      ? `Agreed with the client on ${esc(String(saved.agreed_at).slice(0, 10))}.`
      : 'This plan was saved but never marked agreed.'} ${a.days} of ${a.days_in_month} days have data.</p>
    <div class="tbl-wrap"><table>
      <thead><tr><th></th><th class="num">Agreed</th><th class="num">Actual</th><th class="num">Difference</th></tr></thead>
      <tbody>
        ${row('Revenue', g.sales, a.sales, money)}
        ${row('Ad spend', g.spend, a.spend, money, true)}
        ${row('MER', plannedMer, a.mer, fmtX)}
        ${g.amer != null ? row('aMER', g.amer, a.amer, fmtX) : `<tr><td>aMER</td><td class="num tiny">—</td><td class="num"><b>${fmtX(a.amer)}</b></td><td class="num tiny">no target set</td></tr>`}
        <tr><td>Contribution margin</td><td class="num tiny">—</td><td class="num"><b style="color:${a.cm >= 0 ? 'var(--good)' : 'var(--bad)'}">${money(a.cm)}</b></td><td class="num tiny">${a.sales ? fmtPct(a.cm / a.sales) : '—'} of revenue</td></tr>
      </tbody></table></div>
    ${spendEffect != null && merEffect != null ? `<div class="notice ${Math.abs(gap) / (g.sales || 1) < 0.05 ? '' : gap >= 0 ? '' : 'warn'}" style="margin-top:12px">${gap >= 0 ? '✓' : '→'} <div>
      <b>${gap >= 0 ? 'Beat the plan' : 'Missed the plan'} by ${money(Math.abs(gap))}</b> (${fmtSigned(gap / g.sales)}). That splits into two parts, and they add up exactly:
      <div style="display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin-top:8px;align-items:baseline">
        <span class="tiny" style="color:var(--muted)">Spending differently</span><span class="tiny"><b>${spendEffect >= 0 ? '+' : '−'}${money(Math.abs(spendEffect))}</b> — ${a.spend >= g.spend ? 'spent' : 'underspent by'} ${money(Math.abs(a.spend - g.spend))} ${a.spend >= g.spend ? 'more than agreed' : 'against the agreed budget'}, worth this much revenue at the planned ${fmtX(plannedMer)}</span>
        <span class="tiny" style="color:var(--muted)">Ads performing differently</span><span class="tiny"><b>${merEffect >= 0 ? '+' : '−'}${money(Math.abs(merEffect))}</b> — MER came in at ${fmtX(a.mer)} against ${fmtX(plannedMer)} planned, on the spend actually deployed</span>
      </div>
      <p style="margin:10px 0 0;font-size:13.5px">${bigger === 'spend'
        ? `<b>Mostly a budget story.</b> The ads held up roughly as planned; the month moved because the spend did. Worth asking why the budget ${a.spend >= g.spend ? 'ran over' : 'was not deployed'}.`
        : `<b>Mostly an efficiency story.</b> The budget was close to plan, but each dollar ${a.mer >= plannedMer ? 'worked harder' : 'bought less'} than agreed. That is a creative, offer or auction question, not a pacing one.`}</p>
    </div></div>` : ''}
  </div>`;
}

async function renderPlan(first) {
  if (S.act === 'all') return renderPlanAll();
  if (!PL.month) PL.month = shiftMonth(ymdLocal(new Date()).slice(0, 7), 1);

  // Switching month refetches, but blanking to a spinner loses your place and reads
  // as a page reload. Keep what is on screen, dim the month chips, swap when ready.
  const run = ++RUN;
  if (first) $('#main').innerHTML = `<h2>Plan</h2><div class="card"><span class="hint">Loading…</span></div>`;
  else $('#main').querySelectorAll('[data-m]').forEach(b => { b.style.opacity = '.45'; b.disabled = true; });
  let p;
  try { p = await api(`/api/plan?act=${S.act}&month=${PL.month}`); }
  catch (e) {
    if (run !== RUN) return;
    // Replace ALL of #main: on a tab switch `#main .card` still belongs to the
    // outgoing tab, and writing the error into it left the old heading up.
    $('#main').innerHTML = `<h2>Plan</h2><div class="card"><span style="color:var(--bad)">${esc(e.message)}</span> <button class="btn" onclick="show('plan')">Retry</button></div>`;
    return;
  }
  if (run !== RUN) return;
  const cur = p.account.currency;
  const hist = p.history.filter(h => !h.empty);
  const saved = p.plan;
  const editable = p.status !== 'past';
  const nowYm = p.current_month;
  const expRet = (p.ctx.returning_per_day || 0) * p.ctx.days_in_month;

  // Revenue = MER x spend. Two of the three are yours to choose; the third is
  // arithmetic. Seed from the saved plan, else last month's revenue at the
  // efficiency this client has actually been running.
  // Re-seed whenever the values on screen belong to a DIFFERENT client. Keying only
  // on `PL.sales == null` meant the picker carried one brand's plan into the next.
  if (PL.sales == null || PL.act !== S.act) {
    const base = (p.goals && p.goals.sales) || (p.basis ? p.basis.sales * 1.1 : null);
    const seedSpend = (p.goals && p.goals.spend)
      || (base != null && p.ctx.amer ? Math.max(0, base - expRet) / p.ctx.amer : null);
    PL.sales = base;
    PL.spend = seedSpend;
    PL.mer = base != null && seedSpend ? base / seedSpend : null;
    PL.derive = 'mer';
    PL.act = S.act;
  }

  const calc = () => {
    let sales = PL.sales, spend = PL.spend, mer = PL.mer;
    if (PL.derive === 'mer') mer = sales != null && spend ? sales / spend : null;
    else if (PL.derive === 'spend') spend = sales != null && mer ? sales / mer : null;
    else sales = spend != null && mer ? spend * mer : null;
    if (sales == null || spend == null) return null;
    // What the plan quietly assumes about acquisition: returning revenue turns up
    // on its own, so every dollar above it has to be bought with this spend.
    const newNeeded = Math.max(0, sales - expRet);
    const impliedAmer = spend > 0 ? newNeeded / spend : null;
    const trailing = p.ctx.amer;
    let verdict = null;
    if (impliedAmer != null && trailing) {
      const ratio = impliedAmer / trailing;
      verdict = ratio <= 1.05 ? 'ok' : ratio <= 1.25 ? 'stretch' : 'unrealistic';
    }
    const cm = p.ctx.margin != null ? sales * p.ctx.margin - spend : null;
    return { sales, spend, mer: mer != null ? mer : (spend ? sales / spend : null),
      newNeeded, impliedAmer, trailing, verdict, cm,
      growth: p.basis && p.basis.sales ? sales / p.basis.sales - 1 : null,
      cmPct: cm != null && sales ? cm / sales : null };
  };
  let c = calc();

  const verdictHtml = x => {
    if (!x || x.impliedAmer == null || !x.trailing) return '';
    const pctOver = Math.round((x.impliedAmer / x.trailing - 1) * 100);
    if (x.verdict === 'ok') {
      return `<span class="pill good">achievable</span> This plan needs new customers at <b>${fmtX(x.impliedAmer)}</b>. The last 28 days ran at <b>${fmtX(x.trailing)}</b>, so it asks for no more efficiency than the client is already getting.`;
    }
    if (x.verdict === 'stretch') {
      return `<span class="pill warn">a stretch</span> This plan needs new customers at <b>${fmtX(x.impliedAmer)}</b>, about <b>${pctOver}% better</b> than the <b>${fmtX(x.trailing)}</b> of the last 28 days. Reachable, but it assumes the ads improve — not just that they keep going.`;
    }
    return `<span class="pill bad">unrealistic</span> This plan needs new customers at <b>${fmtX(x.impliedAmer)}</b>, <b>${pctOver}% better</b> than the <b>${fmtX(x.trailing)}</b> the client has actually been getting. Either raise the spend, lower the revenue goal, or accept a lower MER.`;
  };

  // Every derived number states its own window. The mix is deliberate: efficiency
  // and returning behaviour move, so they come from the most recent 28 days, while
  // the revenue basis and margin come from a whole finished month. Declared above
  // cmHtml because that reads it too — the CM comparison and the "Based on" box
  // must always name the same month.
  const src = (p.ctx && p.ctx.sources) || {};

  const cmHtml = x => {
    // Compare against the SAME month the "Based on" box names, and only when that
    // month is genuinely complete. Picking "most recent finished month" separately
    // let the two disagree: a month with a Triple Whale sync gap is skipped as a
    // revenue basis but was still used here, so the plan got measured against a
    // month missing days - understating its CM and flattering the comparison.
    const lastFull = src.basis_month
      ? hist.find(h => h.month === src.basis_month && !h.partial && h.days >= h.days_in_month - 2) || null
      : null;
    if (!x || x.cm == null || !lastFull || lastFull.cm == null) return '';
    const d = x.cm - lastFull.cm;
    return d >= 0
      ? `That leaves <b>${fmtK(d, cur)} more</b> contribution margin than ${esc(monthLabel(lastFull.month))}.`
      : `⚠️ That leaves <b>${fmtK(Math.abs(d), cur)} less</b> contribution margin than ${esc(monthLabel(lastFull.month))} — the extra spend outweighs the extra revenue.`;
  };

  const basisNote = () => {
    const rows = [];
    if (src.basis_month) rows.push(['Revenue basis', `${esc(monthLabel(src.basis_month))} actual`]);
    if (src.trailing_from && src.trailing_to) {
      const short = d => `${MONTHS[+d.slice(5, 7) - 1].slice(0, 3)} ${+d.slice(8, 10)}`;
      rows.push([`Efficiency &amp; returning`, `last ${src.trailing_days || 28} days &middot; ${short(src.trailing_from)} – ${short(src.trailing_to)}`]);
    }
    if (src.margin_month && p.ctx.margin != null) rows.push(['Product margin', `${esc(monthLabel(src.margin_month))} actual`]);
    if (!rows.length) return '';
    return `<div style="border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg)">
      <div class="tiny" style="font-weight:600;margin-bottom:6px">Based on</div>
      <div style="display:grid;grid-template-columns:auto 1fr;gap:3px 14px;align-items:baseline">
        ${rows.map(r => `<span class="tiny" style="color:var(--muted)">${r[0]}</span><span class="tiny" style="font-weight:600">${r[1]}</span>`).join('')}
      </div>
      <div class="tiny" style="margin-top:7px;color:var(--muted)">Recent efficiency, not a six-month average — it is what the account is doing now. The table above is context, not an input.</div>
    </div>`;
  };

  const picker = [-1, 0, 1, 2, 3, 4].map(n => shiftMonth(nowYm, n));
  const statusPill = p.status === 'past'
    ? '<span class="pill unk">finished — read only</span>'
    : saved && saved.agreed_at ? `<span class="pill good">agreed ${esc(String(saved.agreed_at).slice(0, 10))}</span>`
    : p.planned ? '<span class="pill warn">saved, not agreed</span>'
    : '<span class="pill unk">not planned yet</span>';

  const fieldsHtml = () => {
    const x = calc();
    if (!x) return '';
    return fieldCard('sales', 'Revenue goal', PL.derive === 'sales' ? fmtMoney(x.sales, cur) : Math.round(x.sales).toLocaleString('en-US'),
        x.growth != null ? `${x.growth >= 0 ? '+' : ''}${Math.round(x.growth * 100)}% on ${p.basis ? esc(monthLabel(p.basis.month)) : 'last month'}` : '',
        'The total you want the store to sell this month, from every source — ads, email, organic, direct. Save it and the Daily Brief measures each day against it.')
      + fieldCard('spend', 'Ad spend', PL.derive === 'spend' ? fmtMoney(x.spend, cur) : Math.round(x.spend).toLocaleString('en-US'),
        `${fmtMoney(x.spend / p.ctx.days_in_month, cur)} a day`,
        'The total ad budget for the month, across every platform. This is the number you actually control.')
      + fieldCard('mer', 'MER', PL.derive === 'mer' ? fmtX(x.mer) : (Math.round(x.mer * 100) / 100).toFixed(2),
        'revenue divided by ad spend',
        'How many dollars the store takes in for every dollar spent on ads. 2.5x means $2.50 back for every $1 spent.');
  };

  const fieldCard = (key, label, value, sub, info) => {
    const derived = PL.derive === key;
    return `<div class="card" style="margin:0;${derived ? 'background:var(--bg)' : ''}">
      <div class="av-label" style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px">${label} <span class="info-i" title="${esc(info)}">i</span></div>
      ${derived
        ? `<div style="font-size:clamp(19px,2.2vw,26px);font-weight:700;margin:6px 0 2px" id="pf_${key}">${value}</div>
           <div class="tiny" id="pfs_${key}">${sub}</div>
           <div class="tiny" style="margin-top:6px;color:var(--muted)">calculated from the other two</div>`
        : `<div class="unit-in" style="width:100%;margin:6px 0 2px">${key === 'mer' ? '' : `<span>${sym(cur)}</span>`}<input id="pfi_${key}" type="text" inputmode="decimal" value="${value}">${key === 'mer' ? '<span>x</span>' : ''}</div>
           <div class="tiny" id="pfs_${key}">${sub}</div>
           <button class="btn" data-derive="${key}" style="margin-top:6px;font-size:11.5px;padding:4px 8px">calculate this instead</button>`}
    </div>`;
  };

  $('#main').innerHTML = `<h2>Plan — ${esc(p.account.name)}</h2>
    <p class="sub">${p.status === 'past'
      ? 'A month that has already finished. What was planned, and what actually happened.'
      : 'Revenue = MER × spend, so you choose <b>two</b> and the third follows. Everything else in this tool then measures against what you save here.'}</p>
    <div class="row" style="margin-bottom:14px;flex-wrap:wrap">
      ${picker.map(m => `<button class="chip ${m === p.month ? 'on' : ''}" data-m="${m}">${esc(monthLabel(m))}${m === nowYm ? ' · now' : ''}</button>`).join('')}
      <span id="plChip">${statusPill}</span>
      <span style="flex:1"></span><button class="help-btn" data-help="plan">? How to use</button>
    </div>

    ${p.status === 'past' && p.actual ? retroCard(p, cur, saved) : ''}

    <div id="plQuarter"></div>

    <div class="card"><h3 style="margin-bottom:6px">Recent months</h3>
      <p class="hint" style="margin-bottom:10px">What actually happened, so the next number is grounded in this client rather than a wish. <b>This table is context you read</b> — the plan below is not an average of it.</p>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Month</th>
          <th class="num">Revenue <span class="info-i" title="Shopify Total Sales minus sales tax: gross sales, less discounts and returns, plus shipping charged to customers, less tax. Every channel - paid, organic, email, direct - not any platform\’s attributed revenue. The same line used on every tab.">i</span></th>
          <th class="num">Ad spend <span class="info-i" title="Every ad platform combined for the month, from Triple Whale - Meta plus Google plus anything else running. Not Meta alone.">i</span></th>
          <th class="num">MER <span class="info-i" title="Marketing Efficiency Ratio = all store revenue divided by all ad spend. Blended on both sides, so it is not ROAS and it is not platform-attributed. 3.00x means three dollars came into the store for every dollar spent on ads.">i</span></th>
          <th class="num">aMER <span class="info-i" title="Acquisition MER = NEW-customer revenue divided by that same total ad spend. Repeat buyers and email cannot flatter it, so it isolates whether the ads are actually buying customers.">i</span></th>
          <th class="num">Margin <span class="info-i" title="Gross margin BEFORE ad spend: revenue minus product costs, fulfilment, handling and payment fees, as a share of revenue. This is not contribution margin - ad spend has not been taken off yet.">i</span></th></tr></thead>
        <tbody>${hist.slice(-6).map(h => `<tr${h.partial ? ' style="opacity:.6"' : ''}>
          <td><b>${esc(monthLabel(h.month))}</b>${h.partial ? ` <span class="tiny">(${h.days} of ${h.days_in_month} days)</span>` : ''}</td>
          <td class="num"><b>${fmtK(h.sales, cur)}</b></td><td class="num">${fmtK(h.spend, cur)}</td>
          <td class="num">${fmtX(h.mer)}</td><td class="num">${fmtX(h.amer)}</td><td class="num">${fmtPct(h.margin)}</td></tr>`).join('')}
        </tbody></table></div>
      ${editable && p.basis ? `<p class="tiny" style="margin-top:8px">Building from <b>${esc(monthLabel(p.basis.month))}</b> — ${fmtMoney(p.basis.sales, cur)}.</p>` : ''}</div>

    ${editable && c ? `<div class="card"><h3 style="margin-bottom:6px">The plan</h3>
      <p class="hint" style="margin-bottom:8px">Type into any <b>two</b> of these; the greyed one is worked out for you. Press <b>calculate this instead</b> on a field to move which one is derived. Returning customers should bring in about <b>${fmtMoney(expRet, cur)}</b> on their own this month — everything above that has to be bought with the ad spend.</p>
      <div style="margin-bottom:14px">${basisNote()}</div>
      <div class="row" style="gap:8px;margin-bottom:12px">
        ${[0, 0.1, 0.2, 0.3].map(g => `<button class="chip ${c.growth != null && Math.abs(c.growth - g) < 0.005 ? 'on' : ''}" data-g="${g}">${g === 0 ? 'Hold flat' : '+' + Math.round(g * 100) + '%'}</button>`).join('')}
        <span class="tiny">quick-fill the revenue goal from ${p.basis ? esc(monthLabel(p.basis.month)) : 'last month'}</span>
      </div>
      <div id="plFields" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px">${fieldsHtml()}
      </div>
      <div class="tiny" style="margin-top:14px;line-height:1.7" id="plVerdict">${verdictHtml(c)}</div>
      <div class="row" style="margin-top:14px;gap:22px;flex-wrap:wrap;align-items:flex-start">
        <div><div class="tiny">Contribution margin</div><div style="font-size:19px;font-weight:700" id="plCm">${fmtMoney(c.cm, cur)}</div><div class="tiny" id="plCmSub">${c.cmPct != null ? `${fmtPct(c.cmPct)} of revenue` : ''}</div></div>
        <div style="flex:1;min-width:200px" class="tiny" id="plCmNote">${cmHtml(c)}</div>
      </div>
      <div class="row" style="margin-top:16px;align-items:flex-start">
        <button class="btn primary" id="plSave">Save ${esc(monthLabel(p.month))} plan</button>
        <button class="btn" id="plShare">↗ Client link</button>
        <div class="row" style="margin:0;gap:8px">
          <div class="toggle ${saved && saved.agreed_at ? 'on' : ''}" id="plAgreed"></div>
          <span class="tiny" id="plAgreedLbl">${saved && saved.agreed_at ? `agreed ${esc(String(saved.agreed_at).slice(0, 10))}` : 'not yet agreed'}</span>
        </div>
        <span class="tiny" id="plMsg"></span>
      </div>
      <div class="tiny" style="margin-top:10px;color:var(--muted);line-height:1.6">
        <b>Save</b> makes this the month's target — from then on every daily update measures against it.<br>
        <b>Client link</b> is a read-only page with just this plan on it, to send or screen-share.<br>
        <b>Agreed</b> records that they said yes, and the date. Change the numbers later and it clears itself.
      </div></div>` : editable ? '<div class="card"><span class="hint">Not enough history to propose a number for this client yet.</span></div>' : ''}`;

  const repaint = () => {
    c = calc();
    if (!c) return;
    const setTxt = (id, v) => { const el = $(id); if (el) el.textContent = v; };
    const setVal = (id, v) => { const el = $(id); if (el && document.activeElement !== el) el.value = v; };
    // Only the derived field is rewritten; the two you typed are left alone.
    if (PL.derive === 'sales') setTxt('#pf_sales', fmtMoney(c.sales, cur)); else setVal('#pfi_sales', Math.round(c.sales).toLocaleString('en-US'));
    if (PL.derive === 'spend') setTxt('#pf_spend', fmtMoney(c.spend, cur)); else setVal('#pfi_spend', Math.round(c.spend).toLocaleString('en-US'));
    if (PL.derive === 'mer') setTxt('#pf_mer', fmtX(c.mer)); else setVal('#pfi_mer', (Math.round(c.mer * 100) / 100).toFixed(2));
    setTxt('#pfs_sales', c.growth != null ? `${c.growth >= 0 ? '+' : ''}${Math.round(c.growth * 100)}% on ${p.basis ? monthLabel(p.basis.month) : 'last month'}` : '');
    setTxt('#pfs_spend', `${fmtMoney(c.spend / p.ctx.days_in_month, cur)} a day`);
    setTxt('#plCm', c.cm != null ? fmtMoney(c.cm, cur) : '—');
    setTxt('#plCmSub', c.cmPct != null ? `${fmtPct(c.cmPct)} of revenue` : '');
    $('#main').querySelectorAll('[data-g]').forEach(b =>
      b.classList.toggle('on', c.growth != null && Math.abs(c.growth - +b.dataset.g) < 0.005));
    const v = $('#plVerdict'); if (v) v.innerHTML = verdictHtml(c);
    const n = $('#plCmNote'); if (n) n.innerHTML = cmHtml(c);
  };

  // Typing into a field makes it an input; whichever field is derived stays derived.
  const bind = () => {
    ['sales', 'spend', 'mer'].forEach(k => {
      const el = $(`#pfi_${k}`);
      if (!el) return;
      const fmtOwn = () => {
        // repaint() deliberately skips the focused field so it cannot fight your
        // typing - so on Enter we format this one explicitly.
        const x = calc();
        if (!x) return;
        el.value = k === 'mer' ? (Math.round(x.mer * 100) / 100).toFixed(2) : Math.round(x[k]).toLocaleString('en-US');
      };
      const commit = () => {
        const raw = +el.value.replace(/[^0-9.]/g, '');
        if (!isFinite(raw) || el.value.trim() === '') return;
        PL[k] = raw;
        repaint();
        fmtOwn();
      };
      el.onchange = commit;
      el.onblur = commit;
      el.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); commit(); el.blur(); } };
    });
    // Rebuild only the three field cards. Re-rendering the page would scroll you back
    // to the top mid-decision, which is exactly what makes a tool feel broken.
    const rebuildFields = () => { $('#plFields').innerHTML = fieldsHtml(); bind(); repaint(); };
    $('#main').querySelectorAll('[data-derive]').forEach(b => b.onclick = () => {
      // Freeze current values so switching which one is derived changes nothing.
      const cc = calc();
      if (cc) { PL.sales = cc.sales; PL.spend = cc.spend; PL.mer = cc.mer; }
      PL.derive = b.dataset.derive;
      rebuildFields();
    });
    $('#main').querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
      if (!p.basis) return;
      PL.sales = p.basis.sales * (1 + +b.dataset.g);
      if (PL.derive === 'sales') {                        // cannot quick-fill a derived field
        const cc = calc();
        if (cc) { PL.spend = cc.spend; PL.mer = cc.mer; }
        PL.derive = 'mer';
      }
      rebuildFields();
    });
  };
  bind();

  $('#main').querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    if (b.dataset.m === PL.month) return;
    PL.month = b.dataset.m; PL.sales = null; PL.spend = null; PL.mer = null; PL.act = null;
    inPlace(() => renderPlan(false));
  });

  // Quarter to date - loaded after the plan so it can never delay it, and reloadable
  // because saving a plan changes the very numbers it rolls up.
  const loadQuarter = () => api(`/api/quarter?act=${S.act}`).then(q => {
    if (run !== RUN) return;
    const el = $('#plQuarter'); if (!el || !q || !q.months) return;
    const pace = q.days_total ? q.days_done / q.days_total : 0;
    const goalToDate = q.goal_sales != null ? q.goal_sales * pace : null;
    const off = goalToDate ? q.sales / goalToDate - 1 : null;
    const mrow = x => `<tr${x.status === 'future' ? ' style="opacity:.5"' : ''}>
      <td><b>${esc(monthLabel(x.month))}</b>${x.status === 'current' ? ` <span class="tiny">(${x.days} of ${x.days_in_month} days)</span>` : ''}</td>
      <td class="num">${x.planned ? fmtMoney(x.goal_sales, cur) : '<span class="tiny">not planned</span>'}</td>
      <td class="num"><b>${x.sales != null ? fmtMoney(x.sales, cur) : '—'}</b></td>
      <td class="num">${x.planned && x.sales != null && x.status !== 'future' ? `<span class="pill ${x.sales >= x.goal_sales ? 'good' : 'bad'}">${fmtSigned(x.sales / x.goal_sales - 1)}</span>` : '—'}</td></tr>`;
    el.innerHTML = `<div class="card"><h3 style="margin-bottom:2px">${esc(q.quarter.replace('-', ' '))} so far <span class="info-i" title="The three monthly plans in this quarter added together, against what has actually happened. There is no separate quarterly target: a quarter is only as planned as its months, so any month without an agreed plan is named rather than guessed at.">i</span></h3>
      <p class="hint" style="margin-bottom:10px">${q.days_done} of ${q.days_total} days elapsed.${q.unplanned.length ? ` <b>${q.unplanned.map(m => esc(monthLabel(m))).join(' and ')}</b> ${q.unplanned.length === 1 ? 'has' : 'have'} no agreed plan, so the quarter total below is only what has been committed so far.` : ' All three months are planned.'}</p>
      <div class="row" style="gap:22px;flex-wrap:wrap;margin-bottom:12px">
        <div><div class="tiny">Revenue so far</div><div style="font-size:19px;font-weight:700">${fmtMoney(q.sales, cur)}</div>${goalToDate ? `<div class="tiny">${fmtMoney(goalToDate, cur)} expected by now ${off != null ? `<span class="pill ${off >= 0 ? 'good' : off >= -0.1 ? 'warn' : 'bad'}">${fmtSigned(off)}</span>` : ''}</div>` : '<div class="tiny">no quarter target</div>'}</div>
        <div><div class="tiny">Ad spend</div><div style="font-size:19px;font-weight:700">${fmtMoney(q.spend, cur)}</div><div class="tiny">${q.goal_spend != null ? `of ${fmtMoney(q.goal_spend, cur)} committed` : 'no budget set'}</div></div>
        <div><div class="tiny">Contribution margin</div><div style="font-size:19px;font-weight:700">${fmtMoney(q.cm, cur)}</div><div class="tiny">${q.sales ? fmtPct(q.cm / q.sales) + ' of revenue' : ''}</div></div>
        <div><div class="tiny">Quarter target</div><div style="font-size:19px;font-weight:700">${q.goal_sales != null ? fmtMoney(q.goal_sales, cur) : '—'}</div><div class="tiny">${q.unplanned.length ? `${3 - q.unplanned.length} of 3 months` : 'all three months'}</div></div>
      </div>
      <div class="tbl-wrap"><table><thead><tr><th>Month</th><th class="num">Agreed</th><th class="num">Actual</th><th class="num">vs plan</th></tr></thead>
        <tbody>${q.per.map(mrow).join('')}</tbody></table></div></div>`;
  }).catch(() => {});
  loadQuarter();

  const sv = $('#plSave');
  if (sv) sv.onclick = async () => {
    const cc = calc();
    if (!cc || cc.sales == null) return;
    $('#plMsg').textContent = 'Saving…';
    try {
      const changed = p.goals && p.goals.sales != null && Math.abs(p.goals.sales - cc.sales) > 1;
      await api('/api/plan', { method: 'PUT', body: JSON.stringify({
        act: S.act, month: p.month, sales: Math.round(cc.sales),
        spend: cc.spend != null ? Math.round(cc.spend) : null,
        growth_pct: cc.growth, basis_sales: p.basis ? p.basis.sales : null,
        basis_label: p.basis ? monthLabel(p.basis.month) : null,
        expected_cm: cc.cm, reagree: changed }) });
      p.goals = Object.assign({}, p.goals || {}, { sales: Math.round(cc.sales) });
      p.planned = true;
      if (changed) {
        const t = $('#plAgreed'); if (t) t.classList.remove('on');
        $('#plAgreedLbl').textContent = 'not yet agreed';
      }
      if (!(saved && saved.agreed_at) || changed) $('#plChip').innerHTML = '<span class="pill warn">saved, not agreed</span>';
      $('#plMsg').textContent = changed ? 'Saved ✓ — numbers moved, so it needs agreeing again.' : 'Saved ✓';
      // The quarter card rolls up this very plan, and Overview + Daily Brief read the
      // goals out of S.accounts. Both refresh in place - no re-render, no scroll jump.
      loadQuarter();
      refreshAccounts();
    } catch (e) { $('#plMsg').textContent = e.message; }
  };

  const ag = $('#plAgreed');
  if (ag) ag.onclick = async () => {
    const on = !ag.classList.contains('on');
    ag.classList.toggle('on', on);
    $('#plMsg').textContent = '';
    try {
      const r = await api('/api/plan-agree', { method: 'POST', body: JSON.stringify({ act: S.act, month: p.month, agreed: on }) });
      $('#plAgreedLbl').textContent = on && r.agreed_at ? `agreed ${String(r.agreed_at).slice(0, 10)}` : 'not yet agreed';
      $('#plChip').innerHTML = on && r.agreed_at
        ? `<span class="pill good">agreed ${esc(String(r.agreed_at).slice(0, 10))}</span>`
        : '<span class="pill warn">saved, not agreed</span>';
    } catch (e) {
      ag.classList.toggle('on', !on);
      noteModal('Nothing to agree to yet', `<p>${esc(e.message)}</p><p class="tiny">Save the plan first — agreeing records sign-off on a number that exists.</p>`);
    }
  };

  const sh = $('#plShare');
  if (sh) sh.onclick = async () => {
    try {
      const r = await api('/api/plan-share', { method: 'POST', body: JSON.stringify({ act: S.act, month: p.month }) });
      // A blocked clipboard must not surface as an unhandled rejection - the URL is on screen regardless.
      if (navigator.clipboard) navigator.clipboard.writeText(r.url).catch(() => {});
      noteModal('Client link ready', `<p>A read-only page showing just this plan — no other client, no internal notes.</p><p><code style="word-break:break-all">${esc(r.url)}</code></p><p class="tiny">Copied to your clipboard.</p>`);
    } catch (e) { $('#plMsg').textContent = e.message; }
  };
}

/** All clients at a glance: who still needs next month agreed. */

  const next = shiftMonth(ymdLocal(new Date()).slice(0, 7), 1);
  $('#main').innerHTML = `<h2>Plan</h2>
    <p class="sub">A forecast nobody agreed to is just a guess. This is where next month's number gets set with each client — once a month, then you leave it alone.</p>
    <div class="card"><div class="tbl-wrap"><table>
      <thead><tr><th>Client</th><th class="num">${esc(monthLabel(next))} goal</th><th>Status</th><th></th></tr></thead>
      <tbody>${S.accounts.map(a => `<tr data-id="${a.act_id}" style="cursor:pointer">
        <td><b>${esc(a.name)}</b></td>
        <td class="num" data-goal="${a.act_id}">…</td>
        <td data-agreed="${a.act_id}">…</td>

      </tbody></table></div>
      <p class="tiny" style="margin-top:10px">Showing <b>${esc(monthLabel(next))}</b> — the month you would actually be planning right now. Open a client to plan a different one.</p></div>

  $('#main tbody').addEventListener('click', e => {

    PL.month = next; PL.sales = null; PL.spend = null; PL.mer = null; PL.act = null;
    $('#clientPick').value = S.act; show('plan');
  });
  const run = ++RUN;
  // How many days until `next` becomes the live month? Once it does, any client
  // without an explicit plan silently inherits the previous month's numbers.
  const startsOn = new Date(`${next}-01T12:00:00Z`);
  const daysToGo = Math.max(0, Math.round((startsOn - new Date(ymdLocal(new Date()) + 'T12:00:00Z')) / 86400000));
  const unplanned = [];
  let answered = 0;
  const drawWarn = () => {
    const el = $('#plWarn'); if (!el || answered < S.accounts.length) return;
    if (!unplanned.length) {
      el.innerHTML = `<div class="notice">✓ <div>Every client has a plan for <b>${esc(monthLabel(next))}</b>.</div></div>`;
      return;
    }
    const names = unplanned.map(x => esc(x)).join(', ');
    el.innerHTML = `<div class="notice ${daysToGo <= 10 ? 'warn' : ''}">${daysToGo <= 10 ? '⚠️' : 'ℹ️'} <div>
      <b>${esc(monthLabel(next))} starts in ${daysToGo} day${daysToGo === 1 ? '' : 's'} and ${unplanned.length} client${unplanned.length === 1 ? ' has' : 's have'} no plan for it:</b> ${names}.
      <br>A month nobody plans doesn't go blank — it quietly reuses the last plan on file, and the Daily Brief will measure against that. Set them here and the brief has a real target to compare with.</div></div>`;
  };

  for (const a of S.accounts) {
    api(`/api/plan?act=${a.act_id}&month=${next}`).then(p => {
      if (run !== RUN) return;
      if (!p.planned) unplanned.push(a.name);
      answered++; drawWarn();
      const gc = $(`[data-goal="${a.act_id}"]`), ag = $(`[data-agreed="${a.act_id}"]`);
      if (gc) gc.innerHTML = p.planned && p.goals && p.goals.sales != null ? `<b>${fmtK(p.goals.sales, a.currency)}</b>` : '<span class="tiny">not set</span>';
      if (ag) ag.innerHTML = p.plan && p.plan.agreed_at
        ? '<span class="pill good">agreed</span>'
        : p.planned ? '<span class="pill warn">needs agreeing</span>' : '<span class="pill unk">not planned</span>';
    }).catch(() => { if (run === RUN) { answered++; drawWarn(); } });
  }
}

/* ---------- Customers ----------
   Unit economics, NOT cohorts: Triple Whale exposes no cohort table, so this is
   monthly averages and says so. The one question it exists to answer is whether the
   first order pays back what the customer cost to acquire. */
/** Real cohorts - customers grouped by the month of their FIRST order and followed
 *  forward. Only exists for stores that have connected Shopify, because Triple Whale
 *  has no per-customer history. The headline question is whether a customer becomes
 *  worth more over time: "they come back, so we can pay more for them" is the usual
 *  case for a higher CAC, and this is the only thing here that can test it. */
function cohortCard(co, cur) {
  if (!co) return '';
  if (!co.connected) {
    return `<div class="card"><h3 style="margin-bottom:6px">Lifetime value by cohort</h3>
      <p class="hint" style="margin-bottom:0">Not available for this client yet — it needs Shopify connected, because Triple Whale has no per-customer history. Everything above still works; this adds true lifetime value, the retention curve, and LTV against CAC.</p></div>`;
  }
  const sm = co.summary;
  // Share of a matured cohort's purchases that came AFTER the first order. Measured
  // inside the cohort, so a month that happened to attract bigger first orders cannot
  // skew it the way a cross-cohort LTV comparison does.
  const uplift = sm.repeat_uplift;
  const pct0 = v => { const r = Math.round((v ?? 0) * 100); return (r > 0 ? '+' : '') + r + '%'; };
  const rows = co.rows.slice().reverse().map(r => `<tr${r.mature ? '' : ' style="opacity:.62"'}>
    <td><b>${esc(monthLabel(r.month))}</b>${r.mature ? '' : ` <span class="tiny">${r.age_months}mo old</span>`}</td>
    <td class="num">${r.customers}</td>
    <td class="num">${fmtPct(r.repeat_rate, 1)}</td>
    <td class="num"><b>${fmtMoney(r.ltv, cur)}</b></td>
    <td class="num">${fmtMoney(r.cac, cur)}</td>
    <td class="num">${r.ltv_cac != null ? `<span class="pill ${r.ltv_cac >= 3 ? 'good' : r.ltv_cac >= 2 ? 'warn' : 'bad'}">${r.ltv_cac.toFixed(2)}x</span>` : '—'}</td>
  </tr>`).join('');

  // The finding that matters: if repeat adds almost nothing, the first order IS the
  // lifetime value, and no amount of "they'll come back" justifies a higher CAC.
  const verdict = uplift == null ? ''
    : uplift < 0.15
    ? `<div class="notice warn">⚠️ <div><b>Coming back adds very little here.</b> A matured customer places <b>${(sm.orders_per_customer || 1).toFixed(2)}</b> orders, so only <b>${pct0(uplift)}</b> of purchases come after the first. The opening order essentially <i>is</i> the lifetime value, which means <b>"we can pay more because they come back" does not hold for this client</b> — every acquisition has to justify itself on order one.</div></div>`
    : uplift < 0.4
    ? `<div class="notice">ℹ️ <div><b>Repeat buying adds a modest amount.</b> A matured customer places <b>${(sm.orders_per_customer || 1).toFixed(2)}</b> orders, so <b>${pct0(uplift)}</b> of purchases come after the first — real, but not enough to carry a CAC the opening order could not cover on its own. Treat it as a cushion, not a licence to bid up.</div></div>`
    : `<div class="notice">✓ <div><b>Customers get materially more valuable over time.</b> A matured customer places <b>${(sm.orders_per_customer || 1).toFixed(2)}</b> orders, so <b>${pct0(uplift)}</b> of purchases come after the first. That is genuine headroom: you can afford a CAC the opening order alone would not justify, as long as the repeat rate holds.</div></div>`;

  const card = (label, value, sub, info) => `<div class="card" style="margin:0">
    <div class="av-label" style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px">${label} <span class="info-i" title="${esc(info)}">i</span></div>
    <div style="font-size:clamp(19px,2.2vw,26px);font-weight:700;margin:4px 0 2px">${value}</div>
    <div class="tiny">${sub}</div></div>`;

  return `<div class="card"><h3 style="margin-bottom:2px">Lifetime value by cohort <span class="info-i" title="Customers grouped by the month they FIRST bought, then followed forward. This is true cohort analysis and it comes from Shopify, not Triple Whale. A cohort's lifetime value only means something once it has had time to mature, so anything under nine months old is faded and left out of the averages.">i</span></h3>
    <p class="hint" style="margin-bottom:10px">Each row is everyone who first bought in that month, and what they have been worth since. Recent cohorts are faded — they have not had time to come back yet, and reading them as if they had is the classic way to misjudge a retention curve.</p>
    ${verdict}
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:14px 0">
      ${card('Lifetime value', fmtMoney(sm.mature_ltv, cur), 'matured cohorts, 9 months or older', 'What a customer has actually been worth, averaged across cohorts old enough to have finished maturing. Real spend from Shopify, not a projection.')}
      ${card('First-month value', fmtMoney(sm.fresh_ltv, cur), 'cohorts under two months old', 'What a brand-new cohort is worth before anyone has had much chance to return. Useful context, but do not read the gap against lifetime value as the repeat uplift - these are different cohorts and one may simply have arrived with bigger first orders. The purchases-after-the-first figure measures that properly.')}
      ${card('Purchases after the first', uplift != null ? pct0(uplift) : '—', `${(sm.orders_per_customer || 1).toFixed(2)} orders per customer`, 'Share of a matured cohort’s purchases that came after the opening order. Measured inside the cohort rather than by comparing a mature cohort with a fresh one, because a month that happened to attract bigger first orders would distort that comparison. Small means the first order is the whole relationship; large means repeat buying supports a higher CAC.')}
      ${sm.ltv_cac != null ? card('LTV to CAC', sm.ltv_cac.toFixed(2) + 'x', `against ${fmtMoney(sm.cac, cur)} to acquire`, 'Lifetime value divided by what it cost to acquire that customer. Above 3x is generally considered healthy; near 1x means you are buying revenue rather than profit. CAC is blended from every ad platform, so it will not match a platform\u2019s own figure.') : ''}
      ${card('Become repeat buyers', fmtPct(sm.mature_repeat, 1), `${fmtPct(sm.fresh_repeat, 1)} in the first month`, 'Share of a matured cohort who ever placed a second order. The gap against the first-month figure shows how long people take to come back.')}
    </div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>First bought</th><th class="num">Customers</th><th class="num">Came back</th><th class="num">Worth since</th><th class="num">Cost to acquire</th><th class="num">LTV:CAC</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <p class="tiny" style="margin-top:8px">Lifetime value and repeat rates come from Shopify; cost to acquire is that month's blended ad spend from Triple Whale over its new customers. Neither source can produce both halves, which is why this needs the Shopify connection.</p>
  </div>`;
}

async function renderCustomers(first) {
  if (S.act === 'all') return renderCustomersAll();

  const shell = body => `<h2>Customers — ${esc(acct?.name || '')}</h2>
    <p class="sub">What a new customer costs to buy, and whether their first order pays it back, over the <b>last ${S.days} days</b> — change it with the range picker. Not a true lifetime value: Triple Whale gives us no per-customer history.</p>

    ${body}`;

  const card = (label, value, sub, info) => `<div class="card" style="margin:0">
    <div class="av-label" style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px">${label} <span class="info-i" title="${esc(info)}">i</span></div>
    <div style="font-size:clamp(19px,2.2vw,26px);font-weight:700;margin:4px 0 2px">${value}</div>
    <div class="tiny">${sub}</div></div>`;

  const rows = d.series.filter(x => !x.empty).map(x => `<tr${x.partial ? ' style="opacity:.6"' : ''}>
    <td><b>${esc(monthLabel(x.month))}</b>${x.partial ? ' <span class="tiny">(so far)</span>' : ''}</td>
    <td class="num">${x.new_orders}</td>
    <td class="num"><b>${fmtMoney(x.cac, cur)}</b></td>
    <td class="num">${fmtMoney(x.new_aov, cur)}</td>
    <td class="num">${d.cm_ok ? fmtMoney(x.first_order_gp, cur) : '—'}</td>
    <td class="num">${d.cm_ok && x.payback != null ? `<span class="pill ${x.payback >= 1 ? 'good' : x.payback >= 0.7 ? 'warn' : 'bad'}">${x.payback.toFixed(2)}x</span>` : '—'}</td>
    <td class="num">${fmtPct(x.repeat_share)}</td></tr>`).join('');

  $('#main').innerHTML = shell(`
    ${h.repeat_share != null ? `<p class="hint" style="margin:-4px 0 12px">${
      h.repeat_share < 0.2
        ? `<b>Growth here is expensive.</b> Only ${fmtPct(h.repeat_share)} of orders come from people who had bought before, so roughly ${fmtPct(1 - h.repeat_share)} of every month has to be bought again with ad spend. Nothing carries over — if spend stops, revenue stops with it.`
        : h.repeat_share >= 0.35
        ? `<b>A real base is carrying this brand.</b> ${fmtPct(h.repeat_share)} of orders come from people who had bought before, so a good chunk of each month arrives without ad spend behind it. That is what lets a brand survive a soft acquisition month.`
        : `<b>Part-bought, part-carried.</b> ${fmtPct(h.repeat_share)} of orders come from previous customers, so most of each month still has to be bought with ad spend, but the base is doing real work.`}</p>` : ''}
    ${h.thin ? `<div class="notice warn">⚠️ <div><b>Only ${h.new_orders} new customers in this window.</b> CAC and payback swing hard on small numbers — widen the range picker, or read the month-by-month table below instead of the headline.</div></div>` : ''}
    ${verdict}
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:14px 0">
      ${card('Cost to acquire', fmtMoney(h.cac, cur), `${h.new_orders} new customers`, 'All ad spend across every platform divided by the number of genuinely new customers. Blended, so it is not any single platform\u2019s reported cost per acquisition and will not match Ads Manager.')}
      ${card('First order value', fmtMoney(h.new_aov, cur), 'average, new customers', 'What a new customer spends on their first order, before any costs. Revenue from new customers divided by new-customer orders.')}
      ${d.cm_ok ? card('Margin on that order', fmtMoney(h.first_order_gp, cur), `at ${fmtPct(h.margin)} product margin`, 'What the first order leaves after product costs, fulfilment and fees, before the cost of acquiring the customer. This is what has to cover CAC.') : ''}
      ${d.cm_ok ? card('Payback', pb != null ? pb.toFixed(2) + 'x' : '—', pb != null && pb >= 1 ? 'covered on order one' : 'needs a second order', 'First-order margin divided by CAC. Above 1.0x the customer pays for themselves immediately. Below it, the brand relies on repeat purchases and the repeat share becomes critical.') : ''}
      ${card('Orders from repeat buyers', fmtPct(h.repeat_share),
        h.repeat_share == null ? `${h.returning_orders} of ${h.new_orders + h.returning_orders} orders`
        : h.repeat_share < 0.2 ? `${fmtPct(1 - h.repeat_share)} of orders must be bought with ads`
        : h.repeat_share < 0.35 ? `a useful base, but growth still comes from new customers`
        : `a strong base arriving without ad spend`,
        'The share of ORDERS placed by someone who had bought before — in other words, the orders you did not have to pay to acquire. It is not a returning-CUSTOMER rate: that would be a share of people, and Triple Whale gives us no per-customer history, so one shopper buying three times counts three times here. Why it matters: the rest of the orders have to be bought with ad spend, so a low number means growth is expensive and every extra order needs budget behind it. It is also the safety net under payback — if the first order does not cover the cost of acquiring the customer, this is the number that has to make up the difference.')}
      ${card('Returning order value', fmtMoney(h.returning_aov, cur), 'average, repeat customers', 'What a returning customer spends per order. Compare with the first-order value: if repeat orders are bigger, the customer gets more valuable over time.')}
    </div>
    ${h.new_rev != null ? `<div class="card"><h3 style="margin-bottom:6px">New vs returning, in revenue <span class="info-i" title="Repeat share above counts ORDERS; this counts MONEY. They differ when returning customers spend more or less per order than first-time buyers. A high returning share with weak new revenue means the ads have stopped acquiring and the list is carrying the store - MER holds up while aMER quietly falls.">i</span></h3>
      <p style="font-size:14px;margin:4px 0"><b>${fmtMoney(h.new_rev, cur)}</b> from new customers (<b>${fmtPct(h.new_rev_share)}</b> of revenue) · <b>${fmtMoney(h.returning_rev, cur)}</b> returning.
      ${h.new_rev_share != null && h.repeat_share != null ? `Returning customers placed <b>${fmtPct(h.repeat_share)}</b> of orders but produced <b>${fmtPct(1 - h.new_rev_share)}</b> of revenue — ${(1 - h.new_rev_share) > h.repeat_share + 0.02 ? 'they spend <b>more</b> per order than first-time buyers' : (1 - h.new_rev_share) < h.repeat_share - 0.02 ? 'they spend <b>less</b> per order than first-time buyers' : 'they spend about the same per order as first-time buyers'}.` : ''}</p>
      <div style="height:10px;border-radius:99px;overflow:hidden;display:flex;margin-top:8px">
        <div style="width:${((h.new_rev_share || 0) * 100).toFixed(1)}%;background:var(--brand-ink)"></div>
        <div style="flex:1;background:var(--line-strong)"></div></div>
      <p class="tiny" style="margin-top:8px">A high returning share with weak new revenue means the list is carrying the store — MER looks fine while aMER quietly collapses.</p></div>` : ''}

    ${cohortCard(co, cur)}

    <div class="card"><h3 style="margin-bottom:8px">Month by month</h3>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Month</th><th class="num">New customers</th><th class="num">CAC</th><th class="num">First order</th><th class="num">Margin on it</th><th class="num">Payback</th><th class="num">Repeat share</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      <p class="tiny" style="margin-top:8px">Whole months, so this stays put when you change the range picker above — it is the trend, not the current reading. The month in progress is faded because it is incomplete.</p></div>
    <p class="tiny"><b>This is not cohort analysis.</b> Triple Whale provides no cohort table or per-customer history, so we cannot follow one month's customers through the year or state a true lifetime value. These are monthly averages. Where a real LTV would change a decision — a long payback business, a subscription — treat these as directional and go to the Shopify data.</p>`);
}

/* ---------- Settings ---------- */
/** Shopify connections: which client stores are connected, and the one link that
 *  connects a new one. This is the answer to "where do I add clients" - before it
 *  existed a store connected only if its domain happened to match `tw_shop`, with
 *  nothing on screen to say whether it had, or to fix it when it had not. */
async function connectionsCard(run) {
  let d;
  try { d = await api('/api/connections'); }
  catch (e) { return `<div class="card"><h3 style="margin-bottom:6px">Shopify connections</h3>
    <p class="hint" style="margin-bottom:0">Could not load (${esc(e.message)}).</p></div>`; }
  if (run !== RUN) return null;

  const one = S.act === 'all' ? null : S.act;
  const shown = one ? d.clients.filter(c => c.act_id === one) : d.clients;

  const pill = c => c.status === 'connected'
    ? '<span class="pill good">Connected</span>'
    : c.status === 'uninstalled'
    ? '<span class="pill bad">Removed by client</span>'
    : '<span class="pill">Not connected</span>';

  // What the connection actually BUYS them, per client - otherwise "connected" is a
  // green dot with no meaning. Cohorts are the only thing that needs Shopify.
  const gives = c => c.status !== 'connected'
    ? '<span class="tiny">no lifetime-value cohorts</span>'
    : c.cohort_months
    ? `<span class="tiny">${c.cohort_months} cohort months${c.cohort_as_of ? ' &middot; as of ' + esc(String(c.cohort_as_of).slice(0, 10)) : ''}</span>`
    : '<span class="tiny">connected, no cohort data pulled yet</span>';

  const rows = shown.map(c => `<tr data-act="${esc(c.act_id)}">
    <td><b>${esc(c.name)}</b>${c.active ? '' : ' <span class="tiny">(inactive)</span>'}<br>
      <span class="tiny">${c.shop ? esc(c.shop) : 'no store domain on file'}</span></td>
    <td>${pill(c)}${c.uninstalled_at ? `<br><span class="tiny">removed ${esc(String(c.uninstalled_at).slice(0, 10))}</span>` : ''}</td>
    <td>${gives(c)}</td>
    <td>${c.install_url
      ? `<button class="btn" data-copy="${esc(c.install_url)}" style="font-size:11.5px;padding:4px 8px">${c.status === 'connected' ? 'Copy re-connect link' : 'Copy install link'}</button>`
      : '<span class="tiny">add the store domain in Account Health first</span>'}
      <span class="tiny" data-msg="${esc(c.act_id)}"></span></td>
  </tr>`).join('');

  // A store that installed but matched nothing is the one failure that is otherwise
  // invisible: the merchant sees success, and the data goes nowhere.
  const unmatched = d.unmatched.length ? `<div class="notice warn" style="margin-top:12px">&#9888;&#65039;
    <div><b>${d.unmatched.length} connected ${d.unmatched.length === 1 ? 'store is' : 'stores are'} not matched to a client.</b>
    ${d.unmatched.length === 1 ? 'Its data is being held but nothing reports on it until you point it' : 'Their data is being held but nothing reports on it until you point each one'} at a client.
    <div style="margin-top:8px">${d.unmatched.map(u => `<div class="row" style="margin:4px 0;gap:8px">
      <code style="font-size:12px">${esc(u.shop)}</code>
      <select data-map="${esc(u.shop)}" style="max-width:200px"><option value="">&mdash; pick a client &mdash;</option>${
        d.clients.map(c => `<option value="${esc(c.act_id)}">${esc(c.name)}</option>`).join('')}</select>
      <span class="tiny" data-mapmsg="${esc(u.shop)}"></span></div>`).join('')}</div></div></div>` : '';

  return `<div class="card"><h3 style="margin-bottom:2px">Shopify connections
      <span class="info-i" title="Connecting a store lets us read its orders, customers and products directly. Triple Whale has no per-customer history, so this is the only way to get true lifetime value by cohort. Everything else on every tab works without it.">i</span></h3>
    <p class="hint" style="margin-bottom:10px">Adding a client: create them in Account Health, then <b>copy their install link below and send it to them</b>. They approve it once and it stays connected. ${one ? 'Switch the picker to <b>All clients</b> to see every brand.' : ''}</p>
    ${d.app_configured ? '' : '<div class="notice warn">&#9888;&#65039; <div>The Shopify app is not configured on the server yet, so these links will not work.</div></div>'}
    <div class="tbl-wrap"><table>
      <thead><tr><th>Client</th><th>Status</th><th>What it adds</th><th>Install link</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="4"><span class="hint">No clients.</span></td></tr>'}</tbody></table></div>
    ${unmatched}
    <p class="tiny" style="margin-top:10px">The link opens Shopify\u2019s own permission screen on the client\u2019s store. We request read-only access to orders, customers, products and analytics, and never write anything back. If a client removes the app, this page says so \u2014 their cohort data stops updating but nothing else breaks.</p>
  </div>`;
}

async function renderSettings() {
  const run = ++RUN;
  // Honour the client picker, exactly like every other tab: "All clients" lists
  // everyone, a selected brand shows only that brand.
  const one = S.act === 'all' ? null : S.accounts.find(a => a.act_id === S.act);
  const shown = one ? [one] : S.accounts;
  $('#main').innerHTML = `<h2>Settings${one ? ' — ' + esc(one.name) : ''}</h2>
    <p class="sub">Where ${one ? `<b>${esc(one.name)}</b>'s` : "each brand's"} reporting goes, and what its profit is calculated on. <b>Every setting here is shared with Account Health</b> — one database behind both tools, so there is no second copy to keep in sync.${one ? ' Switch the picker to <b>All clients</b> to see every brand at once.' : ''}</p>
    <div class="row" style="margin-bottom:12px"><span style="flex:1"></span><button class="help-btn" data-help="settings">? How to use</button></div>
    <div class="card"><h3 style="margin-bottom:6px">Daily Brief send time</h3>
      <p class="hint" style="margin-bottom:10px">${one ? '<b>Applies to all brands, not just ' + esc(one.name) + '.</b> ' : ''}When the brief posts each morning, for <b>every</b> brand with auto-post on. Set in <b>Central time</b> and honoured in Central all year, so it does not shift an hour when the clocks change. It always covers yesterday.</p>
      <div class="row">
        <select id="btHour" style="max-width:190px"></select>
        <span class="tiny" id="btMsg"></span>
      </div></div>
    <div id="connCard"><div class="card"><span class="hint">Loading Shopify connections\u2026</span></div></div>
    <div class="card settings"><div class="tbl-wrap"><table>
      <thead><tr><th>Client</th><th title="Where the Daily Brief posts. This is the channel your CLIENT reads.">Daily Brief channel</th><th title="The client-facing daily forecast-vs-actual update, sent each morning">Brief</th><th title="Flat margin used instead of per-product costs. Blank = real Triple Whale costs.">Margin</th><th>Cost data</th><th title="Re-pull this client's full Triple Whale history. Needed once so sales tax is available for every month.">Triple Whale</th></tr></thead>
      <tbody id="setRows"></tbody></table></div>
      <p class="tiny" style="margin-top:10px">Each cell saves the moment you change it — a green flash means saved. This is the channel <b>your client reads</b>. Internal pace and KPI alerts are a separate setting that lives in <a href="../account-health/">Account Health → Settings</a>, because those are for your media buyer, not the client. A brand needs this channel and monthly goals before the brief will switch on, and it never turns itself on.</p></div>`;

  const tb = $('#setRows');
  let chList = null;                       // null = loading, 'error' = list unavailable
  const chCell = (a, key, blank) => Array.isArray(chList)
    ? `<select data-k="${key}" style="max-width:200px"><option value="">${esc(blank)}</option>${chList.map(c =>
        `<option value="${esc(c.id)}" ${a[key] === c.id ? 'selected' : ''}>#${esc(c.name)}${c.member ? '' : ' · invite bot'}</option>`).join('')}</select>`
    : chList === 'error'
    ? `<input type="text" data-k="${key}" value="${esc(a[key] || '')}" placeholder="channel ID" style="width:140px">`
    : `<span class="tiny">loading channels…</span>`;

  const draw = () => {
    tb.innerHTML = shown.map(a => `<tr data-id="${a.act_id}">
      <td><b>${esc(a.name)}</b></td>
      <td>${chCell(a, 'brief_channel', '— not set —')}${a.brief_enabled && !a.brief_channel ? '<br><span class="tiny" style="color:var(--warn)">⚠ falling back to the internal alerts channel</span>' : ''}</td>
      <td><div class="row" style="margin:0;gap:8px"><div class="toggle ${a.brief_enabled?'on':''}" data-k="brief_enabled" title="${a.brief_enabled?'Posting each morning':'Off'}"></div><span class="tiny">${a.brief_enabled?'on':'off'}${!(a.brief_channel||a.slack_channel)?' · needs a channel':''}</span></div></td>
      <td><div class="unit-in" style="width:82px"><input type="text" inputmode="decimal" data-k="margin" value="${a.margin_pct!=null?Math.round(a.margin_pct*100):''}" placeholder="auto"><span>%</span></div></td>
      <td>${healthPill(a.cost_health)}</td>
      <td><button class="btn" data-k="backfill" style="font-size:11.5px;padding:4px 8px">Backfill 430d</button> <span class="tiny" data-bf="${a.act_id}"></span></td>
    </tr>`).join('');
  };
  draw();

  const flash = el => { const t = el.closest('.unit-in') || el; t.classList.add('flash-saved'); setTimeout(() => t.classList.remove('flash-saved'), 1300); };

  tb.addEventListener('click', async e => {
    const tg = e.target.closest('.toggle'); if (!tg) return;
    const tr = e.target.closest('tr'); const a = S.accounts.find(x => x.act_id === tr.dataset.id);
    const on = !tg.classList.contains('on');
    if (on && !(a.brief_channel || a.slack_channel)) {
      return noteModal('This brand has nowhere to post', `<p>Pick a <b>Daily Brief channel</b> for ${esc(a.name)} first — the brief needs somewhere to go.</p>`);
    }
    if (on && !a.goals) {
      return noteModal('This brand has no plan yet', `<p>Set ${esc(a.name)}’s monthly goals on the <b>Plan</b> tab first. The brief compares every number to a plan, so it needs one before it can say anything useful.</p>`);
    }
    if (on && !a.brief_channel) {
      const ok = await confirmModal('Post the client brief to an internal channel?',
        `No Daily Brief channel is set for ${a.name}, so it will fall back to the internal alerts channel. The brief is written for the client, so they would never see it. Set a client channel instead?`,
        'Post internally anyway');
      if (!ok) return;
    }
    tg.classList.toggle('on', on);
    try { await api('/api/client-settings', { method:'PUT', body: JSON.stringify({ act: a.act_id, brief_enabled: on }) }); a.brief_enabled = on; draw(); }
    catch (err) { noteModal('Could not save', `<p>${esc(err.message)}</p>`); tg.classList.toggle('on', !on); }
  });

  tb.addEventListener('change', async e => {
    const k = e.target.dataset.k; if (!k) return;
    const tr = e.target.closest('tr'); const a = S.accounts.find(x => x.act_id === tr.dataset.id);
    try {
      if (k === 'margin') {
        const raw = e.target.value.replace(/[^0-9.]/g, '');
        const pct = raw === '' ? null : +raw / 100;
        if (pct != null && !(pct > 0 && pct < 1)) {
          return noteModal('That margin looks wrong', '<p>Enter a margin between <b>1</b> and <b>99</b> percent, or leave it blank to use the real per-product costs from Triple Whale.</p>');
        }
        await api('/api/margin', { method:'PUT', body: JSON.stringify({ act: a.act_id, margin_pct: pct }) });
        a.margin_pct = pct;
      } else {
        await api('/api/client-settings', { method:'PUT', body: JSON.stringify({ act: a.act_id, [k]: e.target.value }) });
        a[k] = e.target.value || null;
      }
      flash(e.target);
      await inPlace(async () => { await boot(); show('settings'); });
    } catch (err) { noteModal('Could not save', `<p>${esc(err.message)}</p>`); }
  });

  // Send time
  (async () => {
    const sel = $('#btHour'); if (!sel) return;
    const h = await loadBriefTime();
    if (run !== RUN) return;
    sel.innerHTML = Array.from({ length: 24 }, (_, i) => `<option value="${i}" ${i === h ? 'selected' : ''}>${esc(hourLabel(i))}</option>`).join('');
    if (h == null) { $('#btMsg').textContent = 'could not load the current time'; return; }
    sel.onchange = async () => {
      $('#btMsg').textContent = 'Saving…';
      try {
        const r = await api('/api/brief-time', { method: 'PUT', body: JSON.stringify({ hour: +sel.value }) });
        BT.hour = r.hour;
        $('#btMsg').textContent = `Saved ✓ — briefs post at ${hourLabel(r.hour)}`;
      } catch (e) { $('#btMsg').textContent = e.message; }
    };
  })();

  // Per-client Triple Whale backfill. ONE CLIENT AT A TIME on purpose: a 430-day
  // pull is ~25-50k rows and every D1 batch is a subrequest, so running all six in
  // one invocation blows the Worker limit.
  tb.addEventListener('click', async e => {
    const b = e.target.closest('[data-k="backfill"]'); if (!b) return;
    const tr = e.target.closest('tr'); const a = S.accounts.find(x => x.act_id === tr.dataset.id);
    if (!a) return;
    const msg = $(`[data-bf="${a.act_id}"]`);
    b.disabled = true; msg.textContent = 'pulling 430 days…';
    try {
      const r = await api(`/api/tw-sync?act=${a.act_id}&days=430`, { method: 'POST' });
      const x = (r.results && r.results[0]) || {};
      msg.textContent = x.ok ? `✓ ${x.metrics} metrics, ${x.from} → ${x.to}` : (x.error || x.skipped || 'done');
      if (x.ok) await refreshAccounts();   // the numbers behind every other tab just changed
    } catch (err) { msg.textContent = err.message; }
    b.disabled = false;
  });

  // Connections. Listeners go on the card, never on #main - #main survives every
  // render, so a listener there stacks one copy per visit.
  (async () => {
    const html = await connectionsCard(run);
    if (html == null || run !== RUN) return;
    const host = $('#connCard'); if (!host) return;
    host.innerHTML = html;

    host.addEventListener('click', async e => {
      const b = e.target.closest('[data-copy]'); if (!b) return;
      const msg = $(`[data-msg="${b.closest('tr').dataset.act}"]`);
      try { await navigator.clipboard.writeText(b.dataset.copy); if (msg) msg.textContent = 'copied \u2713'; }
      catch { noteModal('Copy the install link', `<p>Send this to the client:</p><p><code style="font-size:12px;word-break:break-all">${esc(b.dataset.copy)}</code></p>`); }
      setTimeout(() => { if (msg) msg.textContent = ''; }, 2500);
    });

    host.addEventListener('change', async e => {
      const sel = e.target.closest('[data-map]'); if (!sel || !sel.value) return;
      const shop = sel.dataset.map, msg = $(`[data-mapmsg="${shop}"]`);
      if (msg) msg.textContent = 'saving\u2026';
      try {
        await api('/api/connections/map', { method: 'POST', body: JSON.stringify({ shop, act: sel.value }) });
        if (msg) msg.textContent = 'mapped \u2713';
        await inPlace(async () => { await boot(); show('settings'); });
      } catch (err) { if (msg) msg.textContent = err.message; }
    });
  })();

  api('/api/slack-channels').then(r => { if (run !== RUN) return; chList = r.channels; draw(); })
    .catch(err => { if (run !== RUN) return; chList = 'error'; draw();
      $('#main .tiny').insertAdjacentHTML('beforeend', ` <span style="color:var(--bad)">Couldn't list Slack channels (${esc(err.message)}) — paste channel IDs instead.</span>`); });
}

boot();
</script>
</body>
</html>
