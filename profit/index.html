/* ---------- shared bits ---------- */
const healthPill = h => {
  if (!h) return '<span class="pill unk">not checked</span>';
  const v = h.verdict;
  return v === 'good' ? '<span class="pill good">cost data ok</span>'
    : v === 'override' ? '<span class="pill good">flat margin</span>'
    : v === 'noisy' ? '<span class="pill warn">cost data noisy</span>'
    : v === 'broken' ? '<span class="pill bad">cost data ⚠</span>'
    : '<span class="pill unk">no cost data</span>';
};
const cmTrusted = h => !h || (h.verdict !== 'broken' && h.verdict !== 'none');

/* ---------- fulfilment health ----------
   Only ONE state is a problem: delivery charged with nothing booked against it.
   A cost that merely looks surprising - including one that exactly equals the
   charge - is the brand's own Triple Whale configuration and is reported as given.
   Cole's call, 2026-08-24: flag what is MISSING, never what is merely surprising. */
const shipPill = (s, long) => { const t = long ? 'fulfilment ' : '';
  return !s ? `<span class="pill unk">${t}not checked</span>`
    : s.mode === 'measured' ? `<span class="pill good">${t}measured</span>`
    : s.mode === 'uncosted' ? `<span class="pill bad">${long ? 'no fulfilment cost' : 'nothing recorded'}</span>`
    : `<span class="pill unk">no shipping${long ? ' billed' : ''}</span>`;
};

/** What delivery actually costs, taken ONLY from the clients whose Triple Whale
 *  carries a real rate. With a handful of clients this is a bracket, not an
 *  average, so the card names whose numbers it is and says outright that weight
 *  and size move it. Never used to adjust a number - only to size the unknown. */
function fulfilBenchmark(exclude) {
  const peers = (S.accounts || [])
    .filter(a => a.act_id !== exclude && a.shipping?.mode === 'measured' && a.shipping.cost_per_order > 0)
    .map(a => ({ name: a.name, per: a.shipping.cost_per_order }))
    .sort((x, y) => x.per - y.per);
  if (!peers.length) return null;
  return { peers, lo: peers[0].per, hi: peers[peers.length - 1].per };
}

/** The exposure a missing fulfilment cost creates, as a RANGE. Positive means
 *  contribution margin is overstated by that much; negative means understated. */
function fulfilExposure(s, bench) {
  if (!s || !bench || !(s.orders > 0)) return null;
  const lo = s.orders * bench.lo - s.cost, hi = s.orders * bench.hi - s.cost;
  return { lo: Math.min(lo, hi), hi: Math.max(lo, hi), implied_lo: s.orders * bench.lo, implied_hi: s.orders * bench.hi };
}

/** The fulfilment section of the Costs page. Diagnoses, sizes the unknown, and
 *  names the fix - it never adjusts a number, for the same reason the COGS side
 *  never does: a silent correction is indistinguishable from a measurement. */
function fulfilSection(s, cur, actId, windowSales, days, marginPct) {
  // A flat margin override replaces the WHOLE variable-cost chain - dayEconomics
  // takes `sales * marginPct` and never looks at product, delivery, handling or
  // fees. So for an override client none of this reaches contribution margin,
  // and saying "already inside CM" would be flatly untrue.
  const ovr = marginPct != null
    ? ` <b>This client is on a flat ${Math.round(marginPct * 100)}% margin override</b>, so none of these figures feed contribution margin directly - the override replaces the whole cost chain with one percentage, delivery included. What follows describes the real Triple Whale data behind it.`
    : '';
  if (!s || s.mode === 'none') {
    return `<div class="card"><h3 style="margin-bottom:6px">Fulfilment</h3>
      <p class="hint">Nothing was charged or costed for delivery in the last ${days} days, so shipping does not touch this client's contribution margin either way.${ovr}</p></div>`;
  }
  const perO = n => n == null ? ' - ' : fmtMoney(n, cur);
  const bench = fulfilBenchmark(actId);
  const exp = s.mode === 'measured' ? null : fulfilExposure(s, bench);
  const peerNames = bench ? bench.peers.map(p => `${esc(p.name)} ${perO(p.per)}`).join(' and ') : '';
  const share = windowSales > 0 && exp ? { lo: exp.lo / windowSales, hi: exp.hi / windowSales } : null;
  const orderCount = Math.round(s.orders).toLocaleString();

  // The bracket is a couple of clients wide, so it is stated as a bracket. Weight
  // and box size drive delivery cost more than anything else and the peers are
  // simply whoever has a rate configured - so the wording never converts the
  // bracket into a point estimate, and never claims to know which side is right.
  const benchNote = bench ? `The only clients whose Triple Whale carries a real delivery rate are ${peerNames} an order. Delivery cost follows weight and box size more than anything else, and these peers are just whoever happens to have a rate configured - so this sizes the unknown, it does not measure it.` : '';
  const expLine = !exp ? ''
    : s.mode === 'uncosted' ? `Nothing at all is booked, so the direction is certain even if the size is not: delivery costs more than zero. To scale it - at what your measured clients pay, this client's <b>${orderCount} orders</b> would be <b>${fmtMoney(exp.implied_lo, cur)} – ${fmtMoney(exp.implied_hi, cur)}</b> over these ${days} days${share ? `, ${fmtPct(share.lo, 1)} to ${fmtPct(share.hi, 1)} of revenue` : ''}.`
    : exp.lo > 0 ? `At that rate this client's <b>${orderCount} orders</b> would cost <b>${fmtMoney(exp.implied_lo, cur)} – ${fmtMoney(exp.implied_hi, cur)}</b> to deliver, above the <b>${fmtMoney(s.cost, cur)}</b> booked - so contribution margin is more likely overstated than not, by <b>up to ${fmtMoney(exp.hi, cur)}</b> over these ${days} days${share ? ` (${fmtPct(share.hi, 1)} of revenue)` : ''}.`
    : exp.hi < 0 ? `At that rate this client's <b>${orderCount} orders</b> would cost <b>${fmtMoney(exp.implied_lo, cur)} – ${fmtMoney(exp.implied_hi, cur)}</b> to deliver, well under the <b>${fmtMoney(s.cost, cur)}</b> booked. Either this client genuinely ships heavier or bulkier than they do, or contribution margin is being understated by <b>up to ${fmtMoney(-exp.lo, cur)}</b>. Nothing here can tell you which - only a real rate can.`
    : `At that rate this client's <b>${orderCount} orders</b> would cost <b>${fmtMoney(exp.implied_lo, cur)} – ${fmtMoney(exp.implied_hi, cur)}</b> to deliver, and the <b>${fmtMoney(s.cost, cur)}</b> copied across sits inside that range. So the size looks about right - by luck, not by measurement, and it will drift the moment the shipping policy or the product mix changes.`;

  const worthLabel = !exp ? 'against the booked figure'
    : s.mode === 'uncosted' ? 'none of it is booked'
    : exp.lo > 0 ? `vs ${fmtMoney(s.cost, cur)} booked - margin likely overstated`
    : exp.hi < 0 ? `vs ${fmtMoney(s.cost, cur)} booked - booked figure looks high`
    : `vs ${fmtMoney(s.cost, cur)} booked - about the right size`;

  const stats = `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:0 0 14px">
    ${statCard('Charged to customers', fmtMoney(s.rev, cur), `${perO(s.rev_per_order)} an order · ${days} days`, 'What customers paid for delivery over the window. This sits INSIDE revenue on every tab, because revenue is Shopify Total Sales less tax - so it can never be netted back out, only costed against.')}
    ${statCard(s.mode === 'measured' ? 'What delivery cost' : 'Recorded as cost', fmtMoney(s.cost, cur), s.mode === 'uncosted' ? 'nothing booked at all' : `${perO(s.cost_per_order)} an order`, 'What Triple Whale holds as the fulfilment cost, exactly as the brand configured it there.')}
    ${statCard('Orders', orderCount, `over ${days} days`, 'Total orders in the window. Delivery is priced per parcel, so orders - not revenue - is what a shipping cost scales with.')}
    ${statCard(s.mode === 'measured' ? 'Shipping nets' : 'What it would cost', s.mode === 'measured' ? fmtMoney(s.rev - s.cost, cur) : exp ? `${fmtMoney(exp.implied_lo, cur)} – ${fmtMoney(exp.implied_hi, cur)}` : ' - ', s.mode === 'measured' ? (s.rev >= s.cost ? 'delivery pays for itself' : 'delivery runs at a loss') : worthLabel, s.mode === 'measured' ? 'Shipping revenue minus fulfilment cost over the window. Negative means customers are not covering delivery, which is a pricing decision, not a data problem.' : 'This client’s orders priced at what the clients WITH a real delivery rate actually pay per order. A bracket for an unknown, never applied to any figure on this dashboard.')}
  </div>`;

  if (s.mode === 'measured') {
    return `<div class="card"><h3 style="margin-bottom:2px">Fulfilment ${shipPill(s)}</h3>
      <p class="hint" style="margin-bottom:12px">Triple Whale holds a real delivery rate for this client, so what shipping costs is measured rather than guessed${marginPct != null ? '' : ' and is already inside contribution margin'}.${ovr}</p>
      ${stats}
      <p class="tiny">Customers paid <b>${perO(s.rev_per_order)}</b> an order for delivery and it cost <b>${perO(s.cost_per_order)}</b> to ship, so shipping ${s.rev >= s.cost ? 'contributes' : 'costs'} <b>${fmtMoney(Math.abs(s.rev - s.cost), cur)}</b> over ${days} days${s.rev < s.cost ? ` - ${perO((s.cost - s.rev) / s.orders)} an order out of margin. That is a real number and a pricing question, not a data one.` : '.'}</p></div>`;
  }

  return `<div class="card"><h3 style="margin-bottom:2px">Fulfilment ${shipPill(s)}</h3>
    <p class="hint" style="margin-bottom:12px">Product costs are not the only variable cost that can go missing, and delivery fails more quietly.${ovr}</p>
    <div class="notice bad" style="margin:0 0 14px">⚠️ <div><b>Customers were charged ${fmtMoney(s.rev, cur)} for delivery and no cost is recorded against any of it.</b> That income is already inside revenue and cannot be netted back out, so contribution margin is overstated by whatever delivery actually costs. Add this brand's fulfilment rates in Triple Whale and the figure corrects itself.</div></div>
    ${stats}
    ${bench ? `<p class="tiny">${benchNote} ${expLine}</p>` : `<p class="tiny">No other client has a real delivery rate configured either, so there is nothing to size this against yet.</p>`}
    <p class="tiny" style="margin-top:8px"><b>The fix is at source:</b> Triple Whale → Settings → Costs → shipping, either a flat rate per order or the real carrier rates. Nothing on this dashboard adjusts for it in the meantime - a silent correction would be indistinguishable from a measurement.</p></div>`;
}
/** CTC put every number against its plan; this is that comparison in one pill. */
function vsPlan(actual, planned) {
  if (actual == null || !planned) return '';
  const off = actual / planned - 1;
  const cls = off >= 0 ? 'good' : off >= -0.1 ? 'warn' : 'bad';
  return ` <span class="pill ${cls}" style="padding:1px 6px;font-size:10px">${fmtSigned(off)} vs plan</span>`;
}

/* A headline figure, as a cell of the dark roll-up.
 *
 * This used to be a white card, and a row of them was six white cards on a
 * white-ish page: no foreground, every figure the same weight, nothing telling
 * you where to look. As roll-up cells they become the one heavy element on the
 * page - the same near-black as the nav header, so the header reads as
 * continuing down into the numbers.
 *
 * Twenty calls across eight tabs come through here, which is the point: the
 * headline row converts everywhere at once and cannot drift apart later.
 * `tone` ('good' | 'bad' | 'warn') colours the figure where a verdict is
 * genuinely attached to it; most callers pass nothing.
 */
/* Round first, then sign: a value a hair under parity must not print "-0%". */
const signedPct = d => { const p = Math.round(d * 100); return (p > 0 ? '+' : '') + p + '%'; };
/** The MTD-vs-plan pill every strip uses. Spend is judged on distance from
 *  plan in either direction; revenue and MER on the side they land. Always
 *  says MTD, because the figure above it may be a different window. */
function mtdPill(actual, plan, kind) {
  if (actual == null || plan == null || !plan) return '';
  const d = actual / plan - 1;
  const tone = kind === 'spend' ? (Math.abs(d) <= 0.08 ? 'good' : 'warn')
    : d >= 0 ? 'good' : d <= -0.08 ? 'bad' : 'warn';
  const txt = kind === 'spend' && Math.abs(d) < 0.005 ? 'MTD on plan' : `MTD ${signedPct(d)} vs plan`;
  return `<span class="pill ${tone}">${txt}</span>`;
}
/** One roll-up cell. `plan` is the planned-by-now line, `pill` the verdict
 *  chip; both optional so the twenty existing callers are unchanged. */
function statCard(label, value, sub, info, tone, plan, pill) {
  return `<div class="ru">
    <div class="ru-l">${label}${info ? ` <span class="info-i ru-i" title="${esc(info)}">i</span>` : ''}</div>
    <div class="ru-v${tone ? ' ' + tone : ''}">${value}</div>
    ${sub ? `<div class="ru-d">${sub}</div>` : ''}${plan ? `<div class="ru-p">${plan}</div>` : ''}${pill || ''}
  </div>`;
}

/* ---------- Overview ---------- */
/* SORTING LIVES HERE, and that is why the Profit tab no longer ranks brands.
   `renderProfitAll` used to draw the same six figures from the same snapshot
   over the same window as this table, as cards sorted by contribution margin -
   a genuine duplicate, and two tabs answering one question is exactly the
   confusion this whole pass exists to remove. The ranking was the only thing
   it added, so the ranking came here. */
const OV_SORT = [
  ['cm', 'Contribution margin', a => cmTrusted(a.cost_health) ? (a.window.cm ?? -Infinity) : -Infinity],
  ['sales', 'Revenue', a => a.window.sales ?? -Infinity],
  ['spend', 'Ad spend', a => a.window.spend ?? -Infinity],
  ['mer', 'MER', a => a.window.mer ?? -Infinity],
  ['name', 'Name', null],
];
/* ---------- Overview: the triage board ----------
 *
 * The morning question is not "what are the numbers", it is "who do I deal
 * with first". A sorted table cannot answer that - it makes you read six rows
 * and hold the comparison in your head. So the screen does the triage: brands
 * group by whether they need a decision, and each card leads with the figure
 * that put it there and names the actual next move.
 *
 * Two rules keep this honest:
 *
 *   The grouping is stated, not implied. `triage()` is the only place a brand
 *   is judged, so the roll-up count, the group it sits in and the words on its
 *   card can never disagree - the failure mode of a status UI is three parts of
 *   one page telling you different things.
 *
 *   A card never shows a verdict the data cannot support. No plan means no
 *   pace judgement (it says so and sits under Unplanned rather than being
 *   quietly called fine), and untrusted cost data suppresses contribution
 *   margin here exactly as it does everywhere else.
 */
const TRIAGE = {
  bd: { key: 'bd', label: 'Needs a decision', rank: 0 },
  wn: { key: 'wn', label: 'Watch', rank: 1 },
  ok: { key: 'ok', label: 'On track', rank: 2 },
  un: { key: 'un', label: 'No plan set', rank: 3 },
};

/** One brand, judged once. Pace against the month's pro-rated plan is the
 *  spine - it is the only measure that says whether today needs an action -
 *  with cost-data trust as an override, because a brand whose profit cannot
 *  be reported needs a look regardless of how its revenue is running. */
function triage(a) {
  const trusted = cmTrusted(a.cost_health);
  const plan = a.plan?.sales, mtd = a.mtd?.sales;
  if (plan == null || mtd == null) {
    return { g: trusted ? 'un' : 'wn', off: null,
      state: trusted ? 'no plan' : 'check costs',
      act: trusted
        ? 'No plan for this month, so nothing here is measured against a target. Set one on <b>Plan</b>.'
        : 'Cost data will not support a profit figure for this brand. Open <b>Costs</b> before reporting anything.' };
  }
  const off = mtd / plan - 1;
  const g = off <= -0.30 ? 'bd' : off <= -0.08 ? 'wn' : 'ok';
  const pct = Math.round(Math.abs(off) * 100);
  const state = off >= 0 ? `${pct}% ahead` : `${pct}% behind`;
  return { g: !trusted && g === 'ok' ? 'wn' : g, off, state, act: null };
}

/* ---------- Overview: Today ----------
   Cole, 2026-10-04: the team opens Locus and does not know what to do. So the
   Overview opens with a short to-do list by role, each line a count and a button
   to the screen where that job is done.

   The counts come from the calls the other tabs already make, judged the same way
   those tabs judge them, so this card can never disagree with the page it opens:
     briefs   /api/briefs   a brand's newest brief is still a 'draft'
     reports  /api/reports  the newest weekly / monthly is a 'draft' (Reports' "Waiting on you")
     tests    /api/brand/tests-overview   `call` and `making` per brand (boxOf on the worker)
     research /api/brand/overview         personas minus personas_ok
   A brand with NO client channel is handled automatically and never counts as
   waiting (Cole, 2026-09-10). A call that fails leaves its line as a plain link
   with no number; nothing here ever shows an error.

   The Overview paints first and this fills in afterwards, in place. OVD keeps the
   last answer per client so a sort or a role switch repaints without a refetch. */
const OVD = { key: null, at: 0, n: null };
const ovRole = () => { let r = 'all'; try { r = localStorage.getItem('pf_role') || 'all'; } catch {} return r === 'buyer' || r === 'strategist' ? r : 'all'; };

function ovTodayHtml(n) {
  const role = ovRole(), loading = !n, allBrands = S.act === 'all';
  const who = c => {
    if (!allBrands || !c || !c.who || !c.who.length) return '';
    const shown = c.who.slice(0, 3).map(esc).join(', ');
    return `<small>${shown}${c.who.length > 3 ? ` and ${c.who.length - 3} more` : ''}</small>`;
  };
  /* One line. `c` is { n, who } or null when its call failed. `go` is the tab the
     line opens; a line without one is information, not a button. */
  const line = (c, many, one, none, plain, go, open) => {
    const v = loading ? undefined : c ? c.n : null;
    const txt = v == null ? plain : v === 0 ? none : v === 1 ? one : many;
    const num = v === undefined ? '&hellip;' : v == null ? '' : v === 0 ? '&#10003;' : v;
    const tag = go ? 'button' : 'div';
    return `<${tag} class="ovd-line${v === 0 ? ' zero' : ''}"${go ? ` type="button" data-go="${go}"` : ''}>
      <span class="ovd-n">${num}</span><span class="ovd-t">${txt}${v ? who(c) : ''}</span>${go ? `<span class="ovd-go">${open}</span>` : ''}</${tag}>`;
  };
  const buyer = `<div class="ovd-col"><div class="ovd-who">Media buyer</div>
      ${line(n && n.briefs, 'briefs to read and send', 'brief to read and send', 'No briefs to read and send', 'Read and send the daily briefs', 'brief', 'Open Daily Brief')}
      ${line(n && n.calls, 'tests need a call', 'test needs a call', 'No tests need a call', 'Make the test calls', 'tests', 'Open Test calls')}
      ${line(n && n.reports, 'reports waiting to send', 'report waiting to send', 'No reports waiting to send', 'Read and send the reports', 'reports', 'Open Reports')}
    </div>`;
  const strat = `<div class="ovd-col"><div class="ovd-who">Strategist</div>
      ${line(n && n.making, 'tests being made in Asana', 'test being made in Asana', 'No tests being made in Asana', 'Tests being made are in Asana', null)}
      ${line(n && n.drafts, 'research drafts to approve', 'research draft to approve', 'No research drafts to approve', 'Approve the research drafts', 'brand', 'Open Brand')}
      <button class="ovd-line" type="button" data-go="angles"><span class="ovd-n"></span><span class="ovd-t">Check an idea before you brief it</span><span class="ovd-go">Open Angles</span></button>
    </div>`;
  /* The headline counts only what somebody has to DO: tests being made are
     information, and a line whose number could not be had says nothing either way. */
  const mine = !n ? [] : role === 'buyer' ? [n.briefs, n.calls, n.reports] : role === 'strategist' ? [n.drafts] : [n.briefs, n.calls, n.reports, n.drafts];
  const total = mine.reduce((t, c) => t + (c ? c.n : 0), 0);
  const scope = allBrands ? `across ${S.accounts.length} brand${S.accounts.length === 1 ? '' : 's'}` : `for ${esc((S.accounts.find(a => a.act_id === S.act) || {}).name || 'this brand')}`;
  const say = loading ? `Counting what is waiting ${scope}&hellip;`

  </div>`;
}

/** The four counts, for the brands on screen. Never throws: a failed call is a null. */
async function ovTodayLoad(all) {
  const nameOf = Object.fromEntries(all.map(a => [a.act_id, a.name]));
  const client = Object.fromEntries(all.map(a => [a.act_id, !!a.brief_channel]));   // no client channel = handled automatically
  const q = S.act === 'all' ? 'all' : encodeURIComponent(S.act);
  const [bf, rp, ts, br] = await Promise.allSettled([
    api('/api/briefs?act=' + q), api('/api/reports?act=' + q),
    api('/api/brand/tests-overview'), api('/api/brand/overview'),
  ]);
  const ok = r => r.status === 'fulfilled' && r.value ? r.value : null;
  const tally = () => ({ n: 0, who: [] });
  const add = (t, act, k) => { if (k > 0) { t.n += k; if (nameOf[act] && !t.who.includes(nameOf[act])) t.who.push(nameOf[act]); } };

  /* Briefs: rows arrive newest first, so the first row seen per brand is its
     latest brief. Older than a week is history, not something to send today. */
  let briefs = null;
  if (ok(bf)) {
    briefs = tally();
    const seen = new Set(), since = ymd(new Date(Date.now() - 7 * 86400000));
    for (const row of (ok(bf).rows || [])) {
      if (seen.has(row.act_id)) continue;
      seen.add(row.act_id);
      if (client[row.act_id] && row.status === 'draft' && String(row.date || '') >= since) add(briefs, row.act_id, 1);
    }
  }
  /* Reports: the newest weekly and the newest monthly per brand, exactly as the
     all-brands Reports view groups "Waiting on you". */
  let reports = null;
  if (ok(rp)) {
    reports = tally();
    const seen = new Set();
    for (const row of (ok(rp).rows || [])) {
      const k = row.act_id + '|' + row.period;
      if (seen.has(k)) continue;
      seen.add(k);
      if (client[row.act_id] && row.status === 'draft') add(reports, row.act_id, 1);
    }
  }
  let calls = null, making = null;
  if (ok(ts)) {
    calls = tally(); making = tally();
    for (const b of (ok(ts).brands || [])) {
      if (!(b.act_id in nameOf)) continue;
      add(calls, b.act_id, b.call || 0); add(making, b.act_id, b.making || 0);
    }
  }
  let drafts = null;
  if (ok(br)) {
    drafts = tally();
    for (const b of (ok(br).brands || [])) {
      if (!(b.act_id in nameOf)) continue;
      add(drafts, b.act_id, Math.max(0, (b.personas || 0) - (b.personas_ok || 0)));
    }
  }
  return { briefs, reports, calls, making, drafts };
}

/* ---------- Home (the hub, 2026-10-07) ----------
   Cole: "I want to see a dashboard in the overview, just like Triple Whale, if not better."
   Top to bottom, for one brand or all brands: the read (three lines, leaks, focus), what
   is waiting today, the money row against the compare period, pace against the plan,
   the channels (spend per platform, Triple Whale revenue per platform), the daily chart
   with the compare period ghosted, and in the agency view one row per brand. Every
   number here already lived in /api/overview; the compare period, the series and the
   channel split were added to that payload the same day. */
const CMP_LABEL = { prev: 'the period before', yoy: 'the same dates last year', none: '' };
const CH_ORDER = ['meta', 'google', 'tiktok', 'pinterest', 'email', 'rest'];
const CH_COLOR = { meta: '#14608C', google: '#C08A2E', tiktok: '#2B3A47', pinterest: '#B5484D', email: '#1C7A46', rest: '#C4D2DB' };
const OVR = { key: null, data: null, at: 0 };

/** +9% / -4% against the compare period, coloured by whether that is good. `lower` = a
 *  lower number is the good direction (spend, CPA). Null when either side is missing. */
function deltaPill(cur, prev, lower) {
  if (cur == null || prev == null || !prev || S.cmp === 'none') return '';
  const d = cur / prev - 1;
  if (!isFinite(d)) return '';
  const p = Math.round(d * 100);
  const tone = Math.abs(d) < 0.015 ? 'flat' : (d > 0) === !lower ? 'up' : 'down';
  return `<span class="hm-d ${tone}" title="Against ${esc(CMP_LABEL[S.cmp] || 'the compare period')}">${p > 0 ? '+' : ''}${p}%</span>`;
}

/** The read card: a skeleton until the Strategist answers, then three lines, the
 *  leaks and the focus. `r` = the /api/read answer, or null while loading, or {error}. */
function ovReadHtml(r) {
  const ask = `<button class="btn hm-ask" type="button" id="ovAsk">Ask about this</button>`;
  if (!r) return `<div class="card hm-read" id="ovRead"><div class="hm-read-h"><b>The read</b><span class="hint">Reading the numbers on this screen&hellip;</span></div>
    <div class="hm-sk"><span></span><span></span><span style="width:62%"></span></div></div>`;
  if (r.error) return `<div class="card hm-read quiet" id="ovRead"><div class="hm-read-h"><b>The read</b><span class="hint">${esc(r.error)}</span>${ask}</div></div>`;
  const leaks = (r.leaks || []).length ? `<div class="hm-leaks">${r.leaks.map(l => `<div class="hm-leak"><span class="hm-leak-w">${esc(l.where || '')}</span><span>${esc(l.what)}</span></div>`).join('')}</div>` : '';
  return `<div class="card hm-read" id="ovRead">
    <div class="hm-read-h"><b>The read</b><span class="hint">${r.cached ? 'From the last hour.' : 'Just now.'} Only the numbers on this screen.</span>${ask}</div>
    <div class="hm-lines">${(r.lines || []).map(l => `<p>${esc(l)}</p>`).join('')}</div>
    ${leaks}
    ${r.focus ? `<div class="hm-focus"><span>Focus today</span>${esc(r.focus)}</div>` : ''}
  </div>`;
}
const OVR_ALL = {};

/** Two lines over the window plus the compare period ghosted. Same geometry as
 *  salesSpendSVG so wireSalesSpend's crosshair works unchanged. */
function homeChartSVG(rows, prevRows, cur, id = 'hmSvg') {
  const w = 940, h = 240, pl = 58, pr = 14, pt = 12, pb = 26;
  const n = rows.length;
  if (!n) return '<p class="hint">No data in this window.</p>';
  const vals = rows.map(r => Math.max(r.sales ?? 0, r.spend ?? 0)).concat((prevRows || []).map(r => r.sales ?? 0));
  const maxV = Math.max(...vals) * 1.08 || 1;
  const x = i => pl + i / Math.max(1, n - 1) * (w - pl - pr);
  const y = v => pt + (1 - v / maxV) * (h - pt - pb);
  const line = (rs, get) => rs.map((r, i) => { const v = get(r); return v == null || i >= n ? null : `${x(i).toFixed(1)},${y(v).toFixed(1)}`; }).filter(Boolean).join(' ');
  const idx = n <= 10 ? rows.map((_, i) => i) : [...new Set(Array.from({ length: 6 }, (_, k) => Math.round(k * (n - 1) / 5)))];
  const ticks = idx.map(i => `<text x="${x(i).toFixed(1)}" y="${h - 8}" font-size="10" text-anchor="middle" fill="#647684">${rows[i].date.slice(5)}</text>`).join('');
  const area = `${x(0).toFixed(1)},${y(0).toFixed(1)} ${line(rows, r => r.sales)} ${x(n - 1).toFixed(1)},${y(0).toFixed(1)}`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;touch-action:none" id="${id}">
    <defs><linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14608C" stop-opacity=".16"/><stop offset="1" stop-color="#14608C" stop-opacity="0"/></linearGradient></defs>
    ${ticks}
    <polygon points="${area}" fill="url(#${id}g)"/>
    <line class="fx-guide" x1="0" x2="0" y1="${pt}" y2="${h - pb + 4}" stroke="#14608C" stroke-width="1" opacity="0" pointer-events="none"/>
    ${prevRows && prevRows.length ? `<polyline points="${line(prevRows, r => r.sales)}" fill="none" stroke="#8195A2" stroke-width="1.4" stroke-dasharray="4 4"/>` : ''}
    <polyline points="${line(rows, r => r.sales)}" fill="none" stroke="#14608C" stroke-width="2.2" stroke-linejoin="round"/>
    <polyline points="${line(rows, r => r.spend)}" fill="none" stroke="#C08A2E" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="${x(n - 1).toFixed(1)}" cy="${y(rows[n - 1].sales ?? 0).toFixed(1)}" r="3.5" fill="#14608C"/>
    <text x="2" y="${pt + 9}" font-size="10" fill="#647684">${fmtK(maxV, cur)}</text>
    <text x="2" y="${h - pb}" font-size="10" fill="#647684">${fmtK(0, cur)}</text>
  </svg>`;
}

/** Add up the channel split across the brands on screen. */
function channelsAgg(all) {
  const agg = {};
  for (const a of all) for (const c of (a.channels || [])) {
    const g = agg[c.id] ||= { id: c.id, label: c.label, spend: 0, hasSpend: false, revenue: 0, hasRev: false, orders: 0, campaigns: 0, flows: 0 };
    if (c.spend != null) { g.spend += c.spend; g.hasSpend = true; }
    if (c.revenue != null) { g.revenue += c.revenue; g.hasRev = true; }
    if (c.orders != null) g.orders += c.orders;
    if (c.campaigns != null) g.campaigns += c.campaigns;
    if (c.flows != null) g.flows += c.flows;
  }
  return CH_ORDER.map(id => agg[id]).filter(Boolean).map(g => ({ ...g, spend: g.hasSpend ? g.spend : null, revenue: g.hasRev ? g.revenue : null,
    roas: g.hasRev && g.spend > 0 ? g.revenue / g.spend : null, cpa: g.orders > 0 && g.spend > 0 ? g.spend / g.orders : null }));
}
function channelsCard(all, sales, cur) {
  const ch = channelsAgg(all);
  if (!ch.length) return '';
  const credited = ch.reduce((t, c) => t + (c.revenue || 0), 0) || 1;
  const bar = ch.filter(c => c.revenue > 0).map(c => `<i style="width:${(c.revenue / credited * 100).toFixed(1)}%;background:${CH_COLOR[c.id] || '#999'}" title="${esc(c.label)} ${fmtPct(c.revenue / credited)}"></i>`).join('');
  const rows = ch.map(c => `<tr>
      <td><span class="hm-sw" style="background:${CH_COLOR[c.id] || '#999'}"></span>${esc(c.label)}${c.id === 'email' && (c.campaigns || c.flows) ? `<div class="tiny">${fmtK(c.campaigns, cur)} campaigns &middot; ${fmtK(c.flows, cur)} flows</div>` : ''}${c.id === 'rest' ? '<div class="tiny">organic, direct, referral, unattributed</div>' : ''}</td>
      <td class="num">${c.spend == null ? '<span class="tiny">no spend</span>' : fmtK(c.spend, cur)}</td>
      <td class="num">${c.revenue == null ? '&mdash;' : fmtK(c.revenue, cur)}</td>

  return `<div class="card hm-ch">

  </div>`;
}

/** Month to date against the plan, as one bar: where the month is, where it should be by now. */
function paceCard(mtd, cur, planned, allN) {
  if (!mtd || !mtd.pSales) return '';

async function renderOverview() {
  const all = S.act === 'all' ? S.accounts.slice() : S.accounts.filter(a => a.act_id === S.act);
  const one = S.act !== 'all' ? all[0] : null;
  const scope = one ? one.name : `all ${all.length} brands`;

  /* The book, added up - across ONE currency only. Summing money across currencies is the
     oldest trap in this codebase; where the book is mixed the roll-up says so. */
  const curs = [...new Set(all.map(a => a.currency))];
  const oneCur = curs.length === 1 ? curs[0] : null;
  const sum = (get, src = 'window') => { let t = 0, any = false; for (const a of all) { const v = get(a[src] || {}); if (v != null) { t += v; any = true; } } return any ? t : null; };
  const tots = src => {
    const t = { sales: sum(w => w.sales, src), spend: sum(w => w.spend, src), newRev: sum(w => w.new_rev, src), orders: sum(w => w.orders, src),
      newOrders: sum(w => w.new_orders, src),
      cm: (() => { let x = 0, any = false; for (const a of all) { const w = a[src]; if (w && cmTrusted(a.cost_health) && w.cm != null) { x += w.cm; any = true; } } return any ? x : null; })() };
    t.cac = t.spend != null && t.newOrders ? t.spend / t.newOrders : null;
    t.mer = t.sales != null && t.spend ? t.sales / t.spend : null;
    t.amer = t.newRev != null && t.spend ? t.newRev / t.spend : null;
    t.aov = t.orders ? t.sales / t.orders : null;
    t.newShare = t.newRev != null && t.sales ? t.newRev / t.sales : null;
    t.cmPct = t.cm != null && t.sales ? t.cm / t.sales : null;
    return t;
  };
  const tot = tots('window');
  const hasPrev = S.cmp !== 'none' && all.some(a => a.prev);
  const prev = hasPrev ? tots('prev') : {};
  const untrusted = all.filter(a => !cmTrusted(a.cost_health));
  const liveAt = all.map(a => a.live_as_of).filter(Boolean).sort().pop() || null;
  const cmpWin = all.find(a => a.prev_window)?.prev_window;
  const cmpText = hasPrev && cmpWin ? `${CMP_LABEL[S.cmp]} (${prettyDate(cmpWin.from)} &ndash; ${prettyDate(cmpWin.to)})` : '';

  /* Month to date against the plan, labelled MTD. Only brands with a plan are summed. */
  const withPlan = all.filter(a => a.plan?.sales != null && a.mtd?.sales != null);
  const psum = get => withPlan.reduce((t, a) => t + (get(a) ?? 0), 0);
  const mtd = withPlan.length ? { sales: psum(a => a.mtd.sales), pSales: psum(a => a.plan.sales), spend: psum(a => a.mtd.spend), pSpend: psum(a => a.plan.spend) } : null;
  if (mtd) { mtd.mer = mtd.spend ? mtd.sales / mtd.spend : null; mtd.pMer = mtd.pSpend ? mtd.pSales / mtd.pSpend : null; }

  const judged = all.map(a => ({ a, t: triage(a) }));

  /* ---- the money row ---- */
  const tile = (l, v, d, pill, cls) => `<div class="ru"><div class="ru-l">${l}</div><div class="ru-v${cls ? ' ' + cls : ''}">${v}${pill || ''}</div>${d ? `<div class="ru-d">${d}</div>` : ''}</div>`;
  const money = () => {
    if (!oneCur) return `<div class="rollup"><div class="ru" style="grid-column:1/-1"><div class="ru-l">${all.length} brands</div><div class="ru-v" style="font-size:19px">${curs.join(' &middot; ')}</div><div class="ru-d">Your brands report in different currencies, so there is no combined total. The table below is per brand.</div></div></div>`;
    return `<div class="rollup hm-row">
      ${tile('Revenue', fmtK(tot.sales, oneCur), `${esc(rangeLabel())}${liveAt ? ` &middot; live as of ${fmtCentralTime(liveAt)}` : ''}`, deltaPill(tot.sales, prev.sales))}
      ${tile('Orders', fmtInt(tot.orders), tot.aov != null ? `AOV ${fmtMoney(tot.aov, oneCur)} ${deltaPill(tot.aov, prev.aov)}` : '', deltaPill(tot.orders, prev.orders))}

  const rows = merge('series'), prevRows = hasPrev ? merge('prev_series') : [];
  const chart = oneCur && rows.length > 1 ? `<div class="card hm-chart">
      <div class="hm-ch-h"><h3>Day by day</h3><span class="hint"><span class="hm-lg" style="color:#14608C">Revenue</span><span class="hm-lg" style="color:#C08A2E">Ad spend</span>${prevRows.length ? `<span class="hm-lg dash">${esc(CMP_LABEL[S.cmp])}</span>` : ''}&nbsp; Hover or tap a day.</span></div>

  /* ---- the ranked table (agency view) ---- */

  const spark = a => {
    const pts = (a.spark || []).filter(v => v != null);

    const hi = Math.max(...pts), lo = Math.min(...pts), rng = hi - lo || 1;
    const d = pts.map((v, i) => `${(i / (pts.length - 1) * 200).toFixed(1)},${(26 - (v - lo) / rng * 22).toFixed(1)}`).join(' ');
    const third = Math.ceil(pts.length / 3);
    const rising = pts.slice(-third).reduce((s2, v) => s2 + v, 0) / third >= pts.slice(0, third).reduce((s2, v) => s2 + v, 0) / third;
    return `<svg class="sc-spark" viewBox="0 0 200 28" preserveAspectRatio="none" role="img" aria-label="Daily revenue over the window, ${rising ? 'rising' : 'falling'}"><polyline points="${d}" fill="none" stroke="${rising ? 'var(--good)' : 'var(--bad)'}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;

  const costPill = h => { const v = h?.verdict; if (!v || v === 'good') return '<span class="pill good">Good</span>'; if (v === 'override') return '<span class="pill warn">Override</span>'; if (v === 'noisy') return '<span class="pill warn">Noisy</span>'; return '<span class="pill bad">Fix</span>'; };

  };
  const seg = `<div class="seg sm" id="ovSort" role="group" aria-label="Sort brands by">${OV_SORT.map(([k, l]) => `<button data-s="${k}" class="${k === sortKey ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  const needs = judged.filter(j => j.t.g === 'bd').length, watch = judged.filter(j => j.t.g === 'wn').length;
  const table = !one && all.length ? `<div class="card key" style="padding-bottom:4px">

        <tbody>${ranked.map(row).join('')}</tbody>

    ${ovTodayHtml(OVD.key === S.act ? OVD.n : null)}

      <div class="fn-body"><b>Revenue</b> is Shopify Total Sales minus sales tax: gross sales, less discounts and returns, plus shipping charged to customers, less tax. Every channel counts: paid, organic, email and direct. <b>Orders</b> and <b>AOV</b> come from Triple Whale's order count over the same revenue. <b>Ad spend</b> is every platform, blended.<br><br>
      <b>MER</b> is revenue divided by all ad spend; <b>aMER</b> is new-customer revenue over that same spend. <b>Contribution margin</b> is revenue less every variable cost: product, fulfilment, handling, payment fees and ad spend. <b>Revenue per channel</b> is Triple Whale's last platform click, so Meta and Google can both claim the same order; that is why the channels do not add up to revenue and why MER exists. <b>Pace</b> compares month to date with this month's agreed plan, pro-rated to the days elapsed; more than 30% behind needs a decision, 8 to 30% behind is watched.</div></details>`;

  const open = id => { S.act = id; localStorage.setItem(LS.act, S.act); const cp = $('#clientPick'); if (cp) cp.value = S.act; show('overview'); };
  $('#main').querySelectorAll('tr[data-id]').forEach(c => {

  $('#main').querySelectorAll('#ovSort button[data-s]').forEach(b => b.onclick = () => { localStorage.setItem('pf_ov_sort', b.dataset.s); inPlace(async () => renderOverview()); });

    const i = rows.indexOf(r), p = prevRows[i];

  wireOvAsk(scope);

    const facts = {
      currency: oneCur, brands_on_screen: all.length,
      totals: { revenue: tot.sales, orders: tot.orders, aov: tot.aov, ad_spend: tot.spend, mer: tot.mer, amer: tot.amer, new_customer_share: tot.newShare, contribution_margin: tot.cm },

      pace: mtd && mtd.pSales ? { month_to_date_revenue: mtd.sales, planned_by_now: mtd.pSales, month_to_date_spend: mtd.spend, planned_spend_by_now: mtd.pSpend, brands_with_a_plan: withPlan.length } : null,
      channels: ch.map(c => ({ channel: c.label, spend: c.spend, revenue_tw_last_click: c.revenue, roas: c.roas, cpa: c.cpa })),
      brands: one ? undefined : judged.map(({ a, t }) => ({ name: a.name, revenue: a.window?.sales, ad_spend: a.window?.spend, mer: a.window?.mer, contribution_margin: cmTrusted(a.cost_health) ? a.window?.cm : null, mtd_vs_plan: t.off == null ? null : Math.round(t.off * 100) + '%', state: t.state, revenue_vs_compare: a.prev?.sales ? Math.round((a.window.sales / a.prev.sales - 1) * 100) + '%' : null })),
      cost_data_excluded: untrusted.map(a => a.name),

    ovReadLoad(facts, scope).then(r => {
      if (run !== RUN || S.tab !== 'overview' || S.act !== key) return;

  }

  /* Today's counts, AFTER the paint and never awaited (see ovTodayLoad). */
  if (all.length && (OVD.key !== S.act || Date.now() - OVD.at > 60000)) {
    const run = RUN, key = S.act;
    ovTodayLoad(all).then(n => {
      OVD.key = key; OVD.at = Date.now(); OVD.n = n;
      if (run !== RUN || S.tab !== 'overview' || S.act !== key) return;
      const el = document.getElementById('ovToday');
      if (el) el.outerHTML = ovTodayHtml(n);
    }).catch(() => {});
  }
}

  const sum = get => { let t = 0, any = false; for (const a of all) { const v = get(em(a)); if (v != null) { t += v; any = true; } } return any ? t : null; };

      ${tile('Campaigns', camp == null ? '&mdash;' : fmtK(camp, oneCur), rev && camp != null ? `${fmtPct(camp / rev)} of email revenue` : 'one-off sends')}
      ${tile('Flows', flows == null ? '&mdash;' : fmtK(flows, oneCur), rev && flows != null ? `${fmtPct(flows / rev)} of email revenue` : 'welcome, abandoned cart, post purchase, winback')}
    </div>` : '';
  const brandRows = !one ? `<div class="card key"><div class="ovt-hd"><h3>Each brand</h3><span class="hint">Email and SMS revenue as Triple Whale carries it from Klaviyo. Click a row to open the brand.</span></div>

    ${all.map(a => { const e = em(a); return `<tr data-id="${a.act_id}" tabindex="0" role="button"><td><div class="bn">${esc(a.name)}</div><div class="tiny">${e.rev == null ? 'no Klaviyo revenue in this window' : ''}</div></td>
      <td class="num">${e.rev == null ? '&mdash;' : fmtK(e.rev, a.currency)}${deltaPill(e.rev, e.prev)}</td><td class="num">${e.rev != null && e.sales ? fmtPct(e.rev / e.sales) : '&mdash;'}</td>
      <td class="num">${e.camp == null ? '&mdash;' : fmtK(e.camp, a.currency)}</td><td class="num">${e.flows == null ? '&mdash;' : fmtK(e.flows, a.currency)}</td></tr>`; }).join('')}

    <details class="footnote"><summary>How these numbers are defined</summary><div class="fn-body"><b>Email and SMS revenue</b> is Klaviyo's placed-order revenue as Triple Whale carries it (campaigns plus flows), which is Klaviyo's own attribution, not Triple Whale's pixel. <b>Share</b> divides it by store revenue (Shopify Total Sales minus tax). Campaign results in the table below are Klaviyo's over the last 90 days.</div></details>`);

    </div></div>
    <div class="card key"><div class="ovt-hd"><h3>Recent campaigns</h3><span class="hint">Klaviyo's own results, last 90 days. Conversion value is Klaviyo's placed-order attribution.</span></div>

/* ---------- Store > Sales (the hub, 2026-10-07) ----------

    const sales = sum(w => w.sales), orders = sum(w => w.orders), newO = sum(w => w.new_orders), newRev = sum(w => w.new_rev), retRev = sum(w => w.ret_rev), email = sum(w => w.email_rev);

    const merge = key => { const m = new Map(); for (const a of all) for (const q of (a[key] || [])) { const r = m.get(q.date) || { date: q.date, sales: 0, spend: 0, orders: 0 }; r.sales += q.sales || 0; r.spend += q.spend || 0; r.orders += q.orders || 0; m.set(q.date, r); } return [...m.values()].sort((x, y) => x.date < y.date ? -1 : 1); };

    const id = 'ds' + Math.random().toString(36).slice(2, 7);
    setTimeout(() => LX.wireDual(id, rows, (r, i) => `<b>${U.day(r.date)}</b> · revenue ${fmtK(r.sales, cur)} · spend ${fmtK(r.spend, cur)}${r.spend ? ` · MER ${fmtX(r.sales / r.spend)}` : ''}${prev[i] ? `<br><span class="faint">${esc(CMP_LABEL[spec.compare] || 'before')}: ${fmtK(prev[i].sales, cur)}</span>` : ''}`), 0);
    return `<section class="v2card"><div class="v2h">${h || '<h3>Day by day</h3>'}</div>${LX.dual(id, rows, cur, { prev, prevLabel: CMP_LABEL[spec.compare] || 'Compare period' })}</section>`;
  }
  if (b.type === 'email') {
    if (!cur) return '';
    const tiles = [LX.tile({ compact: true, label: 'Email and SMS revenue', value: fmtK(t.email_rev, cur), delta: chipOf('email_rev') }),
      LX.tile({ compact: true, label: 'Share of store revenue', value: t.email_share == null ? '–' : fmtPct(t.email_share) }),
      LX.tile({ compact: true, label: 'Store revenue', value: fmtK(t.sales, cur), delta: chipOf('sales') })].join('');

  }

  /* A Strategist answer pinned from the chat (askextra.js): frozen as of its date, with Refresh. */
  if (b.type === 'chart') return window.AskX ? AskX.chartBlock(b) : '';
  return '';
}
/* Build or edit a dashboard by hand (Locus v2): name, scope, range, compare, and the blocks
