  const list = $('#brandList');
  const drawBrands = () => {
    /* PRESERVE WHICH ROWS ARE OPEN. Saving a cell calls drawBrands(), which
       rebuilds every row from scratch - and a fresh <details> has no `open`, so
       the row the user was working in slammed shut. It read as "the dropdown
       closed and my change was not saved", when in fact it HAD saved and the
       row had simply been rebuilt underneath them. Cole hit this on the Slack
       channel pickers. Same family as the stale-array bug: a redraw that
       forgets the state the user could see. */
    const wasOpen = new Set([...list.querySelectorAll('.brow[open]')].map(el => el.dataset.act));
    const rows = brands();
    list.innerHTML = `<div class="set-add">
        <div class="set-add-o"><button class="btn primary" id="ncOpen">+ New client</button>
          <p class="tiny">A brand-new client. Sets them up in Asana, Drive, Slack and Stripe and makes their onboarding link.</p></div>
        <div class="set-add-o"><button class="btn" id="brAdd">+ Add a brand</button>
          <p class="tiny">A client whose Meta ad account Locus can already see. <a href="#" id="brWhy">Why don’t I see all my ad accounts?</a></p></div>
        <span class="tiny" id="brMsg"></span></div>
      <div id="brAccess"></div>
      <p class="tiny set-count">${rows.length} brand${rows.length === 1 ? '' : 's'}${rows.length ? ' · click a brand to open its settings' : ''}</p>
      ${rows.map(brandRow).join('') || '<div class="card"><span class="hint">No brands yet - press <b>+ Add a brand</b>.</span></div>'}
      ${AGENCY && conns?.unmatched?.length ? `<div class="notice warn" style="margin-top:12px">⚠️<div><b>${conns.unmatched.length} connected Shopify ${conns.unmatched.length === 1 ? 'store is' : 'stores are'} not matched to a brand.</b>
        The data is being held but nothing reports on it until you point it at one.
        <div style="margin-top:8px">${conns.unmatched.map(u => `<div class="row" style="margin:4px 0;gap:8px"><code style="font-size:12px">${esc(u.shop)}</code>
          <select data-map="${esc(u.shop)}" style="max-width:200px"><option value=""> - pick a brand - </option>${rows.map(b => `<option value="${esc(b.act_id)}">${esc(b.name)}</option>`).join('')}</select>
          <span class="tiny" data-mapmsg="${esc(u.shop)}"></span></div>`).join('')}</div></div></div>` : ''}`;
    for (const el of list.querySelectorAll('.brow')) if (wasOpen.has(el.dataset.act)) el.open = true;

    /* Settings is a form, not a dashboard, so its brand rows stay editable
       rows rather than becoming state cards. What it was missing is the thing
       a form cannot show you: whether the SET of brands is actually configured.
       Counted from the same array the rows are drawn from, so the bar and the
       rows can never disagree. */
    const ru = $('#setRollup');
    if (ru) {
      const briefs = rows.filter(b => b.brief_enabled).length;
      const noBrief = rows.filter(b => !b.brief_channel).length;
      const noShop = rows.filter(b => !metaOf(b.act_id).tw_shop && !b.tw_shop).length;
      /* Is everything set up? One sentence from the same check the row summaries use. */
      const gaps = rows.filter(b => summary(b).includes('brow-warn'));
      ru.innerHTML = `${LX.say(!rows.length ? 'No brands yet. Press + New client or + Add a brand below.'
          : gaps.length ? `<b class="warn">${gaps.length} of ${rows.length} brand${rows.length === 1 ? '' : 's'} need${gaps.length === 1 ? 's' : ''} something set up</b>: ${gaps.map(b => esc(b.name)).join(', ')}. Open the row; the line on its right says what is missing.`
          : `<b class="good">Every brand is set up.</b> ${briefs} of ${rows.length} send a daily brief${noBrief ? `, ${noBrief} ${noBrief === 1 ? 'is' : 'are'} internal only` : ''}.`)}
        <div class="v2tiles" style="margin-top:14px">
        ${LX.tile({ compact: true, label: 'Brands', value: String(rows.length), sub: one ? 'filtered to this one brand' : 'reporting through Locus' })}
        ${LX.tile({ compact: true, label: 'Daily brief on', value: String(briefs), sub: briefs === rows.length ? 'every brand posts each morning' : `${rows.length - briefs} not sending` })}
        ${LX.tile({ compact: true, label: 'Internal only', value: String(noBrief), sub: noBrief ? 'no client channel, so briefs and reports are handled automatically' : 'every brand has a client channel' })}
        ${LX.tile({ compact: true, label: 'No Triple Whale shop', value: `<span class="${noShop ? 'bad' : ''}">${noShop}</span>`, sub: noShop ? 'nothing blended works without it' : 'every brand is connected' })}
        </div>`;
    }
    wire();
  };

  /* One delegated listener on the LIST, which every redraw replaces - never on
     #main, which survives and would stack a copy per visit. */
  function wire() {
    const acctOf = el => S.accounts.find(x => x.act_id === el.closest('[data-act]')?.dataset.act);
    const msg = (el, sel, t) => { const m = el.closest('.brow')?.querySelector(sel); if (m) m.textContent = t; };
    const flash = el => { const t = el.closest('.unit-in') || el; t.classList.add('flash-saved'); setTimeout(() => t.classList.remove('flash-saved'), 1300); };
    const saveClient = (a, body) => api('/api/client-settings', { method: 'PUT', body: JSON.stringify({ act: a.act_id, ...body }) });
    const saveMeta = (a, body) => mApi(`/api/accounts/${a.act_id}`, { method: 'PUT', body: JSON.stringify(body) });

    if (AGENCY) list.querySelectorAll('.brow > summary').forEach(sm => sm.onclick = e => {
      e.preventDefault(); const act = sm.parentElement.dataset.act;
      S.act = act; localStorage.setItem(LS.act, act); const cp = $('#clientPick'); if (cp) cp.value = act; SETMODE.set('brand'); show('settings');
    });
    list.querySelectorAll('.brow').forEach(row => {
      const a = S.accounts.find(x => x.act_id === row.dataset.act); if (!a) return;
      const gBox = row.querySelector('.goals');
      if (gBox) {
        if (row.open) loadGoals(gBox, a);
        row.addEventListener('toggle', () => { if (row.open && !gBox.dataset.loaded) loadGoals(gBox, a); });
        if (window.__openGoals === a.act_id) { window.__openGoals = null; setTimeout(() => gBox.scrollIntoView({ block: 'center' }), 60); }
      }
      const m = metaOf(a.act_id);
      const q = k => row.querySelector(`[data-k="${k}"]`);

      q('name').onchange = async e => {
        const v = e.target.value.trim(); if (!v) return;
        try { await saveMeta(a, { name: v }); a.name = v; m.name = v; flash(e.target); row.querySelector('.brow-name').textContent = v; await refreshAccounts(); }
        catch (err) { noteModal('Could not save', `<p>${esc(err.message)}</p>`); }
      };
      if (q('tw_shop')) q('tw_shop').onchange = async e => {
        const v = e.target.value.trim().toLowerCase().replace(/^https?:\/\//, '').replace(/\/.*$/, '');
        e.target.value = v;
        try { await saveMeta(a, { tw_shop: v }); m.tw_shop = v; flash(e.target); }
        catch (err) { noteModal('Could not save', `<p>${esc(err.message)}</p>`); }
      };
      ['slack_channel', 'brief_channel'].forEach(k => { const el = q(k); if (el) el.onchange = async () => {
        try { await saveClient(a, { [k]: el.value || null }); a[k] = el.value || null; flash(el); drawBrands(); await refreshAccounts(); }
        catch (err) { noteModal('Could not save', `<p>${esc(err.message)}</p>`); }
      }; });
      q('margin').onchange = async e => {
        const raw = e.target.value.replace(/[^0-9.]/g, '');
        const pct = raw === '' ? null : +raw / 100;
        if (pct != null && !(pct > 0 && pct < 1)) return noteModal('That margin looks wrong', '<p>Enter a margin between <b>1</b> and <b>99</b> percent, or leave it blank to use the real per-product costs.</p>');
        try { const r = await api('/api/margin', { method: 'PUT', body: JSON.stringify({ act: a.act_id, margin_pct: pct }) });
          a.margin_pct = pct; if (r.cost_health) a.cost_health = r.cost_health; flash(e.target); drawBrands(); await refreshAccounts(); }
        catch (err) { noteModal('Could not save', `<p>${esc(err.message)}</p>`); }
      };
      row.querySelectorAll('.tgl').forEach(g => { if (!g.querySelector('.toggle[data-k]')) return; g.onclick = async () => {
        const tg = g.querySelector('.toggle'), k = tg.dataset.k, on = !tg.classList.contains('on');
        if (k === 'review_first' && !on && !(await confirmModal('Let this brand send itself?',
          `Every daily brief and every weekly and monthly report for ${a.name} will post straight to the client with nobody reading it first.`, 'Send without review'))) return;
        if (k === 'brief_enabled' && on) {
          if (!(a.brief_channel || a.slack_channel)) return noteModal('Nowhere to post', `<p>Pick a Slack channel for ${esc(a.name)} first.</p>`);
          if (!a.goals) return noteModal('No plan yet', `<p>Set ${esc(a.name)}’s monthly number on the <b>Plan</b> tab first. The brief compares every day to a plan, so it needs one.</p>`);
        }
        try { await saveClient(a, { [k]: on }); a[k] = on; drawBrands(); await refreshAccounts(); }
        catch (err) { noteModal('Could not save', `<p>${esc(err.message)}</p>`); }
      }; });
      /* Monday test calls moved here from Goals (2026-10-09): one switch, same rules doc. */
      const mon = row.querySelector('[data-mon]');
      if (mon) {
        const lbl = row.querySelector('[data-monlbl]');
        api(`/api/brand/rules?act=${encodeURIComponent(a.act_id)}`).then(g => { mon.classList.toggle('on', !!g.rules.monday_post); lbl.textContent = g.rules.monday_post ? 'on' : 'off'; mon.dataset.ready = '1'; }).catch(() => { lbl.textContent = 'could not load'; });
        mon.parentElement.onclick = async () => {
          if (!mon.dataset.ready) return;
          const on = !mon.classList.contains('on'); lbl.textContent = 'saving…';
          try { const g = await api(`/api/brand/rules?act=${encodeURIComponent(a.act_id)}`); await api('/api/brand/rules', { method: 'PUT', body: JSON.stringify({ act: a.act_id, rules: { ...g.rules, monday_post: on ? 1 : 0 } }) });
            mon.classList.toggle('on', on); lbl.textContent = on ? 'on' : 'off'; }
          catch (err) { lbl.textContent = err.message; }
        };
      }
      row.querySelectorAll('[data-gopage]').forEach(b => b.onclick = () => { show(b.dataset.gopage); window.scrollTo(0, 0); });
      if (q('sync')) q('sync').onclick = async e => {
        e.target.disabled = true; msg(e.target, '[data-k="syncmsg"]', 'syncing…');
        try { const r = await mApi(`/api/sync?act=${a.act_id}`, { method: 'POST' }); msg(e.target, '[data-k="syncmsg"]', r.result?.error || 'done ✓'); }
        catch (err) { msg(e.target, '[data-k="syncmsg"]', err.message); }
        e.target.disabled = false;
      };
      const cp = q('copy');
      if (cp) cp.onclick = async e => {
        try { await navigator.clipboard.writeText(e.target.dataset.url); msg(e.target, '[data-k="shopmsg"]', 'copied ✓'); }
        catch { noteModal('Copy the install link', `<p>Send this to the client:</p><p><code style="font-size:12px;word-break:break-all">${esc(e.target.dataset.url)}</code></p>`); }
      };
      const co = q('cohorts');
      if (co) co.onclick = async e => {
        e.target.disabled = true; msg(e.target, '[data-k="shopmsg"]', 'pulling from Shopify…');
        try { const r = await api(`/api/cohort-sync?act=${encodeURIComponent(a.act_id)}`, { method: 'POST' });
          const x = (r.results && r.results[0]) || {};
          msg(e.target, '[data-k="shopmsg"]', x.error || x.skipped || `✓ ${x.months} cohort months`); }
        catch (err) { msg(e.target, '[data-k="shopmsg"]', err.message); }
        e.target.disabled = false;
      };
      q('attr').onclick = async e => {
        e.target.disabled = true; msg(e.target, '[data-k="attrmsg"]', 'pulling journeys from Triple Whale…');
        try {
          const r = await api(`/api/tw-attr-sync?act=${a.act_id}&days=120`, { method: 'POST' });
          const x = r.results?.[0] || {};
          msg(e.target, '[data-k="attrmsg"]', x.error || x.skipped || `✓ ${x.orders} orders → ${x.rows} rows, ${x.from} → ${x.to}`);
        } catch (err) { msg(e.target, '[data-k="attrmsg"]', err.message); }
        e.target.disabled = false;
      };
      q('backfill').onclick = async e => {
        e.target.disabled = true; msg(e.target, '[data-k="bfmsg"]', 'pulling 430 days…');
        try { const r = await api(`/api/tw-sync?act=${a.act_id}&days=430`, { method: 'POST' });
          const x = r.results?.[0] || {};
          msg(e.target, '[data-k="bfmsg"]', x.ok ? `✓ ${x.metrics} metrics, ${x.from} → ${x.to}` : (x.error || x.skipped || 'done'));
          if (x.ok) await refreshAccounts(); }
        catch (err) { msg(e.target, '[data-k="bfmsg"]', err.message); }
        e.target.disabled = false;
      };
      q('off').onclick = async () => {
        if (!(await confirmModal(`Archive ${a.name}?`,
          'It disappears from every page and stops syncing. Nothing is deleted, and you can bring it back from Agency settings, Clients, + Add a brand.', 'Archive'))) return;
        try { await saveMeta(a, { active: false }); const mm = metaOf(a.act_id); if (mm) mm.active = false;
          await refreshAccounts(); await inPlace(async () => { await boot(); show('settings'); }); }
        catch (err) { noteModal('Could not save', `<p>${esc(err.message)}</p>`); }
      };
    });

    list.querySelectorAll('[data-map]').forEach(sel => sel.onchange = async () => {
      const shop = sel.dataset.map, el = list.querySelector(`[data-mapmsg="${CSS.escape(shop)}"]`);
      if (!sel.value) return;
      if (el) el.textContent = 'linking…';
      try { await api('/api/connections/map', { method: 'POST', body: JSON.stringify({ shop, act: sel.value }) });
        if (el) el.textContent = 'linked ✓';
        conns = await api('/api/connections').catch(() => conns);
        drawBrands(); }
      catch (err) { if (el) el.textContent = err.message; }
    });

    /* "I can't see all my ad accounts" has several causes that look identical
       from here. Ask the worker which one it is instead of writing copy that
       guesses - that guessing cost two wrong instructions before. */
    const why = $('#brWhy');
    if (why) why.onclick = async e => {
      e.preventDefault();
      const box = $('#brAccess');
      box.innerHTML = '<p class="hint">Asking Meta what this token can reach…</p>';
      try {
        const d = await mApi('/api/meta-access');
        const ok = d.businesses.length > 0 && !d.needsBusinessId;
        box.innerHTML = `<div class="notice ${ok ? '' : 'warn'}" style="margin:0 0 12px">${ok ? '✓' : '⚠️'}<div>
          <b>${esc(d.verdict)}</b>
          <p class="tiny" style="margin:8px 0 0">Token: ${esc(d.token?.type || 'unknown')}${d.token?.never_expires ? ', never expires' : ''} ·
          Permissions: ${d.scopes.length ? esc(d.scopes.join(', ')) : 'none reported'} ·
          Directly assigned: ${d.direct ?? ' - '} · Portfolios reachable: ${d.businesses.length}</p>
          ${d.errors.length ? `<p class="tiny" style="margin:4px 0 0;color:var(--bad)">${d.errors.map(x => esc(x.at + ': ' + x.error)).join(' · ')}</p>` : ''}
          ${!d.needsBusinessId ? '' : `<div style="margin:12px 0 0">
            <p style="margin:0 0 8px;font-size:13.5px">Paste your <b>Business portfolio ID</b> from
            <a href="https://business.facebook.com/settings/info" target="_blank" rel="noopener">Business Settings → Business info</a>.
            Once set, every account a client shares with you - including future clients - is found automatically.</p>
            <div class="row" style="gap:8px;margin:0"><input type="text" id="mbId" placeholder="e.g. 1234567890123456" style="width:220px" inputmode="numeric">
            <button class="btn primary" id="mbSave">Save</button><span class="tiny" id="mbMsg"></span></div></div>`}
        </div></div>`;
        const sv = $('#mbSave');
        if (sv) sv.onclick = async () => {
          const idv = $('#mbId').value.trim(), msg2 = $('#mbMsg');
          sv.disabled = true; msg2.textContent = 'Checking with Meta…';
          try {
            const r = await mApi('/api/meta-business', { method: 'PUT', body: JSON.stringify({ id: idv }) });
            msg2.textContent = `Saved: ${r.name} - finding accounts…`;
            const dr = await mApi('/api/discover', { method: 'POST' });

      } catch (err) { box.innerHTML = `<div class="notice warn" style="margin:0 0 12px">⚠️<div>Couldn’t check: ${esc(err.message)}</div></div>`; }
    };

    const nc = $('#ncOpen');
    if (nc) nc.onclick = () => NewClient.open();
    const add = $('#brAdd');
    if (add) add.onclick = async () => {
      /* Meta ad accounts no brand has connected yet (brand-first: the brand list itself is brands). */
      let avail = (window.MetaTab && window.MetaTab.metaAvailable()) || [];
      const picked = await addBrandModal(avail, chList, async () => {
        try { const r = await mApi('/api/discover', { method: 'POST' }); metaAccts = r.accounts || metaAccts; avail = r.meta_available || avail; return avail; }
        catch (e) { noteModal('Could not reach Meta', `<p>${esc(e.message)}</p>`); return avail; }

      try {
        await mApi(`/api/accounts/${picked.act}`, { method: 'PUT', body: JSON.stringify({
          active: true, name: picked.name, ...(picked.shop ? { tw_shop: picked.shop } : {}) }) });
        if (picked.internal || picked.client) {
          await api('/api/client-settings', { method: 'PUT', body: JSON.stringify({
            act: picked.act, slack_channel: picked.internal || null, brief_channel: picked.client || null }) });
        }
        await refreshAccounts();
        await inPlace(async () => { await boot(); show('settings'); });
        noteModal(`${picked.name} is set up`, `<p>Two things happen on their own from here:</p>
          <ul style="margin:8px 0 0;padding-left:18px;font-size:14px;line-height:1.55">
            <li>Meta backfills <b>90 days</b> of ad history on the first sync.</li>
            ${picked.shop ? '<li>Triple Whale starts filling in revenue, so profit numbers appear once it has synced.</li>'
                          : '<li style="color:var(--bad)"><b>No Triple Whale shop was set</b>, so this brand has no revenue, MER or profit until you add one in its row.</li>'}
          </ul>
          <p style="margin-top:12px">Then <b>agree a monthly number on the Plan tab</b> - the daily brief and both reports measure every day against it.</p>`);
      } catch (e) {
        if (bm) bm.textContent = '';
        noteModal('Could not add the brand', `<p>${esc(e.message)}</p><p class="hint">Nothing was saved.</p>`);
      }
    };
  }
  drawBrands();

  /* ---- Team ---- */
  (async () => {
    const host = $('#teamCard'); if (!host || !mApi) return;
    const paint = d => {
      const rows = d.members.map(mm => `<tr data-e="${esc(mm.email)}">
        <td><b>${esc(mm.email)}</b>${mm.email === d.you ? ' <span class="tiny">(you)</span>' : ''}<br><span class="tiny">${mm.guest ? 'Invited guest' : 'On your domain'}</span></td>
        <td><select data-k="role" style="max-width:230px">

      $('#cnClose').onclick = close;
      const msg = t => { const m2 = drawer.querySelector('#cnMsg'); if (m2) m2.textContent = t; };
      drawer.querySelectorAll('.cn-copy').forEach(btn => btn.onclick = async () => { try { await navigator.clipboard.writeText(btn.dataset.copy); btn.querySelector('span').textContent = 'copied'; setTimeout(() => { btn.querySelector('span').textContent = 'copy'; }, 1500); } catch { btn.querySelector('span').textContent = 'select and copy'; } });
      drawer.querySelectorAll('[data-tool]').forEach(btn => btn.onclick = async () => { msg('Saving…'); try { await saveLink(b, { email_tool: btn.dataset.tool }); close(); reopen(); } catch (err) { msg(err.message); } });
      drawer.querySelectorAll('[data-opt]').forEach(btn => btn.onclick = async () => { btn.disabled = true; msg('Linking…'); try { await saveLink(b, { [inp.key]: btn.dataset.opt }); close(); reopen(); } catch (err) { btn.disabled = false; msg(err.message); } });
      const save = drawer.querySelector('#cnSave');
      if (save) save.onclick = async () => {
        const v = drawer.querySelector('#cnLink').value.trim();
        save.disabled = true; msg(inp.secret ? 'Checking with Klaviyo…' : 'Saving…');
        try {
          if (inp.key === 'tw_shop' && !it.input) { const vv = v.toLowerCase().replace(/^https?:\/\//, '').replace(/\/.*$/, ''); await mApi(`/api/accounts/${b.act_id}`, { method: 'PUT', body: JSON.stringify({ tw_shop: vv }) }); }
          else await saveLink(b, { [inp.key]: v });
          close(); reopen();
        } catch (err) { msg(err.message); save.disabled = false; }
      };
    };
    host.onclick = e => {
      const g = e.target.closest('tr[data-gact]');
      if (g) { S.act = g.dataset.gact; localStorage.setItem(LS.act, S.act); const cp = $('#clientPick'); if (cp) cp.value = S.act; try { localStorage.setItem('pf_set_bsec', 'conn'); } catch {} SETMODE.set('brand'); show('settings'); return; }
      const c = e.target.closest('.cn-card'); if (!c) return;
      if (c.dataset.scope === 'agency') { const it = agency.find(a => a.key === c.dataset.k); if (it) open(it, null, c); return; }
      const b = brands.find(x => x.act_id === c.dataset.act), it = b?.items.find(i => i.key === c.dataset.k); if (it) open(it, b, c);
    };
  })();

  /* ---- are the scheduled jobs actually running? ----
     Reads what the crons wrote about themselves. The three things worth knowing
     are: is any brand's data stale, did the last tick have to defer work, and
     did anything error. Everything else is detail and stays folded away. */
  (async () => {
    const host = $('#schedHealth'); if (!host || !mApi) return;
    try {
      const h = await mApi('/api/schedule-health');
      const today = ymdLocal(new Date()), yday = addDaysStr(today, -1);
      // "Stale" means Meta has not given us yesterday yet. Today is always
      // partial and never expected to be present.
      const stale = (h.data_freshness || []).filter(r => !r.latest || r.latest < yday);
      const faults = [];
      const scan = (label, run) => {
        if (!run) return;
        const s = JSON.stringify(run);
        const e = (s.match(/"error":/g) || []).length, d = (s.match(/"deferred":/g) || []).length;
        if (e || d) faults.push(`${label}: ${[e && `${e} error${e > 1 ? 's' : ''}`, d && `${d} deferred`].filter(Boolean).join(', ')}`);
      };
      scan('hourly', h.hourly); scan('nightly', h.nightly); scan('reports', h.reports);
      const ago = t => t ? fmtAgo(t) : 'never';
      const planLine = h.plan === 'paid'
        ? `Workers <b>Paid</b> - ${h.subrequest_limit.toLocaleString()} calls per run, so a tick finishes everything in one go.`
        : `Workers <b>Free</b> - only <b>${h.subrequest_limit}</b> calls per run. Jobs still finish, they just spread over more hourly ticks. Upgrading removes the spreading entirely.`;
      const staleNames = stale.map(r => {
        const when = r.latest ? '(last ' + esc(r.latest) + ')' : '(no data at all)';
        return esc(r.name) + ' <span class="tiny">' + when + '</span>';
      }).join(' · ');
      host.innerHTML = `
        ${stale.length ? `<div class="notice warn" style="margin:0 0 10px">⚠️<div><b>${stale.length} brand${stale.length > 1 ? 's have' : ' has'} no Meta data for ${esc(yday)}:</b> ${staleNames}.
          <p class="tiny" style="margin:6px 0 0">The sync refreshes the stalest brand first on every hourly tick, so this usually clears itself. If it is still here tomorrow, something is actually wrong.</p></div></div>`
          : `<div class="notice good" style="margin:0 0 10px">✓<div>Every brand has Meta data through <b>${esc(yday)}</b>.</div></div>`}
        ${faults.length ? `<div class="notice warn" style="margin:0 0 10px">⚠️<div><b>Last run had trouble:</b> ${esc(faults.join(' · '))}.
          <p class="tiny" style="margin:6px 0 0">Deferred work is normal and picks itself up on the next tick. Errors are not - open the detail below.</p></div></div>` : ''}
        <div class="row" style="gap:22px;flex-wrap:wrap;margin-bottom:4px">
          <div><div class="tiny">Last hourly tick</div><div style="font-weight:700">${esc(ago(h.hourly?.at))}</div></div>
          <div><div class="tiny">Last nightly</div><div style="font-weight:700">${esc(ago(h.nightly?.at))}</div></div>
          <div><div class="tiny">Brief hour</div><div style="font-weight:700">${h.brief_hour}:00 Central</div></div>
          <div><div class="tiny">Report hour</div><div style="font-weight:700">${h.report_hour}:00 Central</div></div>
        </div>
        <p class="tiny" style="margin:8px 0 0">${planLine}${h.hourly?.subrequests ? ` Last tick used <b>${h.hourly.subrequests.used}</b> of ${h.hourly.subrequests.limit}.` : ''}</p>
        <details style="margin-top:8px"><summary class="tiny" style="cursor:pointer">What each job did last time</summary>
          <pre class="tiny" style="white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border-radius:8px;padding:10px 12px;margin-top:6px;max-height:280px;overflow:auto">${esc(JSON.stringify({ hourly: h.hourly, nightly: h.nightly, reports: h.reports }, null, 1))}</pre></details>`;
    } catch (e) { host.innerHTML = `<span class="hint">Couldn't check: ${esc(e.message)}</span>`; }
  })();

  /* ---- replayable tours ---- */
  (() => {
    const host = $('#tourList'); if (!host) return;
    host.innerHTML = Object.entries(TOURS).map(([k, t]) =>
      `<button class="btn" data-tour="${k}">${esc(t.name)}</button>`).join('')
      + '<span class="tiny" style="width:100%;margin-top:6px">The first one explains how the whole platform fits together - start there if you are showing someone else around.</span>';
  })();

  /* ---- fetch missing creative formats ----
     Calls the account-health worker directly, the same way the Meta tab does:
     this route lives with the Meta sync and is not in PROXY_PATHS. Scoped to
     the selected client, or every account when the picker says All. */
  {
    const b = $('#mtFix'), msg = $('#mtMsg');
    if (b) b.onclick = async () => {
      if (!mApi) { msg.textContent = 'The Meta section did not load, so this cannot run. Hard-refresh and try again.'; return; }
      b.disabled = true; msg.textContent = 'Asking Meta what each ad is…';
      try {
        const r = await mApi(`/api/ads-type-backfill?act=${encodeURIComponent(S.act || 'all')}`);
        const lines = (r.accounts || []).map(a => {
          const m = a.mix || {};
          const parts = ['video', 'image', 'carousel'].filter(k => m[k]).map(k => `${m[k]} ${k === 'image' ? 'static' : k}`);
          return `<li><b>${esc(a.account)}</b>: ${a.resolved} resolved${a.still_null ? `, ${a.still_null} still unknown` : ''}${parts.length ? ` &nbsp;·&nbsp; now ${parts.join(', ')}` : ''}</li>`;
        }).join('');
        msg.textContent = 'Done ✓';
        noteModal('Creative formats updated', `<p>Each ad below now carries the format Meta reports for it, so cards and the type filter show carousels where they exist.</p><ul style="margin:8px 0 0 18px">${lines}</ul>
          <p class="tiny" style="margin-top:10px">"Still unknown" means Meta would not return that ad's creative, usually because it was deleted. Those keep falling back to the video-or-static guess.</p>`);
      } catch (e) { msg.textContent = e.message; }
      b.disabled = false;
    };
  }

  /* ---- global send time ---- */
  (async () => {
    const sel = $('#btHour'); if (!sel) return;
    sel.innerHTML = Array.from({ length: 24 }, (_, h) => {
      const l = h === 0 ? '12:00 AM' : h < 12 ? `${h}:00 AM` : h === 12 ? '12:00 PM' : `${h - 12}:00 PM`;
      return `<option value="${h}">${l} Central</option>`;
    }).join('');
    try { const r = await api('/api/brief-time'); sel.value = String(r.hour ?? 9); }
    catch { sel.value = '9'; }
    sel.onchange = async () => {
      $('#btMsg').textContent = 'Saving…';
      try { await api('/api/brief-time', { method: 'PUT', body: JSON.stringify({ hour: +sel.value }) }); $('#btMsg').textContent = 'Saved ✓'; }
      catch (e) { $('#btMsg').textContent = e.message; }
    };
  })();
}


/* ================= THE STRATEGIST =================
   The account strategist, in Locus: what it found on the Overview, a panel
   that answers anywhere (Ctrl+K, the rail button), and a card in Settings
   for what it knows and where it briefs. It lives on the account-health
   worker, which holds the data, the model key and the Slack app; the same
   brain answers the team in each brand's Slack channel (../ask/ask-ui.js). */
const AH_URL = (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && (() => { try { return localStorage.getItem('pf_ah'); } catch { return null; } })()) || 'https://mobius-account-health.mobius-digital.workers.dev';
async function apiAH(path, opts = {}) {
  const res = await fetch(AH_URL + path, { ...opts, headers: { 'Authorization': 'Bearer ' + S.tok, ...(opts.body ? { 'Content-Type': 'application/json' } : {}) } });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || ('HTTP ' + res.status));
  return j;
}
const SCREEN_NAMES = { overview: 'Overview (every brand at a glance)', profit: 'Profit', plan: 'Plan', brief: 'Daily Brief', reports: 'Reports', customers: 'Customers', meta: 'Meta (spend from Meta, sales from Triple Whale)', tests: 'Tests', costs: 'Costs', settings: 'Settings', health: 'Data health', google: 'Google (what Triple Whale sees; not connected directly)', tiktok: 'TikTok (what Triple Whale sees; not connected directly)', email: 'Email and SMS (Klaviyo)', dash: 'Dashboards (saved, drawn live)', store: 'Store sales (Triple Whale store level)' };
AskUI.init({
  name: 'Strategist', api: apiAH, esc, hotkey: false, confirm: async o => !!(await confirmModal(o.title, o.body || '', o.ok)),
  onApplied: () => { try { show(S.tab); } catch (e) {} },
  flash: msg => { const el = document.getElementById('connChip'); if (el) { const was = el.textContent; el.textContent = msg; setTimeout(() => { el.textContent = was; }, 2500); } },
  cardH: (t, q, right = '') => `<div class="ch" style="display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap"><div style="flex:1;min-width:0"><h3 style="margin:0 0 4px">${esc(t)}</h3>${q ? `<div class="hint">${esc(q)}</div>` : ''}</div>${right}</div>`,
  intro: 'Ask me about any brand or the whole book. Try: "how is Dartee doing this month against plan?", "what changed on Party Patch this week and who did it?", "which creatives are tiring on Grunk?", "what did we tell Galway last Monday?", "keep an eye on Dartee MER under 2.5".',
  screen: () => {
    try {
      const a = S.act === 'all' ? null : S.accounts.find(x => x.act_id === S.act);
      const ctx = { screen: SCREEN_NAMES[S.tab] || S.tab, screen_id: S.tab, brand_selected: a ? a.name : 'All clients', range: S.range?.preset || S.days };
      return ctx;
    } catch (e) { return null; }
  },
});
/* The Overview leads with what the Strategist found. */
const _renderOverviewBase = renderOverview;
renderOverview = async function(){
  await _renderOverviewBase();
  if (S.tab !== 'overview') return;
  /* Under the Today card, above the numbers. With no findings and no briefing it
     collapses to one line so it never pushes the numbers below the fold. */
  const done = AskUI.mount(document.querySelector('#ovToday') || document.querySelector('#main .ph'));
  if (done && done.then) done.then(() => {
    const c = document.getElementById('askCard');
    if (!c || S.tab !== 'overview' || c.querySelector('.find, .brief')) return;
    c.classList.add('quiet');
    c.innerHTML = `<b>The Strategist</b><span class="hint">The nightly checks found nothing that needs you.</span><button class="btn" onclick="AskUI.open()">Ask the Strategist</button>`;
  }).catch(() => {});
};
const _renderSettingsBase = renderSettings;
renderSettings = async function(){
  await _renderSettingsBase();
  const slot = document.getElementById('askSetSlot');
  if (!slot) return;
  slot.innerHTML = AskUI.settingsCard() + `<div class="card set-card"><h3>Where it posts the Monday briefing</h3>
    <p class="hint set-why">A Slack channel id (starts with C0) the team reads. Leave it empty and the briefing stays in Locus.</p>
    <div class="set-body"><div class="row" style="margin:0;gap:8px;flex-wrap:wrap"><input type="text" id="askChan" placeholder="C0123ABCDEF" style="max-width:240px">
      <button class="btn" id="askChanSave">Save channel</button><span class="tiny" id="askChanMsg"></span></div></div></div>`;
  const acs = document.getElementById('askChanSave');
  if (acs) acs.onclick = async () => {
    const msgEl = document.getElementById('askChanMsg');
    acs.disabled = true; msgEl.textContent = 'Saving…';
    try { await apiAH('/api/ask/channel', { method: 'PUT', body: JSON.stringify({ channel: document.getElementById('askChan').value.trim() }) }); msgEl.textContent = 'Saved ✓'; }
    catch (e) { msgEl.textContent = e.message; }
    acs.disabled = false;
  };
  AskUI.afterSettings();
  /* Scheduled questions (Strategist section) and the What moved switch (Briefs and Slack): askextra.js. */
  if (window.AskX) { AskX.movedSetting(); }   // scheduled questions moved to Reports > Dashboards (2026-10-09)
  try { const d = await apiAH('/api/ask/findings'); const c = document.getElementById('askChan'); if (c) c.value = d.channel || ''; } catch (e) {}
};
boot();
</script>
