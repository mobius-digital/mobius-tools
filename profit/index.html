/** A timestamp as Central wall-clock, the only clock this tool speaks. */
const fmtCentralTime = iso => new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Chicago' }) + ' Central';

/* ---------- Hour by hour (single-day windows) ----------
   Blended revenue and blended ad spend by the hour, from Triple Whale's own
   hourly view of a single day - the same two lines as the daily chart, on the
   same revenue definition, so a one-day window is never an empty chart. */
const hourWord = h => h === 0 ? '12am' : h === 12 ? '12pm' : h < 12 ? `${h}am` : `${h - 12}pm`;
function hourlySVG(hours, cur, id = 'pfHours') {
  const w = 940, h = 220, pl = 58, pr = 14, pt = 12, pb = 26;
  const maxV = Math.max(...hours.map(x => Math.max(x.sales || 0, x.spend || 0))) * 1.1 || 1;
  const slot = (w - pl - pr) / 24;
  const x = i => pl + i * slot + slot / 2;
  const y = v => pt + (1 - v / maxV) * (h - pt - pb);
  const line = get => hours.map((r, i) => `${x(i).toFixed(1)},${y(get(r) || 0).toFixed(1)}`).join(' ');
  const ticks = [0, 3, 6, 9, 12, 15, 18, 21].map(hh =>
    `<text x="${x(hh).toFixed(1)}" y="${h - 8}" font-size="10" text-anchor="middle" fill="#647684">${hourWord(hh)}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;touch-action:none" id="${id}">
    ${ticks}
    <line class="hx-guide" x1="0" x2="0" y1="${pt}" y2="${h - pb + 4}" stroke="#14608C" stroke-width="1" opacity="0" pointer-events="none"/>
    <polyline points="${line(r => r.sales)}" fill="none" stroke="#14608C" stroke-width="2.2" stroke-linejoin="round"/>
    <polyline points="${line(r => r.spend)}" fill="none" stroke="#C08A2E" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="2" y="${pt + 9}" font-size="10" fill="#647684">${fmtK(maxV, cur)}</text>
    <text x="2" y="${h - pb}" font-size="10" fill="#647684">${fmtK(0, cur)}</text>
  </svg>`;
}
function hourlyCard(d, cur, isToday, asOf) {
  const hours = d.hours || [];
  return `<div class="card"><h3 style="margin-bottom:2px">${isToday ? 'Today so far' : 'Yesterday'}, hour by hour</h3>
    <p class="hint" style="margin-bottom:6px"><span style="color:#14608C;font-weight:700">Blue</span> is revenue - everything the store sold in that hour, from every channel. <span style="color:#C08A2E;font-weight:700">Amber</span> is ad spend across every platform. Both from Triple Whale&rsquo;s hourly view of the day${isToday && asOf ? `, as of <b>${asOf}</b>` : ''}. Hover or tap an hour.</p>
    ${hours.length
      ? `<div id="pfHoursRead" class="tiny" style="min-height:18px;margin-bottom:4px">Hover or tap an hour…</div>${hourlySVG(hours, cur)}`
      : `<p class="hint">Triple Whale has not reported any hours for this day yet.</p>`}
    <div class="row" style="margin:10px 0 0"><button class="btn" onclick="localStorage.setItem(MSUB.key,'today');show('meta')">Open Meta → Today for spend pacing against a normal day</button></div></div>`;
}
function wireHourly(svgId, readoutId, hours, cur) {
  const svg = $('#' + svgId), ro = $('#' + readoutId);
  if (!svg || !ro || !hours.length) return;
  const guide = svg.querySelector('.hx-guide');
  const W = 940, pl = 58, pr = 14, slot = (W - pl - pr) / 24;
  let cs = 0, cp = 0; const cum = hours.map(r => ({ s: (cs += r.sales || 0), p: (cp += r.spend || 0) }));
  const inspect = clientX => {
    const rect = svg.getBoundingClientRect();
    const vx = (clientX - rect.left) / rect.width * W;
    const i = Math.max(0, Math.min(hours.length - 1, Math.floor((vx - pl) / slot)));
    const gx = pl + i * slot + slot / 2;
    guide.setAttribute('x1', gx); guide.setAttribute('x2', gx); guide.setAttribute('opacity', '.55');
    const r = hours[i];
    ro.innerHTML = `<b>${hourWord(r.hour)}</b> &nbsp; <span style="color:#14608C;font-weight:700">revenue:</span> <b>${fmtMoney(r.sales, cur)}</b>
      &nbsp; <span style="color:#C08A2E;font-weight:700">ad spend:</span> <b>${fmtMoney(r.spend, cur)}</b>
      &nbsp; by then <b>${fmtMoney(cum[i].s, cur)}</b> revenue on <b>${fmtMoney(cum[i].p, cur)}</b> spend`;
  };
  svg.addEventListener('pointermove', e => inspect(e.clientX));
  svg.addEventListener('pointerdown', e => inspect(e.clientX));
}

/* ---------- v2 pieces for the money, report and settings screens (2026-10-08) ----------
   Thin wrappers over window.V2UI (v2.js) so P&L, Plan, Customers, the Daily Brief, Reports (and
   the client archive), Dashboards, Settings, Data health and Costs draw tiles, verdicts and
   charts one way. Each of those screens renders into `<div class="v2 lx">`; the `.lx` CSS block
   restyles the legacy pieces still inside them. Nothing here reads S or calls the API. */
const LXC = new Map();
const LX = {
  /** The page head without the purpose line: the verdict under it says more. */
  head: (tab, title, extra) => pageHead(tab, title, extra).replace(/<p class="ph-sub">[\s\S]*?<\/p>/, ''),
  /** One-sentence verdict at the top of a screen. */
  say: (html, id) => `<p class="v2say lead"${id ? ` id="${id}"` : ''}>${html}</p>`,
  /** A v2 tile whose label explains itself on hover (the hover replaces the old "i" icons). */
  tile(o) {
    const U = window.V2UI; const html = U.tile({ ...o, hint: undefined });
    return o.info ? html.replace('<div class="l">', `<div class="l"${U.tipAttr(o.info)}>`) : html;
  },
  spark: (vals, tips, ghost) => window.V2UI.spark(vals, ghost, 300, 34, tips),
  /** A delta chip against a plan or a prior period; lower = true when lower is better, 'n' = neutral. */
  chip: (cur, ref, lower, tip) => window.V2UI.chip(cur, ref, lower, tip),
  /** Revenue (accent) against ad spend (amber) by day, compare period ghosted. Wire with LX.wireDual. */
  dual(id, rows, cur, o = {}) {
    const U = window.V2UI;
    const data = rows.map(r => ({ date: r.date, v: r.sales ?? null, s: r.spend ?? null }));
    const prev = (o.prev || []).map(r => ({ date: r.date, v: r.sales ?? null }));
    return U.legend([{ color: '--brand', label: o.aLabel || 'Revenue' }, { color: '--c-google', label: o.bLabel || 'Ad spend' },
      ...(prev.length > 1 ? [{ dash: true, label: o.prevLabel || 'Compare period' }] : [])])
      + U.lineChart(id, data, { key: 'v', key2: 's', prev, cur, h: o.h || 230 });
  },
  wireDual: (id, rows, tip) => window.V2UI.wireLine(id, rows, { tip: (r, i) => tip(rows[i], i) }),
  /** A general x/y line chart for the shapes the date chart cannot draw: hours of a day, days
   *  after a first order, a margin that can go below zero. xs are numbers (uneven spacing is
   *  kept), series are token colours, lines are dashed reference levels, tips one per x. */
  chart(id, o) {
    const w = 760, h = o.h || 220, pl = 52, pr = 16, pt = 14, pb = 26;
    const xs = o.xs || [], n = xs.length;
    if (n < 2) return '<p class="v2hint">Not enough points for a chart yet.</p>';
    const xmin = Math.min(...xs), xmax = Math.max(...xs);
    const all = o.series.flatMap(s => s.vals).concat((o.lines || []).map(l => l.v)).filter(v => v != null && isFinite(v));
    let lo = Math.min(0, ...all), hi = Math.max(0, ...all);
    hi = hi + (hi - lo) * 0.1 || 1;
    if (lo < 0) lo = lo - (hi - lo) * 0.04;
    const X = x => pl + (x - xmin) / ((xmax - xmin) || 1) * (w - pl - pr);
    const Y = v => pt + (1 - (v - lo) / ((hi - lo) || 1)) * (h - pt - pb);
    const fmt = o.fmt || (v => window.V2UI.kmoney(v, o.cur));
    const grid = [0, 0.25, 0.5, 0.75, 1].map(f => { const v = lo + (hi - lo) * f; return `<line x1="${pl}" x2="${w - pr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--v2-grid)"/><text x="${pl - 6}" y="${(Y(v) + 4).toFixed(1)}" font-size="10" text-anchor="end" fill="var(--muted)">${fmt(v)}</text>`; }).join('');
    const tickIdx = o.ticks || (n <= 12 ? xs.map((_, i) => i) : [...new Set(Array.from({ length: 7 }, (_, k) => Math.round(k * (n - 1) / 6)))]);
    const ticks = tickIdx.map(i => `<text x="${X(xs[i]).toFixed(1)}" y="${h - 8}" font-size="10" text-anchor="middle" fill="var(--muted)">${(o.xl || xs)[i]}</text>`).join('');
    const zero = lo < 0 ? `<line x1="${pl}" x2="${w - pr}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="var(--bad)" stroke-dasharray="4 3"/>` : '';
    const refs = (o.lines || []).filter(l => l.v != null && isFinite(l.v)).map(l => `<line x1="${pl}" x2="${w - pr}" y1="${Y(l.v).toFixed(1)}" y2="${Y(l.v).toFixed(1)}" stroke="var(${l.color || '--warn'})" stroke-width="1.2" stroke-dasharray="3 4"/><text x="${w - pr - 4}" y="${(Y(l.v) - 5).toFixed(1)}" font-size="10.5" text-anchor="end" fill="var(${l.color || '--warn'})">${esc(l.label || '')}</text>`).join('');
    const lines = o.series.map(s => {
      const pts = s.vals.map((v, i) => v == null || !isFinite(v) ? null : `${X(xs[i]).toFixed(1)},${Y(v).toFixed(1)}`).filter(Boolean).join(' ');
      const dots = s.dots ? s.vals.map((v, i) => v == null ? '' : `<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.5" fill="var(${s.color})"/>`).join('') : '';
      return `<polyline points="${pts}" fill="none" stroke="var(${s.color})" stroke-width="${s.w || 2}" stroke-linejoin="round"${s.dash ? ' stroke-dasharray="4 4"' : ''}/>${dots}`;
    }).join('');
    LXC.set(id, { xs, X, w, tips: o.tips || [] });
    return `<div class="v2chart"><svg id="${id}" viewBox="0 0 ${w} ${h}" style="touch-action:none">${grid}${ticks}${zero}${refs}${lines}<line class="gl" x1="0" x2="0" y1="${pt}" y2="${h - pb}" stroke="var(--ink)" opacity="0"/></svg><div class="v2tip"></div></div>`;
  },
  wireChart(id) {
    const el = document.getElementById(id), c = LXC.get(id); if (!el || !c) return;
    const tip = el.parentNode.querySelector('.v2tip'), gl = el.querySelector('.gl');
    const move = e => {
      const r = el.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * c.w;
      let i = 0; c.xs.forEach((x, k) => { if (Math.abs(c.X(x) - vx) < Math.abs(c.X(c.xs[i]) - vx)) i = k; });
      const gx = c.X(c.xs[i]); gl.setAttribute('x1', gx); gl.setAttribute('x2', gx); gl.setAttribute('opacity', '.55'); gl.setAttribute('stroke-dasharray', '3 3');
      window.V2UI.markDots(el, gx, 6);
      if (!c.tips[i]) { tip.style.display = 'none'; return; }
      tip.style.display = 'block'; tip.innerHTML = c.tips[i];
      const tw = tip.offsetWidth; let left = (e.clientX - r.left) + 14; if (left + tw > r.width) left = (e.clientX - r.left) - tw - 14;
      tip.style.left = Math.max(0, left) + 'px'; tip.style.top = '8px';
    };
    el.onpointermove = move; el.onpointerdown = move;
    el.onpointerleave = () => { tip.style.display = 'none'; gl.setAttribute('opacity', '0'); window.V2UI.clearDots(el); };
  },
};

/* ---------- Profit ---------- */
function salesSpendSVG(rows, cur, id = 'pfSvg') {
  const w = 940, h = 240, pl = 58, pr = 14, pt = 12, pb = 26;
  const n = rows.length;
  if (!n) return { svg: '<p class="hint">No data in this window.</p>' };
  const maxV = Math.max(...rows.map(r => Math.max(r.sales ?? 0, r.spend ?? 0))) * 1.08 || 1;
  const x = i => pl + i / Math.max(1, n - 1) * (w - pl - pr);
  const y = v => pt + (1 - v / maxV) * (h - pt - pb);
  const line = get => rows.map((r, i) => { const v = get(r); return v == null ? null : `${x(i).toFixed(1)},${y(v).toFixed(1)}`; }).filter(Boolean).join(' ');
  // Six evenly-spaced ticks SKIP days on a short series: with 7 days the rounding
  // lands on 0,1,2,4,5,6 and the 4th day silently loses its label, which reads as
  // missing data rather than a missing label (Cole spotted 08-20 "gone" from a
  // 7-day report - the point was plotted, only the tick was absent). Label every
  // day when there are few enough to fit, and dedupe otherwise.
  const idx = n <= 10 ? rows.map((_, i) => i)
    : [...new Set(Array.from({ length: 6 }, (_, k) => Math.round(k * (n - 1) / 5)))];
  const ticks = idx.map(i =>
    `<text x="${x(i).toFixed(1)}" y="${h-8}" font-size="10" text-anchor="middle" fill="#647684">${rows[i].date.slice(5)}</text>`).join('');
  return { svg: `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;touch-action:none" id="${id}">
    ${ticks}
    <line class="fx-guide" x1="0" x2="0" y1="${pt}" y2="${h-pb+4}" stroke="#14608C" stroke-width="1" opacity="0" pointer-events="none"/>
    <polyline points="${line(r=>r.sales)}" fill="none" stroke="#14608C" stroke-width="2.2"/>
    <polyline points="${line(r=>r.spend)}" fill="none" stroke="#C08A2E" stroke-width="1.8"/>
    <text x="2" y="${pt+9}" font-size="10" fill="#647684">${fmtK(maxV, cur)}</text>
    <text x="2" y="${h-pb}" font-size="10" fill="#647684">${fmtK(0, cur)}</text>
  </svg>` };
}

/** Crosshair readout for a salesSpendSVG chart - hover AND tap, per Cole's rule
 *  that every chart must be inspectable on both. Shared by the Profit tab and the
 *  weekly/monthly reports (internal and client views alike) so the interaction is
 *  identical wherever the chart appears. `fmtRow` renders one day's readout. */
function wireSalesSpend(svgId, readoutId, rows, fmtRow) {
  const svg = $('#' + svgId), ro = $('#' + readoutId);
  if (!svg || !ro || !rows.length) return;
  const guide = svg.querySelector('.fx-guide');
  const n = rows.length, W = 940, pl = 58, pr = 14;
  const inspect = clientX => {
    const rect = svg.getBoundingClientRect();
    const vx = (clientX - rect.left) / rect.width * W;
    const i = Math.max(0, Math.min(n - 1, Math.round((vx - pl) / (W - pl - pr) * (n - 1))));
    const gx = pl + i / Math.max(1, n - 1) * (W - pl - pr);
    guide.setAttribute('x1', gx); guide.setAttribute('x2', gx); guide.setAttribute('opacity', '.55');
    if (window.V2UI) window.V2UI.markDots(svg, gx, (W - pl - pr) / Math.max(1, n - 1) / 2 + 1);
    ro.innerHTML = fmtRow(rows[i]);
  };
  svg.addEventListener('pointermove', e => inspect(e.clientX));
  svg.addEventListener('pointerdown', e => inspect(e.clientX));
}

/** Profit with no client selected: rank every brand by what it actually kept. */
/* PROFIT WITH NO CLIENT SELECTED IS A CHOOSER, not a second scoreboard.
   It used to render the same six figures - CM, revenue, MER, aMER, new %,
   spend - from the same `S.accounts` snapshot over the same window as the
   Overview table, as ranked cards. Same data, same source, same window, drawn
   twice on two tabs. Overview is a strict superset (it also carries MTD vs
   plan) and now sorts, so the ranking that was this view's only contribution
   lives there instead.
   What remains is the job you actually opened Profit to do: pick a brand. One
   line each, the kept figure for orientation, and nothing to compare. */
function renderProfitAll() {
  const ranked = S.accounts.slice().sort((a, b) => {
    const v = x => cmTrusted(x.cost_health) ? (x.window.cm ?? -Infinity) : -Infinity;
    return v(b) - v(a);
  });
  /* A ranked list and nothing else: position, brand, what it kept, with a bar beside the
     number so the gap between brands reads before the figures do. The window is named once,
     in the verdict, because "kept" without a period is not a figure. */
  const U = window.V2UI;
  const kept = ranked.filter(a => cmTrusted(a.cost_health) && a.window.cm != null);
  const mx = Math.max(1, ...kept.map(a => Math.abs(a.window.cm)));
  const losing = kept.filter(a => a.window.cm < 0);
  const say = !kept.length ? 'No brand has trusted cost data for this window yet, so nothing can be ranked by what it kept.'
    : `<b>${esc(kept[0].name)}</b> kept the most: ${fmtMoney(kept[0].window.cm, kept[0].currency)} after every cost (${esc(rangeLabel())}).${losing.length ? ` <span class="bad">${losing.length} brand${losing.length === 1 ? ' lost' : 's lost'} money</span>: ${losing.map(a => esc(a.name)).join(', ')}.` : ' Every brand with trusted costs made money.'}`;
  $('#main').innerHTML = `<div class="v2 lx">${LX.head('profit', 'Profit')}
    ${LX.say(say)}
    <section class="v2card"><div class="v2h"><h3>Ranked by what each brand kept</h3><span class="cap">${esc(rangeLabel())}</span></div>
      <div class="v2tbl" id="pfPick"><table><thead><tr><th>Brand</th><th>Kept after every cost</th><th>Revenue</th><th>MER</th><th></th></tr></thead><tbody>
      ${ranked.map((a, i) => {
        const w = a.window, trusted = cmTrusted(a.cost_health);
        return `<tr class="link" data-id="${a.act_id}" tabindex="0"><td><span style="color:var(--muted)">${i + 1}</span>&nbsp; <b>${esc(a.name)}</b></td>
          <td>${trusted && w.cm != null ? U.ib(Math.abs(w.cm), mx, w.cm >= 0 ? '--good' : '--bad', `<b class="${w.cm >= 0 ? 'good' : 'bad'}">${fmtMoney(w.cm, a.currency)}</b>`, `Contribution margin: revenue minus product costs, fees and ad spend, ${rangeLabel()}`) : '<span class="tiny">cost data unreliable, see Costs</span>'}</td>
          <td>${fmtK(w.sales, a.currency)}</td><td>${fmtX(w.mer)}</td><td><span class="v2link">Open ›</span></td></tr>`;
      }).join('') || '<tr><td class="tiny">No brands yet.</td></tr>'}
      </tbody></table></div></section>
    ${window.V2UI.foot('Kept means contribution margin: revenue minus product costs, fees and ad spend. Click a brand to see where its money went. To compare brands on every number, use Overview.')}</div>`;
  // On the list, not #main - #main survives re-renders and would stack a listener per visit.
  const open = id => { S.act = id; localStorage.setItem(LS.act, S.act); $('#clientPick').value = S.act; show('profit'); };
  $('#pfPick').addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (b) open(b.dataset.id); });
  $('#pfPick').addEventListener('keydown', e => { const b = e.target.closest('[data-id]'); if (b && e.key === 'Enter') open(b.dataset.id); });
}

/** Weeks, not days. A bad Tuesday is noise; a bad week is a signal. */
function weeksTable(fc, cur) {
  const w = (fc.weeks || []).filter(x => x.days_done > 0);
  if (!w.length || w[0].target == null) return '';
  return `<div class="tbl-wrap" style="margin-top:14px"><table>
    <thead><tr><th>Week</th><th class="num">Target</th><th class="num">Actual</th><th class="num">vs target</th><th class="num">Spend</th></tr></thead>
    <tbody>${w.map(x => {
      const t = x.complete ? x.target : x.target_to_date;
      const off = t ? x.sales / t - 1 : null;
      const cls = off == null ? 'unk' : off >= 0 ? 'good' : off >= -0.1 ? 'warn' : 'bad';
      return `<tr><td>${x.from.slice(5)} – ${x.to.slice(5)}${x.complete ? '' : ` <span class="tiny">(${x.days_done} of ${x.days} days)</span>`}</td>
        <td class="num">${fmtK(t, cur)}</td><td class="num"><b>${fmtK(x.sales, cur)}</b></td>
        <td class="num">${off != null ? `<span class="pill ${cls}">${fmtSigned(off)}</span>` : ' - '}</td>
        <td class="num tiny">${fmtK(x.spend, cur)}</td></tr>`;
    }).join('')}</tbody></table></div>
    <p class="tiny" style="margin-top:6px">A week still running is compared only against the days that have actually elapsed, so it never looks like a miss just for being unfinished.</p>`;
}

/** Where the month lands, built bottom-up: returning customers are the predictable
 *  base, paid acquisition is the volatile top. Two scenarios, because "spend the
 *  budget" and "carry on as you are" often disagree, and that gap is the decision. */
/* "To get back on plan" - the prescription, not just the diagnosis.
 *
 * A report that says a month is 11% behind hands the client a problem. The same
 * report saying it takes $1,850/day for the remaining 12 days hands them a
 * decision. Same escalation as the Plan tab, and for the same reason: the ramp
 * is what the media buyer is actually being asked for, so above ~1.5x the honest
 * line is that the goal needs re-agreeing rather than that spend needs raising -
 * tripling budget late in a month buys colder traffic at worse efficiency than
 * the figure assumes.
 *
 * Client-safe by construction: every number in it is that client's own, and it
 * names the basis (this month's own returning rate and aMER) rather than
 * implying a precision the data does not have.
 */
function catchUpLine(pc, money) {
  const t = pc && pc.to_hit;
  if (!t) return '';
  const label = `the remaining ${t.days_remaining} day${t.days_remaining === 1 ? '' : 's'}`;
  if (t.already_there) {
    return `<div class="cu" style="margin-top:12px"><div class="cu-hd">Already there</div>
      <div class="cu-sub">The month's target is banked with ${label} still to run.</div></div>`;
  }
  if (t.covered_by_returning) {
    return `<div class="cu" style="margin-top:12px"><div class="cu-hd">To finish on plan</div>
      <div class="cu-big">${money(t.revenue_per_day)} a day over ${label}</div>
      <div class="cu-sub">Returning customers alone are running at ${money(t.returning_per_day)} a day, which covers it, so no extra spend is needed to reach the target.</div></div>`;
  }
  const ramp = t.spend_ramp;
  const tone = ramp == null ? '' : ramp <= 1.2 ? '' : ramp <= 1.5 ? 'warn' : 'bad';
  const head = ramp == null ? 'To finish on plan'
    : ramp <= 1.2 ? 'To finish on plan'
    : ramp <= 1.5 ? 'To finish on plan: this is the ask'
    : 'To finish on plan: worth re-agreeing the number';
  return `<div class="cu ${tone}" style="margin-top:12px">
    <div class="cu-hd">${head}</div>
    <div class="cu-big">${money(t.revenue_per_day)} a day of revenue over ${label}</div>
    <div class="cu-sub">
      Returning customers cover about ${money(t.returning_per_day)} of that each day, so <b>${money(t.new_per_day)} a day</b> has to come from new customers.
      ${t.spend_per_day != null ? `At the ${fmtX(t.amer)} the ads have bought new customers at this month, that is <b>${money(t.spend_per_day)} a day of spend</b>${t.spend_ramp ? `, against ${money(t.spend_now_per_day)} a day running now, a <b>${fmtX(t.spend_ramp)}</b> increase` : ''}.` : ''}
      ${ramp != null && ramp > 1.5 ? `<br><b>A step-up this size usually costs efficiency.</b> Spending at more than one and a half times the current rate late in a month reaches colder audiences than the ${fmtX(t.amer)} above assumes, so the better conversation is whether the target still fits the month rather than simply raising budget.` : ''}
    </div>
  </div>`;
}

function forecastCard(fc, cur) {
  const g = fc.goal, p = fc.projected, pace = fc.at_current_pace?.sales;
  const pill = v => v == null ? '' : `<span class="pill ${v >= 0 ? 'good' : Math.abs(v) / (g || 1) < 0.1 ? 'warn' : 'bad'}">${v >= 0 ? '+' : ''}${fmtK(v, cur)}</span>`;
  const ramp = fc.spend_ramp;
  const find = g != null && p != null
    ? `On course for <b>${fmtMoney(p, cur)}</b> against a ${fmtMoney(g, cur)} goal${fc.gap != null ? `, ${fc.gap >= 0 ? `<span class="good">${fmtK(fc.gap, cur)} over</span>` : `<span class="bad">${fmtK(Math.abs(fc.gap), cur)} short</span>`}` : ''}.`
    : p != null ? `On course for <b>${fmtMoney(p, cur)}</b>. No goal is set for this month.` : '';
  return `<section class="v2card"><div class="v2h"><h3>Where the month lands</h3><span class="find">${find}</span><span class="cap">${fc.days_elapsed} days in, ${fc.days_remaining} to go</span></div>
    ${g != null && p != null ? window.V2UI.bullet(p, g, false, 'month goal') : ''}
    <p class="hint" style="margin:10px 0">Built bottom-up from this client's own trailing 28 days, the way CTC forecast: <b>returning customers</b> are the predictable base, <b>new customers</b> follow whatever you spend.</p>
    <div class="tbl-wrap"><table><tbody>
      <tr><td>Banked so far</td><td class="num"><b>${fmtMoney(fc.mtd.sales, cur)}</b></td><td class="tiny">${fmtMoney(fc.mtd.returning, cur)} returning · ${fmtMoney(fc.mtd.new_rev, cur)} new · spent ${fmtK(fc.mtd.spend, cur)}</td></tr>
      <tr><td>Still to come: returning</td><td class="num">${fmtMoney(fc.expected.returning, cur)}</td><td class="tiny">${fmtMoney(fc.basis.returning_per_day, cur)}/day, shaped by weekday</td></tr>
      <tr><td>Still to come: new</td><td class="num">${fmtMoney(fc.expected.new_rev, cur)}</td><td class="tiny">${fmtK(fc.planned_spend_per_day, cur)}/day of spend at ${fmtX(fc.basis.amer)} aMER</td></tr>
      <tr style="border-top:2px solid var(--line-strong)"><td><b>Projected month</b> <span class="tiny">(spending the budget)</span></td><td class="num"><b>${fmtMoney(p, cur)}</b></td><td class="tiny">${g != null ? `vs ${fmtMoney(g, cur)} goal ${pill(fc.gap)}` : 'no goal set'}</td></tr>
      ${pace != null && Math.abs(pace - p) > (g || 1) * 0.01 ? `<tr><td>If spend stays at today's pace</td><td class="num">${fmtMoney(pace, cur)}</td><td class="tiny">${g != null ? `vs goal ${pill(fc.at_current_pace.gap)} · ` : ''}${fmtK(fc.basis.spend_per_day, cur)}/day${ramp && ramp > 1.15 ? `: hitting the plan needs <b>${ramp.toFixed(1)}×</b> that` : ''}</td></tr>` : ''}
    </tbody></table></div>
    ${fc.to_hit && !fc.to_hit.already_there ? `<div class="notice ${fc.to_hit.covered_by_returning ? 'good' : fc.to_hit.spend_ramp > 1.5 ? 'warn' : ''}" style="margin:12px 0 0"><div><b>To hit the goal from here:</b> ${fmtMoney(fc.to_hit.revenue_per_day, cur)}/day for the remaining ${fc.days_remaining} days. ${fc.to_hit.covered_by_returning
      ? `Returning customers alone are expected to cover that, so no extra spend is required.`
      : `Returning covers ${fmtMoney(fc.basis.returning_per_day, cur)} of it, so ${fmtMoney(fc.to_hit.new_per_day, cur)}/day has to come from new customers: <b>${fmtMoney(fc.to_hit.spend_per_day, cur)}/day of spend</b> at ${fmtX(fc.basis.amer)} aMER${fc.to_hit.spend_ramp ? `, which is <b>${fc.to_hit.spend_ramp.toFixed(1)}×</b> the ${fmtK(fc.basis.spend_per_day, cur)}/day running now` : ''}.`}</div></div>` : fc.to_hit?.already_there ? `<div class="notice good" style="margin:12px 0 0"><div><b>The goal is already banked</b> with ${fc.days_remaining} days still to run.</div></div>` : ''}
    ${weeksTable(fc, cur)}
    <p class="tiny" style="margin-top:8px">${fc.basis.email_connected
      ? `Email is <b>${fmtPct(fc.basis.email_share)}</b> of revenue for this client. It cuts across new and returning rather than being separate, so it is context here, not a third line to add up.`
      : `Klaviyo is not reporting into Triple Whale for this client, so email's contribution can't be separated out. It is still inside these numbers, just not visible on its own.`}
      CTC are explicit that paid acquisition can't be forecast precisely; the returning base is the part you can lean on.</p></section>`;
}

/** How a week actually runs for this client.
 *  DESCRIPTIVE ONLY. The plan is deliberately split evenly across the month - a
 *  day-of-week curve backtested WORSE than an even split - so this card must never
 *  read as a target. Its job is to stop a soft Monday reading as a problem, and to
 *  say plainly when a brand has no rhythm at all rather than inventing one from
 *  four Mondays of data. */
function rhythmCard(rh, cur, showCm) {
  if (!rh || !rh.enough) return '';
  const cmOk = showCm && rh.has_cm;
  // Rounding a hair under parity produced "-0%", which reads as a typo.
  const pctOff = idx => { const v = Math.round((idx - 1) * 100); return (v > 0 ? '+' : '') + v + '%'; };
  const monthsLbl = rh.months.map(m => monthLabel(m)).join(', ');
  const pill = v => v === 'strong' ? '<span class="pill good">consistently strong</span>'
    : v === 'soft' ? '<span class="pill warn">consistently soft</span>'
    : '<span class="pill unk">varies</span>';
  // Only project dollars by weekday when the rhythm is real. Splitting a plan by a
  // pattern that is chance is the exact thing this card exists to avoid.
  const wk = rh.reliable && rh.plan && rh.plan.sales != null && rh.plan.days_in_month
    ? rh.plan.sales / rh.plan.days_in_month * 7 : null;

  const rows = rh.days.map(x => `<tr${x.verdict === 'mixed' ? ' style="opacity:.62"' : ''}>
    <td><b>${esc(x.name)}</b></td>
    <td class="num"><b>${fmtPct(x.share, 1)}</b></td>
    <td class="num tiny">${x.index_lo != null ? `${pctOff(x.index_lo)} to ${pctOff(x.index_hi)}` : ' - '}</td>
    <td>${pill(x.verdict)}</td>
    <td class="num">${fmtX(x.mer)}${x.mer_verdict === 'strong' ? ' <span class="pill good" style="padding:1px 5px;font-size:10px">consistently above</span>' : x.mer_verdict === 'soft' ? ' <span class="pill unk" style="padding:1px 5px;font-size:10px">consistently below</span>' : ''}</td>
    ${cmOk ? `<td class="num"><b>${x.cm_per_day != null ? fmtMoney(x.cm_per_day, cur) : ' - '}</b></td>` : ''}
    ${wk != null ? `<td class="num tiny">${fmtMoney(wk * x.share, cur)}</td>` : ''}
  </tr>`).join('');

  const strong = rh.days.filter(x => x.verdict === 'strong').map(x => x.name);
  const soft = rh.days.filter(x => x.verdict === 'soft').map(x => x.name);
  const list = a => a.length === 1 ? a[0] : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];

  const verdict = rh.reliable
    ? `<div class="notice">✓ <div><b>This client has a real weekly rhythm.</b>
        ${strong.length ? `<b>${esc(list(strong))}</b> came in above an average day in <i>every</i> month looked at${soft.length ? ', while ' : '.'}` : ''}
        ${soft.length ? `<b>${esc(list(soft))}</b> came in below an average day every month.` : ''}
        The other days moved around too much to call.${rh.mer_best || rh.mer_worst ? `<br><b>On efficiency:</b> ${rh.mer_best ? `<b>${esc(rh.mer_best.name)}</b> returned the most per ad dollar (${fmtX(rh.mer_best.mer)})` : ''}${rh.mer_best && rh.mer_worst ? ', while ' : ''}${rh.mer_worst ? `<b>${esc(rh.mer_worst.name)}</b> returned the least (${fmtX(rh.mer_worst.mer)})` : ''} in every month. ${rh.cm_best && rh.mer_best && rh.cm_best.dow !== rh.mer_best.dow
        ? ` <b>But efficiency is not the same as value:</b> <b>${esc(rh.cm_best.name)}</b> actually contributes the most money (${fmtMoney(rh.cm_best.cm_per_day, cur)} a day against ${esc(rh.mer_best.name)}'s ${fmtMoney(rh.mer_best.cm_per_day, cur)}), even though its ratio is lower. A cheaper ratio on a bigger day is usually still the better day - follow the contribution margin, not the MER.`
        : ` A lower ratio does not make a day bad: a bigger day can contribute more money at a weaker MER, so read the CM column before cutting anything.`}` : ''}</div></div>`
    : `<div class="notice warn">ℹ️ <div><b>No reliable weekly rhythm.</b> This client's weekdays swing about as much from month to month as they do from each other, so the shares below are close to chance - a month only contains four of each weekday. Read this as "every day is much the same", and do not build a story around it for the client.</div></div>`;

  return `<div class="card"><h3 style="margin-bottom:2px">How a week actually runs <span class="info-i" title="Share of revenue by weekday across the last complete months. The index range is that weekday compared with an average day, one figure per month - a day is only called consistent when every month agreed. This is history for context, NOT the plan: the monthly plan is split evenly across the days on purpose, because a day-of-week curve was measured to predict worse than an even split.">i</span></h3>
    <p class="hint" style="margin-bottom:10px">Based on ${esc(monthsLbl)} - the last ${rh.months.length} <b>complete</b> months, which roll forward on their own (in September this reads June–August). Three months rather than one because a single month holds only four of each weekday, which is far too few to tell a real pattern from chance - and with one month there is nothing to check it against. <b>This is what happened, not a target.</b> Your plan is still measured evenly across the month.</p>
    ${verdict}
    <div class="tbl-wrap" style="margin-top:12px"><table>
      <thead><tr><th>Day</th>
        <th class="num">Share of week <span class="info-i" title="This weekday's revenue as a share of the whole week. Seven equal days would be 14.3% each.">i</span></th>
        <th class="num">Compared with a normal day <span class="info-i" title="How far above or below a normal day this weekday landed - shown as its WORST month and its BEST month, so you can see the spread rather than one flattering average. Monday reading -28% to -15% means that in the weakest month Mondays came in 28% under a normal day and in the strongest month still 15% under: always below, never above. A range that crosses zero (say -10% to +12%) means the day landed above average in one month and below in another, which is noise, not a pattern.">i</span></th>
        <th></th>
        <th class="num">MER <span class="info-i" title="How hard each ad dollar worked on that weekday - revenue divided by ad spend, pooled across the window. This is a RATIO, not a verdict on the day: a less efficient day that does more volume can still contribute more money, which is why the contribution margin column sits next to it. A day is tagged consistently above or below only when it beat, or trailed, this client's own average in every month looked at - more than one day can qualify, so these are not superlatives.">i</span></th>
        ${cmOk ? `<th class="num">CM per day <span class="info-i" title="Contribution margin the average day of this weekday actually produced - revenue minus product costs, fulfilment, fees and ad spend. THIS is what the day is worth. A day can be less efficient than another and still make more money, because it does more volume; when the two disagree, follow the money.">i</span></th>` : ''}
        ${wk != null ? `<th class="num">Your plan, split this way <span class="info-i" title="NOT a historical average. This takes THIS MONTH'S plan, divides it to a week, then splits that week across the days using the shares on the left. It answers: if the month goes to plan and the week keeps its usual shape, what would each day look like? Illustrative only - the Daily Brief still measures every day against an even split.">i</span></th>` : ''}
      </tr></thead>
      <tbody>${rows}</tbody></table></div>
    ${wk != null && rh.reliable ? `<p class="tiny" style="margin-top:8px">The last column spreads a <b>${fmtMoney(wk, cur)}</b> week (your ${esc(monthLabel(rh.plan.month))} plan ÷ ${rh.plan.days_in_month} × 7) across the days by their measured share. Useful for setting expectations on a call - <b>not</b> what the Daily Brief compares against.</p>` : ''}
  </div>`;
}

async function renderProfit(first) {
  if (S.act === 'all') return renderProfitAll();
  const run = ++RUN;
  const shell = (title, body) => `<div class="v2 lx">${LX.head('profit', title)}${body}</div>`;
  if (first) $('#main').innerHTML = shell('Profit', '<div class="card"><span class="hint">Loading…</span></div>');
  let d, fc = null;
  try { d = await api(`/api/client?act=${S.act}&${rangeQ()}`); }
  catch (e) { if (run === RUN) $('#main').innerHTML = shell('Profit', `<div class="card"><span style="color:var(--bad)">${esc(e.message)}</span></div>`); return; }
  try { fc = await api(`/api/forecast?act=${S.act}`); } catch { /* forecast is a bonus, never a blocker */ }
  // The weekday rhythm used to be fetched here; it lives on Plan now.
  if (run !== RUN) return;
  const U = window.V2UI;
  const cur = d.account.currency, t = d.totals, rows = d.rows || [];
  const acct = S.accounts.find(a => a.act_id === S.act);
  const h = acct?.cost_health;
  const trusted = cmTrusted(h) || d.margin_pct != null;
  const single = d.from === d.to, asOf = d.live_as_of ? fmtCentralTime(d.live_as_of) : null;
  const M = v => fmtMoney(v, cur), K = v => fmtK(v, cur);

  /* MONTH TO DATE AGAINST THE PLAN, from the same snapshot Overview reads, and labelled MTD
     because the headline figures follow the period control. `plan.sales` is the plan
     pro-rated to the days elapsed, so it is the right yardstick for an unfinished month. */
  const pm = acct?.plan, pmtd = acct?.mtd;
  const mtdMer = pmtd?.sales != null && pmtd?.spend ? pmtd.sales / pmtd.spend : null;
  const planMer = pm?.mer ?? (pm?.sales != null && pm?.spend ? pm.sales / pm.spend : null);
  const planLine = (a, p, fmt) => a != null && p != null ? `MTD ${fmt(a)} of ${fmt(p)} planned ${asOf ? 'through yesterday' : 'by now'}` : '';

  /* ONE SENTENCE FIRST: did this brand make money in the window, and is the month on plan. */
  const name = esc(d.account.name);
  const offMtd = pmtd?.sales != null && pm?.sales ? pmtd.sales / pm.sales - 1 : null;
  const monthBit = offMtd == null ? '' : Math.abs(offMtd) < 0.02 ? ' The month is running on plan.'
    : ` The month is <b class="${offMtd > 0 ? 'good' : offMtd > -0.08 ? 'warn' : 'bad'}">${Math.abs(Math.round(offMtd * 100))}% ${offMtd > 0 ? 'ahead of' : 'behind'}</b> its plan so far.`;
  const say = trusted && t.cm != null
    ? `${name} <b class="${t.cm >= 0 ? 'good' : 'bad'}">${t.cm >= 0 ? 'kept' : 'lost'} ${M(Math.abs(t.cm))}</b> after every cost: ${t.sales ? fmtPct(Math.abs(t.cm) / t.sales) : '–'} of ${M(t.sales)} revenue, at ${fmtX(t.mer)} MER.${monthBit}`
    : `${name} took <b>${M(t.sales)}</b> on ${M(t.spend)} of ad spend, ${fmtX(t.mer)} MER. Profit is hidden until the cost data passes on Costs.${monthBit}`;

  /* The tiles: each with its daily sparkline (hover reads the day) and, where a plan exists,
     the month-to-date line and goal bullet underneath. */
  const ser = k => rows.map(r => r[k] ?? null);
  const tipsOf = (k, f) => rows.map(r => `<b>${U.day(r.date)}</b> · ${r[k] == null ? '–' : f(r[k])}`);
  const sp = (k, f) => rows.length > 1 ? LX.spark(ser(k), tipsOf(k, f)) : '';
  const aovRows = rows.map(r => r.orders ? r.sales / r.orders : null);
  const v = h?.verdict;
  const costWord = d.margin_pct != null || v === 'override' ? ['Flat margin', 'warn', `Profit here is priced at a flat ${Math.round((d.margin_pct ?? h?.blended ?? 0) * 100)}% margin, so it is estimated, not measured.`]
    : !h || v === 'none' ? ['Not checked', '', 'No cost verdict has been recorded for this brand. Open Costs to run the check.']
    : v === 'good' ? ['Measured', 'good', `${h.days ? h.days + ' days checked. ' : ''}Product, delivery, handling and fees all recorded, with no day where cost beat revenue.`]
    : v === 'noisy' ? ['Noisy days', 'warn', `${h.reason || ''} The figures stand; the flagged days are listed on Costs.`]
    : ['Suppressed', 'bad', `${h.reason || 'cost data is unreliable'}. Revenue and efficiency are still right; only cost-based figures are hidden.`];
  const tiles = [
    LX.tile({ label: 'Revenue', value: M(t.sales), spark: sp('sales', M), info: 'Net Sales + Shipping: Shopify Total Sales minus sales tax. Gross sales, less discounts and returns, plus shipping customers paid, less tax. Every channel, never a platform’s attributed revenue.',
      bullet: pmtd?.sales != null && pm?.sales ? U.bullet(pmtd.sales, pm.sales, false, 'plan by now') : '',
      sub: `${asOf ? `so far today · as of ${asOf}` : `${t.days} days`}${planLine(pmtd?.sales, pm?.sales, K) ? `<br>${planLine(pmtd?.sales, pm?.sales, K)} ${mtdPill(pmtd?.sales, pm?.sales, 'sales')}` : ''}` }),
    LX.tile({ label: 'Ad spend', value: M(t.spend), spark: sp('spend', M), info: 'Every ad platform combined, from Triple Whale. Falls back to Meta + Google spend if the blended figure is unavailable. Spend is a decision, so it carries no good or bad colour.',
      sub: `${[t.meta_spend != null ? `Meta ${K(t.meta_spend)}` : '', t.google_spend != null ? `Google ${K(t.google_spend)}` : ''].filter(Boolean).join(' · ')}${planLine(pmtd?.spend, pm?.spend, K) ? `<br>${planLine(pmtd?.spend, pm?.spend, K)} ${mtdPill(pmtd?.spend, pm?.spend, 'spend')}` : ''}` }),
    LX.tile({ label: 'MER', value: fmtX(t.mer), spark: sp('mer', fmtX), info: 'Marketing Efficiency Ratio: all store revenue divided by all ad spend. Blended on both sides, so no platform can double-count.',
      bullet: mtdMer != null && planMer != null ? U.bullet(mtdMer, planMer, false, 'planned MER') : '',
      sub: mtdMer != null && planMer != null ? `MTD ${fmtX(mtdMer)} against ${fmtX(planMer)} planned ${mtdPill(mtdMer, planMer, 'mer')}` : `${K(t.sales)} divided by ${K(t.spend)}` }),
    LX.tile({ label: 'aMER', value: fmtX(t.amer), spark: sp('amer', fmtX), info: 'Acquisition MER: new-customer revenue divided by that same total ad spend. Repeat buyers and email cannot flatter it.',
      sub: `${fmtPct(t.new_share)} of revenue was new customers` }),
    LX.tile({ label: 'Orders', value: t.orders == null ? '–' : fmtInt(t.orders), spark: sp('orders', fmtInt), info: 'Store orders from every channel (Triple Whale totalOrders). New customers = first-time orders.',
      sub: t.new_orders != null ? `${fmtInt(t.new_orders)} from new customers` : 'store orders, every channel' }),
    LX.tile({ label: 'Average order', value: M(t.aov), spark: rows.length > 1 ? LX.spark(aovRows, rows.map((r, i) => `<b>${U.day(r.date)}</b> · ${aovRows[i] == null ? '–' : M(aovRows[i])}`)) : '', info: 'Average order value: revenue divided by orders, store-wide. The same figure Reports and the Strategist use.',
      sub: t.new_aov != null ? `first order ${M(t.new_aov)}` : 'revenue divided by orders' }),
    trusted
      ? LX.tile({ label: 'Contribution margin', value: `<span class="${t.cm == null ? '' : t.cm >= 0 ? 'good' : 'bad'}">${M(t.cm)}</span>`, spark: sp('cm', M), info: 'What is left after product costs, fulfilment, fees and all ad spend. Not net profit: it ignores fixed costs like rent, salaries and software.',
          sub: `margin ${fmtPct(t.margin)} before ad spend` })
      : LX.tile({ label: 'Contribution margin', value: '<span style="color:var(--muted)">Hidden</span>', go: 'costs', info: 'Switched off because the cost data cannot be trusted. Open Costs to see why.', sub: 'cost data unreliable, open Costs' }),
    LX.tile({ label: 'Cost data', value: `<span class="${costWord[1]}">${costWord[0]}</span>`, go: 'costs', info: costWord[2], sub: esc(costWord[2]).slice(0, 110) + (costWord[2].length > 110 ? '…' : '') }),
  ].join('');

  /* THE WATERFALL IS THE SPINE: revenue at the top, every variable cost leaving in order, what
     was kept at the bottom. Each line is a bar from where the money stood, so the size of each
     cost reads against the revenue before any number is read. Hover a line for what it is. */
  const fall = (() => {
    if (!trusted) return '';
    const top = Math.max(t.sales || 0, (t.net_sales || 0) + (t.ship_rev || 0), 1);
    const P = x => Math.max(0, Math.min(100, x / top * 100)).toFixed(2);
    const bar = (from, to, cls) => `<div class="t"><i class="${cls}" style="left:${P(Math.min(from, to))}%;width:${P(Math.abs(to - from))}%"></i></div>`;
    const line = (label, note, from, to, cls, val, neg, em) => `<div class="r"${U.tipAttr(note)}><span class="l">${label}</span>${bar(from, to, cls)}<span class="n${neg ? ' neg' : ''}">${neg ? '−' : ''}${M(Math.abs(val ?? 0))}${em ? `<em>${em}</em>` : ''}</span></div>`;
    const tot = (label, note, val, cls, em) => `<div class="r tot"${U.tipAttr(note)}><span class="l">${label}</span>${bar(0, Math.max(0, val ?? 0) || (val < 0 ? Math.abs(val) : 0), cls)}<span class="n">${M(val)}${em ? `<em>${em}</em>` : ''}</span></div>`;
    const ofRev = x => t.sales ? `${fmtPct(x / t.sales)} of revenue` : '';
    let at = t.sales || 0; const out = [];
    const leave = (label, note, x) => { if (!x) return; out.push(line(label, note, at - x, at, 'out', x, true, ofRev(x))); at -= x; };
    leave('Product costs', d.margin_pct != null ? `Implied by the ${Math.round(d.margin_pct * 100)}% flat margin override.` : 'Cost of goods sold, from Triple Whale.', t.cogs);
    leave('Fulfilment', 'What delivery actually cost.', t.ship_cost);
    leave('Handling', 'Pick, pack and handling fees.', t.handling);
    leave('Payment fees', 'Gateway and processing.', t.fees);
    return `<section class="card v2card"><div class="v2h"><h3>Where the money went</h3><span class="find">${t.cm != null ? `${M(t.sales)} came in; <b class="${t.cm >= 0 ? 'good' : 'bad'}">${M(t.cm)}</b> was ${t.cm >= 0 ? 'left' : 'lost'} after every variable cost.` : ''}</span></div>
      <div class="pnl-fall">
        ${line('Net sales', 'Products only, after discounts and returns. Matches Shopify’s Net Sales.', 0, t.net_sales || 0, 'in', t.net_sales)}
        ${t.ship_rev ? line('Shipping charged', 'What customers paid for delivery.', t.net_sales || 0, (t.net_sales || 0) + t.ship_rev, 'in', t.ship_rev) : ''}
        ${tot('Revenue', 'Net Sales + Shipping: the revenue line every other number here uses.', t.sales, 'in')}
        ${t.tax ? `<div class="r note"${U.tipAttr('Sales tax is held for the state, never revenue.' + (t.total_sales ? ` Shopify Total Sales was ${M(t.total_sales)}.` : ''))}><span class="l">Sales tax collected, excluded</span><span></span><span class="n">${M(t.tax)}</span></div>` : ''}
        ${out.join('')}
        ${tot('Gross profit', 'Revenue less every variable cost, before any marketing.', t.gross_profit, 'in', `${fmtPct(t.margin)} of revenue`)}
        ${t.spend ? line('Ad spend', 'Every ad platform combined.', (t.gross_profit || 0) - t.spend, t.gross_profit || 0, 'out', t.spend, true, ofRev(t.spend)) : ''}
        ${tot('Contribution margin', 'What the marketing made on the margin. Fixed costs (rent, salaries, software, our retainer) are not in it.', t.cm, t.cm >= 0 ? 'keep' : 'lose', ofRev(t.cm))}
      </div>
      <details class="footnote" style="margin-top:12px"><summary>What contribution margin counts, and what it leaves out</summary>
        <div class="fn-body">This is CTC's definition: revenue minus <b>every variable cost</b> (product, fulfilment, handling, payment fees and ad spend). Fixed costs are deliberately excluded: rent, salaries, software and <b>our own retainer</b>. So it answers "did the marketing make money on the margin?", not "is the business profitable?"${d.shipping && d.shipping.note ? ` <br><b>Shipping:</b> ${esc(d.shipping.note)}.` : ''}</div></details></section>`;
  })();

  /* By day (or by hour on a single day), with the reading under the pointer. */
  const hours = d.hours || [];
  let cs = 0, cp = 0; const cum = hours.map(r => ({ s: (cs += r.sales || 0), p: (cp += r.spend || 0) }));
  const chartCard = single
    ? `<section class="v2card"><div class="v2h"><h3>${asOf ? 'Today so far' : 'Yesterday'}, hour by hour</h3><span class="cap">Triple Whale${asOf ? `, as of ${esc(asOf)}` : ''}</span></div>
        ${hours.length ? U.legend([{ color: '--brand', label: 'Revenue' }, { color: '--c-google', label: 'Ad spend' }]) + LX.chart('pfHours', {
          xs: hours.map(r => r.hour), xl: hours.map(r => hourWord(r.hour)), cur, ticks: [0, 3, 6, 9, 12, 15, 18, 21].filter(i => i < hours.length),
          series: [{ vals: hours.map(r => r.sales || 0), color: '--brand' }, { vals: hours.map(r => r.spend || 0), color: '--c-google', w: 1.6 }],
          tips: hours.map((r, i) => `<b>${hourWord(r.hour)}</b> · revenue ${M(r.sales)} · spend ${M(r.spend)}<br><span class="faint">By then ${M(cum[i].s)} on ${M(cum[i].p)} spend</span>`) })
          : '<p class="v2hint">Triple Whale has not reported any hours for this day yet.</p>'}
        <div style="margin-top:8px"><button class="v2link" type="button" id="pfToToday">Open Meta, Today, for spend pacing against a normal day ›</button></div></section>`
    : `<section class="v2card"><div class="v2h"><h3>Revenue against ad spend, day by day</h3><span class="find">The gap is what was left after ads, before product costs and fees.</span></div>
        ${LX.dual('pfSvg', rows, cur)}</section>`;

  const whoCard = `<section class="v2card"><div class="v2h"><h3>Who the money came from</h3><span class="find">${fmtPct(t.new_share)} from first-time buyers.</span></div>
      ${t.new_share != null ? `<div class="v2stackbar"><i style="flex:${Math.max(0, t.new_rev || 0)};background:var(--brand)"${U.tipAttr(`New customers: ${M(t.new_rev)}`)}></i><i style="flex:${Math.max(0, t.ret_rev || 0)};background:var(--c-email)"${U.tipAttr(`Returning customers: ${M(t.ret_rev)}`)}></i></div>
      <div class="v2stacklab"><span><i style="background:var(--brand)"></i>New ${K(t.new_rev)}</span><span><i style="background:var(--c-email)"></i>Returning ${K(t.ret_rev)}</span>${t.email_rev ? `<span>Klaviyo email placed ${K(t.email_rev)} (${fmtPct(t.email_share)}), across both</span>` : ''}</div>` : '<p class="v2hint">No new-vs-returning split for this window.</p>'}
      <p class="v2hint" style="margin-top:6px">What a customer costs, what they are worth over time and what they buy first and next is on <button type="button" class="v2link" data-go="customers">Customers ›</button></p></section>`;

  pageActions(`${healthPill(h)}<button class="btn" id="pfShare">↗ Client link</button>`);
  $('#main').innerHTML = shell(`Profit: ${name}`, `
    ${LX.say(say)}
    ${d.shipping?.mode === 'uncosted' ? `<div class="notice warn"><div><b>Shipping income has no cost behind it.</b> ${esc(d.shipping.note)}. See <b>Costs</b> for what that is worth.</div></div>` : ''}
    ${!trusted ? `<div class="notice bad"><div><b>Profit figures are suppressed for this client.</b> ${esc(h?.reason || 'cost data is unreliable')}. Revenue and efficiency are still accurate; only the cost-based figures are hidden. <button type="button" class="link" data-go="costs">Open Costs</button></div></div>` : ''}
    <div class="v2tiles">${tiles}</div>
    <div class="v2two">
      <div style="display:flex;flex-direction:column;gap:16px;min-width:0">${fall || chartCard}${fc && fc.mtd ? forecastCard(fc, cur) : ''}</div>
      <div style="display:flex;flex-direction:column;gap:16px;min-width:0">${fall ? chartCard : ''}${whoCard}</div>
    </div>
    ${U.foot(`Revenue is Shopify total sales minus tax, through Triple Whale. ${esc(rangeLabel())}.`)}`);

  // [data-go] (tiles, links) is handled by the one document-level listener near applyRole().
  if (single) LX.wireChart('pfHours');
  else if (rows.length > 1) LX.wireDual('pfSvg', rows, r => `<b>${U.day(r.date)}</b> · revenue ${M(r.sales)} · spend ${M(r.spend)}<br>MER ${fmtX(r.mer)} · aMER ${fmtX(r.amer)}${r.cm != null && trusted ? ` · CM <span class="${r.cm >= 0 ? '' : 'faint'}">${M(r.cm)}</span>` : ''}`);
  const tt = $('#pfToToday'); if (tt) tt.onclick = () => { localStorage.setItem(MSUB.key, 'today'); show('meta'); };

  const shareBtn = $('#pfShare');
  if (shareBtn) shareBtn.onclick = async () => {
    try {
      const r = await api('/api/profit-share', { method: 'POST', body: JSON.stringify({ act: S.act }) });
      /* SEND THE WINDOW YOU ARE LOOKING AT. The token is one stable URL per client, so the
         range rides in the query string. Month-to-date is the one preset that stays live. */
      const rg = resolveRange();
      const url = rg.preset === 'mtd' ? r.url
        : `${r.url}&from=${encodeURIComponent(rg.from)}&to=${encodeURIComponent(rg.to)}`;
      if (navigator.clipboard) navigator.clipboard.writeText(url).catch(() => {});
      noteModal('Client link ready', `<p>A read-only page with <b>${esc(d.account.name)}</b>'s ${rg.preset === 'mtd' ? 'month so far' : `<b>${esc(prettyDate(rg.from))} to ${esc(prettyDate(rg.to))}</b>`}: revenue, ad spend, MER and contribution margin${rg.preset === 'mtd' ? ' against the plan' : ''}.</p>
        ${rg.preset === 'mtd' ? '' : '<p class="tiny">This link is pinned to that window, so it shows the same figures whenever they open it. Comparison against the monthly plan is left off, because a plan is agreed per month and this window may not be one.</p>'}
        <p class="tiny">It shows this client only: no other account, and none of the cost diagnostics from the Costs tab. Contribution margin is left out automatically if the cost data would not pass our own trust check.</p>
        <p><code style="word-break:break-all">${esc(r.url)}</code></p><p class="tiny">Copied to your clipboard.</p>`);
    } catch (e) { noteModal('Could not create the link', `<p>${esc(e.message)}</p>`); }
  };
}

/* ---------- Data Health ----------
 *
 * The page that exists so nobody has to ask why a number looked wrong.
 *
 * It is deliberately ALL BRANDS, always - the client picker is ignored here.
 * The September 2026 outage hit five brands at once, and a per-client page
 * would have shown five separate mysteries instead of one story. Broken brands
 * sort to the top; a green page is meant to be read in two seconds and closed.
 *
 * Every red line carries its own fix, and the two buttons under it are the
 * whole repair: Re-sync pulls Triple Whale again, Rebuild regenerates the
 * drafts that were built from the bad numbers. Rebuild walks one day at a time
 * with progress, because each one is a full brief (~22 of a 50-subrequest
 * budget) and a parallel loop would die halfway.
 */
const HEALTH_PILL = { ok: ['good', '✓ Agrees'], warn: ['warn', '⚠ Check'], broken: ['bad', '✕ Broken'], unknown: ['warn', '? Unknown'] };

async function renderHealth(first) {
  const run = ++RUN;
  $('#main').innerHTML = `<div class="v2 lx">${backToSettings()}${LX.head('health', 'Data Health')}<div class="card"><p class="hint">Checking every brand against Meta and the other platforms…</p></div></div>`;
  let d;
  try { d = await api('/api/data-health?act=all&days=14'); }
  catch (err) { if (run === RUN) $('#main').innerHTML = `<div class="v2 lx">${backToSettings()}${LX.head('health', 'Data Health')}<div class="card"><span style="color:var(--bad)">The check could not run: ${esc(err.message)}</span> <button class="btn" type="button" onclick="show('health')">Try again</button></div></div>`; return; }
  if (run !== RUN) return;
  let brands = d.brands || [];

  const badDaysOf = b => (b.days || []).filter(x => x.issues?.some(i => i.severity === 'broken'));

  const topHtml = () => {
    const broken = brands.filter(b => b.verdict === 'broken');
    const warn = brands.filter(b => b.verdict === 'warn');
    /* The verdict as one sentence (2026-10-08), coloured by what it means. */
    return broken.length
      ? LX.say(`<b class="bad">${broken.length} brand${broken.length === 1 ? '' : 's'} cannot be reported on right now.</b>
          ${broken.length === brands.length ? 'Every brand is affected, which almost always means one integration, not six.' : ''}
          Nothing has gone to a client: a flagged day is refused at send, whoever asks for it.`)
      : warn.length
      ? LX.say(`<b class="warn">Everything adds up, with ${warn.length} thing${warn.length === 1 ? '' : 's'} worth a look.</b> Nothing here blocks a send.`)
      : LX.say(`<b class="good">Triple Whale agrees with every platform it reports, across all ${brands.length} brands.</b> The last 14 days are safe to send.`);
  };

  const cardHtml = b => {
    const [cls, label] = HEALTH_PILL[b.verdict] || HEALTH_PILL.unknown;
    const bad = badDaysOf(b);
    /* One line per DISTINCT problem, not per day. Six days of one broken
       connection is one thing to fix, and listing it six times buries it. */
    const seen = new Map();
    for (const day of (b.days || [])) {
      for (const i of (day.issues || [])) {
        const k = `${i.code}|${i.label || ''}`;
        if (!seen.has(k)) seen.set(k, { ...i, dates: [] });
        seen.get(k).dates.push(day.date);
      }
    }
    for (const i of (b.issues || [])) seen.set(`acct|${i.code}`, { ...i, dates: [] });
    const lines = [...seen.values()].map(i => `<div class="hl-issue ${i.severity}">
        <div><b>${esc(i.what)}</b>${i.dates.length ? ` <span class="tiny">· ${i.dates.length === 1 ? prettyDay(i.dates[0]) : `${i.dates.length} days, ${prettyDay(i.dates[0])} → ${prettyDay(i.dates[i.dates.length - 1])}`}</span>` : ''}</div>
        <div class="tiny">${esc(i.fix)}</div>
      </div>`).join('');
    const rows = bad.slice(-7).map(x => `<tr>
        <td>${prettyDay(x.date)}</td>
        <td class="num">${fmtMoney(x.tw_blended, b.account.currency)}</td>
        <td class="num">${fmtMoney(x.meta_api, b.account.currency)}</td>
        <td class="num"><b>${fmtMoney(x.spend, b.account.currency)}</b></td>
        <td class="tiny">${x.source === 'rebuilt' ? 'rebuilt from platforms' : x.source === 'triple_whale' ? 'Triple Whale' : esc(x.source)}</td>
      </tr>`).join('');
    /* Drafts are listed WHATEVER the verdict.
       A brand can be green - the feed repaired, every day agreeing - while its
       unsent drafts still carry the numbers from when it was broken. That is
       exactly what happened on 2026-09-05, and the old page answered it by
       taking the Rebuild button away. Health is about the data; a draft is a
       copy of the data taken at a moment. */
    const drafts = b.drafts || [];
    const stale = drafts.filter(x => x.written_before_last_sync);
    /* An internal-only brand's briefs are 'handled', not unsent - they still
       list here because a rebuild is still useful when the numbers were wrong. */
    const allHandled = drafts.length && drafts.every(x => x.status === 'handled');
    const draftBlock = drafts.length ? `<div class="hl-drafts">
        <div class="tiny" style="margin-bottom:6px"><b>${drafts.length} ${allHandled ? 'internal brief' : 'unsent draft'}${drafts.length === 1 ? '' : 's'}</b>${stale.length ? ` · ${stale.length} written before the latest Triple Whale refresh, so ${stale.length === 1 ? 'it may be' : 'they may be'} carrying older numbers` : ' · all written since the latest refresh'}</div>
        ${drafts.map(x => `<div class="hl-draft">
          <span>${prettyDay(x.date)}</span>
          <span class="tiny">${x.status === 'skipped' ? 'marked don’t-send' : x.status === 'handled' ? 'handled · internal only' : 'draft'}${x.posted_at ? ` · written ${esc(fmtAgo(x.posted_at))}` : ''}${x.written_before_last_sync ? ' · <b>older than the data</b>' : ''}</span>
          <button class="btn" data-hl="rebuildday" data-date="${esc(x.date)}">Rebuild</button>
        </div>`).join('')}
      </div>` : '';
    return `<div class="card hl-card" data-act="${esc(b.account.act_id)}">
      <div class="row" style="justify-content:space-between;align-items:flex-start;gap:12px">
        <div><h3 style="margin:0 0 2px">${esc(b.account.name)}</h3>
          <p class="tiny" style="margin:0">Triple Whale last refreshed ${esc(fmtAgo(b.last_sync))}${b.from ? ` · checked ${prettyDay(b.from)} → ${prettyDay(b.to)}` : ''}</p></div>
        <span class="pill ${cls}">${label}</span>
      </div>
      <p style="margin:10px 0 ${lines ? '10px' : '0'}">${esc(b.headline)}</p>
      ${lines}
      ${rows ? `<div class="tbl-wrap" style="margin-top:10px"><table>
        <thead><tr><th>Day</th><th class="num">Triple Whale said</th><th class="num">Meta’s own figure</th><th class="num">Spend we used</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table></div>` : ''}
      ${draftBlock}
      <div class="row" style="margin-top:12px;gap:8px;flex-wrap:wrap">
        <button class="btn" data-hl="sync">↻ Re-sync this brand</button>
        ${bad.length ? `<button class="btn primary" data-hl="rebuild">Rebuild ${bad.length} flagged draft${bad.length === 1 ? '' : 's'}</button>` : ''}
        ${!bad.length && stale.length ? `<button class="btn primary" data-hl="rebuildstale">Rebuild ${stale.length} draft${stale.length === 1 ? '' : 's'} older than the data</button>` : ''}
        <span class="tiny" data-hl="msg"></span>
      </div>
    </div>`;
  };

  /* True while a fleet-wide job owns the bar. A per-brand card finishing at the
     same moment must not repaint over its progress line and re-enable its
     buttons mid-run. */
  let barBusy = false;
  const paintBar = () => {
    if (barBusy) return;
    const total = brands.reduce((n, b) => n + badDaysOf(b).length, 0);
    $('#hlBar').innerHTML = `<button class="btn" data-hl="syncall">↻ Re-sync all brands</button>
      ${total ? `<button class="btn primary" data-hl="rebuildall">Rebuild all ${total} flagged draft${total === 1 ? '' : 's'}</button>` : ''}
      <span class="tiny" data-hl="barmsg"></span>`;
  };

  /* Repaint ONE card in place.
   *
   * The first version called show('health') after a per-brand sync, which
   * repainted the entire page - so a second brand could not be started while
   * the first was still running, and the whole point of the page (a fleet-wide
   * outage, six brands to fix) was the case it handled worst. Cards are
   * independent now: each owns its buttons, its message line and its own
   * refresh, so several can run at once. */
  const repaintCard = async act => {
    const fresh = await api(`/api/data-health?act=${encodeURIComponent(act)}&days=14`);
    const nb = (fresh.brands || [])[0];
    if (!nb) return;
    brands = brands.map(b => b.account.act_id === act ? nb : b);
    const el = $(`.hl-card[data-act="${CSS.escape(act)}"]`);
    if (el) el.outerHTML = cardHtml(nb);
    $('#hlTop').innerHTML = topHtml();
    paintBar();
  };

  $('#main').innerHTML = `<div class="v2 lx">${backToSettings()}${LX.head('health', 'Data Health')}
    <div id="hlTop">${topHtml()}</div>
    <div class="lx-bar" id="hlBar"></div>
    <p class="hint" style="margin:0">Every blended number in Locus comes through Triple Whale. This checks it against the one source that owes it nothing - <b>Meta’s own API</b> - and watches every other platform for a connection that has gone quiet. Covering the last 14 complete days. Each brand runs on its own, so you can start several at once without waiting.</p>
    <div id="hlList">${brands.map(cardHtml).join('')}</div>
    <p class="tiny">Meta is the only platform with a second source, so a missing Meta figure is repaired automatically and marked <i>rebuilt</i>. Everything else (Google, TikTok, store revenue, product costs) can only be flagged, never reconstructed, until those platforms are connected to Locus directly.</p></div>`;
  paintBar();

  /* Delegated onto #hlBar and #hlList, NEVER onto #main.
   *
   * #main survives every render, so a listener attached there stacks one copy
   * per visit to the tab and the third visit fires three syncs - the exact
   * trap already documented in CLAUDE.md. These two nodes are rebuilt by this
   * render, so their listeners die with them, while cards replaced INSIDE
   * #hlList keep working with nothing rebound. */
  const onClick = async e => {
    const btn = e.target.closest('button[data-hl]');
    if (!btn) return;
    const kind = btn.dataset.hl;

    /* ---- fleet-wide ---- */
    if (kind === 'syncall' || kind === 'rebuildall') {
      const bar = $('#hlBar');
      const msg = bar.querySelector('[data-hl="barmsg"]');
      const lock = on => { barBusy = on; bar.querySelectorAll('button').forEach(x => { x.disabled = on; x.style.opacity = on ? .55 : 1; }); };
      try {
        lock(true);
        if (kind === 'syncall') {
          msg.textContent = `Pulling the last 45 days for all ${brands.length} brands…`;
          /* act=all loops server-side in ONE request. Safe because this worker
             runs on the paid subrequest ceiling (10,000, not 50) - see the
             budget note in account-health/CLAUDE.md before reusing this shape
             anywhere that loops brands. */
          await api('/api/tw-sync?act=all&days=45', { method: 'POST' });
          msg.textContent = 'Re-synced. Re-checking every brand…';
          const fresh = await api('/api/data-health?act=all&days=14');
          brands = fresh.brands || brands;
          $('#hlTop').innerHTML = topHtml();
          $('#hlList').innerHTML = brands.map(cardHtml).join('');
          lock(false);                       // drops barBusy so paintBar may draw
          paintBar();
          return;
        }
        const jobs = brands.flatMap(b => badDaysOf(b).map(x => [b, x.date]));
        const nBrands = new Set(jobs.map(j => j[0].account.act_id)).size;
        if (!(await confirmModal(`Rebuild ${jobs.length} draft${jobs.length === 1 ? '' : 's'} across ${nBrands} brand${nBrands === 1 ? '' : 's'}?`,
          'Each day is regenerated from the data as it stands now, including the written summary. Any wording you had edited on those drafts is replaced. Days already sent to a client are left alone.', 'Rebuild them all'))) return lock(false);
        let done = 0; const failed = [];
        for (const [b, date] of jobs) {
          msg.textContent = `Rebuilding ${b.account.name}, ${prettyDay(date)}… (${done + 1} of ${jobs.length})`;
          try { await api('/api/brief-rebuild', { method: 'POST', body: JSON.stringify({ act: b.account.act_id, date }) }); done++; }
          catch (err) { failed.push(`${b.account.name} ${prettyDay(date)}: ${err.message}`); }
        }
        msg.textContent = `${done} draft${done === 1 ? '' : 's'} rebuilt${failed.length ? ` · ${failed.length} could not be: ${failed.join('; ')}` : ' - read them on the Daily Brief tab.'}`;
        const summary = msg.textContent;
        const fresh = await api('/api/data-health?act=all&days=14').catch(() => null);
        if (fresh) { brands = fresh.brands || brands; $('#hlTop').innerHTML = topHtml(); $('#hlList').innerHTML = brands.map(cardHtml).join(''); }
        lock(false);
        paintBar();
        const bm = $('#hlBar [data-hl="barmsg"]');
        if (bm) bm.textContent = summary;
      } catch (err) { msg.textContent = err.message; lock(false); }
      return;
    }

    /* ---- one brand, independently of every other ---- */
    const cardEl = btn.closest('.hl-card');
    if (!cardEl) return;
    const act = cardEl.dataset.act;
    const b = brands.find(x => x.account.act_id === act);
    const msg = cardEl.querySelector('[data-hl="msg"]');
    const lock = on => cardEl.querySelectorAll('button[data-hl]').forEach(x => { x.disabled = on; x.style.opacity = on ? .55 : 1; });
    try {
      lock(true);
      if (kind === 'sync') {
        msg.textContent = 'Pulling the last 45 days from Triple Whale…';
        await api(`/api/tw-sync?act=${encodeURIComponent(act)}&days=45`, { method: 'POST' });
        msg.textContent = 'Re-synced, re-checking…';
        await repaintCard(act);            // this card only; the others keep running
        return;
      }
      const days = kind === 'rebuildday' ? [btn.dataset.date]
        : kind === 'rebuildstale' ? (b.drafts || []).filter(x => x.written_before_last_sync).map(x => x.date)
        : badDaysOf(b).map(x => x.date);
      if (!(await confirmModal(`Rebuild ${days.length} draft${days.length === 1 ? '' : 's'} for ${b.account.name}?`,
        'Each day is regenerated from the data as it stands now, including the written summary. Any wording you had edited on those drafts is replaced. Days already sent to the client are left alone.', 'Rebuild them'))) return lock(false);
      let done = 0; const failed = [];
      for (const date of days) {
        msg.textContent = `Rebuilding ${prettyDay(date)}… (${done + 1} of ${days.length})`;
        try { await api('/api/brief-rebuild', { method: 'POST', body: JSON.stringify({ act, date }) }); done++; }
        catch (err) { failed.push(`${prettyDay(date)}: ${err.message}`); }
      }
      const summary = `${done} draft${done === 1 ? '' : 's'} rebuilt${failed.length ? ` · ${failed.length} could not be: ${failed.join('; ')}` : ' - read them on the Daily Brief tab.'}`;
      // Refresh the card so the "written" times and the stale flags are true again.
      await repaintCard(act).catch(() => {});
      const line = $(`.hl-card[data-act="${CSS.escape(act)}"] [data-hl="msg"]`);
      if (line) line.textContent = summary; else msg.textContent = summary;
      lock(false);
    } catch (err) { msg.textContent = err.message; lock(false); }
  };
  $('#hlBar').addEventListener('click', onClick);
  $('#hlList').addEventListener('click', onClick);
}

/** "Sep 3" - the same shape the briefs use, so a date reads the same everywhere. */
const prettyDay = ymd => ymd ? new Date(`${ymd}T12:00:00Z`).toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' }) : ' - ';

async function renderCosts(first) {
  if (S.act === 'all') {
    const bad = S.accounts.filter(a => !cmTrusted(a.cost_health));
    const noisy = S.accounts.filter(a => a.cost_health?.verdict === 'noisy');
    $('#main').innerHTML = `<div class="v2 lx">${backToSettings()}${LX.head('costs', 'Costs')}
      ${LX.say(bad.length ? `<b class="bad">${bad.length} brand${bad.length === 1 ? ' has' : 's have'} cost data Locus cannot trust</b>, so ${bad.length === 1 ? 'its' : 'their'} profit figures are hidden: ${bad.map(a => esc(a.name)).join(', ')}.`
        : noisy.length ? `<b class="warn">Cost data holds up, with ${noisy.length} noisy brand${noisy.length === 1 ? '' : 's'}</b>: ${noisy.map(a => esc(a.name)).join(', ')}. Profit still shows; treat it as directional.`
        : '<b class="good">Every brand’s cost data holds up</b>, so every profit figure in Locus is measured, not guessed.')}
      
      <div class="card"><div class="tbl-wrap"><table>
        <thead><tr><th>Client</th><th>Product costs</th><th class="num">Trailing margin</th><th class="num">Daily range</th><th class="num">Bad days</th><th>Fulfilment <span class="info-i" title="Whether Triple Whale holds a real delivery rate for this client. 'Measured' means it does. 'Not measured' means the recorded cost is just the shipping charge copied back, so fulfilment cancels itself out of contribution margin. 'Nothing recorded' means customers were charged for delivery and no cost was booked against any of it.">i</span></th><th></th></tr></thead>
        <tbody>${S.accounts.map(a => { const h = a.cost_health, s = a.shipping; return `<tr data-id="${a.act_id}" style="cursor:pointer">
          <td><b>${esc(a.name)}</b></td>
          <td>${healthPill(h)}<br><span class="tiny">${esc(h?.reason || (h?.verdict==='good'?'stable day to day':''))}</span></td>
          <td class="num">${h?.blended!=null?fmtPct(h.blended):' - '}</td>
          <td class="num tiny">${h?.p10!=null?`${Math.round(h.p10*100)}% – ${Math.round(h.p90*100)}%`:' - '}</td>
          <td class="num">${h?.negatives ? `<span class="pill bad">${h.negatives}</span>` : h ? '0' : ' - '}</td>
          <td>${shipPill(s)}${s && s.rev_per_order != null && s.mode !== 'none' ? `<br><span class="tiny">${fmtMoney(s.rev_per_order, a.currency)}/order charged${s.mode === 'measured' ? ` → ${fmtMoney(s.cost_per_order, a.currency)} to ship` : ', nothing booked'}</span>` : ''}</td>
          <td><button class="btn" data-act="open">Open</button></td></tr>`; }).join('')}
        </tbody></table></div>
        <p class="tiny" style="margin-top:10px">"Bad days" are days where recorded product costs exceeded revenue - a sure sign only some products have COGS set. Any client marked <b>cost data ⚠</b> has all profit figures suppressed, here and in the Daily Brief.<br><b>Fulfilment</b> is the second variable cost, and it fails more quietly than COGS: where no delivery rate is set, Triple Whale copies the shipping <i>charge</i> into the cost field, the two cancel, and contribution margin is left carrying no delivery cost at all - with nothing on screen to say so. Open a client to see what that is worth.</p></div></div>`;
    $('#main tbody').addEventListener('click', e => {
      const tr = e.target.closest('tr[data-id]'); if (!tr) return;
      S.act = tr.dataset.id; localStorage.setItem(LS.act, S.act);
      $('#clientPick').value = S.act; show('costs');
    });
    return;
  }

  const run = ++RUN;
  if (first) $('#main').innerHTML = `<div class="v2 lx">${backToSettings()}${LX.head('costs', 'Costs')}<div class="card"><span class="hint">Checking the last 60 days…</span></div></div>`;
  let d;
  try { d = await api(`/api/costs?act=${S.act}&days=60`); }
  catch (e) { if (run === RUN) $('#main').innerHTML = `<div class="v2 lx">${backToSettings()}${LX.head('costs', 'Costs')}<div class="card"><span style="color:var(--bad)">${esc(e.message)}</span></div></div>`; return; }
  if (run !== RUN) return;
  const cur = d.account.currency, h = d.health;
  const u = h.underlying || h;
  const r = u.retail || null;   // margin measured only on days cost and revenue agree
  const winSales = (d.rows || []).reduce((a, x) => a + (x.sales || 0), 0);

  /* The daily margin as a v2 chart with the zero line, hover for each day (2026-10-08). */
  const mRows = (d.rows || []).filter(x => x.margin != null);
  const marginChart = mRows.length > 1 ? LX.chart('csMargin', { xs: mRows.map((_, i) => i), xl: mRows.map(x => window.V2UI.day(x.date)), h: 200,
      fmt: v => Math.round(v * 100) + '%',
      series: [{ vals: mRows.map(x => x.margin), color: '--brand' }],
      tips: mRows.map(x => `<b>${window.V2UI.day(x.date)}</b> · margin ${fmtPct(x.margin)}${x.sales != null ? `<br><span class="faint">revenue ${fmtMoney(x.sales, cur)}${x.cogs != null ? ` · product cost ${fmtMoney(x.cogs, cur)}` : ''}</span>` : ''}`) })
    : '<p class="v2hint">No cost data to chart.</p>';
  $('#main').innerHTML = `<div class="v2 lx">${backToSettings()}${LX.head('costs', `Costs: ${esc(d.account.name)}`)}
    <div class="lx-bar">${healthPill(h)}${shipPill(d.shipping, true)}<span class="lx-msg">Last 60 days of daily margin, which is what shows whether the cost data holds up.</span></div>
    ${h.verdict === 'broken' ? `<div class="notice bad">⚠️ <div><b>Cost data can't be trusted, so profit figures are suppressed.</b> ${esc(h.reason)}.${r ? ` On the <b>${r.clean_days} of ${r.total_days} days</b> where cost and revenue line up, this client runs a <b>${fmtPct(r.margin)} margin</b> - the other ${r.flagged_days} days carry <b>${fmtMoney(r.unexplained_cost, cur)}</b> of product cost the store's own revenue can't explain. That is the signature of wholesale orders paid outside Shopify, or inventory deliveries booked as a single day's cost - not of a broken product catalog.` : ''} Use the estimate below, or fix it at source in <b>Triple Whale → Settings → Costs</b>.</div></div>`
      : h.verdict === 'noisy' ? `<div class="notice warn">ℹ️ <div><b>Cost data is noisy.</b> ${esc(h.reason)}. Profit figures still show, but treat them as directional.</div></div>`
      : h.verdict === 'override' ? `<div class="notice${u.verdict === 'broken' ? ' warn' : ''}">✓ <div><b>Using a flat ${Math.round(d.margin_pct*100)}% margin.</b> Per-product costs are ignored for this client, so profit figures are stable everywhere including the Daily Brief. ${u.verdict === 'broken' ? `<b>The underlying Triple Whale data is still broken</b> (${esc(u.reason)}) - the override masks it, which is fine as a stopgap, but you lose per-product profitability until it's fixed. Everything below describes the real data, not the override.` : `The real data reads <b>${u.verdict}</b>${u.blended!=null?` at ${fmtPct(u.blended)} margin`:''} - clear the override below to use it.`}</div></div>`
      : h.verdict === 'none' ? `<div class="notice warn">ℹ️ <div><b>No cost data at all.</b> Triple Whale has no COGS for this client, so no profit figure can be calculated. Add costs in Triple Whale, or set a flat margin below.</div></div>`
      : `<div class="notice">✓ <div><b>Cost data looks solid</b> - margin is stable day to day across ${h.days} days. Profit figures for this client are trustworthy.</div></div>`}
    <div class="v2tiles">
      ${LX.tile({ compact: true, label: 'Trailing margin', value: u.blended != null ? fmtPct(u.blended) : '–', sub: `real cost data, 60 days${d.margin_pct != null ? ' (not the override)' : ''}`, info: 'Gross profit as a share of net sales across the whole window, before ad spend. Stable, believable numbers usually land between 30% and 85% depending on the product.' })}
      ${LX.tile({ compact: true, label: 'Daily range', value: u.p10 != null ? `${Math.round(u.p10 * 100)}% to ${Math.round(u.p90 * 100)}%` : '–', sub: '10th to 90th percentile', info: 'How much daily margin moves. Real cost data barely moves. A wide range means the product mix is being costed inconsistently: some products have costs, others do not.' })}
      ${LX.tile({ compact: true, label: 'Days cost beat revenue', value: `<span class="${u.negatives ? 'bad' : ''}">${u.negatives ?? 0}</span>`, sub: u.negatives ? 'revenue booked elsewhere' : 'none, as it should be', info: 'Days where recorded product cost exceeded everything the store took in. These almost always mean the product left the building but the money arrived somewhere Shopify cannot see: a wholesale order paid by invoice, or an inventory delivery booked as one day of cost.' })}
      ${LX.tile({ compact: true, label: 'Days checked', value: String(u.days ?? 0), sub: 'with both sales and cost data', info: 'How many days in the 60-day window had enough data to judge.' })}
    </div>
    <section class="card"><div class="v2h"><h3>Daily margin, last 60 days</h3><span class="find">Each day's margin before ad spend. Real cost data draws a nearly flat line; a drop below the red zero line is a day where cost beat revenue.</span></div>
      ${marginChart}</section>
    ${fulfilSection(d.shipping, cur, S.act, winSales, 60, d.margin_pct)}
    <div class="card"><h3 style="margin-bottom:6px">Flat margin override</h3>
      <p class="hint" style="margin-bottom:10px">Uses one blended margin percentage for this client instead of per-product costs. Honest and stable - it just can't tell you <i>which</i> products make money. <b>This also fixes the Daily Brief and both reports</b>, because they all read the same setting. Leave blank to use real per-product costs.</p>
      <div class="row">
        <div class="unit-in" style="width:96px"><input id="mPct" type="text" inputmode="decimal" value="${d.margin_pct!=null?Math.round(d.margin_pct*100):''}" placeholder=" - "><span>%</span></div>
        <button class="btn primary" id="mSave">Save</button>
        <button class="btn" id="mClear">Clear override</button>
        <span class="tiny" id="mMsg"></span>
      </div>
      ${r && (u.verdict === 'broken' || u.verdict === 'noisy' || u.verdict === 'none') ? `<div class="notice" style="margin:12px 0 0">✨ <div><b>Suggested: ${fmtPct(r.margin)}</b> - measured from the ${r.clean_days} of ${r.total_days} days where recorded cost and store revenue agree, so wholesale and inventory-receipt days can't drag it. <button class="btn primary" id="mSuggest" style="margin-left:8px">Use ${fmtPct(r.margin)}</button></div></div>`
        : r ? `<p class="tiny" style="margin-top:10px">This client's cost data reads <b>${esc(u.verdict)}</b>, so there is nothing to override. For reference, the days where cost and revenue agree imply a <b>${fmtPct(r.margin)}</b> margin.</p>` : ''}
      ${u.blended!=null && u.verdict!=='broken' ? `<p class="tiny" style="margin-top:8px">For reference, this client's measured trailing margin across every day is <b>${fmtPct(u.blended)}</b>.</p>` : ''}</div>
    ${r && r.flagged_days ? (() => {
      // Only a genuinely large gap looks like product leaving the building. A day
      // at 36% against a 20% baseline is a heavier mix, not a wholesale order, and
      // saying otherwise sends you hunting for an invoice that does not exist.
      const share = winSales > 0 ? r.unexplained_cost / winSales : 0;
      const material = (u.negatives || 0) > 0 || share >= 0.05;
      return `<div class="card"><h3 style="margin-bottom:8px">${material ? "Days carrying cost the store can't explain" : 'Days with a heavier cost mix than usual'}</h3>
      <p class="hint" style="margin-bottom:10px">${material
        ? `Product cost well above what this day's orders could account for. Each is most likely a <b>wholesale order paid outside Shopify</b> or an <b>inventory delivery</b> recorded as one day's cost. They are excluded from the suggested margin above. ${r.flagged_days} such days total <b>${fmtMoney(r.unexplained_cost, cur)}</b> of unexplained cost - <b>${fmtPct(share)}</b> of revenue over the window.`
        : `These days ran a higher cost ratio than this client's usual ${fmtPct(r.base)}, so they are held out of the suggested margin above. The gap is small - <b>${fmtMoney(r.unexplained_cost, cur)}</b> across ${r.flagged_days} days, ${fmtPct(share)} of revenue - so this is most likely just a heavier product mix on those days, <b>not</b> wholesale or an inventory delivery. Worth a glance, not an investigation.`}</p>
      <div class="tbl-wrap"><table><thead><tr><th>Date</th><th class="num">Store revenue</th><th class="num">Recorded cost</th><th class="num">Cost as % of revenue</th></tr></thead>
