      &ldquo;vs plan&rdquo; is measuring against a stale number. Pick a quick fill below and <b>Save</b> to bring it in line.</div></div>`;
  };

  /* Catch-up: what it takes FROM HERE.
   *
   * Showing that a month is behind is half the job; the other half is the ask.
   * Returning revenue arrives on its own, so the shortfall has to be bought with
   * new customers, which costs spend - that is what `to_hit` prices.
   *
   * The tone escalates with the RAMP, not the gap, because the ramp is what the
   * media buyer is actually being asked for:
   *   <= 1.2x  normal variance, one plain line;
   *   <= 1.5x  a real ask, amber;
   *   >  1.5x  the goal needs re-agreeing, not more spend - a plan you cannot
   *            reach by spending is a plan, not a delivery problem.
   * And a floor set on the Plan is enforced here too: if the catch-up maths asks
   * for LESS than the hard deck, the deck wins and the card says so.
   */
  const catchUpCard = () => {
    const t = p.to_hit, pace = p.pace;
    // `to_hit` is priced against the goal the server had at load. With no plan
    // saved for this month that goal is the inherited default, and "behind plan"
    // against a number nobody set for this month is not a catch-up.
    if (!t || !pace || p.status !== 'current' || !plannedAtLoad) return '';
    const floor = A.spend_floor_per_day;
    if (t.already_there) {
      return `<div class="cu" style="margin-bottom:14px"><div class="cu-hd">Ahead of plan</div>
        <div class="cu-sub">${fmtMoney(pace.mtd_sales, cur)} banked with ${pace.days_remaining} day${pace.days_remaining === 1 ? '' : 's'} to go. The month's goal of <b>${fmtMoney(p.goals.sales, cur)}</b> is already met. Nothing to make up.</div></div>`;
    }
    if (t.covered_by_returning) {
      return `<div class="cu" style="margin-bottom:14px"><div class="cu-hd">On track without extra spend</div>
        <div class="cu-sub">What is left of the goal is covered by returning revenue alone over the remaining ${pace.days_remaining} day${pace.days_remaining === 1 ? '' : 's'}. Hold the current budget${floor != null ? `, and not below the${fmtMoney(floor, cur)}/day floor` : ''}.</div></div>`;
    }
    const ramp = t.spend_ramp;
    const tone = ramp == null ? '' : ramp <= 1.2 ? '' : ramp <= 1.5 ? 'warn' : 'bad';
    const head = ramp == null ? 'To still hit the goal'
      : ramp <= 1.2 ? 'Slightly behind: here is the catch-up'
      : ramp <= 1.5 ? 'Behind plan: this is the ask'
      : 'Behind plan: this needs re-agreeing, not more spend';
    const need = t.spend_per_day;
    const belowFloor = floor != null && need != null && need < floor;

    /* A fixed budget makes "spend more to catch up" an instruction the plan does
       not permit. Saying it anyway is how a tool talks a team into breaking the
       one number the client actually committed to - so when spend was TYPED
       rather than derived, the prescription is what the month lands at inside the
       budget, and the decision is whether the target still stands. */
    if (!budgetMoves()) {
      const budgetDay = c && c.spend != null ? c.spend / p.ctx.days_in_month : null;
      const landsAt = budgetDay != null && A.amer != null
        ? pace.mtd_sales + (A.returning_per_day || 0) * pace.days_remaining + budgetDay * A.amer * pace.days_remaining
        : null;
      const shortBy = landsAt != null ? p.goals.sales - landsAt : null;
      return `<div class="cu ${shortBy != null && p.goals.sales && shortBy > p.goals.sales * 0.05 ? 'warn' : ''}" style="margin-bottom:14px">
        <div class="cu-hd">Behind plan, and the budget is fixed</div>
        ${landsAt != null ? `<div class="cu-big">At ${fmtMoney(budgetDay, cur)}/day the month lands near ${fmtMoney(landsAt, cur)}</div>` : ''}
        <div class="cu-sub">
          ${fmtMoney(pace.mtd_sales, cur)} banked of <b>${fmtMoney(p.goals.sales, cur)}</b> after ${pace.days_elapsed} of ${pace.days_in_month} days.
          ${need != null ? `Closing the gap would take <b>${fmtMoney(need, cur)} a day</b>${budgetDay ? ` against the ${fmtMoney(budgetDay, cur)} the budget allows` : ''}, <b>which this plan does not permit.</b>` : ''}
          ${shortBy != null && shortBy > 0 ? `<br>So the decision is whether <b>${fmtMoney(p.goals.sales, cur)}</b> still stands or the month re-cuts to about <b>${fmtMoney(landsAt, cur)}</b>. Raising the budget is a separate conversation with the client, not a catch-up.` : ''}
          ${floor != null && budgetDay != null && budgetDay < floor ? `<br><b>Below your hard deck.</b> The budget works out at ${fmtMoney(budgetDay, cur)}/day against a ${fmtMoney(floor, cur)}/day floor.` : ''}
        </div>
      </div>`;
    }
    return `<div class="cu ${tone}" style="margin-bottom:14px">
      <div class="cu-hd">${head}</div>
      <div class="cu-big">${need != null ? `${fmtMoney(need, cur)} a day` : `${fmtMoney(t.revenue_per_day, cur)} a day of revenue`} for the remaining ${pace.days_remaining} day${pace.days_remaining === 1 ? '' : 's'}</div>
      <div class="cu-sub">
        ${fmtMoney(pace.mtd_sales, cur)} banked of <b>${fmtMoney(p.goals.sales, cur)}</b> after ${pace.days_elapsed} of ${pace.days_in_month} days.
        ${need != null && pace.spend_per_day ? `That is <b>${fmtX(ramp)}</b> the ${fmtMoney(pace.spend_per_day, cur)}/day you are spending now, at the ${fmtX(A.amer)} acquisition efficiency assumed below.` : ''}
        ${ramp != null && ramp > 1.5 ? `<br><b>A ramp this size is not a delivery problem.</b> Tripling budget with two weeks left buys colder traffic at worse efficiency than the ${fmtX(A.amer)} this figure assumes, so the honest move is to agree a revised number with the client rather than spend into it.` : ''}
        ${belowFloor ? `<br><b>Below your hard deck.</b> The maths only asks for ${fmtMoney(need, cur)}/day, but the floor is ${fmtMoney(floor, cur)}/day. Hold the floor. Cutting acquisition to hit a ratio costs next month too.` : ''}
      </div>
    </div>`;
  };

  /* Every assumption the plan makes, named, sourced and editable.
   *
   * A forecast IS assumptions - you cannot remove them, only expose them. So the
   * measured figure is the DEFAULT rather than the answer: it is pre-filled, it
   * says which window it came from, and typing over it marks the row as yours.
   * The alternative - deriving three numbers in the backend and never showing
   * them - is what makes a client ask "how are we getting this number" a month
   * later with nobody able to answer.
   *
   * Two of these carry a caveat the data cannot settle, so the caveat is printed
   * rather than assumed away:
   *   returning - treated as arriving without spend, though some of those buyers
   *               may well have come back off an ad;
   *   aMER - measured at the spend the account is ACTUALLY running, and
   *               efficiency generally falls as spend rises.
   */
  const shortD = d => `${MONTHS[+d.slice(5, 7) - 1].slice(0, 3)} ${+d.slice(8, 10)}`;
  const trailWin = src.trailing_from && src.trailing_to
    ? `last ${src.trailing_days || 28} days &middot; ${shortD(src.trailing_from)} to ${shortD(src.trailing_to)}`
    : 'the trailing window';

  const ASSUMPS = [
    { key: 'returning_per_day', label: 'Returning revenue', unit: 'money', perDay: true,
      srcTxt: `Measured from your own data: ${trailWin}, scaled to ${p.ctx.days_in_month} days.`,
      caveat: 'The plan treats this as arriving <b>without ad spend</b>, so only the gap above it is costed. Some returning buyers may have come back after seeing an ad, which would mean the plan asks for less spend than it really needs.',
      info: 'What repeat customers are expected to bring in this month on their own. Everything above this figure has to be bought with the ad budget, so raising it LOWERS the spend the plan asks for.' },
    { key: 'amer', label: 'Acquisition efficiency (aMER)', unit: 'x',
      srcTxt: `Measured from your own data: ${trailWin}${src.trailing_spend_per_day ? `, at ${fmtMoney(src.trailing_spend_per_day, cur)} a day of spend` : ''}.`,
      caveat: '<b>Efficiency usually falls as spend rises</b>, because you buy colder audiences. If this plan spends materially more than the window above, lower this by hand rather than assuming the current rate holds.',
      info: 'New-customer revenue per dollar of ad spend. This is the rate the plan buys growth at: halve it and the same revenue goal costs twice the budget.' },
    { key: 'margin', label: 'Product margin', unit: 'pct',
      srcTxt: src.margin_month ? `Measured from your own data: ${esc(monthLabel(src.margin_month))} actual.` : 'Measured from the last complete month.',
      caveat: '',
      info: 'Gross margin before ad spend: revenue less product cost, fulfilment, handling and payment fees. Only used to work out the expected contribution margin - it does not change the revenue or spend numbers.' },
  ];

  const asmShow = (a, v) => v == null ? 'not measured'
    : a.unit === 'pct' ? fmtPct(v) : a.unit === 'x' ? fmtX(v) : `${fmtMoney(v, cur)}/day`;
  const asmRaw = (a, v) => v == null ? ''
    : a.unit === 'pct' ? (Math.round(v * 1000) / 10).toFixed(1)
    : a.unit === 'x' ? (Math.round(v * 100) / 100).toFixed(2)
    : Math.round(v).toLocaleString('en-US');

  const assumpRow = a => {
    const v = A[a.key], over = isOver(a.key);
    return `<div class="asm-row${over ? ' over' : ''}" id="asmr_${a.key}">
      <div class="asm-head">
        <span class="asm-lbl">${a.label} <span class="info-i" title="${esc(a.info)}">i</span></span>
        <span class="asm-tag${over ? ' mine' : ''}">${over ? 'you set this' : 'assumed'}</span>
      </div>
      <div class="asm-ctl">
        <div class="unit-in" style="width:148px">${a.unit === 'money' ? `<span>${sym(cur)}</span>` : ''}<input id="asm_${a.key}" type="text" inputmode="decimal" value="${asmRaw(a, v)}">${a.unit === 'x' ? '<span>x</span>' : a.unit === 'pct' ? '<span>%</span>' : '<span>/day</span>'}</div>
        <span class="tiny asm-eq" id="asmv_${a.key}">${a.perDay && v != null ? `= ${fmtMoney(v * p.ctx.days_in_month, cur)} this month` : ''}</span>
        ${over ? `<button class="btn asm-reset" data-reset="${a.key}">Use measured (${asmShow(a, MEAS[a.key])})</button>` : ''}
      </div>
      <div class="tiny asm-src">${over ? `<b>Your figure, not ours.</b> The measured value was ${asmShow(a, MEAS[a.key])} (${a.key === 'margin' ? (src.margin_month ? esc(monthLabel(src.margin_month)) + ' actual' : 'the last complete month') : trailWin}).` : a.srcTxt}</div>
      ${a.caveat ? `<div class="tiny asm-cav">${a.caveat}</div>` : ''}
    </div>`;
  };

  const basisNote = () => {
    const n = ['returning_per_day', 'amer', 'margin'].filter(isOver).length;
    return `<details class="asm-card"${n ? ' open' : ''}>
    <summary><span><b>What this plan assumes</b> <span class="tiny" style="color:var(--muted)">&middot; ${n ? `${n} changed by you` : 'all three measured from your own data'}</span></span><span class="asm-chev">&#9662;</span></summary>
    <div class="asm-body">
      <p class="tiny" style="margin:0 0 13px;color:var(--muted);line-height:1.6">Each is pre-filled with what your data measured, and <b>each can be changed</b>. Anything you change is labelled as yours here and on the client link.</p>
      ${ASSUMPS.map(assumpRow).join('')}
      <div class="asm-row asm-floor${A.spend_floor_per_day != null ? ' over' : ''}">
        <div class="asm-head">
          <span class="asm-lbl">Spend floor (the hard deck) <span class="info-i" title="The least you keep spending per day, whatever the month does. Not part of the arithmetic - a guardrail. If the plan or the catch-up maths ever asks for less than this, the page says so instead of letting spend drift down quietly.">i</span></span>
          <span class="asm-tag${A.spend_floor_per_day != null ? ' mine' : ''}">${A.spend_floor_per_day != null ? 'set' : 'optional'}</span>
        </div>
        <div class="asm-ctl">
          <div class="unit-in" style="width:148px"><span>${sym(cur)}</span><input id="asm_spend_floor_per_day" type="text" inputmode="decimal" value="${A.spend_floor_per_day != null ? Math.round(A.spend_floor_per_day).toLocaleString('en-US') : ''}" placeholder="none"><span>/day</span></div>
          <span class="tiny asm-eq" id="asmv_spend_floor_per_day">${A.spend_floor_per_day != null ? `= ${fmtMoney(A.spend_floor_per_day * p.ctx.days_in_month, cur)} for the month` : 'leave blank for no floor'}</span>
        </div>
        <div class="tiny asm-src">The minimum daily spend you hold to even in a bad month. <b>Stopping compounds:</b> today's new customers are next month's returning revenue, so cutting budget the moment efficiency dips turns one bad week into a bad quarter. Set it and the plan warns instead of quietly asking for less.</div>
      </div>
      <div class="tiny" style="margin-top:13px;color:var(--muted);line-height:1.6">The revenue basis is <b>${src.basis_month ? esc(monthLabel(src.basis_month)) + ' actual' : 'the last complete month'}</b>. That is history rather than an assumption, so it is not editable here. Changes save with the plan.</div>
    </div>
  </details>`;
  };

  const picker = [-1, 0, 1, 2, 3, 4].map(n => shiftMonth(nowYm, n));
  const statusPill = p.status === 'past'
    ? '<span class="pill unk">finished - read only</span>'
    : saved && saved.agreed_at ? `<span class="pill good">agreed ${esc(String(saved.agreed_at).slice(0, 10))}</span>`
    : p.planned ? '<span class="pill warn">saved, not agreed</span>'
    : '<span class="pill unk">not planned yet</span>';

  const fieldsHtml = () => {
    const x = calc();
    if (!x) return '';
    return fieldCard('sales', 'Revenue goal', PL.derive === 'sales' ? fmtMoney(x.sales, cur) : Math.round(x.sales).toLocaleString('en-US'),
        x.growth != null ? `${x.growth >= 0 ? '+' : ''}${Math.round(x.growth * 100)}% on ${p.basis ? esc(monthLabel(p.basis.month)) : 'last month'}` : '',
        'The total you want the store to sell this month, from every source - ads, email, organic, direct. Save it and the Daily Brief measures each day against it.')
      + '<div class="pf-op">=</div>'
      + fieldCard('spend', 'Ad spend', PL.derive === 'spend' ? fmtMoney(x.spend, cur) : Math.round(x.spend).toLocaleString('en-US'),
        `${fmtMoney(x.spend / p.ctx.days_in_month, cur)} a day`,
        'The total ad budget for the month, across every platform. This is the number you actually control.')
      + '<div class="pf-op">&times;</div>'
      + fieldCard('mer', 'MER', PL.derive === 'mer' ? fmtX(x.mer) : (Math.round(x.mer * 100) / 100).toFixed(2),
        'revenue divided by ad spend',
        'How many dollars the store takes in for every dollar spent on ads. 2.5x means $2.50 back for every $1 spent.');
  };

  /* What the derived field actually commits you to.
   *
   * Revenue = MER x spend, so two are chosen and the third follows - and the tool
   * has always let you pick which. What it never said is that the choice is not
   * only arithmetic: the DERIVED field is the one that absorbs a bad month, and
   * only one of the three is a number you can actually turn.
   *
   *   derive = spend  -> the budget MOVES to chase the revenue goal, and the MER
   *                      you set is what stops it moving too far. A live lever.
   *   spend is typed  -> the budget is FIXED. Revenue and MER are forecasts of
   *                      what it buys, and nothing can be pulled to rescue them.
   *
   * That distinction is the whole difference between "spend more to catch up" and
   * "the target needs re-agreeing", which is why the catch-up card reads it too.
   */
  const budgetMoves = () => PL.derive === 'spend';
  const structureHtml = () => {
    const x = calc();
    if (!x) return '';
    if (budgetMoves()) {
      return `<div class="st-note"><b>The budget moves.</b> ${fmtMoney(x.spend, cur)} is what the goal takes at ${fmtX(x.mer)}, not a cap.
        If the month runs cold we spend more to chase <b>${fmtMoney(x.sales, cur)}</b>, and the <b>${fmtX(x.mer)} MER is the limit</b> that stops us chasing it too far.
        <span class="st-alt">Want a fixed budget instead? Press <b>make this the result</b> on Revenue goal or MER, then type the spend.</span></div>`;
    }
    const derivedName = PL.derive === 'sales' ? 'Revenue' : 'MER';
    return `<div class="st-note"><b>The budget is fixed at ${fmtMoney(x.spend, cur)}.</b> ${derivedName} is the result, not a second promise.
      If the month runs cold, <b>revenue lands lower and the budget holds</b>.
      <span class="st-alt">Want the budget to move to chase the revenue goal? Press <b>make this the result</b> on Ad spend.</span></div>`;
  };

  /* Three boxes, and one of them is visibly not like the others.
     The derived field used to differ only by a slightly different background,
     which read as an accidental band across the row rather than "this one is
     calculated". It now gets a dashed border and a RESULT tag, so which number
     you are committing to and which one falls out is legible at a glance. */
  const fieldCard = (key, label, value, sub, info) => {
    const derived = PL.derive === key;
    return `<div class="pf-card${derived ? ' res' : ''}">
      <div class="pf-top">
        <span class="pf-lbl">${label} <span class="info-i" title="${esc(info)}">i</span></span>
        ${derived ? '<span class="pf-tag">calculated</span>' : ''}
      </div>
      ${derived
        ? `<div class="pf-val" id="pf_${key}">${value}</div>
           <div class="tiny pf-sub" id="pfs_${key}">${sub}</div>
           <div class="tiny pf-foot">calculated from the other two</div>`
        : `<div class="unit-in pf-in">${key === 'mer' ? '' : `<span>${sym(cur)}</span>`}<input id="pfi_${key}" type="text" inputmode="decimal" value="${value}">${key === 'mer' ? '<span>x</span>' : ''}</div>
           <div class="tiny pf-sub" id="pfs_${key}">${sub}</div>
           <button class="pf-btn" data-derive="${key}" title="Make this the number that gets calculated - and therefore the one that absorbs a month that runs hot or cold.">make this the result</button>`}
    </div>`;
  };

  /* The achievability verdict is ONE line under the three numbers: the tone
     comes from the same calc() the sentence does, so they can never disagree. */
  const verdictTone = x => !x || !x.verdict ? 'un' : x.verdict === 'ok' ? 'ok' : x.verdict === 'stretch' ? 'wn' : 'bd';

  /* The six-month table: context you read, closed by default, drawn once and
     used by both the editable page and a finished month. The summary names the
     basis month, read from the same place the plan reads it. */
  const basisLbl = p.basis ? monthLabel(p.basis.month) : null;
  const recentHtml = `<details class="rh-wrap"><summary>The last six months${editable && p.basis ? ` <span class="tiny">&middot; this plan builds from ${esc(basisLbl)}, ${fmtMoney(p.basis.sales, cur)}</span>` : ' <span class="tiny">&middot; what actually happened</span>'}</summary><div class="fold-body">
      <div class="tbl-wrap"><table>
        <thead><tr><th>Month</th>
          <th class="num">Revenue <span class="info-i" title="Shopify Total Sales minus sales tax: gross sales, less discounts and returns, plus shipping charged to customers, less tax. Every channel (paid, organic, email, direct), never a platform's attributed revenue. The same line used on every tab.">i</span></th>
          <th class="num">Ad spend <span class="info-i" title="Every ad platform combined for the month, from Triple Whale: Meta plus Google plus anything else running. Not Meta alone.">i</span></th>
          <th class="num">MER <span class="info-i" title="Marketing Efficiency Ratio = all store revenue divided by all ad spend. Blended on both sides, so it is not ROAS and it is not platform-attributed. 3.00x means three dollars came into the store for every dollar spent on ads.">i</span></th>
          <th class="num">aMER <span class="info-i" title="Acquisition MER = NEW-customer revenue divided by that same total ad spend. Repeat buyers and email cannot flatter it, so it isolates whether the ads are actually buying customers.">i</span></th>
          <th class="num">Margin <span class="info-i" title="Gross margin BEFORE ad spend: revenue minus product costs, fulfilment, handling and payment fees, as a share of revenue. This is not contribution margin, because ad spend has not been taken off yet.">i</span></th></tr></thead>
        <tbody>${hist.slice(-6).map(h => `<tr${h.partial ? ' style="opacity:.6"' : ''}>
          <td><b>${esc(monthLabel(h.month))}</b>${h.partial ? ` <span class="tiny">(${h.days} of ${h.days_in_month} days)</span>` : ''}</td>
          <td class="num"><b>${fmtK(h.sales, cur)}</b></td><td class="num">${fmtK(h.spend, cur)}</td>
          <td class="num">${fmtX(h.mer)}</td><td class="num">${fmtX(h.amer)}</td><td class="num">${fmtPct(h.margin)}</td></tr>`).join('')}
        </tbody></table></div>
      <p class="tiny" style="margin:8px 0 0">Context you read. The plan is not an average of it.</p></div></details>`;

  /* A month with no plan of its own says so in one line, and says where the
     numbers on screen started. Removed in place the moment the plan is saved. */
  const noPlanLine = editable && c && !p.planned
    ? `<div class="st-line ${p.status === 'current' ? 'wn' : ''}" id="plNoPlan"><div class="st-t"><b>${esc(monthLabel(p.month))} has no plan yet.${p.status === 'current' ? ' Set it first.' : ''}</b>
        <span class="st-d">${basisLbl ? `These numbers start flat on ${esc(basisLbl)}. ` : ''}${p.status === 'current' && inheritedSales != null
          ? `Until you save, the Daily Brief measures against the last plan on file (${fmtMoney(inheritedSales, cur)}).`
          : 'Nothing is saved until you press Save.'}</span></div></div>`
    : '';

  /* THE VERDICT FIRST (2026-10-08): the month, the three numbers and whether the ads can
     buy it, in one sentence above everything. Rewritten in place by repaint() and on save. */
  const leadHtml = () => {
    const ml = esc(monthLabel(p.month));
    if (p.status === 'past') {
      const a = p.actual; if (!a) return '';
      const g = p.planned && p.goals ? p.goals : null;
      if (!g || g.sales == null) return `${ml} is finished: <b>${fmtMoney(a.sales, cur)}</b> revenue on ${fmtMoney(a.spend, cur)} of ad spend, ${fmtX(a.mer)} MER. No plan was set for it.`;
      const off = a.sales / g.sales - 1;
      return `${ml} is finished: <b>${fmtMoney(a.sales, cur)}</b> against a plan of ${fmtMoney(g.sales, cur)}. It <b class="${off >= 0 ? 'good' : off > -0.1 ? 'warn' : 'bad'}">${off >= 0 ? 'beat' : 'missed'} the plan by ${Math.abs(Math.round(off * 100))}%</b>.`;
    }
    const x = calc(); if (!x) return '';
    const word = !x.verdict ? '' : x.verdict === 'ok' ? '<b class="good">Achievable</b>' : x.verdict === 'stretch' ? '<b class="warn">A stretch</b>' : '<b class="bad">Unrealistic</b>';
    const why = !x.verdict ? '' : x.verdict === 'ok' ? 'the ads have been buying new customers at that rate'
      : `the ads would need to buy new customers ${Math.round((x.impliedAmer / x.trailing - 1) * 100)}% more efficiently than the last ${src.trailing_days || 28} days`;
    return `${ml}${p.planned ? '' : ', not saved yet'}: <b>${fmtMoney(x.sales, cur)}</b> revenue on <b>${fmtMoney(x.spend, cur)}</b> of ad spend, a <b>${fmtX(x.mer)}</b> MER${x.cm != null ? `, leaving about ${fmtK(x.cm, cur)} after costs` : ''}.${word ? ` ${word}: ${why}.` : ''}`;
  };

  const saveLbl = `Save ${esc(monthLabel(p.month))} plan`;
  pageActions(editable && c
    ? `<button class="btn" id="plShare">↗ Client link</button><button class="btn primary" id="plSave">${saveLbl}</button>`
    : '');

  $('#main').innerHTML = `<div class="v2 lx">${LX.head('plan', `Plan: ${esc(p.account.name)}`)}
    <div class="pl-months">
      ${picker.map(m => `<button class="chip ${m === p.month ? 'on' : ''}" data-m="${m}">${esc(monthLabel(m))}${m === nowYm ? ' · now' : ''}</button>`).join('')}
      <span id="plChip" style="margin-left:6px">${statusPill}</span>
    </div>
    ${LX.say(leadHtml(), 'plLead')}
    ${noPlanLine}

    ${p.status === 'past' && p.actual ? retroCard(p, cur, saved) : ''}

    ${editable && c ? `
      ${staleBasis()}
      <div class="card key pl-main">
        <div class="pl-quick"><span class="tiny">Quick fill the revenue goal from ${p.basis ? `${esc(basisLbl)} (${fmtMoney(p.basis.sales, cur)})` : 'last month'}</span>
          ${[0, 0.1, 0.2, 0.3].map(g => `<button class="chip ${c.growth != null && Math.abs(c.growth - g) < 0.005 ? 'on' : ''}" data-g="${g}">${g === 0 ? 'Hold flat' : '+' + Math.round(g * 100) + '%'}</button>`).join('')}</div>
        <div id="plFields" class="pf-grid pf-eq">${fieldsHtml()}</div>
        <div class="pl-verdict ${verdictTone(c)}" id="plVerdictCard"><span id="plVerdict">${verdictHtml(c)}</span></div>
        <div class="pl-save">
          <button class="btn primary" id="plSave2">${saveLbl}</button>
          <button class="btn" id="plShare2" title="A read-only page with just this plan on it, to send or screen-share.">↗ Client link</button>
          <span class="tiny" id="plMsg">Saving makes this the month&rsquo;s target. The Daily Brief measures every day against it.</span>
        </div>
      </div>
      <div id="plCatchUp">${catchUpCard()}</div>
      <div class="two even pl-two">
        <div class="card"><h3 style="margin-bottom:8px">What this plan leaves the business</h3>
          <div class="row" style="gap:22px;flex-wrap:wrap;align-items:flex-start;margin:0">
            <div><div class="tiny">Expected contribution margin</div><div style="font-size:26px;font-weight:700;letter-spacing:-.025em;line-height:1.15" id="plCm">${fmtMoney(c.cm, cur)}</div><div class="tiny" id="plCmSub">${c.cmPct != null ? `${fmtPct(c.cmPct)} of revenue` : ''}</div></div>
            <div style="flex:1;min-width:200px;line-height:1.6" class="tiny" id="plCmNote">${cmHtml(c)}</div>
          </div>
          <div id="plStruct">${structureHtml()}</div>
        </div>
        <div class="card sc ${saved && saved.agreed_at ? 'ok' : 'un'}">
          <div class="mini">Agreed with the client</div>
          <div class="row" style="margin:6px 0 6px;gap:10px;align-items:center">
            <div class="toggle ${saved && saved.agreed_at ? 'on' : ''}" id="plAgreed"></div>
            <span style="font-weight:700;font-size:15px" id="plAgreedLbl">${saved && saved.agreed_at ? `Agreed ${esc(String(saved.agreed_at).slice(0, 10))}` : 'Not yet agreed'}</span>
          </div>
          <p class="hint" style="margin:0">Switch this on once the client says yes. It records the date, and clears itself if the numbers change later.</p>
        </div>
      </div>
      <div id="plQuarter"></div>
      <div id="plAssump" style="margin-bottom:11px">${basisNote()}</div>
      ${recentHtml}
      <div id="plRhythm"></div>`
    : editable ? '<div class="card"><span class="hint">Not enough history to propose a number for this client yet.</span></div><div id="plQuarter"></div><div id="plRhythm"></div>'
    : `<div id="plQuarter"></div>
    ${recentHtml}
    <div id="plRhythm"></div>`}</div>`;

  const repaint = () => {
    c = calc();
    if (!c) return;
    const setTxt = (id, v) => { const el = $(id); if (el) el.textContent = v; };
    const setVal = (id, v) => { const el = $(id); if (el && document.activeElement !== el) el.value = v; };
    // Only the derived field is rewritten; the two you typed are left alone.
    if (PL.derive === 'sales') setTxt('#pf_sales', fmtMoney(c.sales, cur)); else setVal('#pfi_sales', Math.round(c.sales).toLocaleString('en-US'));
    if (PL.derive === 'spend') setTxt('#pf_spend', fmtMoney(c.spend, cur)); else setVal('#pfi_spend', Math.round(c.spend).toLocaleString('en-US'));
    if (PL.derive === 'mer') setTxt('#pf_mer', fmtX(c.mer)); else setVal('#pfi_mer', (Math.round(c.mer * 100) / 100).toFixed(2));
    setTxt('#pfs_sales', c.growth != null ? `${c.growth >= 0 ? '+' : ''}${Math.round(c.growth * 100)}% on ${p.basis ? monthLabel(p.basis.month) : 'last month'}` : '');
    setTxt('#pfs_spend', `${fmtMoney(c.spend / p.ctx.days_in_month, cur)} a day`);
    setTxt('#plCm', c.cm != null ? fmtMoney(c.cm, cur) : ' - ');
    setTxt('#plCmSub', c.cmPct != null ? `${fmtPct(c.cmPct)} of revenue` : '');
    $('#main').querySelectorAll('[data-g]').forEach(b =>
      b.classList.toggle('on', c.growth != null && Math.abs(c.growth - +b.dataset.g) < 0.005));
    const sn = $('#plStruct'); if (sn) sn.innerHTML = structureHtml();
    const v = $('#plVerdict'); if (v) v.innerHTML = verdictHtml(c);
    const ld = $('#plLead'); if (ld) ld.innerHTML = leadHtml();
    const vc = $('#plVerdictCard'); if (vc) vc.className = `pl-verdict ${verdictTone(c)}`;
    const n = $('#plCmNote'); if (n) n.innerHTML = cmHtml(c);
  };

  // Typing into a field makes it an input; whichever field is derived stays derived.
  const bind = () => {
    ['sales', 'spend', 'mer'].forEach(k => {
      const el = $(`#pfi_${k}`);
      if (!el) return;
      const fmtOwn = () => {
        // repaint() deliberately skips the focused field so it cannot fight your
        // typing - so on Enter we format this one explicitly.
        const x = calc();
        if (!x) return;
        el.value = k === 'mer' ? (Math.round(x.mer * 100) / 100).toFixed(2) : Math.round(x[k]).toLocaleString('en-US');
      };
      const commit = () => {
        const raw = +el.value.replace(/[^0-9.]/g, '');
        if (!isFinite(raw) || el.value.trim() === '') return;
        PL[k] = raw;
        repaint();
        fmtOwn();
      };
      el.onchange = commit;
      el.onblur = commit;
      el.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); commit(); el.blur(); } };
    });
    // Rebuild only the three field cards. Re-rendering the page would scroll you back
    // to the top mid-decision, which is exactly what makes a tool feel broken.
    const rebuildFields = () => { $('#plFields').innerHTML = fieldsHtml(); bind(); repaint(); };

    /* The assumptions. Changing one moves the whole plan - a lower aMER means the
       same revenue goal needs more spend - so every edit re-runs the arithmetic and
       repaints the fields. The card rebuilds itself too (the "you set this" badge and
       the reset button have to appear), but only the card: the <details> keeps its
       open state because we write into its body rather than replacing the element. */
    const rebuildAssump = () => {
      const host = $('#plAssump');
      if (!host) return;
      const wasOpen = host.querySelector('details')?.open;
      host.innerHTML = basisNote();
      const d = host.querySelector('details');
      if (d && wasOpen != null) d.open = wasOpen;
      bindAssump();
      repaint();
      const cu = $('#plCatchUp'); if (cu) cu.innerHTML = catchUpCard();
    };
    const bindAssump = () => {
      ['returning_per_day', 'amer', 'margin', 'spend_floor_per_day'].forEach(k => {
        const el = $(`#asm_${k}`);
        if (!el) return;
        const commit = () => {
          const txt = el.value.trim();
          // Empty means "no opinion": measured for the three assumptions, no floor
          // for the deck. That is how you undo an override by hand.
          if (txt === '') {
            A[k] = k === 'spend_floor_per_day' ? null : MEAS[k];
            rebuildAssump();
            return;
          }
          const raw = +txt.replace(/[^0-9.]/g, '');
          if (!isFinite(raw)) return;
          // Margin is typed as a percentage and stored as a fraction.
          A[k] = k === 'margin' ? raw / 100 : raw;
          rebuildAssump();
        };
        el.onchange = commit;
        el.onblur = commit;
        el.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); commit(); el.blur(); } };
      });
      $('#main').querySelectorAll('[data-reset]').forEach(b => b.onclick = () => {
        A[b.dataset.reset] = MEAS[b.dataset.reset];
        rebuildAssump();
      });
    };
    bindAssump();
    $('#main').querySelectorAll('[data-derive]').forEach(b => b.onclick = () => {
      // Freeze current values so switching which one is derived changes nothing.
      const cc = calc();
      if (cc) { PL.sales = cc.sales; PL.spend = cc.spend; PL.mer = cc.mer; }
      PL.derive = b.dataset.derive;
      rebuildFields();
    });
    $('#main').querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
      if (!p.basis) return;
      PL.sales = p.basis.sales * (1 + +b.dataset.g);
      if (PL.derive === 'sales') {                        // cannot quick-fill a derived field
        const cc = calc();
        if (cc) { PL.spend = cc.spend; PL.mer = cc.mer; }
        PL.derive = 'mer';
      }
      rebuildFields();
    });
  };
  bind();

  $('#main').querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    if (b.dataset.m === PL.month) return;
    PL.month = b.dataset.m; PL.sales = null; PL.spend = null; PL.mer = null; PL.act = null; PL.aAct = null;
    PL.auto = false;                      // the reader chose this month; keep it
    inPlace(() => renderPlan(false));
  });

  // Quarter to date - loaded after the plan so it can never delay it, and reloadable
  // because saving a plan changes the very numbers it rolls up.
  const loadQuarter = () => api(`/api/quarter?act=${S.act}`).then(q => {
    if (run !== RUN) return;
    const el = $('#plQuarter'); if (!el || !q || !q.months) return;
    const pace = q.days_total ? q.days_done / q.days_total : 0;
    const goalToDate = q.goal_sales != null ? q.goal_sales * pace : null;
    const off = goalToDate ? q.sales / goalToDate - 1 : null;
    // The month in progress must be measured against a PRO-RATED goal, exactly like
    // the headline above it. Comparing 23 days of revenue with a 31-day target made
    // the row read -19% while the quarter summary directly above read +9% for the
    // same month - two contradictory verdicts on one card, and the pessimistic one
    // was simply wrong. Finished months compare against the whole goal as before.
    const mrow = x => {
      const part = x.status === 'current' && x.days_in_month ? x.days / x.days_in_month : 1;
      const goalToDate = x.goal_sales != null ? x.goal_sales * part : null;
      const off = goalToDate ? x.sales / goalToDate - 1 : null;
      const cls = off == null ? '' : off >= 0 ? 'good' : off >= -0.1 ? 'warn' : 'bad';
      return `<tr${x.status === 'future' ? ' style="opacity:.5"' : ''}>
      <td><b>${esc(monthLabel(x.month))}</b>${x.status === 'current' ? ` <span class="tiny">(${x.days} of ${x.days_in_month} days)</span>` : ''}</td>
      <td class="num">${x.planned ? fmtMoney(x.goal_sales, cur) : '<span class="tiny">not planned</span>'}${
        x.status === 'current' && goalToDate != null ? `<br><span class="tiny">${fmtMoney(goalToDate, cur)} by now</span>` : ''}</td>
      <td class="num"><b>${x.sales != null ? fmtMoney(x.sales, cur) : ' - '}</b></td>
      <td class="num">${x.planned && x.sales != null && x.status !== 'future' && off != null
        ? `<span class="pill ${cls}">${fmtSigned(off)}</span>` : ' - '}</td></tr>`;
    };
    el.innerHTML = `<section class="v2card"><div class="v2h"><h3>${esc(q.quarter.replace('-', ' '))} so far</h3><span class="find">${goalToDate && off != null ? `Revenue is <b class="${off >= 0 ? 'good' : off >= -0.1 ? 'warn' : 'bad'}">${Math.abs(Math.round(off * 100))}% ${off >= 0 ? 'ahead of' : 'behind'}</b> what the planned months expected by now.` : ''}</span><span class="cap">${q.days_done} of ${q.days_total} days</span></div>
      <p class="hint" style="margin-bottom:12px"${window.V2UI.tipAttr('The three monthly plans in this quarter added together, against what has actually happened. There is no separate quarterly target: a quarter is only as planned as its months, so any month without an agreed plan is named rather than guessed at.')}>${q.unplanned.length ? `<b>${q.unplanned.map(m => esc(monthLabel(m))).join(' and ')}</b> ${q.unplanned.length === 1 ? 'has' : 'have'} no agreed plan, so the quarter total below is only what has been committed so far.` : 'All three months are planned.'}</p>
      <div class="v2tiles">
        ${LX.tile({ label: 'Revenue so far', value: fmtMoney(q.sales, cur), bullet: goalToDate ? window.V2UI.bullet(q.sales, goalToDate, false, 'expected by now') : '', sub: goalToDate ? `${fmtMoney(goalToDate, cur)} expected by now ${off != null ? `<span class="pill ${off >= 0 ? 'good' : off >= -0.1 ? 'warn' : 'bad'}">${fmtSigned(off)}</span>` : ''}` : 'no quarter target' })}
        ${LX.tile({ label: 'Ad spend', value: fmtMoney(q.spend, cur), sub: q.goal_spend != null ? `of ${fmtMoney(q.goal_spend, cur)} committed` : 'no budget set' })}
        ${LX.tile({ label: 'Contribution margin', value: `<span class="${q.cm == null ? '' : q.cm >= 0 ? 'good' : 'bad'}">${fmtMoney(q.cm, cur)}</span>`, sub: q.sales ? fmtPct(q.cm / q.sales) + ' of revenue' : '' })}
        ${LX.tile({ label: 'Quarter target', value: q.goal_sales != null ? fmtMoney(q.goal_sales, cur) : 'Not set', sub: q.unplanned.length ? `${3 - q.unplanned.length} of 3 months planned` : 'all three months planned' })}
      </div>
      <div class="tbl-wrap" style="margin-top:12px"><table><thead><tr><th>Month</th><th class="num">Agreed</th><th class="num">Actual</th><th class="num">vs plan</th></tr></thead>
        <tbody>${q.per.map(mrow).join('')}</tbody></table></div></section>`;
  }).catch(() => {});
  loadQuarter();

  /* THE WEEKDAY RHYTHM MOVED HERE FROM PROFIT (2026-08-30). It carried five
     separate disclaimers - "this is what happened, not a target", "do not build
     a story around it for the client", "illustrative only", "NOT the plan",
     "not what the Daily Brief compares against" - on the page you open to answer
     "did we make money". A card that needs five disclaimers is on the wrong
     page: it is not a result, it is CONTEXT FOR A CONVERSATION, and the
     conversation is the monthly one that happens here.
     Collapsed, and loaded last, so it can never delay or crowd the plan itself. */
  api(`/api/rhythm?act=${S.act}`).then(rh => {
    if (run !== RUN) return;
    const el = $('#plRhythm'); if (!el || !rh || !rh.months?.length) return;
    el.innerHTML = `<details class="rh-wrap"><summary>How ${esc(p.account.name)}&rsquo;s week usually runs
        <span class="tiny"> - context for the call, never a target</span></summary>
      <div class="rh-body">${rhythmCard(rh, p.account.currency, false)}</div></details>`;
  }).catch(() => { /* context, never a blocker */ });

  // Save sits WITH the numbers (#plSave2) and stays in the top bar (#plSave):
  // one handler, two buttons.
  const savePlan = async () => {
    const cc = calc();
    if (!cc || cc.sales == null) return;
    $('#plMsg').textContent = 'Saving…';
    try {
      // "Changed" means changed against a plan saved for THIS month. The
      // inherited default is not a plan, so a first save never needs re-agreeing.
      const changed = !!p.planned && p.goals && p.goals.sales != null && Math.abs(p.goals.sales - cc.sales) > 1;
      await api('/api/plan', { method: 'PUT', body: JSON.stringify({
        act: S.act, month: p.month, sales: Math.round(cc.sales),
        spend: cc.spend != null ? Math.round(cc.spend) : null,
        growth_pct: cc.growth, basis_sales: p.basis ? p.basis.sales : null,
        basis_label: p.basis ? monthLabel(p.basis.month) : null,
        expected_cm: cc.cm, reagree: changed,
        // Only what was actually overridden goes up. Sending a value equal to the
        // measured one would freeze today's figure into the row and stop the
        // default tracking the data - the reset is an ABSENCE, not a copy.
        assumptions: {
          returning_per_day: isOver('returning_per_day') ? A.returning_per_day : null,
          amer: isOver('amer') ? A.amer : null,
          margin: isOver('margin') ? A.margin : null,
          spend_floor_per_day: A.spend_floor_per_day,
          derive: PL.derive,
        } }) });
      p.goals = Object.assign({}, p.goals || {}, { sales: Math.round(cc.sales) });
      p.planned = true;
      // The month has a plan of its own now: the "no plan yet" line goes, in place.
      const np = $('#plNoPlan'); if (np) np.remove();
      const ld = $('#plLead'); if (ld) ld.innerHTML = leadHtml();
      if (changed) {
        const t = $('#plAgreed'); if (t) t.classList.remove('on');
        $('#plAgreedLbl').textContent = 'Not yet agreed';
      }
      if (!(saved && saved.agreed_at) || changed) $('#plChip').innerHTML = '<span class="pill warn">saved, not agreed</span>';
      $('#plMsg').textContent = changed ? 'Saved ✓ The numbers moved, so it needs agreeing again.' : 'Saved ✓';
      // The quarter card rolls up this very plan, and Overview + Daily Brief read the
      // goals out of S.accounts. Both refresh in place - no re-render, no scroll jump.
      loadQuarter();
      refreshAccounts();
    } catch (e) { $('#plMsg').textContent = e.message; }
  };
  ['#plSave', '#plSave2'].forEach(s => { const b = $(s); if (b) b.onclick = savePlan; });

  const ag = $('#plAgreed');
  if (ag) ag.onclick = async () => {
    const on = !ag.classList.contains('on');
    ag.classList.toggle('on', on);
    $('#plMsg').textContent = '';
    try {
      const r = await api('/api/plan-agree', { method: 'POST', body: JSON.stringify({ act: S.act, month: p.month, agreed: on }) });
      $('#plAgreedLbl').textContent = on && r.agreed_at ? `Agreed ${String(r.agreed_at).slice(0, 10)}` : 'Not yet agreed';
      $('#plChip').innerHTML = on && r.agreed_at
        ? `<span class="pill good">agreed ${esc(String(r.agreed_at).slice(0, 10))}</span>`
        : '<span class="pill warn">saved, not agreed</span>';
    } catch (e) {
      ag.classList.toggle('on', !on);
      noteModal('Nothing to agree to yet', `<p>${esc(e.message)}</p><p class="tiny">Save the plan first - agreeing records sign-off on a number that exists.</p>`);
    }
  };

  const sharePlan = async () => {
    try {
      const r = await api('/api/plan-share', { method: 'POST', body: JSON.stringify({ act: S.act, month: p.month }) });
      // A blocked clipboard must not surface as an unhandled rejection - the URL is on screen regardless.
      if (navigator.clipboard) navigator.clipboard.writeText(r.url).catch(() => {});
      noteModal('Client link ready', `<p>A read-only page showing just this plan. No other client, no internal notes.</p><p><code style="word-break:break-all">${esc(r.url)}</code></p><p class="tiny">Copied to your clipboard.</p>`);
    } catch (e) { $('#plMsg').textContent = e.message; }
  };
  ['#plShare', '#plShare2'].forEach(s => { const b = $(s); if (b) b.onclick = sharePlan; });
}

/** All clients at a glance: who still needs next month agreed. */
async function renderPlanAll() {
  /* TWO MONTHS, because two can be missing. The table used to show next month
     only, so a month IN PROGRESS with no plan (October 2026, with the Daily
     Brief warning about it every morning) was invisible here. The month in
     progress comes first: it is the one being measured right now. */
  const now = ymdLocal(new Date()).slice(0, 7);
  const next = shiftMonth(now, 1);
  const cols = [[now, 'now'], [next, 'next']];
  $('#main').innerHTML = `<div class="v2 lx">${LX.head('plan', 'Plan')}
    <div id="plWarn">${LX.say('Checking which brands have a plan for each month…')}</div>
    <div class="card"><div class="tbl-wrap"><table>
      <thead><tr><th>Brand</th><th>${esc(monthLabel(now))} <span class="tiny">in progress</span></th><th>${esc(monthLabel(next))}</th><th></th></tr></thead>
      <tbody>${S.accounts.map(a => `<tr data-id="${a.act_id}" style="cursor:pointer">
        <td><b>${esc(a.name)}</b></td>
        ${cols.map(([, k]) => `<td data-pl="${k}-${a.act_id}">…</td>`).join('')}
        <td class="num"><button class="btn">Open plan</button></td></tr>`).join('')}
      </tbody></table></div>
      <p class="tiny" style="margin-top:10px">Open a brand to set or change a plan. It opens on ${esc(monthLabel(now))} while that month has no plan, otherwise on ${esc(monthLabel(next))}.</p></div></div>`;
  $('#main tbody').addEventListener('click', e => {
    const tr = e.target.closest('tr[data-id]'); if (!tr) return;
    S.act = tr.dataset.id; localStorage.setItem(LS.act, S.act);
    // No month: renderPlan picks the one that needs a plan first.
    PL.month = null; PL.auto = false; PL.sales = null; PL.spend = null; PL.mer = null; PL.act = null;
    $('#clientPick').value = S.act; show('plan');
  });
  const run = ++RUN;
  // How many days until `next` becomes the live month? Once it does, any client
  // without an explicit plan silently inherits the previous month's numbers.
  const startsOn = new Date(`${next}-01T12:00:00Z`);
  const daysToGo = Math.max(0, Math.round((startsOn - new Date(ymdLocal(new Date()) + 'T12:00:00Z')) / 86400000));
  const missing = { now: [], next: [] };
  let answered = 0;
  const drawWarn = () => {
    const el = $('#plWarn'); if (!el || answered < S.accounts.length * 2) return;
    const names = k => missing[k].map(x => esc(x)).join(', ');
    const count = k => `${missing[k].length} brand${missing[k].length === 1 ? ' has' : 's have'}`;
    if (missing.now.length) {
      el.innerHTML = `<div class="notice warn">⚠️ <div><b>${esc(monthLabel(now))} is in progress and ${count('now')} no plan for it:</b> ${names('now')}.
        Until one is saved, the Daily Brief measures each day against the last plan on file. Set these first.${missing.next.length ? ` ${esc(monthLabel(next))} is still open for ${count('next').replace(/ ha(s|ve)$/, '')} too.` : ''}</div></div>`;
      return;
    }
    if (!missing.next.length) {
      el.innerHTML = `<div class="notice">✓ <div>Every brand has a plan for <b>${esc(monthLabel(now))}</b> and <b>${esc(monthLabel(next))}</b>.</div></div>`;
      return;
    }
    el.innerHTML = `<div class="notice ${daysToGo <= 10 ? 'warn' : ''}">${daysToGo <= 10 ? '⚠️' : 'ℹ️'} <div>
      <b>${esc(monthLabel(next))} starts in ${daysToGo} day${daysToGo === 1 ? '' : 's'} and ${count('next')} no plan for it:</b> ${names('next')}.
      A month nobody plans quietly reuses the last plan on file, and the Daily Brief measures against that.</div></div>`;
  };

  for (const a of S.accounts) {
    for (const [ym, k] of cols) {
      api(`/api/plan?act=${a.act_id}&month=${ym}`).then(p => {
        if (run !== RUN) return;
        if (!p.planned) missing[k].push(a.name);
        answered++; drawWarn();
        const cell = $(`[data-pl="${k}-${a.act_id}"]`);
        if (cell) cell.innerHTML = p.planned && p.goals && p.goals.sales != null
          ? `<b>${fmtK(p.goals.sales, a.currency)}</b> ${p.plan && p.plan.agreed_at ? '<span class="pill good">agreed</span>' : '<span class="pill warn">needs agreeing</span>'}`
          : `<span class="pill ${k === 'now' ? 'bad' : 'unk'}">no plan</span>`;
      }).catch(() => {
        if (run !== RUN) return;
        answered++; drawWarn();
        const cell = $(`[data-pl="${k}-${a.act_id}"]`); if (cell) cell.innerHTML = '<span class="tiny">could not load</span>';
      });
    }
  }
}

/* ---------- Customers ----------
   REBUILT 2026-10-05, REWRITTEN THE SAME NIGHT after Cole read it: "does the customer pay back
   what it costs to buy them, I'm not sure what that means". Every label is now a sentence a
   client could read. One question, answered first: is a customer worth more than they cost
   to get. Then how that value arrives (first order, then repeat), what they buy first and
   next, and whether repeat orders need ads. Data: `journey` from /api/customers (tw_orders,
   Triple Whale's per-order journeys, 400 days) plus the window's unit economics (`headline`). */
const ltvTone = r => r == null ? 'un' : r >= 3 ? 'ok' : r >= 1.5 ? 'wn' : 'bd';
const srcLabel = s => ({ meta: 'Meta ads', google: 'Google ads', tiktok: 'TikTok ads', other_ads: 'Other ads', email: 'Email and SMS', own: 'On their own' })[s] || s;
const fmtDays = n => n == null ? ' - ' : n < 1 ? 'the same day' : n < 2 ? '1 day' : `${Math.round(n)} days`;
const fmtN = n => n == null ? ' - ' : Math.round(n).toLocaleString('en-US');

/** The answer in one line, and the plain-English working under it. */
function ltvVerdict(j, h, cur, cmOk, brand) {
  const lc = j && j.have ? j.ltv_cac : null;
  if (!lc) {
    if (!j || !j.have) return { tone: 'un', word: 'Not enough history yet', body: j && j.reason ? esc(j.reason) : 'Customer history from Triple Whale fills in overnight.' };
    return { tone: 'un', word: 'Too early to say', body: `${fmtN(j.certain_customers)} customers are on record, but none is old enough yet to read 90 days of buying. The first-order numbers below still hold.` };
  }
  const yr = lc.horizon === 365, span = yr ? 'first year' : 'first 90 days';
  const tone = ltvTone(lc.ratio);
  const word = `${tone === 'ok' ? 'Yes' : tone === 'wn' ? 'Yes, but not by much' : 'No'}: ${lc.ratio.toFixed(1)}x over their ${span}`;
  const first = h.new_aov != null ? h.new_aov : j.first_aov;
  const left = cmOk && h.first_order_gp != null ? h.first_order_gp : null;
  const body = `A new ${esc(brand)} customer costs <b>${fmtMoney(lc.cac, cur)}</b> in ads to get. Over their ${span} they spend <b>${fmtMoney(lc.ltv, cur)}</b> with the brand: <b>${lc.ratio.toFixed(1)} dollars back for every dollar</b> spent getting them (${fmtN(lc.customers)} customers old enough to count). ${
    first != null ? `Most of that is the first order, <b>${fmtMoney(first, cur)}</b> on average${left != null ? `, which leaves <b>${fmtMoney(left, cur)}</b> after product, shipping and fees` : ''}.` : ''} ${
    j.repeat_rate_ever != null ? `<b>${fmtPct(j.repeat_rate_ever)}</b> of customers order again${j.days_to_second != null ? `, usually after ${fmtDays(j.days_to_second)}` : ''}.` : ''} ${
    tone === 'ok' ? 'Above 3x there is room to pay more for a customer than the first order alone would justify.' : tone === 'wn' ? 'Between 1.5x and 3x it works, but any rise in the cost to get a customer comes straight out of the margin.' : 'Under 1.5x the brand is buying revenue, not profit: lower the cost to get a customer, or get more of them to order again, before spending more.'}`;
  return { tone, word, body };
}

/** How value arrives: what a customer has spent by day 30, 60, 90, 180, 365. */
function ltvCurve(j, cur) {
  const pts = (j.curve || []).filter(p => p.ltv != null);
  if (!pts.length) return '';
  const last = pts[pts.length - 1];
  const added = j.first_aov != null && last.ltv != null ? last.ltv - j.first_aov : null;
  const read = added == null ? '' : added < j.first_aov * 0.1
    ? `<b>Almost all of a customer's value is the first order.</b> ${last.days} days in, repeat buying has added only <b>${fmtMoney(added, cur)}</b> per customer. Plan on the first order paying for the customer; treat repeat as a bonus.`
    : added < j.first_aov * 0.4
    ? `<b>Repeat buying adds a modest amount.</b> ${last.days} days in it has added <b>${fmtMoney(added, cur)}</b> per customer on top of the first order. Real, but not enough to carry a higher cost per customer on its own.`
    : `<b>Customers keep spending.</b> ${last.days} days in, repeat buying has added <b>${fmtMoney(added, cur)}</b> per customer on top of the first order. That is what lets the brand pay more for a customer than the first order alone would justify.`;
  /* The curve as a real chart (2026-10-08): spend per customer from the first order out to a
     year, with what a customer costs and three times that as dashed lines, so where the curve
     sits against the cost is the answer. Hover a point for its numbers. */
  const cac = j.ltv_cac && j.ltv_cac.cac;
  const xs = [0, ...pts.map(p => p.days)];
  const vals = [j.first_aov ?? null, ...pts.map(p => p.ltv)];
  const tips = [`<b>The first order</b> · ${fmtMoney(j.first_aov, cur)} on average${cac ? `<br><span class="faint">${(j.first_aov / cac).toFixed(1)}x what a customer costs</span>` : ''}`,
    ...pts.map(p => `<b>${p.days} days after the first order</b> · ${fmtMoney(p.ltv, cur)} per customer<br><span class="faint">${fmtPct(p.repeat_rate)} ordered again · ${fmtN(p.customers)} customers counted${cac ? ` · ${(p.ltv / cac).toFixed(1)}x the cost` : ''}</span>`)];
  const chart = j.first_aov != null || pts.length > 1 ? window.V2UI.legend([{ color: '--brand', label: 'Spent per customer' }, ...(cac ? [{ color: '--bad', label: 'What a customer costs' }, { color: '--good', label: 'Three times that' }] : [])])
    + LX.chart('cuCurve', { xs, xl: xs.map(d => d ? `${d} days` : 'First order'), cur, h: 230,
      series: [{ vals, color: '--brand', dots: true, w: 2.2 }],
      lines: cac ? [{ v: cac, color: '--bad', label: `Cost to get one ${fmtMoney(cac, cur)}` }, { v: cac * 3, color: '--good', label: '3x the cost' }] : [], tips }) : '';
  return `<section class="v2card"><div class="v2h"><h3>How much they spend after the first order</h3><span class="find">${last.ltv != null ? `${fmtMoney(last.ltv, cur)} per customer by day ${last.days}.` : ''}</span></div>
    ${chart}
    <p style="margin:12px 0 0;font-size:13.5px;color:var(--ink-2);line-height:1.55">${read}${j.first_aov != null && j.returning_aov != null ? ` A first order averages ${fmtMoney(j.first_aov, cur)}; a repeat order ${fmtMoney(j.returning_aov, cur)}.` : ''}</p>
    <details class="footnote" style="margin-top:10px"><summary>The numbers behind the curve</summary>
    <div class="tbl-wrap" style="margin-top:8px"><table class="ltv-tbl"><thead><tr><th>After their first order</th><th class="num">Spent so far, per customer</th><th class="num">Have ordered again</th><th class="num">Customers counted</th></tr></thead>
      <tbody>${pts.map(p => `<tr><td><b>${p.days} days</b></td><td class="num"><b>${fmtMoney(p.ltv, cur)}</b></td><td class="num">${fmtPct(p.repeat_rate)}</td><td class="num" style="color:var(--muted)">${fmtN(p.customers)}</td></tr>`).join('')}</tbody></table></div>
    <p class="tiny" style="margin-top:6px">Only customers old enough to reach each point are counted.</p></details></section>`;
}

/** First product, then what the same people buy next. */
function journeyCard(j, cur) {
  const p = j.products || {};
  const first = p.first || [];
  if (!first.length) return `<div class="card"><h3 style="margin-bottom:4px">What they buy first, and what they buy next</h3><p class="hint" style="margin:0">No product detail yet. Triple Whale records what each shopper put in the cart; once more orders carry it, this fills in.</p></div>`;
  return `<div class="card"><h3 style="margin-bottom:2px">What they buy first, and what they buy next <span class="info-i" title="Products come from what the shopper put in the cart before each order (Triple Whale's add-to-cart events), not the receipt line by line. Treat the counts as the shape of the journey. Connecting Shopify would make them exact.">i</span></h3>
    <p class="hint" style="margin-bottom:8px">Each row is a product new customers start with. Under it: how many of those customers order again within 90 days, and what the ones who come back choose next.${p.coverage != null && p.coverage < 0.9 ? ` (Cart detail exists for ${fmtPct(p.coverage)} of first orders.)` : ''}</p>
    <div class="jr-list">${first.map(f => `<div class="jr-row"><div class="jr-first"><b>${esc(f.name)}</b><span class="tiny">${fmtN(f.customers)} customers started here${f.share != null ? ` (${fmtPct(f.share)} of new customers)` : ''}${f.repeat_rate != null ? ` · <b>${fmtPct(f.repeat_rate)}</b> order again within 90 days` : ''}</span></div>
      <div class="jr-then"><span class="tiny" style="margin-right:4px">then:</span>${f.then.length ? f.then.map(t => `<span class="pill">${esc(t.name)} <span class="tiny">${t.customers}</span></span>`).join('') : '<span class="tiny">nobody has ordered again yet</span>'}</div></div>`).join('')}</div>
    <p class="tiny" style="margin-top:8px">Use the right-hand side for the post-purchase emails (what to offer after each product) and the left for which product to lead with in ads.</p></div>`;
}

/** Do repeat orders need ads, or do they arrive on their own? */
function sourcesCard(j) {
  const s = j.sources || {};
  if (!(s.first || []).length) return '';
  const row = (label, list) => `<div class="src-row"><div class="src-l">${label}</div><div class="src-bar">${list.map(x => `<i class="src-${esc(x.source)}" style="width:${(x.share * 100).toFixed(1)}%" title="${esc(srcLabel(x.source))} ${fmtPct(x.share)}"></i>`).join('')}</div><div class="tiny">${list.slice(0, 4).map(x => `${esc(srcLabel(x.source))} ${fmtPct(x.share)}`).join(' · ')}</div></div>`;
  const own = (s.repeat || []).filter(x => x.source === 'own' || x.source === 'email').reduce((a, x) => a + x.share, 0);
  return `<div class="card"><h3 style="margin-bottom:2px">Do repeat orders need ads?</h3>
    <p class="hint" style="margin-bottom:10px">What the shopper last clicked before buying (Triple Whale). "On their own" means they came straight to the site or from organic social; "Email and SMS" means a Klaviyo or SMS message.</p>
    ${row('First orders', s.first)}${row('Repeat orders', s.repeat || [])}
    <p style="margin:10px 0 0;font-size:13.5px;color:var(--ink-2)">${own >= 0.6 ? `<b>${fmtPct(own)} of repeat orders arrive without an ad click.</b> The product and the emails are bringing people back; retargeting past customers is mostly paying for orders that would have come anyway.` : `<b>Only ${fmtPct(own)} of repeat orders arrive without an ad click.</b> The brand is paying ads to bring its own customers back. Email and SMS flows do that for a fraction of the cost.`}</p></div>`;
}

/** Each month's new customers: what they cost, what they have spent since. */
function cohortTable(j, cur) {
  const rows = (j.cohorts || []).slice().reverse();
  if (!rows.length) return '';
  const anyYear = rows.some(r => r.ltv_365 != null);
  return `<div class="card"><h3 style="margin-bottom:2px">Each month's new customers, followed since</h3>
    <p class="hint" style="margin-bottom:8px">Everyone who bought for the first time in that month. "Back per $1" is what they have spent in their first 90 days${anyYear ? ' (or first year, where a year has passed)' : ''} for every dollar it cost to get them. A month needs 90 days to show a figure.</p>
    <div class="tbl-wrap"><table>
      <thead><tr><th>First bought</th><th class="num">New customers</th><th class="num">Cost to get each</th><th class="num">Spent in 90 days</th>${anyYear ? '<th class="num">Spent in a year</th>' : ''}<th class="num">Back per $1</th><th class="num">Ordered again</th></tr></thead>
      <tbody>${rows.map(r => { const lc = r.ltv_cac_365 ?? r.ltv_cac_90; return `<tr${r.uncertain ? ' style="opacity:.55"' : ''}>
        <td><b>${esc(monthLabel(r.month))}</b>${r.uncertain ? ' <span class="tiny" title="Our history starts just before this month, so some of these people may have bought earlier">first months on record</span>' : ''}</td>
        <td class="num">${fmtN(r.customers)}</td><td class="num">${fmtMoney(r.cac, cur)}</td>
        <td class="num">${r.ltv_90 != null ? fmtMoney(r.ltv_90, cur) : '<span class="tiny">under 90 days old</span>'}</td>
        ${anyYear ? `<td class="num">${r.ltv_365 != null ? fmtMoney(r.ltv_365, cur) : '<span class="tiny">under a year old</span>'}</td>` : ''}
        <td class="num">${lc != null ? `<span class="pill ${lc >= 3 ? 'good' : lc >= 1.5 ? 'warn' : 'bad'}">${lc.toFixed(1)}x</span>` : ' - '}</td>
        <td class="num">${fmtPct(r.repeat_rate)}</td></tr>`; }).join('')}</tbody></table></div>
    <p class="tiny" style="margin-top:8px">Cost to get each = that month's ad spend across every platform ÷ its new customers (Triple Whale). Green is 3x or more, amber 1.5x to 3x, red under 1.5x.</p></div>`;
}

async function renderCustomersAll() {
  $('#main').innerHTML = `<div class="v2 lx">${LX.head('customers', 'Customers')}
    ${LX.say('Is a customer worth more than they cost to get? Each brand below, over the selected window. <b>3x or more</b> back per dollar is comfortable; <b>under 1.5x</b> the brand is buying revenue, not profit.', 'cuAllSay')}
    <div class="card"><h3 style="margin-bottom:2px">Back per dollar of ads, brand by brand</h3>
      <p class="hint" style="margin-bottom:8px">Per brand, the selected window. "Back per $1" is what a customer spends in their first 90 days (or year) for every dollar of ads it took to get them: 3x or more is comfortable, under 1.5x is thin.</p>
      <div class="tbl-wrap"><table>
      <thead><tr><th>Client</th><th class="num">Cost to get a customer</th><th class="num">First order</th><th class="num">Left after costs on it</th><th class="num">Spent in 90 days</th><th class="num">Back per $1</th><th class="num">Order again</th></tr></thead>
      <tbody>${S.accounts.map(a => `<tr data-id="${a.act_id}" style="cursor:pointer"><td><b>${esc(a.name)}</b></td>
        <td class="num" data-c="cac-${a.act_id}">…</td><td class="num" data-c="aov-${a.act_id}"></td><td class="num" data-c="gp-${a.act_id}"></td>
        <td class="num" data-c="l90-${a.act_id}"></td><td class="num" data-c="lc-${a.act_id}"></td><td class="num" data-c="rp-${a.act_id}"></td></tr>`).join('')}
      </tbody></table></div>
      <p class="tiny" style="margin-top:10px">Click a brand to see how that value arrives, what they buy first and next, and whether repeat orders need ads.</p></div></div>`;
  $('#main tbody').addEventListener('click', e => {
    const tr = e.target.closest('tr[data-id]'); if (!tr) return;
    S.act = tr.dataset.id; localStorage.setItem(LS.act, S.act);
    $('#clientPick').value = S.act; show('customers');
  });
  const run = ++RUN;
  /* Once every brand has answered, the sentence at the top names the strongest and thinnest. */
  const got = []; let answered = 0;
  const sayAll = () => {
    if (++answered < S.accounts.length) return;
    const el = $('#cuAllSay'); if (!el) return;
    const r = got.filter(x => x.ratio != null).sort((x, y) => y.ratio - x.ratio);
    if (!r.length) return;
    const thin = r.filter(x => x.ratio < 1.5);
    el.innerHTML = `<b>${esc(r[0].name)}</b> gets the most back: <b class="good">${r[0].ratio.toFixed(1)}x</b> per dollar of ads.${r.length > 1 ? ` ${thin.length ? `<span class="bad">${thin.length} brand${thin.length === 1 ? ' is' : 's are'} under 1.5x</span>: ${thin.map(x => esc(x.name)).join(', ')}.` : `The thinnest is ${esc(r[r.length - 1].name)} at ${r[r.length - 1].ratio.toFixed(1)}x.`}` : ''}`;
  };
  for (const a of S.accounts) {
    api(`/api/customers?act=${a.act_id}&${rangeQ()}`).then(r => {
      if (run !== RUN) return;
      const h = r.headline, j = r.journey, set = (k, v) => { const el = $(`[data-c="${k}-${a.act_id}"]`); if (el) el.innerHTML = v; };
      set('cac', `<b>${fmtMoney(h.cac, a.currency)}</b>`);
      set('aov', fmtMoney(h.new_aov, a.currency));
      set('gp', r.cm_ok && h.first_order_gp != null ? `${fmtMoney(h.first_order_gp, a.currency)}${h.payback != null ? ` <span class="tiny">(${fmtPct(Math.min(h.payback, 9.99))} of the cost)</span>` : ''}` : '<span class="tiny">needs cost data</span>');
      const c90 = j && j.have ? (j.curve || []).find(p => p.days === 90) : null;
      set('l90', c90 && c90.ltv != null ? fmtMoney(c90.ltv, a.currency) : '<span class="tiny">under 90 days of history</span>');
      const lc = j && j.have ? j.ltv_cac : null;
      set('lc', lc ? `<b><span class="pill ${lc.ratio >= 3 ? 'good' : lc.ratio >= 1.5 ? 'warn' : 'bad'}">${lc.ratio.toFixed(1)}x</span></b>` : ' - ');
      set('rp', j && j.have && j.repeat_rate_ever != null ? fmtPct(j.repeat_rate_ever) : fmtPct(h.repeat_share));
      got.push({ name: a.name, ratio: lc ? lc.ratio : null }); sayAll();
    }).catch(() => { if (run === RUN) sayAll(); if (run === RUN) { const el = $(`[data-c="cac-${a.act_id}"]`); if (el) el.innerHTML = '<span class="tiny"> - </span>'; } });
  }
}

async function renderCustomers(first) {
  if (S.act === 'all') return renderCustomersAll();
  const run = ++RUN;
  const acct = S.accounts.find(a => a.act_id === S.act);
  const shell = body => `<div class="v2 lx">${LX.head('customers', `Customers: ${esc(acct?.name || '')}`)}
    ${body}</div>`;
  if (first) $('#main').innerHTML = shell('<div class="card"><span class="hint">Loading…</span></div>');
  let d;
  try { d = await api(`/api/customers?act=${S.act}&${rangeQ()}`); }
  catch (e) { if (run === RUN) $('#main').innerHTML = shell(`<div class="card"><span style="color:var(--bad)">${esc(e.message)}</span></div>`); return; }
  if (run !== RUN) return;
  const cur = d.account.currency, h = d.headline, j = d.journey;
  const have = !!(j && j.have);
  const v = ltvVerdict(j, h, cur, d.cm_ok, acct?.name || 'this brand');
  const c90 = have ? (j.curve || []).find(p => p.days === 90) : null;
  const c365 = have ? (j.curve || []).find(p => p.days === 365) : null;
  const pb = h.payback;
  const lc = have ? j.ltv_cac : null;

  /* THE ANSWER FIRST: the LTV:CAC word, the working in plain English, and a gauge with the
     1.5x and 3x lines so where this brand sits reads before the sentence does. */
  const R = lc ? Math.max(0, Math.min(4.5, lc.ratio)) : null;
  const gauge = R == null ? '' : `<div class="cu-gauge"${window.V2UI.tipAttr(`Back per dollar of ads: ${lc.ratio.toFixed(2)}x over their ${lc.horizon === 365 ? 'first year' : 'first 90 days'}. Under 1.5x is thin, 1.5x to 3x works, 3x and up leaves room to pay more for a customer.`)}>
      <div class="trk"><b style="left:${(R / 4.5 * 100).toFixed(1)}%"></b></div>
      <div class="ax"><span style="left:0;transform:none">0x</span><span style="left:33.3%">1.5x</span><span style="left:66.6%">3x</span><span style="left:100%;transform:translateX(-100%)">4.5x</span></div>
      <div class="cap">Back per $1 of ads: <b style="color:var(--ink)">${lc.ratio.toFixed(1)}x</b> over their ${lc.horizon === 365 ? 'first year' : 'first 90 days'}</div></div>`;

  const tiles = [
    LX.tile({ compact: true, label: 'Cost to get a new customer', value: fmtMoney(h.cac, cur), sub: `ad spend divided by ${fmtN(h.new_orders)} new customers`, info: 'All ad spend across every platform divided by the number of first-time customers in the window (Triple Whale). Reports call this New-customer CPA; it is the same number.' }),
    LX.tile({ compact: true, label: 'Their first order', value: fmtMoney(h.new_aov, cur), sub: 'what a new customer spends first', info: 'Revenue from new customers divided by their orders, in the selected window.' }),
    d.cm_ok
      ? LX.tile({ compact: true, label: 'Left after costs on that order', value: `<span class="${pb != null ? (pb >= 1 ? 'good' : 'warn') : ''}">${fmtMoney(h.first_order_gp, cur)}</span>`, bullet: pb != null && h.cac ? window.V2UI.bullet(h.first_order_gp, h.cac, false, 'cost to get them') : '', sub: pb != null ? (pb >= 1 ? `covers the cost to get them, with ${fmtMoney(h.first_order_gp - h.cac, cur)} to spare` : `covers ${fmtPct(pb)} of the cost to get them`) : 'after product, shipping and fees', info: 'The first order after product costs, fulfilment and payment fees. When this is bigger than the cost to get the customer, the brand is in profit on day one.' })
      : LX.tile({ compact: true, label: 'Left after costs on that order', value: '<span style="color:var(--muted)">–</span>', go: 'costs', sub: 'needs trusted cost data (Settings, Costs)', info: 'Needs a product margin this brand’s cost data does not support yet.' }),
    LX.tile({ compact: true, label: 'Spent in their first 90 days', value: c90 && c90.ltv != null ? fmtMoney(c90.ltv, cur) : '<span style="color:var(--muted)">–</span>', sub: c90 && c90.ltv != null ? `per customer, ${fmtN(c90.customers)} old enough to count` : 'needs 90 days of history', info: 'Everything the average customer has spent in the 90 days after their first order, from Triple Whale order history.' }),
    LX.tile({ compact: true, label: 'Spent in their first year', value: c365 && c365.ltv != null ? fmtMoney(c365.ltv, cur) : '<span style="color:var(--muted)">–</span>', sub: c365 && c365.ltv != null ? `per customer, ${fmtN(c365.customers)} old enough to count` : 'needs a year of history', info: 'Everything the average customer has spent in the 365 days after their first order.' }),
    LX.tile({ compact: true, label: 'Order again', value: have && j.repeat_rate_ever != null ? fmtPct(j.repeat_rate_ever) : fmtPct(h.repeat_share), sub: have && j.days_to_second != null ? `the second order usually comes after ${fmtDays(j.days_to_second)}` : have ? 'of customers ever place a second order' : 'of orders were from past customers', info: have ? 'Share of customers who placed a second order, and how long the typical one took. Time the post-purchase emails to land just before that.' : 'Share of orders placed by someone who had bought before.' }),
  ].join('');

  $('#main').innerHTML = shell(`
    <section class="card sc ${v.tone}"><div class="cu-ver ${v.tone}">
      <div><h3 style="margin:0">Is a customer worth more than they cost to get?</h3>
        <div class="big">${esc(v.word)}</div>
        <p style="margin:0;color:var(--ink-2);font-size:13.5px;max-width:86ch;line-height:1.6">${v.body}</p></div>
      ${gauge}</div></section>
    ${h.thin ? `<div class="notice warn"><div><b>Only ${h.new_orders} new customers in this window.</b> The cost to get a customer swings on small numbers. Widen the date range, or read the month-by-month table.</div></div>` : ''}
    <div class="lx-t3">${tiles}</div>
    ${have ? `${ltvCurve(j, cur)}${cohortTable(j, cur)}<div class="v2two eq">${journeyCard(j, cur)}${sourcesCard(j)}</div>`
    : `<div class="card"><h3 style="margin-bottom:4px">What they spend over time, and what they buy</h3><p class="hint" style="margin:0">${j && j.reason ? esc(j.reason) : 'Customer history is still loading from Triple Whale.'} Until then this page shows the first-order numbers only.</p></div>`}
    <details class="footnote"><summary>Where these numbers come from, and what is approximate</summary>
      <div class="fn-body">The cost to get a customer and the first-order figures are Triple Whale store totals for the selected window. Spend over time, who orders again, how fast, and what they buy follow real customers through Triple Whale’s order history${have ? ` (${j.history.days} days on record, ${fmtN(j.customers)} customers; ${fmtN(j.guest_orders)} guest orders cannot be followed)` : ''}. People first seen in the first 60 days of that history may have bought before it starts, so they are left out of the averages. Products are what the shopper put in the cart, not the receipt. Connect Shopify (Settings) for exact order lines.</div></details>`);
  if (have) LX.wireChart('cuCurve');
}

/* ---------- Settings ----------
   REBUILT 2026-08-30, brand-first. Cole: "this shouldn't be set up by ad
   account, this is set up by brand… it should just be all condensed into one
   thing, not separate sections for each individual thing."

   It was four tables, one per SYSTEM: every ad account the Meta login can see
   (25 of them once portfolio discovery landed, of which six are brands),
   Shopify connections, Slack channels, and cost settings. Setting up one brand
   meant visiting four tables and knowing which row was the same brand in each.

   Now: one expandable row per brand, holding everything about that brand. The
   ad accounts you do NOT use never render at all - they exist only inside the
   Add a brand picker, which is the one moment they are relevant.

   Since brand-first phase 3 (2026-10-08) a brand is its own record (a.act_id =
   the brand id) and its Meta ad account is a connection (a.meta_act, null when
   none). The row shows that account; adding or changing one is Connections. */
async function renderSettings() {
  const run = ++RUN;
  const AGENCY = S.act === 'all' || SETMODE.get() === 'agency';
  const one = AGENCY ? null : S.accounts.find(a => a.act_id === S.act);
  // meta.js owns its own closure and only has a token if the host hands it one.
  // Doing this ONCE at the top, before anything calls it, is the fix for the
  // Team card reporting "the Meta section was not given a sign-in token" -
  // previously only the ad-accounts block set it, and it ran last.
  if (window.MetaTab) window.MetaTab.setToken(S.tok);

  /* SECTIONED (2026-10-04, Cole: "still very not good organized and formatted").
     It was one long scroll: the Strategist's two big text boxes sat ABOVE the
     brands, and seven unrelated cards were piled under "Everything else". Now a
     section list on the left (a strip on phones), the same pattern as Ledger's
     Settings, and one section shown at a time. Every section is rendered up
     front and only hidden, so each loader below finds its host exactly as
     before and switching is instant. */
  const bsec = window.__openGoals ? 'goals' : (BRAND_SECS.some(b => b[0] === localStorage.getItem('pf_set_bsec')) ? localStorage.getItem('pf_set_bsec') : 'about');
  const sec = !AGENCY ? (bsec === 'conn' ? 'connections' : bsec === 'stock' ? 'stock' : 'brands') : (SET_SECS.some(s => s[0] === localStorage.getItem('pf_set_sec')) ? localStorage.getItem('pf_set_sec') : 'brands');
  const allNote = '';

  async function loadGoals(box, a) {
    box.dataset.loaded = '1';

    catch (e) { box.innerHTML = `<span class="tiny" style="color:var(--bad)">${esc(e.message)}</span>`; return; }
    const r = g.rules, cur = a.currency;

       label and a one-line meaning on the left, the number in a fixed-width box on the right, grouped in cards. */
    const num = (k, label, v, unit, ph, hint) => `<label class="g-row"><span class="g-l"><b>${label}</b>${hint ? `<small>${hint}</small>` : ''}</span><span class="g-c"><span class="unit-in">${unit === '$' ? `<span>${sym(cur)}</span>` : ''}<input type="text" inputmode="decimal" data-g="${k}" value="${v == null ? '' : v}" placeholder="${ph || ''}">${unit && unit !== '$' ? `<span class="g-u">${unit}</span>` : ''}</span></span></label>`;

    box.innerHTML = `<div class="gwrap2">
      ${sec('The goal these rules use', 'Every platform', 'Agreed with the client and set with the month plan in Home > Goals. Every green, yellow and red in Locus is measured against it.',
        `<div class="g-row"><span class="g-l"><b>Goal cost per sale</b><small>What the client is willing to pay for one sale.</small></span><span class="g-c"><b class="g-val">${T != null ? fmtMoney(T, cur) : 'not set'}</b></span></div>`
        + `<div class="g-row"><span class="g-l"><b>Goal ROAS</b><small>Revenue back for every dollar of ad spend.</small></span><span class="g-c"><b class="g-val">${g.goal_roas ? g.goal_roas + 'x' : 'not set'}</b></span></div>`
        + `<div class="g-row"><span class="g-l"></span><span class="g-c"><button type="button" class="btn" data-g="togoals">Change in Home &gt; Goals</button></span></div>`)}
      ${sec('Judging tests', 'Meta', 'When a new test is ready for a call on Ads › Today, and what counts as a keeper.',
        num('judge_spend', 'Judge after spending', r.judge_spend_auto ? '' : r.judge_spend, '$', T ? `${Math.round(T * 3)}` : '150', T ? 'Blank means 3 times the goal cost per sale.' : '')
        + num('judge_days', 'Or after', r.judge_days, 'days', '', 'Whichever comes first.')

          min_track: tg.classList.contains('on') ? 1 : 0, monday_post: r.monday_post ? 1 : 0, min_spend: n('min_spend') || 0, min_days: n('min_days') || 7, min_cap_pct: n('min_cap_pct') || 25,
          cr_judge_x: n('cr_judge_x') || 1, cr_min_days: n('cr_min_days') || 3, cr_scale_buys: n('cr_scale_buys') || 2, cr_cut_zero_x: n('cr_cut_zero_x') || 3, cr_cut_cpa_x: n('cr_cut_cpa_x') || 1.5, cr_cut_spend_x: n('cr_cut_spend_x') || 2, cr_anchor_pct: n('cr_anchor_pct') || 50 };
