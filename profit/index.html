const TOUR = { key: null, i: 0, steps: [] };

function endTour() {
  document.querySelectorAll('.tour-wrap').forEach(n => n.remove());
  window.removeEventListener('resize', drawTour);
  window.removeEventListener('scroll', drawTour, true);
  document.removeEventListener('keydown', tourKeys);
  TOUR.key = null;
}
function tourKeys(e) {
  if (e.key === 'Escape') endTour();
  else if (e.key === 'ArrowRight' || e.key === 'Enter') stepTour(1);
  else if (e.key === 'ArrowLeft') stepTour(-1);
}
function stepTour(d) {
  const n = TOUR.i + d;
  if (n < 0) return;
  if (n >= TOUR.steps.length) { markTourSeen(TOUR.key); return endTour(); }
  TOUR.i = n; TOUR.scrolled = false; drawTour();
}

/** Paint the current step. Called again on resize and scroll so the spotlight
 *  tracks the element rather than drifting off it. */
function drawTour() {
  if (!TOUR.key) return;
  const s = TOUR.steps[TOUR.i];
  let wrap = document.querySelector('.tour-wrap');
  if (!wrap) {
    wrap = document.createElement('div');
    wrap.className = 'tour-wrap';
    wrap.innerHTML = '<div class="tour-spot"></div><div class="tour-box"></div>';
    document.body.appendChild(wrap);
    wrap.addEventListener('click', e => { if (e.target === wrap) endTour(); });
  }
  const spot = wrap.querySelector('.tour-spot'), box = wrap.querySelector('.tour-box');
  const el = s.sel ? document.querySelector(s.sel) : null;

  if (el) {
    /* Bring it into view, ONCE per step, then measure again in the SAME pass.
       An earlier version deferred the re-measure to requestAnimationFrame,
       which does not fire at all in a background tab - the tour froze on step
       one while the index climbed behind it. `behavior:'instant'` completes
       synchronously, so there is nothing to wait for. Once-per-step also
       matters on its own: an element pinned near the top of the page can never
       satisfy `top >= 60`, so an unguarded check re-scrolls on every redraw. */
    if (!TOUR.scrolled) {
      TOUR.scrolled = true;
      const r0 = el.getBoundingClientRect();
      if (r0.top < 60 || r0.bottom > innerHeight - 60) el.scrollIntoView({ block: 'center', behavior: 'instant' });
    }
    const r = el.getBoundingClientRect(), p = 8;
    spot.style.cssText = `display:block;top:${r.top - p}px;left:${r.left - p}px;width:${r.width + p * 2}px;height:${r.height + p * 2}px`;
  } else {
    spot.style.display = 'none';
  }

  const last = TOUR.i === TOUR.steps.length - 1;
  box.innerHTML = `<div class="tour-n">${TOUR.i + 1} of ${TOUR.steps.length}</div>
    ${s.title ? `<h3>${s.title}</h3>` : ''}
    <p>${s.body}</p>
    <div class="tour-btns">
      <button class="btn" data-t="skip">${last ? '' : 'Skip'}</button><span style="flex:1"></span>
      ${TOUR.i ? '<button class="btn" data-t="back">Back</button>' : ''}
      <button class="btn primary" data-t="next">${last ? 'Done' : 'Next'}</button>
    </div>`;
  box.querySelector('[data-t="next"]').onclick = () => stepTour(1);
  const b = box.querySelector('[data-t="back"]'); if (b) b.onclick = () => stepTour(-1);
  box.querySelector('[data-t="skip"]').onclick = () => { markTourSeen(TOUR.key); endTour(); };

  // Position: under the element if it fits, above if not, centred with no element.
  box.style.cssText = 'visibility:hidden;display:block';
  const bw = box.offsetWidth, bh = box.offsetHeight;
  if (el) {
    const r = el.getBoundingClientRect();
    const below = r.bottom + 14 + bh < innerHeight;
    const top = below ? r.bottom + 14 : Math.max(12, r.top - bh - 14);
    let left = r.left + r.width / 2 - bw / 2;
    left = Math.max(12, Math.min(left, innerWidth - bw - 12));
    box.style.cssText = `top:${top}px;left:${left}px`;
  } else {
    box.style.cssText = `top:${Math.max(12, innerHeight / 2 - bh / 2)}px;left:${Math.max(12, innerWidth / 2 - bw / 2)}px`;
  }
}

/* THE PAGE TOUR IS READ OFF THE PAGE (2026-10-08). The hand-written tours pointed at layouts that the v2/v3
   redesigns replaced, so on most pages every step was filtered out and Tour did nothing at all (Cole). A
   hand-written tour still runs when most of its steps exist; otherwise the tour walks what is actually on
   screen: the page tabs, the date and attribution controls, then each card by its own heading and subtitle,
   so it can never point at something that is not there and needs no upkeep when a page changes. */
function autoTourSteps(key) {
  document.querySelectorAll('[data-tourauto]').forEach(e => e.removeAttribute('data-tourauto'));
  const steps = [], seen = new Set(); let n = 0;
  const add = (el, title, body) => { if (!el || seen.has(el) || !el.offsetParent || steps.length >= 9) return; seen.add(el); el.setAttribute('data-tourauto', ++n); steps.push({ sel: `[data-tourauto="${n}"]`, title, body }); };
  const b = PAGE_BRIEF[key];
  steps.push({ title: TAB_TITLE[key] || 'This page', body: b ? `<b>What it answers.</b> ${b.answers}<br><b>What to do.</b> ${b.todo}` : 'A quick walk through what is on this page.' });
  const seg = document.querySelector('#v2seg:not([hidden])');
  if (seg && seg.querySelectorAll('button').length > 1) add(seg, 'The pages in this section', 'Each tab is a page in this section. The one you are on is highlighted.');
  add(document.querySelector('#hdPeriod'), 'The dates', 'Every number on this page covers these dates. Change them here; the compare period is in the same menu.');
  const model = document.querySelector('#hdModel'); if (model && !model.closest('[hidden]')) add(model, 'Who gets credit', 'Picks which attribution model credits orders to each platform. Spend is always the platform\u2019s own.');
  const tiles = document.querySelector('#main .v2tiles, #main .lx-t5, #main .rollup'); add(tiles, 'The headline numbers', 'Each tile is one number for the dates above, with the change against the compare period. Hover a tile for its meaning.');
  document.querySelectorAll('#main .v2card, #main section.card').forEach(c => {
    const h = c.querySelector('.v2h h3, h3'); if (!h) return;
    const sub = c.querySelector('.v2h .find, .v2h .sub, .v2hint, p');
    add(c, h.textContent.trim().slice(0, 80), sub && sub.textContent.trim() ? esc(sub.textContent.trim().slice(0, 260)) : 'Hover anything here for its meaning; click a row to open it.');
  });
  return steps;
}
function startTour(key) {
  endTour();
  const t = TOURS[key];
  // The Settings tour points at the Brands section; open it so the steps are visible.
  if (key === 'settings') document.querySelector('#setNav [data-sec="brands"]')?.click();
  // Drop steps whose element is not on screen for this state, rather than
  // pointing the spotlight at nothing. A tour that lost most of its steps is out of date: use the page itself.
  const kept = t ? t.steps.filter(s => !s.sel || document.querySelector(s.sel)) : [];
  // Only the tours re-checked against the current layout stay hand-written; every page tour is read off the page.
  TOUR.steps = t && (key === 'start' || key === 'settings') && kept.length ? kept : autoTourSteps(key);
  if (!TOUR.steps.length) return;
  TOUR.key = key; TOUR.i = 0; TOUR.scrolled = false;
  window.addEventListener('resize', drawTour);
  window.addEventListener('scroll', drawTour, true);
  document.addEventListener('keydown', tourKeys);
  drawTour();
}

/** Offer a tab's tour once, the first time it is opened. Never twice, and never
 *  as a modal - an interruption you did not ask for is the thing everyone hates
 *  about product tours. */
function offerTour(tab) {
  const key = TOURS[tab] ? tab : null;
  if (!key || !S.tok) return;
  const seen = tourSeen();
  if (!seen.start) {                       // the cadence tour comes first, once
    if (seen.startOffered) return;
    localStorage.setItem(TOUR_SEEN, JSON.stringify({ ...seen, startOffered: 1 }));
    const bar = document.createElement('div');
    bar.className = 'tour-offer';
    bar.innerHTML = `<span><b>First time here?</b> A one-minute tour of how Locus fits together.</span>
      <button class="btn primary" data-t="go">Show me</button><button class="btn" data-t="no">No thanks</button>`;
    $('#main').prepend(bar);
    bar.querySelector('[data-t="go"]').onclick = () => { bar.remove(); startTour('start'); };
    bar.querySelector('[data-t="no"]').onclick = () => { markTourSeen('start'); bar.remove(); };
    return;
  }
  if (seen[key]) return;
  markTourSeen(key);                        // offered once, whether or not taken
  const bar = document.createElement('div');
  bar.className = 'tour-offer';
  bar.innerHTML = `<span>New to this page? <b>${esc(TOURS[key].name)}</b> in ${TOURS[key].steps.length} steps.</span>
    <button class="btn primary" data-t="go">Show me</button><button class="btn" data-t="no">Dismiss</button>`;
  $('#main').prepend(bar);
  bar.querySelector('[data-t="go"]').onclick = () => { bar.remove(); startTour(key); };
  bar.querySelector('[data-t="no"]').onclick = () => bar.remove();
}

/* "Show me" sits beside the help buttons on every page, and Settings carries the
   full list so any tour can be replayed - Cole asked for exactly that. */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-tour]');
  if (b) { e.preventDefault(); startTour(b.dataset.tour); }
});

/* Set while a shared ad page is open, so the video endpoint can authorise
   playback against that snapshot the way a report token does. */
let AD_SHARE_TOKEN = null;

/** The client's view of a shared set of ads. Unauthenticated, read-only, and
 *  frozen: the rows and the cover images were stored when the link was made, so
 *  this says the same thing in a month as it did on the day it was sent.
 *
 *  REDESIGNED 2026-09-16 (Cole: "this could be laid out a lot better ... give
 *  controls to the client"). The snapshot now holds up to 40 ads rather than
 *  the eight on screen, and the client sorts, filters and sizes the list
 *  THEMSELVES - within that frozen set, so nothing drifts after it was sent.
 *  It opens on the view Cole was looking at when he made the link.
 *
 *  Ratio sorts (ROAS, CPA, hook, hold, CTR) only rank ads flagged `qualifies`
 *  - the same evidence rule the internal browser uses, carried across as a
 *  yes/no so the page never has to show the dollar floor behind it. Older
 *  links carry no flag and rank everything, as they always did. */
async function renderAdShare(token) {
  chrome(false);
  setChip('Shared', 'ok');
  document.body.classList.add('shp-body');
  let d;
  try { d = await api(`/api/ad-share/${encodeURIComponent(token)}`); }
  catch (e) { $('#main').innerHTML = `<div class="card"><h2>Link not available</h2><p class="hint">${esc(e.message)}</p></div>`; return; }

  const cur = d.account.currency;
  const typeOf = a => a.media_type || (a.is_video || a.video ? 'video' : 'image');
  const all = (d.ads || []).map(a => ({ ...a, is_video: typeOf(a) === 'video', video: typeOf(a) === 'video' }));
  const money = n => n == null ? '–' : fmtMoney(n, cur);
  const pct = (n, dp = 1) => n == null ? '–' : (n * 100).toFixed(dp) + '%';
  const x = n => n == null ? '–' : n.toFixed(2) + 'x';
  const int = n => n == null ? '–' : Math.round(n).toLocaleString('en-US');
  const fmtDay = (s, year = true) => { const t = new Date(String(s).slice(0, 10) + 'T12:00:00Z'); return isNaN(t) ? String(s) : t.toLocaleDateString('en-US', { month: 'short', day: 'numeric', ...(year ? { year: 'numeric' } : {}), timeZone: 'UTC' }); };
  const range = d.range || {};
  const when = range.from ? `${fmtDay(range.from, false)} – ${fmtDay(range.to)}` : '';
  const made = d.created_at ? fmtDay(String(d.created_at).slice(0, 10)) : '';
  const TYPE_LABEL = { video: 'Video', image: 'Image', carousel: 'Carousel' };
  const types = ['video', 'image', 'carousel'].filter(t => all.some(a => typeOf(a) === t));

  /* What the client can sort on. `ratio` sorts need evidence; `video` sorts
     only mean anything on a video; `dir` 1 means lower is better. */
  const METRICS = {
    spend:     { label: 'Spend',     fmt: a => money(a.spend), key: a => a.spend, dir: -1 },
    roas:      { label: 'ROAS',      fmt: a => x(a.roas), key: a => a.roas, dir: -1, ratio: true },
    cpa:       { label: 'CPA',       fmt: a => money(a.cpa), key: a => a.cpa, dir: 1, ratio: true },
    purchases: { label: 'Purchases', fmt: a => int(a.purchases || 0), key: a => a.purchases || 0, dir: -1 },
    hook:      { label: 'Hook rate', fmt: a => pct(a.hook), key: a => a.hook, dir: -1, ratio: true, video: true },
    hold:      { label: 'Hold rate', fmt: a => pct(a.hold), key: a => a.hold, dir: -1, ratio: true, video: true },
    ctr:       { label: 'Link CTR',  fmt: a => pct(a.ctr, 2), key: a => a.ctr, dir: -1, ratio: true },
    newest:    { label: 'Newest',    fmt: a => a.created ? fmtDay(a.created) : '–', key: a => a.created ? Date.parse(a.created + 'T12:00:00Z') : null, dir: -1, nofill: true },
  };

  /* Opens on the view the link was made from; the hash overrides it so a
     client can bookmark or send "top 12 videos by hook" as a link of their own. */
  /* Links minted before defaults were stored still carry the sort in their
     label ("ROAS · Jun 18–Sep 15"), so they open on it rather than on spend. */
  const dft = d.defaults || (() => {
    const word = String(d.label || '').split('·')[0].trim().toLowerCase();
    const hit = Object.entries(METRICS).find(([, m]) => m.label.toLowerCase() === word);
    return hit ? { sort: hit[0] } : {};
  })();
  const st = { sort: METRICS[dft.sort] ? dft.sort : 'spend',
    fmt: dft.fmt === 'static' ? 'image' : (TYPE_LABEL[dft.fmt] ? dft.fmt : ''),
    limit: [4, 8, 12, 0].includes(+dft.limit) ? +dft.limit : 8 };
  const locked = !!d.locked;
  if (!locked) try {
    const h = new URLSearchParams(location.hash.slice(1));
    if (METRICS[h.get('sort')]) st.sort = h.get('sort');
    if (h.has('show')) st.fmt = TYPE_LABEL[h.get('show')] ? h.get('show') : '';
    if (h.has('top')) { const n = h.get('top') === 'all' ? 0 : +h.get('top'); if ([4, 8, 12, 0].includes(n)) st.limit = n; }
  } catch { /* a hash nobody wrote */ }
  if (st.fmt && !types.includes(st.fmt)) st.fmt = '';
  const writeHash = () => { if (locked) return; try { history.replaceState(null, '', `#sort=${st.sort}&show=${st.fmt || 'all'}&top=${st.limit || 'all'}`); } catch { /* fine */ } };

  const view = () => {
    const m = METRICS[st.sort];
    const pool = all.filter(a => !st.fmt || typeOf(a) === st.fmt).filter(a => !m.video || a.is_video);
    const list = pool.filter(a => !m.ratio || a.qualifies !== false).slice().sort((a, b) => {
      const av = m.key(a), bv = m.key(b);
      if (av == null && bv == null) return 0;
      if (av == null) return 1;
      if (bv == null) return -1;
      return (av - bv) * m.dir;
    });
    return { m, pool, list, shown: st.limit ? list.slice(0, st.limit) : list };
  };

  /* Whole-set figures for the hero, so the headline never moves with a filter. */
  const tot = all.reduce((t, a) => { t.spend += a.spend || 0; t.rev += a.revenue || 0; t.purch += a.purchases || 0; return t; }, { spend: 0, rev: 0, purch: 0 });
  const mix = types.map(t => `${all.filter(a => typeOf(a) === t).length} ${TYPE_LABEL[t].toLowerCase()}`).join(' · ');
  const kpi = (l, v, note) => `<div class="shp-kpi"><span>${l}</span><b>${v}</b>${note ? `<small>${note}</small>` : ''}</div>`;

  /* Four things worth saying before any sorting: who spent most, who returned
     most, who converted cheapest, which video stopped the most scrolls. */
  const q = all.filter(a => a.qualifies !== false);
  const best = (arr, k, low) => arr.filter(a => a[k] != null && (!low || a.purchases > 0)).sort((a, b) => low ? a[k] - b[k] : b[k] - a[k])[0];
  const hls = [
    ['Biggest spend', best(all, 'spend'), a => money(a.spend)],
    ['Best ROAS', best(q, 'roas'), a => x(a.roas)],
    ['Lowest CPA', best(q, 'cpa', true), a => money(a.cpa)],
    ['Strongest hook', best(q.filter(a => a.is_video), 'hook'), a => pct(a.hook)],
  ].filter(([, a]) => a);
  const hl = ([l, a, f]) => `<div class="shp-hl" data-ad="${esc(a.ad_id)}" role="button" tabindex="0">
    ${a.thumb ? `<img src="${a.thumb}" alt="">` : '<span class="ph"></span>'}
    <div><span>${l}</span><b>${f(a)}</b><small title="${esc(a.name)}">${esc(a.name)}</small></div></div>`;

  const pill = (g, v, label, on) => `<button type="button" class="shp-pill${on ? ' on' : ''}" data-g="${g}" data-v="${esc(String(v))}" aria-pressed="${on}">${esc(label)}</button>`;
  const bar = () => locked ? `
    <div class="shp-ctl"><span class="shp-ctl-l">View</span><span class="shp-fixed">Top ${st.limit || 'all'} by ${METRICS[st.sort].label.toLowerCase()}${st.fmt ? ` · ${TYPE_LABEL[st.fmt].toLowerCase()} only` : ''}</span></div>
    <span class="shp-count" id="shpCount"></span>` : `
    <div class="shp-ctl"><span class="shp-ctl-l">Sort by</span><div class="shp-pills">${Object.entries(METRICS).map(([k, m]) => pill('sort', k, m.label, st.sort === k)).join('')}</div></div>
    ${types.length > 1 ? `<div class="shp-ctl"><span class="shp-ctl-l">Show</span><div class="shp-pills">${pill('fmt', '', 'All', !st.fmt)}${types.map(t => pill('fmt', t, TYPE_LABEL[t], st.fmt === t)).join('')}</div></div>` : ''}
    <div class="shp-ctl"><span class="shp-ctl-l">Top</span><div class="shp-pills">${[4, 8, 12, 0].map(n => pill('limit', n, n ? String(n) : 'All', st.limit === n)).join('')}</div></div>
    <span class="shp-count" id="shpCount"></span>`;

  const cell = (l, v) => `<div class="shp-stat"><span>${l}</span><b>${v}</b></div>`;
  const card = (a, i, m, top) => {
    const v = m.key(a);
    const fill = !m.nofill && top != null && v != null && top > 0 && v > 0 ? (m.dir === -1 ? v / top : top / v) : null;
    const rows = [
      ['spend', 'Spend', money(a.spend)], ['roas', 'ROAS', x(a.roas)], ['cpa', 'CPA', money(a.cpa)],
      ['purchases', 'Purchases', int(a.purchases || 0)],
      ...(a.is_video ? [['hook', 'Hook', pct(a.hook)], ['hold', 'Hold', pct(a.hold)]] : []),
      ['ctr', 'Link CTR', pct(a.ctr, 2)],
      ...(a.created ? [['newest', 'Live since', fmtDay(a.created, false)]] : []),
    ].filter(r => r[0] !== st.sort);
    return `<article class="shp-card" data-ad="${esc(a.ad_id)}">
      <div class="ad-media shp-media${a.thumb ? '' : ' none'}"${a.is_video && a.ad_id ? ` data-ad="${esc(a.ad_id)}"` : ''}>
        ${a.thumb ? `<img src="${a.thumb}" alt="Creative for ${esc(a.name)}" loading="lazy">` : `<span class="ad-noimg">No preview<small>${TYPE_LABEL[typeOf(a)] || ''}</small></span>`}
        <span class="shp-rank">${i + 1}</span><span class="shp-type">${TYPE_LABEL[typeOf(a)] || 'Ad'}</span>
        ${a.is_video && a.ad_id ? '<button class="ad-play" type="button" title="Play this ad"><i>▶</i></button>' : ''}
      </div>
      <div class="shp-body">
        <div class="shp-name" title="${esc(a.name)}">${esc(a.name)}</div>
        <div class="shp-lead"><span>${esc(m.label)}</span><b>${m.fmt(a)}</b></div>
        ${fill != null ? `<div class="shp-fill" aria-hidden="true"><i style="width:${(Math.max(0.04, Math.min(1, fill)) * 100).toFixed(1)}%"></i></div>` : ''}
        <div class="shp-stats">${rows.map(r => cell(r[1], r[2])).join('')}</div>
        <div class="shp-open">Details <span>→</span></div>
      </div></article>`;
  };

  $('#main').innerHTML = `<div class="shp">
    <header class="shp-hero">
      <div class="shp-hero-top"><span class="shp-brand"><i></i>Mobius Digital</span><span class="shp-when">${made ? `Prepared ${esc(made)}` : ''}</span></div>
      <h1 class="shp-title">${esc(d.account.name)}<em>What is working</em></h1>
      <p class="shp-sub">${all.length} ad${all.length === 1 ? '' : 's'}${when ? ` · ${esc(when)}` : ''} · Meta&rsquo;s own reported figures, frozen when this page was made</p>
      <div class="shp-kpis">
        ${kpi('Ad spend', money(tot.spend), 'across these ads')}
        ${kpi('Purchases', int(tot.purch))}
        ${kpi('ROAS', tot.spend ? x(tot.rev / tot.spend) : '–', 'revenue ÷ spend')}
        ${kpi('Cost per purchase', tot.purch ? money(tot.spend / tot.purch) : '–')}
        ${kpi('Formats', `${types.length} ${types.length === 1 ? 'type' : 'types'}`, mix || '')}
      </div>
    </header>
    ${hls.length ? `<div class="shp-high">${hls.map(hl).join('')}</div>` : ''}
    <div class="shp-bar" id="shpBar">${bar()}</div>
    <div class="shp-grid" id="shpGrid"></div>
    <p class="shp-note" id="shpNote"></p>
    <details class="shp-glossary"><summary>How to read these numbers</summary><dl>
      <dt>Spend</dt><dd>What Meta charged for this ad in the window.</dd>
      <dt>ROAS</dt><dd>Revenue Meta attributes to the ad, divided by its spend. 2.00x means two dollars back for one in.</dd>
      <dt>CPA</dt><dd>Spend divided by purchases - what one sale cost. Lower is better.</dd>
      <dt>Hook rate</dt><dd>Of everyone shown a video, the share who watched three seconds. Did it stop the scroll? 30%+ is strong.</dd>
      <dt>Hold rate</dt><dd>Of those who watched three seconds, the share who stayed to the end. 60%+ is strong.</dd>
      <dt>Link CTR</dt><dd>Link clicks divided by impressions. It runs well under 1% on most accounts - this is not the &ldquo;CTR (all)&rdquo; that counts likes and profile taps.</dd>
      <dt>Why some ads are left out of a ROAS or CPA sort</dt><dd>A ratio on very little spend is noise, not a result - one lucky sale on $12 would top every list. Those sorts only rank ads with enough spend, or enough sales, to judge. Sort by spend, purchases or newest to see every ad.</dd>
    </dl></details>
  </div>`;

  const grid = $('#shpGrid'), note = $('#shpNote'), barEl = $('#shpBar');
  const paint = () => {
    const { m, pool, list, shown } = view();
    const top = shown.length ? m.key(shown[0]) : null;
    grid.innerHTML = shown.length ? shown.map((a, i) => card(a, i, m, top)).join('')
      : `<div class="shp-empty">No ${st.fmt ? TYPE_LABEL[st.fmt].toLowerCase() + ' ' : ''}ads to rank on ${m.label.toLowerCase()} here${m.ratio ? ' - try sorting by spend or purchases' : ''}.</div>`;
    const left = pool.length - list.length;
    const bits = [`Showing <b>${shown.length}</b> of ${list.length} ad${list.length === 1 ? '' : 's'}`];
    if (m.video) bits.push('video only, since there is nothing to watch on an image');
    if (m.ratio && left > 0) bits.push(`${left} ad${left === 1 ? '' : 's'} with too little spend to judge on ${m.label.toLowerCase()} left out`);
    note.innerHTML = bits.join(' · ') + '.';
    const cnt = $('#shpCount'); if (cnt) cnt.textContent = `${shown.length} of ${list.length}`;
    grid.querySelectorAll('.ad-media[data-ad]').forEach(attachPlay);
  };
  const repaintBar = () => { barEl.innerHTML = bar(); };

  barEl.addEventListener('click', ev => {
    const b = ev.target.closest('.shp-pill'); if (!b) return;
    const g = b.dataset.g, v = b.dataset.v;
    if (g === 'sort') st.sort = v;
    else if (g === 'fmt') st.fmt = v;
    else st.limit = +v;
    writeHash(); repaintBar(); paint();
  });
  // The card opens the detail; the media on a video plays it. Same rule as
  // the internal browser, same modal, so nothing the client sees is a lookalike.
  const openDetail = id => { const hit = all.find(a => a.ad_id === id); if (hit) adDetailModal(hit, cur); };
  grid.addEventListener('click', ev => {
    if (ev.target.closest('.ad-media[data-ad]') || ev.target.closest('.ad-frame')) return;
    const el = ev.target.closest('.shp-card'); if (el) openDetail(el.dataset.ad);
  });
  $('#main').querySelectorAll('.shp-hl').forEach(el => {
    el.onclick = () => openDetail(el.dataset.ad);
    el.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); openDetail(el.dataset.ad); } };
  });

  clientFooter('');
  // Playback on the client's link: the share token authorises the ads the
  // snapshot contains, the same way a report archive token does.
  RS.token = null;
  AD_SHARE_TOKEN = token;
  writeHash();
  paint();

  /* COVERS ARRIVE AFTER THE NUMBERS. Links are minted without images now, so
     the page asks for them by share token - the ads on screen first, then the
     rest - and patches each card and highlight tile as its cover lands. */
  const missing = all.filter(a => !a.thumb).map(a => a.ad_id);
  if (missing.length) {
    const order = [...new Set([...view().shown.map(a => a.ad_id), ...missing])].filter(id => missing.includes(id));
    const chunks = []; for (let i = 0; i < order.length; i += 12) chunks.push(order.slice(i, i + 12));
    (async () => {
      for (const ids of chunks) {
        let r;
        try { r = await api(`/api/ad-creatives?ads=${encodeURIComponent(ids.join(','))}&share=${encodeURIComponent(token)}`); } catch { continue; }
        for (const [id, v] of Object.entries(r.assets || {})) {
          const a = all.find(x => x.ad_id === id); if (!a || !v) continue;
          for (const k of ['headline', 'body', 'description', 'cta', 'preview', 'duration', 'partnership']) if (v[k] != null && a[k] == null) a[k] = v[k];
          if (!v.thumb) continue;
          a.thumb = v.thumb;
          $('#main').querySelectorAll(`[data-ad="${CSS.escape(id)}"]`).forEach(el => {
            if (el.classList.contains('shp-hl')) { const ph = el.querySelector('.ph'); if (ph) ph.outerHTML = `<img src="${v.thumb}" alt="">`; }
            else if (el.classList.contains('shp-card')) {
              const m = el.querySelector('.shp-media'); if (!m || m.querySelector('img')) return;
              m.classList.remove('none');
              const ph = m.querySelector('.ad-noimg'); if (ph) ph.remove();
              m.insertAdjacentHTML('afterbegin', `<img src="${v.thumb}" alt="Creative for ${esc(a.name)}">`);
            }
          });
        }
      }
    })();
  }
}

/* ---------- Creative browser ----------
   Cole asked for the report's ad cards, live and sortable: "top ads by spend,
   by ROAS, by CPA, by hook rate… filter by video only, static only", with the
   same date ranges as everywhere else. The card layout is deliberately the same
   shape the weekly report already uses, because the whole point is that what
   you sort through here is what the client eventually sees.

   Eight by default, in two rows of four - his suggestion and a good one: an
   unbounded grid invites scrolling, while a fixed short list forces the sort to
   do the work. Fewer than eight simply renders fewer.

   The ratio sorts are filtered to MATERIAL ads server-side; the footer always
   states how many were considered and how much spend is on screen, because a
   "top 8 by ROAS" that quietly dropped 90% of spend is a lie of omission. */
const CB = { sort: 'spend', fmt: '', limit: 8, attr: (localStorage.getItem('pf_cb_attr') || 'lastPlatformClick').replace(/^meta$/, 'lastPlatformClick'), run: 0,
  /* THE QUALIFYING THRESHOLD, as a multiple of the brand's GOAL CPA.
     A multiple rather than a dollar figure because it means the same thing in
     every account: "this ad has had enough budget to have hit target N times".
     The multiple is a view preference and lives here; the GOAL CPA it multiplies
     is a team standard and lives on the account, so two people cannot be looking
     at two different bars without knowing it. */
  /* `+null` is 0, and 0 is a MEANINGFUL value here ("Any spend") - so a missing
     key read through Number() silently makes "rank everything" the default for
     everyone who has never touched the control, which is the opposite of the
     intent. Check for the key before coercing it. */
  mult: (() => { const raw = localStorage.getItem('pf_cb_mult'); const v = raw == null ? NaN : +raw; return isFinite(v) && v >= 0 ? v : 3; })(),
  /* A typed threshold survives a reload like the multiple does; otherwise the
     control looked like it forgot you every time the tab came back. */
  lock: false,
  minSpend: (() => { const raw = localStorage.getItem('pf_cb_min_spend'); const v = raw == null ? NaN : +raw; return isFinite(v) && v >= 0 ? v : null; })() };
/* Plain "Custom": the old "Custom $…" read as a label cut off mid-word. */
const CB_MULTS = [['0', 'Any spend'], ['1', '1×'], ['2', '2×'], ['3', '3×'], ['5', '5×'], ['custom', 'Custom']];
/* ATTRIBUTION SOURCE. Cole's rule is Triple Whale for anything attribution-
   shaped, Meta only where TW cannot measure it - and TW returns ALL of these
   models in the SAME response, so there was never a reason to pick one in code
   and impose it. Only revenue, purchases, ROAS and CPA change with this; spend,
   hook, hold, CTR and CPM are delivery figures TW does not measure and stay
   Meta's under every setting. */
/* TRIPLE WHALE'S OWN NAMES, because the API's names are not what Cole sees in
   Triple Whale. Their docs: Triple Attribution "gives credit to the last ad the
   customer clicked through on the particular platform" and is "sometimes
   referred to as last platform click" - so `lastPlatformClick` IS Triple
   Attribution, and calling it by the API key made the one model he uses look
   missing.
   TRIPLE ATTRIBUTION + VIEWS IS NOT IN THE API, and that is measured rather
   than assumed: a live sync across 130 orders reported exactly seven models -
   firstClick, lastClick, fullFirstClick, fullLastClick, lastPlatformClick,
   linear, linearAll - none of them view-based. It is listed and disabled rather
   than omitted, so its absence is an answer instead of a puzzle. */
const attrLabel = k => (CB_ATTR.find(x => x[0] === k) || [, k || 'attribution'])[1];
const CB_ATTR = [
  ['lastPlatformClick', 'Triple Attribution'],
  ['__views', 'Triple Attribution + Views', 'not available through the API - it blends ad views, and the endpoint returns click touchpoints only'],
  ['linearAll', 'Linear All'],
  ['linear', 'Linear'],
  ['fullLastClick', 'Last Click'],
  ['fullFirstClick', 'First Click'],
];   // Meta's own attribution was removed 2026-10-04: attribution is always Triple Whale (Cole's standing rule)
/* Sorts that are a RATIO and therefore need a spend floor to mean anything.
   Kept beside the UI as well as in the worker so the page can say which rule is
   currently in force rather than leaving the reader to guess. */
const RATIO_SORTS = new Set(['roas', 'cpa', 'ctr', 'cpm', 'hook', 'hold', 'completion', 'frequency']);
const CB_SORTS = [
  ['spend', 'Spend'], ['roas', 'ROAS'], ['cpa', 'CPA'], ['purchases', 'Purchases'],
  ['hook', 'Hook rate'], ['hold', 'Hold rate'], ['ctr', 'Link CTR'], ['cpm', 'CPM'], ['newest', 'Newest'],
];

/* The brand's yellow zone (rules.yellow_pct, Settings > Goals) for the card
   verdicts. Cached per account for the session; 30 when it cannot be read. */
const CB_RULES = {};
async function cbRulesFor(act) {
  if (CB_RULES[act]) return CB_RULES[act];
  try { const g = await api(`/api/brand/rules?act=${encodeURIComponent(act)}`); CB_RULES[act] = g.rules || {}; }
  catch { return {}; }
  return CB_RULES[act];
}

/* opts (all optional, remembered on the host for internal re-renders):
   fresh: { get(), set(v) } puts the "an ad is new for" picker under More options;
   notes: an element for the "How these numbers work" disclosure (else it goes in host). */
async function renderCreativeBrowser(host, act, range, opts) {
  opts = opts || host._cbOpts || {};
  host._cbOpts = opts;
  /* RE-RENDERS KEEP THE PAGE WHERE IT IS. Swapping the grid for a one-line
     "Loading" card collapsed the page and threw the reader back to the top on
     every sort change; the old cards stay, dimmed, until the new ones land. */
  if (host.querySelector('.cb-bar')) host.style.opacity = '.55';
  else host.innerHTML = '<div class="card"><span class="hint">Loading ads…</span></div>';
  let d;
  const q = `act=${encodeURIComponent(act)}&from=${range.from}&to=${range.to}`
    + `&sort=${CB.sort}&limit=${CB.limit}&attr=${encodeURIComponent(CB.attr)}`
    + `${CB.fmt ? '&format=' + encodeURIComponent(CB.fmt) : ''}`
    + (CB.minSpend != null ? `&min_spend=${CB.minSpend}` : `&mult=${CB.mult}`);
  let rules = {};
  try { [d, rules] = await Promise.all([api('/api/ads?' + q), cbRulesFor(act)]); }
  catch (e) { host.style.opacity = ''; host.innerHTML = `<div class="card"><span style="color:var(--bad)">Couldn't load ads: ${esc(e.message)}</span></div>`; return; }
  if (!host.isConnected) return;
  host.style.opacity = '';

  const cur = d.account.currency;
  /* THE VERDICT, against the brand's ONE goal CPA (accounts.target_cpa):
     Scale = CPA at or under goal with 2+ purchases. Cut = CPA more than the
     yellow zone (default 30%) over goal, or no sales after spending 1.5x goal.
     Watch = everything between. No goal, no chip: a guess is worse than none. */
  const goal = d.target_cpa > 0 ? +d.target_cpa : null;
  const yp = rules.yellow_pct > 0 ? +rules.yellow_pct : 30;
  const cutLine = goal ? goal * (1 + yp / 100) : null;
  const verdictOf = a => {
    if (!goal) return null;
    const p = a.purchases || 0;
    if (a.cpa != null && a.cpa <= goal && p >= 2) return ['scale', 'Scale', `CPA ${fmtMoney(a.cpa, cur)} is at or under the ${fmtMoney(goal, cur)} goal on ${Math.round(p * 10) / 10} sales`];
    if (a.cpa != null && a.cpa > cutLine) return ['cut', 'Cut', `CPA ${fmtMoney(a.cpa, cur)} is more than ${yp}% over the ${fmtMoney(goal, cur)} goal`];
    if (!p && (a.spend || 0) >= goal * 1.5) return ['cut', 'Cut', `Spent ${fmtMoney(a.spend, cur)} (1.5x the goal CPA or more) with no sales`];
    return ['watch', 'Watch', a.cpa == null ? 'No sales yet, and not enough spend to call it'
      : a.cpa <= goal ? `CPA ${fmtMoney(a.cpa, cur)} is at or under goal, but it needs 2 sales to call it`
      : `CPA ${fmtMoney(a.cpa, cur)} is over the goal, but within ${yp}% of it`];
  };
  const money = n => n == null ? ' - ' : fmtMoney(n, cur);
  const pct = n => n == null ? ' - ' : (n * 100).toFixed(1) + '%';
  /* The strong/average/low words are Motion's published benchmarks across many
     accounts, not this account's own history - stated on the page so nobody
     reads them as a Locus opinion. */
  const band = (v, low, good) => v == null ? '' : v >= good ? ' good' : v < low ? ' bad' : ' ok';

  /* Four numbers per card. Hold, purchases, CTR, CPM and age live in Details. */
  const num = (label, value, cls = '', tip = '') =>
    `<div class="cb-n"${tip ? ` title="${esc(tip)}"` : ''}><span>${label}</span><b class="${cls}">${value}</b></div>`;

  const card = (a, i) => {
    const canPlay = a.is_video && a.ad_id;
    const v = verdictOf(a);
    /* THE PLACEHOLDER MUST NOT LOOK LIKE A BUTTON. A missing image used to draw
       a big ▶ on a video card, which is indistinguishable from the play badge - 
       so a card whose creative had failed to load read as a playable video, and
       clicking it produced "no playable video". It says what it is instead. */
    const media = a.thumb
      ? `<img src="${a.thumb}" alt="Creative for ${esc(a.name)}" loading="lazy">`
      : `<span class="ad-noimg">No preview<small>${a.is_video ? 'video' : 'image'}</small></span>`;
    return `<article class="ad-card cb-card" data-ad="${esc(a.ad_id)}">
      <div class="ad-media${a.thumb ? '' : ' none'}"${canPlay ? ` data-ad="${esc(a.ad_id)}"` : ''}>
        ${media}<span class="ad-rank">${i + 1}</span>
        <span class="ad-type">${a.media_type === 'carousel' ? 'Carousel' : (a.media_type === 'video' || a.is_video) ? 'Video' : 'Static'}</span>
        ${canPlay ? '<button class="ad-play" type="button" title="Play this video ad"><i>▶</i></button>' : ''}
      </div>
      <div class="ad-body">
        <div class="cb-top"><span class="ad-name" title="${esc(a.name)}">${esc(a.name)}</span>${v ? `<span class="vd ${v[0]}" title="${esc(v[2])}">${v[1]}</span>` : ''}</div>
        <div class="cb-nums">
          ${num('Spend', money(a.spend))}
          ${num('CPA', a.cpa != null ? money(a.cpa) : (a.spend > 0 ? 'no sales' : ' - '),
            a.cpa == null ? (a.spend > 0 ? 'bad' : '') : goal ? (a.cpa <= goal ? 'good' : a.cpa > cutLine ? 'bad' : '') : '')}
          ${num('ROAS', a.roas != null ? fmtX(a.roas) : ' - ')}
          ${a.is_video ? num('Hook', pct(a.hook), band(a.hook, 0.20, 0.30).replace(' ok', '').trim(), 'Share of impressions that watched 3 seconds. 30% or more is strong, under 20% is low.')
            : num('Link CTR', pct(a.ctr), '', 'Link clicks divided by impressions')}
        </div>
        <div class="cb-foot">${a.partnership ? `<span class="catpill part" title="A partnership ad: the creative lives on the partner's own page, not ours. Meta will not release the video file for these, so pressing play opens Meta's preview of the post instead.">Partnership</span>` : ''}
          ${a.material_by === 'sales' ? `<span class="tiny" title="Too small to clear the spend bar, but it has made enough sales for the ratio to mean something, so it is ranked anyway">ranked on sales</span>`
            : a.material ? '' : '<span class="tiny" title="Below the spend bar and under 3 sales, so it is left out of the ratio sorts">low spend</span>'}
          <span style="flex:1"></span><span class="ad-open tiny">Details →</span></div>
      </div></article>`;
  };

  /* DROPDOWNS, not chips. Nine sorts and four types as pills was two wrapping
     rows of buttons that looked nothing like the rest of Locus - every other
     control on this page is a labelled select. Same custom chevron, same
     border, same focus ring.
     TYPES ARE THE THREE REAL ONES. The pipe-suffix tags in ad names (UGC,
     Still) were being offered here beside Video and Static and duplicated the
     identical split - UGC is video, Still is static. Only types actually
     present in the window are listed, so a filter never returns nothing.
     2026-09-08: the same reasoning finished the job on the CARD. It still
     printed that pipe-suffix as a pill, so a Lucky card read "UGC" (a style,
     not a format) and other cards read a partner or shoot name, while the
     reports had already moved to the real medium. The pill is gone; the badge
     on the thumbnail now says Video / Static / Carousel from `media_type`,
     which is what the reports say. The full ad name is still on the card and
     still carries whatever the team wrote after the pipe.
     The API keeps returning `format` / `format_kind`; nothing renders them. */
  const TYPE_LABEL = { video: 'Video', image: 'Static', carousel: 'Carousel' };
  const types = [['', 'All types']].concat((d.types || []).map(t => [t === 'image' ? 'static' : t, TYPE_LABEL[t]]));
  /* A native <select> can be styled SHUT but its open list is drawn by the
     operating system and is unreachable from CSS - that is why these still read
     as boxy the moment you opened one. Same custom menu the date control uses,
     so every dropdown in Locus now looks the same open AND closed. */
  const sel = (k, opts, cur) => {
    const now = opts.find(o => String(o[0]) === String(cur) && !o[2]) || opts.find(o => !o[2]);
    return `<span class="cb-sel" data-sel="${k}">
      <button type="button" class="cb-sel-btn">${esc(String(now[1]))}
        <svg viewBox="0 0 10 6" width="10" height="6" aria-hidden="true"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></button>
      <span class="cb-sel-menu" role="menu">${opts.map(([v, l, why]) => why
        ? `<span class="cb-sel-off" title="${esc(why)}">${esc(String(l))}<small>${esc(why)}</small></span>`
        : `<button type="button" role="menuitem" class="${String(v) === String(cur) ? 'on' : ''}" data-v="${esc(String(v))}">${esc(String(l))}</button>`).join('')}</span></span>`;
  };

  const chev = '<svg viewBox="0 0 10 6" width="10" height="6" aria-hidden="true"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>';
  const freshNow = opts.fresh ? String(opts.fresh.get()) : null;
  const whyBtn = '<button class="lnk" data-cbwhy type="button">Why isn’t my ad here?</button>';
  /* THE COUNTS RULE. It used to sit above the grid as a paragraph; it now lives
     in "How these numbers work", and the threshold itself (with "Why isn't my
     ad here?" beside it) is under More options. */
  const countsRule = (() => {
      const basis = d.floor_basis === 'target_cpa'
        ? `${CB.mult}× the ${fmtMoney(d.target_cpa, cur)} goal CPA`
        : d.floor_basis === 'actual_cpa'
        ? `${CB.mult}× this account’s actual ${fmtMoney(d.acct_cpa, cur)} CPA - <b>no goal CPA set</b>, type one above and it becomes the line`
        : d.floor_basis === 'custom' ? 'your own threshold'
        : 'a fallback: nothing sold in this window, so there is no CPA to build on';
      const ranked = `<b>${d.matched}</b> of ${d.ads_with_spend ?? d.matched} ads that spent`;
      // Under a custom threshold the worker closes the sales route, and the
      // sentence has to say so or the number typed looks ignored.
      const salesOr = d.sales_route === false ? '' : ` <b>or</b> made <b>${d.min_purchases ?? 3} sales</b>`;
      const salesOr2 = d.sales_route === false ? '' : ` or <b>${d.min_purchases ?? 3} sales</b>`;
      return RATIO_SORTS.has(CB.sort)
        ? `an ad is ranked once it has spent <b>${d.floor > 0 ? fmtMoney(d.floor, cur) : 'anything'}</b> ${d.floor > 0 ? `(${basis})` : ''}${salesOr}. ${ranked} qualify.`
        : `every ad that spent is ranked on this sort. On a ratio sort (ROAS, CPA, hook…) an ad needs <b>${d.floor > 0 ? fmtMoney(d.floor, cur) : 'any spend'}</b> ${d.floor > 0 ? `(${basis})` : ''}${salesOr2}; ${ranked} would qualify.`;
    })();
  const notesHtml = `<details class="cb-notes"${CB.notes ? ' open' : ''}><summary>How these numbers work</summary><div class="cb-notes-body">
      <p><b>Scale, Watch, Cut</b> compare each ad’s CPA with the brand’s goal CPA${goal ? ` (${fmtMoney(goal, cur)})` : ''}. <b>Scale</b>: at or under goal with 2 or more sales. <b>Cut</b>: more than ${yp}% over goal, or no sales after spending 1.5x the goal. <b>Watch</b>: everything in between. No goal set, no verdict. The ${yp}% is the brand’s yellow zone in Settings, Goals.</p>
      <p><b>Counts:</b> ${countsRule} ${whyBtn}</p>
      ${d.ranked_by_sales ? `<p><b>${d.ranked_by_sales}</b> of the ranked ads ${d.ranked_by_sales === 1 ? 'is' : 'are'} ranked on sales rather than spend: a new ad proving itself before it has spent the threshold.</p>` : ''}
      <p><b>Hook</b> is the share of impressions that watched 3 seconds, and <b>hold</b> (in Details) is how many of those kept watching. Both are judged against Motion’s published benchmarks (hook 30%+ strong, under 20% low; hold 60%+ strong, under 40% low), not this account’s own history. Statics show <b>Link CTR</b> instead of hook.</p>
      <p><b>Link CTR</b> is link clicks divided by impressions. It runs well under 1% on most accounts and is not the "CTR (all)" Ads Manager shows by default, which counts every click and reads about twice as high.</p>
      <p><b>“no sales”</b> means the ad spent and made no purchases in this window. It is a result, not missing data.</p>
      <p><b>Age</b> (in Details) is how long the ad has existed, not the creative: relaunching a creative as a new ad restarts it at zero days.</p>
      <p><b>Where the numbers come from:</b> purchases, revenue, ROAS and CPA are Triple Whale (${esc(attrLabel(d.attr))}), so they will not match Ads Manager. Spend and delivery (hook, hold, CTR, CPM) are Meta.</p>
    </div></details>`;

  host.innerHTML = `
    <div class="cb-bar">
      <label class="cb-l">Sort by ${sel('sort', CB_SORTS, CB.sort)}</label>
      <label class="cb-l">Show ${sel('fmt', types, CB.fmt)}</label>
      <button type="button" class="btn cb-more-btn" id="cbMoreBtn" aria-expanded="${CB.more ? 'true' : 'false'}" aria-controls="cbMore">More options${chev}</button>
      <span class="cb-gap"></span>
      <span class="cb-share" id="cbShareWrap"><span class="tiny" id="cbShareMsg"></span>
        <button type="button" class="btn cb-share-btn" id="cbShareBtn" aria-haspopup="menu" aria-expanded="false">Share${chev}</button>
        <span class="cb-share-menu" role="menu">
          <button type="button" role="menuitem" id="cbYours">Copy “Your ads” page link<small>The client’s own page of every ad we ran for them. Always current, newest first, no numbers. Same link every time.</small></button>
          <button type="button" role="menuitem" id="cbShare">Copy this view as a link<small>Freezes these cards as a read-only page for the client. Lock it under More options.</small></button>
        </span></span>
    </div>
    <div class="cb-more" id="cbMore"${CB.more ? '' : ' hidden'}>
      <div class="cb-opt"><label class="cb-l">Show the top ${sel('limit', [4, 8, 12, 20].map(n => [n, n + ' ads']), CB.limit)}</label>
        <span class="tiny">How many cards to show.</span></div>
      <div class="cb-opt"><label class="cb-l">Revenue from ${sel('attr', CB_ATTR, CB.attr)}</label>
        <span class="tiny">The Triple Whale attribution model. Changes purchases, revenue, ROAS and CPA.</span></div>
      <div class="cb-opt"><label class="cb-l">Counts at ${sel('mult', CB_MULTS, CB.minSpend != null ? 'custom' : String(CB.mult))}
        ${CB.minSpend != null ? `<span class="unit-in cb-in"><span>${sym(cur)}</span><input id="cbMinSpend" type="text" inputmode="decimal" value="${Math.round(CB.minSpend)}"></span>`
          : `<b class="cb-thresh">${CB.mult ? fmtMoney(d.floor, cur) : 'any'}</b>`}</label>
        <span class="tiny">Spend an ad needs before a ROAS, CPA or hook sort ranks it${d.sales_route === false ? '' : `, or ${d.min_purchases ?? 3} sales`}. ${whyBtn}</span></div>
      ${freshNow ? `<div class="cb-opt"><span class="cb-l">An ad is new for its first</span>
        <span class="row" style="gap:6px;margin:0">${['7', '14', '30'].map(v => `<button type="button" class="chip${freshNow === v ? ' on' : ''}" data-cbfresh="${v}">${v} days</button>`).join('')}</span>
        <span class="tiny">Used by “Are we launching enough?” below.</span></div>` : ''}
      <div class="cb-opt"><label class="cb-l cb-lock"><input type="checkbox" id="cbLock"${CB.lock ? ' checked' : ''}> Lock shared view</label>
        <span class="tiny">On: a link made with Share shows exactly this view, and the client cannot re-sort or filter it.</span></div>
    </div>
    ${d.attr_missing ? '' : `<p class="cb-legend">${goal
      ? `Each ad is marked <b>Scale</b>, <b>Watch</b> or <b>Cut</b> against the <a href="#" class="cb-goal" data-goals="${esc(act)}">${fmtMoney(goal, cur)} goal CPA</a>.`
      : `<a href="#" class="cb-goal" data-goals="${esc(act)}">Set a goal CPA</a> to mark each ad Scale, Watch or Cut.`}</p>`}
    ${d.attr_missing ? `<div class="notice bad" style="margin:0 0 12px">⚠️<div>
        <b>No ${esc(attrLabel(d.attr_requested))} data for ${esc(d.account.name)} over this window.</b>
        Nothing is being shown rather than a wall of zeros, and <b>nothing has been silently swapped to Meta</b> - 
        if this is unexpected, the attribution sync is the thing that is wrong.
        <p class="tiny" style="margin:8px 0 0">Attribution refreshes every night for the last 7 days, and older history fills itself in about two weeks at a time each night, back to 120 days. This notice should get rarer on its own - press the button if you need this window now.</p>
        <div class="row" style="gap:8px;margin:10px 0 0">
          <button class="btn primary" id="cbSync">Sync attribution for this window</button>
          <span class="tiny" id="cbSyncMsg"></span></div></div></div>`
      : d.ads.length ? `<div class="ad-grid cb-grid">${d.ads.map(card).join('')}</div>` : '<div class="card"><span class="hint">No ads spent in this window.</span></div>'}
    <p class="cb-count">Showing <b>${d.ads.length}</b> of ${d.matched} ranked ad${d.matched === 1 ? '' : 's'}${d.ads_with_spend ? ` (${d.ads_with_spend} spent in this window)` : ''}:
      <b>${fmtK(d.shown_spend, cur)}</b> of ${fmtK(d.total_spend, cur)} spend.${CB.sort === 'hook' || CB.sort === 'hold' ? ' Video ads only on this sort.' : ''}</p>
    ${opts.notes ? '' : notesHtml}`;
  if (opts.notes) opts.notes.innerHTML = notesHtml;
  const notesEl = (opts.notes || host).querySelector('.cb-notes');
  if (notesEl) notesEl.ontoggle = () => { CB.notes = notesEl.open; };

  const syncBtn = $('#cbSync');
  if (syncBtn) syncBtn.onclick = async () => {
    const msg = $('#cbSyncMsg');
    syncBtn.disabled = true; msg.textContent = 'Pulling from Triple Whale…';
    try {
      // Cover the whole window plus a margin, so a range that starts before the
      // default look-back is actually filled rather than half-filled.
      const days = Math.min(60, Math.max(7, daySpan(range.from, range.to) + 2));
      const r = await api(`/api/tw-attr-sync?act=${encodeURIComponent(act)}&days=${days}`, { method: 'POST' });
      const x = (r.results || [])[0] || {};
      if (x.error) { msg.textContent = x.error; syncBtn.disabled = false; return; }
      msg.textContent = `${x.orders} orders → ${x.rows} rows`;
      renderCreativeBrowser(host, act, range);
    } catch (e) { msg.textContent = e.message; syncBtn.disabled = false; }
  };

  host.querySelectorAll('.cb-sel').forEach(w => {
    const btn = w.querySelector('.cb-sel-btn');
    btn.onclick = e => {
      e.stopPropagation();
      const open = !w.classList.contains('open');
      // Only one menu open at a time, or two overlapping lists is the next bug.
      host.querySelectorAll('.cb-sel.open').forEach(o => o.classList.remove('open'));
      w.classList.toggle('open', open);
    };
    w.querySelectorAll('[data-v]').forEach(b => b.onclick = () => {
      const k = w.dataset.sel;
      if (k === 'sort') CB.sort = b.dataset.v;
      else if (k === 'fmt') CB.fmt = b.dataset.v;
      else if (k === 'attr') { CB.attr = b.dataset.v; localStorage.setItem('pf_cb_attr', CB.attr); }
      else if (k === 'mult') {
        if (b.dataset.v === 'custom') {
          // Seed the box with the threshold currently in force, so "custom"
          // starts from where you are rather than from zero.
          CB.minSpend = Math.round(d.floor || 0);
          localStorage.setItem('pf_cb_min_spend', String(CB.minSpend));
        } else {
          CB.minSpend = null; CB.mult = +b.dataset.v;
          localStorage.removeItem('pf_cb_min_spend');
          localStorage.setItem('pf_cb_mult', String(CB.mult));
        }
      }
      else CB.limit = +b.dataset.v;
      renderCreativeBrowser(host, act, range);
    });
  });
  // A click anywhere else closes them. Bound on document because the menus are
  // inside `host`, which this render replaces wholesale on every change. Bound
  // ONCE per host: re-renders keep the same host, and a listener per render
  // piled up on every sort change.
  if (!host._cbShut) {
    host._cbShut = true;
    document.addEventListener('click', function shut(ev) {
      if (!host.isConnected) { host._cbShut = false; return document.removeEventListener('click', shut); }
      if (!ev.target.closest('.cb-sel')) host.querySelectorAll('.cb-sel.open').forEach(o => o.classList.remove('open'));
      if (!ev.target.closest('.cb-share')) host.querySelectorAll('.cb-share.open').forEach(o => { o.classList.remove('open'); const b = o.querySelector('.cb-share-btn'); if (b) b.setAttribute('aria-expanded', 'false'); });
    });
    document.addEventListener('keydown', function escKey(ev) {
      if (!host.isConnected) return document.removeEventListener('keydown', escKey);
      if (ev.key === 'Escape') host.querySelectorAll('.cb-sel.open,.cb-share.open').forEach(o => o.classList.remove('open'));
    });
  }
  /* More options: shown and hidden in place, no reload. Remembered for the session. */
  const moreBtn = $('#cbMoreBtn'), moreBox = $('#cbMore');
  if (moreBtn && moreBox) moreBtn.onclick = () => {
    CB.more = moreBox.hidden;
    moreBox.hidden = !CB.more;
    moreBtn.setAttribute('aria-expanded', CB.more ? 'true' : 'false');
  };
  /* Share: one button, a small menu with the two copy-link actions. */
  const shareWrap = $('#cbShareWrap'), shareBtn = $('#cbShareBtn');
  if (shareWrap && shareBtn) {
    shareBtn.onclick = e => {
      e.stopPropagation();
      const open = !shareWrap.classList.contains('open');
      shareWrap.classList.toggle('open', open);
      shareBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    };
    shareWrap.querySelectorAll('.cb-share-menu button').forEach(b => b.addEventListener('click', () => {
      shareWrap.classList.remove('open'); shareBtn.setAttribute('aria-expanded', 'false');
    }));
  }
  /* "An ad is new for" lives with the other options; it only re-reads the
     launching section below, so the cards do not reload. */
  host.querySelectorAll('[data-cbfresh]').forEach(c => c.onclick = () => {
    host.querySelectorAll('[data-cbfresh]').forEach(x => x.classList.toggle('on', x === c));
    if (opts.fresh) opts.fresh.set(c.dataset.cbfresh);
  });

  /* Goal CPA - saved on the BRAND, not in this browser, because it is the line
     the whole team judges ads against. Commits on Enter or on leaving the box;
     an unchanged value never writes. */
  host.querySelectorAll('.cb-goal').forEach(l => l.onclick = e => { e.preventDefault(); openGoals(l.dataset.goals); });
  const goalIn = null;   /* Goal CPA is edited only in Settings now (2026-10-04) */
  if (goalIn) {
    const before = goalIn.value.trim();
    const commit = async () => {
      const raw = goalIn.value.trim();
      if (raw === before) return;
      const v = raw === '' ? '' : +raw.replace(/[^0-9.]/g, '');
      if (raw !== '' && !(v > 0)) { goalIn.value = before; return; }
      goalIn.disabled = true;
      try {
        await api('/api/client-settings', { method: 'PUT', body: JSON.stringify({ act, target_cpa: v }) });
        await refreshAccounts().catch(() => {});
        renderCreativeBrowser(host, act, range);
      } catch (e) { goalIn.disabled = false; goalIn.value = before; $('#cbShareMsg').textContent = e.message; }
    };
    goalIn.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); goalIn.blur(); } };
    goalIn.onblur = commit;
  }
  const minIn = $('#cbMinSpend');
  if (minIn) {
    const commit = () => {
      const v = +minIn.value.replace(/[^0-9.]/g, '');
      CB.minSpend = isFinite(v) && v >= 0 ? v : 0;
      localStorage.setItem('pf_cb_min_spend', String(CB.minSpend));
      renderCreativeBrowser(host, act, range);
    };
    minIn.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); minIn.blur(); } };
    minIn.onblur = commit;
  }
  const whyEls = [...host.querySelectorAll('[data-cbwhy]'), ...(opts.notes ? opts.notes.querySelectorAll('[data-cbwhy]') : [])];
  whyEls.forEach(why => why.onclick = () => helpModal('Why isn’t my ad here?', `
    <p>Sorting by a <b>ratio</b> - ROAS, CPA, CTR, CPM, hook, hold - only ranks ads there is enough evidence to judge. Two ways to earn that, and an ad needs one of them:</p>
    <p>· <b>It spent ${d.floor > 0 ? fmtMoney(d.floor, cur) : 'anything'}.</b> ${d.floor_basis === 'target_cpa'
      ? `That is ${CB.mult}× the ${fmtMoney(d.target_cpa, cur)} goal CPA - enough budget to have hit target ${CB.mult} times, whether or not it did. This is how a <i>losing</i> ad earns its place on a CPA sort: it had the money and nothing came back.`
      : d.floor_basis === 'actual_cpa'
      ? `That is ${CB.mult}× this account's actual CPA of ${fmtMoney(d.acct_cpa, cur)}. <b>Set a goal CPA</b> in Settings, Goals and the line moves to what you are aiming for instead of what you happen to be getting - a bar built on actual CPA rises as performance gets worse, which is exactly backwards.`
      : 'You set that number yourself under More options.'}</p>
    ${d.sales_route === false
      ? `<p>· <b>Sales do not count while you have your own threshold set.</b> A typed figure is a hard floor: an ad under it does not rank, however many sales it made. Pick a multiple under <b>Counts at</b> and the sales route comes back.</p>`
      : `<p>· <b>Or it made ${d.min_purchases ?? 3} sales.</b> Sales are the other kind of evidence, and this is how a brand-new winner appears before it has spent much. Dartee's 357-13 took $79 against a $180 bar and returned 19x off 15 sales - a spend test alone would have hidden it for weeks.</p>`}
    <p>An ad with one lucky sale on $12 satisfies neither, which is the whole point: it would otherwise top every ROAS list.</p>
    <p><b>To see everything anyway:</b> set <b>Counts at → Any spend</b>, or sort by <b>Spend</b>, <b>Purchases</b> or <b>Newest</b> - those rank every ad that spent, because they are not ratios and cannot be flattered by a tiny denominator.</p>`));

  /* COPY CLIENT LINK - instant (Cole, 2026-09-16). The snapshot is the numbers:
     up to 40 ads, the current view plus the biggest spenders under the same
     threshold, each with its evidence flag. Cover images used to be pulled
     from Meta and packed in here before anything could be copied, and that
     was the whole wait; the client's page now fetches them itself by share
     token, and they cache after the first view. Still FROZEN: nothing changed
     here afterwards touches a link already sent. No popup - the button copies
     and says so beside itself. */
  const lockIn = $('#cbLock');
  if (lockIn) lockIn.onchange = () => { CB.lock = lockIn.checked; };
  /* The client's Your ads page (yourads/, 2026-10-03): one stable link per brand, always current. */
  $('#cbYours').onclick = async () => {
    const msg = $('#cbShareMsg');
    try {
      const r = await apiAH(`/api/your-ads-link?act=${encodeURIComponent(act)}`);
      try { await navigator.clipboard.writeText(r.url); msg.textContent = 'Your ads link copied'; msg.style.color = 'var(--good)'; }
      catch { msg.innerHTML = `Copy this: <code style="user-select:all;font-size:11px">${esc(r.url)}</code>`; }
    } catch (e) { msg.textContent = e.message; msg.style.color = 'var(--bad)'; }
  };
  $('#cbShare').onclick = async () => {
    const b = $('#cbShare'), msg = $('#cbShareMsg');
    const flash = (t, ok) => { msg.textContent = t; msg.style.color = ok ? 'var(--good)' : 'var(--bad)'; msg.style.fontWeight = '700';
      clearTimeout(flash.t); flash.t = setTimeout(() => { msg.textContent = ''; msg.style.color = ''; msg.style.fontWeight = ''; }, 4000); };
    b.disabled = true; msg.textContent = 'Creating…';
    try {
      const sortLabel = CB_SORTS.find(x => x[0] === CB.sort)?.[1] || 'Spend';
      const base = `act=${encodeURIComponent(act)}&from=${range.from}&to=${range.to}&attr=${encodeURIComponent(CB.attr)}`
        + (CB.minSpend != null ? `&min_spend=${CB.minSpend}` : `&mult=${CB.mult}`);
      const wide = await api(`/api/ads?${base}&sort=spend&limit=40`).catch(() => ({ ads: [] }));
      const seen = new Set(), ads = [];
      for (const a of [...d.ads, ...(wide.ads || [])]) {
        if (seen.has(a.ad_id) || ads.length >= 40) continue;
        seen.add(a.ad_id);
        // `qualifies` is the evidence flag the client page ranks ratio sorts on;
        // the floor behind it stays here. Images travel separately.
        const c = { ...a, qualifies: !!a.material };
        delete c.share; delete c.material; delete c.status; delete c.thumb;
        ads.push(c);
      }
      const locked = !!CB.lock;
      const r = await api('/api/ad-share', { method: 'POST', body: JSON.stringify({
        act, label: `${sortLabel} · ${prettyDate(range.from)}–${prettyDate(range.to, true)}${locked ? ' · locked' : ''}`,
        data: { ads, range, types: d.types, attr: d.attr, min_purchases: d.min_purchases, sales_route: d.sales_route,
          defaults: { sort: CB.sort, fmt: CB.fmt, limit: CB.limit }, locked, lazy_thumbs: true },
      }) });
      let copied = false;
      try { await navigator.clipboard.writeText(r.url); copied = true; } catch { /* clipboard refused; show it instead */ }
      if (copied) flash(`Link copied${locked ? ' · locked view' : ''}`, true);
      else { msg.style.color = ''; msg.innerHTML = `Copy this: <code style="user-select:all;font-size:11px">${esc(r.url)}</code>`; }
    } catch (e) { flash(e.message, false); }
    b.disabled = false;
  };
  // Playback reuses the SAME attachPlay the reports use, so a video behaves
  // identically here and in the document the client eventually opens.
  host.querySelectorAll('.ad-media[data-ad]').forEach(attachPlay);

  /* IMAGES ARRIVE AFTER THE NUMBERS. Fetching creative inline was the whole of
     the slowness: an ad nobody had looked at before costs a creative call plus
     a video-cover call against Meta, so one dropdown click could be sixteen
     sequential round trips before anything appeared. The rows are one D1 query
     and paint immediately; anything already cached comes with them, and the
     rest is patched in here. A failure leaves the placeholder, which is what
     the card already shows. */
  const need = d.ads.filter(a => !a.thumb).map(a => a.ad_id);
  if (need.length) {
    const token = ++CB.run;
    api('/api/ad-creatives?ads=' + encodeURIComponent(need.join(','))).then(r => {
      if (token !== CB.run || !host.isConnected) return;   // a newer view is on screen
      for (const [id, v] of Object.entries(r.assets || {})) {
        const a = d.ads.find(x => x.ad_id === id);
        if (a) Object.assign(a, v);
        const el = host.querySelector(`.cb-card[data-ad="${CSS.escape(id)}"]`);
        if (!el || !v.thumb) continue;
        const media = el.querySelector('.ad-media');
        media.classList.remove('none');
        const ph = media.querySelector('span[aria-hidden]');
        if (ph) ph.remove();
        media.insertAdjacentHTML('afterbegin', `<img src="${v.thumb}" alt="Creative for ${esc(a?.name || '')}">`);
        // A cover only proves it is a video once it has arrived, so the play
        // badge appears with it rather than being guessed at beforehand.
        if (v.video && !media.querySelector('.ad-play')) {
          media.dataset.ad = id;
          media.insertAdjacentHTML('beforeend', '<button class="ad-play" type="button" title="Play this video ad"><i>▶</i></button>');
          attachPlay(media);
        }
      }
    }).catch(() => { /* the placeholder is the honest fallback */ });
  }

  /* Click the card for the full picture - the ad copy, the CTA, where it lives,
     and the metrics there was no room for. ONE rule with ONE exception, exactly
     as the report does it: the whole card opens the detail view, except the
     media on a video, which plays. Two identical-looking clicks must never do
     different things, and this is the same modal the report uses rather than a
     lookalike, so the two cannot drift apart. */
  host.querySelectorAll('.cb-card').forEach(el => el.onclick = e => {
    if (e.target.closest('.ad-media[data-ad]') || e.target.closest('.ad-frame')) return;
    const a = d.ads.find(x => x.ad_id === el.dataset.ad);
    if (a) adDetailModal(a.video == null ? { ...a, video: !!a.is_video } : a, cur);
  });
}

function glossaryModal() {
  const body = GLOSSARY.map(m => `<div class="gl-i">
    <h4>${esc(m.k)}${m.tag ? ` <span class="gl-tag">${esc(m.tag)}</span>` : ''}</h4>
    <p class="gl-one">${m.one}</p>
    <dl>
      <dt>The maths</dt><dd>${m.f}</dd>
      <dt>What good looks like</dt><dd>${m.good}</dd>
      <dt>When it moves</dt><dd>${m.moves}</dd>
    </dl></div>`).join('');
  helpModal('What the numbers mean', `<p class="hint" style="margin-bottom:14px">Every figure in Locus, what it is made of, and what to do when it changes.
    <b>Blended</b> means real store money over real total spend - nothing can be claimed twice.
    <b>Platform</b> means that platform’s own attributed claim.</p><div class="gl">${body}</div>`, { wide: true });
}

const PAGE_HELP = {
  overview: `
    <p><b>What this page is:</b> every client's real economics side by side. Not ad metrics - <i>business</i> metrics. This is the page that tells you which clients are actually profitable.</p>

    <p><b>What this page is:</b> where one client's money actually goes, from revenue down to what's left.</p>
    <p><b>What "Revenue" means, on every tab:</b> Shopify <b>Total Sales minus sales tax</b> - gross sales, less discounts, less returns, plus shipping charged to customers, less tax. That is the line CTC report as "Net Sales + Shipping", and it reconciles to Shopify's own sales report. It is <i>not</i> Shopify's "Net Sales" figure, which leaves shipping out. Triple Whale supplies it as <code>netSales</code>, a field their own catalog titles "Total Sales" - shipping and tax are already inside it, so it is never added a second time.</p>
    <p><b>The waterfall:</b> Net Sales + shipping charged to customers → minus product costs (COGS) → minus fulfilment and handling → minus payment fees → that's your <b>gross profit</b> → minus all ad spend → <b>contribution margin</b>. Every step in the client's own currency.</p>
    <p><b>This is CTC's exact definition:</b> revenue minus <i>all variable costs</i>. <b>Contribution margin is not net profit</b> - it deliberately ignores fixed costs: rent, salaries, software, and our own retainer. Those don't change when you spend another dollar on ads, so they'd only blur the question it exists to answer: did the marketing make money on the margin?</p>

    <p><b>How a week actually runs</b> is history, not a plan. It shows each weekday's share of revenue over the last complete months, and the range that weekday scored against an average day. A weekday is only called consistent when every month agreed - four Mondays a month is a small sample, and most brands will show some pattern by chance. When a client has no reliable rhythm the card says so outright, because presenting noise as insight on a client call is worse than saying nothing. The monthly plan is still split evenly across the days: a day-of-week curve was measured against six clients and predicted <i>worse</i> than an even split.</p>
    <p><b>Delivery has two ways of going missing, and one of them is silent.</b> If a client bills shipping and records no fulfilment cost, that shipping income is already inside revenue and cannot be netted back out - so contribution margin really is overstated by roughly what delivery costs. The quieter failure is worse: where no delivery rate is configured, Triple Whale writes the shipping <i>charge</i> into the cost field, the two cancel exactly, and fulfilment disappears from the margin with nothing on screen to say so. The <b>Costs</b> tab tells the two apart and sizes what it is worth. Neither is adjusted for automatically - a silent correction would be indistinguishable from a measurement.</p>

    <p><b>New vs returning:</b> a healthy acquisition business runs high on new. A high returning share with weak new revenue means the ads have stopped working and the list is carrying the store - MER looks fine while aMER quietly collapses. That's the failure mode this page exists to catch.</p>`,
  health: `
    <p><b>What this page is:</b> the one screen that says whether the numbers everywhere else are real. Every blended figure in Locus - net sales, spend, MER, aMER, contribution margin, every channel read in a report - arrives through Triple Whale. This page checks Triple Whale against the platforms themselves.</p>
    <p><b>Why it exists:</b> on <b>2 September 2026</b> Triple Whale stopped reporting Meta spend for five of six brands. Bonk's brief said $204 of spend against $769 actually spent and printed a 7.7x MER. Nothing flagged it; it was found by eye three days later. Nothing had been sent to a client, but only because the drafts happened to be waiting for review.</p>
    <p><b>The check that does <i>not</i> work</b> - and this is worth knowing, because it is the obvious one: adding Triple Whale's own platform numbers up. Their blended total <i>is</i> the sum of their platform rows, so when a platform drops out it contributes a clean zero to both sides and the arithmetic still balances. Measured across 95 days of history it matched to the cent, broken days included.</p>
    <p><b>The two checks that do work:</b><br>

    <p><b>What a red day does:</b> it cannot reach a client. The send is refused whoever asks for it - the morning cron, the Send button, a retry - and an auto-send brand is downgraded to an internal draft with the reason attached, so you get told rather than getting silence.</p>
    <p><b>How you fix it:</b> the red line names the connection and where to reconnect it, which is nearly always inside Triple Whale - nobody can re-authorise someone else's integration from here. Then <b>Re-sync Triple Whale</b> pulls the corrected data, and <b>Rebuild flagged drafts</b> regenerates each affected day's brief from it. One brand and one day per press, because a brief is the most expensive thing this system does and a loop over six brands would die halfway.</p>

 *  clamps per account timezone, so a client an hour behind can never be shown a
 *  partial day even when the label rounds. */
function resolveRange() {
  const now = new Date(), yday = new Date(now); yday.setDate(now.getDate() - 1);
  const to = ymd(yday);
  const r = S.range || { preset: '30' };
  // Today is the one preset that lets today in; the worker serves it live and stamps it.
  if (r.preset === 'today') { const t = ymd(now); return { from: t, to: t, preset: 'today' }; }
  if (r.preset === 'custom' && r.from && r.to) {
    const t = r.to > to ? to : r.to;                 // never let today in
    return { from: r.from > t ? t : r.from, to: t, preset: 'custom' };
  }
  if (r.preset === 'yesterday') return { from: to, to, preset: 'yesterday' };
  if (r.preset === 'mtd') return { from: ymd(new Date(now.getFullYear(), now.getMonth(), 1)), to, preset: 'mtd' };
  if (r.preset === 'lastmonth') {
    const s = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    return { from: ymd(s), to: ymd(new Date(now.getFullYear(), now.getMonth(), 0)), preset: 'lastmonth' };
  }
  const n = +r.preset || 30;
  const f = new Date(yday); f.setDate(yday.getDate() - (n - 1));
  return { from: ymd(f), to, preset: String(n) };
}

/* meta.js runs in its own closure and reads these off `window`. `function`
   declarations land there on their own; `const` arrows do not, which is why
   `prettyDate` has to be handed over explicitly - without it the Creative

window.prettyDate = prettyDate;
window.daySpan = daySpan;

/** Query string for the data endpoints. A plain "N days ending yesterday" still
 *  goes out as `days` so nothing that predates the bar changes behaviour; only
 *  Last month and a custom range need explicit dates. */
function rangeQ() {
  const r = resolveRange(), n = daySpan(r.from, r.to);
  const now = new Date(), yday = new Date(now); yday.setDate(now.getDate() - 1);
  S.days = n;                                        // keep legacy readers honest
  const cmp = S.cmp && S.cmp !== 'prev' ? `&cmp=${S.cmp}` : '';
  return (r.to === ymd(yday) ? `days=${n}` : `from=${r.from}&to=${r.to}`) + cmp;
}

/* ---------- Daily Brief send time ----------
   Stored as an hour 0-23 in CENTRAL time and evaluated in Central on every hourly
   tick, so the brief lands at the same wall-clock time all year instead of jumping
   an hour at each daylight-saving change. */
const BT = { hour: null };
const hourLabel = h => `${h % 12 === 0 ? 12 : h % 12}:00 ${h < 12 ? 'AM' : 'PM'} Central`;
async function loadBriefTime() {
  if (BT.hour != null) return BT.hour;
  try { BT.hour = (await api('/api/brief-time')).hour; } catch { BT.hour = null; }
  return BT.hour;
}
/** Fill any #bfTimeLbl on the page once the setting is known. */
async function briefTimeLabel() {
