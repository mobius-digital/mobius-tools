     API and nothing else - there is no Google Ads change-history sync - so a
     heading reading "what we changed" over a Meta-only list implies we did
     nothing in Google that week, which for most brands is false. Naming Meta in
     the heading costs nothing and stops the omission reading as a claim.
     (Cole, 2026-09-07.) */
  const changesHtml = opts.internal && (chList.length || rollLine) ? `<div class="card"><h3 style="margin-bottom:2px">What we changed in Meta during the period</h3>
    <p class="hint" style="margin-bottom:10px">From the Change Log, ranked by what actually moves money - budget, bidding and structural changes are listed individually, along with any ad switched on or off that was spending${!Array.isArray(ch) && ch?.ad_floor ? ` more than ${money(ch.ad_floor)}` : ' real money'} this ${prevTag}. Routine creative and tuning work is counted below. Meta's own review-state churn and image-library edits are excluded. <b>Meta only</b> - this list is built from Meta's ad-account activity feed, so Google Ads changes are not in it and their absence here does not mean none were made. <b>Internal only</b> - the client's page never shows this list, though the summary above may reference the moves.${!Array.isArray(ch) && ch?.notable_total > chList.length ? ` Showing the first ${chList.length} of ${ch.notable_total} notable changes.` : ''}</p>
    ${chList.length ? `<div>${chList.map(e => `<div class="rp-change"><span class="d tiny">${esc(e.t)}</span><span class="cat">${esc(catLabel(e.category))}</span><span class="s">${esc(e.summary || '')}${e.spend != null ? ` <span class="tiny">· ${money(e.spend)} spent this ${prevTag}</span>` : ''}${e.reason ? ` <span class="tiny">· ${esc(e.reason)}</span>` : ''}</span></div>`).join('')}</div>`
      : '<p style="font-size:13.5px">No budget, bidding or structural changes in Meta this ' + prevTag + '.</p>'}
    ${rollLine ? `<p class="tiny" style="margin-top:10px">Routine activity in the same period: ${rollLine}.</p>` : ''}</div>` : '';

  /* The control sits ABOVE the scorecard and says plainly what it does and does
     not touch, because the most likely misreading of it is that it changes the
     headline revenue. It cannot: the scorecard is real store money over real
     total spend, with no model in it anywhere.
     Rendered only when the snapshot actually carries the models. A report
     frozen before today has none, and the honest thing is to show no control
     rather than one that cannot move. */
  const attrHtml = A && !opts.client ? `<div class="card rp-attr">
      <div class="rp-attr-row">
        <label for="rpAttr"><b>Attribution</b></label>
        <select id="rpAttr" ${opts.editable === false && !opts.internal ? 'disabled' : ''}>
          ${ATTR_MODELS.filter(m => A.models.includes(m[0]))
            .map(([k, label]) => `<option value="${k}"${k === attrModel ? ' selected' : ''}>${esc(label)}</option>`).join('')}
        </select>
        <span class="tiny rp-attr-why">${esc((ATTR_MODELS.find(m => m[0] === attrModel) || [])[2] || '')}</span>
      </div>
      <p class="hint" style="margin:8px 0 0">Applies to <b>every platform section on this page</b>: revenue, ROAS, purchases and CPA for Meta and Google, and for each creative below. <b>Spend, CPM, CTR, hook and hold never change</b> - Triple Whale measures attribution, not delivery. <b>The scorecard above never changes either</b>: it is real store revenue over real total ad spend with no attribution in it at all, which is why it is the headline.</p>
    </div>` : '';

  /* LAYOUT. The page used to be two columns top to bottom, with the creative
     cards stacked one per row in the narrow right column and the left column
     empty under the chart (Cole, 2026-09-14: "super long with blank space").
     Now: the story on the left (summary, day by day) with the month's
     position on the right, then every platform at FULL WIDTH so the creative
     grid gets four across, then the smaller channels side by side. */
  const chans = (d.channels || []);
  /* THE "JUMP TO" ROW. The report is long by design (it is the document walked
     through on a call), so the fix is navigation, not cutting content. Every
     section that EXISTS in this report gets an id and a chip; a chip for a
     section this report does not have would be a control that does nothing.
     `sec()` stamps the id onto the card's own opening tag rather than wrapping
     it, so no layout (the two columns, the channel grid) gains a new box.
     Drawn here because this function renders BOTH the internal page and the
     client's archive link; `wireReportJump()` is called by both renderers. */
  const jump = [];
  const sec = (id, label, html) => {
    if (!html) return '';
    jump.push([id, label]);
    return html.replace('<div class="card', `<div id="rpsec-${id}" class="card rp-sec`);
  };
  const CH_SHORT = { meta: 'Meta', google: 'Google', email: 'Email', tiktok: 'TikTok', amazon: 'Amazon', pinterest: 'Pinterest' };
  const sumSec = sec('summary', 'Summary', sumHtml);
  const chartSec = sec('days', 'Day by day', chartHtml);
  // "Month" lands on where the month stands; on a report with no pacing card it
  // lands on the week-by-week table, which is the same question.
  const paceSec = sec('month', 'Month', pacingHtml);
  const splitSec = sec('customers', 'Customers', splitHtml);
  const weeksSec = pacingHtml ? weeksHtml : sec('month', 'Month', weeksHtml);
  const metaHtml = chans.filter(c => c.id === 'meta').map(c => sec('meta', 'Meta', chCard(c))).join('');
  const otherHtml = chans.filter(c => c.id !== 'meta').map(c => sec(c.id, CH_SHORT[c.id] || c.label || c.id, chCard(c))).filter(Boolean);
  const changesSec = sec('changes', 'Changes', changesHtml);
  const jumpHtml = jump.length > 1 ? `<nav class="rp-jump" aria-label="Jump to a section of this report"><span class="rp-jump-l">Jump to</span>${
    jump.map(([id, label]) => `<button class="chip" type="button" data-jump="rpsec-${esc(id)}">${esc(label)}</button>`).join('')}</nav>` : '';
  return `${jumpHtml}<div class="v2tiles rp-kpis">${kpis}</div>
    <div class="two rp-two">
      <div>${sumSec}${chartSec}</div>
      <div>${paceSec}${splitSec}${weeksSec}</div>
    </div>
    ${attrHtml}${metaHtml}
    ${otherHtml.length ? `<div class="rp-grid">${otherHtml.join('')}</div>` : ''}
    ${changesSec}
    <p class="tiny"><b>Revenue, MER, aMER${t.cm != null ? ', Contribution Margin' : ''} and New-customer CPA are blended</b> - real store revenue and real total ad spend, with no platform's attribution involved - which is why they will not match what Meta or Google report on their own dashboards. The platform sections show each platform's own attributed numbers, and those are directional.</p>`;
}

/** Resolve a Slack channel id to "#name", cached for the session. Used by the
 *  send dialog: a confirmation that names the real channel is the last chance to
 *  catch a report pointed at the wrong audience. Degrades to the raw id. */
let CHAN_CACHE = null;
async function channelName(id) {
  if (!id) return 'the configured channel';
  if (!CHAN_CACHE) {
    try { CHAN_CACHE = Object.fromEntries((await api('/api/slack-channels')).channels.map(c => [c.id, c.name])); }
    catch { CHAN_CACHE = {}; }
  }
  return CHAN_CACHE[id] ? `#${CHAN_CACHE[id]}` : id;
}

/** Can we actually post to this channel today?
 *  A channel id that is SET but no longer in the workspace list is an archived
 *  or deleted channel, and that is worse than an empty field, because every
 *  "is a client channel configured" check reads as yes. Lucky Golf's
 *  brief_channel still pointed at #locus-test three days after Cole archived
 *  it, so the Reports tab kept offering a Send button whose only possible
 *  outcome was a failed post.
 *  `/api/slack-channels` lists live channels only, so absence IS the signal.
 *  Fails OPEN: if the list could not be fetched at all, assume usable, because
 *  a transient API error must never hide a button that works. */
async function channelUsable(id) {
  if (!id) return false;
  await channelName(id);
  if (!CHAN_CACHE || !Object.keys(CHAN_CACHE).length) return true;
  return !!CHAN_CACHE[id];
}

/** Wire the sticky "Jump to" chips. Called by BOTH report renderers after paint.
 *  Listeners go on the chips (replaced with every render), never on #main. The
 *  target cards carry `scroll-margin-top` (.rp-sec) so a heading is never left
 *  hidden under the sticky row. This is the one place a click scrolls the page,
 *  because scrolling is the thing the reader asked for. */
function wireReportJump() {
  const calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('#main .rp-jump [data-jump]').forEach(b => b.onclick = () => {
    const el = document.getElementById(b.dataset.jump);
    if (el) el.scrollIntoView({ behavior: calm ? 'auto' : 'smooth', block: 'start' });
  });
}

/** Attach the day-by-day crosshair. Called by BOTH report renderers after paint,
 *  so the client's page is as inspectable as ours. Shows the two lines and the
 *  gap between them, which is the thing the chart is actually about. */
function wireReportChart(d, cur, internal) {
  const id = internal ? 'rpSvg' : 'rsSvg';
  if ((d.chart || []).length > 1) LX.wireDual(id, d.chart, r => {
    const gap = r.sales != null && r.spend != null ? r.sales - r.spend : null;
    const mer = r.spend ? r.sales / r.spend : null;
    return `<b>${window.V2UI.day(r.date)}</b> · revenue ${fmtMoney(r.sales, cur)} · ad spend ${fmtMoney(r.spend, cur)}`
      + (gap != null ? `<br>left after ads ${fmtMoney(gap, cur)}` : '')
      + (mer != null ? ` · MER ${fmtX(mer)}` : '');
  });
}

/** Ask the engine for a fresh, playable mp4 for one ad.
 *  On the client's archive link there is no session, so the report token is the
 *  credential - the engine only resolves ads that are in that client's own sent
 *  reports. RS.token is set by the share renderer; internal callers have a
 *  session and send nothing. */
// Resolved mp4 URLs, keyed by ad id. Populated as soon as a report paints, so
// pressing play is instant instead of waiting on a round trip to Meta. The
// value is the PROMISE, not the URL, so a click that lands mid-flight joins the
// request already running rather than starting a second one.
const VID_CACHE = new Map();

function adVideoUrl(adId) {
  if (VID_CACHE.has(adId)) return VID_CACHE.get(adId);
  const q = `ad=${encodeURIComponent(adId)}`
    + (RS.token ? `&report=${encodeURIComponent(RS.token)}` : '')
    + (AD_SHARE_TOKEN ? `&ads=${encodeURIComponent(AD_SHARE_TOKEN)}` : '');
  /* Returns the WHOLE answer, not just the mp4.
     A partnership ad has no fetchable file - the video lives on the creator's
     page - but Meta's own preview iframe renders it with no login and no page
     token, so the response carries `preview` and the card shows the real ad
     instead of an apology. Callers read `.src` first and fall back to
     `.preview`. */
  const p = (async () => {
    if (RS.token || AD_SHARE_TOKEN) {
      const res = await fetch(`${S.url.replace(/\/+$/, '')}/api/ad-video?${q}`);
      const b = await res.json();
      if (!res.ok) throw new Error(b.error || 'could not load this video');
      return b;
    }
    return await api(`/api/ad-video?${q}`);
  })();
  // A failure must not be cached - the next click should retry rather than
  // replay the error for as long as the page is open.
  p.catch(() => VID_CACHE.delete(adId));
  VID_CACHE.set(adId, p);
  return p;
}

/** Warm the cache for every playable ad on the page. Fired after paint; the
 *  requests are cheap (one Meta lookup each) and there are rarely more than a
 *  handful of videos in a report. Failures stay silent - the click path
 *  reports them properly. */
function prefetchAdVideos() {
  document.querySelectorAll('#main .ad-media[data-ad]').forEach(m => {
    adVideoUrl(m.dataset.ad).catch(() => {});
  });
}

/** Play the REAL creative inside its card - the actual mp4 in a native video
 *  element, not Meta's preview iframe. The iframe loaded 750KB of Facebook
 *  chrome to show a video we can now address directly, which is why this is
 *  instant and seekable instead of a page load.
 *
 *  The mp4 URL is signed and short-lived, so it is fetched at play time and
 *  never frozen into the report; the cover frame IS baked in, so an old report
 *  always shows the creative even when playback has expired.
 *
 *  Called by BOTH report renderers after paint. Listeners go on the media nodes
 *  the render replaces, never on #main, which survives every render. */
const CTA_LABEL = {
  SHOP_NOW: 'Shop Now', LEARN_MORE: 'Learn More', SIGN_UP: 'Sign Up', BUY_NOW: 'Buy Now',
  GET_OFFER: 'Get Offer', ORDER_NOW: 'Order Now', SUBSCRIBE: 'Subscribe', CONTACT_US: 'Contact Us',
  DOWNLOAD: 'Download', BOOK_TRAVEL: 'Book Now', GET_QUOTE: 'Get Quote', APPLY_NOW: 'Apply Now',
};

/** The detail view behind "Copy & full stats". Everything the card had no room
 *  for: the words the ad actually ran, where it lives, and the metrics that
 *  matter once you have already decided to look closely. All of it is frozen
 *  into the report, so an archived one opens exactly the same way. */
function adDetailModal(a, cur, prevTag) {
  /* The report passes 'week' or 'month'. The live creative browser has no fixed
     period, so it passes nothing - and the table header rendered "This
     undefined". Default to a neutral word; the "prior X" notes below only
     render when a prior figure exists, which the live browser never sends. */
  prevTag = prevTag || 'period';
  const money = n => fmtMoney(n, cur);
  const fact = (label, val) => val ? `<span>${label} <b>${esc(String(val))}</b></span>` : '';
  const line = (label, val, note) => val == null ? '' :
    `<tr><td>${label}</td><td class="num"><b>${val}</b></td><td class="tiny">${note || ''}</td></tr>`;
  const pctOr = (v, d = 0) => v == null ? null : fmtPct(v, d);
  // The Creative browser sends `age` (days the ad has existed) rather than `created`.
  const days = a.created ? Math.round((Date.now() - new Date(a.created + 'T12:00:00Z')) / 86400e3) : a.age != null ? a.age : null;
  const canPlay = a.video && a.ad_id;
  const body = `<div class="adm">
    <div>
      <div class="adm-media"${canPlay ? ` data-ad="${esc(a.ad_id)}"` : ''}${canPlay && a.preview ? ` data-preview="${esc(a.preview)}"` : ''}>
        ${a.thumb ? `<img src="${a.thumb}" alt="Creative for ${esc(a.name)}">`
        : '<div style="padding:40px;text-align:center;color:var(--muted);font-size:13px">No image available</div>'}
        ${canPlay ? '<button class="ad-play" type="button" title="Play this video ad"><i>&#9654;</i></button>' : ''}</div>
      ${a.preview ? `<p style="margin-top:10px"><a href="${esc(a.preview)}" target="_blank" rel="noopener noreferrer" style="font-size:12.5px">Open the full ad preview ↗</a></p>` : ''}
    </div>
    <div>
      <div class="adm-facts">
        ${fact('', a.video ? 'Video' : 'Image')}
        ${a.partnership ? '<span>Partnership ad</span>' : ''}
        ${fact('Status', a.status ? a.status.toLowerCase().replace(/_/g, ' ') : null)}
        ${fact('Live since', a.created)}
        ${days != null ? `<span>Running <b>${days} days</b></span>` : ''}
        ${fact('CTA', a.cta ? (CTA_LABEL[a.cta] || a.cta.toLowerCase().replace(/_/g, ' ')) : null)}
      </div>
      ${a.headline ? `<div class="adm-copy"><div class="hd">Headline</div><div class="bd">${esc(a.headline)}</div></div>` : ''}
      ${a.body ? `<div class="adm-copy"><div class="hd">Primary text</div><div class="bd">${esc(a.body)}</div></div>` : ''}
      ${a.description ? `<div class="adm-copy"><div class="hd">Description</div><div class="bd">${esc(a.description)}</div></div>` : ''}
      ${!a.headline && !a.body ? '<p class="hint" style="margin-bottom:14px">The ad\'s text was not available from Meta for this creative.</p>' : ''}
      <div class="tbl-wrap"><table><thead><tr><th>This ${prevTag}</th><th class="num"></th><th></th></tr></thead><tbody>
        ${line('Spend', money(a.spend), a.prev_spend != null ? `prior ${prevTag} ${money(a.prev_spend)}` : '')}
        ${line('Share of Meta spend', pctOr(a.share))}
        ${line('Purchases', fmtInt(a.purchases))}
        ${line('Revenue', a.revenue != null ? money(a.revenue) : null)}
        ${line('CPA', a.cpa != null ? money(a.cpa) : null, a.prev_cpa != null ? `prior ${prevTag} ${money(a.prev_cpa)}` : '')}
        ${line('ROAS', a.roas != null ? fmtX(a.roas) : null, a.prev_roas != null ? `prior ${prevTag} ${fmtX(a.prev_roas)}` : '')}
        ${line('AOV', a.aov != null ? money(a.aov) : null, 'revenue per purchase')}
        ${line('Impressions', a.impressions != null ? fmtInt(a.impressions) : null)}
        ${line('Reach', a.reach != null ? fmtInt(a.reach) : null, a.frequency != null ? `seen ${a.frequency.toFixed(1)}x each on average` : '')}
        ${line('CPM', a.cpm != null ? money(a.cpm) : null, 'cost per thousand impressions')}
        ${line('Link clicks', a.clicks != null ? fmtInt(a.clicks) : null)}
        ${line('CTR', pctOr(a.ctr, 2), 'link clicks divided by impressions')}
        ${line('CPC', a.cpc != null ? money(a.cpc) : null, 'cost per link click')}
        ${line('Click to purchase', pctOr(a.cvr, 1), 'of the people it sent to the site, how many bought')}
      </tbody></table></div>
      ${a.hook != null ? `<h4 style="font-size:12.5px;font-weight:700;margin:16px 0 6px">How the video held attention</h4>
      <div class="tbl-wrap"><table><tbody>
        ${line('Hook rate', pctOr(a.hook), '3-second views over impressions - 30%+ is strong')}
        ${line('Hold rate', pctOr(a.hold), 'ThruPlay over 3-second views - 60%+ is strong')}
        ${line('Average watch time', a.avg_watch != null ? `${a.avg_watch.toFixed(1)}s` : null, a.duration ? `of ${Math.round(a.duration)}s` : '')}
        ${line('Cost per thumbstop', a.cost_per_thumbstop != null ? money(a.cost_per_thumbstop) : null, 'spend per 3-second view')}
      </tbody></table></div>
      ${a.retention ? `<div style="margin-top:10px">
        <div class="tiny" style="margin-bottom:5px">Of everyone who started the video, how far they got:</div>
        ${[['25%', a.retention.p25], ['50%', a.retention.p50], ['75%', a.retention.p75], ['Finished', a.retention.p100]]
          .map(([lb, v]) => `<div class="retn-row"><span class="lb">${lb}</span>
            <span class="track"><i style="width:${Math.max(0, Math.min(100, (v || 0) * 100)).toFixed(1)}%"></i></span>
            <span class="pc">${fmtPct(v)}</span></div>`).join('')}
        ${a.retention.basis === 'three_second_views' ? '<div class="tiny" style="margin-top:6px">Measured against 3-second views on this older report, so the early figures read high.</div>' : ''}
      </div>` : ''}` : ''}
      ${a.campaign || a.adset ? `<p class="tiny" style="margin-top:10px">${a.campaign ? `Campaign <b>${esc(a.campaign)}</b>` : ''}${a.adset ? ` · Ad set <b>${esc(a.adset)}</b>` : ''}</p>` : ''}
    </div></div>`;
  // Its own shell rather than helpModal: that one is 460px wide with a 60vh
  // body, which cut the stat values off mid-number and hid half the table.
  const w = document.createElement('div');
  w.className = 'modal-wrap ad-modal-wrap';
  w.innerHTML = `<div class="modal wide"><h3>${esc(a.name)}</h3>
    <div class="ad-modal-body">${body}</div>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn primary" data-m="ok">Close</button></div></div>`;
  document.body.appendChild(w);
  const done = () => {
    const v = w.querySelector('video');
    if (v) { v.pause(); v.removeAttribute('src'); v.load(); }   // never leave a video downloading
    w.remove();
    document.removeEventListener('keydown', k);
  };
  const k = ev => { if (ev.key === 'Escape') done(); };
  document.addEventListener('keydown', k);
  w.addEventListener('mousedown', ev => { if (ev.target === w) done(); });
  w.querySelector('[data-m="ok"]').onclick = done;
  const media = w.querySelector('.adm-media[data-ad]');
  if (media) attachPlay(media);
}

/** Make one `.ad-media[data-ad]` block playable. Shared by the card grid and
 *  the detail view, so a video behaves the same in both. */
/* ONE PLAYER AT A TIME. Two videos talking over each other is nobody's
   intention, and on a grid of eight cards it was one click away. Closing also
   tears the source out of the element, so the browser stops downloading a video
   nobody is watching. */
function stopAllAdFrames(except) {
  document.querySelectorAll('.ad-frame').forEach(f => {
    if (f === except) return;
    const v = f.querySelector('video');
    if (v) { try { v.pause(); v.removeAttribute('src'); v.load(); } catch { /* already gone */ } }
    f.remove();
  });
}

/* Meta's preview is a WHOLE FEED UNIT - profile row, primary text, the video,
   the call-to-action - drawn at a fixed size inside a cross-origin iframe we
   cannot restyle, crop or de-scrollbar. Squeezed into a 4:5 card it was tiny
   and still scrolled, which is what Cole saw. So a partnership ad opens in a
   modal big enough to hold the unit at its natural size instead: nothing is
   scaled, nothing is cropped, and the scrollbar has nothing left to scroll.
   This is the honest shape of the caveat - our own ads give us the raw file and
   fill the card; a partner's ad we can only ever show as Meta draws it. */
const PREVIEW_W = 380, PREVIEW_H = 760;
function adPreviewModal(url, note) {
  stopAllAdFrames();
  const w = document.createElement('div');
  w.className = 'modal-wrap';
  w.innerHTML = `<div class="modal prev-modal">
    <div class="row" style="justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px">
      <div><h3 style="margin:0 0 3px">Partnership ad</h3>
        <p class="tiny" style="margin:0;max-width:46ch">${esc(note || 'Meta’s own preview of this ad.')}</p></div>
      <button class="btn" data-m="ok">Close</button>
    </div>
    <div class="prev-box"><iframe src="${esc(url)}" title="Meta's preview of this ad" scrolling="no"
      allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe></div>
    <p class="tiny" style="margin:10px 0 0"><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">Open it on Facebook ↗</a>
      &nbsp;·&nbsp; Press play inside the preview - the file itself is on the creator’s page, so we cannot stream it directly.</p>
  </div>`;
  document.body.appendChild(w);
  const done = () => { w.remove(); document.removeEventListener('keydown', k); };
  const k = e => { if (e.key === 'Escape') done(); };
  document.addEventListener('keydown', k);
  w.onclick = e => { if (e.target === w || e.target.closest('[data-m="ok"]')) done(); };
}

/* "This is a partnership ad - the video file lives on the creator's page, not
   ours, so Meta will not hand it over." is the right sentence to be able to
   read, and the wrong one to paint across a creative. */
function partnershipNote(reason) {
  if (!reason) return 'Meta’s preview';
  return /partnership/i.test(reason) ? 'Partnership ad - Meta’s preview' : 'Meta’s preview';
}

/* Meta's preview iframe has a fixed intrinsic size, so it must be SCALED into
   whatever box it lands in rather than stretched or cropped. Re-run on resize
   because a card's width follows the grid. */
const EMBED_W = 340, EMBED_H = 620;
function fitEmbed(m) {
  const f = m.querySelector('iframe.ad-embed');
  if (!f) return;
  const apply = () => {
    const w = m.clientWidth, h = m.clientHeight;
    if (!w || !h) return;                       // not laid out yet (or a test DOM)
    const s = Math.min(w / EMBED_W, h / EMBED_H);
    f.style.width = EMBED_W + 'px';
    f.style.height = EMBED_H + 'px';
    f.style.transformOrigin = 'top left';
    f.style.transform = `translate(${((w - EMBED_W * s) / 2).toFixed(1)}px, ${((h - EMBED_H * s) / 2).toFixed(1)}px) scale(${s.toFixed(4)})`;
  };
  apply();
  if (typeof ResizeObserver === 'function') {
    const ro = new ResizeObserver(() => { if (m.querySelector('iframe.ad-embed')) apply(); else ro.disconnect(); });
    ro.observe(m);
  }
}

function attachPlay(m) {
  const btn = m.querySelector('.ad-play');
  if (!btn) return;
  m.onclick = e => { if (!e.target.closest('.ad-frame') && !m.querySelector('.ad-frame')) btn.click(); };
  btn.onclick = async e => {
    e.stopPropagation();
    if (m.querySelector('.ad-frame')) return;
    const adId = m.dataset.ad;
    // The URL is usually already prefetched, so only show a spinner if it is
    // genuinely not ready - a flash of "Loading" on an instant play is worse
    // than no feedback at all.
    let settled = false, src = null, err = null, preview = null, note = null;
    const pending = adVideoUrl(adId).then(u => {
      // Older shapes returned a bare URL string; tolerate both.
      if (typeof u === 'string') src = u;
      else if (u) { src = u.src || null; preview = u.preview || null; note = u.reason || null; }
      settled = true;
    }, ex => { err = ex.message; settled = true; });
    await Promise.race([pending, new Promise(r => setTimeout(r, 120))]);
    if (!settled) m.insertAdjacentHTML('beforeend', '<div class="ad-spin">Loading…</div>');
    await pending;
    const spin = m.querySelector('.ad-spin');
    if (spin) spin.remove();
    if (m.querySelector('.ad-frame')) return;                 // double click while loading
    stopAllAdFrames();                       // never two players at once
    const link = preview || m.dataset.preview || null;
    /* A preview cannot usefully live inside a card - see adPreviewModal. */
    if (!src && link) return adPreviewModal(link, note);
    const openOut = link
      ? `<a href="${esc(link)}" target="_blank" rel="noopener noreferrer">Open it on Facebook ↗</a>`
      : '';
    /* THREE OUTCOMES, in order of how good they are:
         mp4 - our own page, seekable, instant;
         preview - Meta's iframe, which needs no page token and is the ONLY way
                    a partnership ad is ever viewable here;
         message - nothing to show, so say precisely what happened.
       Before this, a partnership ad fell straight to the message with nothing to
       click, and the message blamed access we were never going to be given. */
    /* ONE LINE, not a paragraph. The full sentence covered a third of the
       creative on a card this size - the explanation belongs on hover and in
       the detail view, not stamped across the ad. */
    const shortNote = partnershipNote(note);
    m.insertAdjacentHTML('beforeend', `<div class="ad-frame">
      ${src ? `<video src="${esc(src)}" controls autoplay playsinline preload="metadata"></video>`
            : link ? `<iframe class="ad-embed" src="${esc(link)}" loading="lazy" allow="autoplay; encrypted-media; fullscreen" allowfullscreen title="${esc(note || 'Meta’s preview of this ad')}"></iframe>
                     <div class="ad-embed-note" title="${esc(note || '')}"><span>${esc(shortNote)}</span> ${openOut}</div>`
            : `<div class="msg"><div>${esc(err || note || 'This video can’t be played here.')}<br>${openOut}</div></div>`}
      <button class="ad-close" type="button" title="Back to the image">✕</button></div>`);
    /* Meta renders its preview at a FIXED size (a mobile feed unit, ~340x620).
       Dropped into a 4:5 card it was cropped to a letterbox of itself, which is
       the "formatting is weird" Cole saw. Scale the whole unit to fit and
       centre it: the ad is small but WHOLE, and nothing is cut off. */
    fitEmbed(m);
    // The click IS the user gesture, but the await for the URL breaks the
    // chain, so `autoplay` alone can be refused and leave a paused frame
    // under a play button that looks broken. Ask explicitly and let the
    // controls take over if the browser still says no.
    const vid = m.querySelector('.ad-frame video');
    if (vid) vid.play().catch(() => {});
    m.querySelector('.ad-close').onclick = ev => {
      ev.stopPropagation();                      // closing must not open the detail view
      const f = m.querySelector('.ad-frame');
      const v = f.querySelector('video');
      if (v) { v.pause(); v.removeAttribute('src'); v.load(); }   // stop the download too
      f.remove();
    };
  };
}

function wireAdCards(ads, cur, prevTag) {
  const rows = ads?.top || [];
  // ONE rule: the whole card opens the detail view. The single exception is the
  // media on a video, which plays it in place - clicking a video should play the
  // video. A static's media opens the detail view like the rest of the card,
  // where the creative is shown large anyway, so there is no dead zone and no
  // area where an identical-looking click does two different things.
  document.querySelectorAll('#main .ad-card').forEach(card => {
    const a = rows[+card.dataset.ad];
    if (!a) return;
    card.onclick = e => {
      if (e.target.closest('a')) return;                       // the name links out
      if (e.target.closest('.ad-media[data-ad]')) return;      // video media plays instead
      if (e.target.closest('.ad-frame')) return;               // clicks inside a playing ad
      adDetailModal(a, cur, prevTag);
    };
  });
  document.querySelectorAll('#main .ad-media[data-ad]').forEach(attachPlay);
  prefetchAdVideos();
}

/** All-clients view: the latest weekly and monthly report per brand at a glance. */
/* ---------- Reports, all clients: what is waiting on you ----------
 *
 * This was a three-column table of every brand's latest weekly and monthly,
 * which made you read six rows to find the one thing that needed doing. The
 * only question this screen answers is "what is waiting for me to send", so
 * it groups on exactly that.
 *
 * The grouping is deliberately about ACTION, not health: a draft nobody has
 * reviewed is the whole point of the tab, and a brand with no internal channel
 * is a setup fault that silently stops drafts reaching anyone - which is worse
 * than a late report, because nothing tells you it happened.
 */
async function renderReportsAll(first) {
  const shell = body => `<div class="v2 lx">${LX.head('reports', 'Reports')}
    ${body}</div>`;
  const run = ++RUN;
  if (first) $('#main').innerHTML = shell('<div class="card"><span class="hint">Loading…</span></div>');
  let r;
  try { r = await api('/api/reports?act=all'); }
  catch (e) { if (run === RUN) $('#main').innerHTML = shell(`<div class="card"><span style="color:var(--bad)">${esc(e.message)}</span></div>`); return; }
  if (run !== RUN) return;

  const by = {};
  // `|| []` is not defensive noise: without it a malformed response throws
  // INSIDE the renderer, which leaves the previous tab's content on screen with
  // no error anywhere - the page simply appears not to have opened.
  for (const row of (r.rows || [])) { by[row.act_id] ??= {}; by[row.act_id][row.period] ??= row; }   // newest-first

  const judged = S.accounts.map(a => {
    const wk = by[a.act_id]?.weekly, mo = by[a.act_id]?.monthly;
    /* INTERNAL ONLY: no client channel, so this brand's reports are handled
       the moment they are drafted and can never be "waiting". An older
       'draft' row for such a brand counts as handled too. Cole, 2026-09-10. */
    const auto = !a.brief_channel;
    const drafts = auto ? [] : [wk, mo].filter(x => x && x.status === 'draft');
    const skipped = [wk, mo].filter(x => x && x.status === 'skipped');
    const noChannel = !a.slack_channel;
    // Setup faults outrank waiting drafts: a brand whose drafts post nowhere
    // will never appear in the "waiting" list at all, which is the failure you
    // cannot see from this page.
    // A skipped report is not "all sent" - it was generated and deliberately
    // not sent, which is a state worth seeing rather than one to round off.
    const g = noChannel ? 'bd' : drafts.length ? 'wn' : auto ? 'au' : skipped.length ? 'un' : (wk || mo) ? 'ok' : 'un';
    return { a, wk, mo, drafts, skipped, noChannel, auto, g };
  }).sort((x, y) => ({ bd: 0, wn: 1, ok: 2, au: 3, un: 4 })[x.g] - ({ bd: 0, wn: 1, ok: 2, au: 3, un: 4 })[y.g]
    || x.a.name.localeCompare(y.a.name));

  const waiting = judged.reduce((n, j) => n + j.drafts.length, 0);
  const sent = (r.rows || []).filter(x => x.status === 'sent').length;
  const skippedTotal = (r.rows || []).filter(x => x.status === 'skipped').length;
  const gaps = judged.filter(j => j.noChannel).length;

  /* Name the status the row ACTUALLY has.
     The old table printed "draft" for anything that was not 'sent', which is a
     fallback dressed as a check - and it hid a real state: every report in the
     database right now is `skipped`, generated in full and then marked as not
     to be sent. Reading "draft" told you there was something to review when
     there was not. A status this page does not recognise says so rather than
     picking the nearest familiar word. */
  const PILL = { sent: ['good', 'sent'], draft: ['warn', 'draft'], skipped: ['unk', 'skipped'], handled: ['good', 'handled'] };
  const state = (row, auto) => {
    if (!row) return '<span class="tiny">none yet</span>';
    const st = auto && row.status === 'draft' ? 'handled' : row.status;
    const [cls, label] = PILL[st] || ['unk', st || 'unknown'];
    return `${repRangeLabel({ period: row.period, start: row.period_start, end: row.period_end })} <span class="pill ${cls}">${esc(label)}</span>`;
  };

  const card = j => {
    const act = j.noChannel
      ? 'No internal channel, so drafts for this brand post <b>nowhere</b>. Set one in <b>Settings</b> before the next Monday run.'
      : j.drafts.length
      ? `${j.drafts.length === 2 ? 'Both reports are' : 'A report is'} drafted and waiting on you. Open it, read it, then send.`
      : j.auto
      ? `No client channel, so every report is <b>handled the moment it is written</b> - it posts to your internal channel and nothing goes out. Open it to read or rewrite it.`
      : j.skipped.length
      ? `${j.skipped.length === 2 ? 'Both reports were' : 'A report was'} generated in full and then marked <b>skipped</b>, so ${j.skipped.length === 2 ? 'neither' : 'it'} will be sent. Open it to read what was written.`
      : (j.wk || j.mo) ? 'Everything drafted so far has been sent. Nothing waiting.'
      : 'No report has been generated yet. The next Monday run will draft one.';
    return `<div class="sc ${j.g === 'un' ? '' : j.g}" data-id="${j.a.act_id}" tabindex="0" role="button"
        aria-label="${esc(j.a.name)} reports">
      <div class="sc-h"><span class="sc-n">${esc(j.a.name)}</span>
        <span class="sc-s">${j.noChannel ? 'no channel' : j.drafts.length ? `${j.drafts.length} waiting`
          : j.auto ? 'auto handled' : j.skipped.length ? `${j.skipped.length} skipped` : (j.wk || j.mo) ? 'all sent' : 'none yet'}</span></div>
      <div class="sc-foot">
        <div class="sc-g" style="grid-template-columns:1fr 1fr;border-top:none;padding-top:0">
          <div><div class="sc-gl">Latest weekly</div><div class="tiny" style="line-height:1.5">${state(j.wk, j.auto)}</div></div>
          <div><div class="sc-gl">Latest monthly</div><div class="tiny" style="line-height:1.5">${state(j.mo, j.auto)}</div></div>
        </div>
        <p class="sc-act">${act}</p>
      </div>
    </div>`;
  };

  const LABEL = { bd: 'Cannot be delivered', wn: 'Waiting on you', ok: 'All sent', au: 'Handled automatically (no client channel)', un: 'Generated but not going out' };
  const groups = ['bd', 'wn', 'ok', 'au', 'un'].map(g => {
    const list = judged.filter(j => j.g === g);
    if (!list.length) return '';
    return `<p class="grp"><span class="ct">${LABEL[g]}</span>
        <span>&middot; ${list.length} brand${list.length === 1 ? '' : 's'}</span><span class="ln"></span></p>
      <div class="sc-grid">${list.map(card).join('')}</div>`;
  }).join('');

  const waitBrands = judged.filter(j => j.drafts.length).map(j => esc(j.a.name));
  $('#main').innerHTML = shell(`
    ${LX.say(gaps ? `<b class="bad">${gaps} brand${gaps === 1 ? ' has' : 's have'} no internal channel</b>, so ${gaps === 1 ? 'its' : 'their'} drafts post nowhere. Set one in Settings before Monday.${waiting ? ` ${waiting} report${waiting === 1 ? ' is' : 's are'} also waiting on you.` : ''}`
      : waiting ? `<b class="warn">${waiting} report${waiting === 1 ? ' is' : 's are'} waiting on you</b>: ${waitBrands.join(', ')}. Open, read, then send.`
      : 'Nothing is waiting on you. Weekly reports draft on Monday, monthly ones on the 1st, and nothing reaches a client until you send it.')}
    <div class="v2tiles">
      ${LX.tile({ compact: true, label: 'Waiting on you', value: `<span class="${waiting ? 'warn' : ''}">${waiting}</span>`, sub: waiting ? 'drafted, not yet sent to the client' : 'nothing drafted is unsent' })}
      ${LX.tile({ compact: true, label: 'Sent', value: String(sent), sub: skippedTotal ? `${skippedTotal} generated then skipped` : "frozen and live on the client's archive link" })}
      ${LX.tile({ compact: true, label: 'Brands', value: String(S.accounts.length), sub: 'weekly on Monday, monthly on the 1st' })}
      ${LX.tile({ compact: true, label: 'Setup gaps', value: `<span class="${gaps ? 'bad' : ''}">${gaps}</span>`, sub: gaps ? 'no internal channel, so drafts post nowhere' : 'every brand has an internal channel' })}
    </div>
    ${groups}
    <details class="footnote"><summary>How reports are drafted and sent</summary>
      <div class="fn-body">A <b>draft</b> is internal: it posts to the brand's internal channel and the client has not seen it. <b>Sent</b> reports are frozen at the moment they go out and live on the client's archive link, so what they opened last month is exactly what they can still open today; nothing about a sent report can be edited afterwards. A brand with <b>no client channel</b> has nothing to send, so its reports are marked <b>handled</b> the moment they are written. They stay editable and are never waiting.<br><br>
      Weekly reports draft automatically on Monday covering last Monday to Sunday; monthly ones draft on the 1st covering the month just finished. Both post to <b>report_channel</b>, which is deliberately internal with no fallback, so a brand with no internal channel set gets a draft that reaches nobody rather than one that reaches the client by accident.</div></details>`);

  const open = id => {
    S.act = id; localStorage.setItem(LS.act, S.act);
    const cp = $('#clientPick'); if (cp) cp.value = S.act;
    RP.act = null; RP.period = null; RP.start = null;
    show('reports');
  };
  $('#main').querySelectorAll('.sc[data-id]').forEach(c => {
    c.onclick = () => open(c.dataset.id);
    c.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(c.dataset.id); } };
  });
}

async function renderReports(first) {
  if (S.act === 'all') return renderReportsAll(first);
  const acct = S.accounts.find(a => a.act_id === S.act);
  if (RP.act !== S.act) { RP.act = S.act; RP.period = null; RP.start = null; }
  const shell = body => `<div class="v2 lx">${LX.head('reports', `Reports: ${esc(acct?.name || '')}`)}
    ${body}</div>`;
  const run = ++RUN;
  if (first) $('#main').innerHTML = shell('<div class="card"><span class="hint">Loading…</span></div>');
  let list;
  try { list = await api('/api/reports?act=' + S.act); }
  catch (e) { if (run === RUN) $('#main').innerHTML = shell(`<div class="card"><span style="color:var(--bad)">${esc(e.message)}</span></div>`); return; }
  if (run !== RUN) return;
  const rows = list.rows || [];
  if (!RP.start && rows.length) { RP.period = rows[0].period; RP.start = rows[0].period_start; }
  let rep = null, repErr = null;
  if (RP.start) {
    try { rep = await api(`/api/report?act=${S.act}&period=${RP.period}&start=${RP.start}`); }
    catch (e) { repErr = e.message; }
  }
  if (run !== RUN) return;

  /* INTERNAL ONLY: no client channel, so a report for this brand is handled
     the moment it is generated (status 'handled'; an older 'draft' reads the
     same). Editable and rewritable, never sendable. Cole, 2026-09-10. */
  const internalOnly = !acct?.brief_channel;
  /* THE PICKER: the latest four as chips, everything older behind one labelled
     dropdown. Twelve chips wrapped to three rows above the report, and nobody
     opens a nine-week-old report often enough to earn a permanent button. */
  /* THE PICKER (2026-10-08): one v2 menu, the open report on its face, every report inside
     with its state, newest first. It replaced four chips plus an "Older reports" dropdown. */
  const repName = x => `${x.period === 'weekly' ? 'Week' : 'Month'} · ${repRangeLabel({ period: x.period, start: x.period_start, end: x.period_end })}`;
  const isCur = x => x.period === RP.period && x.period_start === RP.start;
  const RSTATE = { sent: ['good', 'sent'], handled: ['good', 'handled'], draft: [internalOnly ? 'good' : 'warn', internalOnly ? 'handled' : 'draft'], skipped: ['', 'skipped'] };
  const curRow = rows.find(isCur);
  const chips = rows.length ? `<details class="rp-menu"><summary>${curRow ? esc(repName(curRow)) : 'Pick a report'}</summary><div class="rp-pop">
      ${[['weekly', 'Weekly'], ['monthly', 'Monthly']].map(([k, l]) => { const list = rows.filter(x => x.period === k); return list.length ? `<div class="ah">${l}</div>${list.map(x => { const [c, w] = RSTATE[x.status] || ['', x.status || '']; return `<button type="button" data-rp="${x.period}|${x.period_start}" class="${isCur(x) ? 'on' : ''}"><span>${esc(repRangeLabel({ period: x.period, start: x.period_start, end: x.period_end }))}</span><span class="sp"></span><span class="v2pill ${c}">${esc(w)}</span></button>`; }).join('')}` : ''; }).join('')}
    </div></details><span class="lx-msg">${rows.length} report${rows.length === 1 ? '' : 's'} on file</span>` : '';

  const cfg = acct?.report_config || {};
  const hide = Array.isArray(cfg.hide) ? cfg.hide : [];
  const CHS = [['meta', 'Meta'], ['google', 'Google'], ['tiktok', 'TikTok'], ['amazon', 'Amazon'], ['pinterest', 'Pinterest'], ['email', 'Email (Klaviyo)']];
  // Closed by default: set once per brand, not part of reading a report.
  const configCard = `<details class="rh-wrap"><summary>What goes in ${esc(acct?.name || 'this brand')}'s reports <span class="tiny">&middot; platform sections and the weekly and monthly schedule</span></summary><div class="fold-body">
    <p class="hint" style="margin-bottom:10px;color:var(--muted);font-size:13px">Platform sections appear automatically whenever a platform has data - untick one to leave it out of every future report for this brand (already-generated reports don't change). ${internalOnly
      ? `Each report posts to this brand's <b>internal channel</b>${acct?.slack_channel ? '' : ' - <b>none is set yet</b>, so reports only appear here'} and is <b>handled automatically</b>: there is no client channel, so nothing is ever sent and there is no Send button. Set a client channel in Settings if that should change.`
      : `Drafts post to this brand's <b>internal channel</b>${acct?.slack_channel ? '' : ' - <b>none is set yet</b>, so drafts only appear here'}, and <b>Send to client</b> posts to its <b>client channel</b>. Both are set in Settings.`}</p>
    <div class="row" style="gap:14px;margin-bottom:8px">
      ${CHS.map(([id, lb]) => `<label style="display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer"><input type="checkbox" data-ch="${id}" ${hide.includes(id) ? '' : 'checked'}> ${lb}</label>`).join('')}
    </div>
    <div class="row" style="gap:18px;margin-bottom:0">
      <label style="display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer"><div class="toggle ${cfg.weekly === false ? '' : 'on'}" data-cfg="weekly"></div> Draft a weekly report every Monday</label>
      <label style="display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer"><div class="toggle ${cfg.monthly === false ? '' : 'on'}" data-cfg="monthly"></div> Draft a monthly report on the 1st</label>
      <span class="tiny" id="rpCfgMsg"></span>
    </div></div></details>`;

  const d = rep?.data;
  let warn = '';
  if (d) {
    if (d.missing_days > 0) warn += `<div class="notice warn">⚠️ <div>Triple Whale data was missing for <b>${d.missing_days}</b> day(s) of this period when it was generated, so the totals understate it. Refresh the data (Daily Brief tab → Refresh Triple Whale data), then press Rewrite with AI.</div></div>`;
    if (!d.cm_ok) warn += `<div class="notice warn">ℹ️ <div><b>Contribution margin is left out of this report</b> - ${esc(d.cogs_quality?.reason || 'no trustworthy cost data')}. Every other number still works. Fix COGS in Triple Whale or set a flat margin on the Costs tab, then press Rewrite with AI.</div></div>`;
    const unplanned = Object.entries(d.forecast?.months || {}).filter(([, m]) => !m.planned && m.has_goals).map(([ym]) => monthLabel(ym));
    if (unplanned.length && rep.status !== 'sent') warn += `<div class="notice warn">⚠️ <div><b>No plan was actually set for ${esc(unplanned.join(', '))}</b> - every "vs plan" figure is inherited from an earlier month. Set the real plan on the Plan tab and press Rewrite with AI before sending, or the client is being measured against a number nobody agreed.</div></div>`;
  }

  const sent = rep?.status === 'sent';
  /* A set-but-dead channel must read as "not set", not as "ready to send". */
  const clientChan = acct?.brief_channel;
  const canSend = !internalOnly && await channelUsable(clientChan);
  /* ONE LINE AT THE TOP: which report this is, where it stands, and ONE
     primary action (Send to client). Rewrite, Edit and the client link are
     quiet secondaries. It replaced a banner, a separate heading and a
     "Generated..." line that said the same thing in three places. A sent
     report still offers no Rewrite or Edit, and an internal-only brand still
     has no Send. */
  const regenBtn = '<button class="btn quiet" id="rpRegen" title="Claude writes the summary again. You can give it a one-line direction first, or leave that empty for a straight rewrite.">↻ Rewrite with AI</button>';
  const editTop = rep?.summary ? '<button class="btn quiet" id="rpEditTop" title="Change the wording of the summary before it goes out.">✎ Edit summary</button>' : '';
  const linkBtnHtml = '<button class="btn quiet" id="rpLink" title="One stable link per brand. It opens their archive of sent reports; drafts never show on it.">Copy client link</button>';
  const rpSt = !rep ? null
    : sent ? { tone: 'ok', pill: ['good', 'Sent' + (rep.sent_at ? ' ' + fmtAgo(rep.sent_at) : '')], d: 'Frozen: it cannot be rewritten or edited, so the numbers on the client\'s link never change.', a: linkBtnHtml }
    : internalOnly ? { tone: 'ok', pill: ['good', 'Handled automatically'], d: `${esc(acct?.name || 'This brand')} has no client channel, so nothing goes out and nothing is waiting on you.`, a: regenBtn + editTop }
    : canSend ? { tone: 'wn', pill: ['warn', rep.status === 'skipped' ? 'Skipped, not sent' : 'Draft, waiting on you'], d: 'The client has not seen this.', a: '<button class="btn primary" id="rpSend">Send to client</button>' + regenBtn + editTop + linkBtnHtml }
    : { tone: 'bd', pill: ['bad', 'Draft, nowhere to send'], d: `${esc(acct?.name || 'This brand')} ${clientChan ? `points at a Slack channel that no longer exists (<code>${esc(clientChan)}</code> was archived or deleted)` : 'has no client channel set'}. Pick one in Settings under <b>Client channel</b> and Send to client appears here. A send never falls back to an internal channel.`, a: regenBtn + editTop + linkBtnHtml };
  const banner = rpSt ? `<div class="st-line ${rpSt.tone}">
      <div class="st-t"><h2>${rep.period === 'weekly' ? 'Weekly report' : 'Monthly report'}, ${repRangeLabel({ period: rep.period, start: rep.period_start, end: rep.period_end })}</h2>
        <span class="pill ${rpSt.pill[0]}">${rpSt.pill[1]}</span>
        <div class="st-d" style="margin-top:3px">${rpSt.d}${rep.generated_at ? ` Generated ${fmtAgo(rep.generated_at)}.` : ''} <span class="tiny" id="rpMsg"></span></div></div>
      <div class="st-a">${rpSt.a}</div>
    </div>` : '';

  const body = rep
    ? `${warn}${reportBodyHTML(d || {}, rep.summary, { internal: true, editable: !sent, attr: attrOf(cfg) })}`
    : `<div class="card"><h3 style="margin-bottom:4px">No reports yet</h3>
       <p class="hint">${repErr ? esc(repErr) + ' - ' : ''}Hit <b>Generate last week</b> to build the first one. From next Monday they draft themselves.</p></div>`;

  /* The report's verdict in one sentence above the status line (2026-10-08): revenue and
     MER, the change on the prior period and the forecast, and what was kept. */
  const lead = d && d.totals ? (() => {
    const t = d.totals, p = d.previous || {}, fc = d.forecast || {}, cur = acct?.currency;
    const tag = rep.period === 'weekly' ? 'week' : 'month';
    const off = (a, b) => a != null && b ? a / b - 1 : null;
    const vp = off(t.sales, p.sales), vf = off(t.sales, fc.sales);
    const w = (o, up, dn) => `<b class="${o >= -0.02 ? 'good' : o > -0.12 ? 'warn' : 'bad'}">${Math.abs(Math.round(o * 100))}% ${o >= 0 ? up : dn}</b>`;
    return `<b>${esc(repRangeLabel({ period: rep.period, start: rep.period_start, end: rep.period_end }))}</b>: ${fmtMoney(t.sales, cur)} revenue at ${fmtX(t.mer)} MER${vp != null ? `, ${w(vp, 'up on', 'down on')} the prior ${tag}` : ''}${vf != null ? `, ${w(vf, 'over', 'under')} forecast` : ''}.${t.cm != null ? ` ${fmtMoney(t.cm, cur)} kept after every cost.` : ''}`;
  })() : '';
  pageActions(`<button class="btn" id="rpGenW">Generate last week</button><button class="btn" id="rpGenM">Generate last month</button>`);
  $('#main').innerHTML = shell(`
    ${lead ? LX.say(lead) : ''}
    ${banner}
    ${chips ? `<div class="rp-pick lx-bar">${chips}<span class="lx-msg" id="rpGenMsg"></span></div>` : `<p class="lx-msg" id="rpGenMsg"></p>`}
    ${body}
    ${configCard}`);
  /* One document listener for the whole session closes an open report menu on an outside
     click or Escape. Added once, so it never stacks per render. */
  if (!window.__rpMenuClose) {
    window.__rpMenuClose = 1;
    const close = t => document.querySelectorAll('details.rp-menu[open]').forEach(m => { if (!t || !m.contains(t)) m.open = false; });
    document.addEventListener('click', e => close(e.target));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') close(null); });
  }

  if (d) { wireReportChart(d, acct?.currency, true); wireAdCards(d.ads, acct?.currency, d.period === 'weekly' ? 'week' : 'month'); }
  wireReportJump();
  /* The top "Edit summary" opens the same editor as the button on the Summary
     card, and brings the card into view only if it is off screen. */
  const editTopBtn = $('#rpEditTop');
  if (editTopBtn) editTopBtn.onclick = () => {
    const eb = $('#rpEditSum'); if (!eb) return;
    // Already editing: a second press must not reset what has been typed.
    if ($('#rpSumTa')) $('#rpSumTa').focus({ preventScroll: true }); else eb.click();
    const card = document.getElementById('rpsec-summary');
    if (card) card.scrollIntoView({ block: 'nearest' });
  };

  /* The attribution control re-renders IN PLACE. Everything it changes is
     already in the frozen snapshot, so there is nothing to fetch and no reason
     to move the reader: switching model while looking at a creative card should
     leave you looking at that same card with different numbers on it. */
  const attrSel = $('#rpAttr');
  if (attrSel) attrSel.onchange = async () => {
    const v = attrSel.value;
    attrSel.disabled = true;
    try { await saveCfg({ attr: v }); await inPlace(() => renderReports()); }
    catch (e) { attrSel.disabled = false; noteModal('Could not save', `<p>${esc(e.message)}</p>`); }
  };

  /* a report in the picker menu → open that report */
  document.querySelectorAll('#main [data-rp]').forEach(b => b.onclick = () => {
    const [pp, ss] = b.dataset.rp.split('|');
    RP.period = pp; RP.start = ss;
    inPlace(() => renderReports());
  });

  /* generate - with a confirm-and-force path when days are missing */
  const gen = async (period, btn, start, force, steer) => {
    btn.disabled = true;
    $('#rpGenMsg').textContent = steer
      ? 'Rewriting to your direction - pulling Triple Whale and writing the summary (~30s)…'
      : 'Generating - pulling Triple Whale and writing the summary (~30s)…';
    try {
      const r = await api('/api/report-generate', { method: 'POST', body: JSON.stringify({ act: S.act, period, ...(start ? { start } : {}), ...(force ? { force: true } : {}), ...(steer ? { steer } : {}) }) });
      RP.period = period; RP.start = r.start;
      await inPlace(() => renderReports());
    } catch (e) {
      if (/missing/i.test(e.message) && !force) {
        const ok = await confirmModal('Some days have no data', e.message.replace(/ \(or generate anyway\)$/, '') + '. Generate anyway with the days that exist?', 'Generate anyway');
        if (ok) return gen(period, btn, start, true, steer);
      } else {
        noteModal('Could not generate', `<p>${esc(e.message)}</p>`);
      }
      $('#rpGenMsg').textContent = '';
      btn.disabled = false;
    }
  };
  $('#rpGenW').onclick = e => gen('weekly', e.target);
  $('#rpGenM').onclick = e => gen('monthly', e.target);
  const rg = $('#rpRegen');
  if (rg) rg.onclick = async e => {
    const steer = await steerModal({ title: 'Regenerate this report?', what: 'the executive summary', current: rep.steer || '' });
    if (steer === null) return;
    return gen(rep.period, e.target, rep.period_start, false, steer);
  };

  const sendBtn = $('#rpSend');
  if (sendBtn) sendBtn.onclick = async () => {
    const dest = acct?.brief_channel;
    if (!dest) return noteModal('Nothing to send to', `<p>${esc(acct?.name || 'This brand')} has no external client channel, so nothing was sent.</p><p class="tiny">If it should have one, set the <b>client channel</b> in Settings. A send never falls back to your internal channel.</p>`);
    // NAME the channel rather than describing it. Every brand's brief_channel
    // turned out to be an internal channel, and a dialog saying "the client's
    // channel" would have confirmed that mistake instead of exposing it.
    const name = await channelName(dest);
    const ok = await confirmModal('Send this report to the client?',
      `This posts the ${rep.period} report (${repRangeLabel({ period: rep.period, start: rep.period_start, end: rep.period_end })}) and its link to ${name} - everyone in that channel sees it, and the report freezes permanently. Check that is the channel your client reads.`, `Post to ${name}`);
    if (!ok) return;
    $('#rpMsg').textContent = 'Sending…';
    try {
      const r = await api('/api/report-send', { method: 'POST', body: JSON.stringify({ act: S.act, period: rep.period, start: rep.period_start }) });
      $('#rpMsg').textContent = `Posted ✓ to ${r.channel}`;
      await inPlace(() => renderReports());
    } catch (e) { $('#rpMsg').textContent = e.message; }
  };

  const linkBtn = $('#rpLink');
  if (linkBtn) linkBtn.onclick = async () => {
    try {
      const r = await api('/api/report-link', { method: 'POST', body: JSON.stringify({ act: S.act }) });
      try { await navigator.clipboard.writeText(r.url); $('#rpMsg').textContent = 'Link copied ✓ - opens their archive of sent reports'; }
      catch { noteModal('The client link', `<p>One stable link per brand - it opens their archive of <b>sent</b> reports (drafts are never visible on it):</p><p><code style="font-size:12px;word-break:break-all">${esc(r.url)}</code></p>`); }
    } catch (e) { $('#rpMsg').textContent = e.message; }
  };

  const editBtn = $('#rpEditSum');
  if (editBtn) editBtn.onclick = () => {
    const box = $('#rpSumBox');
    const orig = rep.summary || '';
    box.innerHTML = `<textarea id="rpSumTa" style="width:100%;min-height:220px;border:1px solid var(--line-strong);border-radius:8px;padding:10px;font:inherit;font-size:13.5px;line-height:1.6"></textarea>
      <div class="row" style="margin:10px 0 0"><button class="btn primary" id="rpSumSave">Save</button><button class="btn" id="rpSumCancel">Cancel</button><span class="tiny" id="rpSumMsg"></span></div>`;
    $('#rpSumTa').value = orig;
    editBtn.style.display = 'none';
    $('#rpSumCancel').onclick = () => inPlace(() => renderReports());
    $('#rpSumSave').onclick = async () => {
      $('#rpSumMsg').textContent = 'Saving…';
      try {
        await api('/api/report-summary', { method: 'PUT', body: JSON.stringify({ act: S.act, period: rep.period, start: rep.period_start, summary: $('#rpSumTa').value }) });
        await inPlace(() => renderReports());
      } catch (e) { $('#rpSumMsg').textContent = e.message; }
    };
  };

  /* config: platform sections + weekly/monthly toggles, saved the moment they change */
  const saveCfg = async patch => {
    const next = { ...cfg, ...patch };
    await api('/api/client-settings', { method: 'PUT', body: JSON.stringify({ act: S.act, report_config: next }) });
    if (acct) acct.report_config = next;
    $('#rpCfgMsg').textContent = 'Saved ✓ - applies to reports generated from now on';
    setTimeout(() => { const el = $('#rpCfgMsg'); if (el) el.textContent = ''; }, 3000);
  };
  document.querySelectorAll('#main [data-ch]').forEach(cb => cb.onchange = async () => {
    const nextHide = [...document.querySelectorAll('#main [data-ch]')].filter(x => !x.checked).map(x => x.dataset.ch);
    try { await saveCfg({ hide: nextHide }); }
    catch (e) { noteModal('Could not save', `<p>${esc(e.message)}</p>`); cb.checked = !cb.checked; }
  });
  document.querySelectorAll('#main [data-cfg]').forEach(tg => tg.onclick = async () => {
    const on = !tg.classList.contains('on');
    tg.classList.toggle('on', on);
    try { await saveCfg({ [tg.dataset.cfg]: on }); }
    catch (e) { noteModal('Could not save', `<p>${esc(e.message)}</p>`); tg.classList.toggle('on', !on); }
  });
}

/** The client's archive link (?reports=token). Read-only, no sign-in, one
 *  client, SENT reports only - the worker enforces all of that; this only
 *  renders what it is given. */
async function renderReportsShare(token, sel) {
  RS.token = token;
  chrome(false);
  $('#main').innerHTML = '<div class="card"><span class="hint">Loading…</span></div>';
  let d;
  try {
    const q = sel ? `?period=${encodeURIComponent(sel.period)}&start=${encodeURIComponent(sel.start)}` : '';
    const res = await fetch(S.url.replace(/\/+$/, '') + '/api/report-view/' + token + q, S.tok ? { headers: { 'Authorization': 'Bearer ' + S.tok } } : undefined); // a signed-in team member also gets drafts, flagged as a preview
    d = await res.json();
    if (!res.ok) throw new Error(d.error || 'This link is no longer valid.');
  } catch (e) {
    $('#main').innerHTML = `<div class="gate"><h1>Report unavailable</h1><p>${esc(e.message)}</p></div>`;
    return;
  }
  const cur = d.account.currency;
  $('.hd-title').innerHTML = `${esc(d.account.name)} <em>Reports</em>`;
  const finish = () => {
    setChip('Report', 'live');
    $('#connChip').style.display = '';
    document.querySelector('.hd-right').style.display = '';
    ['#clientPick', '#periodBar', '#btnOut'].forEach(s2 => { const el = $(s2); if (el) el.style.display = 'none'; });
    clientFooter('Each report is a fixed snapshot of the period it covers.');
  };
  if (!d.report) {
    $('#main').innerHTML = `<div class="gate"><h1>No reports yet</h1><p>Your first report will appear here as soon as it is published - this link stays the same, so keep it handy.</p>${d.preview ? '<p class="tiny">You are signed in to Locus, so drafts would show here as a preview. There are none for this brand yet.</p>' : ''}</div>`;
    return finish();
  }
  const r = d.report;
  /* The archive's picker is the same v2 menu as the internal page (2026-10-08). */
  const isOpen = x => x.period === r.period && x.period_start === r.start;
  const picker = (d.reports || []).length > 1 ? `<div class="lx-bar"><span class="lx-msg">Earlier reports</span><details class="rp-menu"><summary>${r.period === 'weekly' ? 'Weekly' : 'Monthly'} · ${esc(repRangeLabel({ period: r.period, start: r.start, end: r.end }))}</summary><div class="rp-pop">
      ${d.reports.map(x => `<button type="button" data-rs="${x.period}|${x.period_start}" class="${isOpen(x) ? 'on' : ''}"><span>${x.period === 'weekly' ? 'Weekly' : 'Monthly'} · ${esc(repRangeLabel({ period: x.period, start: x.period_start, end: x.period_end }))}</span><span class="sp"></span>${x.status && x.status !== 'sent' ? '<span class="v2pill warn">draft, not sent</span>' : ''}</button>`).join('')}
    </div></details></div>` : '';
  $('#main').innerHTML = `<div class="v2 lx">${r.preview ? '<div class="notice warn"><div><b>Preview, only you can see this.</b> This report has not been sent. The client opens this same link and sees nothing until you press Send to client in Locus.</div></div>' : ''}
    <div class="rp-arch"><h2>${r.period === 'weekly' ? 'Weekly report' : 'Monthly report'}: ${repRangeLabel({ period: r.period, start: r.start, end: r.end })}</h2>
    <p class="sub">Prepared by Mobius Digital${r.sent_at ? ` · published ${String(r.sent_at).slice(0, 10)}` : ''}. Every headline number is blended: real store revenue against real total ad spend, from every channel at once.</p></div>
    ${picker}
    ${reportBodyHTML({ ...r.data, account: { currency: cur } }, r.summary, { attr: attrOf({ attr: d.attr }), client: true })}</div>`;
  wireReportChart(r.data || {}, cur, false);
  wireReportJump();
  wireAdCards(r.data?.ads, cur, r.period === 'weekly' ? 'week' : 'month');
  document.querySelectorAll('#main [data-rs]').forEach(b => b.onclick = () => { const [pp, ss] = b.dataset.rs.split('|'); renderReportsShare(token, { period: pp, start: ss }); });
  if (!window.__rpMenuClose) {
    window.__rpMenuClose = 1;
    const close = t => document.querySelectorAll('details.rp-menu[open]').forEach(m => { if (!t || !m.contains(t)) m.open = false; });
    document.addEventListener('click', e => close(e.target));
    document.addEventListener('keydown', e => { if (e.key === 'Escape') close(null); });
  }
  finish();
}

/* ---------- Plan ----------
   The monthly conversation, not an automatic number. Look at what the last six
   months did, choose how much growth you are signing up for, see what that costs
   in spend, then agree it with the client. Everything downstream measures against
   whatever gets saved here. */
// `act` records WHICH client the working values belong to. PL is a single global,
// so without it, switching client in the top-right picker kept the previous
// brand's numbers on screen - and saving wrote them onto the new brand.
const PL = { act: null, month: null, derive: 'mer', sales: null, spend: null, mer: null };
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const monthLabel = ym => `${MONTHS[+ym.slice(5, 7) - 1]} ${ym.slice(0, 4)}`;
const shiftMonth = (ym, n) => new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + n, 1)).toISOString().slice(0, 7);

/** Month-end close: what was agreed, what happened, and WHY they differ.
 *  The why is the part worth having. Revenue is spend x MER, so a revenue miss
 *  decomposes exactly into the part caused by spending differently and the part
 *  caused by the ads performing differently:
 *      actual - planned  =  (spendGap x plannedMER)  +  (actualSpend x merGap)
 *  Those two terms sum to the total gap to the cent, so the page can say "you missed
 *  by X, of which Y was underspend and Z was efficiency" without hand-waving. */
function retroCard(p, cur, saved) {
  const a = p.actual, g = p.planned && p.goals ? p.goals : null;
  const head = `<h3 style="margin-bottom:2px">${esc(monthLabel(p.month))}: how it went</h3>`;
  if (!g || g.sales == null || g.spend == null) {
    return `<div class="card">${head}
      <p class="hint" style="margin-bottom:10px">No plan was set for this month, so there is nothing to measure against - this is just what happened.</p>
      <div class="row" style="gap:22px;flex-wrap:wrap">
        <div><div class="tiny">Revenue</div><div style="font-size:19px;font-weight:700">${fmtMoney(a.sales, cur)}</div></div>
        <div><div class="tiny">Ad spend</div><div style="font-size:19px;font-weight:700">${fmtMoney(a.spend, cur)}</div></div>
        <div><div class="tiny">MER</div><div style="font-size:19px;font-weight:700">${fmtX(a.mer)}</div></div>
        <div><div class="tiny">Contribution margin</div><div style="font-size:19px;font-weight:700">${fmtMoney(a.cm, cur)}</div></div>
      </div></div>`;
  }
  const plannedMer = g.spend ? g.sales / g.spend : null;
  const gap = a.sales - g.sales;
  const spendEffect = plannedMer != null ? (a.spend - g.spend) * plannedMer : null;
  const merEffect = plannedMer != null && a.mer != null ? a.spend * (a.mer - plannedMer) : null;
  const row = (label, planned, actual, fmt, lowerIsBetter) => {
    const off = planned ? actual / planned - 1 : null;
    const good = off == null ? null : lowerIsBetter ? off <= 0.02 : off >= 0;
    return `<tr><td>${label}</td>
      <td class="num">${planned != null ? fmt(planned) : '<span class="tiny"> - </span>'}</td>
      <td class="num"><b>${fmt(actual)}</b></td>
      <td class="num">${off != null ? `<span class="pill ${good ? 'good' : Math.abs(off) <= 0.1 ? 'warn' : 'bad'}">${fmtSigned(off)}</span>` : ' - '}</td></tr>`;
  };
  const money = v => fmtMoney(v, cur);
  const bigger = spendEffect != null && merEffect != null
    ? (Math.abs(spendEffect) >= Math.abs(merEffect) ? 'spend' : 'efficiency') : null;

  return `<div class="card">${head}
    <p class="hint" style="margin-bottom:10px">${saved && saved.agreed_at
      ? `Agreed with the client on ${esc(String(saved.agreed_at).slice(0, 10))}.`
      : 'This plan was saved but never marked agreed.'} ${a.days} of ${a.days_in_month} days have data.</p>
    <div class="tbl-wrap"><table>
      <thead><tr><th></th><th class="num">Agreed</th><th class="num">Actual</th><th class="num">Difference</th></tr></thead>
      <tbody>
        ${row('Revenue', g.sales, a.sales, money)}
        ${row('Ad spend', g.spend, a.spend, money, true)}
        ${row('MER', plannedMer, a.mer, fmtX)}
        ${g.amer != null ? row('aMER', g.amer, a.amer, fmtX) : `<tr><td>aMER</td><td class="num tiny"> - </td><td class="num"><b>${fmtX(a.amer)}</b></td><td class="num tiny">no target set</td></tr>`}
        <tr><td>Contribution margin</td><td class="num tiny"> - </td><td class="num"><b style="color:${a.cm >= 0 ? 'var(--good)' : 'var(--bad)'}">${money(a.cm)}</b></td><td class="num tiny">${a.sales ? fmtPct(a.cm / a.sales) : ' - '} of revenue</td></tr>
      </tbody></table></div>
    ${spendEffect != null && merEffect != null ? `<div class="notice ${Math.abs(gap) / (g.sales || 1) < 0.05 ? '' : gap >= 0 ? '' : 'warn'}" style="margin-top:12px">${gap >= 0 ? '✓' : '→'} <div>
      <b>${gap >= 0 ? 'Beat the plan' : 'Missed the plan'} by ${money(Math.abs(gap))}</b> (${fmtSigned(gap / g.sales)}). That splits into two parts, and they add up exactly:
      <div style="display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin-top:8px;align-items:baseline">
        <span class="tiny" style="color:var(--muted)">Spending differently</span><span class="tiny"><b>${spendEffect >= 0 ? '+' : '−'}${money(Math.abs(spendEffect))}</b> - ${a.spend >= g.spend ? 'spent' : 'underspent by'} ${money(Math.abs(a.spend - g.spend))} ${a.spend >= g.spend ? 'more than agreed' : 'against the agreed budget'}, worth this much revenue at the planned ${fmtX(plannedMer)}</span>
        <span class="tiny" style="color:var(--muted)">Ads performing differently</span><span class="tiny"><b>${merEffect >= 0 ? '+' : '−'}${money(Math.abs(merEffect))}</b> - MER came in at ${fmtX(a.mer)} against ${fmtX(plannedMer)} planned, on the spend actually deployed</span>
      </div>
      <p style="margin:10px 0 0;font-size:13.5px">${bigger === 'spend'
        ? `<b>Mostly a budget story.</b> The ads held up roughly as planned; the month moved because the spend did. Worth asking why the budget ${a.spend >= g.spend ? 'ran over' : 'was not deployed'}.`
        : `<b>Mostly an efficiency story.</b> The budget was close to plan, but each dollar ${a.mer >= plannedMer ? 'worked harder' : 'bought less'} than agreed. That is a creative, offer or auction question, not a pacing one.`}</p>
    </div></div>` : ''}
  </div>`;
}

/** Which month the Plan page opens on when nobody picked one.
 *  The month IN PROGRESS wins while it has no plan of its own: the Daily Brief
 *  is measuring every day against it, so it is the hole to fill first. Once it
 *  is planned, the page opens on next month as before. `planned` is the API's
 *  flag (an explicit goals_json entry for that month, never the default). */
function planDefaultPick(curP, nextP) {
  if (curP && curP.status === 'current' && !curP.planned) return curP;
  // The browser's clock ran ahead of the brand's: its "this month" is the
  // brand's next month, which is the one to plan anyway.
  if (curP && curP.status === 'future') return curP;
  return nextP || curP;
}

async function renderPlan(first) {
  if (S.act === 'all') return renderPlanAll();
  // A month the page chose itself is re-chosen per brand; a month the reader
  // clicked (or another tab asked for) is kept.
  const autoPick = !PL.month || (PL.auto && PL.mAct !== S.act && PL.month === PL.autoMonth);

  // Switching month refetches, but blanking to a spinner loses your place and reads
  // as a page reload. Keep what is on screen, dim the month chips, swap when ready.
  const run = ++RUN;
  if (first) $('#main').innerHTML = `<div class="v2 lx">${LX.head('plan', 'Plan')}<div class="card"><span class="hint">Loading…</span></div></div>`;
  else $('#main').querySelectorAll('[data-m]').forEach(b => { b.style.opacity = '.45'; b.disabled = true; });
  let p;
  try {
    if (autoPick) {
      const thisYm = ymdLocal(new Date()).slice(0, 7);
      const [curP, nextP] = await Promise.all([
        api(`/api/plan?act=${S.act}&month=${thisYm}`),
        api(`/api/plan?act=${S.act}&month=${shiftMonth(thisYm, 1)}`),
      ]);
      if (run !== RUN) return;
      p = planDefaultPick(curP, nextP);
      PL.month = p.month; PL.auto = true; PL.autoMonth = p.month; PL.mAct = S.act;
      PL.sales = null; PL.spend = null; PL.mer = null; PL.act = null; PL.aAct = null;
    } else p = await api(`/api/plan?act=${S.act}&month=${PL.month}`);
  }
  catch (e) {
    if (run !== RUN) return;
    // Replace ALL of #main: on a tab switch `#main .card` still belongs to the
    // outgoing tab, and writing the error into it left the old heading up.
    $('#main').innerHTML = `<div class="v2 lx">${LX.head('plan', 'Plan')}<div class="card"><span style="color:var(--bad)">${esc(e.message)}</span> <button class="btn" onclick="show('plan')">Retry</button></div></div>`;
    return;
  }
  if (run !== RUN) return;
  const cur = p.account.currency;
  const hist = p.history.filter(h => !h.empty);
  /* An agreement with no numbers behind it is not an agreement: Lucky's October row had
     only the Agreed switch flipped (2026-09-12) and the page said "no plan yet" and
     "Agreed" at once. A month with no plan of its own reads as not agreed. */
  const saved = p.plan && !p.planned && p.status !== 'past' ? { ...p.plan, agreed_at: null } : p.plan;
  const editable = p.status !== 'past';
  const nowYm = p.current_month;
  // The three numbers the plan ASSUMES, as live values rather than frozen constants.
  // Each starts at what the data measured; typing over one makes it yours, and the
  // measured figure stays on screen beside it so nobody has to ask on a call where a
  // number came from. `spend_floor` is not an assumption at all - it is the hard deck.
  const MEAS = p.ctx.measured || { returning_per_day: p.ctx.returning_per_day, amer: p.ctx.amer, margin: p.ctx.margin };
  if (PL.aAct !== S.act + '|' + p.month) {
    PL.assump = {
      returning_per_day: p.ctx.returning_per_day, amer: p.ctx.amer, margin: p.ctx.margin,
      spend_floor_per_day: p.ctx.spend_floor_per_day ?? null,
    };
    PL.aAct = S.act + '|' + p.month;
  }
  const A = PL.assump;
  const expRetOf = () => (A.returning_per_day || 0) * p.ctx.days_in_month;
  const isOver = k => A[k] != null && MEAS[k] != null && Math.abs(A[k] - MEAS[k]) > Math.abs(MEAS[k]) * 1e-6;
  const anyOver = () => ['returning_per_day', 'amer', 'margin'].some(isOver);
  const expRet = expRetOf();

  // Revenue = MER x spend. Two of the three are yours to choose; the third is
  // arithmetic. Seed from the saved plan, else last month's revenue at the
  // efficiency this client has actually been running.
  // Re-seed whenever the values on screen belong to a DIFFERENT client. Keying only
  // on `PL.sales == null` meant the picker carried one brand's plan into the next.
  /* ONLY A PLAN SAVED FOR THIS MONTH SEEDS THE BOXES. `p.goals` is merged with
     goals_json.default, and every save overwrites that default, so an unplanned
     month used to open on whatever was saved LAST for some other month: October
     2026 opened on a goal 99% above September and a red "unrealistic" verdict
     before anyone had typed. An unplanned month now starts from holding flat on
     the basis month, with the spend that buys it at the trailing aMER (so the
     verdict starts at achievable), and the page says that is where it started. */
  const plannedAtLoad = !!p.planned;
  const ownGoals = p.planned && p.goals ? p.goals : null;
  const inheritedSales = !p.planned && p.goals && p.goals.sales != null ? p.goals.sales : null;
  if (PL.sales == null || PL.act !== S.act) {
    const base = (ownGoals && ownGoals.sales) || (p.basis ? p.basis.sales : null);
    const basisHist = p.basis ? hist.find(h => h.month === p.basis.month) : null;
    const amerSpend = base != null && p.ctx.amer ? Math.max(0, base - expRet) / p.ctx.amer : null;
    const seedSpend = (ownGoals && ownGoals.spend)
      || (amerSpend ? amerSpend : (basisHist && basisHist.spend) || null);
    PL.sales = base;
    PL.spend = seedSpend;
    PL.mer = base != null && seedSpend ? base / seedSpend : null;
    // Restore which field the plan was AGREED with as the result. That choice is
    // the difference between "the budget moves" and "the budget is fixed", so
    // silently reseeding it to 'mer' every visit would quietly re-state the plan.
    let savedDerive = null;
    try { savedDerive = JSON.parse(saved?.assumptions_json || '{}').derive; } catch { /* a plan saved before this existed */ }
    PL.derive = ['sales', 'spend', 'mer'].includes(savedDerive) ? savedDerive : 'mer';
    PL.act = S.act;
  }

  const calc = () => {
    let sales = PL.sales, spend = PL.spend, mer = PL.mer;
    if (PL.derive === 'mer') mer = sales != null && spend ? sales / spend : null;
    else if (PL.derive === 'spend') spend = sales != null && mer ? sales / mer : null;
    else sales = spend != null && mer ? spend * mer : null;
    if (sales == null || spend == null) return null;
    // What the plan quietly assumes about acquisition: returning revenue turns up
    // on its own, so every dollar above it has to be bought with this spend.
    const newNeeded = Math.max(0, sales - expRetOf());
    const impliedAmer = spend > 0 ? newNeeded / spend : null;
    const trailing = A.amer;
    let verdict = null;
    if (impliedAmer != null && trailing) {
      const ratio = impliedAmer / trailing;
      verdict = ratio <= 1.05 ? 'ok' : ratio <= 1.25 ? 'stretch' : 'unrealistic';
    }
    const cm = A.margin != null ? sales * A.margin - spend : null;
    return { sales, spend, mer: mer != null ? mer : (spend ? sales / spend : null),
      newNeeded, impliedAmer, trailing, verdict, cm,
      growth: p.basis && p.basis.sales ? sales / p.basis.sales - 1 : null,
      cmPct: cm != null && sales ? cm / sales : null };
  };
  let c = calc();

  const verdictHtml = x => {
    if (!x || x.impliedAmer == null || !x.trailing) return '<span class="pill unk">No verdict</span> There is not enough recent data to judge this plan.';
    const pctOver = Math.round((x.impliedAmer / x.trailing - 1) * 100);
    // ONE line: the word, then the one reason. The window is always named.
    const win = `the last ${src.trailing_days || 28} days`;
    if (x.verdict === 'ok') {
      return `<span class="pill good">Achievable</span> It needs new customers at <b>${fmtX(x.impliedAmer)}</b> per ad dollar, and ${win} ran at <b>${fmtX(x.trailing)}</b>.`;
    }
    if (x.verdict === 'stretch') {
      return `<span class="pill warn">A stretch</span> It needs new customers at <b>${fmtX(x.impliedAmer)}</b> per ad dollar, <b>${pctOver}% better</b> than the <b>${fmtX(x.trailing)}</b> of ${win}.`;
    }
    return `<span class="pill bad">Unrealistic</span> It needs new customers at <b>${fmtX(x.impliedAmer)}</b> per ad dollar, <b>${pctOver}% better</b> than the <b>${fmtX(x.trailing)}</b> of ${win}. Raise the spend or lower the revenue goal.`;
  };

  // Every derived number states its own window. The mix is deliberate: efficiency
  // and returning behavior move, so they come from the most recent 28 days, while
  // the revenue basis and margin come from a whole finished month. Declared above
  // cmHtml because that reads it too - the CM comparison and the "Based on" box
  // must always name the same month.
  const src = (p.ctx && p.ctx.sources) || {};

  const cmHtml = x => {
    // Compare against the SAME month the "Based on" box names, and only when that
    // month is genuinely complete. Picking "most recent finished month" separately
    // let the two disagree: a month with a Triple Whale sync gap is skipped as a
    // revenue basis but was still used here, so the plan got measured against a
    // month missing days - understating its CM and flattering the comparison.
    const lastFull = src.basis_month
      ? hist.find(h => h.month === src.basis_month && !h.partial && h.days >= h.days_in_month - 2) || null
      : null;
    if (!x || x.cm == null || !lastFull || lastFull.cm == null) return '';
    const d = x.cm - lastFull.cm;
    return d >= 0
      ? `That leaves <b>${fmtK(d, cur)} more</b> contribution margin than ${esc(monthLabel(lastFull.month))}.`
      : `⚠️ That leaves <b>${fmtK(Math.abs(d), cur)} less</b> contribution margin than ${esc(monthLabel(lastFull.month))} - the extra spend outweighs the extra revenue.`;
  };

  /** A saved plan stores the basis it was built on. If that figure has since moved,
   *  the agreed target is stale and nothing on screen said so - which is exactly what
   *  happened when the revenue definition was corrected on 23 August 2026: every plan
   *  saved before then was built on a basis 1-13% too high, and the goals kept being
   *  reported against as though they were current. Compare the stored basis with what
   *  the same basis is worth today and say so. Past months are excluded: their basis
   *  was legitimately a different month, so a difference there means nothing. */
  const staleBasis = () => {
    if (p.status === 'past' || !p.plan || p.plan.basis_sales == null || !p.basis || !p.basis.sales) return '';
    const was = p.plan.basis_sales, now = p.basis.sales;
    const off = now / was - 1;
    if (Math.abs(off) < 0.02) return '';
    const saved = p.plan.updated_at ? String(p.plan.updated_at).slice(0, 10) : null;
    return `<div class="notice warn">&#9888;&#65039; <div><b>This plan was built on a number that has since changed.</b>
      It was saved${saved ? ' on ' + esc(saved) : ''} against a basis of <b>${fmtMoney(was, cur)}</b>, but
      ${p.basis.month ? esc(monthLabel(p.basis.month)) : 'that month'} is now measured at <b>${fmtMoney(now, cur)}</b>,
      <b>${fmtSigned(off)}</b>. The saved target still reflects the old figure, so everything reporting
