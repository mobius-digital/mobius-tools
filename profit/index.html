      <tbody>${r.top_flagged.map(x => `<tr><td>${x.date}</td><td class="num">${fmtMoney(x.sales, cur)}</td><td class="num">${fmtMoney(x.cogs, cur)}</td><td class="num"><b style="color:var(--bad)">${Math.round(x.ratio*100)}%</b></td></tr>`).join('')}</tbody></table></div>
      <p class="tiny" style="margin-top:8px">${material ? "If these are real wholesale sales, the money came in somewhere this dashboard can't see - worth knowing, because it means the store view understates the whole business." : 'If this list grows, or the total starts climbing, come back and look properly.'}</p></div>`;
    })() : ''}</div>`;

  LX.wireChart('csMargin');
  const save = async pct => {
    $('#mMsg').textContent = 'Saving…';
    try {
      await api('/api/margin', { method:'PUT', body: JSON.stringify({ act: S.act, margin_pct: pct }) });
      $('#mMsg').textContent = 'Saved ✓';
      await inPlace(async () => { await boot(); show('costs'); });
    } catch (e) { $('#mMsg').textContent = e.message; }
  };
  const sb = $('#mSuggest');
  if (sb && r) sb.onclick = () => save(Math.round(r.margin * 100) / 100);
  $('#mSave').onclick = () => {
    const raw = $('#mPct').value.replace(/[^0-9.]/g, '');
    if (raw === '') return save(null);
    const v = +raw;
    if (!(v > 0 && v < 100)) { $('#mMsg').textContent = 'Enter a margin between 1 and 99.'; return; }
    save(v / 100);
  };
  $('#mClear').onclick = () => { $('#mPct').value = ''; save(null); };
}

/* ---------- Daily Brief (Chat 5) - forecast vs actual, CTC-style ---------- */
const BF = { date: null };

async function renderBriefAll(first) {
  // The shell is re-emitted in FULL on every paint, placeholder and result alike.
  // On a tab switch #main still holds the OUTGOING tab's DOM, so writing into
  // `#main .card` would inject this table into the previous page - or throw, when
  // that tab has no card, leaving the Brief tab unable to open at all.
  const shell = body => `<div class="v2 lx">${LX.head('brief', 'Daily Brief')}
    ${body}</div>`;
  const run = ++RUN;
  if (first) $('#main').innerHTML = shell('<div class="card"><span class="hint">Loading every client…</span></div>');
  // /api/overview only ever returns active accounts and its payload carries no
  // `active` flag, so filtering on one emptied this table on every render.
  const active = S.accounts;
  const data = await Promise.all(active.map(a => api('/api/brief?act=' + a.act_id).catch(() => null)));
  if (run !== RUN) return;
  const U = window.V2UI;
  const cell = (a2, f2, cur, fx2) => {
    const fmt = fx2 ? (n => n == null ? ' - ' : n.toFixed(2) + 'x') : (n => fmtK(n, cur));
    if (a2 == null) return `<td class="num"><span class="tiny">no data</span></td>`;
    return `<td class="num"><b>${fmt(a2)}</b> ${f2 ? U.chip(a2, f2, false, `Against the day's plan of ${fmt(f2)}`) : ''}<span class="sub">plan ${fmt(f2)}</span></td>`;
  };
  /* ONE STATUS AND ONE ACTION PER BRAND (2026-10-04). Status is its own column, the brands
     waiting on you sort to the top, and each row has one button. No client channel =
     handled, never waiting. */
  const stOf = (a, d) => {
    if (!d) return { r: 5, cls: 'unk', label: 'Could not load' };
    const row = (d.history || []).find(h => h.date === d.date);
    const auto = !a.brief_channel;
    if (row?.status === 'sent') return { r: 2, cls: 'good', label: 'Sent' };
    if (row && (row.status === 'handled' || (row.status === 'draft' && auto))) return { r: 3, cls: 'good', label: 'Handled automatically' };
    if (row?.status === 'draft') return { r: 0, cls: 'warn', label: 'Waiting on you' };
    if (row?.status === 'error') return { r: 1, cls: 'bad', label: 'Failed to write' };
    if (row?.status === 'skipped') return { r: 3, cls: 'unk', label: 'Not sent (skipped)' };
    return { r: 4, cls: 'unk', label: 'Not written yet' };
  };
  const judged = active.map((a, i) => ({ a, d: data[i], st: stOf(a, data[i]) }));
  const count = r => judged.filter(x => x.st.r === r).length;
  const waiting = count(0), failed = count(1), sent = count(2), handled = count(3), notYet = count(4) + count(5);
  const waitNames = judged.filter(x => x.st.r === 0).map(x => esc(x.a.name));
  const say = waiting ? `<b class="warn">${waiting} brief${waiting === 1 ? ' is' : 's are'} waiting on you</b>: ${waitNames.join(', ')}. Open each one, read it, add what you did, then send.`
    : failed ? `<b class="bad">${failed} brief${failed === 1 ? '' : 's'} failed to write.</b> Open ${failed === 1 ? 'it' : 'them'} and press Write the brief.`
    : `Nothing is waiting on you. ${sent} sent, ${handled} handled automatically${notYet ? `, ${notYet} not written yet` : ''}.`;
  const rows = judged
    .sort((x, y) => x.st.r - y.st.r || x.a.name.localeCompare(y.a.name))
    .map(({ a, d, st }) => {
    const day = d?.days?.find(x => x.date === d.date);
    const gaps = [d && !d.goals ? 'no goals yet' : '', d && !d.brief_enabled ? 'morning run is off' : ''].filter(Boolean).join(' · ');
    return `<tr data-id="${a.act_id}" class="link" tabindex="0">
      <td><b>${esc(a.name)}</b>${gaps ? `<span class="sub">${gaps}</span>` : ''}</td>
      <td><span class="pill ${st.cls}">${st.label}</span></td>
      ${d && day?.a ? ((d.cogs_quality?.verdict === 'broken' || d.cogs_quality?.verdict === 'none') ? `<td class="num"><span class="tiny"${U.tipAttr(d.cogs_quality?.reason || 'no cost data')}>cost data unreliable</span></td>` : cell(day.a.cm, day.f.cm, a.currency)) + cell(day.a.sales, day.f.sales, a.currency)
        : `<td colspan="2"><span class="tiny">${d ? 'no Triple Whale data for yesterday yet' : 'couldn’t load'}</span></td>`}
      <td class="num"><button class="btn${st.r === 0 ? ' primary' : ' quiet'}" type="button" style="white-space:nowrap">${st.r === 0 ? 'Review and send' : 'Open brief'}</button></td>
    </tr>`;
  }).join('');
  $('#main').innerHTML = shell(`
    ${LX.say(say)}
    <div class="v2tiles">
      ${LX.tile({ compact: true, label: 'Waiting on you', value: `<span class="${waiting ? 'warn' : ''}">${waiting}</span>`, sub: 'drafted, not yet sent to the client' })}
      ${LX.tile({ compact: true, label: 'Sent', value: String(sent), sub: 'went to the client channel' })}
      ${LX.tile({ compact: true, label: 'Handled automatically', value: String(handled), sub: 'no client channel, or skipped on purpose' })}
      ${LX.tile({ compact: true, label: 'Not written or failed', value: `<span class="${failed ? 'bad' : ''}">${notYet + failed}</span>`, sub: failed ? `${failed} failed to write` : 'nothing failed' })}
    </div>
    <section class="v2card"><div class="v2h"><h3>Yesterday's brief, brand by brand</h3><span class="find">Waiting first. Click a row to open that brand's brief.</span></div>
    <div class="v2tbl"><table>
    <thead><tr><th>Brand</th><th>Yesterday&rsquo;s brief</th><th>Contribution margin</th><th>Revenue</th><th></th></tr></thead>
    <tbody>${rows || '<tr><td class="tiny">No active clients.</td></tr>'}</tbody></table></div></section>
    ${U.foot("Store numbers from Triple Whale (every platform), so they will not match Meta's own.")}`);
  const open = tr => { S.act = tr.dataset.id; localStorage.setItem(LS.act, S.act); $('#clientPick').value = S.act; show('brief'); };
  $('#main tbody').addEventListener('click', e => { const tr = e.target.closest('tr[data-id]'); if (tr) open(tr); });
  $('#main tbody').addEventListener('keydown', e => { const tr = e.target.closest('tr[data-id]'); if (tr && e.key === 'Enter') open(tr); });
}

async function renderBrief(first) {
  if (S.act === 'all') return renderBriefAll(first);
  const acct = S.accounts.find(a => a.act_id === S.act);
  // Same rule as renderBriefAll: every paint re-emits the whole page. Appending to
  // whatever `#main` happens to hold would graft this brief onto the outgoing tab.
  const shell = body => `<div class="v2 lx">${LX.head('brief', `Daily Brief${acct ? ': ' + esc(acct.name) : ''}`)}
    ${body}</div>`;
  const run = ++RUN;
  if (first) $('#main').innerHTML = shell('<div class="card"><span class="hint">Loading…</span></div>');
  let d;
  try { d = await api('/api/brief?act=' + S.act + (BF.date ? '&date=' + BF.date : '')); }
  catch (e) { if (run === RUN) $('#main').innerHTML = shell(`<div class="card"><span style="color:var(--bad)">${esc(e.message)}</span></div>`); return; }
  if (run !== RUN) return;
  BF.cur = d;
  const U = window.V2UI;
  const cur = d.account.currency;
  const day = d.days.find(x => x.date === d.date);
  const f = day?.f || {}, a = day?.a || {};
  const g = d.goals || {};
  const fx = n => n == null ? ' - ' : n.toFixed(2) + 'x';
  const noTw = !a || a.sales == null;
  const cq = d.cogs_quality || { verdict: 'none', reason: 'no cost data found' };
  const cmOff = cq.verdict === 'broken' || cq.verdict === 'none';
  // Today's row decides what the compose card is: an editable draft, a sent
  // record, or nothing yet.
  const bfRow = (d.history || []).find(hh => hh.date === d.date) || null;
  /* INTERNAL ONLY: no client channel means nothing is ever sent, so a brief
     for this brand is handled the moment it is written (status 'handled', and
     an older 'draft' is treated the same). It stays editable and rewritable;
     it never shows Send or Don't-send. Cole, 2026-09-10. */
  const internalOnly = !acct?.brief_channel;
  const bfDraft = bfRow && (bfRow.status === 'draft' || bfRow.status === 'handled') ? bfRow : null;
  const bfSent = bfRow && bfRow.status === 'sent' ? bfRow : null;
  /* Same rule as the Reports tab: a channel that is set but archived is not a
     place a brief can go, so the Send button must not offer it. */
  const bfCanSend = !internalOnly && await channelUsable(acct?.brief_channel);
  const histPill = s => s === 'sent' || s === 'handled' ? 'good' : s === 'skipped' ? 'warn' : s === 'error' ? 'bad' : 'unk';
  const histLabel = s => s === 'handled' ? 'handled · internal only' : s === 'draft' && internalOnly ? 'handled · internal only' : s;
  const hist = (d.history || []).map(hh => `
    <details style="margin:6px 0"><summary style="cursor:pointer;font-size:13px"><b>${esc(hh.date)}</b> · <span class="pill ${histPill(hh.status)}">${esc(histLabel(hh.status))}</span>${hh.posted_at ? ` <span class="tiny">${fmtAgo(hh.posted_at)}</span>` : ''}</summary>
    <div style="margin-top:6px">${slackPreview(hh.text, { when: hh.posted_at ? fmtAgo(hh.posted_at) : '' })}</div></details>`).join('');

  /* PAGE ORDER (2026-10-04, "stupid simple"; v2 look 2026-10-08): the buyer's morning job is
     read, fix, add What we did, Send. So: one verdict sentence on the day's numbers, the day
     picker, ONE status line, the brief as a clean card with its actions, then the numbers as
     v2 tiles with the month's sparkline, the month against the plan, then closed folds. */
  const dayLbl = U.day(d.date);
  const headHtml = `<div class="bf-head lx-bar">
      <label for="bfDate" class="lx-msg">Brief for</label><input type="date" id="bfDate" value="${d.date}" max="${addDaysStr(ymdLocal(new Date()), -1)}">
      <span class="sp"></span>
      <span class="lx-msg" id="bfTwMsg">${d.tw_last_sync ? 'Triple Whale synced ' + fmtAgo(d.tw_last_sync) : 'no Triple Whale data yet, press refresh'}</span>
      <button class="btn quiet" id="bfTwSync" title="Pull the last 70 days from Triple Whale again, then redraw this page.">↻ Refresh Triple Whale data</button>
    </div>`;
  /* ONE STATUS LINE that answers "can I send this?": the data-health verdict
     the Send button already obeys, merged with where this day's brief stands
     (sent, waiting on you, handled automatically). */
  const hIss = d.health?.by_date?.[d.date] || [];
  const hBad = hIss.find(i => i.severity === 'broken'), hWarn = hIss.find(i => i.severity === 'warn');
  const hTxt = !d.health ? 'The data for this day has not been checked yet.'
    : hBad ? `The data behind this day is wrong, so it cannot be sent. ${esc(hBad.what)}. ${esc(hBad.fix || '')}`
    : hWarn ? `Check the numbers before sending: ${esc(hWarn.what)}.`
    : 'Data checked, safe to send.';
  const bName = esc(acct?.name || 'This brand');
  const st = bfSent ? { tone: 'ok', v: 'Sent to the client' + (bfSent.posted_at ? ' ' + fmtAgo(bfSent.posted_at) : ''), d: 'This is the record of what they received, so it cannot be edited.' }
    : hBad ? { tone: 'bd', v: 'Blocked', d: hTxt + ' Spend below has been rebuilt from the platforms where a second source exists. <button class="btn" id="bfToHealth" style="padding:3px 9px;font-size:12px;margin-left:4px">Open Data Health</button>' }
    : bfDraft && internalOnly ? { tone: hWarn ? 'wn' : 'ok', v: 'Handled automatically', d: `${bName} has no client channel, so this brief is for your team only and nothing goes out.${hWarn ? ' ' + hTxt : ''}` }
    : bfDraft && !bfCanSend ? { tone: 'bd', v: 'Nowhere to send', d: `The client channel saved for ${bName} no longer exists. Pick one in Settings and Send to client appears here.` }
    : bfDraft ? { tone: hWarn || !d.health ? 'wn' : 'ok', v: 'Waiting on you', d: hTxt }
    : bfRow?.status === 'skipped' ? { tone: '', v: 'Not sent', d: 'You chose not to send this day. Write the brief again if you changed your mind.' }
    : { tone: hWarn ? 'wn' : '', v: 'Not written yet', d: (internalOnly ? `${bName} has no client channel, so the brief is handled as soon as it is written. ` : 'Nothing reaches the client until you send it. ') + hTxt };
  const statusHtml = `<div class="st-line ${st.tone}"><div class="st-t"><span class="st-v">${st.v}</span><span class="st-d">${st.d}</span></div></div>`;

  /* The verdict on the day itself, in one sentence: revenue against the day's plan, MER,
     and the month so far. The status line under it says what to do about the brief. */
  const offOf = (x, y) => x != null && y ? x / y - 1 : null;
  const salesOff = offOf(a.sales, f.sales), mtdOff = d.mtd && d.mtd.sales != null && d.mtd.sales_f ? d.mtd.sales / d.mtd.sales_f - 1 : null;
  const tone = o => o == null ? '' : o >= 0 ? 'good' : o > -0.15 ? 'warn' : 'bad';
  const say = noTw ? `No Triple Whale sales data for ${dayLbl} yet. Press Refresh, and check the shop domain in Settings if it stays empty.`
    : `<b>${dayLbl}</b>: ${fmtMoney(a.sales, cur)} revenue${salesOff != null ? `, <b class="${tone(salesOff)}">${Math.abs(Math.round(salesOff * 100))}% ${salesOff >= 0 ? 'over' : 'under'}</b> the day's plan` : ''}, at ${fx(a.mer)} MER${!cmOff && a.cm != null ? `, ${a.cm >= 0 ? 'keeping' : 'losing'} ${fmtMoney(Math.abs(a.cm), cur)} after every cost` : ''}.${mtdOff != null ? ` The month so far is <b class="${tone(mtdOff)}">${Math.abs(Math.round(mtdOff * 100))}% ${mtdOff >= 0 ? 'ahead of' : 'behind'}</b> plan.` : ''}`;

  /* The numbers as v2 tiles: the day's figure, a chip against the day's plan, and the month's
     run so far as a sparkline (hover reads each day). */
  const done = d.days.filter(x => x.date <= d.up_to && x.a && x.a.sales != null);
  const spk = (k, fmt) => done.length > 1 ? LX.spark(done.map(x => x.a[k] ?? null), done.map(x => `<b>${U.day(x.date)}</b> · ${x.a[k] == null ? '–' : fmt(x.a[k])}${x.f && x.f[k] != null ? ` <span class="faint">plan ${fmt(x.f[k])}</span>` : ''}`), done.map(x => x.f ? x.f[k] ?? null : null)) : '';
  const M = n => fmtMoney(n, cur);
  const nt = (label, k, fmt, info, lower) => LX.tile({ compact: true, label, value: fmt(a[k]), delta: LX.chip(a[k], f[k], lower, 'Against the plan for the day'), sub: `plan ${fmt(f[k])}`, spark: spk(k, fmt), info });
  const tiles = [
    cmOff ? LX.tile({ compact: true, label: 'Contribution margin', value: '<span style="color:var(--muted)">Not reported</span>', go: 'costs', sub: 'cost data unreliable, see the note above', info: `Switched off because this client's cost data in Triple Whale can't be trusted: ${cq.reason}. Set real COGS in Triple Whale, or a flat margin on Costs.` })
      : nt('Contribution margin', 'cm', M, 'Did the day actually make money? Revenue minus product costs (COGS), payment fees and ad spend. ' + (d.cm_pct != null ? `Using the ${Math.round(d.cm_pct * 100)}% margin override.` : a.cm_basis === 'cogs' ? 'Using the client’s real COGS from Triple Whale.' : a.cm_basis === 'tw' ? 'Using Triple Whale’s gross profit.' : 'Needs COGS in Triple Whale or a flat margin set on Costs.')),
    nt('Revenue', 'sales', M, 'Net Sales + Shipping: Shopify Total Sales minus sales tax, every channel, after discounts and returns. Not ad-platform attributed revenue; the same line every tab uses.'),
    nt('Ad spend', 'spend', M, 'All ad platforms blended (Meta + Google), from Triple Whale. The plan is the monthly spend goal spread evenly across the days. Spend is a decision, so it carries no good or bad colour.', 'n'),
    nt('MER', 'mer', fx, 'All store revenue divided by all ad spend, blended on both sides. Plan = the revenue goal divided by the spend goal.'),
    nt('aMER', 'amer', fx, 'New-customer revenue divided by that same total ad spend, so email and repeat buyers cannot flatter the ads.'),
  ].join('');
  const chan = [['Meta', a.meta_spend, a.meta_roas, a.meta_purchases, '--c-meta'], ['Google', a.google_spend, a.google_roas, a.google_purchases, '--c-google']].filter(r => r[1] != null && r[1] > 0);
  const chanHtml = `<div class="bf-chan">${a.new_rev != null ? `<span><b>${M(a.new_rev)}</b> from new customers${a.new_share != null ? ` (${Math.round(a.new_share * 100)}%)` : ''}, <b>${M(a.ret_rev)}</b> returning</span>` : '<span>No new-vs-returning split available</span>'}${chan.map(([n, sp, r, o, c]) => `<span${a.attr_source ? U.tipAttr('ROAS and orders per channel are Triple Whale attribution (last platform click), not the Meta or Google dashboards. Spend comes from each platform. Recent days keep settling for a few days as customer journeys resolve.') : ''}><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(${c});margin-right:6px"></i>${n} <b>${M(sp)}</b>${!a.attr_source ? '' : o != null && o < 2 ? ` (${o ? 'one order' : 'no orders'} yet)` : r != null ? ` at ${fx(r)} off ${Math.round(o)} orders` : ''}</span>`).join('')}</div>`;
  const numsHtml = `
    ${d.goals && d.goals_planned === false ? `<p class="bf-flag"><b>No plan was set for ${esc(monthLabel(d.month))}.</b> Every "plan" figure here is carried over from ${d.goals_inherited_from ? `<b>${esc(monthLabel(d.goals_inherited_from))}</b>` : 'the last plan on file'}, and the posted brief says so. <button class="btn" id="bfToPlan2">Set ${esc(monthLabel(d.month))}'s plan</button></p>` : ''}
    ${!d.goals ? `<p class="bf-flag"><b>No goals set for ${esc(monthLabel(d.month))}.</b> Set them on the <b>Plan</b> tab. The forecast, the brief and auto-posting all switch on once a net-sales and spend goal exist.</p>` : ''}
    ${noTw && d.goals ? `<p class="bf-flag">No Triple Whale sales data for ${d.date} yet. Press “Refresh Triple Whale data” at the top, and check the shop domain in Settings if it stays empty.</p>` : ''}
    ${cmOff ? `<p class="bf-flag bad"><b>Contribution Margin is switched off for this client.</b> ${esc(cq.reason)}. It is left out of the brief and every other metric still works. To fix it, set real COGS in Triple Whale or a flat <b>margin %</b> on the <b>Costs</b> tab.</p>` : cq.verdict === 'noisy' ? `<p class="bf-flag"><b>Cost data is a little noisy:</b> ${esc(cq.reason)}. CM still shows, but treat it as directional. A flat <b>margin %</b> on the <b>Costs</b> tab gives it a stable rate.</p>` : ''}
    <div class="lx-t5">${tiles}</div>
    ${chanHtml}`;
  /* The draft is the job; the numbers are context. ONE primary button (Send
     to client, or Write the brief when there is nothing yet); everything else
     is a quiet secondary. */
  const bfActs = `<div class="bf-acts lx-bar">
        <button class="btn primary" id="bfPost" style="display:${bfDraft && bfCanSend ? '' : 'none'}">Send to client</button>
        ${bfDraft ? '<button class="btn quiet" id="bfEditBtn">✎ Edit wording</button><button class="btn" id="bfSave" style="display:none">Save changes</button><button class="btn quiet" id="bfCancel" style="display:none">Cancel</button>' : ''}
        ${bfSent ? '' : `<button class="btn ${bfDraft ? 'quiet' : 'primary'}" id="bfWrite" title="${bfDraft ? 'Claude writes it again. You can give it a one-line direction first, or leave that empty for a straight rewrite.' : 'Claude writes the brief from the numbers and the Change Log. Takes about 20 seconds.'}">${bfDraft ? '↻ Rewrite with AI' : '✦ Write the brief for ' + esc(dayLbl)}</button>`}
        <button class="btn quiet" id="bfCopy" style="display:${bfDraft || bfSent ? '' : 'none'}">Copy</button>
        <span class="lx-msg" id="bfMsg"></span>
        ${bfSent || internalOnly ? '' : `<span class="sp"></span><button class="btn quiet" id="bfSkip" title="Mark this day handled without messaging the client, so it stops being carried into later briefs">Don't send this one</button>`}
      </div>`;
  const bfNoteHtml = bfSent ? '' : `<div class="bf-note">
        <label for="bfNote" style="display:block;font-weight:600;margin-bottom:2px">What we did</label>
        <p class="tiny" style="margin:0 0 8px">One line per action. The brief's "What we're doing" is written only from this note and the Change Log. Kept for 2 days.</p>
        <textarea id="bfNote" rows="2" placeholder="Brought the paused campaign back with tighter caps. Holding spend flat until margin recovers."></textarea>
        <div class="lx-bar" style="margin-top:8px"><button class="btn" id="bfNoteSave">Save note</button><span class="lx-msg" id="bfNoteMsg"></span></div>
      </div>`;
  const briefCard = `<section class="card bf-main">
      <div class="bf-top"><h3>The brief for ${esc(dayLbl)}</h3>${bfDraft?.steer ? `<span class="tiny">Last rewrite was steered: “${esc(String(bfDraft.steer).slice(0, 240))}”</span>` : ''}</div>
      ${bfSent
        ? slackPreview(bfSent.text, { when: 'sent ' + (bfSent.posted_at ? fmtAgo(bfSent.posted_at) : '') })
        : bfDraft
        ? `<div id="bfPreview">${slackPreview(bfDraft.text)}</div>
           <textarea id="bfEdit" style="display:none;min-height:360px">${esc(bfDraft.text || '')}</textarea>
           <p class="tiny" id="bfEditHint" style="display:none;margin-top:6px">Slack formatting: <code>*bold*</code>, <code>_italic_</code>, <code>:wave:</code> for emoji. Save to see it rendered.</p>`
        : `<div id="bfPreview"><p class="hint">No brief has been written for this day yet. Press <b>Write the brief</b> and Claude turns the numbers and the Change Log into the update (about 20 seconds).</p></div>`}
      ${bfNoteHtml}
      ${bfActs}</section>`;
  const histN = (d.history || []).length;
  const histFold = hist ? `<details class="rh-wrap bf-hist"><summary>Past briefs <span class="tiny">&middot; ${histN} on file, newest first</span></summary><div class="fold-body">${hist}</div></details>` : '';

  /* The month against the plan, cumulative: actual in the accent, the plan dashed. */
  let cf = 0, ca = 0;
  const cum = d.days.map(x => {
    cf += x.f.sales ?? 0;
    const act = x.date <= d.up_to && x.a?.sales != null ? (ca += x.a.sales) : null;
    return { date: x.date, v: act, plan: x.f.sales != null ? cf : null, a: x.a, f: x.f };
  });
  const chartCard = `<section class="v2card"><div class="v2h"><h3>The month against the plan</h3><span class="find">${d.mtd.sales != null && d.mtd.sales_f ? `So far <b>${fmtK(d.mtd.sales, cur)}</b> against <b>${fmtK(d.mtd.sales_f, cur)}</b> planned (${fmtPct(d.mtd.sales / d.mtd.sales_f - 1, 0)}).` : ''}</span><span class="cap"${U.tipAttr(`Forecast weighting: ${d.weights || 'even'}.`)}>Cumulative revenue</span></div>
      ${cum.some(r => r.v != null) ? U.legend([{ color: '--brand', label: 'Actual so far' }, { dash: true, label: 'The plan' }]) + U.lineChart('bfSvg', cum, { key: 'v', prev: cum.map(r => ({ date: r.date, v: r.plan })), cur, h: 220 }) : '<p class="v2hint">No data to chart yet.</p>'}
      ${catchUpLine(d.to_hit ? { to_hit: d.to_hit } : null, n => fmtMoney(n, cur))}</section>`;
  /* Closed by default: the plan is set on the Plan tab and the two switches
     are set once. The summary carries their state so nothing is hidden. */
  const planFold = `<details class="rh-wrap"><summary>The plan this is measured against <span class="tiny">&middot; revenue goal ${g.sales != null ? fmtMoney(g.sales, cur) : 'not set'} &middot; runs every morning: <span id="bfAutoLbl">${d.brief_enabled ? 'on' : 'off'}</span>${internalOnly ? ' &middot; internal only' : ` &middot; review before sending: <span id="bfReviewLbl">${acct?.review_first ? 'on' : 'off'}</span>`}</span></summary><div class="fold-body">
      <p class="hint" style="margin-bottom:10px;color:var(--muted);font-size:13px">Set on the <b>Plan</b> tab, once a month, with the client. This page only reports against it.</p>
      <div class="row" style="gap:22px;flex-wrap:wrap">
        <div><div class="tiny">Revenue goal</div><div style="font-size:19px;font-weight:650">${g.sales != null ? fmtMoney(g.sales, cur) : ' - '}</div></div>
        <div><div class="tiny">Ad spend</div><div style="font-size:19px;font-weight:650">${g.spend != null ? fmtMoney(g.spend, cur) : ' - '}</div></div>
        <div><div class="tiny">Margin basis</div><div style="font-size:19px;font-weight:650">${d.margin_pct != null ? Math.round(d.margin_pct * 100) + '%' : d.margin_28d != null ? Math.round(d.margin_28d * 100) + '%' : ' - '}</div><div class="tiny">${d.margin_pct != null ? 'flat override, set on Costs' : 'their real costs'}</div></div>
        <span style="flex:1"></span>
        <button class="btn" id="gToPlan">Open the Plan tab</button>
        <span class="tiny" id="gMsg"></span>
      </div>
      <div class="row" style="margin-top:12px">
        <div class="toggle ${d.brief_enabled ? 'on' : ''}" id="bfAuto"></div>
        <span style="font-size:13.5px">Run the brief every morning<span id="bfTimeLbl"></span>, covering yesterday. Change the time on <b>Settings</b>.</span>
      </div>
      ${internalOnly ? `<div class="row" style="margin-top:8px;align-items:flex-start">
        <span style="font-size:13.5px;max-width:660px">
          <b>Internal only, handled automatically.</b> ${esc(acct?.name || 'This brand')} has no client channel, so each morning's brief posts to your
          <b>internal channel</b>${acct?.slack_channel ? '' : ' (<b>none set</b>, pick one in Settings)'} and is marked handled on the spot. There is nothing to review or send, and days never stack up waiting.
          <span class="tiny" style="display:block;margin-top:3px">If this brand should ever receive a brief, set a <b>client channel</b> in Settings and the review-and-send flow switches on.</span>
        </span>
      </div>` : `<div class="row" style="margin-top:8px;align-items:flex-start">
        <div class="toggle ${acct?.review_first ? 'on' : ''}" id="bfReview"></div>
        <span style="font-size:13.5px;max-width:660px">
          <b>Review before it goes to the client.</b> On: each morning the brief is drafted and posted to this brand's
          <b>internal channel</b>${acct?.slack_channel ? '' : ' (<b>none set</b>, pick one in Settings)'}: you read it, reword anything, then press
          <b>Send to client</b> at the top. Off: it posts straight to the client channel with no stop.
          <span class="tiny" style="display:block;margin-top:3px">This switch is per client and covers the weekly and monthly reports too.</span>
        </span>
      </div>`}</div></details>`;

  $('#main').innerHTML = shell(`
    ${LX.say(say)}
    ${headHtml}
    ${statusHtml}
    ${briefCard}
    <div class="v2h" style="margin:6px 0 -6px"><h3>The numbers behind it</h3><span class="find">${esc(dayLbl)} against the day's plan; the line under each figure is the month so far.</span></div>
    ${numsHtml}
    ${chartCard}
    ${histFold}
    ${planFold}
  `);

  /* chart: hover AND tap, through the shared v2 tooltip */
  if (document.getElementById('bfSvg')) U.wireLine('bfSvg', cum, { tip: r => `<b>${U.day(r.date)}</b> · actual so far ${r.v != null ? fmtK(r.v, cur) : '–'}<br><span class="faint">plan so far ${r.plan != null ? fmtK(r.plan, cur) : '–'}</span>${r.a?.sales != null ? `<br>that day ${fmtK(r.a.sales, cur)} against ${r.f.sales != null ? fmtK(r.f.sales, cur) : '–'} planned` : ''}` });

  $('#bfDate').onchange = e => { BF.date = e.target.value || null; renderBrief(); };
  $('#bfTwSync').onclick = async () => {
    const b = $('#bfTwSync'); b.disabled = true; $('#bfTwMsg').textContent = 'Pulling 70 days from Triple Whale…';
    try { const r = await api('/api/tw-sync?act=' + S.act + '&days=70', { method: 'POST' }); const x = r.results[0]; $('#bfTwMsg').textContent = x.ok ? `✓ ${x.metrics} metrics, ${x.from} → ${x.to}` : (x.error || x.skipped); if (x.ok) return renderBrief(); }
    catch (e) { $('#bfTwMsg').textContent = e.message; }
    b.disabled = false;
  };
  briefTimeLabel();

  const toPlan = $('#gToPlan');
  const openPlan = () => { PL.month = d.month; PL.auto = false; PL.sales = null; PL.spend = null; PL.mer = null; PL.act = null; show('plan'); };
  if (toPlan) toPlan.onclick = openPlan;
  const toPlan2 = $('#bfToPlan2');
  if (toPlan2) toPlan2.onclick = openPlan;
  const toHealth = $('#bfToHealth');
  if (toHealth) toHealth.onclick = () => show('health');
  $('#bfAuto').onclick = async e => {
    const on = !e.target.classList.contains('on');
    if (on && !d.goals) { $('#gMsg').textContent = 'Set goals first - auto-post needs a plan to compare against.'; return; }
    if (on && !(acct?.brief_channel || acct?.slack_channel)) { $('#gMsg').textContent = 'Pick this brand’s Daily Brief channel on the Settings tab first.'; return; }
    e.target.classList.toggle('on', on);
    try {
      await api('/api/client-settings', { method: 'PUT', body: JSON.stringify({ act: S.act, brief_enabled: on }) });
      if (acct) acct.brief_enabled = on;
      const al = $('#bfAutoLbl'); if (al) al.textContent = on ? 'on' : 'off';
      refreshAccounts();                    // keep the Settings tab in step
    } catch (err) { noteModal('Could not save', `<p>${esc(err.message)}</p>`); e.target.classList.toggle('on', !on); }
  };
  // The textarea is the source of truth while editing; otherwise the saved draft is.
  const bfBody = () => $('#bfEdit') ? $('#bfEdit').value : (bfDraft?.text ?? bfSent?.text ?? '');
  const bfEditBtn = $('#bfEditBtn');
  const bfShowEdit = on => {
    const pv = $('#bfPreview'), ta = $('#bfEdit'), hint = $('#bfEditHint');
    if (pv) pv.style.display = on ? 'none' : '';
    if (ta) ta.style.display = on ? '' : 'none';
    if (hint) hint.style.display = on ? '' : 'none';
    if (bfEditBtn) bfEditBtn.style.display = on ? 'none' : '';
    const sv = $('#bfSave'), cx = $('#bfCancel');
    if (sv) sv.style.display = on ? '' : 'none';
    if (cx) cx.style.display = on ? '' : 'none';
    if (on && ta) ta.focus();
  };
  if (bfEditBtn) bfEditBtn.onclick = () => bfShowEdit(true);
  const bfCancel = $('#bfCancel');
  if (bfCancel) bfCancel.onclick = () => { if ($('#bfEdit')) $('#bfEdit').value = bfDraft?.text || ''; bfShowEdit(false); $('#bfMsg').textContent = ''; };
  // The buyer's note: loads quietly, saves on the button (and Cmd/Ctrl+Enter).
  const bfNote = $('#bfNote');
  if (bfNote) {
    api('/api/brief-note?act=' + encodeURIComponent(S.act)).then(r => {
      if (r?.note?.text && !bfNote.value) { bfNote.value = r.note.text; $('#bfNoteMsg').textContent = 'Saved ' + fmtAgo(r.note.at); }
    }).catch(() => {});
    const save = async () => {
      $('#bfNoteMsg').textContent = 'Saving…';
      try {
        await api('/api/brief-note', { method: 'PUT', body: JSON.stringify({ act: S.act, text: bfNote.value }) });
        $('#bfNoteMsg').textContent = bfNote.value.trim() ? 'Saved. Rewrite the brief to use it.' : 'Cleared.';
      } catch (e) { $('#bfNoteMsg').textContent = 'Could not save: ' + e.message; }
    };
    $('#bfNoteSave').onclick = save;
    bfNote.onkeydown = e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); save(); } };
  }
  const bfWrite = $('#bfWrite');
  if (bfWrite) bfWrite.onclick = async () => {
    /* A first write needs no dialog. A REWRITE is the one that throws wording
       away, so that is where the steer box lives - the same box as the Slack
       card's Rewrite button. null = cancelled; '' = go ahead, no direction. */
    let steer = '';
    if (bfDraft) {
      steer = await steerModal({ title: 'Rewrite this draft?', what: `the brief for ${d.date}`, current: bfDraft.steer || '' });
      if (steer === null) return;
    }
    bfWrite.disabled = true;
    $('#bfMsg').textContent = steer ? 'Claude is rewriting to your direction… (~20s)' : 'Claude is writing… (~20s)';
    try {
      // Draft it properly (stored, editable, sendable) rather than a throwaway preview.
      const r = await api('/api/brief-draft', { method: 'POST', body: JSON.stringify({ act: S.act, date: d.date, ...(steer ? { steer } : {}) }) });
      $('#bfMsg').textContent = r.narrative_error ? `numbers only - narrative failed: ${r.narrative_error}` : '';
      await inPlace(() => renderBrief());
      return;
    } catch (e) { $('#bfMsg').textContent = e.message; }
    bfWrite.disabled = false;
  };
  const bfSave = $('#bfSave');
  if (bfSave) bfSave.onclick = async () => {
    $('#bfMsg').textContent = 'Saving…';
    try {
      const next = bfBody();
      await api('/api/brief-text', { method: 'PUT', body: JSON.stringify({ act: S.act, date: d.date, text: next }) });
      if (bfDraft) bfDraft.text = next;
      // Re-render the preview so you immediately see it as Slack will.
      const pv = $('#bfPreview');
      if (pv) pv.innerHTML = slackPreview(next);
      bfShowEdit(false);
      $('#bfMsg').textContent = 'Saved ✓ - this is exactly what will send';
    } catch (e) { $('#bfMsg').textContent = e.message; }
  };
  $('#bfPost').onclick = async () => {
    const dest = acct?.brief_channel;
    if (!dest) return noteModal('Nothing to send to', `<p>${esc(acct?.name || 'This brand')} has no external client channel, so nothing was sent.</p><p class="tiny">If it should have one, set the <b>client channel</b> in Settings. A send never falls back to your internal channel.</p>`);
    const name = await channelName(dest);
    // Save any unsaved edit first, so what you are looking at is what goes out.
    if ($('#bfEdit')) {
      try { await api('/api/brief-text', { method: 'PUT', body: JSON.stringify({ act: S.act, date: d.date, text: bfBody() }) }); } catch { /* fall through - send still uses the stored text */ }
    }
    const ok = await confirmModal('Send this brief to the client?',
      `This posts the brief for ${d.date} to ${name}, exactly as written above. Everyone in that channel sees it.`, `Post to ${name}`);
    if (!ok) return;
    $('#bfMsg').textContent = 'Sending…';
    try {
      const r = await api('/api/brief-send', { method: 'POST', body: JSON.stringify({ act: S.act, date: d.date }) });
      $('#bfMsg').textContent = `Sent ✓ to ${r.channel}`;
      await inPlace(() => renderBrief());
    } catch (e) { $('#bfMsg').textContent = e.message; }
  };
  $('#bfCopy').onclick = () => { navigator.clipboard.writeText(bfBody()).then(() => $('#bfMsg').textContent = 'Copied ✓'); };
  /* "Don't send this one." The catch-up that covers a morning you forget is the
     same mechanism that stacks days up when you deliberately don't send - this
     is how you tell the two apart. */
  const bfSkip = $('#bfSkip');
  if (bfSkip) bfSkip.onclick = async () => {
    const covered = (bfDraft?.text || '').match(/covering ([^\n→]+)/i);
    if (!(await confirmModal(`Don't send the brief for ${d.date}?`,
      `<p>This marks the day <b>handled</b> without messaging the client. Nothing is sent, and it stops being carried into later briefs${covered ? ` - this draft currently covers <b>${esc(covered[1].trim())}</b>` : ''}.</p>
       <p class="tiny">The numbers are not lost: this day still counts everywhere on Profit, Plan and the chart on this page. You are only saying the client does not need a message about it.</p>
       <p class="tiny">Changed your mind later? Press <b>Write the brief</b> on this date and it drafts again.</p>`,
      'Don\'t send it'))) return;
    $('#bfMsg').textContent = 'Skipping…';
    try {
      await api('/api/brief-skip', { method: 'POST', body: JSON.stringify({ act: S.act, date: d.date }) });
      $('#bfMsg').textContent = 'Skipped ✓ - tomorrow starts fresh';
      await inPlace(() => renderBrief());
    } catch (e) { $('#bfMsg').textContent = e.message; }
  };
  const bfRev = $('#bfReview');
  if (bfRev) bfRev.onclick = async () => {
    const on = !bfRev.classList.contains('on');
    bfRev.classList.toggle('on', on);
    try {
      await api('/api/client-settings', { method: 'PUT', body: JSON.stringify({ act: S.act, review_first: on }) });
      if (acct) acct.review_first = on;
      const rl = $('#bfReviewLbl'); if (rl) rl.textContent = on ? 'on' : 'off';
      refreshAccounts();
      $('#gMsg').textContent = on ? 'Drafts will wait for you each morning.' : 'Briefs will post straight to the client.';
    } catch (e) { bfRev.classList.toggle('on', !on); noteModal('Could not save', `<p>${esc(e.message)}</p>`); }
  };
}
/* Slack mrkdwn -> HTML. Slack's own flavour, NOT markdown: bold is *one
   asterisk*, italic _underscores_, links <url|label>. Escaped first, so
   everything below operates on already-safe text. */
const SLACK_EMOJI = {
  wave:'\u{1F44B}', memo:'\u{1F4DD}', bar_chart:'\u{1F4CA}', clipboard:'\u{1F4CB}',
  warning:'\u26A0\uFE0F', rotating_light:'\u{1F6A8}', white_check_mark:'\u2705', x:'\u274C',
  chart_with_upwards_trend:'\u{1F4C8}', chart_with_downwards_trend:'\u{1F4C9}',
  rocket:'\u{1F680}', tada:'\u{1F389}', fire:'\u{1F525}', eyes:'\u{1F440}',
  moneybag:'\u{1F4B0}', money_with_wings:'\u{1F4B8}', dart:'\u{1F3AF}', trophy:'\u{1F3C6}',
  green_circle:'\u{1F7E2}', red_circle:'\u{1F534}', large_yellow_circle:'\u{1F7E1}',
  arrow_up:'\u2B06\uFE0F', arrow_down:'\u2B07\uFE0F', point_right:'\u{1F449}',
  bulb:'\u{1F4A1}', pushpin:'\u{1F4CC}', calendar:'\u{1F4C5}', hourglass:'\u23F3',
  raised_hands:'\u{1F64C}', muscle:'\u{1F4AA}', thinking_face:'\u{1F914}', pray:'\u{1F64F}',
  star:'\u2B50', sparkles:'\u2728', zap:'\u26A1', stopwatch:'\u23F1\uFE0F',
};
function slackToHtml(src) {
  let t = esc(String(src || ''));
  t = t.replace(/&lt;(https?:\/\/[^|&\s]+)\|([^&]*?)&gt;/g,
    (m, u, l) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${l}</a>`);
  t = t.replace(/&lt;(https?:\/\/[^|&\s]+)&gt;/g,
    (m, u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
  t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  t = t.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s.,:;!?)]|$)/gm, '$1<b>$2</b>');
  t = t.replace(/(^|[\s(])_([^_\n]+)_(?=[\s.,:;!?)]|$)/gm, '$1<i>$2</i>');
  t = t.replace(/(^|[\s(])~([^~\n]+)~(?=[\s.,:;!?)]|$)/gm, '$1<s>$2</s>');
  t = t.replace(/:([a-z0-9_+-]+):/gi, (m, n) => SLACK_EMOJI[n.toLowerCase()] || m);
  return t;
}
/** The message in its Slack clothes, so what you approve is what they receive. */
function slackPreview(text, opts = {}) {
  return `<div class="slackmsg"><div class="sm-hdr">
      <span class="sm-av">${esc(opts.icon || '\u{1F44B}')}</span>
      <span class="sm-who">${esc(opts.who || 'Daily Update')}</span>
      <span class="sm-tag">app</span>
      <span class="sm-when">${esc(opts.when || 'this is how it will look in Slack')}</span>
    </div>${slackToHtml(text)}</div>`;
}

const addDaysStr = (ymd, n) => { const dt = new Date(ymd + 'T12:00:00Z'); dt.setUTCDate(dt.getUTCDate() + n); return dt.toISOString().slice(0, 10); };

/* ---------- Weekly / Monthly Reports ----------
   Frozen snapshots, drafted by the cron (Monday = last Mon–Sun, the 1st = last
   month), reviewed here, sent to the client's Slack with a button. The client
   reads the same page through ?reports=<token> - sent reports only. The engine
   lives on the account-health worker; these endpoints are proxied. */
// `act` records which client the selection belongs to (same trap as PL).
const RP = { act: null, period: null, start: null };
// The client archive link has no session, so its token IS the credential for
// playback. Null on every internal view, which is what selects session auth.
const RS = { token: null };
const shortD = ymd => `${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+ymd.slice(5, 7) - 1]} ${+ymd.slice(8, 10)}`;
/** Change-log categories are stored as snake_case ids; a raw CAMPAIGN_RELAUNCHED
 *  both reads like a database dump and overflows its column. `n` pluralises the
 *  rollup counts ("14 new ads"). */
const CAT_LABELS = {
  budget: ['budget change', 'budget changes'], bid_strategy: ['bid change', 'bid changes'],
  new_campaign: ['new campaign', 'new campaigns'], new_adset: ['new ad set', 'new ad sets'],
  campaign_paused: ['campaign paused', 'campaigns paused'],
  campaign_relaunched: ['campaign relaunched', 'campaigns relaunched'],
  new_creative: ['new ad', 'new ads'], ad_paused: ['ad paused', 'ads paused'],
  ad_relaunched: ['ad relaunched', 'ads relaunched'],
  targeting: ['targeting change', 'targeting changes'],
  optimisation: ['optimisation change', 'optimisation changes'],
  schedule: ['schedule change', 'schedule changes'],
  billing: ['billing event', 'billing events'], review: ['policy review', 'policy reviews'],
};
const catLabel = (c, n) => {
  const e = CAT_LABELS[c];
  if (!e) return String(c).replace(/_/g, ' ');
  return n == null ? e[0] : (n === 1 ? e[0] : e[1]);
};
const repRangeLabel = r => r.period === 'monthly' ? monthLabel(r.start.slice(0, 7)) : `${shortD(r.start)} – ${shortD(r.end)}, ${r.end.slice(0, 4)}`;

/** The report page itself. Shared verbatim between the internal tab and the
 *  client link, so what you review is exactly what they open - the only
 *  differences are the edit button and the internal-only change log. */
/* ONE ATTRIBUTION CONTROL FOR THE WHOLE PAGE.
   Cole, 2026-09-07: "it's not on both, it's just something that needs to be
   applied - I can apply it to the overall page, what attribution I'm using."
   So this is a page-level switch, not a per-section one.

   The labels are ours; the keys are Triple Whale's model names. `platform` is
   the odd one out and is deliberately first-class rather than hidden: it means
   "use each platform's own reported figure", which is what every report before
   today showed and what Ads Manager will agree with.

   firstClick and lastClick are NOT here. We request all seven models from
   Triple Whale and those two come back empty on every one of these six shops,
   measured across 120 days - so fullFirstClick and fullLastClick ARE first and
   last click as far as this data is concerned. Offering the empty pair would be
   offering a control that silently blanks the page.
   There is also no view-through option: Triple Whale exposes no view-through
   model on this endpoint at all. */
const ATTR_MODELS = [
  ['platform',          'Platform reported',   'Each platform’s own attributed figure, the way Meta and Google report it in their own dashboards. This is what the report showed before attribution became switchable.'],
  ['lastPlatformClick', 'Triple Whale default','Triple Whale’s own default. Each platform is credited the whole order when it was the last click on that platform, which is what Triple Whale’s interface shows.'],
  ['fullFirstClick',    'First click',         'The whole order goes to the first paid click in the journey. Flatters whatever introduces a customer.'],
  ['fullLastClick',     'Last click',          'The whole order goes to the last paid click. Flatters whatever closes.'],
  ['linear',            'Linear',              'The order is split evenly across every paid touch in the journey, so the platforms sum to the order rather than double-counting.'],
  ['linearAll',         'Linear, all touches', 'As Linear, but every touch counts including the non-paid ones, so paid channels take a smaller share each.'],
];
const ATTR_LABEL = k => (ATTR_MODELS.find(m => m[0] === k) || [null, k])[1];
/* THE CHOICE IS STORED ON THE BRAND, SERVER SIDE, not in this browser.
   `reportBodyHTML` renders both the internal page and the client's archive link,
   and the standing rule is that what you review is exactly what the client
   opens. A model kept in localStorage would break that the moment it mattered:
   Cole would review a report on Triple Whale attribution, hit Send, and the
   client would open the same report showing Meta's figures instead.
   So it rides in `accounts.report_config_json.attr` beside the channel
   toggles - one value per brand, which is right anyway, since a model that
   suits one account's journey length misreads another's. */
// Triple Whale is the default for attribution, always (Cole, 2026-09-18).
const attrOf = cfg => (cfg && cfg.attr && cfg.attr !== 'platform' && cfg.attr) || 'lastPlatformClick';

function reportBodyHTML(d, summary, opts = {}) {
  const cur = d.account?.currency || opts.currency || 'USD';
  const t = d.totals || {}, p = d.previous || {}, f = d.forecast || {};
  const prevTag = d.period === 'weekly' ? 'week' : 'month';

  /* WHICH MODEL THIS RENDER IS ON. `opts.attr` is what the control is set to;
     it falls back to platform-reported, which is what every frozen report
     generated before today can show. A report whose snapshot predates the
     attribution payload has `d.attr == null` and simply never offers the
     control - it cannot answer the question, and inventing an answer from
     today's data would change numbers a client has already been sent. */
  const A = d.attr || null;
  const attrModel = A && opts.attr && opts.attr !== 'platform' && A.models.includes(opts.attr)
    ? opts.attr : 'platform';
  const attrOn = attrModel !== 'platform';
  // Attributed revenue/orders for one channel under the chosen model. A model
  // that credited a channel nothing returns a REAL zero, never null.
  const attrCh = id => attrOn ? (A.channels?.[attrModel]?.[id] || { revenue: 0, orders: 0 }) : null;
  const attrAd = id => attrOn ? (A.ads?.[attrModel]?.[id] || { revenue: 0, orders: 0 }) : null;

  /* `lower` says which direction is GOOD: false = higher is better, true = lower
     is better, and 'neutral' = neither, so the number is shown with no verdict
     colour at all.
     'neutral' exists for AD SPEND. Cole, 2026-09-07: "I don't think they should
     have red or green when it comes to ad spend because you can't really tell if
     something is good or bad when ad spend increases or decreases." He is right
     and it was worse than cosmetic - spend was treated as lower-is-better, so a
     week we deliberately scaled went out to the client in RED, and a week we
     underspent (which is exactly why Grunk is 51% behind plan) went out in
     GREEN. The colour was actively arguing the opposite of the summary next to
     it. Spend is an input we chose; only the return on it can be good or bad. */
  const vsPill = (a, b, lower) => {
    if (a == null || b == null || !b) return '';
    const off = a / b - 1;
    if (!isFinite(off)) return '';
    // Round FIRST, then sign - fmtSigned on a hair-under-parity value renders "-0%".
    const r = Math.round(off * 100);
    const sign = `${r > 0 ? '+' : ''}${r}%`;
    if (lower === 'neutral') return `<span class="pill unk">${sign}</span>`;
    const good = lower ? off <= 0.05 : off >= -0.02;
    const cls = good ? 'good' : Math.abs(off) <= 0.12 ? 'warn' : 'bad';
    return `<span class="pill ${cls}">${sign}</span>`;
  };
  /* v2 tiles (2026-10-08): the figure, a chip against the prior period, the forecast line
     under it, and the period's daily line where the report carries one. Same tiles on the
     internal page and the client's archive, because this function draws both. */
  const days = (d.chart || []).filter(r => r.date);
  const sparkOf = (get, fmt) => days.length > 1 ? LX.spark(days.map(get), days.map(r => `<b>${window.V2UI.day(r.date)}</b> · ${get(r) == null ? '–' : fmt(get(r))}`)) : '';
  const SPARK = { Revenue: r => r.sales ?? null, 'Ad spend': r => r.spend ?? null, MER: r => r.spend ? (r.sales || 0) / r.spend : null };
  const kpi = (label, aV, fmt, fV, pV, lower, info) => LX.tile({ compact: true, label, info, value: fmt(aV),
    delta: pV != null ? LX.chip(aV, pV, lower === 'neutral' ? 'n' : lower, `Against the prior ${prevTag}: ${fmt(pV)}`) : '',
    sub: [fV != null ? `forecast ${fmt(fV)} ${vsPill(aV, fV, lower)}` : '', pV != null ? `prior ${prevTag} ${fmt(pV)}` : ''].filter(Boolean).join('<br>'),
    spark: SPARK[label] ? sparkOf(SPARK[label], fmt) : '' });
  /* "no forecast" USED TO PRINT HERE on Orders, AOV and New-customer CPA, and it
     read as a fault in the data. It is not: the monthly Plan sets revenue and
     spend (plus an aMER assumption), and nothing else, so those three genuinely
     have no agreed target to be measured against. Inventing one - orders from
     revenue ÷ trailing AOV, say - would put a number in front of a client that
     nobody ever agreed to, which is the one thing this report must not do.
     So the line is simply absent, and the prior-period comparison underneath it
     carries the card. If we ever want these forecast for real, they belong in
     the Plan tab first. (Cole, 2026-09-07.) */
  const money = n => fmtMoney(n, cur);

  /* THE SUMMARY IS STRUCTURE, NOT A PRE-FORMATTED BLOB.
     It used to render with `white-space:pre-wrap`, so every blank line Claude
     wrote between bullets became a full empty line on the page - at line-height
     1.65 that is ~23px of nothing between one-line bullets, which is what made
     the card read as enormous (Cole, 2026-09-07: "the spacing between bullet
     points is huge").
     It also matched the section titles with `.includes()` AFTER the text had
     been through `esc()` - so "What's next" had already become "What&#39;s next"
     and could never match, which is why that one heading alone rendered
     unbolded while the other two bolded fine. Match the RAW line, escape after.
     Parsing into real headings and a real <ul> lets CSS own the rhythm. */
  /* BOTH GENERATIONS OF HEADING. The sections were renamed on 2026-09-07 to say
     what each one does (see REPORT_SYSTEM), but every report already generated
     is a FROZEN snapshot carrying the old three, and a sent report can never be
     regenerated. Dropping the old names would silently un-bold the headings on
     every report in the client archive. */
  const SUM_HEADS = ['What we saw', 'What it means', "What we're doing",
    'The period in brief', 'What mattered', "What's next"];
  const sumFmt = s => {
    const out = [];
    let items = null;
    const flush = () => { if (items) { out.push(`<ul class="rp-sum-ul">${items.join('')}</ul>`); items = null; } };
    for (const raw of String(s).split('\n')) {
      const l = raw.trim();
      if (!l) continue;                                    // blank lines carry no meaning here
      if (SUM_HEADS.includes(l)) { flush(); out.push(`<h5 class="rp-sum-h">${esc(l)}</h5>`); continue; }
      const b = /^[•–*-]\s+(.*)$/.exec(l);        // a bullet, however it was typed
      if (b) { (items ??= []).push(`<li>${esc(b[1])}</li>`); continue; }
      flush(); out.push(`<p class="rp-sum-p">${esc(l)}</p>`);
    }
    flush();
    return out.join('');
  };
  const sumHtml = summary ? `<div class="card rp-sumcard">
      <div class="lx-bar" style="margin-bottom:8px"><h3 style="margin:0">Summary</h3><span class="sp"></span>${opts.editable ? '<button class="btn quiet" id="rpEditSum" style="font-size:12px;padding:5px 9px">✎ Edit</button>' : ''}</div>
      <div id="rpSumBox" class="rp-sum">${sumFmt(summary)}</div></div>`
    : opts.editable ? `<div class="card rp-sumcard" style="border-left-color:var(--warn)"><h3 style="margin-bottom:4px">Summary</h3>
      <p class="hint">No narrative was written (the Claude call failed at generation time). Press <b>Rewrite with AI</b> at the top to retry.</p></div>` : '';

  const kpis = [
    kpi('Revenue', t.sales, money, f.sales, p.sales, false, 'Shopify Total Sales minus sales tax - every channel (paid, organic, email, direct), after discounts and returns, including shipping charged to customers. Not any ad platform’s attributed number.'),
    kpi('Ad spend', t.spend, money, f.spend, p.spend, 'neutral', 'Every platform combined - Meta, Google and anything else Triple Whale tracks. Shown without a good/bad colour on purpose: spend is a decision, not a result - whether it was the right amount is what MER, aMER and CPA answer.'),
    kpi('MER', t.mer, fmtX, f.mer, p.mer, false, 'All store revenue ÷ all ad spend, blended on both sides. The honest “are the ads paying for themselves” number - the same thing as blended ROAS.'),
    kpi('aMER', t.amer, fmtX, f.amer, p.amer, false, 'New-customer revenue ÷ that same total ad spend. Repeat buyers and email can’t flatter it - this is what the ads actually bought.'),
    t.cm != null ? kpi('Contribution margin', t.cm, money, f.cm, p.cm, false, 'Revenue minus every variable cost - product, fulfilment, handling, payment fees and ad spend. Excludes fixed costs like rent, salaries and software.') : '',
    kpi('New-customer CPA', t.ncpa, money, null, p.ncpa, true, 'Total ad spend ÷ new customers acquired. Blended - not any platform’s self-reported CPA.'),
    kpi('Orders', t.orders, fmtInt, null, p.orders, false, 'Total store orders in the period.'),
    kpi('Average order value', t.aov, money, null, p.aov, false, 'Revenue ÷ orders.'),
  ].join('');

  const pc = d.pacing;
  const pacingHtml = pc && pc.goal_sales ? (() => {
    const done = Math.min(1.2, (pc.mtd_sales ?? 0) / pc.goal_sales);
    const expected = Math.min(1, (pc.plan_to_date ?? 0) / pc.goal_sales);
    const off = pc.plan_to_date ? (pc.mtd_sales / pc.plan_to_date - 1) : null;
    // Round before signing, and state the gap in MONEY as well as a percentage - 
    // "behind by 11%" is an abstraction; "$9,346 short" is the conversation.
    const offPct = off == null ? null : Math.round(Math.abs(off) * 100);
    const endGap = pc.projected != null ? pc.projected - pc.goal_sales : null;
    const behindNow = pc.plan_to_date != null ? pc.mtd_sales - pc.plan_to_date : null;
    return `<div class="card"><h3 style="margin-bottom:2px">Where ${esc(monthLabel(pc.month))} stands</h3>
      <p class="hint" style="margin-bottom:6px">${pc.days_elapsed} of ${pc.days_in_month} days in. The bar is revenue booked so far; the marker on it is where the month was forecast to be by today.</p>
      <div class="pace-bar"><div class="fill" style="width:${(Math.min(1, done) * 100).toFixed(1)}%"></div><div class="mark" style="left:${(expected * 100).toFixed(1)}%"></div></div>
      <div class="pc-stats">
        <div class="st"><b>${money(pc.mtd_sales)}</b><span>Revenue so far</span></div>
        <div class="st"><b>${money(pc.plan_to_date)}</b><span>Forecast by today</span></div>
        <div class="st"><b>${money(pc.projected)}</b><span>On pace to finish</span></div>
        <div class="st"><b>${money(pc.goal_sales)}</b><span>Month target</span></div>
      </div>
      ${offPct != null ? `<p style="font-size:13.5px;margin-top:10px">${off >= -0.02
        ? `<b>Ahead of forecast</b> - ${money(pc.mtd_sales)} booked against ${money(pc.plan_to_date)} forecast by today${behindNow > 0 ? `, ${money(behindNow)} to the good` : ''}.`
        : `<b>Behind forecast by ${offPct}%</b> - ${money(pc.mtd_sales)} booked against ${money(pc.plan_to_date)} forecast by today, a shortfall of ${money(Math.abs(behindNow))}.`}${
        endGap != null ? ` At this pace ${esc(monthLabel(pc.month))} finishes around <b>${money(pc.projected)}</b>, ${endGap >= 0 ? `${money(endGap)} above` : `${money(Math.abs(endGap))} short of`} the ${money(pc.goal_sales)} target.` : ''}</p>` : ''}
      ${catchUpLine(pc, money)}
    </div>`;
  })() : '';

  const chartId = opts.internal ? 'rpSvg' : 'rsSvg';
  const chartHtml = (d.chart || []).length > 1 ? `<div class="card"><div class="v2h"><h3>Day by day</h3><span class="find">Revenue from every channel against ad spend on every platform. The gap is what was left after advertising, before product costs, fulfilment and fees. Hover any day.</span></div>
    ${LX.dual(chartId, d.chart, cur, { h: 220 })}</div>` : '';

  const splitHtml = t.new_rev != null ? `<div class="card"><h3 style="margin-bottom:6px">New customers vs returning</h3>
    <p style="font-size:14px;margin:4px 0"><b>${money(t.new_rev)}</b> came from first-time buyers (<b>${fmtPct(t.new_share)}</b> of revenue) and <b>${money(t.ret_rev)}</b> from customers coming back${p.new_share != null ? ` - the ${prevTag} before, new customers were ${fmtPct(p.new_share)}` : ''}.</p>
    <div class="v2stackbar" style="margin-top:10px"><i style="flex:${Math.max(0, t.new_share || 0)};background:var(--brand)"${window.V2UI.tipAttr(`First-time buyers: ${money(t.new_rev)}`)}></i><i style="flex:${Math.max(0, 1 - (t.new_share || 0))};background:var(--c-email)"${window.V2UI.tipAttr(`Returning customers: ${money(t.ret_rev)}`)}></i></div>
    <div class="v2stacklab"><span><i style="background:var(--brand)"></i>New ${money(t.new_rev)}</span><span><i style="background:var(--c-email)"></i>Returning ${money(t.ret_rev)}</span></div></div>` : '';

  // Creative sits INSIDE its platform's section, so everything about one channel
  // reads as one story. Meta is the only channel with ad-level data today; the
  // block is written to drop under any channel that gains it.
  const adsBlock = () => {
    const A = d.ads;
    if (!A?.top?.length) return '';
    const o = A.others;
    // Judge against THIS account's own median where there is enough data to
    // compute one, because "better than our normal" is the decision a buyer
    // actually makes; fall back to Motion's published benchmark otherwise, and
    // say which bar is being used either way.
    const BM = A.benchmarks;
    const rate = (v, ok, strong, own) => {
      if (v == null) return null;
      if (own != null) {
        const r = v / own;
        return { pct: fmtPct(v), bar: fmtPct(own), own: true,
          tag: r >= 1.15 ? 'above' : r <= 0.85 ? 'below' : 'typical' };
      }
      return { pct: fmtPct(v), bar: fmtPct(strong), own: false,
        tag: v >= strong ? 'strong' : v >= ok ? 'average' : 'low' };
    };
    // A delta only earns its place when there is a real prior figure to compare
    // with; a brand-new ad gets nothing rather than a misleading +100%.
    const dlt = (now, then, lower) => {
      if (now == null || then == null || !then) return '';
      const off = Math.round((now / then - 1) * 100);
      if (off === 0) return '';
      const sign = `${off > 0 ? '+' : ''}${off}%`;
      // Same rule as the scorecard: spend moving is a decision we made, so it is
      // reported without a verdict colour. ROAS and CPA moving are results.
      if (lower === 'neutral') return ` <span class="dlt flat">${sign}</span>`;
      const good = lower ? off < 0 : off > 0;
      return ` <span class="dlt ${good ? 'up' : 'dn'}">${sign}</span>`;
    };
    // label … value delta - the value is what you scan down the column, the
    // change qualifies it, so the change reads after it.
    const row = (label, val, extra, before) => `<div class="ad-row"><span>${label}</span>${before || ''}<b>${val}</b>${extra || ''}</div>`;
    // A verdict WORD, not a bar. The bar was scaled against the benchmark, which
    // meant nothing without knowing the benchmark - Cole read it as "out of 100"
    // and could not tell good from bad. The word says which it is; the colour
    // only reinforces it.
    const GOOD = new Set(['strong', 'above']), OK = new Set(['average', 'typical']);
    const verdict = r => !r ? '' : `<span class="vtag ${GOOD.has(r.tag) ? 'good' : OK.has(r.tag) ? 'ok' : 'bad'}">${r.tag}</span>`;
    const card = (a0, i) => {
      /* Same rule as the channel table: the attributed half follows the page's
         model, the delivery half stays Meta's. An ad the model credited nothing
         shows a real 0, never Meta's number - substituting would let an
         unattributed ad climb a CPA sort on borrowed figures. */
      const sw = attrAd(a0.ad_id);
      const a = sw
        ? { ...a0, revenue: sw.revenue, purchases: sw.orders ? Math.round(sw.orders) : 0,
            roas: a0.spend ? sw.revenue / a0.spend : null,
            cpa: sw.orders ? a0.spend / sw.orders : null,
            // The prior-period deltas were computed from Meta's figures, so they
            // would silently compare a TW number against a Meta one.
            prev_roas: null, prev_cpa: null }
        : a0;
      const hook = rate(a.hook, 0.20, 0.30, BM?.hook), hold = rate(a.hold, 0.40, 0.60, BM?.hold);
      const media = a.thumb
        ? `<img src="${a.thumb}" alt="Creative for ${esc(a.name)}">`
        : `<span aria-hidden="true">${a.video ? '&#9654;' : '&#9633;'}</span>`;
      // Play ONLY on a real video, and only when we have the ad id needed to
      // resolve its mp4. Reports frozen before that field existed keep the
      // cover image and the link out, which is the honest degradation.
      const canPlay = a.video && a.ad_id;
      return `<article class="ad-card" data-ad="${i}">
        <div class="ad-media${a.thumb ? '' : ' none'}"${canPlay ? ` data-ad="${esc(a.ad_id)}"` : ''}${canPlay && a.preview ? ` data-preview="${esc(a.preview)}"` : ''}>
          ${media}<span class="ad-rank">${i + 1}</span>
          <span class="ad-type">${a.video ? 'Video' : 'Image'}</span>
          ${a.duration ? `<span class="ad-dur">${Math.round(a.duration)}s</span>` : ''}
          ${canPlay ? `<button class="ad-play" type="button" title="Play this video ad"><i>&#9654;</i></button>` : ''}
        </div>
        <div class="ad-body">
          ${a.preview
            ? `<a class="ad-name ad-link" href="${esc(a.preview)}" target="_blank" rel="noopener noreferrer" title="${esc(a.name)}">${esc(a.name)}<span class="ext">↗</span></a>`
            : `<span class="ad-name" title="${esc(a.name)}">${esc(a.name)}</span>`}
          <div class="ad-stats">
            ${row('Spend', money(a.spend), dlt(a.spend, a.prev_spend, 'neutral'))}
            ${row('ROAS', a.roas != null ? fmtX(a.roas) : ' - ', dlt(a.roas, a.prev_roas))}
            ${row('CPA', a.cpa != null ? money(a.cpa) : ' - ', dlt(a.cpa, a.prev_cpa, true))}
            ${row('Purchases', fmtInt(a.purchases))}
            ${a.hook != null ? row(`Hook rate <em class="bm">vs ${hook.bar}${hook.own ? ' here' : ''}</em>`, hook.pct, verdict(hook)) : ''}
            ${a.hold != null ? row(`Hold rate <em class="bm">vs ${hold.bar}${hold.own ? ' here' : ''}</em>`, hold.pct, verdict(hold)) : ''}
          </div>
          ${(() => {
            // The ad's own format tag plus its state - the two things you would
            // otherwise have to open the card to learn.
            const m = /\|([^|]+)$/.exec(a.name || '');
            const tag = m && /[a-z]/i.test(m[1]) ? m[1].trim() : null;
            const chips = [tag ? `<span>${esc(tag)}</span>` : '',
              a.status && a.status !== 'ACTIVE' ? `<span class="grey">${esc(a.status.toLowerCase().replace(/_/g, ' '))}</span>` : ''].filter(Boolean).join('');
            return chips ? `<div class="ad-chips">${chips}</div>` : '';
          })()}
          <div class="ad-open"><span>Details</span><span aria-hidden="true">→</span></div>
        </div></article>`;
    };
    const metricInfo = (attrOn
        ? `Purchases, revenue, CPA and ROAS for this ad come from Triple Whale, using its ${ATTR_LABEL(attrModel)} model, because that is what the control at the top of this page is set to. Spend stays Meta's. `
        : 'Spend, purchases, CPA and ROAS are Meta-reported for this ad. ')
      + 'Hook rate is 3-second video views divided by impressions - did the ad stop the scroll. '
      + 'Hold rate is ThruPlay views divided by 3-second views - of the people it stopped, how many stayed. '
      + 'CTR is link clicks divided by impressions. The words strong, average and low come from Motion’s published benchmarks across many accounts '
      + '(hook 30% and up is strong, under 20% is low; hold 60% and up is strong, under 40% is low), not from this account’s own history. '
      + 'Image ads have no hook or hold rate because there is nothing to watch.';
    // The grid shows the biggest ads; this reconciles them back to every ad that
    // spent, so the section can never read as if it were the whole account.
    const recRow = (label, x, bold) => `<tr${bold ? ' style="border-top:2px solid var(--line-strong)"' : ''}><td>${bold ? `<b>${label}</b>` : label}</td>
      <td class="num"><b>${money(x.spend)}</b></td><td class="num">${fmtPct(x.share)}</td>
      <td class="num">${fmtInt(x.purchases)}</td><td class="num">${x.cpa != null ? money(x.cpa) : ' - '}</td>
      <td class="num">${x.roas != null ? fmtX(x.roas) : ' - '}</td></tr>`;
    /* THE RECONCILIATION TABLE HAS TO MOVE WITH THE CARDS, or the cards show one
       source and the total under them shows another - which is exactly the kind
       of quiet contradiction this table exists to prevent.
       Spend never changes under a model, so that column is untouched. For the
       attributed columns the SHOWN ads sum their own swapped figures, and the
       TAIL is derived as the channel total minus the shown ads. That is exact
       rather than estimated: the shown ads are all Meta ads, so they are a
       subset of the Meta channel total the snapshot already carries, and the
       subtraction cannot go negative. */
    const metaAttr = attrCh('meta');
    const shownTot = A.top.reduce((s, a) => {
      const sw = attrAd(a.ad_id);
      return {
        spend: s.spend + (a.spend || 0),
        purchases: s.purchases + (sw ? sw.orders : (a.purchases || 0)),
        revenue: s.revenue + (sw ? sw.revenue : (a.revenue || 0)),
      };
    }, { spend: 0, purchases: 0, revenue: 0 });
    const others = o && metaAttr
      ? { ...o,
          purchases: Math.max(0, metaAttr.orders - shownTot.purchases),
          revenue: Math.max(0, metaAttr.revenue - shownTot.revenue) }
      : o;
    const tot = {
      spend: shownTot.spend + (others?.spend || 0), purchases: shownTot.purchases + (others?.purchases || 0),
      revenue: shownTot.revenue + (others?.revenue || 0),
    };
    const fin = x => ({ ...x, share: A.total_spend ? x.spend / A.total_spend : null,
      cpa: x.purchases ? x.spend / x.purchases : null, roas: x.spend && x.revenue ? x.revenue / x.spend : null });

    const formats = A.formats?.length ? (() => {
      // `Untagged` can only appear on a report FROZEN before the split moved to
      // Meta's creative type; new ones have no such row. Kept in the filter so
      // an archived report still reads correctly.
      const real = A.formats.filter(f => f.label !== 'Untagged' && f.purchases > 0);
      const best = real.slice().sort((a, b) => (b.roas || 0) - (a.roas || 0));
      const verdict = best.length >= 2 && best[0].roas && best[best.length - 1].roas
        ? `<p style="font-size:13.5px;margin-top:10px"><b>${esc(best[0].label)}</b> returned ${fmtX(best[0].roas)} on ${money(best[0].spend)}, against <b>${fmtX(best[best.length - 1].roas)}</b> from ${esc(best[best.length - 1].label)} on ${money(best[best.length - 1].spend)}.</p>` : '';
      // Old reports carry `formats_tagged_share` (naming convention); new ones
      // carry `formats_confirmed` (Meta's own type). The sentence differs
      // because the two mean genuinely different things.
      const conf = A.formats_confirmed;
      const legacy = conf == null && A.formats_tagged_share != null;
      return `<h4 style="font-size:13.5px;font-weight:700;margin:20px 0 2px">Which kinds of creative the money went to</h4>
        <p class="hint" style="margin-bottom:8px">${legacy
          ? `Split by the format tag in each ad's own name - the part after the last <code>|</code>. Every ad that spent this ${prevTag} is counted, not just the ones shown above. <b>${fmtPct(A.formats_tagged_share)}</b> of ad spend carries a tag; the rest is grouped as Untagged, so the rows still add up to every ad that spent.`
          : `Split by what the ad actually <b>is</b> in Meta - video, a static image, or a carousel - not by anything in its name. Every ad that spent this ${prevTag} is counted, so these rows add up to 100% of ad spend.${conf != null && conf < 0.995 ? ` Meta confirmed the creative type on <b>${fmtPct(conf)}</b> of that spend; for the rest we read it from delivery (an ad with video plays is a video), which correctly separates video from static but can count a carousel as one of those two.` : ''}`}</p>
        <div class="tbl-wrap"><table><thead><tr><th>Format</th><th class="num">Ads</th><th class="num">Spend</th><th class="num">Share</th><th class="num">Purchases</th><th class="num">CPA</th><th class="num">ROAS</th></tr></thead>
        <tbody>${A.formats.map(f => `<tr><td><b>${esc(f.label)}</b></td><td class="num">${fmtInt(f.count)}</td>
          <td class="num"><b>${money(f.spend)}</b></td><td class="num">${fmtPct(f.share)}</td>
          <td class="num">${fmtInt(f.purchases)}</td><td class="num">${f.cpa != null ? money(f.cpa) : ' - '}</td>
          <td class="num">${f.roas != null ? fmtX(f.roas) : ' - '}</td></tr>`).join('')}</tbody></table></div>${verdict}`;
    })() : '';

    // A report frozen before the creative fields existed has no ad ids, so no
    // playback and no ad copy. That reads as a broken feature rather than an old
    // snapshot, so it says which it is. Internal only - a client has no
    // Regenerate button and the report they were sent is the one they get.
    const stale = opts.internal && !A.top.some(a => a.ad_id)
      ? `<div class="notice warn" style="margin:12px 0">⚠️ <div><b>This report predates the creative upgrade.</b> It was generated before cover art, inline playback and ad copy existed, so the cards below show numbers only. Press <b>Rewrite with AI</b> at the top to rebuild it - the ads, the money and the summary all refresh together.</div></div>`
      : '';
    return `<h4 style="font-size:13.5px;font-weight:700;margin:18px 0 2px">Where the budget went <span class="info-i" title="${esc(metricInfo)}">i</span></h4>
      ${stale}
      <p class="hint" style="margin-bottom:10px">The ads that carried real spend this ${prevTag}, biggest first.${A.qualified_total > A.top.length ? ` Showing the ${A.top.length} biggest of ${A.qualified_total} that cleared ${money(A.floor)}.` : ''} ${A.top.some(a => a.preview) ? 'Press ▶ to play the ad right here - no Facebook login needed. Meta’s preview links expire after a few months, so on an older report the image always stays but play may not.' : ''}</p>
      <div class="ad-grid">${A.top.map(card).join('')}</div>
      <div class="tbl-wrap"><table><thead><tr><th>Adding up to every ad that spent</th><th class="num">Spend</th><th class="num">Share</th><th class="num">Purchases</th><th class="num">CPA</th><th class="num">ROAS</th></tr></thead>
        <tbody>${recRow(`The ${A.top.length} ad${A.top.length === 1 ? '' : 's'} above`, fin(shownTot))}
        ${others ? recRow(`${fmtInt(others.count)} smaller ads combined${others.biggest != null ? ` · biggest ${money(others.biggest)}` : ''}`, fin({ spend: others.spend, purchases: others.purchases || 0, revenue: others.revenue || 0 })) : ''}
        ${others ? recRow(`All ${fmtInt(A.total_ads)} ads that spent`, fin(tot), true) : ''}</tbody></table></div>
      ${A.standout ? `<p style="font-size:13.5px;margin-top:10px">Most efficient of the ads with real spend: <b>${esc(A.standout.name)}</b> at a <b>${money(A.standout.cpa)}</b> CPA.</p>` : ''}
      <p class="tiny" style="margin-top:6px">Every ad that spent is accounted for above. There is deliberately no single "best ad": the biggest spender, the best CPA and the best ROAS are usually three different ads, so this shows where the money actually went and what each part of it returned.</p>
      ${formats}`;
  };

  // `peer` is Triple Whale's benchmark against comparable stores. It only
  // appears on the metrics TW actually benchmarks, and is deliberately a plain
  // number rather than a verdict - it is context, not a target.
  const chRow = (label, a, pv, fmt, lower, peer) => (a == null && pv == null) ? '' :
    `<tr><td>${label}</td><td class="num"><b>${fmt(a)}</b></td><td class="num">${fmt(pv)}</td><td class="num">${a != null && pv ? vsPill(a, pv, lower) : '<span class="tiny"> - </span>'}</td><td class="num">${peer != null ? `<span class="tiny">${fmt(peer)}</span>` : ''}</td></tr>`;
  const chCard = c => {
    const A0 = c.cur || {}, P = c.prev || {};
    /* THE ATTRIBUTED HALF SWAPS SOURCE; THE DELIVERY HALF NEVER DOES.
       Revenue, ROAS, purchases and CPA come from whichever model the page is
       on. Spend, CPM, CTR, impressions and clicks stay the platform's own under
       every model, because Triple Whale does not measure delivery and does not
       claim to. Spend is also what the swapped figures are divided BY, so it
       has to stay the same number or the ratios stop meaning anything.
       The prior-period column stays platform-reported and is labelled as such:
       the snapshot only carries this period's attribution. */
    const swap = attrCh(c.id);
    const A = swap
      ? { ...A0,
          revenue: swap.revenue,
          purchases: swap.orders ? Math.round(swap.orders) : 0,
          roas: A0.spend ? swap.revenue / A0.spend : null,
          cpa: swap.orders ? A0.spend / swap.orders : null,
          // A withheld ratio is a statement about the PLATFORM's own conversion
          // count. Under a Triple Whale model that count no longer applies.
          low_signal: (swap.orders || 0) < 2 || undefined,
          source: `Triple Whale, ${ATTR_LABEL(attrModel)}` }
      : A0;
    let rows = '', note = '';
    if (['meta', 'google', 'tiktok', 'pinterest'].includes(c.id)) {
      rows = chRow('Spend', A.spend, P.spend, money, 'neutral')   // an input, not a result - see vsPill
        + chRow('Attributed revenue', A.revenue, P.revenue, money)
        // A ROAS built on fewer than two conversions is one order's value over the
        // whole window's spend, so it is withheld rather than printed as a result.
        // Grunk 2026-08-29 read 0.16x off exactly one $19.95 Google conversion, and
        // that number reached a client brief as though it described the day.
        + (A.low_signal
            ? `<tr><td>ROAS</td><td class="num" colspan="4"><span class="tiny">Not enough conversions to report</span></td></tr>`
            : chRow('ROAS', A.roas, P.roas, fmtX, false, A.peer_roas))
        + chRow('Purchases', A.purchases, P.purchases, fmtInt)
        + chRow('CPA', A.cpa, P.cpa, money, true)
        + chRow('CPM', A.cpm, P.cpm, money, true, A.peer_cpm)
        + chRow('CTR', A.ctr, P.ctr, n => fmtPct(n, 2), false, A.peer_ctr);
      note = (swap
        ? `Revenue, ROAS, purchases and CPA here come from <b>Triple Whale</b>, using its <b>${esc(ATTR_LABEL(attrModel))}</b> model, not ${esc(c.label)}'s own figures, because that is what the control at the top of this page is set to. <b>Spend, CPM and CTR stay ${esc(c.label)}'s</b> under every model: Triple Whale measures attribution, not delivery. ${P.source === 'Triple Whale' ? (attrModel === 'lastPlatformClick' ? '' : `The <b>prior ${prevTag}</b> column is Triple Whale on its default model, so read the change column as directional only.`) : `The <b>prior ${prevTag}</b> column is still ${esc(c.label)}-reported, so read the change column as directional only.`} Under the click models a single order can be credited to more than one platform in full, exactly as Triple Whale's own interface shows, which is why the platforms can add up to more than the store took.`
        : A.source === 'Triple Whale' ? `Revenue, ROAS, purchases and CPA here are <b>Triple Whale</b> attribution (last platform click). <b>Spend, CPM and CTR are ${esc(c.label)}'s own</b>: Triple Whale measures attribution, not delivery.` : `Revenue, ROAS and CPA here are <b>${esc(A.source || c.label + "-reported")}</b> - ${esc(c.label)}'s own attributed figures, passed through by Triple Whale rather than measured by it. They are directional, and deliberately not comparable to the blended scorecard above, which counts every sale once. Expect them to sit BELOW Triple Whale's own Blended ROAS headline, which divides the whole store's order revenue by every platform's spend at once.`)
        + (A.awaiting_attr ? ` <b>Spend only:</b> Triple Whale attribution has not synced for this period yet.` : '') + (A.low_signal && !A.awaiting_attr ? ` <b>ROAS withheld:</b> ${swap || A.source === 'Triple Whale' ? 'Triple Whale attributed' : esc(c.label) + ' recorded'} ${!A.purchases ? 'no' : 'one'} order${swap || A.source === 'Triple Whale' ? '' : ' (conversion)'} in this period. A ratio off that is one order, not a rate, so the spend is shown and the ratio is not.` : '')
        + (A.peer_cpm != null || A.peer_ctr != null ? ` <b>Peers</b> is Triple Whale's benchmark across comparable stores.` : '')
        + (A.awaiting_tw ? ` <b>Spend only:</b> Triple Whale has not synced this period yet, so this is Meta-reported spend with no attribution behind it.` : '');
    } else if (c.id === 'amazon') {
      rows = chRow('Sales', A.sales, P.sales, money)
        + chRow('Orders', A.orders, P.orders, fmtInt)
        + chRow('Refunds', A.refunds, P.refunds, money, true);
      note = 'Amazon storefront sales - a separate channel, not included in the store revenue above.'
        + (A.data_through && A.data_through < d.end ? ` Amazon reports with a delay: data runs through ${shortD(A.data_through)}.` : '');
    } else if (c.id === 'email') {
      rows = chRow('Email-attributed revenue', A.revenue, P.revenue, money)
        + chRow('From campaigns', A.campaigns, P.campaigns, money)
        + chRow('From flows', A.flows, P.flows, money);
      note = (t.sales && A.revenue != null ? `Klaviyo-attributed - ${fmtPct(A.revenue / t.sales)} of the period's revenue. ` : 'Klaviyo-attributed. ')
        + 'Email revenue overlaps both new and returning customers, so it is shown for context and never added to anything.';
    }
    if (!rows) return '';
    return `<div class="card"><h3 style="margin-bottom:8px">${esc(c.label)}</h3>
      <div class="tbl-wrap"><table><thead><tr><th></th><th class="num">This ${prevTag}</th><th class="num">Prior ${prevTag}</th><th class="num">Change</th><th class="num" title="Triple Whale's benchmark across comparable stores. Context, not a target.">Peers</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
      <p class="tiny" style="margin-top:8px">${note}</p>
      ${c.id === 'meta' ? adsBlock() : ''}</div>`;
  };

  const weeksHtml = d.weeks?.length ? `<div class="card"><h3 style="margin-bottom:8px">How the month ran, week by week</h3>
    <div class="tbl-wrap"><table><thead><tr><th>Week</th><th class="num">Revenue</th><th class="num">Ad spend</th><th class="num">MER</th></tr></thead>
    <tbody>${d.weeks.map(w => `<tr><td>${shortD(w.from)} – ${shortD(w.to)}</td><td class="num"><b>${money(w.sales)}</b></td><td class="num">${money(w.spend)}</td><td class="num">${fmtX(w.mer)}</td></tr>`).join('')}</tbody></table></div></div>` : '';

  // Change log. `changes` is {notable, rollup, total}; older stored reports hold a
  // plain array, so both shapes render.
  const ch = d.changes;
  const chList = Array.isArray(ch) ? ch : (ch?.notable || []);
  const chRoll = Array.isArray(ch) ? null : (ch?.rollup || null);
  const rollLine = chRoll && Object.keys(chRoll).length
    ? Object.entries(chRoll).sort((a, b) => b[1] - a[1])
        .map(([k, v]) => `<b>${v}</b> ${esc(catLabel(k, v))}`).join(' · ')
    : '';
  /* SAY WHICH PLATFORM. The Change Log is fed by Meta's ad-account activity
