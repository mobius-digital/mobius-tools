  #askSet textarea{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;font:inherit;font-size:13.5px;line-height:1.5;background:var(--surface);color:var(--ink);margin-top:6px;resize:vertical}
  #askSet textarea:focus{outline:none;border-color:var(--brand-ink);box-shadow:0 0 0 3px var(--brand-soft)}
  .setpane #askSet > .ch{display:none}
  #askSet > .lbl:first-of-type{margin-top:0}
  .set-list{margin:0 0 14px;padding-left:18px;font-size:13px;line-height:1.55;color:var(--muted)}
  .set-list li{margin-bottom:4px}
  .set-list b{color:var(--ink)}
  .set-lbl{display:block;font-weight:700;font-size:13.5px;margin-top:16px}
  #askSet .memlist{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  #askSet .memrow{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:8px;padding:8px 10px;font-size:13px}
  #askSet .memrow span{flex:1;min-width:0}
  #askSet .memrow small{color:var(--muted);font-size:11.5px;white-space:nowrap}
  #askSet .memrow .x{color:var(--muted);padding:2px 6px;border-radius:6px}
  #askSet .memrow .x:hover{color:var(--bad);background:var(--bad-bg)}
  @media (max-width:980px){
    .setwrap{grid-template-columns:minmax(0,1fr);gap:16px}
    .setnav{position:static;flex-direction:row;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
      background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
    .setnav::-webkit-scrollbar{display:none}
    .setnav button{flex:none;padding:8px 12px;white-space:nowrap}
    .setnav button small{display:none}
    .setnav button.setnav-brk{margin-top:0;margin-left:9px}
    .setnav button.setnav-brk::before{left:-6px;right:auto;top:8px;bottom:8px;border-top:0;border-left:1px solid var(--line)}
  }
  @media (max-width:720px){
    .brow .brow-body{padding:10px 10px 4px}
    .brow-grp{padding:2px 14px}
    .set-card{padding:15px 15px}
    .set-card select,.set-card input[type=text]{max-width:100%}
  }
  /* BRAND ROWS. One expandable row per brand holding everything about it,
     replacing four tables organised by SYSTEM (every ad account, Shopify,
     channels, costs) that made setting up one brand a tour of four places. */
  .brow{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;overflow:hidden}
  .brow[open]{border-color:var(--line-strong);box-shadow:0 2px 10px rgba(12,22,29,.05)}
  .brow summary{display:flex;align-items:center;gap:10px;padding:14px 18px;cursor:pointer;
    list-style:none;flex-wrap:wrap}
  .brow summary::-webkit-details-marker{display:none}
  .brow summary::before{content:'▸';color:var(--muted);font-size:12px;flex:none;transition:transform .12s ease}
  .brow[open] summary::before{transform:rotate(90deg)}
  .brow summary:hover{background:var(--bg)}
  .brow-name{font-weight:700;font-size:15px}
  .brow-sum{margin-left:auto;font-size:12.5px;text-align:right}
  .brow-ok{color:var(--muted)}
  .brow-warn{color:var(--warn);font-weight:600}
  /* ONE SETTING PER ROW, stacked. A two-column grid of cards made the eye
     zigzag and left the controls on ragged left edges; a single vertical list
     with the label on the left and every control aligned on one column reads
     as a form rather than a collage. Each field carries a line saying what it
     does - the standing rule that a control never appears unexplained. */
  .brow-body{border-top:1px solid var(--line);padding:4px 20px 8px;background:var(--bg)}
  .brow-f{display:grid;grid-template-columns:280px minmax(0,1fr);gap:6px 26px;
    padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
  .brow-f:last-child{border-bottom:0}
  .brow-l label{display:block;font-weight:700;font-size:13.5px;margin-bottom:2px}
  .brow-l .hint{margin:0;font-size:12px;line-height:1.45}
  .brow-c{padding-top:1px;min-width:0}
  /* Text inputs in the page body had NO styling at all - `main select` was
     covered but `main input[type=text]` never was, so every one of them fell
     back to the raw OS box. That is what read as boxy next to the pill-shaped
     pickers beside them. */
  .brow-c input[type=text],main .card input[type=text]{border:1px solid var(--line-strong);border-radius:8px;
    padding:7px 10px;font-size:13px;background:var(--surface);color:var(--ink);width:100%;max-width:300px}
  .brow-c input[type=text]:hover{border-color:var(--brand)}
  .brow-c input[type=text]:focus,.brow-c select:focus{outline:none;border-color:var(--brand-ink);box-shadow:0 0 0 3px var(--brand-soft)}
  .brow-c select{width:100%;max-width:300px;font-size:13px}
  /* FOURTH time this trap has bitten. `.unit-in` draws the border and the %
     suffix as ONE pill with a bare input inside it, so any rule that gives
     `input[type=text]` its own border draws a box inside the box. The generic
     rule above is (0,2,1) and `.unit-in input[type=text]` is also (0,2,1), so
     the later one won. Must out-specify it, not merely repeat it. */
  .brow-c .unit-in{max-width:110px}
  /* FIFTH time. The rule above (`main .card input[type=text]`) is (0,2,1) and so
     is `.unit-in input[type=text]` at the top of the file - equal specificity, and
     this one is LATER, so it won and drew a border plus a 300px cap inside every
     pill on the Plan page. Repeating the reset at equal weight has failed four
     times; it has to OUT-SPECIFY every generic body rule and sit after them.
     `.unit-in` is the single place that owns the border, so anything inside it is
     stripped bare regardless of where the pill is used. */
  .unit-in input,
  main .card .unit-in input[type=text],
  main .card .unit-in input[type=number],
  .brow-c .unit-in input[type=text],
  .settings .unit-in input[type=text],
  .settings .unit-in input[type=number]{
    border:none!important;border-radius:0;padding:6px 3px;background:transparent;
    width:100%;max-width:none;min-width:0;outline:none;box-shadow:none!important}
  .unit-in:focus-within{border-color:var(--brand-ink);box-shadow:0 0 0 3px var(--brand-soft)}
  .unit-in:hover{border-color:var(--brand)}
  .brow-static{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .brow-danger .btn{border-color:var(--bad);color:var(--bad)}
  .brow-danger .btn:hover{background:var(--bad-bg)}
  @media (max-width:760px){
    .brow-f{grid-template-columns:1fr;gap:8px}
    .brow-sum{margin-left:0;width:100%;text-align:left}
    .brow-c input[type=text],.brow-c select{max-width:100%}
  }
  /* Add-a-brand form. Labelled controls with an explanation under each, per the
     standing rule that a control never appears without saying what it does. */
  .ab-form{display:flex;flex-direction:column;gap:16px}
  .ab-f label{display:block;font-weight:700;font-size:14px;margin-bottom:2px}
  .ab-f .hint{margin:0 0 7px;font-size:12.5px;line-height:1.45}
  .ab-f input[type=text],.ab-f select{width:100%;max-width:100%}
  .ab-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ab-two .tiny{display:block;margin-bottom:3px}
  @media (max-width:520px){ .ab-two{grid-template-columns:1fr} }
  /* Searchable picker. A native <select> can be styled shut but NEVER open -
     the option list is drawn by the OS, which is why the dropdown still read as
     boxy after the control itself was on brand. This is a real listbox: styled
     in both states, filterable (an ad account list runs to a dozen-plus), and
     able to show the account id as a second line, which an <option> cannot. */
  .pk{position:relative}
  .pk-in{display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:8px;
    padding:7px 10px;background:var(--surface);cursor:pointer;font-size:13px}
  .pk-in:focus-within{border-color:var(--brand-ink);box-shadow:0 0 0 3px var(--brand-soft)}
  /* MUST carry [type=text] to win. `.modal input[type=text]` is (0,2,1) and this
     was (0,1,1), so the inner input kept its own border and padding and drew a
     box inside the box - the identical specificity trap `.unit-in` hit, now for
     the second time. Any control that wraps an input needs the attribute too. */
  .pk-in input,.pk-in input[type=text]{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:13px;padding:0;border-radius:0;box-shadow:none}
  .pk-in input:focus,.pk-in input[type=text]:focus{border:none;box-shadow:none;outline:none}
  .pk-in .pk-cv{width:10px;height:6px;flex:none;opacity:.6}
  .pk-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;max-height:230px;overflow-y:auto;
    background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;
    box-shadow:0 12px 28px rgba(12,22,29,.16);padding:4px;display:none}
  .pk.open .pk-list{display:block}
  .pk-opt{padding:7px 9px;border-radius:6px;cursor:pointer;font-size:13.5px;line-height:1.35}
  .pk-opt small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
  .pk-opt:hover,.pk-opt.hl{background:var(--brand-soft)}
  .pk-opt[aria-selected=true]{font-weight:700}
  .pk-none{padding:9px;color:var(--muted);font-size:12.5px}
  /* Two-tier help: the three lines you actually needed, then the essay. */
  .hb{border-left:3px solid var(--brand);background:var(--brand-soft);padding:12px 15px;border-radius:0 8px 8px 0;margin-bottom:14px}
  .hb p{margin:0 0 8px;font-size:14px;line-height:1.5}
  .hb p:last-child{margin:0}
  .hb b{color:var(--brand-ink)}
  .hb-more{border-top:1px solid var(--line);padding-top:10px}
  .hb-more summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--muted);list-style:none;padding:2px 0}
  .hb-more summary::-webkit-details-marker{display:none}
  .hb-more summary::before{content:'▸ ';color:var(--brand-ink)}
  .hb-more[open] summary::before{content:'▾ '}
  .hb-more summary:hover{color:var(--brand-ink)}
  .hb-more .help-body{padding-top:8px}
  .hb-foot{margin:14px 0 0;padding-top:10px;border-top:1px solid var(--line);font-size:13px}
  .hb-foot a{color:var(--brand-ink);font-weight:700;text-decoration:none}
  .hb-foot a:hover{text-decoration:underline}
  /* Glossary. One entry per metric, and the LAST line - what to do when it
     moves - is the one that did not exist anywhere before. */
  .gl{display:flex;flex-direction:column;gap:16px}
  .gl-i{border-top:1px solid var(--line);padding-top:13px}
  .gl-i:first-child{border-top:0;padding-top:0}
  .gl-i h4{margin:0 0 3px;font-size:15px;font-weight:700}
  .gl-tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 7px;margin-left:5px}
  .gl-one{margin:0 0 8px;font-size:14px;line-height:1.5;color:var(--ink)}
  .gl dl{display:grid;grid-template-columns:132px 1fr;gap:5px 14px;margin:0;font-size:13px;line-height:1.5}
  .gl dt{font-family:inherit;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px}
  .gl dd{margin:0;color:var(--ink-2)}
  @media (max-width:560px){ .gl dl{grid-template-columns:1fr;gap:2px} .gl dt{padding-top:7px} }
  /* Profit's brand chooser: a list, deliberately not cards. Cards invited
     comparison, which is Overview's job and was the duplication. */
  .pf-pick{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    padding:13px 18px;border-bottom:1px solid var(--line);font-size:14px;background:transparent}
  .pf-pick:last-child{border-bottom:0}
  .pf-pick:hover{background:var(--brand-soft)}
  .pf-pick-r{flex:none;width:18px;color:var(--muted);font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
  .pf-pick-n{font-weight:700;font-size:15px;min-width:0}
  .pf-pick-v{margin-left:auto;font-variant-numeric:tabular-nums}
  .pf-pick-go{color:var(--muted);flex:none}
  .pf-pick:hover .pf-pick-go{color:var(--brand-ink)}
  /* The weekday rhythm on Plan: real analysis, but context for a conversation
     rather than a result, so it opens only when asked for. */
  .rh-wrap{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);margin-bottom:14px}
  .rh-wrap summary{cursor:pointer;padding:13px 18px;font-weight:700;font-size:14.5px;list-style:none}
  .rh-wrap summary::-webkit-details-marker{display:none}
  .rh-wrap summary::before{content:'▸ ';color:var(--brand-ink)}
  .rh-wrap[open] summary::before{content:'▾ '}
  .rh-wrap summary .tiny{font-weight:400}
  .rh-body .card{margin:0;border:0;border-top:1px solid var(--line);border-radius:0}
  /* Creative browser. Reuses .ad-card/.ad-media/.ad-grid from the reports on
     purpose: what you sort through here is what the client eventually opens,
     so it must not be a lookalike that drifts. */
  /* Labelled dropdowns, matching every other control in Locus. Nine sorts as
     pills was two wrapping rows of buttons that looked like nothing else here. */
  .cb-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  .cb-l{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--muted)}
  .cb-l select{font-weight:500;color:var(--ink)}
  /* The qualifying threshold controls. `.unit-in input` needs [type=text] in
     the selector or a later rule out-specifies it and draws a box inside the
     pill - the same trap documented four times in CLAUDE.md. */
  .cb-in{width:88px}
  .cb-in input,.cb-in input[type=text]{width:100%;font-weight:600}
  .cb-thresh{color:var(--ink);font-weight:700}
  .cb-lock{cursor:pointer;font-weight:600}
  .cb-lock input[type=checkbox]{width:auto;margin:0;accent-color:var(--brand-ink);cursor:pointer}
  /* The rule, stated above the grid. Quiet, but never hidden. */
  .cb-rule{font-size:12.5px;color:var(--muted);background:var(--surface);
    border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:0 0 12px}
  .cb-rule b{color:var(--ink)}
  .lnk{color:var(--brand-ink);font-weight:600;text-decoration:underline;
    text-underline-offset:2px;font-size:inherit;margin-left:8px}
  /* Custom menus, because a native select's OPEN list belongs to the OS. */
  .cb-sel{position:relative;display:inline-block}
  .cb-sel-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);
    border-radius:8px;padding:6px 10px;background:var(--surface);color:var(--ink);
    font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
  .cb-sel-btn:hover{border-color:var(--brand)}
  .cb-sel.open .cb-sel-btn{border-color:var(--brand-ink);box-shadow:0 0 0 3px var(--brand-soft)}
  .cb-sel-btn svg{color:var(--muted);flex:none}
  .cb-sel-menu{display:none;position:absolute;left:0;top:calc(100% + 5px);z-index:25;min-width:100%;
    background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;padding:5px;
    box-shadow:0 14px 34px rgba(12,22,29,.2);white-space:nowrap}
  .cb-sel.open .cb-sel-menu{display:block}
  .cb-sel-menu button{display:block;width:100%;text-align:left;padding:6px 10px;border-radius:6px;
    font-size:13px;color:var(--ink);background:transparent}
  .cb-sel-menu button:hover{background:var(--brand-soft)}
  .cb-sel-menu button.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:700}
  /* A model the API cannot give us is shown and disabled, never hidden - its

  .cb-sel-off{display:block;padding:6px 10px;font-size:13px;color:var(--muted);cursor:default;opacity:.75}
  .cb-sel-off small{display:block;font-size:11px;line-height:1.35;margin-top:1px;max-width:230px;white-space:normal}
  .cb-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  /* Two rows of four, Cole's suggestion: a fixed short grid makes the SORT do
     the work, where an unbounded one invites scrolling past the answer. */
  @media(max-width:1100px){ .cb-grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
  @media(max-width:860px){ .cb-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media(max-width:560px){ .cb-grid{grid-template-columns:minmax(0,1fr)} }
  .cb-stats{display:flex;flex-direction:column;gap:2px;margin-top:8px}
  .cb-s{display:flex;align-items:baseline;gap:8px;font-size:12px;line-height:1.42}
  .cb-s span{color:var(--muted)}
  .cb-s b{margin-left:auto;font-variant-numeric:tabular-nums;font-size:13px}
  .cb-s b.good{color:var(--good)} .cb-s b.bad{color:var(--bad)} .cb-s b.ok{color:var(--ink)}
  .cb-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:9px;padding-top:8px;border-top:1px solid var(--line)}
  /* 2026-10-04 redesign (Cole: "what am I looking at"): one control row, a
     verdict chip and four numbers per card, everything else one click away. */
  .cb-bar .cb-gap{flex:1}
  .cb-more-btn[aria-expanded="true"]{border-color:var(--brand-ink);color:var(--brand-ink)}
  .cb-more-btn svg,.cb-share-btn svg{margin-left:6px;vertical-align:1px}
  .cb-more{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 22px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:0 0 14px}

  .cb-opt{display:flex;flex-direction:column;gap:6px;min-width:0}

  .cb-opt .tiny{line-height:1.4}
  .cb-opt .lnk,.cb-notes .lnk{padding:0;margin-left:4px;line-height:inherit;vertical-align:baseline}
  .cb-opt .chip{padding:5px 11px}
  .cb-opt .chip.on{border-color:var(--brand-ink);color:var(--brand-ink);background:var(--brand-soft)}
  .cb-share{position:relative;display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
  .cb-share-menu{display:none;position:absolute;right:0;top:calc(100% + 5px);z-index:25;width:min(300px,calc(100vw - 32px));
    background:var(--surface);border:1px solid var(--line-strong);border-radius:9px;padding:5px;box-shadow:0 14px 34px rgba(12,22,29,.2)}
  .cb-share.open .cb-share-menu{display:block}
  .cb-share-menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:6px;background:transparent;color:var(--ink);font-size:13px;font-weight:700}
  .cb-share-menu button:hover{background:var(--brand-soft)}
  .cb-share-menu button small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:2px;white-space:normal}
  #cbShareMsg{max-width:100%;overflow-wrap:anywhere}
  #cbShareMsg code{white-space:normal;word-break:break-all}
  .cb-legend{font-size:12.5px;color:var(--muted);margin:0 0 10px}
  .cb-legend b{color:var(--ink)}
  .cb-top{display:flex;align-items:flex-start;gap:8px;min-width:0}
  .cb-top .ad-name{flex:1;min-width:0}
  .cb-top .vd{flex:none;margin-top:1px}
  .cb-card .vd.watch{background:var(--warn-bg);color:var(--warn)}

  .cb-n b.good{color:var(--good)} .cb-n b.bad{color:var(--bad)}
  .cb-count{font-size:12px;color:var(--muted);margin:2px 0 0}
  .cb-notes{margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
  .cb-notes summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--brand-ink);list-style:none}
  .cb-notes summary::-webkit-details-marker{display:none}
  .cb-notes summary::before{content:'▸ '}
  .cb-notes[open] summary::before{content:'▾ '}
  .cb-notes-body{font-size:12.5px;color:var(--muted);max-width:820px;line-height:1.5}
  .cb-notes-body p{margin:10px 0 0}
  .cb-notes-body b{color:var(--ink)}
  .cr-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;justify-content:space-between}
  .cr-head > div:first-child{flex:1 1 320px;min-width:0}
  .cr-head .sub{margin-bottom:14px}
  .cr-launch{margin-top:22px}
  .cr-launch h3{margin-bottom:10px}
  .cr-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:10px}
  .cr-tile{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;min-width:0}
  .cr-tile span{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
  .cr-tile b{display:block;font-size:22px;letter-spacing:-.02em;line-height:1.25;margin:3px 0 2px;font-variant-numeric:tabular-nums}
  .cr-tile small{display:block;font-size:12px;color:var(--muted);line-height:1.35}
  .cr-launch .cr-pick{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 10px}
  .cr-weeks{margin-top:12px}
  .cr-weeks summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--brand-ink);list-style:none}
  .cr-weeks summary::-webkit-details-marker{display:none}
  .cr-weeks summary::before{content:'▸ '}
  .cr-weeks[open] summary::before{content:'▾ '}
  .cr-weeks .card{margin:12px 0 0;box-shadow:none}
  .cr-weeks .tbl-wrap{overflow-x:auto}
  .help-btn{border:1px solid var(--line-strong);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--muted);background:var(--surface)}
  .help-btn + .help-btn{margin-left:6px}
  .help-btn:hover{color:var(--brand-ink);border-color:var(--brand-ink)}
  .strip{position:relative;height:30px}
  .strip .dot{position:absolute;top:9px;width:9px;height:9px;border-radius:50%;transform:translateX(-50%);cursor:default;border:1.5px solid #fff;box-shadow:0 0 0 1px var(--line-strong)}
  .av-client{font-family:var(--serif);font-size:19px;margin:20px 0 10px}
  .av-client:first-of-type{margin-top:4px}

  /* Pacing (Chat 2: month-to-date) */
  .pace-bar{position:relative;height:14px;background:var(--unk-bg);border-radius:99px;margin:12px 0 6px}
  .pace-bar .fill{position:absolute;top:0;bottom:0;left:0;background:var(--brand);border-radius:99px;min-width:3px}
  .pace-bar .fill.over{background:var(--bad)}
  .pace-bar .mark{position:absolute;top:-4px;bottom:-4px;width:2.5px;background:var(--hd);border-radius:2px}
  .pc-stats{display:flex;gap:30px;flex-wrap:wrap;margin-top:10px}
  .pc-stats .st b{display:block;font-size:16.5px;font-weight:700}
  .pc-stats .st span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}

  /* Creative Rotation (Chat 3) */
  .ad-name{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  /* Ad names link to Meta's public preview. Underline on hover only, so a table
     of ten does not read as a wall of links. */
  /* Creative cards - the creative IS the row. A name like "406 A | UGC" tells a
     client nothing, so the ad leads with its image and the numbers sit under it.
     Thumbnails are baked into the report as data URIs, so an archived report
     never decays into broken images. */
  .ad-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:14px;margin-bottom:12px}
  .ad-card{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);
    overflow:hidden;display:flex;flex-direction:column;min-width:0;cursor:pointer;
    transition:border-color .12s,box-shadow .12s}
  .ad-card:hover{border-color:var(--brand-ink);box-shadow:0 2px 12px rgba(0,0,0,.07)}
  .ad-card:hover .ad-open{color:var(--brand-ink)}
  /* 4:5, not square. Most of these creatives are shot 9:16 for Reels and Stories,
     and a square tile crops the top and bottom off the thing you are judging. */
  .ad-media{position:relative;aspect-ratio:1/1;background:var(--bg);border-bottom:1px solid var(--line);overflow:hidden}
  .ad-media.playing{aspect-ratio:auto}
  .ad-media>img{width:100%;height:100%;object-fit:cover;display:block}
  .ad-media.none{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:22px}
  /* Reads as an absence, not as a control - see the note in card(). */
  .ad-noimg{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
  .ad-noimg small{font-size:11px;text-transform:none;letter-spacing:0;opacity:.7}
  .ad-rank{position:absolute;top:8px;left:8px;min-width:20px;height:20px;padding:0 5px;border-radius:6px;
    background:rgba(0,0,0,.62);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .ad-dur{position:absolute;bottom:8px;right:8px;padding:1px 6px;border-radius:6px;
    background:rgba(0,0,0,.62);color:#fff;font-size:10.5px;font-weight:700}
  .ad-play{position:absolute;inset:0;width:100%;border:0;background:rgba(0,0,0,.12);cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:background .12s}
  .ad-play:hover{background:rgba(0,0,0,.28)}
  .ad-play i{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;
    background:rgba(255,255,255,.94);color:#111;font-size:15px;font-style:normal;padding-left:3px;
    box-shadow:0 2px 10px rgba(0,0,0,.3)}
  .ad-frame{position:absolute;inset:0;background:#000;overflow:hidden}
  .ad-frame video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
  .ad-frame .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:18px;color:#fff;font-size:12.5px;line-height:1.5;background:rgba(0,0,0,.72)}
  .ad-frame .msg a{color:#fff}
  /* Meta's preview iframe, used when the mp4 is not ours to fetch (partnership
     ads). It renders at a fixed width, so it is scaled to the card rather than
     cropped - the same trick the report cards use. */
  .prev-modal{max-width:420px}
  /* Meta draws the unit at a fixed width; the box holds it at that size and
     scrolls only if the viewport is genuinely too short. */
  .prev-box{width:100%;height:min(760px,72vh);background:#fff;border:1px solid var(--line);
    border-radius:8px;overflow:hidden}
  .prev-box iframe{width:100%;height:100%;border:0;display:block}
  .ad-frame iframe.ad-embed{position:absolute;top:0;left:0;border:0;display:block;background:#fff}
  .ad-frame .ad-embed-note{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.78);
    color:#fff;font-size:10.5px;line-height:1.3;padding:5px 28px 5px 8px;
    display:flex;gap:6px;align-items:baseline;white-space:nowrap;overflow:hidden}
  .ad-frame .ad-embed-note span{overflow:hidden;text-overflow:ellipsis}
  .ad-frame .ad-embed-note a{color:#fff;text-decoration:underline;flex:none}
  .ad-spin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:12px;background:rgba(0,0,0,.45)}
  .ad-close{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;border:0;cursor:pointer;
    background:rgba(0,0,0,.62);color:#fff;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center}
  .ad-body{padding:10px 12px 11px;display:flex;flex-direction:column;gap:0;min-width:0}
  .ad-body .ad-name{font-size:14px;font-weight:700;max-width:100%;margin-bottom:7px;line-height:1.3;
    white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* Type and length sit ON the creative, where the eye already is. */
  .ad-type{position:absolute;bottom:8px;left:8px;padding:2px 8px;border-radius:6px;
    background:rgba(0,0,0,.62);color:#fff;font-size:10.5px;font-weight:700}
  .ad-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
  .ad-chips span{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:99px;
    background:var(--brand-soft);color:var(--brand-ink)}
  .ad-chips span.grey{background:var(--line);color:var(--muted)}
  /* Stats read as VERTICAL rows - label left, value right - because that is how
     the eye scans a list of unlike quantities. A horizontal grid made you read
     each column heading to know what the number was. */
  /* No dividers between rows - spacing does the separating, which is quieter
     and lets the values line up as a column the eye can run down. */
  .ad-stats{display:flex;flex-direction:column;gap:7px}
  .ad-row{display:flex;align-items:baseline;gap:8px}
  .ad-row>span:first-child{font-size:12px;color:var(--muted);flex:1;min-width:0}
  .ad-row>b{font-size:14px;font-weight:700;white-space:nowrap;margin-left:auto}
  .ad-row .dlt{font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:5px;white-space:nowrap}
  .ad-row .dlt.up{background:var(--good-bg);color:var(--good)}
  .ad-row .dlt.dn{background:var(--bad-bg);color:var(--bad)}
  .ad-row .dlt.flat{background:var(--unk-bg);color:var(--unk)}
  /* The bar the number is judged against, stated on the row itself. Asked twice
     what "strong" meant, which means an ⓘ tooltip was not enough. */
  .ad-row .bm{font-style:normal;font-size:10.5px;color:var(--muted);opacity:.75;margin-left:4px}
  .vtag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    padding:1px 5px;border-radius:5px;white-space:nowrap}
  .vtag.good{background:var(--good-bg);color:var(--good)}
  .vtag.ok{background:var(--warn-bg,#FDF3E0);color:var(--warn)}
  .vtag.bad{background:var(--bad-bg);color:var(--bad)}
  /* The scroll gutter sits over the right edge of the body, so percentages need
     room or they read as touching the scrollbar. */
  .ad-modal-body{padding-right:10px}
  .retn-row{display:flex;align-items:center;gap:9px;margin-bottom:4px}
  .retn-row .lb{font-size:11.5px;color:var(--muted);width:58px;flex:none}
  .retn-row .track{flex:1;height:7px;border-radius:99px;background:var(--line);overflow:hidden}
  .retn-row .track i{display:block;height:100%;background:var(--brand-ink)}
  .retn-row .pc{width:46px;text-align:right;font-size:12px;font-weight:700;flex:none}
  /* The whole card opens the detail view, so this is an affordance rather than
     the only way in - it says what a click does without competing for it. */
  .ad-open{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);font-size:12px;
    font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px}
  /* Detail view: the creative big on the left, everything we know on the right.
     It gets its own wider shell - the shared 460px help modal squeezed the stat
     table until values were cut off mid-number. */
  .ad-modal-wrap{padding:5vh 16px 0}
  /* ==========================================================================
     THE CLIENT'S SHARED-ADS PAGE ("what is working"), redesigned 2026-09-16.
     A dark hero with the whole-set figures, four highlight tiles, a sticky
     glass control bar the client drives, and cards that lead with whichever
     metric the list is sorted on. Everything is prefixed shp- so none of it
     touches the internal browser's cards. */
  /* The share page owns its canvas: a full-bleed ground with one soft glow so
     nothing from the app shell (topbar strip, 1240px left-pinned column) shows
     through, and the content centres in a wider column that fills a laptop
     and sits balanced on a big monitor. */
  body.shp-body{background:#EAF0F4;background-image:radial-gradient(1200px 640px at 100% -10%,rgba(98,189,234,.20),transparent 65%),radial-gradient(900px 500px at -10% 100%,rgba(98,189,234,.10),transparent 60%);background-attachment:fixed}
  body.shp-body .topbar,body.shp-body .pbar{display:none}
  body.shp-body main{max-width:none;padding:14px clamp(16px,3vw,44px) 56px}
  body.shp-body footer{max-width:none;padding:0 clamp(16px,3vw,44px) 36px;text-align:center}
  .shp{max-width:1480px;margin:0 auto;padding:6px 0 24px}
  .shp-hero{position:relative;overflow:hidden;border-radius:18px;padding:30px 34px 28px;color:var(--on-ink);
    background:radial-gradient(900px 420px at 88% -20%,rgba(98,189,234,.34),transparent 60%),
      radial-gradient(600px 300px at 0% 120%,rgba(98,189,234,.14),transparent 60%),
      linear-gradient(160deg,#0C161D 0%,#152430 100%);
    box-shadow:0 24px 60px rgba(12,22,29,.22)}
  .shp-hero::after{content:'';position:absolute;inset:0;pointer-events:none;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:36px 36px;-webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.8),transparent 85%);mask-image:linear-gradient(180deg,rgba(0,0,0,.8),transparent 85%)}
  .shp-hero>*{position:relative;z-index:1}
  .shp-hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:11.5px;color:var(--on-ink-2);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
  .shp-brand{display:inline-flex;align-items:center;gap:8px;color:var(--on-ink)}
  .shp-brand i{width:8px;height:8px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 4px rgba(98,189,234,.22)}
  .shp-title{font-family:var(--serif);font-weight:400;font-size:clamp(30px,4.6vw,46px);line-height:1.05;margin:22px 0 8px;letter-spacing:-.01em;color:#fff}
  .shp-title em{display:block;font-style:italic;color:var(--brand);font-size:.62em;margin-top:6px}
  .shp-sub{font-size:13.5px;color:var(--on-ink-2);margin:0 0 22px;max-width:none}
  .shp-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .shp-kpi{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.055);border-radius:12px;padding:12px 14px;min-width:0}
  .shp-kpi span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--on-ink-2);font-weight:600}
  .shp-kpi b{display:block;font-size:22px;font-weight:600;margin-top:4px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .shp-kpi small{display:block;font-size:11px;color:var(--on-ink-2);margin-top:2px}
  .shp-high{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:16px 0 0}
  .shp-hl{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:10px 12px;cursor:pointer;
    box-shadow:0 1px 2px rgba(12,22,29,.06),0 8px 24px rgba(12,22,29,.06);transition:transform .15s,box-shadow .15s}
  .shp-hl:hover,.shp-hl:focus-visible{transform:translateY(-2px);box-shadow:0 2px 4px rgba(12,22,29,.06),0 14px 34px rgba(12,22,29,.12);outline:none}
  .shp-hl img,.shp-hl .ph{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--bg);flex:none;display:block}
  .shp-hl div{min-width:0}
  .shp-hl span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--brand-ink);font-weight:700}
  .shp-hl b{display:block;font-size:19px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
  .shp-hl small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .shp-bar{position:sticky;top:10px;z-index:20;display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;margin:18px 0 14px;
    padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.7);box-shadow:0 1px 2px rgba(12,22,29,.05),0 10px 30px rgba(12,22,29,.10)}
  .shp-ctl{display:flex;align-items:center;gap:9px;min-width:0}
  .shp-ctl-l{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;flex:none}
  .shp-pills{display:flex;gap:3px;background:var(--bg);border-radius:10px;padding:3px;overflow-x:auto;scrollbar-width:none}
  .shp-pills::-webkit-scrollbar{display:none}
  .shp-pill{flex:none;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:8px;color:var(--ink-2);white-space:nowrap;transition:background .12s,color .12s}
  .shp-pill:hover{color:var(--ink)}
  .shp-pill.on{background:var(--ink-panel);color:#fff;box-shadow:0 2px 6px rgba(12,22,29,.25)}
  .shp-fixed{font-size:13px;font-weight:600}
  .shp-count{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .shp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  .shp-card{background:var(--surface);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0;cursor:pointer;
    box-shadow:0 1px 2px rgba(12,22,29,.05),0 10px 28px rgba(12,22,29,.07);transition:transform .16s,box-shadow .16s}
  .shp-card:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(12,22,29,.06),0 18px 40px rgba(12,22,29,.14)}
  /* 4:5, because most of these are shot for Reels; the square tile cropped the
     top and bottom off the thing being judged. */
  .ad-media.shp-media{aspect-ratio:4/5;border-bottom:0}
  .ad-media.shp-media.playing{aspect-ratio:auto}
  .shp-rank{position:absolute;top:10px;left:10px;min-width:26px;height:26px;padding:0 8px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    background:rgba(12,22,29,.78);color:#fff;font-size:12px;font-weight:700}
  .shp-type{position:absolute;top:10px;right:10px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.9);color:var(--ink);font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
  .shp-body{padding:12px 14px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
  .shp-name{font-size:13px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .shp-lead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .shp-lead span{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--brand-ink);font-weight:700}
  .shp-lead b{font-size:24px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1}
  .shp-fill{height:4px;border-radius:99px;background:var(--bg);overflow:hidden}
  .shp-fill i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand-ink),var(--brand));transition:width .25s}
  .shp-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;padding-top:8px;border-top:1px solid var(--line)}
  .shp-stat{min-width:0}
  .shp-stat span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .shp-stat b{display:block;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .shp-open{font-size:12px;font-weight:600;color:var(--muted);display:flex;justify-content:flex-end;gap:4px;margin-top:2px}
  .shp-card:hover .shp-open{color:var(--brand-ink)}
  .shp-note{font-size:12.5px;color:var(--muted);margin:14px 2px 0}
  .shp-note b{color:var(--ink)}
  .shp-empty{grid-column:1/-1;background:var(--surface);border-radius:14px;padding:28px;text-align:center;color:var(--muted);font-size:13.5px}
  .shp-glossary{margin:18px 0 0;background:var(--surface);border-radius:14px;padding:4px 18px}
  .shp-glossary summary{cursor:pointer;font-size:13px;font-weight:700;padding:12px 0;list-style:none;display:flex;justify-content:space-between}
  .shp-glossary summary::-webkit-details-marker{display:none}
  .shp-glossary summary::after{content:'+';color:var(--muted);font-weight:400}
  .shp-glossary[open] summary::after{content:'–'}
  .shp-glossary dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px 24px;padding:0 0 16px}
  .shp-glossary dt{font-size:12.5px;font-weight:700}
  .shp-glossary dd{font-size:12.5px;color:var(--muted);line-height:1.5}
  @media (max-width:640px){
    .shp-hero{padding:22px 18px 20px;border-radius:14px}
    .shp-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
    .shp-kpi:last-child:nth-child(odd){grid-column:1/-1}
    .shp-bar{position:static;padding:10px 12px;gap:8px 14px}
    .shp-ctl{width:100%}
    .shp-count{margin-left:0}
    .shp-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
    .shp-lead b{font-size:20px}
    .shp-stats{gap:5px 8px}
  }
  .modal.wide{max-width:940px}
  .ad-modal-body{max-height:76vh;overflow-y:auto;font-size:13.5px;line-height:1.6}
  .adm{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:22px}
  .adm-media{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);position:relative}
  .adm-media img{width:100%;display:block}
  .adm-media .ad-frame{position:absolute;inset:0}
  .adm table{width:100%}
  .adm td:first-child{white-space:nowrap}
  .adm-copy{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);margin-bottom:14px}
  .adm-copy .hd{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:3px;padding:0}
  .adm-copy .brow{font-size:13px;line-height:1.55;white-space:pre-wrap}
  .adm-facts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .adm-facts span{font-size:11.5px;border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--muted)}
  .adm-facts span b{color:var(--ink);font-weight:700}
  /* minmax(0,1fr), never a bare 1fr: a bare fr floors at min-content, so the
     stat table pushed this grid to 504px inside a 343px modal on a phone. */
  @media(max-width:720px){.adm{grid-template-columns:minmax(0,1fr)}}
  /* Two cards on a tablet, one on a phone. `auto-fill` alone gave a single
     560px-wide card on an iPad, which wastes the row and makes the creative
     absurdly large. */

  /* ---- mobile: app chrome, not a shrunken website ----
     Phones get the labeled bottom tab bar every serious dashboard app ships:
     the four daily destinations plus More, which opens the full rail as the
     existing drawer. The bar is phones only; tablets keep the rail. This block
     stays at the VERY END of the stylesheet on purpose - media queries add no
     specificity, so placed earlier they silently lose to later base rules. */
  .tabbar{display:none}
  @media (max-width:720px){
    .nav-toggle{display:none}
    .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
      background:var(--hd);border-top:1px solid var(--hd-line);
      padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
    .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:3px;color:#8195A2;font-size:10.5px;font-weight:600;padding:4px 2px;min-height:48px;border-radius:8px}
    .tabbar button.on{color:var(--brand)}
    .tabbar .ic{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;
      stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    body.nochrome .tabbar{display:none}
    .topbar{padding-top:calc(10px + env(safe-area-inset-top))}
    .side{padding-top:calc(14px + env(safe-area-inset-top))}
    main{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
    footer{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
    /* Modals arrive as bottom sheets. The sheet scrolls itself; the wrap's own
       overscroll-behavior already keeps the page behind it still. */
    .modal-wrap{align-items:flex-end;padding:0}
    .modal,.modal.wide{max-width:none;width:100%;border-radius:16px 16px 0 0;
      max-height:92dvh;overflow-y:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
    .ad-modal-wrap{padding:0}
    .ad-modal-body{max-height:none;overflow:visible;padding-right:0}
    .tour-box{max-width:calc(100vw - 24px)}
    /* A phone needs a 44px target and a 16px field, and neither was here.
       Under 16px iOS zooms the page the instant a field is focused and
       nothing zooms it back, so tapping the first box in a form left you
       scrolled sideways inside a magnified page - most of what "clucky"
       was describing. Ledger has carried both rules since it was built;
       Locus never got them. */
    button,.btn,.chip,.ctl,select{min-height:44px}
    /* Two deliberate exceptions, both already sized by a stronger selector:
       a segmented control is one control split into parts, not four buttons
       stacked, and the tab bar sets its own 48px. Everything else in the app
       is a target you hit with a thumb. */
    .seg button{min-height:40px}
    .icon-btn{min-height:36px;min-width:36px;width:36px;height:36px}
    input,textarea,select{font-size:16px!important}
    input:not([type=checkbox]):not([type=radio]){min-height:44px}
    /* Strips of controls slide instead of wrapping into four ragged rows. */
    nav.subtabs,.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    nav.subtabs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
    nav.subtabs button,.chips .chip{flex:none}
  }

<script>
'use strict';
const DEFAULT_WORKER_URL = 'https://mobius-profit.mobius-digital.workers.dev';
const LS = { url:'pf_worker', tok:'pf_token', act:'pf_act', tab:'pf_tab', days:'pf_days', range:'pf_range' };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* THE SCROLL-TUCK IS GONE, and so is the header it hid.
   It existed to claw back the ~110px the old top bar took from every screen.
   A side rail costs zero vertical space, so there is nothing left to tuck and
   the page no longer moves under the reader while they scroll.

   NAV DRAWER, under 980px only. The rail is off-canvas there and this opens it.
   Closing is deliberately over-served (scrim, Escape, picking a tab, and the
   viewport growing past the breakpoint) because a drawer that traps you is the
   one failure mode worse than no drawer. */
(() => {
  const B = document.body;
  const setNav = open => {
    B.classList.toggle('nav-open', open);
    const t = document.getElementById('navToggle');
    if (t) t.setAttribute('aria-expanded', open ? 'true' : 'false');
    const s = document.getElementById('navScrim');
    if (s) s.hidden = !open;
  };
  addEventListener('click', e => {
    if (e.target.closest('#navToggle')) { setNav(!B.classList.contains('nav-open')); return; }
    /* The phone tab bar's More opens the same drawer the hamburger did. */
    if (e.target.closest('#tbMore')) { setNav(!B.classList.contains('nav-open')); return; }
    const tb = e.target.closest('#tabbar button[data-t]');
    if (tb) { setNav(false); tb.dataset.grp ? navGo(tb.dataset.grp) : show(tb.dataset.t); return; }
    if (e.target.closest('#navScrim')) return setNav(false);
    /* Picking a tab or a sub-tab means you are done with the menu. */
    if (B.classList.contains('nav-open') && e.target.closest('#tabs button, #subtabs button')) setNav(false);
  });
  addEventListener('keydown', e => { if (e.key === 'Escape' && B.classList.contains('nav-open')) setNav(false); });
  /* Rotating a phone or widening a window must not leave the scrim stranded
     over a rail that is now permanently visible. */
  matchMedia('(min-width:981px)').addEventListener('change', e => { if (e.matches) setNav(false); });
})();

/* PHONE SHEETS. Locus builds each modal on the fly and appends it to <body>,
   in eight different functions across three files, so the only registration
   that cannot go stale is one that watches the body for them. Every modal
   written after today is covered without touching this line.

   The drawer closes through #navScrim rather than through setNav, which is
   private to the block above - and going through the app's own path is the
   point: nothing about closing is duplicated here.

   `fallbackClose` is a last resort only. Every modal in the app dismisses on
   a backdrop tap, which is what sheet.js fires first; this catches one that
   does not, because a sheet you cannot shut is worse than one that closes
   without resolving. */
if (window.MobiusSheet) {
  MobiusSheet.watch({
    wrap: '.modal-wrap', box: '.modal',
    media: '(max-width:720px)',
    fallbackClose: w => w.remove()
  });
  MobiusSheet.bindPanel({
    panel: '.side', watchOn: 'body', openClass: 'nav-open', axis: 'x',
    media: '(max-width:980px)',
    close: () => document.getElementById('navScrim')?.click()
  });
}

/* CHROME ON OR OFF, in one call.
   Six places used to toggle the rail, the picker, the sub-tabs and the sign-out
   button individually, in four different spellings, and every new share view
   copied whichever one it was next to. With a rail there is one more thing to
   get right - `nochrome` collapses the grid to a single column - and a view that
   forgot it would render a client's report beside an empty dark column. */
function chrome(on) {
  document.body.classList.toggle('nochrome', !on);
  const set = (sel, v) => { const el = document.querySelector(sel); if (el) el.style.display = v; };
  set('#tabs', on ? '' : 'none');
  set('#tabbar', on ? '' : 'none');   // the phone tab bar is chrome too
  set('#subtabs', 'none');            // never restored here; renderMeta owns it
  set('#clientPick', on ? '' : 'none');
  set('#btnOut', on ? '' : 'none');
  set('#roleSeg', on ? '' : 'none');
  set('#btnGuide', on ? '' : 'none');
  if (!on) set('#periodBar', 'none');
}

/* Shared Mobius session (set by /hq Google sign-in; same origin, all tools). */
function sharedSession() {
  const t = localStorage.getItem('mobius_session');
  const exp = +localStorage.getItem('mobius_session_exp') || 0;
  return t && (exp === 0 || exp > Date.now() + 60e3) ? t : null;
}

const S = {
  url: localStorage.getItem(LS.url) || DEFAULT_WORKER_URL,
  tok: localStorage.getItem(LS.tok) || sharedSession() || '',
  act: localStorage.getItem(LS.act) || 'all',
  tab: localStorage.getItem(LS.tab) || 'overview',
  days: +localStorage.getItem(LS.days) || 30,
  range: (() => { try { return JSON.parse(localStorage.getItem(LS.range)) || { preset: '30' }; } catch { return { preset: '30' }; } })(),
  /* The compare period (the hub, 2026-10-07): prev = the same number of days before the
     window, yoy = the same dates a year earlier, none. Home and the Email screen read it. */
  cmp: (() => { try { return ['prev', 'yoy', 'none'].includes(localStorage.getItem('pf_cmp')) ? localStorage.getItem('pf_cmp') : 'prev'; } catch { return 'prev'; } })(),
  accounts: [],
  /* Locus v2: the attribution model every credited number follows (top bar switch). */
  model: (() => { try { const m = localStorage.getItem('pf_model'); return ['lastPlatformClick', 'fullFirstClick', 'fullLastClick', 'linear', 'linearAll', 'platform'].includes(m) ? m : 'lastPlatformClick'; } catch { return 'lastPlatformClick'; } })(),

/* BRAND-FIRST, phase 3 (2026-10-08): S.act, localStorage pf_act and every a.act_id hold the BRAND id
   (brand_lucky_golf), never a Meta ad account. A brand's main Meta ad account is a.meta_act, null when
   it has none (SpeedIn). Anything that needs the Meta id (Ads Manager, showing the account) reads it here. */
const metaActOf = (a, m) => {
  for (const x of [a, m]) if (x && 'meta_act' in x) return x.meta_act || null;
  return /^act_\d+$/.test(a?.act_id || '') ? a.act_id : null;   // a list served before the switch: act_id was the Meta id
};
const noMetaText = a => `No Meta ad account connected for ${a?.name || 'this brand'}. Connect it in Brand settings > Integrations.`;
/* Ids saved or linked before the switch (localStorage, Slack links, bookmarks) -> the brand id. */
const LEGACY_ACT = {
  act_378146126054294: 'brand_lucky_golf', act_1033194534145987: 'brand_party_patch', act_313396960515158: 'brand_grunk_dolfer',
  act_963898971023823: 'brand_dartee_golf', act_12528825: 'brand_bonk_golf', act_952386692927446: 'brand_ice_and_gold',
  act_1352962423584020: 'brand_vetripaws', act_2964926606966267: 'brand_yak_sports', act_3217552185130501: 'brand_the_golf_sock',
  demo_harborline: 'brand_harborline_supply',
};
/** Any id -> the brand id in `list`, or null when it matches no brand there. 'all' stays 'all'. */
function resolveAct(id, list = S.accounts) {
  if (!id || id === 'all') return id;
  const has = x => list.some(a => a.act_id === x);
  if (has(id)) return id;
  if (LEGACY_ACT[id] && has(LEGACY_ACT[id])) return LEGACY_ACT[id];
  const hit = list.find(a => a.meta_act === id || a.storage_prefix === id || a.legacy_key === id);
  return hit ? hit.act_id : null;
}

async function api(path, opts = {}) {
  const res = await fetch(S.url.replace(/\/+$/,'') + path, {
    ...opts,
    headers: { 'Authorization': 'Bearer ' + S.tok,
      ...(opts.body ? { 'Content-Type': 'application/json' } : {}), ...(opts.headers||{}) },
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || ('HTTP ' + res.status));
  return j;
}

/* ---------- formatting ---------- */
const sym = cur => { try { return new Intl.NumberFormat('en-US',{style:'currency',currency:cur||'USD'}).formatToParts(1).find(p=>p.type==='currency').value; } catch { return '$'; } };
const fmtMoney = (n, cur) => n == null ? ' - ' : new Intl.NumberFormat('en-US', { style:'currency', currency: cur||'USD', maximumFractionDigits: Math.abs(n) >= 1000 ? 0 : 2 }).format(n);
const fmtK = (n, cur) => n == null ? ' - ' : Math.abs(n) >= 1000 ? (sym(cur) + (n/1000).toFixed(1) + 'K') : fmtMoney(n, cur);
const fmtX = n => n == null ? ' - ' : n.toFixed(2) + 'x';
const fmtPct = (n, d=0) => n == null ? ' - ' : (n*100).toFixed(d) + '%';
const fmtInt = n => n == null ? ' - ' : Math.round(n).toLocaleString('en-US');
const fmtSigned = (n, d=0) => n == null ? ' - ' : (n>0?'+':'') + (n*100).toFixed(d) + '%';
const ymdLocal = d => new Intl.DateTimeFormat('en-CA',{year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
const parseTs = iso => new Date(iso.replace(' ', 'T') + (/Z$|[+-]\d\d:?\d\d$/.test(iso) ? '' : 'Z'));
const fmtAgo = iso => { if (!iso) return 'never'; const m = (Date.now() - parseTs(iso).getTime())/60000; return m<60 ? `${Math.round(m)}m ago` : m<1440 ? `${Math.round(m/60)}h ago` : `${Math.round(m/1440)}d ago`; };

/** A demo session is the App Store reviewer's login: one fabricated brand,
 *  read-only. Daily Brief and Settings both go through PROXIED endpoints on the
 *  account-health worker, which has no idea about the demo password and returns 401,
 *  so those two tabs are removed rather than left to error on camera. Everything a
 *  merchant would actually use - Overview, Profit, Plan, Costs, Customers - stays. */
function applyKind() {
  if (S.kind !== 'demo') return;
  document.querySelectorAll('#tabs [data-t="brief"], #tabs [data-t="reports"], #tabs [data-t="meta"], #tabs [data-t="settings"]').forEach(el => el.remove());
  if (['brief', 'reports', 'meta', 'settings'].includes(S.tab)) S.tab = 'overview';
  if (!$('#demoNote')) {
    document.querySelector('.hd-right')?.insertAdjacentHTML('afterbegin',
      '<span id="demoNote" class="pill" title="Sample data for demonstration. No real merchant or customer data, and nothing here can be changed.">Demo · sample data</span>');
  }
}

/* ---------- boot ---------- */
async function boot() {
  const qs = new URLSearchParams(location.search);
  // The client's report archive link (?reports=token). Read-only, no sign-in.
  const repTok = qs.get('reports');
  if (repTok) return renderReportsShare(repTok);
  const adsTok = qs.get('ads');
  if (adsTok) return renderAdShare(adsTok);
  // Internal deep link from the Slack draft message (?open=reports&act=...).
  const open = qs.get('open');
  if (open && ['yesterday', 'today', 'war', 'pulse', 'answers', 'research', 'voice', 'stock', 'buying', 'drops', 'overview', 'profit', 'plan', 'brief', 'reports', 'costs', 'customers', 'settings', 'health', 'brand', 'tests', 'angles', 'studio', 'amb', 'copy', 'season', 'calc', 'google', 'tiktok', 'email', 'dash', 'store', 'channels', 'campaigns', 'adcreative', 'changes', 'meta'].includes(open)) {
    if (open === 'dash') { try { localStorage.setItem('pf_dash', /^db_[0-9a-f]{10}$/.test(qs.get('id') || '') ? qs.get('id') : ''); } catch {} }
    if (qs.get('act')) { S.act = qs.get('act'); localStorage.setItem(LS.act, S.act); }
    // New-client Slack posts open a brand straight on Brand info or Research.
    if (open === 'brand' && ['research', 'info', 'voice', 'client'].includes(qs.get('view'))) localStorage.setItem('br_view', qs.get('view') === 'info' ? 'client' : qs.get('view'));
    // A Slack draft notice names one specific day. Without carrying the date
    // across, the link opened whatever "yesterday" meant at the moment of
    // clicking - so reading the message the next day showed a different brief
    // than the one it was announcing.
    if (open === 'brief' && /^\d{4}-\d{2}-\d{2}$/.test(qs.get('date') || '')) BF.date = qs.get('date');
    S.tab = open; localStorage.setItem(LS.tab, open);
    history.replaceState(null, '', location.pathname);
  }
  const planTok = new URLSearchParams(location.search).get('plan');
  if (planTok) return renderPlanShare(planTok);
  const perfTok = new URLSearchParams(location.search).get('perf');
  if (perfTok) return renderPerfShare(perfTok);
  const seasonTok = new URLSearchParams(location.search).get('season');
  if (seasonTok) { chrome(false); return window.SeasonTab ? window.SeasonTab.renderShare(seasonTok, S.url) : ($('#main').innerHTML = '<div class="gate"><h1>Season plan unavailable</h1><p>season.js did not load. Refresh.</p></div>'); }
  const connected = new URLSearchParams(location.search).get('connected');
  if (connected) return renderConnected(connected);
  const storeTok = new URLSearchParams(location.search).get('store');
  if (storeTok) return renderStoreView(storeTok);
  if (!S.tok) return renderGate();
  setChip('…','off');
  try {
    const r = await api('/api/overview?' + rangeQ());
    S.accounts = r.accounts;
    S.kind = r.kind || 'admin';
    applyKind();
    setChip('Live','live'); paintMe();
    chrome(true);
    renderPicker();
    show(S.tab);
  } catch (e) {
    if (/unauthorized/i.test(e.message)) {
      const wasShared = S.tok && S.tok === sharedSession();
      S.tok=''; localStorage.removeItem(LS.tok);
      // Deliberately do NOT clear the shared HQ session here. If this tool rejects a
      // token HQ considers valid, the fault is this worker's, and wiping the session
      // just sends you back to HQ to mint another one that fails the same way.
      return renderGate(wasShared
        ? 'Locus could not verify your Mobius sign-in. Your HQ session is still valid - press Retry, or use a password below.'
        : 'Wrong password - try again.', wasShared);
    }
    setChip('Worker down','down');
    $('#main').innerHTML = `<div class="gate"><h1>Can't reach the worker</h1><p>${esc(e.message)}</p><button class="cta" onclick="boot()">Retry</button></div>`;
  }
}

     client and cannot stand over their shoulder to explain. Same shared helper
     the reports use, so the two cannot drift. */
  wireSalesSpend('csSvg', 'csReadout', d.rows || [], r =>
    `<b>${esc(prettyDate(r.date))}</b> &nbsp; <span style="color:#14608C;font-weight:700">revenue:</span> <b>${fmtMoney(r.sales, cur)}</b>`

/* The client picker menu. It mirrors the hidden #clientPick, which every other caller still sets; show()

function drawPick(q = '') {

}

/* The rail clips anything wider than itself (.side is overflow:hidden), which cut the profile menu's
   text off on the right. Both rail menus are pinned to the screen at the button instead, so they can be
   wider than the rail; the profile menu opens upward, the client picker downward. */
function placeRailMenu(btn, menu) {
  if (!menu) return;
  const r = btn.getBoundingClientRect(), w = Math.min(300, innerWidth - 16), left = Math.max(8, Math.min(r.left, innerWidth - w - 8));
  menu.style.position = 'fixed'; menu.style.left = left + 'px'; menu.style.right = 'auto'; menu.style.width = w + 'px'; menu.style.minWidth = '0';
  if (btn.id === 'pfMeBtn') { menu.style.top = 'auto'; menu.style.bottom = (innerHeight - r.top + 6) + 'px'; menu.style.maxHeight = (r.top - 16) + 'px'; }
  else { menu.style.bottom = 'auto'; menu.style.top = (r.bottom + 6) + 'px'; menu.style.maxHeight = (innerHeight - r.bottom - 16) + 'px'; }
  menu.style.overflowY = 'auto'; menu.style.zIndex = '80';
}

/** The two-tier help modal. `key` selects the brief; `html` is the full essay. */
function helpModalFor(key, title, html, briefOverride) {
  const b = briefOverride || PAGE_BRIEF[key];
  const brief = b ? `<div class="hb">
      <p><b>What it answers.</b> ${b.answers}</p>
      <p><b>When you open it.</b> ${b.when}</p>
      <p><b>What to do.</b> ${b.todo}</p>
    </div>` : '';
  const more = html ? `<details class="hb-more"><summary>Full detail</summary><div class="help-body">${html}</div></details>` : '';
  helpModal(title, `${brief}${more}<p class="hb-foot"><a href="#" data-gloss="1">What do these numbers mean? →</a></p>`);
}

function helpModal(title, html, opts = {}) {
  const w = document.createElement('div');
  w.className = 'modal-wrap';
  w.innerHTML = `<div class="modal" style="max-width:${opts.wide ? 760 : 580}px"><h3>${esc(title)}</h3><div class="help-body">${html}</div>
    <div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn primary" data-m="ok">Got it</button></div></div>`;
  document.body.appendChild(w);
  const done = () => { w.remove(); document.removeEventListener('keydown', k); };
  const k = e => { if (e.key==='Escape') done(); };
  document.addEventListener('keydown', k);
  w.addEventListener('mousedown', e => { if (e.target===w) done(); });
  w.querySelector('[data-m="ok"]').onclick = done;
}

/** Cole's rule: in-app modals only, never browser alert()/prompt(). */
const noteModal = (title, html) => helpModal(title, html);

/* REWRITE, WITH OR WITHOUT DIRECTION.
   Resolves to null if cancelled, or to a string (possibly empty) to go ahead.
   Empty means a straight rewrite. Whatever is typed is passed to Claude as
   direction that outranks the standing prompt - it can change emphasis, order,
   length and tone, but the worker forbids it inventing a number.
   The identical box sits behind "Rewrite with AI" on the Slack card, so neither
   surface can do something the other cannot. */
function steerModal({ title, what, cta = 'Rewrite it', current = '' }) {
  return new Promise(resolve => {
    const w = document.createElement('div');
    w.className = 'modal-wrap';
    w.innerHTML = `<div class="modal" style="max-width:560px"><h3>${esc(title)}</h3>
      <p class="hint">Claude writes ${esc(what)} again from the numbers and the Change Log. Any wording you have edited is replaced.</p>
      <label class="tiny" style="display:block;margin:14px 0 5px;font-weight:600">Anything you want changed? <span style="font-weight:400;opacity:.7">Optional</span></label>
      <textarea id="stTa" rows="3" placeholder="e.g. lead with the Google spend, and drop the hedging on Meta"
        style="width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:10px;font:inherit;font-size:13.5px;line-height:1.5"></textarea>
      <p class="tiny" style="margin:6px 0 0;opacity:.75">Leave it empty for a straight rewrite. It can change emphasis, order, length or tone - it cannot invent a number that is not in the data.</p>
      <div class="row" style="justify-content:flex-end;gap:8px;margin:14px 0 0">
        <button class="btn" data-m="no">Cancel</button><button class="btn primary" data-m="yes">${esc(cta)}</button></div></div>`;
    document.body.appendChild(w);
    const ta = w.querySelector('#stTa');
    ta.value = current || '';
    const done = v => { w.remove(); document.removeEventListener('keydown', k); resolve(v); };
    const k = e => {
      if (e.key === 'Escape') done(null);
      // Cmd/Ctrl+Enter submits, so a one-line steer never needs the mouse.
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) done(ta.value.trim());
    };
    document.addEventListener('keydown', k);
    w.addEventListener('mousedown', e => { if (e.target === w) done(null); });
    w.querySelector('[data-m="no"]').onclick = () => done(null);
    w.querySelector('[data-m="yes"]').onclick = () => done(ta.value.trim());
    // Not on a phone: focusing mid-slide throws the keyboard up over a sheet
    // that is still animating, and the sheet settles behind it.
    if (!matchMedia('(max-width:720px)').matches) setTimeout(() => ta.focus(), 30);
  });
}

function confirmModal(title, hint, cta) {
  return new Promise(resolve => {
    const w = document.createElement('div');
    w.className = 'modal-wrap';
    w.innerHTML = `<div class="modal"><h3>${esc(title)}</h3><p class="hint">${esc(hint)}</p>
      <div class="row" style="justify-content:flex-end;gap:8px;margin:14px 0 0">
        <button class="btn" data-m="no">Cancel</button><button class="btn primary" data-m="yes">${esc(cta || 'Continue')}</button></div></div>`;
    document.body.appendChild(w);
    const done = v => { w.remove(); document.removeEventListener('keydown', k); resolve(v); };
    const k = e => { if (e.key === 'Escape') done(false); };
    document.addEventListener('keydown', k);
    w.addEventListener('mousedown', e => { if (e.target === w) done(false); });
    w.querySelector('[data-m="no"]').onclick = () => done(false);
    w.querySelector('[data-m="yes"]').onclick = () => done(true);
  });
}

/* ---------- Searchable picker ----------
   `items` = [{value, label, sub}]. Renders into `host`, returns { value() }.
   Type to filter, ↑/↓/Enter/Escape, click outside to close. `onPick` fires with
   the chosen value. A native select was styled shut but the OPEN list belongs to
   the OS and cannot be touched by CSS - which is the whole reason this exists. */
function picker(host, items, { placeholder = 'Search…', empty = 'No matches', onPick } = {}) {
  let value = '', hl = -1, open = false;
  host.className = 'pk';
  host.innerHTML = `<div class="pk-in"><input type="text" placeholder="${esc(placeholder)}" autocomplete="off" role="combobox" aria-expanded="false">
    <svg class="pk-cv" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg></div>
    <div class="pk-list" role="listbox"></div>`;
  const inp = host.querySelector('input'), list = host.querySelector('.pk-list');
  const labelOf = v => items.find(i => i.value === v)?.label || '';
  let shown = items;

  const draw = () => {
    const q = (open ? inp.value : '').trim().toLowerCase();
    shown = q ? items.filter(i => (i.label + ' ' + (i.sub || '')).toLowerCase().includes(q)) : items;
    if (hl >= shown.length) hl = shown.length - 1;
    list.innerHTML = shown.length
      ? shown.map((i, n) => `<div class="pk-opt${n === hl ? ' hl' : ''}" role="option" data-v="${esc(i.value)}"
          aria-selected="${i.value === value}">${esc(i.label)}${i.sub ? `<small>${esc(i.sub)}</small>` : ''}</div>`).join('')
      : `<div class="pk-none">${esc(empty)}</div>`;
  };
  const setOpen = v => {
    open = v; host.classList.toggle('open', v); inp.setAttribute('aria-expanded', String(v));
    if (v) { inp.value = ''; hl = shown.findIndex(i => i.value === value); }
    else { inp.value = labelOf(value); }
    draw();
  };
  const choose = v => { value = v; setOpen(false); onPick?.(v); };

  inp.value = '';
  draw();
  // The whole control is the target, not just the text node. Clicking the
  // padding or the chevron did nothing, which on a control that LOOKS like a
  // dropdown reads as broken - the same class of fault as the dead-looking
  // button. Clicking while open closes it, so it toggles like a select.
  host.querySelector('.pk-in').onmousedown = e => {
    if (e.target === inp && open) return;
    e.preventDefault();
    if (open) setOpen(false); else { inp.focus(); setOpen(true); }
  };
  inp.onfocus = () => { if (!open) setOpen(true); };
  inp.oninput = () => { hl = 0; draw(); };
  inp.onkeydown = e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); if (!open) return setOpen(true);
      hl = Math.max(0, Math.min(shown.length - 1, hl + (e.key === 'ArrowDown' ? 1 : -1)));
      draw(); list.querySelector('.hl')?.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') { e.preventDefault(); if (open && shown[hl]) choose(shown[hl].value); }
    else if (e.key === 'Escape') { if (open) { e.stopPropagation(); setOpen(false); } }
  };
  list.onmousedown = e => { const o = e.target.closest('.pk-opt'); if (o) { e.preventDefault(); choose(o.dataset.v); } };
  // A click anywhere else closes it. Bound on the modal, not document, so it dies
  // with the modal rather than leaking a listener per open.
  (host.closest('.modal-wrap') || document).addEventListener('mousedown', e => {
    if (open && !host.contains(e.target)) setOpen(false);
  });
  return { value: () => value };
}

/* ---------- Add a brand ----------
   Cole, 2026-08-30: "it's not really a track for new accounts, I just want to add
   a new brand and it asks me questions - what's the brand name, what ad account,
   what's the Triple Whale link". He is right. The old flow was a table of every
   ad account the Meta login can see with a Tracked toggle on each: the shape of
   the DATA, not the shape of the JOB. This asks the four questions instead.

   The ad account is chosen, never typed. Since brand-first phase 3 (2026-10-08)
   a brand is its own record (brand id) and Meta ad accounts are connections on
   it, so a client with no Meta ads is a brand too (New client); this modal is
   only the shortcut for a Meta account Locus can already see.

   Resolves to the chosen act_id on success, null if cancelled. */
function addBrandModal(untracked, chList, onDiscover, total) {
  return new Promise(resolve => {
    const w = document.createElement('div');
    w.className = 'modal-wrap';
    const field = (label, help, control) => `<div class="ab-f">
      <label>${label}</label><p class="hint">${help}</p>${control}</div>`;

    w.innerHTML = `<div class="modal" style="max-width:520px"><h3>Add a brand</h3>
      <p class="hint" style="margin-bottom:16px">Four questions. You can change any of it later.</p>
      <div class="ab-form">
        ${field('Which Meta ad account?',
          // Say the arithmetic. An empty or short list here is USUALLY correct -
          // accounts already set up as brands are filtered out - but it is
          // indistinguishable from a broken Meta connection unless it says so.
          untracked.length
            ? `<b>${untracked.length} of your ${total ?? untracked.length} ad accounts</b> ${untracked.length === 1 ? 'is' : 'are'} not set up as a brand yet, so ${untracked.length === 1 ? 'it is' : 'those are'} what you can pick from. The rest are already brands.`
            : `<b>All ${total ?? 0} of the ad accounts Locus can see are already set up as brands</b>, so there is nothing here to add. If one is genuinely missing, it is a Meta permissions problem, not a Locus one.`,
          untracked.length
            ? `<div id="abAct"></div>
               <p class="tiny" style="margin:7px 0 0">Not seeing the account you want? <a href="#" id="abDiscover">Check Meta again</a>. Locus also does this by itself every night. If it is still missing, that account has to be assigned to the <b>Mobius Tools</b> system user in Business Manager.</p>`
            : `<button class="btn" id="abDiscover">↻ Check Meta for new accounts</button>
               <span class="tiny" id="abDiscMsg" style="margin-left:8px"></span>`)}
        ${field('Brand name', 'What you want to call them everywhere in Locus. Meta account names are often messy - this is the one clients and reports see.',
          `<input type="text" id="abName" placeholder="e.g. Bonk Golf">`)}
        ${field('Triple Whale shop', 'Their Shopify domain as Triple Whale knows it. <b>Without this there are no revenue, MER or profit numbers at all</b> - only Meta ad data.',
          `<input type="text" id="abShop" placeholder="name.myshopify.com">`)}
        ${Array.isArray(chList) ? field('Slack channels <span class="tiny" style="font-weight:400"> - optional</span>',
          'Where reporting goes. <b>Internal</b> is your team’s: drafts and alerts. <b>Client</b> is theirs: only approved briefs and reports. You can leave both and set them later.',
          `<div class="ab-two">
             <div><span class="tiny">Internal</span><div id="abInt"></div></div>
             <div><span class="tiny">Client</span><div id="abCli"></div></div>
           </div>`) : ''}
      </div>
      <p class="tiny" id="abErr" style="color:var(--bad);min-height:16px;margin:10px 0 0"></p>
      <div class="row" style="justify-content:flex-end;gap:8px;margin:6px 0 0">
        <button class="btn" data-m="no">Cancel</button>
        <button class="btn primary" data-m="yes">Add brand</button></div></div>`;
    document.body.appendChild(w);

    const $$ = s => w.querySelector(s);
    const done = v => { w.remove(); document.removeEventListener('keydown', k); resolve(v); };
    const k = e => { if (e.key === 'Escape') done(null); };
    document.addEventListener('keydown', k);
    w.addEventListener('mousedown', e => { if (e.target === w) done(null); });
    $$('[data-m="no"]').onclick = () => done(null);

    // Picking the account fills the name, because the Meta name is right often
    // enough to save typing and wrong often enough to stay editable.
    const nameIn = $$('#abName');
    const actHost = $$('#abAct');
    const actPick = actHost && picker(actHost,
      untracked.map(a => ({ value: a.act_id, label: a.name || a.act_id, sub: metaActOf(a) || a.act_id })),
      { placeholder: 'Search your ad accounts…', empty: 'No ad account matches that',
        onPick: v => {
          const n = untracked.find(a => a.act_id === v)?.name || '';
          if (n && !nameIn.dataset.touched) nameIn.value = n;
        } });
    nameIn.oninput = e => { e.target.dataset.touched = '1'; };

    const chItems = Array.isArray(chList)
      ? [{ value: '', label: ' - none for now - ' }].concat(chList.map(c =>
          ({ value: c.id, label: '#' + c.name, sub: c.member ? '' : 'the bot is not in this channel yet' })))
      : [];
    const intHost = $$('#abInt'), cliHost = $$('#abCli');
    const intPick = intHost && picker(intHost, chItems, { placeholder: 'Search channels…', empty: 'No channel matches' });
    const cliPick = cliHost && picker(cliHost, chItems, { placeholder: 'Search channels…', empty: 'No channel matches' });

    const disc = $$('#abDiscover');
    if (disc) disc.onclick = async (e) => {
      e.preventDefault();                       // it is a link when accounts exist, a button when none do
      disc.disabled = true; disc.textContent = 'Checking Meta…';
      const found = await onDiscover();
      done(null);
      // Re-open with whatever Meta just returned, so the answer lands in the
      // form rather than behind it.
      addBrandModal(found.filter(a => !a.active), chList, onDiscover, found.length).then(resolve);
    };

    $$('[data-m="yes"]').onclick = async () => {
      const err = $$('#abErr');
      const act = actPick ? actPick.value() : '';
      const name = nameIn.value.trim();
      const shop = $$('#abShop').value.trim().toLowerCase().replace(/^https?:\/\//, '').replace(/\/.*$/, '');
      if (!act) return err.textContent = untracked.length ? 'Choose which Meta ad account this brand runs on.' : 'There is no untracked ad account to add. Check Meta for new ones first.';
      if (!name) return err.textContent = 'Give the brand a name.';
      if (shop && !/^[a-z0-9][a-z0-9-]*\.myshopify\.com$/.test(shop)) {
        return err.textContent = 'The Triple Whale shop should look like name.myshopify.com';
      }
      const btn = $$('[data-m="yes"]'); btn.disabled = true; btn.textContent = 'Adding…';
      err.textContent = '';
      done({ act, name, shop, internal: intPick?.value() || '', client: cliPick?.value() || '' });
    };
  });
}
