        `No Daily Brief channel is set for ${a.name}, so it will fall back to the internal alerts channel. The brief is written for the client, so they would never see it. Set a client channel instead?`,
        'Post internally anyway');
      if (!ok) return;
    }
    tg.classList.toggle('on', on);
    try { await api('/api/client-settings', { method:'PUT', body: JSON.stringify({ act: a.act_id, brief_enabled: on }) }); a.brief_enabled = on; draw(); }
    catch (err) { noteModal('Could not save', `<p>${esc(err.message)}</p>`); tg.classList.toggle('on', !on); }
  });

  tb.addEventListener('change', async e => {
    const k = e.target.dataset.k; if (!k) return;
    const tr = e.target.closest('tr'); const a = S.accounts.find(x => x.act_id === tr.dataset.id);
    try {
      if (k === 'margin') {
        const raw = e.target.value.replace(/[^0-9.]/g, '');
        const pct = raw === '' ? null : +raw / 100;
        if (pct != null && !(pct > 0 && pct < 1)) {
          return noteModal('That margin looks wrong', '<p>Enter a margin between <b>1</b> and <b>99</b> percent, or leave it blank to use the real per-product costs from Triple Whale.</p>');
        }
        const mr = await api('/api/margin', { method:'PUT', body: JSON.stringify({ act: a.act_id, margin_pct: pct }) });
        a.margin_pct = pct;
        // The route re-grades cost health and returns the new verdict, so the
        // pill can update without another round trip.
        if (mr?.verdict) a.cost_health = { ...(a.cost_health || {}), verdict: mr.verdict };
      } else {
        await api('/api/client-settings', { method:'PUT', body: JSON.stringify({ act: a.act_id, [k]: e.target.value }) });
        a[k] = e.target.value || null;
      }
      flash(e.target);
      // Saving used to re-run boot() and repaint the whole tab, which reads as
      // the page hanging on every dropdown. The value is already persisted and
      // S.accounts is already updated, so redraw the table locally - instant,
      // no spinner - and refresh the shared snapshot in the background for the
      // other tabs. Nothing is ever left unsaved, so there is no state to warn
      // about on leaving.
      draw();
      refreshAccounts();
    } catch (err) { noteModal('Could not save', `<p>${esc(err.message)}</p>`); }
  });

  // Send time
  (async () => {
    const sel = $('#btHour'); if (!sel) return;
    const h = await loadBriefTime();
    if (run !== RUN) return;

      } catch (e) { $('#btMsg').textContent = e.message; }
    };
  })();

  // Per-client Triple Whale backfill. ONE CLIENT AT A TIME on purpose: a 430-day

  tb.addEventListener('click', async e => {
    const b = e.target.closest('[data-k="backfill"]'); if (!b) return;

    if (!a) return;
    const msg = $(`[data-bf="${a.act_id}"]`);

      msg.textContent = x.ok ? `✓ ${x.metrics} metrics, ${x.from} → ${x.to}` : (x.error || x.skipped || 'done');

        ${one ? `<br><b>Only ${esc(one.name)} is shown.</b> Switch the picker top-right to <b>All brands</b>.`

        </table></div>
        <p class="tiny" style="margin-top:10px">Switching an account on backfills 90 days on its first sync. These settings are shared with the Meta tab — one database behind the whole platform.</p></div>`;

      /* THE BUTTON LOOKED DEAD, AND ALMOST WAS. The old handler set #mtMsg and
         THEN called paint(), which replaces the whole card - destroying the span

      /** Ask Meta which ad accounts this login can reach. Returns the fresh list

            Directly assigned ad accounts: ${d.direct ?? '—'} ·
            Business Managers visible: ${d.businesses.length}${d.businesses.length ? ' (' + d.businesses.map(b => esc(b.name)).join(', ') + ')' : ''}</p>
            ${Object.keys(d.edges).length ? `<p class="tiny" style="margin:4px 0 0">${Object.entries(d.edges).map(([k, v]) => `${esc(k)}: <b>${esc(String(v))}</b>`).join(' · ')}</p>` : ''}
            ${d.errors.length ? `<p class="tiny" style="margin:4px 0 0;color:var(--bad)">${d.errors.map(x => esc(x.at + ': ' + x.error)).join(' · ')}</p>` : ''}
            ${!d.needsBusinessId ? '' : `<div style="margin:12px 0 0">
              <p style="margin:0 0 8px;font-size:13.5px"><b>One thing to paste, once.</b> Open
              <a href="https://business.facebook.com/settings/info" target="_blank" rel="noopener">Business Settings → Business info</a>
              for <b>Mobius Digital</b> and copy the <b>Business portfolio ID</b>. Then every ad account a client shares with you —
              including future clients — is picked up automatically. <b>Do not regenerate the token</b>; it is already correct.</p>
              <div class="row" style="gap:8px;margin:0">
                <input type="text" id="mbId" placeholder="e.g. 1234567890123456" style="width:220px" inputmode="numeric">
                <button class="btn primary" id="mbSave">Save</button><span class="tiny" id="mbMsg"></span>
              </div></div>`}
          </div></div>`;
          const save = $('#mbSave');
          if (save) save.onclick = async () => {
            const idv = $('#mbId').value.trim(), msg = $('#mbMsg');
            save.disabled = true; msg.textContent = 'Checking with Meta…';
            try {
              const r = await mApi('/api/meta-business', { method: 'PUT', body: JSON.stringify({ id: idv }) });
              msg.textContent = `Saved: ${r.name} — finding accounts…`;
              // Run discovery straight away: the whole point of the id is what it
              // unlocks, and making him press a second button to find out is the
              // "control that does nothing" problem again.
              const next = await discover();
              msg.textContent = `${r.name}: ${next.length} ad accounts now visible`;
            } catch (e) { save.disabled = false; msg.textContent = e.message; }
          };
        } catch (err) {
          box.innerHTML = `<div class="notice warn" style="margin:10px 0 0">⚠️<div>Couldn't check: ${esc(err.message)}</div></div>`;
        }
      };

      $('#mtAdd').onclick = async () => {
        const picked = await addBrandModal(accounts.filter(a => !a.active), chList, discover, accounts.length);
        if (!picked) return;
        const msg0 = $('#mtMsg'); if (msg0) msg0.textContent = `Adding ${picked.name}…`;
        try {
          // One call sets up the brand itself; channels are a separate table on
          // the profit worker, so only call it when something was actually chosen.
          await mApi(`/api/accounts/${picked.act}`, { method: 'PUT', body: JSON.stringify({
            active: true, name: picked.name, ...(picked.shop ? { tw_shop: picked.shop } : {}),
          }) });
          if (picked.internal || picked.client) {
            await api('/api/client-settings', { method: 'PUT', body: JSON.stringify({
              act: picked.act, slack_channel: picked.internal || null, brief_channel: picked.client || null,
            }) });
          }
          const row = accounts.find(a => a.act_id === picked.act);
          if (row) { row.active = true; row.name = picked.name; if (picked.shop) row.tw_shop = picked.shop; }
          paint(accounts);
          await refreshAccounts();
          noteModal(`${picked.name} is set up`, `<p>Two things happen next, both on their own:</p>
            <ul style="margin:8px 0 0;padding-left:18px;font-size:14px;line-height:1.55">
              <li>Meta backfills <b>90 days</b> of ad history on the first sync.</li>
              ${picked.shop ? '<li>Triple Whale starts filling in revenue, so profit numbers appear once it has synced.</li>'
                            : '<li style="color:var(--bad)"><b>No Triple Whale shop was set</b>, so there will be no revenue, MER or profit for this brand until you add one in the table.</li>'}
            </ul>
            <p style="margin-top:12px">Then <b>agree a monthly number on the Plan tab</b> — the daily brief and both reports measure every day against it, so nothing can report until it exists.</p>`);
        } catch (e) {
          noteModal('Could not add the brand', `<p>${esc(e.message)}</p><p class="hint">Nothing was saved. Try again, or add it from the table below.</p>`);
        }
      };
      const rowAcct = el => accounts.find(x => x.act_id === el.closest('tr').dataset.id);
      holder.querySelectorAll('[data-mk="active"]').forEach(tg => tg.onclick = async () => {
        const a = rowAcct(tg); const on = !tg.classList.contains('on');
        tg.classList.toggle('on', on);
        try { await mApi(`/api/accounts/${a.act_id}`, { method: 'PUT', body: JSON.stringify({ active: on }) }); a.active = on; paint(accounts); }
        catch (e) { tg.classList.toggle('on', !on); noteModal('Could not save', `<p>${esc(e.message)}</p>`); }
      });
      holder.querySelectorAll('[data-mk="tw_shop"]').forEach(inp => inp.onchange = async () => {
        const a = rowAcct(inp);
        try { await mApi(`/api/accounts/${a.act_id}`, { method: 'PUT', body: JSON.stringify({ tw_shop: inp.value.trim() }) }); a.tw_shop = inp.value.trim(); flash(inp); }
        catch (e) { noteModal('Could not save', `<p>${esc(e.message)}</p>`); }
      });
      holder.querySelectorAll('[data-mk="sync"]').forEach(b => b.onclick = async () => {
        const a = rowAcct(b); const msg = $(`[data-ms="${a.act_id}"]`);
        b.disabled = true; if (msg) msg.textContent = 'syncing…';
        try { const r = await mApi(`/api/sync?act=${a.act_id}`, { method: 'POST' }); if (msg) msg.textContent = r.result?.error ? r.result.error : 'done ✓'; }
        catch (e) { if (msg) msg.textContent = e.message; }
        b.disabled = false;
      });
    };
    // meta.js keeps its own closure, so it only has a token if someone hands it
    // one. render() does that for the Meta tab; this call path never did.
    window.MetaTab.setToken(S.tok);
    try { await window.MetaTab.ensureAccounts(true); if (run === RUN) paint(window.MetaTab.accounts()); }
    catch (e) { holder.innerHTML = `<div class="card"><span style="color:var(--bad)">Couldn't load Meta accounts: ${esc(e.message)}</span></div>`; }
  })();

  // Connections. Listeners go on the card, never on #main - #main survives every
  // render, so a listener there stacks one copy per visit.
  (async () => {
    const html = await connectionsCard(run);
    if (html == null || run !== RUN) return;
    const host = $('#connCard'); if (!host) return;
    host.innerHTML = html;

    host.addEventListener('click', async e => {
      const sync = e.target.closest('[data-sync]');
      if (sync) {
        const act = sync.dataset.sync, msg = $(`[data-msg="${act}"]`);
        sync.disabled = true; if (msg) msg.textContent = 'pulling from Shopify…';
        try {
          const r = await api(`/api/cohort-sync?act=${encodeURIComponent(act)}`, { method: 'POST' });
          const x = (r.results && r.results[0]) || {};
          if (msg) msg.textContent = x.error ? x.error : x.skipped ? x.skipped : `✓ ${x.months} cohort months`;
          if (!x.error) await inPlace(async () => { await boot(); show('settings'); });
        } catch (err) { if (msg) msg.textContent = err.message; }
        sync.disabled = false;
        return;
      }
      const b = e.target.closest('[data-copy]'); if (!b) return;
      const msg = $(`[data-msg="${b.closest('tr').dataset.act}"]`);
      try { await navigator.clipboard.writeText(b.dataset.copy); if (msg) msg.textContent = 'copied \u2713'; }
      catch { noteModal('Copy the install link', `<p>Send this to the client:</p><p><code style="font-size:12px;word-break:break-all">${esc(b.dataset.copy)}</code></p>`); }
      setTimeout(() => { if (msg) msg.textContent = ''; }, 2500);
    });

    host.addEventListener('change', async e => {
      const sel = e.target.closest('[data-map]'); if (!sel || !sel.value) return;
      const shop = sel.dataset.map, msg = $(`[data-mapmsg="${shop}"]`);
      if (msg) msg.textContent = 'saving\u2026';
      try {
        await api('/api/connections/map', { method: 'POST', body: JSON.stringify({ shop, act: sel.value }) });
        if (msg) msg.textContent = 'mapped \u2713';
        await inPlace(async () => { await boot(); show('settings'); });
      } catch (err) { if (msg) msg.textContent = err.message; }
    });
  })();

  api('/api/slack-channels').then(r => { if (run !== RUN) return; chList = r.channels; draw(); })
    .catch(err => { if (run !== RUN) return; chList = 'error'; draw();
      $('#main .tiny').insertAdjacentHTML('beforeend', ` <span style="color:var(--bad)">Couldn't list Slack channels (${esc(err.message)}) — paste channel IDs instead.</span>`); });
}

boot();
</script>
</body>
</html>
