# Mobius Profit — Shopify app configuration.
#
# `shopify app deploy` pushes THIS file to the Partner Dashboard: scopes, redirect
# URLs and webhook subscriptions all live here, not in a dashboard form.
#
# WARNING: `shopify app config link` PULLS the remote config down and OVERWRITES
# this file with it. Only run it on a fresh clone, and re-check every value below
# afterwards — it has already blanked the scopes and redirect URLs once.
#
# Learn more: https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "a204d4974bccc5aacf66c3f723fb5652"
name = "Mobius Profit"
handle = "mobius-profit"

# Where a merchant lands when they open the app. Our install route reads ?shop=
# and kicks off the OAuth grant.
application_url = "https://mobius-profit.mobius-digital.workers.dev/shopify/install"

# MUST stay false. The worker implements the standalone authorization-code grant.
# Marking the app embedded makes Shopify expect token exchange plus App Bridge,
# which fails in a way that does not point back here.
embedded = false

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "https://mobius-profit.mobius-digital.workers.dev/shopify/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "https://mobius-profit.mobius-digital.workers.dev/shopify/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "https://mobius-profit.mobius-digital.workers.dev/shopify/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

  [[webhooks.subscriptions]]
  uri = "https://mobius-profit.mobius-digital.workers.dev/shopify/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

[access_scopes]
# Must match SHOPIFY_SCOPES in worker/src/worker.js exactly — Shopify compares the
# two at install and re-prompts on a mismatch. read_reports is what grants
# shopifyqlQuery, which is the only way to get customers by first-order month.
scopes = "read_orders,read_customers,read_products,read_reports"
optional_scopes = [ ]

# true = classic OAuth (authorization code grant), which is what the worker does.
# false turns on Shopify managed installation, which is embedded-app only.
use_legacy_install_flow = true

[auth]
redirect_urls = [ "https://mobius-profit.mobius-digital.workers.dev/shopify/callback" ]
