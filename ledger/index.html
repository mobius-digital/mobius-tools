<!DOCTYPE html>
<html lang="en" data-app="ledger">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mobius Ledger</title>
<meta name="description" content="Money in, money out, month close and the CPA pack · Mobius Digital's internal finance tool.">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/ledger-round-32.png">

     class-gated rules win the ties they are meant to win. -->

<body>

<aside class="side no-print" aria-label="Ledger">
  <a class="brand" href="../hq/" title="Mobius HQ"><img src="../icons/ledger-round-192.png" alt=""><span><b>Ledger</b><small>Mobius Digital</small></span></a>
  <nav id="nav"></nav>
  <nav id="navPin" style="flex:none;padding:8px 12px"></nav>
  <div class="foot">
    <div class="who"><span class="av" id="whoAv">M</span><span class="meta" style="min-width:0"><span class="nm" id="whoName">Mobius</span>
      <span class="st"><span class="dot" id="connChip" data-s="off"></span><span id="connText">Connecting</span></span></span></div>
    <button class="askbtn" onclick="AskUI.open()" title="Ask the Controller (Ctrl+K)" style="margin:0 0 8px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 4.5 16.8L21 21l-1.2-4.5A9 9 0 0 0 12 3Z"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3 2.45V13"/><path d="M12.5 16h.01"/></svg>Ask the Controller</button>
    <div class="foot-row"><button id="themeBtn" onclick="toggleTheme()" title="Switch light and dark"></button>
      <button onclick="signOut()" title="Sign out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg><span class="lbl-t">Sign out</span></button></div>
  </div>
</aside>

<div class="mtop no-print"><img src="../icons/ledger-round-192.png" alt=""><b>Ledger</b><span class="spacer"></span><span class="dot" id="connChipM" data-s="off"></span><span class="tiny" id="connTextM"></span></div>

<main id="main"></main>


<button id="fab" class="fab no-print" onclick="openAddSheet()" aria-label="Add a transaction or receipt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<nav id="tabbar" class="tabbar no-print" aria-label="Sections"></nav>
<div class="sheet no-print" id="sheet" role="dialog" aria-label="More"><div class="grab"></div><div id="sheetBody"></div></div>

<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>

<footer class="no-print">Mobius Ledger · net income = revenue − expenses − Stripe fees. The app never moves money: it works out the split, you make the transfers.
  <span style="display:block;margin-top:6px"><a href="privacy/">Privacy policy</a> · <a href="security/">Security policy</a></span></footer>

<script>
'use strict';
/* ================= config / state ================= */
const DEFAULT_WORKER_URL = 'https://mobius-ledger.mobius-digital.workers.dev';
const LS = { url:'ledger_worker', tok:'ledger_token', month:'ledger_month' };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Shared Mobius session (set by /hq Google sign-in; same origin, all tools). */
function sharedSession() {
  const t = localStorage.getItem('mobius_session');
  const exp = +localStorage.getItem('mobius_session_exp') || 0;
  return t && (exp === 0 || exp > Date.now() + 60e3) ? t : null;
}

const nowMonth = () => new Date().toISOString().slice(0, 7);
let S = {
  url: localStorage.getItem(LS.url) || DEFAULT_WORKER_URL,
  tok: localStorage.getItem(LS.tok) || sharedSession() || '',
  view: 'overview',
  month: nowMonth(),   // always open on the month it actually is
  boot: null, summary: null, txns: null, txnMonth: null,
  filter: 'all', packData: null, report: null, reportMonth: null,
  sel: new Set(),   // transaction ids ticked for bulk editing
  q: '',            // vendor / note search
};

async function api(path, opts = {}) {
  const res = await fetch(S.url.replace(/\/+$/,'') + path, {
    ...opts,
    headers: { 'Authorization': 'Bearer ' + S.tok,
      ...(opts.body ? { 'Content-Type': 'application/json' } : {}), ...(opts.headers||{}) },
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || ('HTTP ' + res.status));
  return j;
}

/* ================= formatting ================= */
const fmt$ = n => (n < 0 ? '−$' : '$') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtK = n => (n < 0 ? '−$' : '$') + (Math.abs(n) >= 1000 ? (Math.abs(n)/1000).toFixed(1).replace(/\.0$/,'') + 'K' : Math.abs(n).toFixed(0));
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const moName = m => MONTHS[+m.slice(5,7)-1] + ' ' + m.slice(0,4);
const moShort = m => MONTHS[+m.slice(5,7)-1].slice(0,3);
const addMonths = (m, n) => { const d = new Date(m + '-15T12:00:00Z'); d.setUTCMonth(d.getUTCMonth()+n); return d.toISOString().slice(0,7); };
const fmtDate = d => new Date(d + 'T12:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric'});
const moState = m => (S.boot?.months || []).find(x => x.month === m)?.status || 'open';

/* ================= boot ================= */
async function boot() {
  if (!S.tok) return renderGate();
  setChip('…', 'off');
  try {
    S.boot = await api('/api/boot');
    S.renderedRevision = S.boot.revision;
    // idempotent: make sure this month's expected recurring rows exist
    if (moState(nowMonth()) !== 'closed') await api('/api/recurring', { method:'POST', body: JSON.stringify({ month: nowMonth() }) }).catch(()=>{});
    setChip('Live', 'live');
    show(S.view);
  } catch (e) {
    if (/unauthorized/i.test(e.message)) {
      const wasShared = S.tok && S.tok === sharedSession();
      S.tok=''; localStorage.removeItem(LS.tok);
      if (wasShared) { ['mobius_session','mobius_session_email','mobius_session_exp'].forEach(k=>localStorage.removeItem(k)); return renderGate('Your session expired · sign in again.'); }
      return renderGate('Wrong password · try again.');
    }
    setChip('Worker down', 'down');
    $('#main').innerHTML = `<div class="gate"><h1>Can't reach the books</h1><p>${esc(e.message)}</p>
      <button class="cta" onclick="boot()">Retry</button></div>`;
  }
}
function setChip(t, s){
  for (const [d, x] of [['#connChip','#connText'],['#connChipM','#connTextM']]) { $(d).dataset.s = s; $(x).textContent = t; }
  document.body.classList.toggle('signed-out', t === 'Signed out');
}

function renderGate(err) {
  setChip('Signed out','off');
  $('#main').innerHTML = `
  <div class="gate card">
    <h1>Mobius Ledger</h1>
    <p>Money in, money out, and the end-of-month report card. Sign in once at Mobius HQ and every internal tool opens.</p>
    <a class="cta" href="../hq/?next=/ledger/">Continue with Google</a>
    ${err ? `<div class="err">${esc(err)}</div>` : ''}
    <details style="margin-top:16px"><summary style="font-size:12px;color:var(--muted);cursor:pointer">Use an administrator token</summary>
      <label>Administrator token</label><input id="gTok" type="password" placeholder="administrator token">
      <button class="cta" id="gGo" style="margin-top:12px">Sign in</button>
      <label>Worker URL</label><input id="gUrl" value="${esc(S.url)}">
    </details>
  </div>`;
  const go = () => {
    S.url = ($('#gUrl').value || '').trim() || DEFAULT_WORKER_URL;
    S.tok = $('#gTok').value.trim();
    localStorage.setItem(LS.url, S.url); localStorage.setItem(LS.tok, S.tok);
    boot();
  };
  $('#gGo').onclick = go;
  $('#gTok').addEventListener('keydown', e => { if (e.key==='Enter') go(); });
}

/* ================= nav ================= */
/* A left rail on desktop, an icon rail on tablets, a thumb bar on phones.
   Grouped the way the month actually runs: see it, work it, read it, close it. */
const VIEWS = [
  ['overview', 'Overview', ''],
  ['txns', 'Transactions', 'Money'],
  ['receipts', 'Receipts', 'Money'],
  ['dashboards', 'Dashboards', 'Insights'],
  ['reports', 'Reports', 'Insights'],
  ['close', 'Close month', 'Books'],
];
/* Old names still route: the Home tab became Overview, Forecast lives in Reports. */
const PARENT = { dash:'overview', forecast:'reports' };
/* The badge and the Needs-you list must agree: uncategorized rows anywhere,
   plus missing receipts in OPEN months (a closed month's missing receipts
   block nothing and would drown the number in history). */
function needsCount(){
  const closed = new Set((S.boot?.months||[]).filter(m=>m.status==='closed').map(m=>m.month));
  return Object.entries(S.boot?.flags||{}).reduce((s,[m,f]) =>
    s + (+f.review||0) + (closed.has(m) ? 0 : (+f.noReceipt||0)), 0);
}
const svg = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const TAB_ICONS = {
  overview: svg('<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>'),
  txns: svg('<path d="M7 4 3 8l4 4"/><path d="M3 8h13"/><path d="m17 20 4-4-4-4"/><path d="M21 16H8"/>'),
  receipts: svg('<path d="M5 3h14v18l-2.5-1.5L14 21l-2-1.5L10 21l-2.5-1.5L5 21z"/><path d="M9 8h6M9 12h6M9 16h3"/>'),
  dashboards: svg('<path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>'),
  reports: svg('<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/><path d="M9 17v-3M12 17v-6M15 17v-4"/>'),
  close: svg('<circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/>'),
  settings: svg('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
  more: svg('<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>'),
  sun: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'),
  moon: svg('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'),
  out: svg('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/>'),
  plus: svg('<path d="M12 5v14M5 12h14"/>'),
  upload: svg('<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>'),
  alert: svg('<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>'),
  check: svg('<path d="m5 13 4 4L19 7"/>'),
  tag: svg('<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/>'),
  clock: svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  bank: svg('<path d="M3 10h18L12 4z"/><path d="M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 21h18"/>'),
  users: svg('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/>'),
  sliders: svg('<path d="M4 8h9M17.5 8H20M4 16h2.5M11 16h9"/><circle cx="15" cy="8" r="2.2"/><circle cx="8.5" cy="16" r="2.2"/>'),
  plug: svg('<path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0z"/><path d="M12 18v4"/>'),
  bell: svg('<path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>'),
  shield: svg('<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>'),
  store: svg('<path d="M4 7h16l-1 13H5z"/><path d="M9 7a3 3 0 0 1 6 0"/>'),
};
function whoName(){
  const e = localStorage.getItem('mobius_session_email');
  return e ? e.split('@')[0].replace(/[._]/g,' ').replace(/\b\w/g, c => c.toUpperCase()) : 'Administrator';
}
function sideHTML(){
  const rv = needsCount();
  const on = PARENT[S.view] || S.view;
  let lastGroup = null, out = '';
  for (const [id, label, group] of VIEWS) {
    if (group !== lastGroup) {
      if (group) out += `<div class="grp-h lbl">${group}</div><div class="grp-sep"></div>`;
      lastGroup = group;
    }
    out += `<button class="nv ${on===id?'on':''}" onclick="show('${id}')" ${on===id?'aria-current="page"':''}>${TAB_ICONS[id]}<span>${label}</span>${id==='txns'&&rv?`<span class="bdg">${rv}</span>`:''}</button>`;
  }
  return out;
}
function paintNav(){
  const on = PARENT[S.view] || S.view;
  $('#nav').innerHTML = sideHTML();
  $('#navPin').innerHTML = `<button class="nv ${on==='settings'?'on':''}" onclick="show('settings')">${TAB_ICONS.settings}<span>Settings</span></button>`;
  $('#tabbar').innerHTML = tabbarHTML();
  $('#sheetBody').innerHTML = sheetHTML();
  const dark = document.documentElement.dataset.theme === 'dark';
  $('#themeBtn').innerHTML = `${dark ? TAB_ICONS.sun : TAB_ICONS.moon}<span class="lbl-t">${dark ? 'Light' : 'Dark'}</span>`;
  $('#whoName').textContent = whoName();
  $('#whoAv').textContent = whoName().slice(0,1);
}
/* The phone bar is chosen by thumb: the four screens used daily, the rest behind More. */
const PHONE_TABS = ['overview','txns','dashboards','reports'];
function tabbarHTML(){
  const rv = needsCount();
  const on = PARENT[S.view] || S.view;
  const lab = { overview:'Overview', txns:'Money', dashboards:'Dashboards', reports:'Reports' };
  return PHONE_TABS.map(id =>
    `<button class="${on===id?'on':''}" onclick="show('${id}')">${TAB_ICONS[id]}<span>${lab[id]}</span>${id==='txns'&&rv?`<span class="bdg">${rv}</span>`:''}</button>`).join('')
    + `<button class="${PHONE_TABS.includes(on)?'':'on'}" onclick="openSheet()">${TAB_ICONS.more}<span>More</span></button>`;
}
function sheetHTML(){
  const on = PARENT[S.view] || S.view;
  const dark = document.documentElement.dataset.theme === 'dark';
  return [['receipts','Receipts'],['close','Close month'],['settings','Settings']].map(([id,l]) =>
    `<button class="${on===id?'on':''}" onclick="show('${id}')">${TAB_ICONS[id]}${l}</button>`).join('')
    + `<button onclick="toggleTheme();openSheet()">${dark?TAB_ICONS.sun:TAB_ICONS.moon}${dark?'Light mode':'Dark mode'}</button>`
    + `<button onclick="closeSheet();AskUI.open()">${TAB_ICONS.more}Ask the Controller</button>`
    + `<button onclick="signOut()">${TAB_ICONS.out}Sign out</button>`;
}
/* Phones: adding things lives under the thumb, not at the top of the page. */
function openAddSheet(){
  const closed = moState(S.month) === 'closed';
  $('#sheetBody').innerHTML = `<div class="lbl" style="padding:2px 10px 6px">Add to ${moName(S.month)}</div>
    <button onclick="closeSheet();addModal()" ${closed ? 'disabled' : ''}>${TAB_ICONS.plus}Add a transaction${closed ? ' (month closed)' : ''}</button>
    <button onclick="closeSheet();dropPick()">${TAB_ICONS.upload}Upload receipts</button>
    <button onclick="closeSheet();importModal()" ${closed ? 'disabled' : ''}>${TAB_ICONS.txns}Import a bank CSV</button>`;
  $('#sheet').classList.add('on'); $('#scrim').classList.add('on');
}
function openSheet(){ $('#sheetBody').innerHTML = sheetHTML(); $('#sheet').classList.add('on'); $('#scrim').classList.add('on'); }
function closeSheet(){ const s = $('#sheet'); if (s?.classList.contains('on')) { s.classList.remove('on'); if (!$('#modal').classList.contains('on')) $('#scrim').classList.remove('on'); } }
function toggleTheme(){
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('ledger_theme', next); } catch(e){}
  paintNav();
  if (S.boot && ['overview','dashboards','reports'].includes(S.view)) show(S.view);   // charts read the palette when drawn
}
function signOut(){
  [LS.tok,'mobius_session','mobius_session_email','mobius_session_exp'].forEach(k => localStorage.removeItem(k));
  S.tok = ''; location.reload();
}
function show(view){
  if (view === 'dash') view = 'overview';
  if (view === 'forecast') { RP.tab = 'cash'; view = 'reports'; }
  S.view = view;
  S.rt = (S.rt || 0) + 1;   // every render carries a ticket; only the newest paints
  closeSheet(); killCharts();
  $('#main').className = '';
  document.body.dataset.view = view;
  paintNav();
  window.scrollTo(0, 0);
  ({overview:renderOverview, txns:renderTxns, receipts:renderReceipts, close:renderClose,
    dashboards:renderDashboards, reports:renderReports, settings:renderSettings}[view] || renderOverview)();
}
/* A render that awaited the network while you moved on must not paint over
   where you went. Checked immediately before each screen writes itself. */
const stale = my => S.rt !== my;
/* Changing the month and going somewhere is ONE render. Calling this and then
   show() separately raced two async renders against each other, and the slower
   one painted over the faster one, which is how "Close August" silently
   dumped you back on the dashboard. */
function setMonth(m, view){ S.month = m; localStorage.setItem(LS.month, m); S.txns=null; show(view || S.view); }
/* Every month a month could be picked in · whatever has data, plus every
   month of the current year so the app rolls forward on its own. */
function allMonths(){
  const seen = new Set([...(S.boot?.months||[]).map(x=>x.month), ...Object.keys(S.boot?.flags||{})]);
  const y = nowMonth().slice(0,4);
  for (let i = 1; i <= 12; i++) seen.add(`${y}-${String(i).padStart(2,'0')}`);
  return [...seen].filter(m => m <= nowMonth() || (S.boot?.flags||{})[m]).sort();
}
/* ONE control for choosing a month, used by Transactions and Reports alike:
   arrows to step, a list to jump. The list is grouped by year, so 2027 adds
   a heading rather than making it longer to scroll. */
function monthPicker(cur, fn){
  const byYear = {};
  for (const m of [...new Set([...allMonths(), cur])].sort()) (byYear[m.slice(0,4)] ||= []).push(m);
  const groups = Object.entries(byYear).sort().map(([y, ms]) =>
    `<optgroup label="${y}">${ms.map(m =>
      `<option value="${m}" ${m===cur?'selected':''}>${MONTHS[+m.slice(5,7)-1]}</option>`).join('')}</optgroup>`).join('');
  return `<button onclick="${fn}('${addMonths(cur,-1)}')" aria-label="Previous month">‹</button>
    <select class="mo-sel" onchange="${fn}(this.value)" aria-label="Month">${groups}</select>
    <button onclick="${fn}('${addMonths(cur,1)}')" aria-label="Next month">›</button>`;
}
function setReportMonth(m){ S.reportMonth = m; renderReports(); }
/* Plain digits, no dollar sign or comma · what a bank's amount field wants. */
async function copyAmt(el, v){
  const txt = Number(v).toFixed(2);
  try { await navigator.clipboard.writeText(txt); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e2) {}
    ta.remove();
  }
  el.classList.add('copied');
  clearTimeout(el.__t);
  el.__t = setTimeout(() => el.classList.remove('copied'), 1400);
  flash('Copied ' + txt);
}
function monthNav(){
  const st = moState(S.month);
  return `<div class="mo-nav no-print">

/* Change against a comparison. For a cost, going up is the bad direction. */
function deltaHTML(cur, prev, label = '', cost = false){
  if (prev == null || !isFinite(prev)) return label ? `<span>${label}</span>` : '';
  const d = cur - prev;
  if (Math.abs(d) < 0.5) return `<span class="delta flat">level</span> <span>${label}</span>`;
  const p = Math.abs(prev) >= 100 ? ` (${Math.round(Math.abs(d) / Math.abs(prev) * 100)}%)` : '';
  return `<span class="delta ${d > 0 ? 'up' : 'down'}${cost ? ' cost' : ''}">${d > 0 ? '▲' : '▼'} ${money0(Math.abs(d))}${p}</span> <span>${label}</span>`;

/* Estimated-tax calendar (federal): the date each quarter's payment is due. */
const EST_DUE = y => [[`${y}-01`,`${y}-03`,`Apr 15, ${y}`],[`${y}-04`,`${y}-05`,`Jun 15, ${y}`],[`${y}-06`,`${y}-08`,`Sep 15, ${y}`],[`${y}-09`,`${y}-12`,`Jan 15, ${+y+1}`]];

/* ================= transactions ================= */
async function loadTxns(){
  if (S.txns && S.txnMonth === S.month) return;
  S.txns = (await api('/api/transactions?month=' + S.month)).transactions;
  // ids are month-scoped, so a stale selection would act on rows you can't see
  if (S.txnMonth !== S.month) S.sel.clear();
  S.txnMonth = S.month;
}
const FILTERS = [['all','All'],['in','Money in'],['out','Expenses'],['transfer','Transfers'],['expected','Expected'],['needs','Needs you']];
/* "Needs you" is the one attention bucket: uncategorized OR missing a receipt.
   Two amber problems, one place to clear them. */
const needsYou = t => (t.status==='review' && !t.expected)
  || (t.type==='out' && !t.expected && !t.receipt_key && !t.receipt_skip);
function txnRows(){
  return (S.txns||[]).filter(t => {
    if (S.filter==='in') return t.type==='in';
    if (S.filter==='transfer') return t.type==='transfer';
    if (S.filter==='out') return t.type==='out'||t.type==='fee';
    if (S.filter==='expected') return t.expected===1;
    if (S.filter==='needs' || S.filter==='review' || S.filter==='norcpt') return needsYou(t);
    return true;
  }).sort((a,b) => {
    // in the attention view, the rows waiting on a category float to the top
    if (S.filter==='needs' || S.filter==='review' || S.filter==='norcpt') {
      const ar = a.status==='review' && !a.expected ? 0 : 1;
      const br = b.status==='review' && !b.expected ? 0 : 1;
      if (ar !== br) return ar - br;
    }
    return 0;
  }).filter(t => {
    const q = (S.q||'').trim().toLowerCase();
    if (!q) return true;
    return (t.vendor||'').toLowerCase().includes(q)
        || (t.note||'').toLowerCase().includes(q)
        || (t.tax_cat||'').toLowerCase().includes(q)
        || (t.bucket||'').toLowerCase().includes(q);
  });
}

/* ---- dropdown that matches the rest of the app ----
   Native <select> popups are drawn by the operating system and ignore CSS
   entirely, so anywhere the list is actually seen we use this instead: a
   button, and a panel appended to <body> and positioned with fixed
   coordinates, which keeps it out of reach of the table's overflow clipping. */
const MSEL = { open: null };
function mselHTML(id, value, options, { placeholder = 'Select…', unset = false, width = '' } = {}) {
  const label = value || placeholder;
  MSEL[id] = { value, options };
  return `<span class="msel"><button type="button" id="${id}" class="msel-btn${unset && !value ? ' unset' : ''}"
    ${width ? `style="min-width:${width}"` : ''} title="${esc(label)}"
    onclick="mselOpen(event,'${id}')">${esc(label)}</button></span>`;
}
function mselClose(){
  if (!MSEL.open) return;
  MSEL.open.panel.remove();
  MSEL.open.btn?.classList.remove('open');
  MSEL.open = null;
  document.removeEventListener('keydown', mselKey, true);
}
function mselKey(e){
  if(e.key==='Escape'){e.preventDefault();e.stopPropagation();MSEL.open?.btn?.focus();mselClose();return;}
  const opts=[...(MSEL.open?.panel.querySelectorAll('.msel-opt')||[])]; if(!opts.length)return;
  let i=opts.indexOf(document.activeElement);
  if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)) {
    e.preventDefault();i=e.key==='Home'?0:e.key==='End'?opts.length-1:(i+(e.key==='ArrowDown'?1:-1)+opts.length)%opts.length;opts[i].focus();
  } else if((e.key==='Enter'||e.key===' ')&&i>=0){e.preventDefault();opts[i].click();}
}
function mselOpen(ev, id){
  ev.stopPropagation();
  const btn = document.getElementById(id);
  const wasMine = MSEL.open && MSEL.open.id === id;
  mselClose();
  if (wasMine) return;                       // clicking the button again closes
  const cfg = MSEL[id]; if (!cfg) return;
  const panel = document.createElement('div');
  panel.className = 'msel-panel'; panel.setAttribute('role','listbox'); panel.setAttribute('aria-label',btn.title || 'Category');
  panel.innerHTML = cfg.options.map(o => {
    const v = typeof o === 'string' ? o : o.value;
    const t = typeof o === 'string' ? o : o.label;
    return `<div class="msel-opt${v === cfg.value ? ' sel' : ''}${v === '' ? ' none' : ''}"
      tabindex="-1" role="option" aria-selected="${v === cfg.value}" data-v="${esc(v)}">${esc(t)}</div>`;
  }).join('');
  document.body.appendChild(panel);
  const r = btn.getBoundingClientRect();
  panel.style.minWidth = Math.max(r.width, 220) + 'px';
  // flip above the button when there is not room below
  const h = panel.offsetHeight;
  panel.style.top = (r.bottom + 6 + h > innerHeight && r.top - 6 - h > 0
    ? r.top - 6 - h : Math.min(r.bottom + 6, innerHeight - h - 8)) + 'px';
  panel.style.left = Math.max(8, Math.min(r.left, innerWidth - panel.offsetWidth - 8)) + 'px';
  btn.classList.add('open');
  MSEL.open = { id, btn, panel };
  (panel.querySelector('.sel') || panel.firstElementChild)?.focus();
  panel.onclick = e => {
    const opt = e.target.closest('.msel-opt'); if (!opt) return;
    e.stopPropagation();
    const v = opt.dataset.v;
    mselClose();
    MSEL[id].value = v;
    btn.textContent = v || 'Select…'; btn.focus();
    (MSEL[id].onPick || (()=>{}))(v, btn);
  };
  document.addEventListener('keydown', mselKey, true);
}
document.addEventListener('click', mselClose);
addEventListener('resize', mselClose);
/* Scrolling INSIDE the open panel is how you reach the lower options,
   only a scroll of the page behind it should close the dropdown. */
addEventListener('scroll', e => {
  if (MSEL.open && MSEL.open.panel.contains(e.target)) return;
  mselClose();
}, true);

/* ---- every native picker, replaced ----
   A <select>, <input type=month> or <input type=date> anywhere in the app gets
   an app-drawn button and panel. The original element stays in the page,
   hidden, so its id, value and onchange keep working: a pick sets its value
   and fires a real change event. The OS-drawn list and calendar never show. */
const ENH = new WeakSet();
function panelAt(btn, panel){
  document.body.appendChild(panel);
  const r = btn.getBoundingClientRect();
  panel.style.minWidth = Math.max(r.width, 200) + 'px';
  const h = panel.offsetHeight;
  panel.style.top = (r.bottom + 6 + h > innerHeight && r.top - 6 - h > 0 ? r.top - 6 - h : Math.min(r.bottom + 6, innerHeight - h - 8)) + 'px';
  panel.style.left = Math.max(8, Math.min(r.left, innerWidth - panel.offsetWidth - 8)) + 'px';
  btn.classList.add('open');
  MSEL.open = { id: null, btn, panel };
  document.addEventListener('keydown', mselKey, true);
}
function fire(el){ el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new Event('change', { bubbles: true })); }
function selLabel(sel){ const o = sel.options[sel.selectedIndex]; return o ? o.textContent : 'Select…'; }
function enhanceSelect(sel){
  if (ENH.has(sel) || sel.multiple) return;
  ENH.add(sel);
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'msel-btn dsel ' + (sel.className || '');
  btn.style.cssText = sel.style.cssText;
  btn.title = sel.title || '';
  btn.setAttribute('aria-haspopup', 'listbox');
  btn.textContent = selLabel(sel);
  btn.disabled = sel.disabled;
  sel.hidden = true;
  sel.after(btn);
  sel.__btn = btn;
  btn.onclick = ev => {
    ev.stopPropagation();
    const mine = MSEL.open && MSEL.open.btn === btn;
    mselClose(); if (mine) return;
    const panel = document.createElement('div');
    panel.className = 'msel-panel'; panel.setAttribute('role', 'listbox');
    const opt = o => `<div class="msel-opt${o.selected ? ' sel' : ''}${o.disabled ? ' dis' : ''}" tabindex="-1" role="option" aria-selected="${o.selected}" data-i="${o.index}">${esc(o.textContent)}</div>`;
    panel.innerHTML = [...sel.children].map(c => c.tagName === 'OPTGROUP'
      ? `<div class="msel-grp">${esc(c.label)}</div>${[...c.children].map(opt).join('')}` : opt(c)).join('');
    panelAt(btn, panel);
    (panel.querySelector('.sel') || panel.querySelector('.msel-opt'))?.focus();
    panel.querySelector('.sel')?.scrollIntoView({ block: 'nearest' });
    panel.onclick = e => {
      e.stopPropagation();
      const o = e.target.closest('.msel-opt'); if (!o || o.classList.contains('dis')) return;
      mselClose();
      if (sel.selectedIndex !== +o.dataset.i) { sel.selectedIndex = +o.dataset.i; btn.textContent = selLabel(sel); fire(sel); }
      btn.focus();
    };
  };
}
/* Keep the button honest when code sets a select's value directly. */
const _selDesc = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value');
Object.defineProperty(HTMLSelectElement.prototype, 'value', { configurable: true,
  get(){ return _selDesc.get.call(this); },
  set(v){ _selDesc.set.call(this, v); if (this.__btn) this.__btn.textContent = selLabel(this); } });

const MON3 = MONTHS.map(m => m.slice(0, 3));
function dateLabel(inp){
  const v = inp.value;
  if (!v) return inp.type === 'month' ? 'Pick a month' : 'Pick a date';
  if (inp.type === 'month') return moName(v);
  return new Date(v + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function enhanceDate(inp){
  if (ENH.has(inp)) return;
  ENH.add(inp);
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'msel-btn dsel cal-btn';
  btn.innerHTML = `<span></span>`;
  btn.firstChild.textContent = dateLabel(inp);
  inp.hidden = true;
  inp.after(btn);
  const sync = () => { btn.firstChild.textContent = dateLabel(inp); };
  inp.addEventListener('change', sync);
  btn.onclick = ev => {
    ev.stopPropagation();
    const mine = MSEL.open && MSEL.open.btn === btn;
    mselClose(); if (mine) return;
    const month = inp.type === 'month';
    const today = new Date().toISOString().slice(0, 10);
    let view = (inp.value || today).slice(0, month ? 4 : 7);   // year for months, year-month for dates
    const panel = document.createElement('div');
    panel.className = 'msel-panel cal';
    const within = v => (!inp.min || v >= inp.min) && (!inp.max || v <= inp.max);
    const paint = () => {
      let head, grid;
      if (month) {
        head = view;
        grid = MON3.map((n, i) => { const v = `${view}-${String(i+1).padStart(2,'0')}`;
          return `<button type="button" class="cal-c${v === inp.value ? ' sel' : ''}${v === today.slice(0,7) ? ' now' : ''}" data-v="${v}" ${within(v) ? '' : 'disabled'}>${n}</button>`; }).join('');
      } else {
        const [y, m] = view.split('-').map(Number);
        head = `${MONTHS[m-1]} ${y}`;
        const first = new Date(Date.UTC(y, m-1, 1)).getUTCDay(), days = new Date(Date.UTC(y, m, 0)).getUTCDate();
        grid = ['S','M','T','W','T','F','S'].map(d => `<span class="cal-d">${d}</span>`).join('')
          + '<span></span>'.repeat(first)
          + Array.from({ length: days }, (_, i) => { const v = `${view}-${String(i+1).padStart(2,'0')}`;
            return `<button type="button" class="cal-c${v === inp.value ? ' sel' : ''}${v === today ? ' now' : ''}" data-v="${v}" ${within(v) ? '' : 'disabled'}>${i+1}</button>`; }).join('');
      }
      panel.innerHTML = `<div class="cal-h"><button type="button" class="cal-n" data-step="-1" aria-label="Previous">‹</button><b>${head}</b><button type="button" class="cal-n" data-step="1" aria-label="Next">›</button></div>
        <div class="cal-g ${month ? 'm' : 'd'}">${grid}</div>
        <div class="cal-f"><button type="button" class="linky" data-v="${month ? today.slice(0,7) : today}">${month ? 'This month' : 'Today'}</button>${inp.required ? '' : '<button type="button" class="linky muted" data-v="">Clear</button>'}</div>`;
    };
    paint();
    panelAt(btn, panel);
    panel.onclick = e => {
      e.stopPropagation();
      const step = e.target.closest('[data-step]');
      if (step) {
        const n = +step.dataset.step;
        view = month ? String(+view + n) : addMonths(view, n);
        paint(); return;
      }
      const pick = e.target.closest('[data-v]');
      if (!pick || pick.disabled) return;
      mselClose();
      inp.value = pick.dataset.v; sync(); fire(inp);
      btn.focus();
    };
  };
}
/* On a phone a wide table becomes a stack of cards; each cell carries its
   column heading so a figure never loses its name. */
function labelTable(t){
  const heads = [...(t.tHead?.rows[0]?.cells || [])].map(th => th.textContent.trim());
  for (const tr of t.tBodies[0]?.rows || []) {
    if (tr.cells.length === 1 && tr.cells[0].colSpan > 1) continue;
    [...tr.cells].forEach((td, i) => { if (i > 0 && heads[i] && !td.dataset.l) td.dataset.l = heads[i]; });
  }
}
function enhance(root){
  if (!root || root.nodeType !== 1) return;
  if (root.matches('table.rt')) labelTable(root);
  root.querySelectorAll('table.rt').forEach(labelTable);
  if (root.matches('select')) enhanceSelect(root);
  else if (root.matches('input[type=month],input[type=date]')) enhanceDate(root);
  root.querySelectorAll('select').forEach(enhanceSelect);
  root.querySelectorAll('input[type=month],input[type=date]').forEach(enhanceDate);
}
new MutationObserver(list => { for (const m of list) m.addedNodes.forEach(enhance); })
  .observe(document.body, { childList: true, subtree: true });

/* ---- selection + in-place editing ---- */
function togglePick(id, on){ on ? S.sel.add(id) : S.sel.delete(id); renderTxns(); }
function pickAll(on){

  on ? ids.forEach(i=>S.sel.add(i)) : ids.forEach(i=>S.sel.delete(i));
  renderTxns();
}
/* Once anything is ticked you are in selecting mode, and the whole row is the

function rowClick(ev, id){

}
/* One row's bucket or tax category, saved the moment it changes. The worker
   also applies it to that vendor's other still-uncategorized rows, so eight
   identical Anthropic charges are one decision, not eight. */
async function setRowField(id, field, value, el){
  const t = (S.txns||[]).find(x=>x.id===id);
  if (el) el.disabled = true;
  try {
    await api('/api/transaction', { method:'PUT', body: JSON.stringify({ id, [field]: value || null }) });
    // Ask before touching rows he did not click. Same vendor, still
    // uncategorized, this month's view · never anything already decided.
    let kin = [];
    if (field === 'tax_cat' && value && t) {
      kin = (S.txns||[]).filter(x => x.id !== id && x.vendor === t.vendor
        && x.type === 'out' && !x.expected && (!x.tax_cat || x.status === 'review'));
    }
    if (kin.length && await ask({
      title: `Apply to the other ${kin.length} from “${t.vendor}”?`,
      body: `${kin.length} more transaction${kin.length>1?'s are':' is'} from this vendor and still uncategorized. Set ${kin.length>1?'them':'it'} to “${value}” as well?`,
      ok: `Yes, apply to all ${kin.length + 1}`, cancel: 'Just this one' })) {
      await api('/api/transactions/bulk', { method:'POST',
        body: JSON.stringify({ ids: kin.map(x=>x.id), tax_cat: value }) });
      flash(`Saved · categorized ${kin.length + 1} ${t.vendor} transactions.`);
    } else if (field === 'tax_cat' && value) flash(`Saved · ${t?.vendor || 'transaction'} → ${value}.`);
    else flash('Saved.');
    S.txns = null; window.__moCache={}; S.boot = await api('/api/boot');
    await loadTxns(); renderTxns();
  } catch(e){
    if (el) el.disabled = false;
    renderTxns();                      // put the row back the way it was
    tell('Could not save that', e.message);
  }
}
/* A quiet confirmation that does not need dismissing. */
function flash(text){

  el.textContent = text; el.classList.add('on');

async function bulkApply(){

/* Today's balances in one line, from the bank feed. */

async function renderTxns(){

  }).join('');

      : t.type==='fee' ? '<span class="rc na" title="Stripe\'s processing fee · taken automatically, no receipt exists">n/a</span>'

/* The page keeps its own scrollbar while a modal shows its own - two bars
   side by side. Lock the page while anything modal is up. */
function openModal(html){ $('#mbox').innerHTML = html; $('#modal').classList.add('on'); $('#scrim').classList.add('on'); document.body.style.overflow = 'hidden'; }
/* On a phone the sheet covers the screen, so the scrim behind it never gets
   the tap · dismissing meant hunting for Cancel. Anything outside the sheet
   itself closes it, which is what every iOS sheet does. */
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') { const c = window.__askCancel; c ? c() : closeModal(); }
});
function closeModal(){ window.__askCancel = null; $('#modal').classList.remove('on'); $('#scrim').classList.remove('on'); document.body.style.overflow = ''; }
$('#scrim').onclick = closeModal;

/* In-app replacements for confirm() and alert(). The browser's own dialogs are
   chrome-grey boxes stamped with the domain name at the top of the window,
   they break the app the moment anything needs a yes/no. These resolve a
   promise instead, so callers read the same: `if (!await ask(…)) return;` */
function ask({ title, body, ok = 'Confirm', cancel = 'Cancel', danger = false }){
  return new Promise(resolve => {
    let done = false;
    const finish = v => { if (done) return; done = true; window.__askCancel = null; closeModal(); $('#scrim').onclick = closeModal; resolve(v); };
    openModal(`
      <h3>${esc(title)}</h3>
      ${body ? `<div class="hint" style="white-space:pre-line">${esc(body)}</div>` : ''}
      <div class="acts">
        <span class="spacer"></span>
        <button class="btn" id="askNo">${esc(cancel)}</button>
        <button class="btn ${danger ? '' : 'primary'}" id="askYes" ${danger ? 'style="color:var(--bad)"' : ''}>${esc(ok)}</button>
      </div>`);
    $('#askYes').onclick = () => finish(true);
    $('#askNo').onclick = () => finish(false);
    $('#askYes').focus();
    // dismissing the modal any other way is a "no", never a silent hang
    $('#scrim').onclick = () => finish(false);
    window.__askCancel = () => finish(false);
  });
}
function tell(title, body){ return ask({ title, body, ok: 'OK', cancel: 'Close' }); }

/* ---- receipts plumbing ---- */
function downscale(file){
  return new Promise((resolve, reject) => {
    if (!/^image\//.test(file.type)) { // PDFs etc. pass through untouched
      const r = new FileReader();
      r.onload = () => resolve({ data: r.result.split(',')[1], type: file.type || 'application/octet-stream' });
      r.onerror = reject; r.readAsDataURL(file); return;
    }
    const img = new Image();
    img.onload = () => {
      const MAX = 1800, scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      resolve({ data: c.toDataURL('image/jpeg', .82).split(',')[1], type: 'image/jpeg' });
      URL.revokeObjectURL(img.src);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
function pickFile(cb, multi){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*,application/pdf';
  inp.multiple = !!multi;
  inp.onchange = () => inp.files[0] && cb(multi ? inp.files : inp.files[0]);
  inp.click();
}

  return window.__moCache[month];

async function viewReceipt(id){
  try {
    const res = await fetch(S.url + '/api/receipt?id=' + id, { headers: { Authorization: 'Bearer ' + S.tok } });
    if (!res.ok) throw new Error('could not load receipt');
    const blob = await res.blob();
    const safeType = /^(image\/(png|jpeg|gif|webp)|application\/pdf)$/.test(blob.type);
    if (!safeType) {
      openModal('<h3>Receipt text</h3><pre style="white-space:pre-wrap;overflow-wrap:anywhere">' + esc(await blob.text()) + '</pre>');
      return;
    }
    const objectUrl = URL.createObjectURL(blob);
    window.open(objectUrl, '_blank', 'noopener,noreferrer');
    setTimeout(() => URL.revokeObjectURL(objectUrl), 60000);
  } catch(e){ tell('Could not do that', e.message); }
}

/* ---- CSV import ---- */
function importModal(){
  openModal(`
    <h3>Import a CSV</h3>
    <div class="hint">Use date, description and amount columns. Choose the account and sign convention; negative normalized amounts are expense refunds. Revenue imports require a separate mapping.</div>
    <label>Account identifier</label><input id="csvAccount" placeholder="e.g. Mobius Amex ending 1234"><label>Amount convention</label><select id="csvSign"><option value="">Choose…</option><option value="positive-expense">Positive expenses, negative refunds</option><option value="negative-expense">Negative expenses, positive refunds</option></select><label>Paste CSV or choose a file</label>
    <textarea id="csvText" rows="6" placeholder="date,description,amount\n2026-09-03,SLACK T012345,52.50"></textarea>
    <div class="row" style="margin:10px 0 0"><button class="btn" onclick="pickCsv()">Choose file…</button></div>
    <div class="acts"><span class="spacer"></span>
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" id="csvSubmit" onclick="runImport()">Preview</button></div>
    <div class="msg" id="csvMsg"></div>`);
}
function pickCsv(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='.csv,text/csv';
  inp.onchange = () => { const r = new FileReader(); r.onload = () => $('#csvText').value = r.result; r.readAsText(inp.files[0]); };
  inp.click();
}
function csvRecords(text){
  const rows=[]; let row=[], field='', quoted=false;
  for(let i=0;i<text.length;i++) {
    const c=text[i];
    if(c==='"') { if(quoted && text[i+1]==='"') {field+='"';i++;} else quoted=!quoted; }
    else if(c===',' && !quoted) {row.push(field);field='';}
    else if((c==='\n'||c==='\r') && !quoted) {
      if(c==='\r'&&text[i+1]==='\n')i++;
      row.push(field); if(row.some(x=>x.trim()))rows.push(row); row=[];field='';
    } else field+=c;
  }
  if(quoted)throw new Error('Unclosed quoted CSV field');
  row.push(field);if(row.some(x=>x.trim()))rows.push(row);
  return rows;
}
function parseCsv(text, sign='positive-expense'){
  const lines=csvRecords(text); if(lines.length<2)return [];
  const hd=lines[0].map(x=>x.trim().toLowerCase());
  const di=hd.findIndex(h=>/date/.test(h)),vi=hd.findIndex(h=>/desc|vendor|payee|name|merchant/.test(h)),ai=hd.findIndex(h=>/amount|amt/.test(h));
  if(di<0||vi<0||ai<0)return null;
  return lines.slice(1).map((c,i)=>{
    let date=(c[di]||'').trim();const m=date.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
    if(m)date=(m[3].length===2?'20'+m[3]:m[3])+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0');
    let amount=Number((c[ai]||'').replace(/[$,]/g,'').trim());
    if(sign==='negative-expense')amount=-amount;
    const vendor=(c[vi]||'').trim();
    if(c.length!==hd.length||!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(Date.parse(date))||!vendor||!Number.isFinite(amount)||!amount)
      throw new Error('CSV row '+(i+2)+': invalid date, merchant, amount or column count');
    return {date,vendor,amount,type:'out',source:'import',source_row:i+2};
  });
}
async function runImport(){
  const el = $('#csvMsg');
  let rows;
  const account=$('#csvAccount').value.trim(), sign=$('#csvSign').value, text=$('#csvText').value;
  try {
    if(!account || !sign)throw new Error('Choose an account and amount sign convention.');
    rows=parseCsv(text,sign);
  } catch(e){el.className='msg bad';el.textContent=e.message;return;}
  if (rows === null) { el.className='msg bad'; el.textContent='Could not find date / description / amount columns in the header row.'; return; }
  if (!rows.length) { el.className='msg bad'; el.textContent='No usable rows found.'; return; }
  const previewKey=JSON.stringify([account,sign,text]);
  if(window.__csvPreview !== previewKey) {
    window.__csvPreview=previewKey;
    el.className='msg'; el.textContent=rows.map(r=>r.date+' · '+r.vendor+' · '+(r.amount<0?'Refund ':'Expense ')+fmt$(Math.abs(r.amount))).join('\n')+'\nReview these rows, then press Import reviewed rows.';
    el.style.whiteSpace='pre-wrap'; $('#csvSubmit').textContent='Import reviewed rows'; return;
  }
  const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(previewKey));
  const fileId=Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');
  rows=rows.map(r=>({...r,import_id:fileId+':'+r.source_row}));
  el.className='msg'; el.textContent=`Importing ${rows.length} rows…`;
  try {
    const res = await api('/api/transactions', { method:'POST', body: JSON.stringify({ rows }) });
    el.className='msg good'; el.textContent=`Imported ${res.inserted.length} of ${rows.length} (duplicates and closed-month rows skipped). Known vendors categorized themselves; the rest are in Review.`;
    S.txns=null; window.__moCache={}; S.boot = await api('/api/boot');
    setTimeout(() => { closeModal(); show('txns'); }, 1600);
  } catch(e){ el.className='msg bad'; el.textContent=e.message; }
}

/* Accepts one file or a whole stack. Each receipt is matched in the month
   written ON the receipt (not the month on screen, that is exactly how the
   July Fireflies receipt ended up on the September row). In a batch, a
   receipt whose amount matches exactly one open expense files itself; the
   ambiguous ones come to you one at a time. */
async function handleDrop(files){
  const list = files instanceof File ? [files] : [...files];
  window.__rq = list.slice();
  window.__rqStats = { auto:0, manual:0, skipped:0, total:list.length };
  await processNextReceipt();
}
async function processNextReceipt(){
  const q = window.__rq || [], st = window.__rqStats || { auto:0, manual:0, skipped:0, total:0 };
  const file = q.shift();
  if (!file){
    window.__moCache = {}; S.txns = null; window.__moCache={}; S.boot = await api('/api/boot');
    await loadTxns(); (S.view==='txns' ? renderTxns : renderReceipts)();
    const did = st.auto + st.manual;
    if (st.total > 1) flash(`Saved · ${st.auto} filed automatically, ${st.manual} filed by hand${st.skipped?`, ${st.skipped} skipped`:''}.`);
    else if (did) flash('Saved · receipt attached.');
    return;
  }
  const dz = $('#drop');
  if (dz) dz.innerHTML = `<b>Reading ${esc(file.name)}…</b>${st.total>1 ? `${st.total - q.length} of ${st.total}` : 'one moment'}`;
  let ext = null, payload = null;
  try {
    payload = await downscale(file);
    if (S.boot.extractAvailable) {
      const r = await api('/api/extract', { method:'POST', body: JSON.stringify({ data: payload.data, media_type: payload.type }) });
      ext = r.extracted;
    }
  } catch(e){ /* extraction is best-effort */ }
  if (!payload){ st.skipped++; return processNextReceipt(); }
  const rMonth = (ext?.date && /^\d{4}-\d{2}/.test(String(ext.date))) ? String(ext.date).slice(0,7) : S.month;
  let pool = S.txns || [];
  try {
    pool = await txnsForMonth(rMonth);
    if (rMonth !== S.month) pool = [...pool, ...(S.txns||[])];
  } catch(e){}
  if (ext?.amount != null) {
    try {
      const bytes=Uint8Array.from(atob(payload.data),c=>c.charCodeAt(0));
      const hash=await crypto.subtle.digest('SHA-256',bytes);
      const fingerprint=Array.from(new Uint8Array(hash),b=>b.toString(16).padStart(2,'0')).join('');
      const match=await api('/api/receipt-match',{method:'POST',body:JSON.stringify({fingerprint,vendor:ext.vendor,amount:ext.amount,date:ext.date || rMonth+'-01'})});
      if(match.duplicate){st.skipped++;flash('Receipt already attached to transaction '+match.duplicate);return processNextReceipt();}
      if(st.total>1 && match.match){
        await api('/api/receipt',{method:'POST',body:JSON.stringify({id:match.match,name:file.name,type:payload.type,data:payload.data})});
        markAttached(match.match);st.auto++;return processNextReceipt();
      }
    }catch(e){ /* Manual review remains available when matching cannot complete. */ }
  }
  matchModal(file, payload, ext, { pool, rMonth });
}
/* A file's caches don't know about attaches made seconds ago in this same
   batch, mark the row in place so no later receipt is offered a taken row. */
function markAttached(id){
  const pools = [S.txns || [], ...Object.values(window.__moCache || {})];
  for (const arr of pools) { const hit = arr.find(t => t.id === id); if (hit) hit.receipt_key = 'rcpt:fresh'; }
}
function matchModal(file, payload, ext, opts = {}){
  (S.view==='txns' ? renderTxns : renderReceipts)(); // reset whichever drop zone was used
  const pool = opts.pool || (S.txns||[]);
  const st = window.__rqStats || { total:1 }, q = window.__rq || [];
  const batch = st.total > 1;
  const cand = pool.filter(t => t.type==='out' && !t.receipt_key)
    .map(t => ({ t, score: (ext?.amount != null && Math.abs(t.amount - ext.amount) < .005 ? 2 : 0) +
      (ext?.vendor && t.vendor.toLowerCase().includes(String(ext.vendor).toLowerCase().split(' ')[0]) ? 1 : 0) }))
    .sort((a,b) => b.score - a.score).slice(0, 6);
  /* Deliberately looks at rows that DO have receipts: same amount + vendor
   * already receipted is how a duplicate upload announces itself. */
  const dupe = ext?.amount != null ? pool.find(t => t.receipt_key && Math.abs(t.amount - ext.amount) < .005
    && (!ext.vendor || t.vendor.toLowerCase().includes(String(ext.vendor).toLowerCase().split(' ')[0]))) : null;
  openModal(`
    <h3>File this receipt${batch ? ` · ${st.total - q.length} of ${st.total}` : ''}</h3>
    <div class="hint">${ext ? `Read: <b>${esc(ext.vendor||'?')}</b> · <b>${ext.amount!=null?fmt$(+ext.amount):'?'}</b>${ext.date?` · ${esc(ext.date)}`:''}` : 'Pick the transaction this belongs to, or create a new one.'}</div>
    ${dupe ? `<div class="notice" style="margin:10px 0 0;background:var(--warn-soft);border-color:var(--warn);color:var(--warn)">
      <b>${esc(dupe.vendor)} ${fmt$(dupe.amount)} on ${fmtDate(dupe.date)} already has a receipt</b>. This may be the same one twice. ${batch?'Skip':'Cancel'} if so.</div>` : ''}
    <label>Tap the expense it belongs to, then press Attach${opts.rMonth && opts.rMonth !== S.month ? ` <span class="why">The receipt is dated ${moName(opts.rMonth)}, so that month's open expenses are shown too.</span>` : ''}</label>
    <div id="fmList">
    ${cand.map(({t,score}) => `<button type="button" class="btn fm-c" data-id="${t.id}" style="display:flex;width:100%;margin-top:6px;text-align:left;gap:10px">
      <span style="flex:1">${esc(t.vendor)} <span class="tiny">${fmtDate(t.date)}${t.month !== S.month ? ` · ${moName(t.month)}` : ''}</span></span>
      <b>${fmt$(t.amount)}</b>${score>=2?' <span class="pill good">match</span>':''}</button>`).join('') || '<div class="hint">No open expense matches this one. Skip it, or file it as a new expense.</div>'}
    </div>
    <div class="acts">
      <button class="btn" onclick='newFromReceipt()'>+ New expense</button>
      ${batch ? `<button class="btn" onclick="stopReceiptBatch()" title="Skips this and everything still waiting">Stop batch</button>` : ''}
      <span class="spacer"></span>
      <button class="btn" onclick="skipReceiptFile()">${batch ? 'Skip →' : 'Cancel'}</button>
      <button class="btn primary" id="fmAttach" disabled>Attach</button></div>
    <div class="msg" id="fMsg"></div>`);
  /* Nothing saves on a stray tap: picking highlights, Attach commits. */
  let sel = null;
  document.querySelectorAll('#fmList .fm-c').forEach(b => b.onclick = () => {
    sel = +b.dataset.id === sel ? null : +b.dataset.id;
    document.querySelectorAll('#fmList .fm-c').forEach(x => x.classList.toggle('on', +x.dataset.id === sel));
    $('#fmAttach').disabled = sel === null;
  });
  $('#fmAttach').onclick = () => { if (sel != null) fileTo(sel); };
  window.__pendingReceipt = { file, payload, ext };
}
function skipReceiptFile(){
  closeModal();
  if (window.__rqStats) window.__rqStats.skipped++;
  if ((window.__rq||[]).length) processNextReceipt();

function stopReceiptBatch(){
  const st = window.__rqStats || {};
  st.skipped = (st.skipped || 0) + (window.__rq || []).length + 1;

async function fileTo(id){
  const { file, payload } = window.__pendingReceipt || {};

/* ---- profit & loss for any period ---- */
function compareRange([a, b], mode){
  const n = monthsBetween(a, b);
  if (mode === 'year') return [addMonths(a, -12), addMonths(b, -12)];
  if (mode === 'prev') return [addMonths(a, -n), addMonths(b, -n)];
  return null;
}
/* A statement period the PDF endpoint can print: one month, a calendar quarter, or a year. */
function pdfPeriod([a, b]){
  if (a === b) return { period: 'month', month: a };
  if (a.slice(0,4) === b.slice(0,4) && a.slice(5) === '01' && (b.slice(5) === '12' || b === nowMonth())) return { period: 'year', month: b };
  const q = qOf(a);
  if (a.slice(0,4) === b.slice(0,4) && +a.slice(5) === (q-1)*3+1 && qOf(b) === q && (+b.slice(5) === q*3 || b === nowMonth())) return { period: 'quarter', month: b };
  return null;
}

/* ---- cash forecast ----
   Built once, then repainted in place: switching a client off or adding a
   purchase never reloads the screen or moves the page. */
const CF = { without: new Set(), basis: lsGet('ledger_cf_basis', 'average'), events: [], ctx: null };
function cfSet(k, v){
  if (k !== 'basis') return;
  CF.basis = v; lsSet('ledger_cf_basis', v);
  document.querySelectorAll('#cfBasis button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  cfPaint();
}
function whatIf(name){ CF.without.has(name) ? CF.without.delete(name) : CF.without.add(name); cfPaint(); }
function cfAddEvent(){
  const amt = +$('#evAmt').value, mo = $('#evMo').value;
  if (!amt || !mo) { tell('Add an amount and a month', 'Both are needed to place it on the chart.'); return; }
  const name = $('#evName').value.trim() || 'One-off';
  CF.events.push({ name, amount: amt, month: mo, dir: $('#evDir').value });

function cfDropEvent(i){ CF.events.splice(i, 1); cfPaint(); }
function cfCalc(){
  const { ser, bal } = CF.ctx;
  const cur = nowMonth();
  const full = ser.months.filter(x => x.month < cur && x.month >= firstMonth()).slice(-3);
  const clients = (S.boot.clients||[]).filter(c => c.active);
  const kept = clients.filter(c => !CF.without.has(c.name));
  const bookAll = sumOf(clients, clientMonthly), book = sumOf(kept, clientMonthly);
  const lostShare = bookAll ? 1 - book / bookAll : 0;
  const avgRev = full.length ? sumOf(full, 'revenue') / full.length : book;
  const avgOut = full.length ? sumOf(full, expOf) / full.length : 0;
  const recur = recurringMonthly();
  const feePct = S.boot.money.feePct || 0;
  const inflow = CF.basis === 'book' ? book : avgRev * (1 - lostShare);
  const outflow = CF.basis === 'book' ? recur + book * feePct / 100 : avgOut;
  const taxPct = S.boot.money.taxPct || 0;
  const start = bal.connected ? (bal.cash || 0) - (bal.cards || 0) : 0;
  const months = [1,2,3,4,5,6].map(i => addMonths(cur, i));
  let cash = start, cashTax = start;
  const rows = months.map(mo => {
    const ev = CF.events.map((e, i) => ({ ...e, i })).filter(e => e.month === mo);
    const evIn = sumOf(ev.filter(e => e.dir === 'in'), 'amount'), evOut = sumOf(ev.filter(e => e.dir === 'out'), 'amount');
    const net = inflow - outflow + evIn - evOut;
    const tax = Math.max(0, inflow - outflow) * taxPct / 100;
    cash += net; cashTax += net - tax;
    return { mo, in: inflow + evIn, out: outflow + evOut, net, tax, cash, cashTax, ev };
  });
  const low = rows.reduce((p, r) => r.cashTax < p.cashTax ? r : p, rows[0]);
  return { full, clients, kept, bookAll, book, inflow, outflow, recur, start, rows, low, bal, months };
}

  $('#cfTable').innerHTML = rows.map(r => `<tr><td>${moName(r.mo)}${r.ev.length ? ` <span class="pc">${r.ev.map(e => esc(e.name)).join(', ')}</span>` : ''}</td><td>${money0(r.in)}</td><td>${money0(r.out)}</td><td class="${r.net<0?'neg':''}">${money0(r.net)}</td><td class="pc">${money0(r.tax)}</td><td class="${r.cash<0?'neg':''}"><b>${money0(r.cash)}</b></td></tr>`).join('');

    <div class="row" style="margin:0;gap:6px">${clients.map(k => `<button class="chip ${CF.without.has(k.name) ? '' : 'on'}" aria-pressed="${!CF.without.has(k.name)}" data-ledger-event="click" data-ledger-action="whatIf" data-name="${esc(k.name)}">${esc(k.name)} · ${pctOf(clientMonthly(k), total)}</button>`).join('')}</div>
    ${top ? `<div class="verdict ${clientMonthly(top) / total > .4 ? 'bad' : clientMonthly(top) / total > .25 ? 'warn' : 'good'}"><b>${esc(top.name)}</b> is ${pctOf(clientMonthly(top), total)} of the retainer book.${CF.without.size ? ` Without ${[...CF.without].map(esc).join(' and ')}, net is <b>${money0(inflow - outflow)}</b> a month.` : ''}</div>` : '<div class="hint">Add clients in Settings.</div>'}`;

const taxYearOf = p => p.date.slice(5) <= '04-15' ? +p.date.slice(0,4) - 1 : +p.date.slice(0,4);
async function reportTaxes(my){
  const y = RP.taxYear, cur = nowMonth();
  const to = y === cur.slice(0,4) ? cur : `${y}-12`;
  const nextFrom = `${+y + 1}-01`;
  const [ser, nxt] = await Promise.all([getSeries(`${y}-01`, to),
    nextFrom <= cur ? getSeries(nextFrom, cur < `${+y + 1}-04` ? cur : `${+y + 1}-04`).catch(() => null) : null]);
  if (stale(my)) return;
  const years = [...new Set(monthList(firstMonth(), cur).map(m => m.slice(0,4)))].reverse();
  $('#rctl').innerHTML = `<label>Tax year <select onchange="rtSet(this.value)">${years.map(v => `<option ${v===y?'selected':''}>${v}</option>`).join('')}</select></label>`;
  const T = addUp(ser.months);
  const pct = S.boot.money.taxPct;
  const pays = [...(ser.taxPayments || []), ...(nxt?.taxPayments || [])].filter((p, i, a) => a.findIndex(q => q.date === p.date && q.vendor === p.vendor && q.amount === p.amount) === i);
  const forYear = pays.filter(p => taxYearOf(p) === +y);
  const inYearForOther = pays.filter(p => p.date.startsWith(y) && taxYearOf(p) !== +y);
  const paid = sumOf(forYear, 'amount');
  const aside = Math.max(0, T.net) * pct / 100;
  const owed = aside - paid;
  const quarters = EST_DUE(y).map(([a, b, due]) => {
    const q = addUp(ser.months.filter(x => x.month >= a && x.month <= b));
    return { a, b, due, net: q.net, aside: Math.max(0, q.net) * pct / 100, started: a <= cur, done: b < cur };
  });
  const con = ser.contractors || [];
  const payRow = p => `<div class="ln"><span class="n">${esc(p.vendor)}<small>${fmtDate(p.date)} ${p.date.slice(0,4)} · counts toward ${taxYearOf(p)}${taxYearOf(p) < +p.date.slice(0,4) ? ' (last year\'s return)' : ' (estimate)'}</small></span><span class="a">${money0(p.amount)}</span></div>`;
  $('#rbody').innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="lbl">Net income · ${y}</div><div class="v">${money0(T.net)}</div><div class="s">what ${y} income tax is figured on</div></div>
      <div class="kpi"><div class="lbl">Set aside for ${y}</div><div class="v">${money0(aside)}</div><div class="s">${pct}% of net · the rate in Settings</div></div>
      <div class="kpi"><div class="lbl">Paid toward ${y}</div><div class="v">${money0(paid)}</div><div class="s">${forYear.length ? `${forYear.length} estimate payment${forYear.length===1?'':'s'}` : 'no estimates paid yet'}</div></div>
      <div class="kpi ${owed > 0 ? 'warn' : 'good'}"><div class="lbl">${owed > 0 ? 'Still to pay for ' + y : 'Covered for ' + y}</div><div class="v">${money0(Math.abs(owed))}</div><div class="s">set aside minus paid toward ${y}</div></div>
    </div>
    <div class="g g21">
      <div class="card">${cardH('Quarterly estimates', `Next payment due ${nextEstimate()}`, '', 'Each estimate covers the months shown and is due on the federal date beside it. The amount is the set-aside rate on that stretch\'s net income: a planning number, not a tax calculation. The CPA sets the real one.')}
        <div class="tbl-wrap"><table class="st rt"><thead><tr><th>Covers</th><th>Net income</th><th>Set aside</th><th>Due</th></tr></thead><tbody>
          ${quarters.map((q, i) => `<tr class="${!q.done && q.started ? 'hl' : ''}"><td>Q${i+1} · ${moShort(q.a)}${q.a !== q.b ? ' to ' + moShort(q.b) : ''}${!q.started ? ' <span class="pc">not started</span>' : !q.done ? ' <span class="pc">in progress</span>' : ''}</td>
            <td>${q.started ? money0(q.net) : '·'}</td><td>${q.started ? money0(q.aside) : '·'}</td><td><b>${q.due}</b></td></tr>`).join('')}
        </tbody></table></div></div>
      <div class="stack">
        <div class="card">${cardH('Income tax payments', `${money0(sumOf(pays.filter(p => p.date.startsWith(y)), 'amount'))} paid during ${y}`, '', 'Payments booked as "Income tax". One made January 1 to April 15 settles the year before (the return and the last estimate); after that it counts toward the year it was paid in.')}
          ${forYear.length ? forYear.map(payRow).join('') : `<div class="hint">No payments toward ${y} yet.</div>`}
          ${inYearForOther.length ? `<div class="lbl" style="margin-top:14px">Paid in ${y} for an earlier year</div>${inYearForOther.map(payRow).join('')}` : ''}
        </div>
        <div class="card">${cardH('1099 contractors', `${con.filter(v => v.amount >= 600).length} paid $600 or more`, '', 'US contractors paid $600 or more in the year need a 1099-NEC by January 31. Overseas contractors need a W-8BEN on file instead.')}
          ${con.length ? con.map(v => `<div class="ln"><span class="n">${esc(v.vendor)}<small>${v.n} payment${v.n===1?'':'s'}</small></span><span class="a">${money0(v.amount)} ${v.amount >= 600 ? '<span class="pill warn">1099</span>' : ''}</span></div>`).join('') : '<div class="hint">No contract labor this year.</div>'}
          <div class="ln tot"><span class="n">Total contract labor</span><span class="a">${money0(sumOf(con, 'amount'))}</span></div>
          <div class="hint" style="margin-top:8px">Due January 31, ${+y + 1}.</div></div>
      </div>

}

/* One way to fetch a PDF: the token rides in a header, the worker names the file. */
function pdfName(q, pack){
  const label = q.from ? rangeLabel([q.from, q.to]) : q.period === 'year' ? q.month.slice(0,4) : q.period === 'quarter' ? `Q${qOf(q.month)} ${q.month.slice(0,4)}` : moName(q.month);
  return `Mobius Digital ${pack ? 'CPA Pack' : 'P&L'} ${label}${q.layout ? ' by ' + q.layout : ''}.pdf`;
}
async function downloadPdf(q, btn, path = '/api/statement.pdf'){
  const label = btn.innerHTML;
  btn.disabled = true; btn.textContent = 'Building…';
  try {
    const qs = new URLSearchParams(Object.entries(q).filter(([, v]) => v)).toString();
    const res = await fetch(`${S.url.replace(/\/+$/,'')}${path}?${qs}`, { headers: { Authorization: 'Bearer ' + S.tok } });
    if (!res.ok) { const j = await res.json().catch(() => ({})); throw new Error(j.error || 'Could not build the PDF'); }
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (res.headers.get('content-disposition')||'').match(/filename="([^"]+)"/)?.[1] || pdfName(q, path.includes('pack'));
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 8000);
    flash('Downloaded · ' + a.download);
  } catch(e){ tell('Could not download', e.message); }
  btn.disabled = false; btn.innerHTML = label;
}
function downloadStatementPeriod(period, month, btn){ return downloadPdf({ period, month }, btn); }
function downloadStatement(btn){ return downloadPdf({ period: $('#rptPeriod')?.value || 'month', month: S.reportMonth || nowMonth() }, btn); }

/* Bank balances, asked for at most every ten minutes from this screen. */
async function getBalances(fresh){
  if (!fresh && S.bal && Date.now() - S.balAt < 600e3) return S.bal;
  try { S.bal = await api('/api/balances' + (fresh ? '?fresh=1' : '')); }
  catch(e){ S.bal = { connected: false, error: e.message }; }
  S.balAt = Date.now();
  return S.bal;
}

  let prev = null;

  const r = data.report;

  const rmOpen = moState(rm) !== 'closed';

  /* The detail comes from the month's own rows, so any line can be opened

  $('#rctl').innerHTML = `<span class="mo-nav">${monthPicker(rm, 'setReportMonth')}</span>

/* The zip is streamed from the worker, so a year of photos never has to fit
   anywhere at once · but it does need the token, hence fetch-then-blob. */
async function downloadReceipts(from, to, btn){
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = 'Building…';
  try {
    const res = await fetch(`${S.url.replace(/\/+$/,'')}/api/receipts.zip?from=${from}&to=${to}`,
      { headers: { 'Authorization': 'Bearer ' + S.tok } });
    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      throw new Error(j.error || ('HTTP ' + res.status));
    }
    const blob = await res.blob();
    const name = (res.headers.get('content-disposition')||'').match(/filename="([^"]+)"/)?.[1] || 'receipts.zip';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 8000);
    btn.textContent = '✓ Downloaded';
  } catch(e){ btn.textContent = e.message.slice(0, 60); }
  setTimeout(()=>{ btn.disabled = false; btn.textContent = label; }, 5000);
}

/* The accountant's layout: tax categories down the side, months across,

/* What counts as a business expense in the CPA pack: transfers are money
   moving between Cole's own accounts and personal rows are owner draws -- the

   (The ledger CSV still lists every row; that's the audit trail.) */
const packExp = t => t.type !== 'in' && t.type !== 'transfer' && !/^(Personal|Income tax)/i.test(t.tax_cat || '');
function plTableHTML(p, { compactCap = 0 } = {}){
  const months = p.monthReports.map(r => r.month);
  const cell = {}, revBy = {}; let revTot = 0;
  for (const r of p.monthReports) {

  }
  const cats = [...new Set(p.monthReports.flatMap(r=>Object.keys(r.byTax)).concat('Bank & merchant fees'))];
  const catTotal = c => months.reduce((sum,m)=>sum+(cell[c+'|'+m]||0),0);
  cats.sort((a,b)=>catTotal(b)-catTotal(a));
  const money = n => n ? fmt$(n) : '—';

  const expBy = m => cats.reduce((s,c)=>s+(cell[c+'|'+m]||0),0);
  const expTot = cats.reduce((s,c)=>s+catTotal(c),0);
  return `<div class="tbl-wrap"><table class="pl-tbl">

}

/* ================= dashboards ================= */
/* Four questions, one tab each. Every chart answers something a service
   business owner, a CPA or a lender actually asks. */
const DB = { tab: lsGet('ledger_db_tab', 'performance'), preset: lsGet('ledger_db_preset', 'ytd'), from: '', to: '', group: lsGet('ledger_db_group', 'month') };
function dbSet(k, v){ DB[k] = v; if (['tab','preset','group'].includes(k)) lsSet('ledger_db_' + k, v); renderDashboards(); }
/* Ranges shared by Dashboards and the P&L. */
const PRESETS = [['month','This month'],['lastmonth','Last month'],['quarter','This quarter'],['lastquarter','Last quarter'],
  ['ytd','This year to date'],['lastyear','Last year'],['12m','Last 12 months'],['6m','Last 6 months'],['all','All time'],['custom','Custom range']];
function presetRange(p, st){
  const now = nowMonth(), y = +now.slice(0,4), q = qOf(now);
  const qr = (yy, qq) => [`${yy}-${String((qq-1)*3+1).padStart(2,'0')}`, `${yy}-${String(qq*3).padStart(2,'0')}`];
  const clamp = ([a, b]) => [a, b > now ? now : b];
  if (p === 'month') return [now, now];
  if (p === 'lastmonth') { const m = addMonths(now, -1); return [m, m]; }
  if (p === 'quarter') return clamp(qr(y, q));
  if (p === 'lastquarter') return q === 1 ? qr(y-1, 4) : qr(y, q-1);
  if (p === 'lastyear') return [`${y-1}-01`, `${y-1}-12`];
  if (p === '12m') return [addMonths(now, -11), now];
  if (p === '6m') return [addMonths(now, -5), now];
  if (p === 'all') return [firstMonth(), now];
  if (/^\d{4}$/.test(p)) return clamp([`${p}-01`, `${p}-12`]);
  if (/^\d{4}-Q\d$/.test(p)) return clamp(qr(+p.slice(0,4), +p.slice(6)));
  if (p === 'custom') { const a = st.from || `${y}-01`, b = st.to || now; return a <= b ? [a, b] : [b, a]; }
  return [`${y}-01`, now];
}
const rangeLabel = ([a, b]) => a === b ? moName(a)
  : (a.slice(0,4) === b.slice(0,4) && (+a.slice(5) - 1) % 3 === 0 && +b.slice(5) === +a.slice(5) + 2) ? `Q${qOf(a)} ${a.slice(0,4)}`
  : (a.slice(5) === '01' && b.slice(0,4) === a.slice(0,4) && (b.slice(5) === '12' || b === nowMonth())) ? (b.slice(5) === '12' ? a.slice(0,4) : `${a.slice(0,4)} to date`)
  : `${moShort(a)} ${a.slice(0,4)} to ${moShort(b)} ${b.slice(0,4)}`;
function periodSelect(st, setter){
  const years = [...new Set(monthList(firstMonth(), nowMonth()).map(m => m.slice(0,4)))].reverse();
  const extra = years.map(yy => [yy, yy]);
  const qs = years.flatMap(yy => [4,3,2,1].map(qq => [`${yy}-Q${qq}`, `Q${qq} ${yy}`])).filter(([k]) => presetRange(k, st)[0] <= nowMonth());
  const opt = ([v, l]) => `<option value="${v}" ${st.preset===v?'selected':''}>${l}</option>`;
  return `<label>Period <select onchange="${setter}('preset',this.value)">${PRESETS.map(opt).join('')}
      <optgroup label="Years">${extra.map(opt).join('')}</optgroup><optgroup label="Quarters">${qs.map(opt).join('')}</optgroup></select></label>
    ${st.preset === 'custom' ? `<label>From <input type="month" required value="${presetRange('custom', st)[0]}" onchange="${setter}('from',this.value)"></label>
      <label>to <input type="month" required value="${presetRange('custom', st)[1]}" max="${nowMonth()}" onchange="${setter}('to',this.value)"></label>` : ''}`;
}
/* Roll months into quarters when asked; a partial quarter says so. */
function groupRows(months, group){
  if (group !== 'quarter') return months.map(x => ({ ...x, key: x.month, label: moLab(x.month, months[0].month.slice(0,4) !== months[months.length-1].month.slice(0,4)), n: 1 }));
  const g = {};
  for (const x of months) {
    const k = `${x.month.slice(0,4)}-Q${qOf(x.month)}`;
    const t = g[k] ||= { key: k, label: `Q${qOf(x.month)} ’${x.month.slice(2,4)}`, n: 0, revenue: 0, expenses: 0, fees: 0, net: 0, taxes: 0, byClient: {}, byTax: {}, byBucket: {} };
    t.n++; for (const f of ['revenue','expenses','fees','net','taxes']) t[f] += x[f] || 0;
    for (const f of ['byClient','byTax','byBucket']) for (const [c, v] of Object.entries(x[f] || {})) t[f][c] = (t[f][c] || 0) + v;
  }
  return Object.values(g);
}
function addUp(months){
  const t = { revenue: 0, expenses: 0, fees: 0, net: 0, taxes: 0, distributions: 0, profit: 0, personal: 0, incomeTax: 0, transfers: 0, byClient: {}, byTax: {}, byBucket: {} };
  for (const x of months) {
    for (const f of ['revenue','expenses','fees','net','taxes','distributions','profit','personal','incomeTax','transfers']) t[f] += x[f] || 0;
    for (const f of ['byClient','byTax','byBucket']) for (const [c, v] of Object.entries(x[f] || {})) t[f][c] = (t[f][c] || 0) + v;
  }
  t.spend = t.expenses + t.fees;
  return t;
}
/* Top N names by total, the rest folded into "Everything else". */
function topN(obj, n){
  const e = Object.entries(obj).filter(([, v]) => Math.abs(v) >= 0.5).sort((p, q) => q[1] - p[1]);
  const keep = e.slice(0, n).map(([k]) => k);
  return { keep, rest: e.length > n };
}

/* The lender and CPA view: always the trailing twelve months, scored. */
function dbHealth(months, range, ser, bal){
  const cur = nowMonth();
  const full = months.filter(x => x.month < cur);
  const T = addUp(months);
  const F = addUp(full);
  const n = full.length || 1;
  const revs = full.map(x => x.revenue);
  const mean = revs.length ? sumOf(revs, v => v) / revs.length : 0;
  const cv = mean ? Math.sqrt(sumOf(revs, v => (v - mean) ** 2) / revs.length) / mean : 0;
  const profitable = full.filter(x => x.net > 0).length;
  const last3 = full.slice(-3), prev3 = full.slice(-6, -3);
  const growth = prev3.length === 3 && sumOf(prev3, 'revenue') ? (sumOf(last3, 'revenue') / sumOf(prev3, 'revenue') - 1) * 100 : null;
  const ranked = Object.entries(F.byClient).sort((p, q) => q[1] - p[1]);
  const topShare = ranked[0] && F.revenue ? ranked[0][1] / F.revenue * 100 : 0;
  const labor = (F.byTax['Contract labor (1099)'] || 0) / (F.revenue || 1) * 100;
  const margin = F.revenue ? F.net / F.revenue * 100 : 0;
  const avgSpend = full.slice(-3).length ? sumOf(full.slice(-3), expOf) / full.slice(-3).length : 0;
  const cash = bal?.connected ? (bal.cash || 0) - (bal.cards || 0) : null;
  const runway = cash != null && avgSpend ? cash / avgSpend : null;
  const score = (lvl, title, value, text) => `<div class="ln"><span class="n"><b>${title}</b><small>${text}</small></span>
    <span class="a" style="display:flex;flex-direction:column;align-items:flex-end;gap:3px"><span style="font-size:17px;font-weight:800">${value}</span><span class="flag ${lvl}">${{ good:'Healthy', warn:'Watch', bad:'Weak' }[lvl]}</span></span></div>`;
  const cards = [
    score(margin >= 25 ? 'good' : margin >= 10 ? 'warn' : 'bad', 'Profit margin', `${Math.round(margin)}%`, 'Net income as a share of revenue over the last twelve finished months. Service businesses that keep 20% or more have room to absorb a bad month.'),
    score(profitable >= n * .8 ? 'good' : profitable >= n * .6 ? 'warn' : 'bad', 'Profitable months', `${profitable} of ${full.length}`, 'How often the business made money. Lenders like to see it most months, not just on average.'),
    score(cv <= .2 ? 'good' : cv <= .35 ? 'warn' : 'bad', 'Revenue consistency', cv <= .2 ? 'Steady' : cv <= .35 ? 'Uneven' : 'Lumpy', `Monthly revenue moves about ${Math.round(cv * 100)}% around its average of ${money0(mean)}. Retainers make this steady.`),
    score(topShare <= 25 ? 'good' : topShare <= 40 ? 'warn' : 'bad', 'Client concentration', `${Math.round(topShare)}%`, `${ranked[0] ? esc(ranked[0][0]) : 'The top client'} is this share of revenue. Past about 25%, a lender sees one relationship as a risk.`),
    score(labor <= 45 ? 'good' : labor <= 60 ? 'warn' : 'bad', 'Team cost', `${Math.round(labor)}%`, 'Contract labor as a share of revenue. Agencies usually aim to keep delivery labor under about half of revenue.'),
    growth == null ? '' : score(growth >= 0 ? 'good' : growth >= -10 ? 'warn' : 'bad', 'Recent growth', `${growth >= 0 ? '+' : ''}${Math.round(growth)}%`, 'Revenue in the last three finished months against the three before.'),
    runway == null ? '' : score(runway >= 3 ? 'good' : runway >= 1.5 ? 'warn' : 'bad', 'Cash cushion', `${runway.toFixed(1)} mo`, `Cash after the card is paid (${money0(cash)}) covers this many months of spending. Three or more is comfortable.`),
  ].join('');
  const c = SERIES();
  const avg3 = months.map((x, i) => { const w = months.slice(Math.max(0, i - 2), i + 1); return w.length < 3 ? null : Math.round(sumOf(w, 'revenue') / 3); });
  $('#dbody').innerHTML = `
    <div class="notice" style="margin-bottom:14px"><span>The last twelve months, ${esc(rangeLabel([months[0].month, months[months.length-1].month]))}. The view a bank or a CPA reads first.</span></div>
    <div class="kpis">
      <div class="kpi"><div class="lbl">Revenue, last 12 months</div><div class="v">${money0(T.revenue)}</div><div class="s">about <b>${money0(mean)}</b> a finished month</div></div>
      <div class="kpi ${T.net>=0?'good':'bad'}"><div class="lbl">Net income, last 12 months</div><div class="v">${money0(T.net)}</div><div class="s">what the business earned for its owner, before income tax</div></div>
      <div class="kpi"><div class="lbl">Owner earnings a month</div><div class="v">${money0(F.net / n)}</div><div class="s">average net across finished months</div></div>
      <div class="kpi"><div class="lbl">Cash after the card</div><div class="v">${cash != null ? money0(cash) : '·'}</div><div class="s">${cash != null ? 'from the bank feed' : 'connect a bank to see this'}</div></div>
    </div>
    <div class="g g2">
      <div class="card">${cardH('Scorecard', 'How the business reads to someone deciding to lend', '', 'Each line is scored against common rules of thumb for small service businesses. They are guides, not verdicts.')}${cards}</div>
      <div class="stack">
        <div class="card">${cardH('Revenue trend', 'Monthly revenue and its three-month average', '', 'The line smooths out timing: a client paying late or early moves a bar, not the line.')}
          <div class="chart"><canvas id="cTrend"></canvas></div>
          ${legendHTML([['Monthly revenue', c[0]], ['Three-month average', c[1], 1]])}</div>
        <div class="card">${cardH('What a lender will ask for', 'Everything below comes out of Ledger')}
          <div class="ln click" onclick="RP.tab='pnl';RP.preset='lastyear';show('reports')"><span class="n">Profit and loss, last full year<small>Reports → Profit &amp; loss → Last year</small></span><span class="a linky">Open →</span></div>
          <div class="ln click" onclick="RP.tab='pnl';RP.preset='ytd';show('reports')"><span class="n">Profit and loss, this year to date<small>with the same period last year beside it</small></span><span class="a linky">Open →</span></div>
          <div class="ln click" onclick="RP.tab='exports';show('reports')"><span class="n">Full ledger and receipts<small>CSV and ZIP for the CPA or the underwriter</small></span><span class="a linky">Open →</span></div>
          <div class="ln"><span class="n">Business tax returns and bank statements<small>not in Ledger: from the CPA and the bank</small></span><span class="a muted">outside</span></div>
        </div>
      </div>
    </div>`;
  const labels = months.map(x => moLab(x.month, true));
  draw('trend', 'cTrend', { type: 'bar', data: { labels, datasets: [
    barDS('Monthly revenue', months.map(x => x.revenue), months.map(x => c[0] + (x.month === cur ? '70' : ''))),
    lineDS('Three-month average', avg3, c[1], { spanGaps: true }) ] }, options: chartOpts() });
}
