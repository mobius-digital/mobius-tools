/* ---- Drive import ---- */
async function renderDrive(){
  const el = $('#driveBody'); if (!el) return;
  let s;
  try { s = await api('/api/drive-status'); }
  catch(e){ el.innerHTML = `<span class="msg bad">${esc(e.message)}</span>`; return; }
  const gl = $('#driveGlance');
  if (gl) { gl.className = 'pill ' + (s.connected ? 'good' : ''); gl.textContent = s.connected ? '● Connected' : s.configured ? 'Not connected' : 'Not set up'; }

  if (!s.configured) {
    el.innerHTML = `Not set up yet · the Google client ID and secret need to go into
      <code>ledger/worker/.env</code> and be pushed to the worker. Ask Claude for the steps.`;
    return;
  }
  if (!s.connected) {
    el.innerHTML = `<button class="btn primary" onclick="driveConnect(this)">Connect Google Drive</button>
      <span class="tiny" style="margin-left:10px">Opens Google, asks for read-only access, comes straight back.</span>`;
    return;
  }
  const j = s.job;
  el.innerHTML = `
    <div class="row" style="margin-bottom:10px">
      <input id="drvFolder" placeholder="Paste the Drive folder link (e.g. the 2026 folder)"
        value="${esc(j?.folder||'')}" style="flex:1;min-width:260px;border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px">
      <button class="btn" onclick="driveScan(this)">Scan folder</button>
    </div>
    ${j ? `<div class="notice ${j.at>=j.total?'good':''}">
        <b>${j.at} of ${j.total}</b> files processed · ${j.attached} attached, ${j.noMatch} no match, ${j.unreadable} unreadable.
        ${j.at < j.total ? `<div class="row" style="margin-top:10px"><button class="btn primary" onclick="driveRun(this)">${j.at?'Resume':'Start'} import</button></div>` : ''}
      </div>
      <div class="row" style="margin-top:10px"><button class="btn" onclick="driveLog()">See what happened</button>
        <button class="btn" onclick="driveClear()">Clear this job</button></div>` : ''}
    <div id="drvMsg" class="msg"></div>`;
}
async function driveConnect(btn){
  btn.disabled = true;
  try {
    const r = await api('/api/drive-connect', { method:'POST' });
    window.open(r.url, '_blank', 'noopener');
    tell('Finish in the new tab', 'Approve read-only access to Drive, then come back here and reopen Settings.');
  } catch(e){ tell('Could not start', e.message); }
  btn.disabled = false;
}
async function driveScan(btn){
  const folder = $('#drvFolder').value.trim();
  if (!folder) { tell('Paste a folder link first', 'Open the folder in Drive and copy the address bar.'); return; }
  btn.disabled = true; btn.textContent = 'Scanning…';
  try {
    const r = await api('/api/drive-scan', { method:'POST', body: JSON.stringify({ folder }) });
    flash(`Found ${r.total} receipts across ${r.months.length} month(s).`);
    renderDrive();
  } catch(e){ $('#drvMsg').className='msg bad'; $('#drvMsg').textContent = e.message; btn.disabled = false; btn.textContent = 'Scan folder'; }
}
/* Batches of six, looped from here · each round trip is a handful of Drive
   downloads and Claude reads, which is all one request can finish. */
async function driveRun(btn){
  btn.disabled = true;
  const msg = $('#drvMsg'); msg.className = 'msg';
  try {
    for (;;) {
      const r = await api('/api/drive-import', { method:'POST' });
      msg.textContent = `${r.at} of ${r.total} · ${r.attached} attached, ${r.noMatch} no match, ${r.unreadable} unreadable`;
      if (r.done) break;
    }
    S.txns = null; window.__moCache={}; S.boot = await api('/api/boot');
    flash('Import finished.');
    renderDrive();
  } catch(e){ msg.className='msg bad'; msg.textContent = e.message + ' · press Resume to carry on.'; btn.disabled = false; }
}
async function driveLog(){
  try {
    const r = await api('/api/drive-log');
    openModal(`<h3>Import log</h3>
      <div class="hint">Newest last. "no unreceipted match" means the amount did not line up with a transaction still missing a receipt.</div>
      <div style="max-height:52vh;overflow:auto;margin-top:10px;font-size:12px;line-height:1.7">
        ${(r.log||[]).map(l=>`<div>${esc(l)}</div>`).join('') || '<div class="tiny">Nothing yet.</div>'}</div>
      <div class="acts"><span class="spacer"></span><button class="btn" onclick="closeModal()">Close</button></div>`);
  } catch(e){ tell('Could not load the log', e.message); }
}
async function driveClear(){
  if (!await ask({ title: 'Clear this import job?',
    body: 'Receipts already attached stay attached. This only forgets the scanned file list so you can start a different folder.',
    ok: 'Clear' })) return;

/* Two lists, because they do two different jobs and one table conflated them:
 *   RECURRING  · money out that repeats. The only list that creates anything.
 *   REMEMBERED · categories Ledger has learned. Never creates a transaction;
 *                it only saves you re-categorizing. This is where a restaurant
 *                lands, and why it needs search rather than a monthly/yearly
 *                setting it will never use. */
function catCell(v){
  const bucket = esc(v.bucket || 'Other');
  const tax = `<select data-ledger-event="change" data-ledger-action="saveVendorField" data-name="${esc(v.name)}" data-field="tax_cat" data-value="__input__">${S.boot.taxCats.map(c=>`<option ${c===v.tax_cat?'selected':''}>${esc(c)}</option>`).join('')}${S.boot.taxCats.includes(v.tax_cat)||!v.tax_cat?'':`<option selected>${esc(v.tax_cat)}</option>`}<option ${v.tax_cat==='Bank & merchant fees'?'selected':''}>Bank &amp; merchant fees</option></select>`;
  return { bucket, tax };
}
/* Filtering hides rows rather than re-rendering, so the field keeps focus. */
function filterVendors(q){
  q = (q || '').trim().toLowerCase();
  let n = 0;
  document.querySelectorAll('#memTbl tbody tr').forEach(tr => {
    const hit = !q || (tr.dataset.s || '').includes(q);
    tr.hidden = !hit; if (hit) n++;
  });
  const none = $('#memNone');
  if (none) { none.hidden = n > 0; none.textContent = `Nothing matches “${q}”.`; }
}
function vendorCards(vendors){

      ${v.cadence==='yearly'?` <select title="Renewal month" data-ledger-event="change" data-ledger-action="saveVendorField" data-name="${esc(v.name)}" data-field="renew_month" data-value="__input__">${MONTHS.map((mn,i)=>`<option value="${i+1}" ${v.renew_month===i+1?'selected':''}>${mn.slice(0,3)}</option>`).join('')}</select>`:''}
    </td>
    <td><button class="ctl" title="${v.active?'Pause forecasts, keep the rule':'Resume'}" data-ledger-event="click" data-ledger-action="saveVendorField" data-name="${esc(v.name)}" data-field="active" data-value="${v.active?0:1}">${v.active?'Pause':'Resume'}</button></td>
    <td><button class="del-x" title="Delete (transactions stay)" data-ledger-event="click" data-ledger-action="delVendor" data-name="${esc(v.name)}">✕</button></td></tr>`; };

  return `
    <div class="card" style="margin-top:14px">

      ${rec.length ? `<div class="tbl-wrap" style="margin-top:10px"><table class="rt"><thead><tr><th>Vendor</th><th>Bucket</th><th>Tax category</th><th class="num">Expected $</th><th>How often</th><th></th><th></th></tr></thead><tbody>
        ${monthly.map(recRow).join('')}${yearly.map(recRow).join('')}
      </tbody></table></div>` : '<div class="tiny" style="margin-top:10px">Nothing recurring yet.</div>'}
    </div>

    <div class="card" style="margin-top:14px">
      <h3>Remembered vendors <span class="tiny" style="font-weight:400">${mem.length}</span></h3>
      <div class="hint"><b>Fills itself · you never manage this list.</b> Every time a purchase gets categorized (by you, or by Ledger reading a receipt), the vendor's category is saved here as its default for next time. Defaults are suggestions, not laws: any single purchase can be flipped (Best Buy is usually supplies, but one trip can be product testing) and the newest choice becomes the new default. These rows <b>never create a transaction</b>. You only come here to fix a wrong default, or promote something to Recurring.</div>

        ${shown.map(v=>{ const c = catCell(v); return `<tr data-s="${esc((v.name+' '+(v.bucket||'')+' '+(v.tax_cat||'')).toLowerCase())}">
          <td><b>${esc(v.name)}</b></td><td>${c.bucket}</td><td>${c.tax}</td>

/* How each kind of Slack message reaches Cole. Saved on tap, no Save button. */
const NOTIFY_ROWS = [
  { k:'landed', title:'A waiting receipt went through',
    ex:'Example: the ⏳ Vimeo receipt finally matched its charge. The ⏳ becomes ✅ either way; this is the "✅ it\'s in now" message.' },
  { k:'decisions', title:'A receipt needs you to tap something',

  { k:'problems', title:'Something is wrong with the books',
    ex:'Example: the nightly check found a charge missing from the books, or a bank sync failed.' },
];
const NOTIFY_MODES = [
  ['ping', 'Ping me', 'Your phone buzzes'],
  ['channel', 'Show in channel', 'Visible in the channel, no buzz'],
  ['quiet', 'Quiet', 'Only inside the receipt\'s thread'],
];
function notifyCard(){
  const cur = S.boot.notify || {};
  return `<div class="card" style="margin-top:14px">
    <h3>Slack notifications</h3>
    <div class="hint">Choose how each kind of message reaches you in the finance channel. Changes save as soon as you tap.</div>
    ${NOTIFY_ROWS.map(r => `<div style="margin-top:16px">
      <div style="font-weight:600;font-size:13.5px">${r.title}</div>
      <div class="tiny" style="margin:3px 0 8px;line-height:1.5">${esc(r.ex)}</div>
      <div class="seg" role="radiogroup" aria-label="${esc(r.title)}" style="max-width:520px">
        ${NOTIFY_MODES.map(([v, label, sub]) => `<button type="button" role="radio" aria-checked="${(cur[r.k]||'ping')===v}"
          class="${(cur[r.k]||'ping')===v ? 'on' : ''}" title="${esc(sub)}"
          onclick="saveNotify('${r.k}','${v}',this)">${label}<br><span style="font-weight:400;font-size:11px;opacity:.8">${sub}</span></button>`).join('')}
      </div>
    </div>`).join('')}
    <span class="msg" id="ntMsg"></span>
  </div>`;
}
async function saveNotify(kind, mode, btn){
  const el = $('#ntMsg');
  const group = btn.parentElement;
  const before = [...group.children].find(b => b.classList.contains('on'));
  [...group.children].forEach(b => { const on = b === btn; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
  try {
    const r = await api('/api/settings', { method:'PUT', body: JSON.stringify({ notify: { [kind]: mode } }) });
    S.boot.notify = r.notify;
    el.className = 'msg good'; el.textContent = 'Saved.';
  } catch(e) {
    [...group.children].forEach(b => { const on = b === before; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
    el.className = 'msg bad'; el.textContent = 'Not saved: ' + e.message;
  }
}

}
async function saveClientField(name, field, value){
  const c = (S.boot.clients||[]).find(x=>x.name===name); if (!c) return;
  const body = { name, retainer: c.retainer||0, active: !!c.active, pct: c.pct };
  body[field] = field==='active' ? !!value : +value || (field==='retainer' ? 0 : null);

async function saveVendorField(name, field, value){
  const v = (S.boot.vendors||[]).find(x=>x.name===name); if (!v) return;
  const body = { name, bucket:v.bucket, tax_cat:v.tax_cat, recurring:!!v.recurring,

    body.recurring = value !== 'off';
    body.cadence = value === 'yearly' ? 'yearly' : 'monthly';
    if (value === 'yearly' && !body.renew_month) body.renew_month = new Date().getMonth()+1;
  }
  else if (field === 'renew_month') body.renew_month = +value;
  else if (field === 'active') body.active = !!value;
  else if (field === 'expected_amount') body.expected_amount = +value;
  else body[field] = value;
  if (field==='bucket'||field==='tax_cat') body.applyToExisting = await ask({
    title: 'Apply to existing transactions too?',
    body: "This vendor's past transactions can take the new category as well, or it can apply only from here on.",
    ok: 'Yes, update past ones', cancel: 'Future only' });
  await api('/api/vendor', { method:'POST', body: JSON.stringify(body) });
  S.boot = await api('/api/boot'); renderSettings();
  flash(`Saved · ${name} updated.`);
}
async function stripeSyncNow(btn){
  const el = $('#ssMsg'); btn.disabled = true;
  el.className='msg'; el.textContent='Syncing…';
  try {
    const to = new Date().toISOString().slice(0,10);
    const from = new Date(Date.now()-60*86400e3).toISOString().slice(0,10);
    const r = await api('/api/stripe-sync', { method:'POST', body: JSON.stringify({ from, to }) });
    el.className='msg good';
    el.textContent = `Done · ${r.added} new transaction(s)` + (r.review?`, ${r.review} need a client picked in Review`:'') + (r.skippedClosed?`, ${r.skippedClosed} skipped (closed months)`:'') + '.';
    S.boot = await api('/api/boot'); S.txns = null;
  } catch(e){ el.className='msg bad'; el.textContent=e.message; }
  btn.disabled = false;
}
async function slackPollNow(btn){
  const el = $('#spMsg'); btn.disabled = true;
  el.className='msg'; el.textContent='Checking #receipts…';
  try {
    const r = await api('/api/slack-poll', { method:'POST', body: JSON.stringify({}) });
    el.className = r.error ? 'msg bad' : 'msg good';
    el.textContent = r.error ? r.error : `Done · ${r.handled||0} new file(s) handled.`;
    S.txns = null; window.__moCache={}; S.boot = await api('/api/boot');
  } catch(e){ el.className='msg bad'; el.textContent=e.message; }
  btn.disabled = false;
}
function loadPlaidLink(){
  return new Promise((res, rej) => {
    if (window.Plaid) return res();
    const s = document.createElement('script');
    s.src = 'https://cdn.plaid.com/link/v2/stable/link-initialize.js';
    s.onload = res; s.onerror = () => rej(new Error('could not load Plaid Link'));
    document.head.appendChild(s);
  });
}
async function plaidConnect(btn){
  const el = $('#plMsg'); btn.disabled = true;
  el.className='msg'; el.textContent='Opening the bank picker…';
  try {
    await loadPlaidLink();
    const { link_token } = await api('/api/plaid-link-token', { method:'POST', body: JSON.stringify({}) });
    const handler = Plaid.create({
      token: link_token,
      onSuccess: async (public_token, meta) => {
        el.textContent = 'Linking…';
        try {
          const r = await api('/api/plaid-exchange', { method:'POST', body: JSON.stringify({ public_token, institution: meta.institution?.name }) });
          el.className='msg good'; el.textContent = `Connected ${r.name || 'account'} (${r.accounts} account${r.accounts>1?'s':''}) · syncing…`;
          await api('/api/plaid-sync', { method:'POST', body: JSON.stringify({}) });
          S.boot = await api('/api/boot'); S.txns = null; renderSettings();
        } catch(e){ el.className='msg bad'; el.textContent = e.message; }
      },
      onExit: (err) => { if (err) { el.className='msg bad'; el.textContent = err.display_message || err.error_message || 'Link closed.'; } else { el.textContent=''; } },
    });
    handler.open();
  } catch(e){ el.className='msg bad'; el.textContent = e.message; }
  btn.disabled = false;
}
/* The audit button. "Sync now" only asks for what changed since last time;
   this re-reads the whole month from the bank, so a charge the feed dropped
   can actually come back. */
async function plaidBackfill(btn){
  const el = $('#plMsg'); const label = btn.textContent;
  if (!await ask({ title: `Re-check ${moName(S.month)} against the bank?`,
    body: 'Reads every transaction that month straight from Novo and Amex and adds any the feed missed. Nothing is duplicated · anything already in the ledger is left alone.',
    ok: 'Re-check it' })) return;
  btn.disabled = true; btn.textContent = 'Reading the bank…';
  el.className='msg'; el.textContent='This can take a moment.';
  try {
    const r = await api('/api/plaid-backfill', { method:'POST', body: JSON.stringify({ month: S.month }) });
    if (r.failed) throw new Error(`${r.failed} bank row(s) failed: ${r.lastError || 'Re-check required'}`);
    el.className = r.recovered ? 'msg good' : 'msg';
    el.textContent = r.recovered
      ? `Recovered ${r.recovered} missing charge(s) · they are in ${moName(S.month)} now.`
      : r.closedSkipped ? `${r.closedSkipped} missing charge(s) found, but ${moName(S.month)} is closed · reopen it and re-check.`
      : `No new charges imported for ${moName(S.month)}. Use bank comparison to review discrepancies.`;
    S.txns = null; window.__moCache = {}; S.boot = await api('/api/boot');
  } catch(e){ el.className='msg bad'; el.textContent = e.message; }
  btn.disabled = false; btn.textContent = label;
}
/* The year-end button. Re-check fixes one month inside the rules; this one
   goes outside them on purpose · past the import start date and into months
   that are already closed · because a tax year handed to a CPA has to match
   the statements, not the day the bank happened to be connected. Months it
   touches are left OPEN so their numbers get read before being frozen again. */
async function plaidYear(btn){
  const el = $('#plMsg'); const label = btn.textContent;
  const yr = new Date().getFullYear();
  if (!await ask({title:`Read ${yr} from the bank?`,body:'Import missing charges into open months. Closed months and existing unmatched records stay unchanged. Review discrepancies afterward.',ok:'Read the year'})) return;
  btn.disabled = true; btn.textContent = 'Reading the year\u2026';
  el.className='msg'; el.textContent='This reads thousands of lines · give it a minute.';
  try {
    const r = await api('/api/plaid-import', { method:'POST',
      body: JSON.stringify({ from: yr + '-01-01', to: (yr+1) + '-01-01', reopen: false, replace: false }) });
    const added = (r.added||0) + (r['added-review']||0);
    if(r.failed || r.error || r.skipped) throw new Error(r.lastError || r.error || r.skipped || `${r.failed} bank rows failed`);
    el.className='msg good';
    el.textContent = `Read ${r.bankCount||0} bank lines back to ${r.bankHistoryFrom||'?'} · ${added} added, `
      + `${r.migrated||0} re-linked, ${r.replacedCount||0} typed rows replaced, `
      + `${r.notOnBank||0} the bank never mentioned`
      + (r.reopened && r.reopened.length ? ` · reopened ${r.reopened.join(', ')}` : '') + '.';
    S.txns = null; window.__moCache = {}; S.boot = await api('/api/boot');
  } catch(e){ el.className='msg bad'; el.textContent = e.message; }
  btn.disabled = false; btn.textContent = label;
}
async function plaidSyncNow(btn){
  const el = $('#plMsg'); btn.disabled = true;
  el.className='msg'; el.textContent='Syncing bank feeds…';
  try {
    const r = await api('/api/plaid-sync', { method:'POST', body: JSON.stringify({}) });
    const bits = Object.entries(r).filter(([k])=>k!=='ok').map(([k,v])=>`${v} ${k.replace(/-/g,' ')}`);
    el.className='msg good'; el.textContent = 'Done · ' + (bits.join(', ') || 'nothing new') + '.';
    S.boot = await api('/api/boot'); S.txns = null;
  } catch(e){ el.className='msg bad'; el.textContent=e.message; }
  btn.disabled = false;
}
async function plaidRemove(itemId){
  if (!await ask({ title: 'Disconnect this account?',
    body: 'Already-imported transactions stay in the ledger; it just stops syncing.',
    ok: 'Disconnect', danger: true })) return;
  await api('/api/plaid-item?item_id=' + encodeURIComponent(itemId), { method:'DELETE' });
  S.boot = await api('/api/boot'); renderSettings();
}
async function savePw(){
  const el = $('#pwMsg');
  try { await api('/api/password', { method:'POST', body: JSON.stringify({ password: $('#sPw').value }) });
    el.className='msg good'; el.textContent='Password set.'; }
  catch(e){ el.className='msg bad'; el.textContent=e.message; }
}

/* ================= live refresh ================= */
/* Slack buttons and the nightly syncs change the books while the app just
   sits there; the badge lied until a manual reload. Counts refresh once a
   minute and whenever the tab comes back to front - and a view redraws only
   when nothing is mid-edit (no modal, no dropdown, not typing in search). */
async function refreshBoot(){
  if (!S.tok) return;
  try {
    const nb = await api('/api/boot');
    const changed = nb.revision !== S.renderedRevision || JSON.stringify(nb.flags) !== JSON.stringify(S.boot?.flags);
    S.boot = nb;
    let exceptions=$('#ledgerExceptions');
    if(!exceptions){exceptions=document.createElement('div');exceptions.id='ledgerExceptions';exceptions.className='notice bad';$('#main').before(exceptions);}
    exceptions.hidden=!nb.exceptions?.length;exceptions.textContent=(nb.exceptions||[]).map(x=>x.kind+': '+x.error).join(' · ');
    paintNav();
    const busy = document.querySelector('.modal.on') || MSEL.open
      || document.activeElement === $('#txnSearch');
    if (changed && !busy && (S.view === 'overview' || S.view === 'txns')) {
      S.renderedRevision = nb.revision;
      S.txns = null; window.__moCache = {};
      if (S.view === 'overview') { S.rt = (S.rt || 0) + 1; renderOverview(); } else renderTxns();
    }
  } catch (e) { /* a blip must never log him out or blank a view */ }
}
setInterval(() => { if (!document.hidden) refreshBoot(); }, 60e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshBoot(); });

const ledgerActions = { saveVendorField, saveClientField, delVendor, delClient, delTaxCat, whatIf, plaidRemove, setBillingUrl };
for (const event of ['click', 'change']) document.addEventListener(event, e => {
  const el = e.target.closest('[data-ledger-action]');
  if (!el || el.dataset.ledgerEvent !== event) return;
  const fn = ledgerActions[el.dataset.ledgerAction];
  const value=el.dataset.value === '__input__' ? el.value : /^(0|1)$/.test(el.dataset.value || '') ? Number(el.dataset.value) : el.dataset.value;
  if (fn) Promise.resolve(fn(el.dataset.name, el.dataset.field, value)).catch(e=>tell('Could not save',e.message));
});
/* ================= go =================

   PHONE SHEETS. Everything modal in Ledger is one #modal / .mbox pair toggled
   with a class, and the "more" panel is one .sheet toggled the same way, so
   two registrations cover the whole app - including every modal added later.

   `close` and `fallbackClose` point at the app's own close functions rather
   than at anything sheet.js invents, because those functions are where the
   real work lives: closeModal() clears window.__askCancel, without which a
   dismissed ask() would leave `await ask(...)` hanging forever. */
if (window.MobiusSheet) {
  MobiusSheet.bindToggle({
    wrap: '#modal', box: '.mbox', openClass: 'on',
    media: '(max-width:767px)',
    // #modal has no colour of its own - it dims with the separate #scrim,
    // which ledger.css hides while a sheet is up so the two do not stack.
    backdropColor: 'var(--scrim)',
    fallbackClose: () => closeModal()
  });
  MobiusSheet.bindPanel({
    panel: '#sheet', openClass: 'on', axis: 'y',
    media: '(max-width:767px)', close: () => closeSheet()
  });
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ================= THE CONTROLLER =================
   The agency's finance controller, in the app: what it found this week on
   the Overview, and a panel that answers questions anywhere (the same brain
   as Slack, same read-only reach, ../ask/ask-ui.js). */
const SCREEN_NAMES = { overview: 'Overview (the month at a glance)', txns: 'Transactions', receipts: 'Receipts',
  dashboards: 'Dashboards (charts over time)', reports: 'Reports (the P&L report card)', close: 'Close the month', settings: 'Settings' };
AskUI.init({
  name: 'Controller', api, esc, flash, confirm: ask, cardH,
  intro: 'Ask me anything about the books. Try: "who has not paid this month?", "what did we spend on contractors in August?", "why was last month a loss?", "keep an eye on software spend over $2,000 a month".',
  screen: () => {
    try {
      const view = PARENT[S.view] || S.view;
      const ctx = { screen: SCREEN_NAMES[view] || view, screen_id: view, month_selected: S.month };
      if (view === 'reports') ctx.report_month = S.reportMonth || S.month;
      if (view === 'txns' && S.filter && S.filter !== 'all') ctx.list_filtered_to = S.filter;
      if (view === 'txns' && (S.q || '').trim()) ctx.search_box = S.q.trim();
      if (view === 'settings') ctx.settings_section = SET.sec;
      return ctx;
    } catch (e) { return null; }
  },
});
/* The Overview leads with what the Controller found, then the numbers. */
const _renderOverviewBase = renderOverview;
renderOverview = async function(){
  await _renderOverviewBase();
  if ((PARENT[S.view] || S.view) !== 'overview') return;
  AskUI.mount(document.querySelector('#main .ph'));
};
boot();
