<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mobius Ledger</title>
<meta name="description" content="Money in, money out, month close and the CPA pack — Mobius Digital's internal finance tool.">
<link rel="icon" href="../icons/ledger-192.png" type="image/png">
<link rel="apple-touch-icon" href="../icons/ledger-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../mobius.css">
<style>
  /* ---- page furniture ---- */
  .hdr{background:var(--hd);color:var(--on-ink);position:sticky;top:0;z-index:20}
  .hdr .in{max-width:1140px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:14px;height:54px}
  .hdr .wm{font-family:var(--serif);font-size:19px;color:#fff;white-space:nowrap}
  .hdr .wm em{font-style:italic;color:var(--brand)}
  .hdr nav{display:flex;gap:2px;margin-left:10px;overflow-x:auto;scrollbar-width:none}
  .hdr nav::-webkit-scrollbar{display:none}
  .hdr nav button{color:var(--on-ink-2);font-size:13px;font-weight:600;padding:7px 11px;border-radius:8px;white-space:nowrap;position:relative}
  .hdr nav button:hover{color:#fff}
  .hdr nav button.on{color:#fff;background:var(--hd-line)}
  .hdr nav button .bdg{display:inline-block;min-width:16px;text-align:center;background:var(--warn-on);color:var(--hd);font-size:10px;font-weight:700;border-radius:99px;padding:1px 4px;margin-left:5px;vertical-align:1px}
  .hdr .chip-conn{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--on-ink-2);border:1px solid var(--hd-line);border-radius:99px;padding:4px 10px;white-space:nowrap}
  .hdr .chip-conn[data-s=live]{color:var(--good-on);border-color:rgba(95,210,146,.4)}
  .hdr .chip-conn[data-s=down]{color:var(--bad-on)}
  main{max-width:1140px;margin:0 auto;padding:22px 18px 90px}
  /* mobius.css sets .lg-num to the ink color, which vanishes on the dark roll-up */
  .rollup .lg-num{color:var(--on-ink)}
  .toggle{cursor:pointer}
  /* settings field groups: label sits ON its input, groups breathe */
  .fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 16px;margin-top:12px}
  .fld label{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;white-space:nowrap}
  .del-x{color:var(--muted);font-size:15px;line-height:1;padding:4px 7px;border-radius:6px}
  .del-x:hover{color:var(--bad);background:var(--bad-bg)}
  /* CPA pack: monthly P&L grid + its own print layout */
  .pl-tbl th,.pl-tbl td{white-space:nowrap}
  .pl-tbl td.num{font-variant-numeric:tabular-nums}
  .pl-tbl tr.hd-row td{font-weight:700;border-top:2px solid var(--line-strong)}
  #cpaPrint{display:none}
  @media print{
    body.print-cpa #rptCard,body.print-cpa .rpt-picker{display:none!important}
    body.print-cpa #cpaPrint{display:block}
    #cpaPrint .rpt{border:none;padding:0;max-width:none}
    #cpaPrint table{page-break-inside:auto}
  }
  .mo-nav{display:flex;align-items:center;gap:8px}
  .mo-nav b{font-size:14px;min-width:112px;text-align:center}
  .mo-nav button{border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);width:26px;height:26px;font-size:13px;line-height:1}
  .mo-nav button:hover{border-color:var(--brand-ink)}
  .mo-lock{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:99px;padding:2px 8px}
  .mo-lock.closed{background:var(--good-bg);color:var(--good)}
  .mo-lock.open{background:var(--warn-bg);color:var(--warn)}

  /* ---- modal shell ---- */
  .scrim{position:fixed;inset:0;background:rgba(12,22,29,.45);z-index:40;display:none}
  .scrim.on{display:block}
  .modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 14px}
  .modal.on{display:flex}
  .mbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px;max-width:520px;width:100%;box-shadow:0 24px 70px rgba(12,22,29,.3)}
  .mbox .mrow{display:flex;gap:10px;margin-top:10px}
  .mbox .mrow>div{flex:1;min-width:0}
  .mbox label{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
  .mbox label .why{display:block;font-weight:400;letter-spacing:0;text-transform:none;font-size:11.5px;margin-top:1px}
  .mbox input,.mbox select,.mbox textarea{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;font:inherit;font-size:13.5px;background:var(--surface)}
  .mbox .acts{display:flex;gap:10px;margin-top:20px;align-items:center}
  .mbox .acts .spacer{flex:1}
  .seg{display:flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden}
  .seg button{flex:1;padding:8px;font-size:13px;font-weight:600;color:var(--muted)}
  .seg button.on{background:var(--hd);color:#fff}
  .ck{display:flex;gap:9px;align-items:flex-start;margin-top:12px;font-size:13px;cursor:pointer}
  .ck input{width:auto;margin-top:2px}
  .ck small{display:block;color:var(--muted);font-size:11.5px}

  /* ---- transactions table ---- */
  .txn-tbl td{white-space:normal}
  .txn-tbl .amt{font-family:var(--serif);font-size:17px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .txn-tbl .amt.in{color:var(--good)}
  .txn-tbl .amt.neg{color:var(--bad)}
  .txn-tbl tbody tr{cursor:pointer}
  .txn-tbl tbody tr:hover td{background:var(--brand-soft)}
  .txn-tbl .cat{font-size:11.5px;color:var(--muted)}
  .rc{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;white-space:nowrap}
  .rc.has{background:var(--good-bg);color:var(--good)}
  .rc.miss{background:var(--warn-bg);color:var(--warn)}
  .rc.na{background:var(--unk-bg);color:var(--unk)}

  /* ---- receipts ---- */
  .drop{border:2px dashed var(--line-strong);border-radius:var(--radius);background:var(--surface);padding:34px 20px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s}
  .drop:hover,.drop.over{border-color:var(--brand-ink);color:var(--brand-ink);background:var(--brand-soft)}
  .drop b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
  .vault{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .vitem{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;font-size:11.5px}
  .vitem:hover{border-color:var(--brand-ink)}
  .vitem .vt{font-weight:700;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vitem .vm{color:var(--muted)}

  /* ---- close checklist ---- */
  .clx{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .cli{display:flex;gap:13px;align-items:flex-start;padding:14px 18px;border-bottom:1px solid var(--line)}
  .cli:last-child{border-bottom:none}
  .cli .ic{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px}
  .cli.ok .ic{background:var(--good-bg);color:var(--good)}
  .cli.warn .ic{background:var(--warn-bg);color:var(--warn)}
  .cli.info .ic{background:var(--unk-bg);color:var(--unk)}
  .cli b{font-size:14px}
  .cli p{color:var(--muted);font-size:12.5px;margin-top:1px}
  .cli .go{margin-left:auto;flex:none;font-size:12.5px;font-weight:700;color:var(--brand-ink);cursor:pointer;white-space:nowrap;padding:4px 0}

  /* ---- report card ---- */
  .rpt{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px 30px;max-width:820px}
  .rpt h1{font-family:var(--serif);font-weight:400;font-size:26px}
  .rpt .rsub{color:var(--muted);font-size:12.5px;margin-bottom:18px}
  .rpt .figs{display:flex;flex-wrap:wrap;border-top:1px solid var(--line-strong);border-bottom:1px solid var(--line);margin-bottom:18px}
  .rpt .figs .fig{flex:1 1 140px}
  .rpt h4{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
  .kv{width:100%;border-collapse:collapse;font-size:13.5px}
  .kv td{padding:8px 0;border-bottom:1px solid var(--line);white-space:normal}
  .kv td:last-child{text-align:right;font-family:var(--serif);font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .kv tr.tot td{font-weight:700;border-bottom:none}
  .kv tr.tot td:last-child{font-size:18px}
  .fig-l{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .fig-v{font-size:26px}
  .fig-d{font-size:11.5px;color:var(--muted);margin-top:2px}
  .split-tbl td:first-child small{display:block;color:var(--muted);font-size:11px}

  /* ---- forecast / misc ---- */
  .bars{display:flex;align-items:flex-end;gap:6px;height:130px;margin-top:8px}
  .bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;height:100%;text-align:center;min-width:0}
  .bars .b .f{border-radius:3px 3px 0 0;background:var(--brand);min-height:2px}
  .bars .b .f.ex{background:var(--line-strong)}
  .bars .b .m{font-size:10px;color:var(--muted);white-space:nowrap}
  .conc{display:flex;height:14px;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
  .leg{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:11.5px;color:var(--muted)}
  .leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
  .grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .msg{font-size:13px;margin-top:10px}
  .msg.bad{color:var(--bad)}
  .msg.good{color:var(--good)}
  footer{max-width:1140px;margin:0 auto;padding:0 18px 34px;color:var(--muted);font-size:12px}

  @media print{
    body{background:#fff}
    .hdr,footer,.no-print{display:none!important}
    main{padding:0;max-width:none}
    .rpt{border:none;padding:0;max-width:none}
  }
</style>
</head>
<body>

<header class="hdr no-print">
  <div class="in">
    <span class="wm">Mobius <em>Ledger</em></span>
    <nav id="nav"></nav>
    <span class="chip-conn" id="connChip">…</span>
  </div>
</header>

<main id="main"></main>

<div class="scrim" id="scrim"></div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>

<footer class="no-print">Mobius Ledger · the sheet's own formulas: net = revenue − expenses − merchant fee; the app never moves money — it computes the split, you make the transfers.</footer>

<script>
'use strict';
/* ================= config / state ================= */
const DEFAULT_WORKER_URL = 'https://mobius-ledger.mobius-digital.workers.dev';
const LS = { url:'ledger_worker', tok:'ledger_token', month:'ledger_month' };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* Shared Mobius session (set by /hq Google sign-in; same origin, all tools). */
function sharedSession() {
  const t = localStorage.getItem('mobius_session');
  const exp = +localStorage.getItem('mobius_session_exp') || 0;
  return t && (exp === 0 || exp > Date.now() + 60e3) ? t : null;
}

const nowMonth = () => new Date().toISOString().slice(0, 7);
let S = {
  url: localStorage.getItem(LS.url) || DEFAULT_WORKER_URL,
  tok: localStorage.getItem(LS.tok) || sharedSession() || '',
  view: 'dash',
  month: localStorage.getItem(LS.month) || nowMonth(),
  boot: null, summary: null, txns: null, txnMonth: null,
  filter: 'all', packData: null, report: null, reportMonth: null,
};

async function api(path, opts = {}) {
  const res = await fetch(S.url.replace(/\/+$/,'') + path, {
    ...opts,
    headers: { 'Authorization': 'Bearer ' + S.tok,
      ...(opts.body ? { 'Content-Type': 'application/json' } : {}), ...(opts.headers||{}) },
  });
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || ('HTTP ' + res.status));
  return j;
}

/* ================= formatting ================= */
const fmt$ = n => (n < 0 ? '−$' : '$') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtK = n => (n < 0 ? '−$' : '$') + (Math.abs(n) >= 1000 ? (Math.abs(n)/1000).toFixed(1).replace(/\.0$/,'') + 'K' : Math.abs(n).toFixed(0));
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const moName = m => MONTHS[+m.slice(5,7)-1] + ' ' + m.slice(0,4);
const moShort = m => MONTHS[+m.slice(5,7)-1].slice(0,3);
const addMonths = (m, n) => { const d = new Date(m + '-15T12:00:00Z'); d.setUTCMonth(d.getUTCMonth()+n); return d.toISOString().slice(0,7); };
const fmtDate = d => new Date(d + 'T12:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric'});
const moState = m => (S.boot?.months || []).find(x => x.month === m)?.status || 'open';

/* ================= boot ================= */
async function boot() {
  if (!S.tok) return renderGate();
  setChip('…', 'off');
  try {
    S.boot = await api('/api/boot');
    // idempotent: make sure this month's expected recurring rows exist
    if (moState(nowMonth()) !== 'closed') await api('/api/recurring', { method:'POST', body: JSON.stringify({ month: nowMonth() }) }).catch(()=>{});
    setChip('Live', 'live');
    show(S.view);
  } catch (e) {
    if (/unauthorized/i.test(e.message)) {
      const wasShared = S.tok && S.tok === sharedSession();
      S.tok=''; localStorage.removeItem(LS.tok);
      if (wasShared) { ['mobius_session','mobius_session_email','mobius_session_exp'].forEach(k=>localStorage.removeItem(k)); return renderGate('Your session expired — sign in again.'); }
      return renderGate('Wrong password — try again.');
    }
    setChip('Worker down', 'down');
    $('#main').innerHTML = `<div class="gate"><h1>Can't reach the worker</h1><p>${esc(e.message)}</p>
      <button class="cta" onclick="boot()">Retry</button></div>`;
  }
}
function setChip(t, s){ const c=$('#connChip'); c.textContent=t; c.dataset.s=s; }

function renderGate(err) {
  setChip('Signed out','off');
  $('#nav').innerHTML = '';
  $('#main').innerHTML = `
  <div class="gate">
    <h1>Mobius Ledger</h1>
    <p>Money in, money out, and the end-of-month report card. Sign in once at Mobius HQ and every internal tool opens.</p>
    <a class="cta" style="display:block;text-align:center;text-decoration:none" href="../hq/?next=/ledger/">Continue with Google</a>
    ${err ? `<div class="err">${esc(err)}</div>` : ''}
    <details style="margin-top:16px"><summary style="font-size:12px;color:var(--muted);cursor:pointer">Use a password instead</summary>
      <label>Password</label><input id="gTok" type="password" placeholder="password">
      <button class="cta" id="gGo" style="margin-top:12px">Sign in</button>
      <label>Worker URL</label><input id="gUrl" value="${esc(S.url)}">
    </details>
  </div>`;
  const go = () => {
    S.url = ($('#gUrl').value || '').trim() || DEFAULT_WORKER_URL;
    S.tok = $('#gTok').value.trim();
    localStorage.setItem(LS.url, S.url); localStorage.setItem(LS.tok, S.tok);
    boot();
  };
  $('#gGo').onclick = go;
  $('#gTok').addEventListener('keydown', e => { if (e.key==='Enter') go(); });
}

/* ================= nav ================= */
const VIEWS = [
  ['dash','Dashboard'], ['txns','Transactions'], ['receipts','Receipts'],
  ['close','Close'], ['reports','Reports'], ['forecast','Forecast'], ['settings','Settings'],
];
function navHTML(){
  const rv = Object.values(S.boot?.flags || {}).reduce((s,f)=>s+(+f.review||0),0);
  return VIEWS.map(([id,label]) =>
    `<button class="${S.view===id?'on':''}" onclick="show('${id}')">${label}${id==='txns'&&rv?`<span class="bdg">${rv}</span>`:''}</button>`).join('');
}
function show(view){
  S.view = view;
  $('#nav').innerHTML = navHTML();
  ({dash:renderDash, txns:renderTxns, receipts:renderReceipts, close:renderClose,
    reports:renderReports, forecast:renderForecast, settings:renderSettings}[view])();
}
function setMonth(m){ S.month = m; localStorage.setItem(LS.month, m); S.txns=null; show(S.view); }
function monthNav(){
  const st = moState(S.month);
  return `<div class="mo-nav no-print">
    <button onclick="setMonth('${addMonths(S.month,-1)}')" aria-label="Previous month">‹</button>
    <b>${moName(S.month)}</b>
    <button onclick="setMonth('${addMonths(S.month,1)}')" aria-label="Next month">›</button>
    <span class="mo-lock ${st}">${st === 'closed' ? 'Closed' : 'Open'}</span>
  </div>`;
}

/* ================= dashboard ================= */
async function renderDash(){
  const m = $('#main');
  m.innerHTML = '<div class="sub">Loading…</div>';
  let sum;
  try { sum = await api('/api/summary?month=' + S.month); } catch(e){ m.innerHTML = `<div class="notice bad">${esc(e.message)}</div>`; return; }
  S.summary = sum;
  const r = sum.report, a = sum.attention;
  const needs = (+a.review||0) + (+a.expected||0);
  const st = moState(S.month);
  const verdictCls = needs ? 'warn' : 'good';
  const verdict = st === 'closed'
    ? `${moName(S.month)} is closed — the report card is frozen. Net income came to <b>${fmt$(r.net)}</b> at a ${r.margin ?? '—'}% margin.`
    : needs
      ? `${needs} item${needs>1?'s':''} need${needs>1?'':'s'} you before ${moName(S.month)} can close — ${+a.expected||0} expected to confirm, ${+a.review||0} in review.`
      : `Nothing needs you right now. When the month ends, Close takes about a minute.`;

  const yr = sum.year || [];
  const maxV = Math.max(1, ...yr.map(x => Math.max(x.revenue, x.expenses + x.fees)));
  const bars = yr.map(x => `
    <div class="b" title="${moName(x.month)} — in ${fmt$(x.revenue)}, out ${fmt$(x.expenses + x.fees)}">
      <div class="f" style="height:${Math.round(x.revenue/maxV*100)}%"></div>
      <div class="f ex" style="height:${Math.max(2,Math.round((x.expenses+x.fees)/maxV*100))}%"></div>
      <span class="m">${moShort(x.month)}</span>
    </div>`).join('');

  const renew = (sum.renewals||[]).slice(0,8).map(v =>
    `<tr><td>${esc(v.name)}</td><td class="num">${fmt$(v.expected_amount||0)}</td></tr>`).join('');

  m.innerHTML = `
    <div class="ph"><div><h2>Where the money stands</h2>
      <div class="sub" style="margin-bottom:0">Everything below covers <b>${moName(S.month)}</b>. Confirmed transactions only — expected rows wait until you confirm them.</div></div>
      ${monthNav()}</div>

    <div class="rollup">
      <div class="ru"><div class="fig-l" style="color:var(--on-ink-2)">Money in</div><div class="fig-v lg-num">${fmtK(r.revenue)}</div></div>
      <div class="ru"><div class="fig-l" style="color:var(--on-ink-2)">Money out</div><div class="fig-v lg-num">${fmtK(r.expenses + r.fees)}</div></div>
      <div class="ru"><div class="fig-l" style="color:var(--on-ink-2)">Net income</div><div class="fig-v lg-num" style="color:${r.net>=0?'var(--good-on)':'var(--bad-on)'}">${fmtK(r.net)}</div></div>
      <div class="ru"><div class="fig-l" style="color:var(--on-ink-2)">Margin</div><div class="fig-v lg-num">${r.margin != null ? r.margin + '%' : '—'}</div></div>
      <div class="ru"><div class="fig-l" style="color:var(--on-ink-2)">Set aside for tax (${r.taxPct}%)</div><div class="fig-v lg-num">${fmtK(r.taxes)}</div></div>
    </div>

    <p class="verdict ${verdictCls}">${verdict}</p>

    <div class="grp"><span class="ct">Needs you</span><span class="ln"></span></div>
    <div class="grid3">
      <div class="sc ${+a.expected?'wn':'ok'}" onclick="S.filter='expected';show('txns')">
        <div class="fig-l">Expected, unconfirmed</div><div class="fig-v lg-num">${+a.expected||0}</div>
        <div class="fig-d">Recurring rows the engine pre-created — tap to confirm the amount landed.</div></div>
      <div class="sc ${+a.review?'wn':'ok'}" onclick="S.filter='review';show('txns')">
        <div class="fig-l">Review inbox</div><div class="fig-v lg-num">${+a.review||0}</div>
        <div class="fig-d">New vendors waiting for a category — one tap makes it a permanent rule.</div></div>
      <div class="sc ${+a.noReceipt?'wn':'ok'}" onclick="show('receipts')">
        <div class="fig-l">Missing receipts</div><div class="fig-v lg-num">${+a.noReceipt||0}</div>
        <div class="fig-d">Expenses this month without a receipt attached — the old yellow highlight.</div></div>
      <div class="sc ${st==='closed'?'ok':''}" onclick="show('close')">

const FILTERS = [['all','All'],['in','Money in'],['out','Expenses'],['transfer','Transfers'],['expected','Expected'],['review','Review'],['norcpt','No receipt']];

/* ---- receipts plumbing ---- */
function downscale(file){
  return new Promise((resolve, reject) => {
    if (!/^image\//.test(file.type)) { // PDFs etc. pass through untouched
      const r = new FileReader();
      r.onload = () => resolve({ data: r.result.split(',')[1], type: file.type || 'application/octet-stream' });
      r.onerror = reject; r.readAsDataURL(file); return;
    }
    const img = new Image();
    img.onload = () => {
      const MAX = 1800, scale = Math.min(1, MAX / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      resolve({ data: c.toDataURL('image/jpeg', .82).split(',')[1], type: 'image/jpeg' });
      URL.revokeObjectURL(img.src);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
function pickFile(cb){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*,application/pdf';
  inp.onchange = () => inp.files[0] && cb(inp.files[0]);
  inp.click();
}
async function attachReceipt(id){
  pickFile(async file => {
    const el = $('#eMsg'); if (el){ el.className='msg'; el.textContent='Uploading…'; }
    try {

      await api('/api/receipt', { method:'POST', body: JSON.stringify({ id, name: file.name, type, data }) });
      closeModal(); S.txns=null; S.boot = await api('/api/boot'); show(S.view);
    } catch(e){ if (el){ el.className='msg bad'; el.textContent=e.message; } }
  });
}

/* ---- CSV import ---- */
function importModal(){
  openModal(`
    <h3>Import a CSV</h3>
    <div class="hint">A bank or card export works as-is if it has date, description and amount columns. Every row lands as an expense in Review unless the vendor is already known.</div>
    <label>Paste CSV or choose a file</label>
    <textarea id="csvText" rows="6" placeholder="date,description,amount\n2026-09-03,SLACK T012345,52.50"></textarea>
    <div class="row" style="margin:10px 0 0"><button class="btn" onclick="pickCsv()">Choose file…</button></div>
    <div class="acts"><span class="spacer"></span>
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="runImport()">Preview & import</button></div>
    <div class="msg" id="csvMsg"></div>`);
}
function pickCsv(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='.csv,text/csv';
  inp.onchange = () => { const r = new FileReader(); r.onload = () => $('#csvText').value = r.result; r.readAsText(inp.files[0]); };
  inp.click();
}
function parseCsv(text){
  const lines = text.trim().split(/\r?\n/).map(l => l.split(',').map(c => c.trim().replace(/^"|"$/g,'')));
  if (lines.length < 2) return [];
  const hd = lines[0].map(h => h.toLowerCase());
  const di = hd.findIndex(h => /date/.test(h));
  const vi = hd.findIndex(h => /desc|vendor|payee|name|merchant/.test(h));
  const ai = hd.findIndex(h => /amount|amt|debit|charge/.test(h));
  if (di < 0 || vi < 0 || ai < 0) return null;
  return lines.slice(1).map(c => {
    let d = c[di] || '';
    const mdY = d.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
    if (mdY) d = `${mdY[3].length===2?'20'+mdY[3]:mdY[3]}-${mdY[1].padStart(2,'0')}-${mdY[2].padStart(2,'0')}`;
    return { date: d, vendor: (c[vi]||'').slice(0,120), amount: Math.abs(parseFloat((c[ai]||'').replace(/[$,]/g,''))), type:'out', source:'import' };
  }).filter(r => /^\d{4}-\d{2}-\d{2}$/.test(r.date) && r.vendor && r.amount > 0);
}
async function runImport(){
  const el = $('#csvMsg');
  const rows = parseCsv($('#csvText').value);
  if (rows === null) { el.className='msg bad'; el.textContent='Could not find date / description / amount columns in the header row.'; return; }
  if (!rows.length) { el.className='msg bad'; el.textContent='No usable rows found.'; return; }
  el.className='msg'; el.textContent=`Importing ${rows.length} rows…`;
  try {
    const res = await api('/api/transactions', { method:'POST', body: JSON.stringify({ rows }) });
    el.className='msg good'; el.textContent=`Imported ${res.inserted.length} of ${rows.length} (skipped rows fell in closed months). Known vendors categorized themselves; the rest are in Review.`;
    S.txns=null; S.boot = await api('/api/boot');
    setTimeout(() => { closeModal(); show('txns'); }, 1600);
  } catch(e){ el.className='msg bad'; el.textContent=e.message; }
}

      ${item(expected.length===0, true, 'Expected rows confirmed',

        `S.filter='expected';show('txns')`)}
      ${item(review.length===0, true, 'Review inbox empty',
        review.length ? `${review.length} transaction(s) still need categories.` : 'Everything is categorized — both layers.',

        `addModal({type:'out'})`)}

async function doClose(){
  const el = $('#clMsg');

/* The accountant's layout: tax categories down the side, months across,
 * totals on the right — the shape a P&L is read in, on screen and in print. */
function plTableHTML(p, { compactCap = 0 } = {}){
  const months = p.monthReports.map(r => r.month);
  const cats = [...new Set(p.transactions.filter(t=>t.type!=='in').map(t=>t.tax_cat||'Uncategorized'))];
  const cell = {};
  for (const t of p.transactions) if (t.type!=='in')
    cell[(t.tax_cat||'Uncategorized')+'|'+t.month] = (cell[(t.tax_cat||'Uncategorized')+'|'+t.month]||0) + t.amount;
  const catTotal = c => months.reduce((s,m)=>s+(cell[c+'|'+m]||0),0);
  cats.sort((a,b)=>catTotal(b)-catTotal(a));
  const revBy = {}; let revTot = 0;
  for (const t of p.transactions) if (t.type==='in'){ revBy[t.month]=(revBy[t.month]||0)+t.amount; revTot+=t.amount; }
  const money = n => n ? fmt$(n) : '—';
  const one = months.length === 1;
  const mCols = one ? '' : months.map(m=>`<th class="num">${moShort(m)}</th>`).join('');
  const rows = cats.map(c => `<tr><td>${esc(c)}</td>${one?'':months.map(m=>`<td class="num">${money(cell[c+'|'+m])}</td>`).join('')}<td class="num"><b>${fmt$(catTotal(c))}</b></td></tr>`).join('');
  const expBy = m => cats.reduce((s,c)=>s+(cell[c+'|'+m]||0),0);
  const expTot = cats.reduce((s,c)=>s+catTotal(c),0);
  return `<div class="tbl-wrap"><table class="pl-tbl">
    <thead><tr><th>Category</th>${mCols}<th class="num">Total</th></tr></thead><tbody>
    <tr class="hd-row" style="border-top:none"><td><b>Revenue</b></td>${one?'':months.map(m=>`<td class="num">${money(revBy[m])}</td>`).join('')}<td class="num"><b>${fmt$(revTot)}</b></td></tr>
    ${rows}
    <tr class="hd-row"><td><b>Total expenses</b></td>${one?'':months.map(m=>`<td class="num">${money(expBy(m))}</td>`).join('')}<td class="num"><b>${fmt$(expTot)}</b></td></tr>
    <tr class="hd-row"><td><b>Net</b></td>${one?'':months.map(m=>`<td class="num">${money((revBy[m]||0)-expBy(m))}</td>`).join('')}<td class="num"><b>${fmt$(revTot-expTot)}</b></td></tr>
    </tbody></table></div>`;
}
function contractorTableHTML(p){
  const rows = Object.entries(p.contractors).sort((a,b)=>b[1]-a[1]);
  return `<table class="kv">${rows.map(([k,v])=>`<tr><td>${esc(k)}${v>=600?' <span class="pill warn">1099 needed</span>':''}</td><td>${fmt$(v)}</td></tr>`).join('') || '<tr><td class="hint">None in range.</td><td></td></tr>'}</table>`;
}
function openQHTML(p, cap){
  if (!p.openQuestions.length) return '<div class="tiny">None — nothing flagged personal or uncategorized. ✓</div>';
  const items = cap ? p.openQuestions.slice(0, cap) : p.openQuestions;
  return `<table class="kv">${items.map(t=>`<tr><td>${esc(t.vendor)} <span class="tiny">${fmtDate(t.date)} · ${esc(t.tax_cat||'uncategorized')}</span></td><td>${fmt$(t.amount)}</td></tr>`).join('')}</table>
    ${cap && p.openQuestions.length>cap ? `<div class="tiny" style="margin-top:6px">…and ${p.openQuestions.length-cap} more in the PDF and CSV.</div>`:''}`;
}

function whatIf(name){
  const clients = (S.boot.clients||[]).filter(c=>c.active);
  const vendors = (S.boot.vendors||[]).filter(v=>v.recurring && v.active && v.cadence!=='yearly');
  const c = clients.find(x=>x.name===name); if (!c) return;
  const inflow = clients.reduce((s,x)=>s+clientMonthly(x),0) - clientMonthly(c);
  const out = vendors.reduce((s,v)=>s+(v.expected_amount||0),0) + inflow * S.boot.money.feePct/100;
  const el = $('#wiOut');
  el.className = 'msg'; el.innerHTML = `Without <b>${esc(name)}</b>: ${fmt$(inflow)} in, ${fmt$(out)} out → net <b style="color:${inflow-out>=0?'var(--good)':'var(--bad)'}">${fmt$(inflow-out)}</b> per month.`;
}

async function saveMoney(){
  const el = $('#sMsg');
  const split = {}; for (const k of ['personal','tax','ads','savings','other']) split[k] = +$('#sp_'+k).value;
  const sum = Object.values(split).reduce((s,v)=>s+v,0);
  try {
    await api('/api/settings', { method:'PUT', body: JSON.stringify({ money: { taxPct:+$('#sTax').value, distPct:+$('#sDist').value, feePct:+$('#sFee').value, split } }) });
    S.boot = await api('/api/boot');
    el.className='msg good'; el.textContent = 'Saved.' + (sum!==100 ? ` (heads up: the split adds to ${sum}%, not 100%)` : '');
  } catch(e){ el.className='msg bad'; el.textContent=e.message; }
}
async function saveClientField(name, field, value){
  const c = (S.boot.clients||[]).find(x=>x.name===name); if (!c) return;
  const body = { name, retainer: c.retainer||0, active: !!c.active, pct: c.pct };
  body[field] = field==='active' ? !!value : +value || (field==='retainer' ? 0 : null);
  body.billing = (body.pct||0) > 0 ? 'percent' : 'retainer'; // % set = variable client
  await api('/api/client', { method:'POST', body: JSON.stringify(body) });
  S.boot = await api('/api/boot'); renderSettings();
}
async function addTaxCat(){
  const el = $('#catMsg'); const cat = $('#newCat').value.trim();
  if (!cat) { el.className='msg bad'; el.textContent='Type a category name first.'; return; }
  try {
    await api('/api/settings', { method:'PUT', body: JSON.stringify({ taxCats: [...S.boot.taxCats, cat] }) });
    S.boot = await api('/api/boot'); renderSettings();
  } catch(e){ el.className='msg bad'; el.textContent=e.message; }
}
async function delTaxCat(cat){
  if (!confirm(`Remove "${cat}" from the list?\n\nTransactions and vendor rules already using it keep the name — this only takes it out of the pickers.`)) return;
  await api('/api/settings', { method:'PUT', body: JSON.stringify({ taxCats: S.boot.taxCats.filter(c=>c!==cat) }) });
  S.boot = await api('/api/boot'); renderSettings();
}
async function delClient(name){
  if (!confirm(`Delete ${name} from the client list?\n\nTheir transactions and history stay — this only stops the app expecting money from them.`)) return;
  await api('/api/client?name=' + encodeURIComponent(name), { method:'DELETE' });
  S.boot = await api('/api/boot'); renderSettings();
}

async function addVendor(){
  try {
    const rep = $('#vRep').value;
    await api('/api/vendor', { method:'POST', body: JSON.stringify({
      name: $('#vName').value.trim(), bucket: $('#tBucket').value, tax_cat: $('#tTax').value,
      recurring: rep !== 'off', cadence: rep === 'yearly' ? 'yearly' : 'monthly',
      renew_month: rep === 'yearly' ? +$('#vRen').value : null,
      expected_amount: +$('#vAmt').value||null }) });
    closeModal(); S.boot = await api('/api/boot'); renderSettings();
  } catch(e){ $('#vMsg').className='msg bad'; $('#vMsg').textContent=e.message; }
}
async function delVendor(name){
  if (!confirm(`Delete the rule for ${name}?\n\nExisting transactions keep their categories — but the next ${name} charge will land in Review again.`)) return;
  await api('/api/vendor?name=' + encodeURIComponent(name), { method:'DELETE' });
  S.boot = await api('/api/boot'); renderSettings();
}
async function saveVendorField(name, field, value){
  const v = (S.boot.vendors||[]).find(x=>x.name===name); if (!v) return;
  const body = { name, bucket:v.bucket, tax_cat:v.tax_cat, recurring:!!v.recurring,
    expected_amount:v.expected_amount, active:!!v.active,
    cadence:v.cadence||'monthly', renew_month:v.renew_month };
  if (field === 'repeats') {
    body.recurring = value !== 'off';
    body.cadence = value === 'yearly' ? 'yearly' : 'monthly';
    if (value === 'yearly' && !body.renew_month) body.renew_month = new Date().getMonth()+1;
  }
  else if (field === 'renew_month') body.renew_month = +value;
  else if (field === 'active') body.active = !!value;
  else if (field === 'expected_amount') body.expected_amount = +value;
  else body[field] = value;
  if (field==='bucket'||field==='tax_cat') body.applyToExisting = confirm('Apply this category to this vendor\'s existing transactions too?\n\nOK = yes, everything. Cancel = future transactions only.');
  await api('/api/vendor', { method:'POST', body: JSON.stringify(body) });
  S.boot = await api('/api/boot'); renderSettings();
}
async function stripeSyncNow(btn){
  const el = $('#ssMsg'); btn.disabled = true;
  el.className='msg'; el.textContent='Syncing…';
  try {
    const to = new Date().toISOString().slice(0,10);
    const from = new Date(Date.now()-60*86400e3).toISOString().slice(0,10);
    const r = await api('/api/stripe-sync', { method:'POST', body: JSON.stringify({ from, to }) });
    el.className='msg good';
    el.textContent = `Done — ${r.added} new transaction(s)` + (r.review?`, ${r.review} need a client picked in Review`:'') + (r.skippedClosed?`, ${r.skippedClosed} skipped (closed months)`:'') + '.';
    S.boot = await api('/api/boot'); S.txns = null;
  } catch(e){ el.className='msg bad'; el.textContent=e.message; }
  btn.disabled = false;
}
async function slackPollNow(btn){
  const el = $('#spMsg'); btn.disabled = true;
  el.className='msg'; el.textContent='Checking #receipts…';
  try {
    const r = await api('/api/slack-poll', { method:'POST', body: JSON.stringify({}) });
    el.className = r.error ? 'msg bad' : 'msg good';
    el.textContent = r.error ? r.error : `Done — ${r.handled||0} new file(s) handled.`;
    S.txns = null; S.boot = await api('/api/boot');
  } catch(e){ el.className='msg bad'; el.textContent=e.message; }
  btn.disabled = false;
}
function loadPlaidLink(){
  return new Promise((res, rej) => {
    if (window.Plaid) return res();
    const s = document.createElement('script');
    s.src = 'https://cdn.plaid.com/link/v2/stable/link-initialize.js';
    s.onload = res; s.onerror = () => rej(new Error('could not load Plaid Link'));
    document.head.appendChild(s);
  });
}
async function plaidConnect(btn){
  const el = $('#plMsg'); btn.disabled = true;
  el.className='msg'; el.textContent='Opening the bank picker…';
  try {
    await loadPlaidLink();
    const { link_token } = await api('/api/plaid-link-token', { method:'POST', body: JSON.stringify({}) });
    const handler = Plaid.create({
      token: link_token,
      onSuccess: async (public_token, meta) => {
        el.textContent = 'Linking…';
        try {
          const r = await api('/api/plaid-exchange', { method:'POST', body: JSON.stringify({ public_token, institution: meta.institution?.name }) });
          el.className='msg good'; el.textContent = `Connected ${r.name || 'account'} (${r.accounts} account${r.accounts>1?'s':''}) — syncing…`;
          await api('/api/plaid-sync', { method:'POST', body: JSON.stringify({}) });
          S.boot = await api('/api/boot'); S.txns = null; renderSettings();
        } catch(e){ el.className='msg bad'; el.textContent = e.message; }
      },
      onExit: (err) => { if (err) { el.className='msg bad'; el.textContent = err.display_message || err.error_message || 'Link closed.'; } else { el.textContent=''; } },
    });
    handler.open();
  } catch(e){ el.className='msg bad'; el.textContent = e.message; }
  btn.disabled = false;
}
async function plaidSyncNow(btn){
  const el = $('#plMsg'); btn.disabled = true;
  el.className='msg'; el.textContent='Syncing bank feeds…';
  try {
    const r = await api('/api/plaid-sync', { method:'POST', body: JSON.stringify({}) });
    const bits = Object.entries(r).filter(([k])=>k!=='ok').map(([k,v])=>`${v} ${k.replace(/-/g,' ')}`);
    el.className='msg good'; el.textContent = 'Done — ' + (bits.join(', ') || 'nothing new') + '.';
    S.boot = await api('/api/boot'); S.txns = null;
  } catch(e){ el.className='msg bad'; el.textContent=e.message; }
  btn.disabled = false;
}

  await api('/api/plaid-item?item_id=' + encodeURIComponent(itemId), { method:'DELETE' });

    el.className='msg good'; el.textContent='Password set.'; }

}
